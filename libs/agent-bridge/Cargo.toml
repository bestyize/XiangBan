[package]
name = "xiaoban-agent-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
autotests = false

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
rand = "0.8"
xiaoban-agent-hooks = { path = "../agent-hooks" }

[[bin]]
name = "fake-codex"
path = "tests/fake_codex/main.rs"

[[test]]
name = "bridge"
path = "tests/bridge.rs"

[[bin]]
name = "fake-claude"
path = "tests/fake_claude/main.rs"
