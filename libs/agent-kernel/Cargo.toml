[package]
name = "agent-kernel"
version = "0.1.0"
description = "Product-agnostic, lightweight agent harness kernel: loop, tools, middleware, OpenAI-compatible provider"
edition = "2021"
publish = false

[features]
default = []
openai = ["dep:reqwest"]
anthropic = ["dep:reqwest"]
native-tls = ["openai", "anthropic", "reqwest/native-tls-no-alpn"]
fs = []
skills = []
memory = []
web = ["dep:reqwest"]
shell = []
stdio = []
mcp = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking"], optional = true }

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = "stdio_agent"
required-features = ["native-tls", "stdio", "fs"]
