[package]
name = "agent-kernel"
version = "0.3.0"
description = "Product-agnostic, lightweight agent harness kernel: loop, tools, middleware, OpenAI-compatible provider"
edition = "2021"
publish = false

[features]
default = []
openai = ["dep:reqwest"]
anthropic = ["dep:reqwest"]
native-tls = ["openai", "anthropic", "reqwest/native-tls-no-alpn"]
fs = ["dep:encoding_rs"]
skills = ["dep:serde_yaml_ng"]
memory = []
web = ["dep:reqwest"]
shell = ["dep:libc"]
stdio = []
mcp = ["dep:base64"]
journal = []
process = ["dep:libc", "dep:windows-sys"]
# The Windows low-integrity launcher for sandboxed commands (see `sandbox`).
sandbox = ["dep:windows-sys"]

[dependencies]
encoding_rs = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { version = "0.10.0", optional = true }
jsonschema = { version = "0.33", default-features = false }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "socks"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[[example]]
name = "stdio_agent"
required-features = ["native-tls", "stdio", "fs"]

[[test]]
name = "os_sandbox"
harness = false
required-features = ["shell", "sandbox"]
