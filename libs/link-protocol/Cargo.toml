[package]
name = "xiaoban-link-protocol"
version = "0.1.0"
edition = "2021"
description = "小伴手机与桌面互联的协议参考实现：配对、密钥派生、端到端加密信封、重放防护。不含网络与界面"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
