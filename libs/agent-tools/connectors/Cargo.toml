[package]
name = "agent-connector-tools"
version = "0.1.0"
edition = "2021"
description = "User-configured MCP connections for desktop Agents"

[dependencies]
agent-kernel = { path = "../../agent-kernel", features = ["mcp", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
