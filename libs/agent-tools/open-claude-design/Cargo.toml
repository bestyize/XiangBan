[package]
name = "open-claude-design"
version = "0.1.0"
edition = "2021"
publish = false
description = "Built-in multi-artboard DC HTML design projects for agent-kernel hosts"

[dependencies]
agent-kernel = { path = "../../agent-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

regex = "1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
