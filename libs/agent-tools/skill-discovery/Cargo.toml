[package]
name = "agent-skill-discovery"
version = "0.1.0"
edition = "2021"
description = "Conservative SkillHub discovery and reviewed installation"

[dependencies]
agent-kernel = { path = "../../agent-kernel" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls-no-alpn"] }
serde_json = "1"
sha2 = "0.10"

zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
