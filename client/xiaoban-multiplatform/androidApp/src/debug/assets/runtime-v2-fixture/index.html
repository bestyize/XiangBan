<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>协议 2 宿主测试</title>
<script>
// This first parser-executed script records whether injection preceded page scripts.
window.fixture = { documentStartXb: typeof window.xb === 'object', secure: isSecureContext, origin: location.origin, expectedOrigin: 'https://local-runtime-v2-fixture.app.xiangban.xyz', originMatches: location.origin === 'https://local-runtime-v2-fixture.app.xiangban.xyz', events: [], storage: {}, history: location.hash || 'home' };
</script>
<style>
:root { color-scheme: light; font: 16px system-ui, sans-serif; color: #173b33; background: #f3f7f4; }
body { margin: 0; padding: calc(var(--xb-safe-top, 0px) + 76px) 20px calc(var(--xb-safe-bottom, 0px) + 24px); }
main { max-width: 620px; margin: auto; } h1 { font-size: 24px; } p { line-height: 1.5; } section { margin: 16px 0; padding: 16px; background: white; border-radius: 14px; } h2 { margin: 0 0 10px; font-size: 18px; } button { margin: 4px; padding: 10px 14px; border: 0; border-radius: 8px; background: #216b55; color: white; font: inherit; } pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
</style></head><body><main>
<h1>协议 2 宿主测试</h1><p>此页面用于检查宿主注入、存储、生命周期和返回行为。</p>
<section><h2>环境与事件</h2><pre id="environment"></pre></section>
<section><h2>持久存储</h2><p>写入后关闭并重新打开，可读取验证持久性。</p><button id="set">写入</button><button id="get">读取</button><button id="keys">列出键</button><button id="remove">删除</button><button id="large">4 MiB 往返</button><pre id="storage"></pre></section>
<section><h2>摄像头与麦克风</h2><p>授权后保持媒体流，直到点击停止。</p><button id="camera">摄像头</button><button id="microphone">麦克风</button><button id="stop-media">停止媒体</button><pre id="media-status"></pre></section>
<section><h2>网络探测</h2><p>自定义地址用于测试可访问的公网、设备局域网和本机地址。</p><input id="network-url" aria-label="测试地址" value="https://example.com/" style="max-width:100%;box-sizing:border-box;padding:10px;font:inherit"><br><button id="public-fetch">公网 HTTPS</button><button id="public-wss">公网 WSS</button><button id="custom-fetch">自定义 Fetch</button><button id="custom-wss">自定义 WebSocket</button><pre id="network-status"></pre></section>
<section><h2>返回历史</h2><p>点击后按系统返回，应从二级回到一级，再回到首页。</p><button id="history">创建两级历史</button><pre id="history-status"></pre></section>
</main><script>
(() => {
  const state = window.fixture;
  const key = 'fixture-persistence';
  const value = { marker: 'runtime-v2-fixture', version: 2 };
  function render() {
    document.getElementById('environment').textContent = JSON.stringify({ documentStartXb: state.documentStartXb, secure: state.secure, origin: state.origin, expectedOrigin: state.expectedOrigin, originMatches: state.originMatches, info: window.xb?.info ?? null, events: state.events, css: Object.fromEntries(['safe-top','safe-right','safe-bottom','safe-left','capsule-top','capsule-right','capsule-width','capsule-height'].map(k => [k, getComputedStyle(document.documentElement).getPropertyValue('--xb-' + k).trim()])) }, null, 2);
    document.getElementById('storage').textContent = JSON.stringify(state.storage, null, 2);
    document.getElementById('history-status').textContent = state.history;
    document.getElementById('media-status').textContent = JSON.stringify(state.media ?? {}, null, 2);
    document.getElementById('network-status').textContent = JSON.stringify(state.network ?? {}, null, 2);
    document.documentElement.dataset.fixture = JSON.stringify(state);
  }
  for (const name of ['set', 'get', 'keys', 'remove']) document.getElementById(name).addEventListener('click', async () => {
    try {
      const result = name === 'set' ? await xb.storage.set(key, value) : name === 'get' ? await xb.storage.get(key) : name === 'keys' ? await xb.storage.keys() : await xb.storage.remove(key);
      state.storage = { operation: name, ok: true, result: result ?? null };
    } catch (error) { state.storage = { operation: name, ok: false, error: String(error), code: error?.code ?? null }; }
    render();
  });
  document.getElementById('large').addEventListener('click', async () => {
    const largeKey = 'fixture-large';
    const payload = 'x'.repeat(4 * 1024 * 1024);
    try {
      await xb.storage.set(largeKey, payload);
      const result = await xb.storage.get(largeKey);
      state.storage = { operation: 'large', ok: result === payload, bytes: payload.length };
      await xb.storage.remove(largeKey);
    } catch (error) { state.storage = { operation: 'large', ok: false, error: String(error), code: error?.code ?? null }; }
    render();
  });
  let mediaStream = null;
  function stopMedia() {
    if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }
  for (const kind of ['camera', 'microphone']) document.getElementById(kind).addEventListener('click', async () => {
    stopMedia();
    state.media = { operation: kind, status: 'pending' }; render();
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ video: kind === 'camera', audio: kind === 'microphone' });
      state.media = { operation: kind, status: 'active', tracks: mediaStream.getTracks().map(track => ({ kind: track.kind, readyState: track.readyState })) };
    } catch (error) { state.media = { operation: kind, status: 'error', error: String(error), name: error?.name ?? null }; }
    render();
  });
  document.getElementById('stop-media').addEventListener('click', () => {
    stopMedia(); state.media = { operation: 'stop', status: 'stopped' }; render();
  });
  let networkSequence = 0;
  async function probeNetwork(kind, url) {
    const sequence = ++networkSequence;
    state.network = { kind, url, status: 'pending' }; render();
    try {
      if (kind === 'fetch') {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch(url, { mode: 'no-cors', signal: controller.signal });
          if (sequence === networkSequence) state.network = { kind, url, status: 'success', responseType: response.type, httpStatus: response.status };
        } finally { clearTimeout(timeout); }
      } else {
        await new Promise((resolve, reject) => {
          let socket;
          const timeout = setTimeout(() => { if (socket) socket.close(); reject(new Error('timeout')); }, 8000);
          try { socket = new WebSocket(url); } catch (error) { clearTimeout(timeout); reject(error); return; }
          socket.onopen = () => { clearTimeout(timeout); socket.close(); resolve(); };
          socket.onerror = () => { clearTimeout(timeout); socket.close(); reject(new Error('WebSocket error')); };
          socket.onclose = () => { clearTimeout(timeout); reject(new Error('WebSocket closed before opening')); };
        });
        if (sequence === networkSequence) state.network = { kind, url, status: 'success' };
      }
    } catch (error) { if (sequence === networkSequence) state.network = { kind, url, status: 'error', error: String(error), name: error?.name ?? null }; }
    render();
  }
  document.getElementById('public-fetch').addEventListener('click', () => probeNetwork('fetch', 'https://example.com/'));
  document.getElementById('public-wss').addEventListener('click', () => probeNetwork('websocket', 'wss://ws.postman-echo.com/raw'));
  document.getElementById('custom-fetch').addEventListener('click', () => probeNetwork('fetch', document.getElementById('network-url').value));
  document.getElementById('custom-wss').addEventListener('click', () => probeNetwork('websocket', document.getElementById('network-url').value));
  addEventListener('pagehide', stopMedia);
  document.getElementById('history').addEventListener('click', () => {
    history.pushState({}, '', '#one'); history.pushState({}, '', '#two'); state.history = location.hash; render();
  });
  addEventListener('popstate', () => { state.history = location.hash || 'home'; render(); });
  if (window.xb) {
    for (const event of ['show', 'hide', 'safearea']) xb.on(event, () => { state.events.push(event); render(); });
    xb.ready();
  }
  render();
})();
</script></body></html>
