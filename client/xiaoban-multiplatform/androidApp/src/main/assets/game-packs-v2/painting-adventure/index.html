      ctx.restore();
    }

    // 水管
    for (const p of pipes) {
      const x = p.col * TILE - camX;
      if (x < -TILE * 3 || x > vw + TILE * 2) continue;
      const y = p.topRow * TILE, w = TILE * 2, h = p.heightRows * TILE;
      ctx.save();
      ctx.fillStyle = pal.pipe; ctx.fillRect(x + 4, y + 22, w - 8, h - 22);
      ctx.fillStyle = pal.pHi; ctx.globalAlpha = 0.42; ctx.fillRect(x + 11, y + 22, 10, h - 22); ctx.globalAlpha = 1;
      ctx.strokeStyle = pal.pLine; ctx.lineWidth = 2.2; ctx.strokeRect(x + 4, y + 22, w - 8, h - 22);
      ctx.fillStyle = pal.pipe; ctx.fillRect(x, y, w, 24); ctx.strokeRect(x, y, w, 24);
      ctx.restore();
    }

    // 炮台
    for (const cn of cannons) {
      const x = cn.col * TILE - camX;
      if (x < -50 || x > vw + 50) continue;
      const y = cn.topRow * TILE, h = cn.heightRows * TILE;
      ctx.save(); ctx.fillStyle = '#18181b'; ctx.strokeStyle = pal.out; ctx.lineWidth = 2.2;
      ctx.fillRect(x + 3, y + 24, TILE - 6, h - 24); ctx.strokeRect(x + 3, y + 24, TILE - 6, h - 24);
      ctx.fillRect(x, y, TILE, 26); ctx.strokeRect(x, y, TILE, 26);
      ctx.fillStyle = '#facc15'; ctx.beginPath(); ctx.arc(x + 18, y + 13, 6.2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 移动浮台
    for (const pl of platforms) {
      if (pl.x + pl.w - camX < -20 || pl.x - camX > vw + 20) continue;
      ctx.save(); ctx.fillStyle = pal.plat; ctx.strokeStyle = pal.out; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.roundRect(pl.x - camX, pl.y, pl.w, pl.h, 5); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // 塌陷云桥
    for (const cr of crumbles) {
      if (cr.state === 'gone' || cr.x - camX < -50 || cr.x - camX > vw + 50) continue;
      const jx = cr.state === 'shake' ? Math.sin(t * 58) * 3 : 0;
      const x = cr.x - camX + jx;
      ctx.save(); ctx.fillStyle = pal.q; ctx.strokeStyle = pal.bLine; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.roundRect(x + 1, cr.y, cr.w - 2, cr.h, 4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 10, cr.y + 2); ctx.lineTo(x + 16, cr.y + 10); ctx.lineTo(x + 22, cr.y + 16); ctx.stroke();
      ctx.restore();
    }

    // 弹簧跳板
    for (const sp of springs) {
      if (sp.x - camX < -40 || sp.x - camX > vw + 40) continue;
      const x = sp.x - camX, topY = sp.y + sp.compress * 12, botY = sp.y + sp.h;
      ctx.save(); ctx.strokeStyle = pal.out; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + 6, botY - 4); ctx.lineTo(x + sp.w - 6, lerp(botY - 4, topY + 6, 0.35));
      ctx.lineTo(x + 6, lerp(botY - 4, topY + 6, 0.7)); ctx.lineTo(x + sp.w - 6, topY + 6); ctx.stroke();
      ctx.fillStyle = pal.hat; ctx.beginPath(); ctx.roundRect(x - 1, topY, sp.w + 2, 8, 3); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // 旋转火棒
    for (const fb of firebars) {
      if (fb.cx - camX < -140 || fb.cx - camX > vw + 140) continue;
      ctx.save(); applyGlow(ctx, '#f97316', 9);
      for (let k = 1; k <= fb.count; k++) {
        const fx = fb.cx - camX + Math.cos(fb.angle) * (k * fb.radiusStep);
        const fy = fb.cy + Math.sin(fb.angle) * (k * fb.radiusStep);
        ctx.fillStyle = (k + Math.floor(t * 14)) % 2 === 0 ? '#ef4444' : '#f97316';
        ctx.beginPath(); ctx.arc(fx, fy, 7.8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(fx, fy, 3.8, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // 普通关旗杆与城堡
    if (flagpole && flagpole.x - camX > -240 && flagpole.x - camX < vw + 260) {
      const fx = flagpole.x - camX;
      ctx.save();
      ctx.strokeStyle = pal.pHi; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(fx, flagpole.topY); ctx.lineTo(fx, flagpole.botY); ctx.stroke();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(fx, flagpole.topY, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pal.hat; ctx.strokeStyle = pal.out; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(fx - 2, flagpole.flagY); ctx.lineTo(fx - 42, flagpole.flagY + 13); ctx.lineTo(fx - 2, flagpole.flagY + 26); ctx.closePath(); ctx.fill(); ctx.stroke();
      const cx = castle.x - camX, cy = castle.y;
      ctx.fillStyle = pal.stone; ctx.strokeStyle = pal.out; ctx.lineWidth = 2.2;
      ctx.fillRect(cx, cy - 120, 128, 120); ctx.strokeRect(cx, cy - 120, 128, 120);
      ctx.fillRect(cx + 26, cy - 166, 76, 46); ctx.strokeRect(cx + 26, cy - 166, 76, 46);
      ctx.fillStyle = '#090b12'; ctx.beginPath(); ctx.arc(cx + 64, cy - 36, 20, Math.PI, 0); ctx.lineTo(cx + 84, cy); ctx.lineTo(cx + 44, cy); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // Boss 关魔王、战斧与终点王冠
    if (isBossStage) {
      if (boss && boss.y < VH + 120) {
        const x = boss.x - camX, y = boss.y;
        ctx.save();
        applyGlow(ctx, boss.hurtFlash > 0 ? '#ffffff' : boss.color, 12);
        ctx.fillStyle = boss.hurtFlash > 0 ? '#ffffff' : boss.color; ctx.strokeStyle = '#11111b'; ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.ellipse(x + 34, y + 36, 24, 24, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.roundRect(x + 8, y + 22, 30, 36, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = boss.color; ctx.fillRect(x + 8, y + 54, 14, 10); ctx.fillRect(x + 30, y + 54, 14, 10);
        ctx.beginPath(); ctx.roundRect(x - 4, y + 6, 30, 24, 8); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(x + 22, y + 8, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.moveTo(x + 12, y + 6); ctx.lineTo(x + 18, y - 8); ctx.lineTo(x + 22, y + 6); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#11111b'; ctx.beginPath(); ctx.arc(x + 6, y + 14, 3.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      for (const bf of bossFires) {
        ctx.save(); applyGlow(ctx, '#f43f5e', 10);
        ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.roundRect(bf.x - camX, bf.y, bf.w, bf.h, 7); ctx.fill();
        ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.ellipse(bf.x - camX + 14, bf.y + 7, 8, 3.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      if (axe && axe.active) {
        const x = axe.x - camX, y = axe.y + Math.sin(t * 7) * 3;
        ctx.save(); applyGlow(ctx, '#fde047', 14);
        ctx.strokeStyle = '#d97706'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(x + 13, y + 32); ctx.lineTo(x + 13, y + 4); ctx.stroke();
        ctx.fillStyle = '#fde047'; ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + 13, y + 6); ctx.lineTo(x + 2, y + 2); ctx.lineTo(x + 2, y + 18); ctx.lineTo(x + 13, y + 14); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fef08a'; ctx.font = 'bold 10px ui-monospace, monospace'; ctx.fillText('AXE!', x, y - 6);
        ctx.restore();
      }
      const tx = trophyX - camX;
      if (tx > -80 && tx < vw + 80) {
        const ty = 11 * TILE + Math.sin(t * 4) * 5;
        ctx.save(); applyGlow(ctx, '#facc15', 16);
        ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(tx - 22, ty + 18); ctx.lineTo(tx - 26, ty - 8); ctx.lineTo(tx - 9, ty + 4); ctx.lineTo(tx, ty - 14);
        ctx.lineTo(tx + 9, ty + 4); ctx.lineTo(tx + 26, ty - 8); ctx.lineTo(tx + 22, ty + 18); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`🏆 W${state.worldIdx + 1} 艺术王冠`, tx, ty - 22);
        ctx.restore();
      }
    }

    // 金币
    for (const c of coins) {
      if (c.taken || c.x - camX < -30 || c.x - camX > vw + 30) continue;
      const rx = Math.max(2.5, Math.abs(Math.cos(t * 5.2 + c.x * 0.03)) * 10);
      ctx.save(); ctx.fillStyle = pal.coin; ctx.strokeStyle = pal.out; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.ellipse(c.x - camX, c.y + Math.sin(t * 5 + c.x * 0.05) * 3, rx, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // 道具
    for (const it of items) {
      const x = it.x - camX, y = it.y;
      ctx.save(); ctx.strokeStyle = pal.out; ctx.lineWidth = 2;
      if (it.type === 'star') {
        ctx.translate(x + 14, y + 14); ctx.rotate(Math.sin(t * 8) * 0.25);
        ctx.fillStyle = ['#fde047', '#38bdf8', '#f472b6', '#4ade80'][Math.floor(t * 14) % 4];
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2 - Math.PI * 0.5, r = i % 2 === 0 ? 14 : 6;
          i === 0 ? ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (it.type === 'flower') {
        ctx.fillStyle = '#22c55e'; ctx.fillRect(x + 11, y + 14, 6, 14); ctx.strokeRect(x + 11, y + 14, 6, 14);
        ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.ellipse(x + 14, y + 10, 12, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.ellipse(x + 14, y + 10, 7, 4.8, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = pal.skin; ctx.fillRect(x + 6, y + 14, 16, 14); ctx.strokeRect(x + 6, y + 14, 16, 14);
        ctx.fillStyle = pal.hat; ctx.beginPath(); ctx.arc(x + 14, y + 15, 14, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + 14, y + 8, 3.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // 炮弹 & 火球
    for (const b of bullets) {
      ctx.save(); ctx.translate(b.x - camX + 14, b.y + 11); ctx.scale(Math.sign(b.vx), 1);
      ctx.fillStyle = '#18181b'; ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(-14, -10, 22, 20, [3, 10, 10, 3]); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(4, -2, 3.6, 2.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (const fb of fireballs) {
      ctx.save(); applyGlow(ctx, '#f97316', 9);
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(fb.x - camX, fb.y, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fef08a'; ctx.beginPath(); ctx.arc(fb.x - camX + 1, fb.y - 1, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 普通敌人
    for (const e of enemies) {
      if (e.x - camX < -60 || e.x - camX > vw + 60) continue;
      const x = e.x - camX, y = e.y, w = e.w, h = e.h;
      ctx.save(); ctx.strokeStyle = pal.out; ctx.lineWidth = 2;
      if (e.type === 'goomba') {
        if (e.state === 'squished') { ctx.fillStyle = pal.gmb; ctx.fillRect(x - 2, y + h - 10, w + 4, 10); ctx.strokeRect(x - 2, y + h - 10, w + 4, 10); }
        else {
          const stp = Math.sin(e.anim) * 3;
          ctx.fillStyle = pal.hair; ctx.beginPath(); ctx.ellipse(x + 8 + stp, y + h - 4, 6, 4.5, 0, 0, Math.PI * 2); ctx.ellipse(x + w - 8 - stp, y + h - 4, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = pal.gmb; ctx.beginPath(); ctx.moveTo(x + 2, y + h - 7); ctx.quadraticCurveTo(x + 14, y - 6, x + w - 2, y + h - 7); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x + 10, y + 13, 3, 4, 0, 0, Math.PI * 2); ctx.ellipse(x + 18, y + 13, 3, 4, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = pal.out; ctx.fillRect(x + 9, y + 12, 2.5, 3.5); ctx.fillRect(x + 16.5, y + 12, 2.5, 3.5);
        }
      } else {
        if (e.state === 'shell' || e.state === 'slide') {
          ctx.fillStyle = pal.kSh; ctx.beginPath(); ctx.ellipse(x + 14, y + h * 0.55, 14, h * 0.48, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
          const d = e.facing, stp = Math.sin(e.anim) * 3.5;
          ctx.fillStyle = pal.kBd; ctx.fillRect(x + 6 + stp, y + h - 7, 7, 7); ctx.fillRect(x + 15 - stp, y + h - 7, 7, 7);
          ctx.fillStyle = e.type === 'paratroopa' ? '#dc2626' : pal.kSh;
          ctx.beginPath(); ctx.ellipse(x + 14 - d * 3, y + h - 16, 11, 13, d * 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = pal.kBd; ctx.beginPath(); ctx.arc(x + 14 + d * 10, y + 10, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          if (e.type === 'paratroopa') {
            ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x + 14 - d * 8, y + 10 - Math.sin(t * 18) * 3, 9, 5, -d * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    // 主角马里奥
    drawPlayerStyled(ctx, player, camX, pal);

    // 粒子与得分浮字
    for (const pt of particles) {
      ctx.save(); ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1); ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - camX - pt.size * 0.5, pt.y - pt.size * 0.5, pt.size, pt.size); ctx.restore();
    }
    ctx.save(); ctx.font = 'bold 13px ui-monospace, sans-serif'; ctx.textAlign = 'center';
    for (const pop of popups) {
      ctx.globalAlpha = clamp(pop.life / pop.maxLife, 0, 1);
      ctx.fillStyle = '#000'; ctx.fillText(pop.text, pop.x - camX + 1, pop.y + 1);
      ctx.fillStyle = pop.color; ctx.fillText(pop.text, pop.x - camX, pop.y);
    }
    ctx.restore();
  }

  function drawPlayerStyled(ctx, p, camX, pal) {
    if (p.invuln > 0 && p.starTimer <= 0 && Math.floor(state.time * 18) % 2 === 0 && !state.compareMode) return;
    const cx = p.x - camX + p.w * 0.5, footY = p.y + p.h, sc = p.power > 0 ? 1.24 : 0.96;

    if (pal.shadow) {
      ctx.save(); ctx.strokeStyle = 'rgba(38,17,5,0.42)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(cx, footY - 28 * sc); ctx.lineTo(cx + 14, VH); ctx.stroke(); ctx.restore();
    }

    ctx.save();
    ctx.translate(cx, footY); ctx.scale(p.facing * sc, sc);
    const sp = ['#fde047', '#38bdf8', '#f472b6', '#4ade80'];
    const sCol = sp[Math.floor(state.time * 22) % 4];
    if (p.starTimer > 0) applyGlow(ctx, sCol, 15);
    else if (pal.glow) applyGlow(ctx, pal.glow, 10);
    if (pal.halo) { ctx.strokeStyle = pal.halo; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -29, 15, 0, Math.PI * 2); ctx.stroke(); }

    const hatCol = p.starTimer > 0 ? sCol : (p.power === 2 ? '#ffffff' : pal.hat);
    const shirtCol = p.starTimer > 0 ? '#ffffff' : (p.power === 2 ? '#fef08a' : pal.shirt);
    const ovCol = p.starTimer > 0 ? sp[(Math.floor(state.time * 22) + 2) % 4] : (p.power === 2 ? '#ef4444' : pal.ov);

    const runS = p.onGround ? Math.sin(p.anim * 1.4) * 7 : 6;
    const armS = p.onGround ? -runS : -11;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = pal.out; ctx.lineWidth = 2.0;

    ctx.fillStyle = shirtCol; ctx.beginPath(); ctx.ellipse(-5 + armS * 0.4, -18, 4, 6, 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ovCol; ctx.fillRect(-7 + runS * 0.55, -12, 6, 9); ctx.fillRect(1 - runS * 0.55, -12, 6, 9);
    ctx.fillStyle = pal.hair; ctx.beginPath(); ctx.roundRect(-8 + runS * 0.55, -5, 9, 5, 2); ctx.roundRect(0 - runS * 0.55, -5, 9, 5, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = shirtCol; ctx.beginPath(); ctx.roundRect(-9, -23, 18, 13, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = ovCol; ctx.beginPath(); ctx.roundRect(-8, -18, 16, 10, 3); ctx.fill(); ctx.stroke();
    ctx.fillRect(-6, -22, 3, 6); ctx.fillRect(3, -22, 3, 6);
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(-4.5, -16, 1.5, 0, Math.PI * 2); ctx.arc(4.5, -16, 1.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = shirtCol; ctx.beginPath();
    if (!p.onGround && p.vy < 40) {
      ctx.ellipse(7, -27, 4.2, 6.5, -0.35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(9, -32, 3.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      ctx.ellipse(5 - armS * 0.4, -17, 4, 6, -0.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(6 - armS * 0.5, -12, 3.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.arc(1, -29, 8.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = pal.hair; ctx.fillRect(-7, -32, 5, 6);
    ctx.fillStyle = pal.skin; ctx.beginPath(); ctx.ellipse(9, -28, 3.6, 2.8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = pal.hair; ctx.beginPath(); ctx.roundRect(2, -26, 9, 3.2, 1.5); ctx.fill();
    ctx.fillStyle = pal.out; ctx.beginPath(); ctx.ellipse(5, -30.5, 1.3, 2.2, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = hatCol; ctx.beginPath();
    ctx.arc(0, -33, 8.8, Math.PI, 0); ctx.lineTo(13, -33); ctx.lineTo(13, -31); ctx.lineTo(-9, -31); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.power === 2 ? '#ef4444' : '#ffffff'; ctx.beginPath(); ctx.arc(4, -35.5, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* =========================================================================
     七、实体画框裁剪管线、透视层与四画风定格对比
     ========================================================================= */
  function drawPhysicalFrame(ctx, fxScreen, nextStyleId) {
    const topY = 44, botY = 13 * TILE + 8;
    const st = STYLES[nextStyleId];
    ctx.save();
    if (state.frameFlash > 0.02) {
      ctx.fillStyle = `rgba(254, 240, 138, ${state.frameFlash * 0.25})`;
      ctx.fillRect(fxScreen - 24, topY, 48, botY - topY);
    }
    ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(fxScreen - 10, topY - 4, 20, botY - topY + 8);
    const grad = ctx.createLinearGradient(fxScreen - 7, 0, fxScreen + 7, 0);
    grad.addColorStop(0, '#5c3618'); grad.addColorStop(0.32, '#d4a238');
    grad.addColorStop(0.55, '#fef08a'); grad.addColorStop(0.84, '#9c6821'); grad.addColorStop(1, '#3b210d');
    ctx.fillStyle = grad; ctx.fillRect(fxScreen - 7, topY, 14, botY - topY);
    ctx.fillRect(fxScreen - 16, topY - 12, 32, 16); ctx.fillRect(fxScreen - 16, botY - 6, 32, 14);
    ctx.strokeStyle = 'rgba(255,248,200,0.78)'; ctx.lineWidth = 1.4; ctx.strokeRect(fxScreen - 5, topY + 2, 10, botY - topY - 4);

    ctx.fillStyle = 'rgba(12, 15, 24, 0.92)';
    ctx.beginPath(); ctx.roundRect(fxScreen - 66, topY - 36, 132, 22, 999); ctx.fill();
    ctx.strokeStyle = st.accent; ctx.lineWidth = 1.3; ctx.stroke();
    ctx.fillStyle = '#fef08a'; ctx.font = 'bold 11px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`→ ${st.num} ${st.name}`, fxScreen, topY - 25);
    ctx.restore();
  }

  function drawHitboxOverlay(ctx, camX, vw) {
    ctx.save();
    ctx.fillStyle = 'rgba(6, 10, 18, 0.34)'; ctx.fillRect(0, 0, vw, VH);
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.strokeRect(player.x - camX, player.y, player.w, player.h);
    ctx.strokeStyle = '#fb7185';
    for (const e of enemies) if (e.x - camX > -40 && e.x - camX < vw + 40) ctx.strokeRect(e.x - camX, e.y, e.w, e.h);
    if (boss && boss.alive) ctx.strokeRect(boss.x - camX, boss.y, boss.w, boss.h);
    ctx.strokeStyle = '#fde047';
    for (const pl of platforms) ctx.strokeRect(pl.x - camX, pl.y, pl.w, pl.h);
    ctx.restore();
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const backgroundPatterns = Object.fromEntries(Object.entries({
    sahara: bakeTexturedBase(TEXTURES.paper, [[0, '#d8af78'], [0.7, '#c2894e'], [1, '#8c5328']]),
    stone: bakeTexturedBase(TEXTURES.chisel, '#242b33'),
    ink: bakeTexturedBase(TEXTURES.paper, [[0, '#f2ecdc'], [0.75, '#e5dcc5'], [1, '#d6cbb0']]),
    manuscript: bakeTexturedBase(TEXTURES.paper, '#f2e5c6'),
    codex: bakeTexturedBase(TEXTURES.hatch, '#ead8b1'),
    dots: TEXTURES.dots,
    scanline: TEXTURES.scanline
  }).map(([name, texture]) => [name, ctx.createPattern(texture, 'repeat')]));
  const mobilePixelBudget = 400_000;
  const mobileFrameInterval = 1000 / 60;
  const mobileScales = [1, 0.85, 0.72];
  const mobileRendering = host?.info?.platform === 'android' || matchMedia('(any-pointer: coarse)').matches;
  const appShell = document.getElementById('app-shell');
  const frameWrap = document.getElementById('canvas-frame');
  let viewW = 960, viewH = 540, dpr = 1, logicalW = 960;
  let renderScale = 1, renderOffsetY = 0, renderBoxH = 540;
  let needsRender = true;
  let rasterLevel = 0;
  let lastPaintAt = 0;
  let measuredPaints = 0;
  let latePaints = 0;

  function recordMobilePaint(now) {
    const interval = now - lastPaintAt;
    if (lastPaintAt > 0 && rasterLevel < mobileScales.length - 1) {
      if (interval > 24) latePaints++;
      if (++measuredPaints === 36) {
        if (latePaints >= 6) {
          rasterLevel++;
          resize();
        }
        measuredPaints = latePaints = 0;
      }
    }
    lastPaintAt = now;
  }

  function resize() {
    const width = frameWrap.clientWidth;
    const height = frameWrap.clientHeight;
    if (!width || !height) return;

    viewW = width;
    viewH = height;
    const ratio = window.devicePixelRatio || 1;
    dpr = mobileRendering
      ? Math.min(ratio, Math.sqrt(mobilePixelBudget / (width * height)), 1) * mobileScales[rasterLevel]
      : Math.min(ratio, 2);
    const pixelWidth = Math.round(viewW * dpr);
    const pixelHeight = Math.round(viewH * dpr);
    if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
    if (canvas.height !== pixelHeight) canvas.height = pixelHeight;

    // 严格等比缩放：杜绝手机竖屏画面纵向拉伸，并保证竖屏至少 480px（约 13.3 格）横向视野
    const minLogicalW = 480;
    const rawLogicalW = VH * (viewW / viewH);
    if (rawLogicalW >= minLogicalW) {
      logicalW = Math.round(rawLogicalW);
      renderScale = viewH / VH;
      renderBoxH = viewH;
      renderOffsetY = 0;
    } else {
      logicalW = minLogicalW;
      renderScale = viewW / logicalW;
      renderBoxH = VH * renderScale;
      renderOffsetY = Math.round((viewH - renderBoxH) * 0.5);
    }
    needsRender = true;
    avoidHostCapsule();
  }
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(frameWrap);

  function renderMainGame() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (renderOffsetY > 0) {
      // 竖屏模式：上下铺设深邃画廊哑光衬边，保持 1:1 完美纵横比
      ctx.fillStyle = '#070a14';
      ctx.fillRect(0, 0, viewW, viewH);
    }

    ctx.save();
    if (renderOffsetY > 0) {
      ctx.beginPath();
      ctx.rect(0, renderOffsetY, viewW, renderBoxH);
      ctx.clip();
    }
    ctx.setTransform(dpr * renderScale, 0, 0, dpr * renderScale, 0, dpr * renderOffsetY);

    const visibleFrames = [];
    for (let i = 0; i < frameXs.length; i++) {
      const fxScreen = frameXs[i] - state.camX;
      if (fxScreen > -24 && fxScreen < logicalW + 24) {
        visibleFrames.push({ fxScreen, rightStyleId: stageStyles[i + 1] });
      }
    }

    const strips = [];
    let curLeft = 0;
    let curStyleId = stageStyles[0];
    for (let i = 0; i < frameXs.length; i++) if (state.camX >= frameXs[i]) curStyleId = stageStyles[i + 1];
    for (const vf of visibleFrames) {
      const cutX = clamp(vf.fxScreen, 0, logicalW);
      if (cutX > curLeft) strips.push({ x0: curLeft, x1: cutX, styleId: curStyleId });
      curLeft = cutX; curStyleId = vf.rightStyleId;
    }
    if (curLeft < logicalW) strips.push({ x0: curLeft, x1: logicalW, styleId: curStyleId });

    for (const st of strips) {
      ctx.save(); ctx.beginPath(); ctx.rect(st.x0, 0, st.x1 - st.x0, VH); ctx.clip();
      renderWorldInStyle(ctx, st.styleId, state.camX, logicalW, st.x0, st.x1);
      ctx.restore();
    }
    for (const vf of visibleFrames) drawPhysicalFrame(ctx, vf.fxScreen, vf.rightStyleId);
    if (state.showHitbox) drawHitboxOverlay(ctx, state.camX, logicalW);
    ctx.restore();

    // 竖屏掌机画框装裱金线与底部画作铭牌
    if (renderOffsetY > 14) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.strokeStyle = 'rgba(250, 204, 21, 0.48)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, renderOffsetY); ctx.lineTo(viewW, renderOffsetY);
      ctx.moveTo(0, renderOffsetY + renderBoxH); ctx.lineTo(viewW, renderOffsetY + renderBoxH);
      ctx.stroke();

      const w = WORLDS[state.worldIdx];
      const st = STYLES[getActiveStyleId()];
      ctx.fillStyle = 'rgba(203, 213, 225, 0.72)';
      ctx.font = '600 11px ui-monospace, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`WORLD ${w.num}-${state.stageIdx + 1} · ${w.name}`, viewW * 0.5, renderOffsetY * 0.5);
      ctx.fillStyle = 'rgba(253, 224, 71, 0.78)';
      ctx.fillText(`🖼 ${st.num} ${st.name} · ${st.en}`, viewW * 0.5, renderOffsetY + renderBoxH + renderOffsetY * 0.5);
    }
  }

  function renderCompareMode() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#060810'; ctx.fillRect(0, 0, viewW, viewH);
    const top = Math.min(viewH * 0.45, compareBanner.offsetTop + compareBanner.offsetHeight + 6);
    const cw = viewW * 0.5, ch = (viewH - top) * 0.5;
    const minSubW = 360;
    const rawSubW = VH * (cw / ch);
    const subLogicalW = rawSubW >= minSubW ? Math.round(rawSubW) : minSubW;
    const subScale = rawSubW >= minSubW ? (ch / VH) : (cw / subLogicalW);
    const subBoxH = VH * subScale;
    const subOffY = Math.round((ch - subBoxH) * 0.5);
    const subCamX = clamp(player.x - subLogicalW * 0.44, 0, Math.max(0, WORLD_W - subLogicalW));

    for (let i = 0; i < 4; i++) {
      const sId = state.compareSet[i];
      const gx = (i % 2) * cw, gy = top + Math.floor(i / 2) * ch;
      ctx.save();
      ctx.beginPath(); ctx.rect(gx, gy + Math.max(0, subOffY), cw, Math.min(ch, subBoxH)); ctx.clip();
      ctx.translate(gx, gy + subOffY); ctx.scale(subScale, subScale);
      renderWorldInStyle(ctx, sId, subCamX, subLogicalW);
      if (state.showHitbox) drawHitboxOverlay(ctx, subCamX, subLogicalW);
      ctx.restore();

      const st = STYLES[sId];
      const pillW = Math.min(158, cw - 16);
      ctx.save();
      ctx.fillStyle = 'rgba(12, 15, 24, 0.88)';
      ctx.beginPath(); ctx.roundRect(gx + 8, gy + 8, pillW, 24, 999); ctx.fill();
      ctx.strokeStyle = i === 0 ? '#facc15' : 'rgba(255,255,255,0.24)'; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.fillStyle = i === 0 ? '#fde047' : '#f8fafc'; ctx.font = 'bold 11px -apple-system, sans-serif';
      ctx.fillText(`${st.num} ${st.name}`, gx + 17, gy + 24);
      ctx.strokeStyle = 'rgba(255,255,255,0.24)'; ctx.lineWidth = 2; ctx.strokeRect(gx, gy, cw, ch);
      ctx.restore();
    }
  }

  function avoidHostCapsule() {
    const capsule = host?.info?.capsule;
    if (!capsule) return;

    const edge = appShell.clientWidth - capsule.right;
    const left = edge - capsule.width;
    const bottom = capsule.top + capsule.height;
    for (const element of capsuleNeighbors) {
      const oldGap = parseFloat(element.style.getPropertyValue('--capsule-clearance')) || 0;
      const box = element.getBoundingClientRect();
      const right = box.right + oldGap;
      const overlaps = capsule.width > 0 && capsule.height > 0 && box.width > 0 &&
        box.top < bottom + 8 && box.bottom > capsule.top - 8 &&
        right > left - 8 && box.left + oldGap < edge + 8;
      const gap = overlaps ? Math.ceil(right - left + 8) : 0;
      if (gap !== oldGap) element.style.setProperty('--capsule-clearance', `${gap}px`);
    }
  }

  // 计算下一推荐挑战关卡（首个未通关关卡，全通则返回 W1-1）
  function getRecommendedStage() {
    for (let wi = 0; wi < 8; wi++) {
      for (let si = 0; si < 4; si++) {
        if (!clearedSet.has(`${wi + 1}-${si + 1}`)) return { w: wi, s: si };
      }
    }
    return { w: 0, s: 0 };
  }

  function refreshTitleUI() {
    const count = clearedSet.size;
    const rec = getRecommendedStage();
    titleProgressBadge.textContent = `已通关 ${count}/32`;
    titleNextStage.textContent = `W${rec.w + 1}-${rec.s + 1}`;
    if (count === 0) {
      titlePlayLabel.textContent = '开始冒险';
    } else if (count < 32) {
      titlePlayLabel.textContent = '继续冒险';
    } else {
      titlePlayLabel.textContent = '二周目挑战';
    }
  }

  function syncGamePanels() {
    const browsing = !titleOverlay.classList.contains('hidden') || !worldMapOverlay.classList.contains('hidden');
    for (const panel of gamePanels) panel.inert = browsing;
  }

  function rememberLayer(layer) {
    const entry = { paintingLayer: layer };
    if (history.state?.paintingLayer) history.replaceState(entry, '');
    else history.pushState(entry, '');
  }
  function leaveLayer() {
    if (history.state?.paintingLayer) history.back();
  }

  function openTitle(record = true) {
    clearKeys();
    if (record) leaveLayer();
    state.compareMode = false;
    state.paused = false;
    state.mode = 'title';
    closeWorldMap();
    closePause();
    hideModal();
    refreshTitleUI();
    titleOverlay.classList.remove('hidden');
    titleOverlay.scrollTop = 0;
    syncGamePanels();
    btnTitlePlay.focus({ preventScroll: true });
  }
  function closeTitle() {
    titleOverlay.classList.add('hidden');
    syncGamePanels();
  }

  function openPause(record = true) {
    if (state.mode !== 'playing') return;
    if (record) rememberLayer('pause');
    clearKeys();
    state.compareMode = false;
    needsRender = true;
    state.paused = true;
    pauseOverlay.classList.remove('hidden');
    updateHUD();
  }
  function closePause() {
    state.paused = false;
    pauseOverlay.classList.add('hidden');
  }

  function openWorldMap(record = true) {
    if (record) rememberLayer('map');
    clearKeys();
    state.compareMode = false;
    closePause();
    closeTitle();
    if (!state.hasPlayedOnce) {
      state.selectedMapWorld = getRecommendedStage().w;
    } else {
      state.selectedMapWorld = state.worldIdx;
    }
    renderWorldMapCards();
    btnMapResume.hidden = !(state.hasPlayedOnce && state.mode === 'playing');
    worldMapOverlay.classList.remove('hidden');
    worldMapOverlay.scrollTop = 0;
    syncGamePanels();
    avoidHostCapsule();
    mapTitle.focus({ preventScroll: true });
  }
  function closeWorldMap() {
    worldMapOverlay.classList.add('hidden');
    syncGamePanels();
  }

  function renderWorldMapCards() {
    const rec = getRecommendedStage();
    mapProgressPill.textContent = `已通关 ${clearedSet.size}/32`;
    refreshTitleUI();

    const preserveWorldFocus = worldTabsEl.contains(document.activeElement);
    worldTabsEl.replaceChildren();
    WORLDS.forEach((world, wi) => {
      let cleared = 0;
      for (let si = 0; si < 4; si++) {
        if (clearedSet.has(`${wi + 1}-${si + 1}`)) cleared++;
      }

      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'w-tab';
      tab.setAttribute('aria-pressed', String(wi === state.selectedMapWorld));
      tab.setAttribute('aria-controls', 'world-stage-panel');
      tab.innerHTML = `
        <span class="w-tab-index"><span>W${world.num}</span><span>${cleared}/4</span></span>
        <span class="w-tab-name">${world.name}</span>
      `;
      tab.addEventListener('click', () => {
        state.selectedMapWorld = wi;
        renderWorldMapCards();
      });
      worldTabsEl.appendChild(tab);
    });

    const wi = clamp(state.selectedMapWorld, 0, 7);
    const world = WORLDS[wi];
    const [first, second, third] = world.styles.map(id => STYLES[id].name);
    const stageArt = [
      `<span>${first}</span> <span>→ ${second}</span>`,
      `<span>${second}</span> <span>→ ${third}</span>`,
      `<span>${third}</span> <span>→ ${first}</span>`,
      world.bossName
    ];

    worldStagePanel.innerHTML = `
      <h3 class="w-hero-title">${world.name}</h3>
      <div class="stage-path-grid"></div>
    `;

    const gridEl = worldStagePanel.querySelector('.stage-path-grid');
    for (let si = 0; si < 4; si++) {
      const code = `${wi + 1}-${si + 1}`;
      const isCleared = clearedSet.has(code);
      const isRecommended = wi === rec.w && si === rec.s;
      const isActive = state.hasPlayedOnce && wi === state.worldIdx && si === state.stageIdx;
      const badge = isCleared
        ? '<span class="sn-badge done">已通关</span>'
        : (isRecommended ? '<span class="sn-badge next">下一关</span>' : '');

      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'stage-node';
      node.classList.toggle('recommended', isRecommended || isActive);
      node.innerHTML = `
        <span class="stage-node-top"><span>W${code}</span>${badge}</span>
        <span class="sn-label">${STAGE_TYPES[si].sub}${si === 3 ? '城堡' : '探索'}</span>
        <span class="sn-styles">${stageArt[si]}</span>
      `;
      node.addEventListener('click', () => startStage(wi, si, false));
      gridEl.appendChild(node);
    }

    if (preserveWorldFocus) worldTabsEl.children[wi].focus({ preventScroll: true });
    avoidHostCapsule();
  }

  function pickCompareSet(curStyleId) {
    const wStyles = WORLDS[state.worldIdx].styles;
    const set = [curStyleId];
    for (const s of wStyles) if (!set.includes(s)) set.push(s);
    const others = STYLES.map(s => s.id).filter(id => !set.includes(id)).sort(() => Math.random() - 0.5);
    while (set.length < 4 && others.length) set.push(others.shift());
    return set;
  }

  function resumeGame() {
    closeWorldMap();
    closePause();
    leaveLayer();
  }

  function toggleCompare(record = true) {
    if (state.mode !== 'playing' || !worldMapOverlay.classList.contains('hidden')) return;
    closePause();
    state.compareMode = !state.compareMode;
    clearKeys();
    needsRender = true;
    if (state.compareMode) {
      state.compareSet = pickCompareSet(getActiveStyleId());
      if (record) rememberLayer('compare');
    } else if (record) {
      leaveLayer();
    }
    updateHUD();
  }

  window.addEventListener('popstate', event => {

    closePause();
    state.compareMode = false;

    if (layer === 'map') openWorldMap(false);
    else if (layer === 'pause') openPause(false);
    else if (layer === 'compare') toggleCompare(false);
    else if (state.mode === 'title' && titleOverlay.classList.contains('hidden')) openTitle(false);

  function updateHUD() {
    const w = WORLDS[state.worldIdx];

    setText(hudWorldStage, `W${w.num}-${state.stageIdx + 1}`);
    setText(hudStyleNum, `${st.num}/24`);

    else if (fire) setText(hudForm, '🔥火焰');
    else if (player.power === 1) setText(hudForm, '🍄超级');
    hudForm.classList.toggle('visible', star || player.power > 0);
    hudForm.classList.toggle('fire', fire && !star);
    hudForm.classList.toggle('star', star);

    const action = fire ? '火' : '跑';

  // 主标题 / 世界地图 / 暂停菜单 / 结算弹窗事件绑定

  function shuffleComparison() {

  // 一只手拖动方向盘时，另一只手可同时跳跃或加速。
  const movePad = document.getElementById('move-pad');
  const moveTrack = document.getElementById('move-track');
  const moveThumb = document.getElementById('move-thumb');
  const padLeft = document.getElementById('pad-left');
  const padRight = document.getElementById('pad-right');
  const padFire = document.getElementById('pad-fire');
  const padJump = document.getElementById('pad-jump');
  const actionPointers = new Map();
  let movingPointer = null;
  let dragDirection = 0;

  function updateMoveThumb(dx) {
    dragDirection = Math.abs(dx) < 7 ? 0 : Math.sign(dx);
    const offset = clamp(dx, -43, 43) || (!movingPointer ? (Number(keys.right) - Number(keys.left)) * 43 : 0);
    moveThumb.style.transform = `translateX(${offset}px)`;
  }

  function resetMove() {
    const pointer = movingPointer;
    movingPointer = null;
    if (pointer && movePad.hasPointerCapture(pointer.id)) movePad.releasePointerCapture(pointer.id);
    movePad.classList.remove('active');
    moveTrack.style.left = '';
    moveTrack.style.top = '';
    moveTrack.style.bottom = '';
    updateMoveThumb(0);
  }

  function clearKeys() {
    keys.left = keys.right = keys.jump = keys.fire = false;
    jumpJustPressed = fireJustPressed = false;
    resetMove();
    const held = [...actionPointers];
    actionPointers.clear();
    for (const [button, pointerId] of held) {
      if (button.hasPointerCapture(pointerId)) button.releasePointerCapture(pointerId);
    }
    padFire.classList.remove('pressed');
    padJump.classList.remove('pressed');
  }

  function acceptsTouch(event) {
    return event.button === 0 && hostVisible && state.mode === 'playing' && !state.paused &&
      !state.compareMode && !controlDeck.inert;
  }

  movePad.addEventListener('pointerdown', event => {
    if (!acceptsTouch(event) || movingPointer) return;
    event.preventDefault();
    AudioSys.init();
    const direction = padLeft.contains(event.target) ? -1 : padRight.contains(event.target) ? 1 : 0;
    movingPointer = { id: event.pointerId, anchor: event.clientX - direction * 35 };
    if (!moveTrack.contains(event.target)) {
      const area = movePad.getBoundingClientRect();
      const trackWidth = moveTrack.offsetWidth;
      const trackHeight = moveTrack.offsetHeight;
      moveTrack.style.left = `${clamp(event.clientX - area.left - trackWidth / 2, 0, area.width - trackWidth)}px`;
      moveTrack.style.top = `${clamp(event.clientY - area.top - trackHeight / 2, 0, area.height - trackHeight)}px`;
      moveTrack.style.bottom = 'auto';
    }
    movePad.setPointerCapture(event.pointerId);
    movePad.classList.add('active');
    updateMoveThumb(direction * 35);
  });
  movePad.addEventListener('pointermove', event => {
    if (movingPointer?.id !== event.pointerId) return;
    const dx = clamp(event.clientX - movingPointer.anchor, -52, 52);
    movingPointer.anchor = event.clientX - dx;
    updateMoveThumb(dx);
  });
  for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    movePad.addEventListener(type, event => { if (movingPointer?.id === event.pointerId) resetMove(); });
  }

  function bindActionButton(button, key, press) {
    button.addEventListener('pointerdown', event => {
      if (!acceptsTouch(event) || actionPointers.has(button)) return;
      event.preventDefault();
      AudioSys.init();
      button.setPointerCapture(event.pointerId);
      actionPointers.set(button, event.pointerId);
      if (!keys[key]) press();
      button.classList.add('pressed');
    });
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      button.addEventListener(type, event => {
        if (actionPointers.get(button) !== event.pointerId) return;
        actionPointers.delete(button);
        button.classList.toggle('pressed', keys[key]);
      });
    }
  }
  bindActionButton(padFire, 'fire', () => { fireJustPressed = true; });
  bindActionButton(padJump, 'jump', () => { jumpJustPressed = true; });

  window.addEventListener('keydown', (e) => {
    const titleOpen = !titleOverlay.classList.contains('hidden');
    const mapOpen = !worldMapOverlay.classList.contains('hidden');
    const modalOpen = !modalOverlay.classList.contains('hidden');

    if (e.code === 'Tab') {
      if (!titleOpen && !mapOpen) {
        e.preventDefault();
        if (!modalOpen) openWorldMap();
      }
      return;
    }

    if (e.code === 'Escape') {
      if (state.compareMode) { toggleCompare(); return; }
      if (mapOpen) {
        if (state.hasPlayedOnce && state.mode === 'playing') btnMapResume.click();
        else btnMapBackTitle.click();
        return;
      }
      if (state.paused) { resumeGame(); return; }
      if (state.mode === 'playing' && !titleOpen && !modalOpen) openPause();
      return;
    }

    if (titleOpen) {
      if ((e.code === 'Space' || e.code === 'Enter') && !(e.target instanceof HTMLButtonElement)) {
        e.preventDefault();
        btnTitlePlay.click();
      }
      return;
    }

    if (mapOpen) {
      if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
        state.selectedMapWorld = (state.selectedMapWorld + 7) % 8;
        renderWorldMapCards();
      } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
        state.selectedMapWorld = (state.selectedMapWorld + 1) % 8;
        renderWorldMapCards();
      }
      return;
    }

    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
      e.preventDefault();
    }

    if (modalOpen) {
      if (e.code === 'Space' || e.code === 'Enter') btnModalPrimary.click();
      return;
    }

    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'KeyS') { toggleCompare(); return; }
    if (e.code === 'KeyC' && state.compareMode) { shuffleComparison(); return; }
    if (e.code === 'KeyH') { btnHitbox.click(); return; }
    if (e.code === 'KeyR' && state.hasPlayedOnce) {
      startStage(state.worldIdx, state.stageIdx, false);
      return;
    }

    if (state.paused || state.compareMode || state.mode !== 'playing') return;

    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      keys.left = true;
      if (!movingPointer) updateMoveThumb(0);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      keys.right = true;
      if (!movingPointer) updateMoveThumb(0);
    } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyF' || e.code === 'KeyJ') {
      if (!keys.fire && !actionPointers.has(padFire)) fireJustPressed = true;
      keys.fire = true; padFire.classList.add('pressed');
    } else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!keys.jump && !actionPointers.has(padJump)) jumpJustPressed = true;
      keys.jump = true; padJump.classList.add('pressed');
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      keys.left = false;
      if (!movingPointer) updateMoveThumb(0);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      keys.right = false;
      if (!movingPointer) updateMoveThumb(0);
    } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyF' || e.code === 'KeyJ') {
      keys.fire = false;
      padFire.classList.toggle('pressed', actionPointers.has(padFire));
    } else if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      keys.jump = false;
      padJump.classList.toggle('pressed', actionPointers.has(padJump));
    }
  });

  window.addEventListener('blur', clearKeys);

  /* =========================================================================
     九、主循环入口
     ========================================================================= */
  let lastTS = 0;
  let hudTick = 0;
  let hostVisible = true;

  host?.on('safearea', resize);
  host?.on('hide', () => {
    hostVisible = false;
    lastPaintAt = 0;
    measuredPaints = latePaints = 0;
    clearKeys();
    AudioSys.setForeground(false);
  });
  host?.on('show', () => {
    hostVisible = true;
    lastTS = performance.now();
    AudioSys.setForeground(true);
    resize();
  });

  function loop(ts) {
    const elapsed = Math.max(0, Math.min(0.10, (ts - lastTS) / 1000));
    lastTS = ts;
    if (!hostVisible) {
      requestAnimationFrame(loop);
      return;
    }

    const browsing = !titleOverlay.classList.contains('hidden') || !worldMapOverlay.classList.contains('hidden');
    const active = !browsing && !state.paused && !state.compareMode && state.mode === 'playing';

    if (active) {
      // 卡帧时用短步长补足模拟时间，避免跳跃和角色移动变成慢动作。
      for (let remaining = elapsed; remaining > 0;) {
        const step = Math.min(0.033, remaining);
        updatePhysics(step, logicalW);
        remaining -= step;
      }
    }
    if (!active) {
      lastPaintAt = 0;
      measuredPaints = latePaints = 0;
    }
    // 物理和输入继续逐帧响应，移动端绘制对齐 60 帧节奏。
    const paintDue = !mobileRendering || ts - lastPaintAt >= mobileFrameInterval - 0.75;
    if (!browsing && (needsRender || (active && paintDue))) {
      if (mobileRendering && active) recordMobilePaint(ts);
      if (state.compareMode) renderCompareMode();
      else renderMainGame();
      needsRender = false;
    }

    const musicActive = active && state.mode === 'playing' && !player.dead && player.winPhase === 0;
    AudioSys.updateMusic(elapsed, musicActive, state.stageIdx, STYLES[getActiveStyleId()].era, player.starTimer > 0);
    if (active) {
      hudTick += elapsed;
      if (hudTick > 0.08) {
        hudTick = 0;
        updateHUD();
      }
    }
    requestAnimationFrame(loop);
  }

  window.onload = async () => {
    await loadProgress();
    buildStage(0, 0);
    resize();
    refreshTitleUI();
    renderWorldMapCards();
    updateHUD();
    lastTS = performance.now();
    requestAnimationFrame(() => {
      host?.ready();
      requestAnimationFrame(loop);
    });
  };
})();
</script>
</body>
</html>
