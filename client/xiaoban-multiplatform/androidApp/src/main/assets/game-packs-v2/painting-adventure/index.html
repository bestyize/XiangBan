<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>画框马里奥 · 32 关艺术史大冒险</title>
  <style>
    /* =========================================================================
       全局视觉风格：主机级掌机/街机外壳 + 极简 HUD + 分世界选关大地图
       ========================================================================= */
    :root {
      --bg: #06080f;
      --surface: rgba(15, 19, 31, 0.88);
      --surface-strong: rgba(19, 24, 40, 0.96);
      --surface-hover: rgba(34, 43, 68, 0.96);
      --border: rgba(255, 255, 255, 0.13);
      --border-gold: rgba(250, 204, 21, 0.45);
      --text: #f8fafc;
      --muted: #94a3b8;
      --gold: #facc15;
      --cyan: #38bdf8;
      --violet: #a78bfa;
      --crimson: #f43f5e;
      --emerald: #34d399;
      --orange: #fb923c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #191c34 0%, #05070e 76%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    }

    /* 横屏画布铺满视口，界面控件避开屏幕安全区。 */
    #app-shell {
      --game-safe-top: max(env(safe-area-inset-top), var(--xb-safe-top, 0px));
      --game-safe-right: max(env(safe-area-inset-right), var(--xb-safe-right, 0px));
      --game-safe-bottom: max(env(safe-area-inset-bottom), var(--xb-safe-bottom, 0px));
      --game-safe-left: max(env(safe-area-inset-left), var(--xb-safe-left, 0px));
      --hud-top: max(8px, var(--game-safe-top));
      --hud-right: max(8px, var(--game-safe-right));
      --hud-bottom: max(8px, var(--game-safe-bottom));
      --hud-left: max(8px, var(--game-safe-left));
      --hud-notice-top: calc(var(--hud-top) + 58px);
      position: relative;
      container: game / size;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #top-bar {
      position: absolute;
      inset: var(--hud-top) var(--hud-right) auto var(--hud-left);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }

    .hud-left, .hud-right, .hud-stats {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }
    .hud-left, .hud-right { pointer-events: auto; }
    .hud-right { flex-shrink: 0; }
    .hud-right, #btn-map-resume { translate: calc(-1 * var(--capsule-clearance, 0px)) 0; }

    .hud-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.14s ease, border-color 0.14s ease;
      flex-shrink: 0;
    }
    .hud-icon-btn:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .hud-icon-btn:active { transform: translateY(1px); }
    .hud-icon-btn.active-warm {
      background: linear-gradient(135deg, #d97706, #ea580c);
      border-color: rgba(253, 224, 71, 0.75);
    }

    /* 关卡 + 当前画风整合铭牌（点击直达世界地图） */
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 34px;
      padding: 0 8px 0 5px;
      border-radius: 10px;
      border: 1px solid rgba(250, 204, 21, 0.34);
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.12), rgba(56, 189, 248, 0.12));
      color: var(--text);
      cursor: pointer;
      min-width: 0;
      transition: filter 0.14s ease, transform 0.12s ease;
    }
    .stage-pill:hover { filter: brightness(1.14); transform: translateY(-1px); }

    .stage-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 7px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .style-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .style-num-sub {
      font-family: ui-monospace, monospace;
      font-size: 10.5px;
      color: #fde047;
      font-weight: 700;
      display: none;
      flex-shrink: 0;
    }
    @media (min-width: 720px) { .style-num-sub { display: inline; } }

    /* 核心状态计数器（经典任天堂紧凑样式） */
    .hud-stats {
      align-self: center;
      flex-shrink: 0;
      padding: 6px 8px;
      gap: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 800;
    }

    .hud-stat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .hud-stat.gold { color: #fde047; }
    .hud-stat.life { color: #fb7185; }
    .hud-stat.score { color: #e2e8f0; display: none; }
    @media (min-width: 520px) { .hud-stat.score { display: inline-flex; } }

    .form-chip {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
      display: none;
    }
    .form-chip.visible { display: inline-flex; }
    .form-chip.fire {
      background: rgba(251, 146, 60, 0.22);
      border-color: rgba(251, 146, 60, 0.6);
      color: #fdba74;
    }
    .form-chip.star {
      background: rgba(250, 204, 21, 0.25);
      border-color: rgba(250, 204, 21, 0.8);
      color: #fef08a;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.45);
    }

    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #cbd5e1;
    }

    #canvas-frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #070a14;
    }

    canvas#game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 贴合画布顶缘的 3px 精致进度微光线 */
    #stage-progress-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 22;
      pointer-events: none;
    }
    #prog-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #facc15, #38bdf8, #34d399, #c084fc);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
      transition: width 0.08s linear;
    }

    /* 四画风定格对比条 */
    #compare-banner {
      position: absolute;
      top: var(--hud-notice-top);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(12, 15, 24, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.65);
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #fde68a;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      z-index: 28;
      white-space: nowrap;
      max-width: 94%;
    }
    #compare-banner.visible { display: flex; }

    .mini-pill-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-pill-btn.warm {
      background: linear-gradient(135deg, #d97706, #ea580c);
      border-color: rgba(253, 224, 71, 0.7);
    }

    /* Boss 血条浮窗 */
    #boss-hud {
      position: absolute;
      top: var(--hud-notice-top);
      right: var(--hud-right);
      padding: 8px 13px;
      border-radius: 13px;
      background: rgba(14, 16, 28, 0.9);
      border: 1px solid rgba(244, 63, 94, 0.65);
      display: none;
      flex-direction: column;
      gap: 5px;
      min-width: 190px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6);
      z-index: 26;
    }
    #boss-hud.visible { display: flex; }
    .boss-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      font-weight: 800;
      color: #fda4af;
    }
    .boss-bar-bg {
      height: 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .boss-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #f43f5e, #fb923c, #facc15);
      transition: width 0.2s ease;
    }

    /* 浮动提示条 */
    #toast-msg {
      position: absolute;
      top: var(--hud-notice-top);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(12, 17, 32, 0.92);
      border: 1px solid rgba(250, 204, 21, 0.55);
      color: #fef08a;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      opacity: 0;
      transition: all 0.24s ease;
      z-index: 25;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      max-width: 90%;
      text-align: center;
    }
    #toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #game-orientation {
      display: none;
      position: absolute;
      top: calc(var(--hud-notice-top) + 36px);
      inset-inline: 12px;
      color: #e2e8f0;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }
    @container game (max-aspect-ratio: 3/4) and (min-height: 35rem) {
      #game-orientation { display: block; }
    }

    /* 大厅与关卡目录共用的展厅界面 */
    .gallery-screen {
      --gallery-wall: #201c29;
      --gallery-panel: #2c2635;
      --gallery-line: #544959;
      --gallery-text: #fff2de;
      --gallery-muted: #cbbdba;
      --gallery-gold: #efc17d;
      --gallery-ink: #2d2019;
      --gallery-serif: "Songti SC", "Noto Serif CJK SC", "STSong", SimSun, serif;

      position: absolute;
      inset: 0;
      z-index: 50;
      container: gallery / size;
      display: flex;
      flex-direction: column;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-color: var(--gallery-line) var(--gallery-wall);
      padding: max(18px, var(--game-safe-top)) max(18px, var(--game-safe-right))
        max(18px, var(--game-safe-bottom)) max(18px, var(--game-safe-left));
      background: var(--gallery-wall);
      color: var(--gallery-text);
    }

    .gallery-screen.hidden { display: none; }
    .gallery-screen button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      touch-action: manipulation;
    }
    .gallery-screen button:focus-visible {
      outline: 2px solid var(--gallery-gold);
      outline-offset: 2px;
    }
    .gallery-screen button:active { transform: translateY(1px); }
    .gallery-screen :is(h1, h2, h3) { font-family: var(--gallery-serif); }

    .lobby-layout {
      display: grid;
      grid-template-areas: "intro" "art" "actions";
      align-items: center;
      gap: 24px;
      gap: clamp(16px, 3.7cqh, 32px);
      width: min(100%, 27rem);
      margin: auto;
    }

    .lobby-intro { grid-area: intro; }
    .lobby-intro h1 {
      font-size: clamp(2rem, 11.8cqw, 3.5rem);
      letter-spacing: 0.04em;
      line-height: 1.12;
    }
    .lobby-intro p {
      margin-top: 8px;
      color: var(--gallery-muted);
      font-size: clamp(1rem, 4.4cqw, 1.2rem);
      line-height: 1.45;
    }

    .lobby-intro .lobby-orientation {
      display: none;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      color: var(--gallery-gold);
      font-size: 0.8125rem;
      line-height: 1.35;
    }
    .lobby-orientation::before {
      content: "";
      width: 15px;
      height: 9px;
      border: 1px solid currentColor;
      border-right-width: 3px;
      border-radius: 3px;
    }

    .lobby-art { grid-area: art; min-width: 0; }
    .lobby-frame {
      padding: 5px;
      border: 1px solid #997348;
      border-radius: 4px;
      background: linear-gradient(155deg, #e8c38f 0%, #9a7044 47%, #c79c69 100%);
      box-shadow: 0 10px 26px rgba(9, 5, 13, 0.46);
    }
    .lobby-frame img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #573b26;
      background: #182846;
    }
    .lobby-art figcaption {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      color: var(--gallery-muted);
      font-size: 0.8125rem;
      text-align: center;
    }
    .lobby-art-flow {
      position: relative;
      width: 24px;
      height: 1px;
      margin-right: 2px;
      background: var(--gallery-gold);
    }
    .lobby-art-flow::after,
    .gallery-chevron {
      width: 7px;
      height: 7px;
      border: solid currentColor;
      border-width: 1.5px 1.5px 0 0;
      transform: rotate(45deg);
    }
    .lobby-art-flow::after {
      content: "";
      position: absolute;
      right: 0;
      top: -3px;
      color: var(--gallery-gold);
    }

    .lobby-actions {
      grid-area: actions;
      display: grid;
      gap: 9px;
      min-width: 0;
    }
    .gallery-screen .lobby-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
      min-height: 54px;
      padding: 10px 15px;
      border: 1px solid var(--gallery-line);
      border-radius: 12px;
      background: var(--gallery-panel);
      font-size: 1rem;
      font-weight: 700;
      text-align: left;
    }
    .gallery-screen .lobby-action.primary {
      min-height: 58px;
      border-color: transparent;
      background: var(--gallery-gold);
      color: var(--gallery-ink);
      font-size: 1.125rem;
    }
    .lobby-action-label,
    .lobby-action-meta {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }
    .lobby-play-mark {
      width: 0;
      height: 0;
      border: solid transparent;
      border-width: 6px 0 6px 9px;
      border-left-color: currentColor;
    }
    .lobby-action-meta {
      color: var(--gallery-muted);
      font-size: 0.8125rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .primary .lobby-action-meta { color: #58402d; }
    .map-shell {
      display: grid;
      grid-template-areas: "top" "worlds" "stages";
      align-content: start;
      gap: 16px;
      width: min(100%, 59rem);
      margin: auto;
    }
    .map-topbar {
      grid-area: top;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--gallery-line);
    }
    .map-heading { text-align: center; }
    .map-heading h2 { font-size: 1.5rem; line-height: 1.2; }
    #map-title:focus { outline: none; }
    .map-heading p {
      margin-top: 3px;
      color: var(--gallery-muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .gallery-screen .map-nav-btn {
      display: inline-flex;
      align-items: center;
      justify-self: start;
      gap: 8px;
      min-height: 44px;
      padding: 6px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 0.875rem;
      font-weight: 650;
    }
    .map-nav-btn .gallery-chevron { transform: rotate(-135deg); }
    .gallery-screen .map-nav-btn.primary {
      justify-self: end;
      background: var(--gallery-gold);
      color: var(--gallery-ink);
    }
    .gallery-screen .map-nav-btn[hidden] { display: none; }

    #world-tabs {
      grid-area: worlds;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: start;
      gap: 6px;
    }
    .gallery-screen .w-tab {
      display: grid;
      gap: 4px;
      align-content: center;
      min-height: 56px;
      padding: 6px 4px;
      border: 1px solid var(--gallery-line);
      border-radius: 9px;
      background: transparent;
      text-align: center;
    }
    .gallery-screen .w-tab[aria-pressed="true"] {
      border-color: var(--gallery-gold);
      background: var(--gallery-gold);
      color: var(--gallery-ink);
    }
    .w-tab-index {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px 6px;
      color: var(--gallery-muted);
      font-size: 0.6875rem;
      font-variant-numeric: tabular-nums;
    }
    .w-tab[aria-pressed="true"] .w-tab-index { color: #58402d; }
    .w-tab-name { font-size: 0.8125rem; font-weight: 700; }

    #world-stage-panel { grid-area: stages; min-width: 0; }
    .w-hero-title {
      margin-bottom: 10px;
      font-size: 1.375rem;
      line-height: 1.25;
    }
    .stage-path-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .gallery-screen .stage-node {
      display: grid;
      align-content: start;
      gap: 4px;
      min-width: 0;
      min-height: 88px;
      padding: 10px 11px;
      border: 1px solid var(--gallery-line);
      border-radius: 12px;
      background: var(--gallery-panel);
      text-align: left;
    }
    .gallery-screen .stage-node.recommended {
      border-color: var(--gallery-gold);
      background: #382f37;
    }
    .stage-node-top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 2px 5px;
      color: var(--gallery-muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .sn-badge { font-weight: 600; }
    .sn-badge.done { color: #b6deb7; }
    .sn-badge.next { color: var(--gallery-gold); }
    .sn-label { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .sn-styles {
      color: var(--gallery-muted);
      font-size: 0.8125rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .sn-styles > span { display: inline-block; max-width: 100%; }

    @media (hover: hover) {
      .gallery-screen .lobby-action:hover,
      .gallery-screen .map-nav-btn:hover,
      .gallery-screen .w-tab:hover,
      .gallery-screen .stage-node:hover { border-color: var(--gallery-gold); background-color: #3a3042; }
      .gallery-screen .lobby-action.primary:hover,
      .gallery-screen .map-nav-btn.primary:hover,
      .gallery-screen .w-tab[aria-pressed="true"]:hover { background-color: #f8d398; }
      .gallery-screen .lobby-preview:hover { color: var(--gallery-text); }
    }

    @container gallery (min-width: 43rem) {
      .map-shell { gap: 24px; }
      #world-tabs { grid-template-columns: repeat(8, minmax(0, 1fr)); }
      .stage-path-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @container gallery (max-aspect-ratio: 1/1) {
      .lobby-intro .lobby-orientation { display: flex; }
    }

    @container gallery (min-width: 43rem) or ((min-width: 26rem) and (min-aspect-ratio: 5/4)) {
      .lobby-layout {
        width: min(100%, 66rem);
        grid-template-areas: "intro art" "actions art";
        grid-template-columns: minmax(208px, 0.8fr) minmax(0, 1.35fr);
        column-gap: clamp(18px, 5cqw, 70px);
      }
      .lobby-intro { align-self: end; }
      .lobby-intro h1 { font-size: clamp(1.875rem, 5.4cqw, 4.25rem); }
      .lobby-intro p { font-size: clamp(1rem, 2.35cqw, 1.25rem); }
      .lobby-actions { align-self: start; max-width: 340px; }
    }

    @container gallery (min-width: 26rem) and (min-aspect-ratio: 5/4) and (max-height: 30rem) {
      .map-shell {
        grid-template-areas: "top top" "worlds stages";

    .move-arrow {

      border: 0;

      transform: rotate(45deg);

    .move-thumb {
      position: absolute;
      top: 7px;
      left: calc(50% - 19px);
      width: 38px;
      height: 38px;
      border: 1px solid #f1c989;
      border-radius: 50%;

      pointer-events: none;

    .action-cluster {
      position: absolute;
      right: max(14px, var(--game-safe-right));

      width: calc(var(--jump-size) + var(--run-size) + 15px);
      height: calc(var(--jump-size) + 16px);
    }
    .touch-action {
      position: absolute;
      display: grid;
      place-items: center;
      color: #fff0d6;
      border: 1px solid #f0c6879c;
      border-radius: 50%;
      background: rgba(37, 28, 39, 0.82);

      cursor: pointer;
      pointer-events: auto;
      touch-action: none;
      transition: transform 80ms ease, background-color 80ms ease;
    }
    .touch-action.jump {
      right: 0;
      bottom: 1px;
      width: var(--jump-size);
      height: var(--jump-size);
      border-color: #f6cd8f;
      background: rgba(60, 35, 39, 0.89);
      font-size: clamp(25px, 7cqh, 32px);
    }
    .touch-action.run {
      right: calc(var(--jump-size) + 10px);
      bottom: 20px;
      width: var(--run-size);
      height: var(--run-size);
      font-size: clamp(20px, 5.7cqh, 26px);
    }
    .touch-action.powered { background-color: #793b25; }
    .touch-action.pressed, .touch-action:active {
      transform: scale(0.9);
      background-color: #694332;
    }

    .desktop-bar {
      position: absolute;
      left: 50%;
      bottom: var(--hud-bottom);
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 12px;

    .desktop-hints {

  </style>

  const STYLES = [

  // 确定性伪随机数生成器（确保全部 32 关地形布局恒定、可记忆、可重复攻关）
  function makeRNG(seed) {
    let s = (seed ^ 0x9e3779b9) >>> 0;
    return () => {
      s = (Math.imul(s ^ (s >>> 16), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0;
      s = (s ^ (s >>> 16)) >>> 0;
      return s / 4294967296;
    };
  }

    function init() {

      muted = m;

    }

    function playStep(stageType, era, starActive) {
      if (!ctx || muted) return;
      const now = ctx.currentTime + 0.01;
      const tr = TRACKS[stageType] || TRACKS[0];
      const dur = starActive ? 0.142 : tr.step;

      const mel = starActive ? STAR_MEL[stepIdx % STAR_MEL.length] : tr.mel[stepIdx % tr.mel.length];
      const bas = starActive ? ((stepIdx % 16 < 8) ? 53 : 51) : tr.bas[stepIdx % tr.bas.length];

      if (mel > 0) {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();

        f.type = 'lowpass';

        if (starActive || era === 'chiptune' || era === 'terminal') {

          osc.type = 'sine'; f.frequency.value = 2800;
        } else {
          osc.type = 'triangle'; f.frequency.value = 2200;
        }

        osc.frequency.setValueAtTime(m2f(mel), now);
        const peak = (osc.type === 'square' || osc.type === 'sawtooth') ? 0.068 : 0.10;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(peak, now + 0.009);
        g.gain.exponentialRampToValueAtTime(0.0008, now + dur * 1.38);
        osc.connect(f); f.connect(g); g.connect(master);
        osc.start(now); osc.stop(now + dur * 1.42);

        const g = ctx.createGain();
        osc.type = (stageType === 3 || era === 'synthwave') ? 'sawtooth' : 'triangle';

        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(stageType === 3 ? 0.095 : 0.082, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur * 1.18);
        osc.connect(g); g.connect(master);
        osc.start(now); osc.stop(now + dur * 1.22);
      }

      if (noiseBuf && (stepIdx % 4 === 2 || (starActive && stepIdx % 2 === 1))) {
        const src = ctx.createBufferSource(); src.buffer = noiseBuf;
        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 4600;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.025, now);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.04);
        src.connect(hp); hp.connect(g); g.connect(master);
        src.start(now); src.stop(now + 0.045);

      const tr = TRACKS[stageType] || TRACKS[0];

      musicAcc += dt;
      while (musicAcc >= dur) {
        musicAcc -= dur;
        playStep(stageType, era, starActive);
      }
    }

    function tone(type, f0, f1, dur, vol = 0.12) {
      if (!ctx || muted) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, now);
      if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now + dur + 0.01);
    }

        g.gain.setValueAtTime(vol, now + i * step);
        g.gain.exponentialRampToValueAtTime(0.001, now + i * step + (i === notes.length - 1 ? dur * 1.8 : dur));
        osc.connect(g); g.connect(master);
        osc.start(now + i * step); osc.stop(now + i * step + dur * 2);
      });

  function setTile(c, r, t) {
    if (r >= 0 && r < ROWS && c >= 0 && c < TOTAL_COLS) grid[r][c] = t;
  }
  function getTile(c, r) {
    if (r < 0) return T_AIR;
    if (r >= ROWS || c < 0 || c >= TOTAL_COLS) return T_AIR;

  }
  function isSolid(t) {
    return t === T_GROUND || t === T_BRICK || t === T_Q_COIN || t === T_Q_POWER ||
           t === T_Q_FIRE || t === T_Q_STAR || t === T_USED || t === T_STONE ||
           t === T_PIPE || t === T_BRIDGE;
  }

  function addPipe(col, heightRows, withPiranha = false) {
    const topRow = 13 - heightRows;
    pipes.push({ col, topRow, heightRows });
    for (let r = topRow; r < 13; r++) {
      setTile(col, r, T_PIPE);
      setTile(col + 1, r, T_PIPE);
    }
    if (withPiranha) {
      piranhas.push({
        x: col * TILE + TILE - 14,
        baseY: topRow * TILE,
        y: topRow * TILE + 8,
        w: 28, h: 36,
        timer: Math.random() * 4,
        alive: true

    }
  }

  function addRow(cStart, row, pattern) {

      else if (ch === '*') setTile(cStart + i, row, T_Q_STAR);
      else if (ch === 'S') setTile(cStart + i, row, T_STONE);
    }
  }

  function addPlatform(colCenter, rowCenter, tilesWide, dxTiles, dyTiles, speed = 1.5, phase = 0) {
    const w = tilesWide * TILE;
    const x0 = colCenter * TILE - w * 0.5;
    const y0 = rowCenter * TILE;
    platforms.push({
      x: x0, y: y0, prevX: x0, prevY: y0,
      w, h: 16, x0, y0,
      dxAmp: dxTiles * TILE, dyAmp: dyTiles * TILE, speed, phase
    });
  }

  function addSpring(col, row = 12) {
    springs.push({ x: col * TILE + 3, y: (row + 1) * TILE - 28, w: 30, h: 28, compress: 0 });
  }

  function addCoinLine(cStart, row, count) {
    for (let i = 0; i < count; i++) {
      coins.push({ x: (cStart + i + 0.5) * TILE, y: (row + 0.5) * TILE, taken: false });
    }
  }

  function addCoinArc(centerCol, topRow, count = 5) {
    for (let i = 0; i < count; i++) {
      const u = count === 1 ? 0 : (i / (count - 1)) * 2 - 1;
      coins.push({
        x: (centerCol + u * 2.1) * TILE + TILE * 0.5,
        y: (topRow + u * u * 1.35) * TILE + TILE * 0.5,
        taken: false
      });
    }
  }

  function addEnemy(type, col, row = 12, speedScale = 1.0) {
    const h = type === 'goomba' ? 28 : 36;
    const baseVx = type === 'paratroopa' ? -84 : -76;
    enemies.push({
      type,
      x: col * TILE + 4,
      y: (row + 1) * TILE - h,
      vx: baseVx * speedScale,
      vy: 0, w: 28, h,
      state: 'walk', deadTimer: 0, facing: -1,
      anim: Math.random() * 10
    });
  }

  // 构建任意指定关卡 (wIdx: 0..7, sIdx: 0..3)
  function buildStage(wIdx, sIdx) {
    const world = WORLDS[wIdx];
    const diff = 1 + wIdx * 0.08 + sIdx * 0.04; // 随世界递进的平滑难度曲线
    const rng = makeRNG((wIdx + 1) * 1009 + (sIdx + 1) * 97);

    isBossStage = (sIdx === 3);
    // 方案 ① 精华：前 3 关两两组合双画风穿框，第 4 关城堡战三画风全员集结！
    if (sIdx === 0) stageStyles = [world.styles[0], world.styles[1]];
    else if (sIdx === 1) stageStyles = [world.styles[1], world.styles[2]];
    else if (sIdx === 2) stageStyles = [world.styles[2], world.styles[0]];
    else stageStyles = [world.styles[0], world.styles[1], world.styles[2]];

    ZONE_COLS = isBossStage ? 34 : 52;
    TOTAL_COLS = isBossStage ? (34 * 3 + 32) : (52 * 2 + 28); // 普通关 132 格，Boss 关 134 格（紧凑好玩！）
    WORLD_W = TOTAL_COLS * TILE;

    frameXs = [];
    for (let k = 1; k < stageStyles.length; k++) {
      frameXs.push(k * ZONE_COLS * TILE);
    }

    // 重置实体容器
    grid = Array.from({ length: ROWS }, () => new Uint8Array(TOTAL_COLS));
    blockBounces = {};
    pipes = []; piranhas = []; platforms = []; springs = []; crumbles = [];
    cannons = []; bullets = []; firebars = []; coins = []; enemies = [];
    items = []; fireballs = []; bossFires = []; particles = []; popups = [];
    flagpole = null; castle = null; boss = null; axe = null;
    bridgeCols = []; bridgeCollapseTimer = 0; trophyX = 0;

    // 基础地面
    for (let c = 0; c < TOTAL_COLS; c++) {
      grid[13][c] = T_GROUND;
      grid[14][c] = T_GROUND;
    }

    // -----------------------------------------------------------------------
    // 组装高玩性模块化关卡段落（确保每段之间安全着陆区充裕、绝无死局）
    // -----------------------------------------------------------------------
    const placeSetpiece = (c, kind) => {
      if (kind === 'classic_blocks') {
        addRow(c + 1, 9, rng() > 0.45 ? '?BMB?' : 'B?F?B');
        addRow(c + 2, 5, '???');
        addEnemy('goomba', c + 4, 12, diff);
        addEnemy(rng() > 0.5 ? 'koopa' : 'goomba', c + 8, 12, diff);
        return 12;
      }
      if (kind === 'pipe_gauntlet') {
        const hasP = sIdx >= 1 || wIdx >= 2;
        addPipe(c + 1, 2, hasP);
        addEnemy('goomba', c + 5, 12, diff);
        addPipe(c + 8, 3, hasP && rng() > 0.35);
        addCoinArc(c + 5, 7.6, 4);
        return 13;
      }
      if (kind === 'bowling') {
        addEnemy('koopa', c + 2, 12, diff);
        addEnemy('goomba', c + 6, 12, diff);
        addEnemy('goomba', c + 8, 12, diff);
        addEnemy('goomba', c + 10, 12, diff);
        addRow(c + 4, 9, 'B?B?B');
        return 13;
      }
      if (kind === 'spring_secret') {
        addSpring(c + 1, 12);
        addRow(c + 3, 5, 'BB?F?BB');
        addCoinLine(c + 4, 3.8, 5);
        addPipe(c + 5, 2, true);
        addEnemy('goomba', c + 9, 12, diff);
        return 13;
      }
      if (kind === 'moving_abyss') {
        addPit(c + 1, 8);
        addPlatform(c + 5, 10.2, 3, 2.0, 0, 1.45 + wIdx * 0.08, rng() * 3);
        addCoinArc(c + 5, 6.8, 5);
        return 11;
      }
      if (kind === 'vertical_tower') {
        addPit(c + 1, 5);
        addPlatform(c + 3.5, 9.4, 3, 0, 2.0, 1.65 + wIdx * 0.06, rng() * 3);
        addRow(c + 6, 6, 'B???B');
        addEnemy('paratroopa', c + 9, 12, diff);
        return 13;
      }
      if (kind === 'crumble_sky') {
        addPit(c + 1, 9);
        addCrumbleLine(c + 2, 10.6, 3);
        addCrumbleLine(c + 6, 9.4, 3);
        addCoinArc(c + 5.5, 6.2, 5);
        return 12;
      }
      if (kind === 'cannon_run') {
        addCannon(c + 2, 2);
        addRow(c + 4, 9, '?B?B?');
        addEnemy('paratroopa', c + 7, 12, diff);
        addCannon(c + 10, 3);
        addCoinArc(c + 6, 6.2, 4);
        return 13;
      }
      if (kind === 'star_rush') {
        addRow(c + 1, 9, 'B?*?B');
        addEnemy('goomba', c + 6, 12, diff);
        addEnemy('koopa', c + 8, 12, diff);
        addEnemy('paratroopa', c + 10, 12, diff);
        addEnemy('goomba', c + 12, 12, diff);
        addCoinLine(c + 6, 11.2, 7);
        return 15;
      }
      if (kind === 'firebar_hall') {
        addFirebar(c + 3, 10, 4 + (wIdx >= 4 ? 1 : 0), (1.55 + wIdx * 0.1) * (rng() > 0.5 ? 1 : -1), rng() * 6);
        addPit(c + 6, 3);
        addCrumbleLine(c + 6, 11.2, 3);
        addFirebar(c + 11, 9, 4 + (wIdx >= 3 ? 1 : 0), -(1.65 + wIdx * 0.1), rng() * 6);
        addCoinArc(c + 7.5, 7.6, 4);
        return 14;
      }
      // 默认安全跳跃台
      addRow(c + 2, 9, 'B?M?B');
      addPit(c + 7, 2);
      addEnemy('goomba', c + 10, 12, diff);
      return 13;
    };

    if (!isBossStage) {
      // 普通关：X-1 原野 / X-2 秘境 / X-3 苍穹（两幅画风 + 1 道实体画框）
      const pools = [
        ['classic_blocks', 'pipe_gauntlet', 'bowling', 'spring_secret', 'moving_abyss'],
        ['spring_secret', 'moving_abyss', 'vertical_tower', 'pipe_gauntlet', 'bowling'],
        ['crumble_sky', 'cannon_run', 'star_rush', 'moving_abyss', 'vertical_tower']
      ];
      const pool = pools[sIdx];

      // 开局安全教学/补给区
      addRow(5, 9, sIdx === 0 ? '?BMB?' : (sIdx === 1 ? 'B?F?B' : 'B?F?B'));
      if (sIdx === 2 && wIdx >= 1) addRow(11, 5, '?*?');

      // 前半段（画风 1：cols 12 .. ZONE_COLS-5）
      let cur = 12;
      while (cur < ZONE_COLS - 14) {
        const pick = pool[Math.floor(rng() * pool.length)];
        cur += placeSetpiece(cur, pick);
      }

      // 穿框高潮指引金币弧（实体画框位于 ZONE_COLS）
      addCoinArc(ZONE_COLS - 0.5, 7.8, 5);

      // 后半段（画风 2：cols ZONE_COLS+4 .. ZONE_COLS*2-5）
      cur = ZONE_COLS + 4;
      // 每关过半赠送一次补给或无敌星爽段
      if (sIdx === 2) {
        cur += placeSetpiece(cur, 'star_rush');
      }
      while (cur < ZONE_COLS * 2 - 14) {
        const pick = pool[Math.floor(rng() * pool.length)];
        cur += placeSetpiece(cur, pick);
      }

      // 经典冲刺阶梯 + 旗杆 + 城堡
      const stairCol = ZONE_COLS * 2 + 2;
      const stairH = 6 + (sIdx === 2 ? 2 : 0);
      for (let i = 0; i < stairH; i++) {
        for (let h = 0; h <= i; h++) setTile(stairCol + i, 12 - h, T_STONE);
        if (i === stairH - 1) {
          for (let h = 0; h <= i; h++) setTile(stairCol + i + 1, 12 - h, T_STONE);
        }
      }
      const flagCol = stairCol + stairH + 7;
      setTile(flagCol, 12, T_STONE);
      flagpole = { x: flagCol * TILE + TILE * 0.5, topY: 3 * TILE, botY: 12 * TILE, flagY: 3.4 * TILE };
      castle = { x: (flagCol + 5) * TILE, y: 13 * TILE };
    } else {
      // =====================================================================
      // X-4 三画风城堡 Boss 决战关（穿越两道实体画框，集齐本世界全部 3 种画风！）
      // =====================================================================
      // 城堡入口必定补给火焰花
      addRow(5, 9, 'SFS');

      // Zone 0（画风 1）：火棒回廊 + 炮台
      let cur = 10;
      cur += placeSetpiece(cur, 'firebar_hall');
      if (cur < ZONE_COLS - 10) addEnemy('koopa', cur + 2, 12, diff);
      addCoinArc(ZONE_COLS - 0.5, 7.8, 5); // 第 1 道城堡画框

      // Zone 1（画风 2）：塌陷云桥 + 移动浮台 + 火棒
      cur = ZONE_COLS + 4;
      cur += placeSetpiece(cur, wIdx % 2 === 0 ? 'crumble_sky' : 'moving_abyss');
      if (cur < ZONE_COLS * 2 - 14) cur += placeSetpiece(cur, 'firebar_hall');
      addCoinArc(ZONE_COLS * 2 - 0.5, 7.6, 5); // 第 2 道城堡画框

      // Zone 2（画风 3）：Boss 前门补给 + 岩浆吊桥魔王决战！
      const z2 = ZONE_COLS * 2;
      addRow(z2 + 5, 9, '?F?'); // Boss 门前最后补给火焰花
      if (wIdx >= 4) addFirebar(z2 + 10, 10, 4, 1.7, 0);

      const bridgeStart = z2 + 15;
      const bridgeEnd = z2 + 31;
      addPit(bridgeStart, bridgeEnd - bridgeStart + 1);
      for (let c = bridgeStart; c <= bridgeEnd; c++) {
        setTile(c, 12, T_BRIDGE);
        bridgeCols.push(c);
      }
      // 吊桥上方高台（方便跳跃绕过或俯射火球）
      addRow(z2 + 19, 8, 'SSSS');
      addCoinLine(z2 + 19, 6.6, 4);

      const bossHp = 4 + Math.floor(wIdx * 0.85); // World 1: 4HP -> World 8: 10HP
      boss = {
        name: world.bossName,
        color: world.bossColor,
        x: (z2 + 25) * TILE,
        y: 12 * TILE - 64,
        vx: -(56 + wIdx * 7),
        vy: 0, w: 56, h: 64,
        hp: bossHp, maxHp: bossHp,
        minX: (bridgeStart + 2) * TILE,
        maxX: (bridgeEnd - 3) * TILE,
        jumpCD: Math.max(1.2, 2.3 - wIdx * 0.12),
        fireCD: Math.max(1.2, 2.4 - wIdx * 0.14),
        alive: true, falling: false, hurtFlash: 0
      };

      axe = {
        x: (bridgeEnd + 1) * TILE + 6,
        y: 11 * TILE + 2,
        w: 26, h: 34, active: true
      };
      setTile(bridgeEnd + 1, 12, T_STONE);
      trophyX = (bridgeEnd + 8) * TILE;
    }
  }

  /* =========================================================================
     五、存档系统、全局状态与物理引擎
     ========================================================================= */
  const STORAGE_KEY = 'mario_paintings_32_progress_v1';
  const clearedSet = new Set();

  async function loadProgress() {
    try {
      const progress = host
        ? await host.storage.get(STORAGE_KEY)
        : JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(progress)) {
        for (const stage of progress) {
          if (typeof stage === 'string' && /^[1-8]-[1-4]$/.test(stage)) clearedSet.add(stage);
        }
      }
    } catch {}
  }
  function saveProgress() {
    const progress = [...clearedSet];
    if (host) {
      host.storage.set(STORAGE_KEY, progress).catch(() => {});
    } else {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {}
    }
  }

  const keys = { left: false, right: false, jump: false, fire: false };
  let jumpJustPressed = false;
  let fireJustPressed = false;

  const state = {
    mode: 'title',        // title | playing | stageclear | gameover
    paused: false,
    worldIdx: 0,          // 0..7
    stageIdx: 0,          // 0..3
    selectedMapWorld: 0,  // 世界地图当前聚焦的世界索引
    compareMode: false,
    showHitbox: false,
    compareSet: [0, 1, 2, 20],
    score: 0,
    coins: 0,
    lives: 5,
    camX: 0,
    time: 0,
    checkpointX: 3 * TILE,
    checkpointY: 10 * TILE,
    currentZoneIdx: 0,    // 在本关 stageStyles 中的索引
    frameFlash: 0,
    stompCombo: 0,
    bossDefeated: false,
    hasPlayedOnce: false
  };

  const player = {
    x: 3 * TILE, y: 10 * TILE,
    vx: 0, vy: 0, w: 24, h: 32,
    facing: 1, onGround: false,
    coyote: 0, jumpBuf: 0,
    power: 0, starTimer: 0, fireCooldown: 0,
    invuln: 0, anim: 0,
    dead: false, deadTimer: 0,
    winPhase: 0 // 0=无, 1=滑旗杆, 2=走向城堡/王冠
  };

  function getActiveStyleId() {
    return stageStyles[clamp(state.currentZoneIdx, 0, stageStyles.length - 1)] || 0;
  }

  function resetPlayerAt(x, y, keepPower = false) {
    player.x = x; player.y = y;
    player.vx = 0; player.vy = 0;
    player.facing = 1; player.onGround = false;
    player.coyote = 0; player.jumpBuf = 0;
    player.dead = false; player.deadTimer = 0;
    player.winPhase = 0; player.fireCooldown = 0;
    player.starTimer = 0;
    if (!keepPower) {
      player.power = 0; player.h = 32;
    } else {
      player.h = player.power > 0 ? 46 : 32;
    }
    player.invuln = 1.4;
    state.stompCombo = 0;
  }

  function startStage(wIdx, sIdx, keepStats = false) {
    clearKeys();
    AudioSys.init();
    state.worldIdx = clamp(wIdx, 0, 7);
    state.stageIdx = clamp(sIdx, 0, 3);
    state.selectedMapWorld = state.worldIdx;
    buildStage(state.worldIdx, state.stageIdx);
    if (!keepStats) {
      state.lives = Math.max(state.lives, 5);
    }
    state.currentZoneIdx = 0;
    state.checkpointX = 3 * TILE;
    state.checkpointY = 10 * TILE;
    state.camX = 0;
    state.compareMode = false;
    state.paused = false;
    state.bossDefeated = false;
    state.hasPlayedOnce = true;
    state.mode = 'playing';

    resetPlayerAt(3 * TILE, 10 * TILE, keepStats);
    player.invuln = 0;
    closeTitle();
    closeWorldMap();
    closePause();
    hideModal();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    updateHUD();

    const w = WORLDS[state.worldIdx];
    const st = STYLES[stageStyles[0]];
    showToast(`World ${w.num}-${state.stageIdx + 1} · ${w.name}（${st.name}）`);

    leaveLayer();
  }

  function getNextStage(wIdx, sIdx) {
    if (sIdx < 3) return { w: wIdx, s: sIdx + 1 };
    if (wIdx < 7) return { w: wIdx + 1, s: 0 };
    return null; // 全部 32 关大满贯通关！
  }

  function completeCurrentStage() {
    const key = `${state.worldIdx + 1}-${state.stageIdx + 1}`;
    clearedSet.add(key);
    saveProgress();
    renderWorldMapCards();
    state.mode = 'stageclear';

    const w = WORLDS[state.worldIdx];
    const next = getNextStage(state.worldIdx, state.stageIdx);
    if (!next) {
      showModal(
        'GRAND FINALE · 32 关大满贯',
        '传奇诞生！艺术史全破',
        `恭喜你带领马里奥穿越全部 8 大时代世界、24 幅人类艺术画卷与 32 道关卡！\n总分：${state.score} | 金币：${state.coins} 枚 | 已通关：${clearedSet.size}/32`,
        '▶ 重回 1-1 二周目'
      );
    } else {
      const nw = WORLDS[next.w];
      const tag = state.stageIdx === 3 ? `WORLD ${w.num} CLEAR!` : `STAGE ${key} CLEAR!`;
      const title = state.stageIdx === 3 ? `征服 World ${w.num} · ${w.name}！` : `World ${key} 通关！`;
      showModal(
        tag, title,
        `当前总分：${state.score} | 金币：${state.coins} 枚 | 全局进度：${clearedSet.size} / 32\n下一站：World ${nw.num}-${next.s + 1} · ${nw.name}（${STAGE_TYPES[next.s].sub}）`,
        `▶ 下一关 (W${nw.num}-${next.s + 1})`
      );
    }
    updateHUD();
  }

  function spawnPopup(x, y, text, color = '#fde047') {
    popups.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
  }
  function spawnParticles(x, y, count, color, speed = 175) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (0.35 + Math.random() * 0.75) * speed;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90,
        size: 3 + Math.random() * 4, color,
        life: 0.42 + Math.random() * 0.34, maxLife: 0.78
      });
    }
  }

  function shootFireball() {
    if (player.power < 2 || player.fireCooldown > 0 || fireballs.length >= 2) return;
    player.fireCooldown = 0.24;
    AudioSys.sfxFireball();
    fireballs.push({
      x: player.x + (player.facing > 0 ? player.w + 2 : -8),
      y: player.y + 16,
      vx: player.facing * 435, vy: 40, life: 2.2
    });
  }

  function bumpBlock(c, r) {
    const t = getTile(c, r);
    blockBounces[`${r},${c}`] = { y: -10, vy: 70 };
    const bx = c * TILE, by = r * TILE;

    for (const e of enemies) {
      if (e.state === 'squished') continue;
      if (e.x + e.w > bx && e.x < bx + TILE && Math.abs((e.y + e.h) - by) < 10) {
        e.state = 'squished'; e.deadTimer = 0.45;
        state.score += 200; spawnPopup(e.x, e.y - 8, '+200'); AudioSys.sfxStomp();
      }
    }

    if (t === T_Q_COIN) {
      setTile(c, r, T_USED);
      state.coins++; state.score += 100;
      if (state.coins % 100 === 0) { state.lives++; spawnPopup(bx, by - 28, '1UP ❤', '#34d399'); AudioSys.sfxPowerUp(); }
      AudioSys.sfxCoin();
      spawnParticles(bx + 18, by - 8, 8, '#fde047', 140);
      spawnPopup(bx + 6, by - 14, '+100 🪙');
    } else if (t === T_Q_POWER || t === T_Q_FIRE) {
      setTile(c, r, T_USED);
      AudioSys.sfxPowerUp();
      const spawnFlower = (t === T_Q_FIRE) || (player.power >= 1);
      items.push({
        type: spawnFlower ? 'flower' : 'mushroom',
        x: bx + 4, y: by - 4, vx: spawnFlower ? 0 : 90, vy: 0,
        w: 28, h: 28, emergeY: by - 28
      });
    } else if (t === T_Q_STAR) {
      setTile(c, r, T_USED);
      AudioSys.sfxPowerUp();
      items.push({ type: 'star', x: bx + 4, y: by - 4, vx: 135, vy: -320, w: 28, h: 28, emergeY: by - 28 });
    } else if (t === T_BRICK) {
      if (player.power >= 1 || player.starTimer > 0) {
        setTile(c, r, T_AIR);
        state.score += 50;
        AudioSys.sfxBump(true);
        spawnParticles(bx + 18, by + 18, 12, '#d97706', 230);
      } else {
        AudioSys.sfxBump(false);
      }
    } else {
      AudioSys.sfxBump(false);
    }
  }

  function hurtPlayer() {
    if (player.starTimer > 0 || player.invuln > 0 || player.dead || player.winPhase > 0) return;
    if (player.power === 2) {
      player.power = 1; player.invuln = 2.0; AudioSys.sfxHurt();
      spawnParticles(player.x + 12, player.y + 18, 12, '#fb923c', 160);
    } else if (player.power === 1) {
      player.power = 0; player.y += 14; player.h = 32; player.invuln = 2.0; AudioSys.sfxHurt();
      spawnParticles(player.x + 12, player.y + 16, 12, '#ffffff', 160);
    } else {
      killPlayer();
    }
    updateHUD();
  }

  function killPlayer() {
    if (player.dead) return;
    player.dead = true; player.deadTimer = 1.15;
    player.vx = 0; player.vy = -440; player.starTimer = 0;
    state.lives--;
    AudioSys.sfxHurt();
    updateHUD();
  }

  function triggerBossVictory(byAxe) {
    if (state.bossDefeated) return;
    state.bossDefeated = true;
    if (axe) axe.active = false;
    if (boss) { boss.alive = false; boss.falling = true; boss.vy = -120; }
    bossFires = [];
    state.score += byAxe ? 3000 : 4000;
    AudioSys.sfxBossRoar();
    AudioSys.sfxWin();
    if (boss) spawnParticles(boss.x + 28, boss.y + 32, 32, '#fde047', 270);
    showToast(byAxe ? '金色战斧斩断吊桥！魔王坠落深渊！' : '烈焰击败世界魔王！快冲向终点王冠！');
    if (byAxe) bridgeCollapseTimer = 0.04;
  }

  function updatePhysics(dt, vw) {
    state.time += dt;
    if (state.frameFlash > 0) state.frameFlash = Math.max(0, state.frameFlash - dt * 2.4);

    for (const k in blockBounces) {
      const b = blockBounces[k];
      b.y += b.vy * dt;
      if (b.y >= 0) delete blockBounces[k];
    }
    for (const sp of springs) if (sp.compress > 0) sp.compress = Math.max(0, sp.compress - dt * 5.2);
    for (const pl of platforms) {
      pl.prevX = pl.x; pl.prevY = pl.y;
      pl.x = pl.x0 + Math.sin(state.time * pl.speed + pl.phase) * pl.dxAmp;
      pl.y = pl.y0 + Math.sin(state.time * pl.speed + pl.phase) * pl.dyAmp;
    }
    for (const cr of crumbles) {
      if (cr.state === 'shake') {
        cr.timer -= dt;
        if (cr.timer <= 0) {
          cr.state = 'gone'; cr.timer = 3.2;
          AudioSys.sfxCrumble();
          spawnParticles(cr.x + 18, cr.y + 8, 7, '#fde047', 110);
        }
      } else if (cr.state === 'gone') {
        cr.timer -= dt;
        if (cr.timer <= 0) cr.state = 'idle';
      }
    }
    for (const fb of firebars) fb.angle += fb.speed * dt;

    if (bridgeCollapseTimer > 0 && bridgeCols.length > 0) {
      bridgeCollapseTimer -= dt;
      if (bridgeCollapseTimer <= 0) {
        const col = bridgeCols.pop();
        setTile(col, 12, T_AIR);
        spawnParticles(col * TILE + 18, 12 * TILE + 10, 7, '#facc15', 140);
        bridgeCollapseTimer = 0.042;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 580 * dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 42 * dt; p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }

    if (state.mode !== 'playing') return;

    if (player.dead) {
      player.y += player.vy * dt;
      player.vy += 1250 * dt;
      player.deadTimer -= dt;
      if (player.deadTimer <= 0) {
        if (state.lives > 0) {
          resetPlayerAt(state.checkpointX, state.checkpointY, false);
          state.camX = Math.max(0, state.checkpointX - vw * 0.32);
          showToast(`检查点复活 · 剩余生命 ${state.lives}`);
        } else {
          state.mode = 'gameover';
          state.lives = 5;
          showModal(
            `WORLD ${state.worldIdx + 1}-${state.stageIdx + 1}`,
            '画卷暂歇 · 再战一局',
            `当前总分：${state.score} | 金币：${state.coins} 枚\n已为你补充 5 条生命，随时可以继续挑战或切换其他世界！`,
            '↺ 重新挑战本关'
          );
        }
      }
      return;
    }

    // 旗杆过关演出
    if (player.winPhase === 1 && flagpole) {
      player.x = flagpole.x - player.w * 0.5;
      player.y += 195 * dt;
      flagpole.flagY = Math.min(flagpole.botY - 26, flagpole.flagY + 195 * dt);
      if (player.y + player.h >= flagpole.botY) {
        player.y = flagpole.botY - player.h;
        player.winPhase = 2;
      }
      return;
    } else if (player.winPhase === 2) {
      player.x += 130 * dt;
      player.anim += dt * 11;
      if (player.y + player.h < 13 * TILE) {
        player.vy += 1200 * dt;
        player.y = Math.min(13 * TILE - player.h, player.y + player.vy * dt);
      }
      const targetEnd = isBossStage ? trophyX : (castle.x + 54);
      if (player.x >= targetEnd) {
        completeCurrentStage();
      }
      return;
    }

    if (player.starTimer > 0) {
      player.starTimer = Math.max(0, player.starTimer - dt);
      if (Math.random() < 0.42) {
        const cols = ['#fde047', '#38bdf8', '#f472b6', '#4ade80'];
        spawnParticles(player.x + 12, player.y + 16, 1, cols[Math.floor(Math.random() * 4)], 80);
      }
    }
    if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);
    if (player.fireCooldown > 0) player.fireCooldown = Math.max(0, player.fireCooldown - dt);

    if (fireJustPressed) {
      fireJustPressed = false;
      shootFireball();
    }

    const starBoost = player.starTimer > 0 ? 1.24 : 1.0;
    const jumpHeld = keys.jump || actionPointers.has(padJump);
    const running = keys.fire || actionPointers.has(padFire);
    const direction = movingPointer ? dragDirection : Number(keys.right) - Number(keys.left);
    const maxSpeed = (running ? 325 : 245) * starBoost;
    const accel = (player.onGround ? 1650 : 1120) * starBoost;
    const decel = player.onGround ? 1420 : 220;

    if (direction !== 0) {
      player.vx += direction * accel * dt;
      player.facing = direction;
    }
    else {
      if (Math.abs(player.vx) <= decel * dt) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * decel * dt;
    }
    player.vx = clamp(player.vx, -maxSpeed, maxSpeed);

    if (player.onGround) { player.coyote = 0.12; state.stompCombo = 0; }
    else player.coyote = Math.max(0, player.coyote - dt);

    if (jumpJustPressed) { player.jumpBuf = 0.14; jumpJustPressed = false; }
    else player.jumpBuf = Math.max(0, player.jumpBuf - dt);

    if (player.jumpBuf > 0 && player.coyote > 0) {
      const speedBonus = clamp((Math.abs(player.vx) - 140) / 180, 0, 1) * 50;
      player.vy = -(688 + speedBonus);
      player.onGround = false; player.coyote = 0; player.jumpBuf = 0;
      AudioSys.sfxJump(player.power > 0);
      spawnParticles(player.x + 12, player.y + player.h, 5, 'rgba(255,255,255,0.8)', 90);
    }

    if (!jumpHeld && player.vy < -260) player.vy += 1350 * dt;
    player.vy = Math.min(820, player.vy + (player.vy < 0 ? 1420 : 1580) * dt);

    // X 碰撞
    const prevCenterX = player.x + player.w * 0.5;
    const prevFootY = player.y + player.h;
    player.x += player.vx * dt;
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    if (player.x > WORLD_W - player.w) { player.x = WORLD_W - player.w; player.vx = 0; }

    const topR = Math.floor((player.y + 3) / TILE);
    const botR = Math.floor((player.y + player.h - 3) / TILE);
    if (player.vx > 0) {
      const rightC = Math.floor((player.x + player.w) / TILE);
      for (let r = topR; r <= botR; r++) {
        if (isSolid(getTile(rightC, r))) { player.x = rightC * TILE - player.w - 0.01; player.vx = 0; break; }
      }
    } else if (player.vx < 0) {
      const leftC = Math.floor(player.x / TILE);
      for (let r = topR; r <= botR; r++) {
        if (isSolid(getTile(leftC, r))) { player.x = (leftC + 1) * TILE + 0.01; player.vx = 0; break; }
      }
    }

    // Y 碰撞（地形 + 浮台 + 塌陷云桥）
    player.y += player.vy * dt;
    player.onGround = false;
    const leftC = Math.floor((player.x + 3) / TILE);
    const rightC = Math.floor((player.x + player.w - 3) / TILE);

    if (player.vy >= 0) {
      const footR = Math.floor((player.y + player.h) / TILE);
      for (let c = leftC; c <= rightC; c++) {
        if (isSolid(getTile(c, footR))) {
          player.y = footR * TILE - player.h; player.vy = 0; player.onGround = true; break;
        }
      }
      if (!player.onGround) {
        for (const pl of platforms) {
          if (player.x + player.w - 3 > pl.x && player.x + 3 < pl.x + pl.w) {
            if (prevFootY <= pl.prevY + 12 && player.y + player.h >= pl.y - 2) {
              player.y = pl.y - player.h; player.vy = 0; player.onGround = true;
              player.x = clamp(player.x + (pl.x - pl.prevX), 0, WORLD_W - player.w);
              break;
            }
          }
        }
      }
      if (!player.onGround) {
        for (const cr of crumbles) {
          if (cr.state === 'gone') continue;
          if (player.x + player.w - 3 > cr.x && player.x + 3 < cr.x + cr.w) {
            if (prevFootY <= cr.y + 12 && player.y + player.h >= cr.y - 2) {
              player.y = cr.y - player.h; player.vy = 0; player.onGround = true;
              if (cr.state === 'idle') { cr.state = 'shake'; cr.timer = 0.55; }
              break;
            }
          }
        }
      }
    } else {
      const headR = Math.floor(player.y / TILE);
      const hitCols = [];
      for (let c = leftC; c <= rightC; c++) if (isSolid(getTile(c, headR))) hitCols.push(c);
      if (hitCols.length > 0) {
        player.y = (headR + 1) * TILE + 0.01; player.vy = 20;
        const pMid = player.x + player.w * 0.5;
        hitCols.sort((a, b) => Math.abs((a + 0.5) * TILE - pMid) - Math.abs((b + 0.5) * TILE - pMid));
        bumpBlock(hitCols[0], headR);
      }
    }

    // 弹簧弹射
    for (const sp of springs) {
      if (player.x + player.w - 2 > sp.x && player.x + 2 < sp.x + sp.w &&
          player.y + player.h >= sp.y && player.y + player.h <= sp.y + sp.h + 8 && player.vy >= -20) {
        sp.compress = 1.0;
        player.y = sp.y - player.h - 1;
        player.vy = (jumpHeld || player.jumpBuf > 0) ? -920 : -770;
        player.onGround = false; player.coyote = 0; player.jumpBuf = 0;
        AudioSys.sfxSpring();
        spawnParticles(sp.x + 15, sp.y, 10, '#fde047', 170);
        spawnPopup(sp.x + 12, sp.y - 12, 'BOING!', '#38bdf8');
      }
    }

    if (player.y > VH + 52) { killPlayer(); return; }
    if (player.onGround && Math.abs(player.vx) > 12) player.anim += Math.abs(player.vx) * dt * 0.06;
    else if (player.onGround) player.anim = 0;

    // 穿越实体画框判定
    const curCenterX = player.x + player.w * 0.5;
    let newZ = 0;
    for (let i = 0; i < frameXs.length; i++) {
      if (curCenterX >= frameXs[i]) newZ = i + 1;
      const fx = frameXs[i];
      if ((prevCenterX < fx && curCenterX >= fx) || (prevCenterX >= fx && curCenterX < fx)) {
        AudioSys.sfxFrameCross();
        state.frameFlash = 1.0;
        spawnParticles(fx, player.y + player.h * 0.5, 18, '#fde047', 220);
        if (curCenterX >= fx) {
          state.checkpointX = fx + 12;
          state.checkpointY = Math.min(player.y, 10 * TILE);
          state.score += 300;
          const nextSt = STYLES[stageStyles[i + 1]];
          spawnPopup(fx - 15, player.y - 16, `→ ${nextSt.name}`, '#fde047');
          showToast(`穿过画框 → ${nextSt.num} ${nextSt.name}（检查点已保存）`);
        }
      }
    }
    if (newZ !== state.currentZoneIdx) {
      state.currentZoneIdx = newZ;
      updateHUD();
    }

    // 金币收集
    for (const c of coins) {
      if (c.taken) continue;
      if (Math.hypot(curCenterX - c.x, (player.y + player.h * 0.5) - c.y) < 25) {
        c.taken = true; state.coins++; state.score += 100;
        AudioSys.sfxCoin();
        spawnParticles(c.x, c.y, 6, '#fde047', 120);
      }
    }

    // 道具更新
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.y > it.emergeY && it.type !== 'star') {
        it.y = Math.max(it.emergeY, it.y - 68 * dt);
      } else if (it.type === 'mushroom' || it.type === 'star') {
        it.vy = Math.min(620, it.vy + 1150 * dt);
        it.x += it.vx * dt;
        const sideC = Math.floor((it.vx > 0 ? it.x + it.w : it.x) / TILE);
        if (isSolid(getTile(sideC, Math.floor((it.y + it.h * 0.5) / TILE)))) it.vx = -it.vx;
        it.y += it.vy * dt;
        const fR = Math.floor((it.y + it.h) / TILE);
        if (isSolid(getTile(Math.floor((it.x + it.w * 0.5) / TILE), fR))) {
          it.y = fR * TILE - it.h;
          it.vy = it.type === 'star' ? -430 : 0;
        }
      }
      if (player.x < it.x + it.w && player.x + player.w > it.x && player.y < it.y + it.h && player.y + player.h > it.y) {
        items.splice(i, 1); state.score += 1000; AudioSys.sfxPowerUp();
        if (it.type === 'star') {
          player.starTimer = 9.0;
          spawnPopup(player.x, player.y - 18, '★ INVINCIBLE! ★', '#fde047');
        } else if (it.type === 'flower') {
          if (player.power === 0) { player.y -= 14; player.h = 46; }
          player.power = 2;
          spawnPopup(player.x, player.y - 16, 'FIRE POWER! 🔥', '#fb923c');
        } else {
          if (player.power === 0) { player.power = 1; player.y -= 14; player.h = 46; }
          spawnPopup(player.x, player.y - 16, 'SUPER +1000!', '#fb7185');
        }
        updateHUD();
      }
    }

    // 管道食人花
    for (const pi of piranhas) {
      if (!pi.alive || Math.abs(pi.x - state.camX) > vw + 180) continue;
      const cycle = pi.timer % 4.2;
      const near = Math.abs(curCenterX - (pi.x + 14)) < 46;
      if (!(cycle < 1.2 && near)) pi.timer += dt;
      const c = pi.timer % 4.2;
      const emerge = c < 1.2 ? 0 : (c < 1.8 ? (c - 1.2) / 0.6 : (c < 3.4 ? 1 : 1 - (c - 3.4) / 0.8));
      pi.y = pi.baseY + 4 - emerge * pi.h;
      if (emerge > 0.25 && player.x + 4 < pi.x + pi.w - 4 && player.x + player.w - 4 > pi.x + 4 &&
          player.y + 4 < pi.baseY && player.y + player.h - 2 > pi.y + 4) {
        if (player.starTimer > 0) { pi.alive = false; state.score += 300; AudioSys.sfxStomp(); }
        else hurtPlayer();
      }
    }

    // 炮台 & 炮弹
    for (const cn of cannons) {
      const cx = cn.col * TILE, dist = Math.abs(cx - curCenterX);
      if (dist > 70 && dist < vw * 0.78) {
        cn.cooldown -= dt;
        if (cn.cooldown <= 0) {
          cn.cooldown = Math.max(1.8, 2.9 - state.worldIdx * 0.12);
          const dir = curCenterX < cx ? -1 : 1;
          bullets.push({ x: cx + (dir > 0 ? TILE : -26), y: cn.topRow * TILE + 6, vx: dir * (225 + state.worldIdx * 8), w: 28, h: 22 });
          AudioSys.sfxCannon();
        }
      }
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt;
      if (Math.abs(b.x - state.camX) > vw + 260) { bullets.splice(i, 1); continue; }
      if (player.x + 2 < b.x + b.w && player.x + player.w - 2 > b.x && player.y + 2 < b.y + b.h && player.y + player.h > b.y) {
        const isStomp = player.vy > 0 && (player.y + player.h - player.vy * dt) <= b.y + b.h * 0.65;
        if (player.starTimer > 0 || isStomp) {
          if (isStomp && player.starTimer <= 0) player.vy = jumpHeld ? -540 : -390;
          state.score += 300; AudioSys.sfxStomp();
          spawnParticles(b.x + 14, b.y + 11, 10, '#fde047', 160);
          spawnPopup(b.x, b.y - 12, '+300', '#38bdf8');
          bullets.splice(i, 1);
        } else hurtPlayer();
      }
    }

    // 旋转火棒伤害
    if (player.starTimer <= 0) {
      const pCx = player.x + 12, pCy = player.y + player.h * 0.5;
      for (const fb of firebars) {
        if (Math.abs(fb.cx - pCx) > 150) continue;
        for (let k = 1; k <= fb.count; k++) {
          const fx = fb.cx + Math.cos(fb.angle) * (k * fb.radiusStep);
          const fy = fb.cy + Math.sin(fb.angle) * (k * fb.radiusStep);
          if (Math.hypot(pCx - fx, pCy - fy) < 15.5) { hurtPlayer(); break; }
        }
      }
    }

    // 玩家火球
    for (let i = fireballs.length - 1; i >= 0; i--) {
      const fb = fireballs[i];
      fb.life -= dt; fb.vy += 1250 * dt; fb.x += fb.vx * dt; fb.y += fb.vy * dt;
      let exp = fb.life <= 0 || fb.y > VH + 20 || Math.abs(fb.x - state.camX) > vw + 120;
      const rHit = Math.floor((fb.y + 6) / TILE);
      if (!exp && isSolid(getTile(Math.floor(fb.x / TILE), rHit))) {
        if (Math.floor((fb.y - fb.vy * dt + 6) / TILE) < rHit && fb.vy > 0) { fb.y = rHit * TILE - 7; fb.vy = -310; }
        else exp = true;
      }
      if (!exp) {
        for (const e of enemies) {
          if (e.state === 'squished') continue;
          if (fb.x + 7 > e.x && fb.x - 7 < e.x + e.w && fb.y + 7 > e.y && fb.y - 7 < e.y + e.h) {
            e.state = 'squished'; e.deadTimer = 0.28; state.score += 200; AudioSys.sfxStomp();
            spawnParticles(e.x + 14, e.y + 14, 10, '#fb923c', 170); exp = true; break;
          }
        }
      }
      if (!exp) {
        for (const pi of piranhas) {
          if (!pi.alive) continue;
          if (pi.baseY - pi.y > 8 && fb.x + 7 > pi.x && fb.x - 7 < pi.x + pi.w && fb.y + 7 > pi.y && fb.y - 7 < pi.baseY) {
            pi.alive = false; state.score += 300; AudioSys.sfxStomp(); exp = true; break;
          }
        }
      }
      if (!exp && boss && boss.alive && fb.x + 7 > boss.x && fb.x - 7 < boss.x + boss.w && fb.y + 7 > boss.y && fb.y - 7 < boss.y + boss.h) {
        boss.hp--; boss.hurtFlash = 0.26; AudioSys.sfxStomp();
        spawnParticles(fb.x, fb.y, 12, '#f43f5e', 180);
        spawnPopup(boss.x + 20, boss.y - 12, `HP ${boss.hp}/${boss.maxHp}`, '#fda4af');
        exp = true;
        if (boss.hp <= 0) triggerBossVictory(false);
      }
      if (exp) { spawnParticles(fb.x, fb.y, 6, '#fde047', 110); fireballs.splice(i, 1); }
    }

    // 敌人 AI
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.state === 'squished') { e.deadTimer -= dt; if (e.deadTimer <= 0) enemies.splice(i, 1); continue; }
      if (Math.abs(e.x - state.camX) > vw + 260) continue;

      e.anim += dt * (e.state === 'slide' ? 16 : 6.5);
      e.vy = Math.min(680, e.vy + (e.type === 'paratroopa' && e.state === 'walk' ? 920 : 1350) * dt);
      e.x += e.vx * dt;
      if (isSolid(getTile(Math.floor((e.vx > 0 ? e.x + e.w : e.x) / TILE), Math.floor((e.y + e.h * 0.5) / TILE)))) {
        e.vx = -e.vx; e.facing = Math.sign(e.vx);
      }
      e.y += e.vy * dt;
      const footR = Math.floor((e.y + e.h) / TILE);
      if (isSolid(getTile(Math.floor((e.x + e.w * 0.5) / TILE), footR))) {
        e.y = footR * TILE - e.h;
        e.vy = (e.type === 'paratroopa' && e.state === 'walk') ? -410 : 0;
        if (e.state === 'walk' && !isSolid(getTile(Math.floor((e.vx > 0 ? e.x + e.w + 4 : e.x - 4) / TILE), footR))) {
          e.vx = -e.vx; e.facing = Math.sign(e.vx);
        }
      }
      if (e.y > VH + 60) { enemies.splice(i, 1); continue; }

      if (e.state === 'slide') {
        for (const o of enemies) {
          if (o === e || o.state === 'squished') continue;
          if (e.x < o.x + o.w && e.x + e.w > o.x && e.y < o.y + o.h && e.y + e.h > o.y) {
            o.state = 'squished'; o.deadTimer = 0.4; state.score += 200; AudioSys.sfxStomp();
          }
        }
      }
      if (player.x + 2 < e.x + e.w && player.x + player.w - 2 > e.x && player.y + 2 < e.y + e.h && player.y + player.h > e.y) {
        if (player.starTimer > 0) {
          e.state = 'squished'; e.deadTimer = 0.25; state.score += 400; AudioSys.sfxStomp();
          spawnPopup(e.x, e.y - 12, '★ +400', '#fde047');
        } else {
          const isStomp = player.vy > 0 && (player.y + player.h - player.vy * dt) <= e.y + e.h * 0.65;
          if (e.state === 'shell') {
            e.state = 'slide'; e.vx = (curCenterX < e.x + 14 ? 1 : -1) * 380; e.x += Math.sign(e.vx) * 8; AudioSys.sfxStomp();
          } else if (isStomp) {
            player.vy = jumpHeld ? -460 : -330;
            state.stompCombo++;
            const pts = Math.min(1000, 100 * Math.pow(2, state.stompCombo - 1));
            state.score += pts; AudioSys.sfxStomp();
            spawnPopup(e.x, e.y - 12, `+${pts}`);
            if (e.type === 'goomba') { e.state = 'squished'; e.deadTimer = 0.4; e.vx = 0; }
            else if (e.type === 'paratroopa') { e.type = 'koopa'; e.vy = 0; }
            else { e.state = 'shell'; e.vx = 0; e.h = 24; e.y += 12; }
          } else hurtPlayer();
        }
      }
    }

    // 魔王 AI 与战斧判定
    if (boss) {
      if (boss.hurtFlash > 0) boss.hurtFlash = Math.max(0, boss.hurtFlash - dt);
      if (boss.falling) {
        boss.vy += 1250 * dt; boss.y += boss.vy * dt;
      } else if (boss.alive && Math.abs(boss.x - curCenterX) < vw * 0.85) {
        boss.x += boss.vx * dt;
        if (boss.x < boss.minX) { boss.x = boss.minX; boss.vx = Math.abs(boss.vx); }
        if (boss.x > boss.maxX) { boss.x = boss.maxX; boss.vx = -Math.abs(boss.vx); }
        boss.vy = Math.min(680, boss.vy + 1150 * dt);
        boss.y += boss.vy * dt;
        const bridgeY = 12 * TILE;
        if (boss.y + boss.h >= bridgeY) { boss.y = bridgeY - boss.h; boss.vy = 0; }

        boss.jumpCD -= dt;
        if (boss.jumpCD <= 0 && boss.y + boss.h >= bridgeY - 2) {
          boss.vy = -485;
          boss.jumpCD = Math.max(1.2, 2.4 - state.worldIdx * 0.14) + Math.random() * 0.8;
        }
        boss.fireCD -= dt;
        if (boss.fireCD <= 0) {
          boss.fireCD = Math.max(1.1, 2.3 - state.worldIdx * 0.14) + Math.random() * 0.7;
          const dir = curCenterX < boss.x + 28 ? -1 : 1;
          bossFires.push({ x: boss.x + (dir < 0 ? -12 : boss.w + 4), y: boss.y + 18 + (Math.random() > 0.5 ? 20 : 0), vx: dir * (225 + state.worldIdx * 12), w: 28, h: 14, life: 3.2 });
          AudioSys.sfxBossRoar();
        }
        if (player.x + 4 < boss.x + boss.w - 4 && player.x + player.w - 4 > boss.x + 4 &&
            player.y + 4 < boss.y + boss.h - 4 && player.y + player.h - 4 > boss.y + 4) {
          if (player.starTimer > 0) triggerBossVictory(false);
          else hurtPlayer();
        }
      }
    }
    for (let i = bossFires.length - 1; i >= 0; i--) {
      const bf = bossFires[i];
      bf.x += bf.vx * dt; bf.life -= dt;
      if (bf.life <= 0) { bossFires.splice(i, 1); continue; }
      if (player.x + 3 < bf.x + bf.w && player.x + player.w - 3 > bf.x && player.y + 3 < bf.y + bf.h && player.y + player.h - 3 > bf.y) {
        hurtPlayer(); bossFires.splice(i, 1);
      }
    }
    if (axe && axe.active && player.x < axe.x + axe.w && player.x + player.w > axe.x && player.y < axe.y + axe.h && player.y + player.h > axe.y) {
      triggerBossVictory(true);
      player.winPhase = 2;
    }
    if (isBossStage && state.bossDefeated && curCenterX >= trophyX) {
      completeCurrentStage();
      return;
    }

    // 普通关旗杆终点判定
    if (flagpole && Math.abs(curCenterX - flagpole.x) < 16 && player.y + player.h >= flagpole.topY) {
      player.winPhase = 1; player.vx = 0; player.vy = 0;
      const bonus = Math.round(clamp((flagpole.botY - player.y) / (flagpole.botY - flagpole.topY), 0.1, 1) * 2000);
      state.score += bonus;
      AudioSys.sfxWin();
      spawnParticles(flagpole.x, player.y, 26, '#fde047', 250);
      spawnPopup(flagpole.x - 24, player.y - 20, `FLAG +${bonus}!`, '#fde047');
    }

    const targetCam = clamp(player.x - vw * 0.36, 0, Math.max(0, WORLD_W - vw));
    state.camX = lerp(state.camX, targetCam, Math.min(1, dt * 8.5));
  }

     六、全部 24 种独立艺术画风调色板与场景渲染引擎
     ========================================================================= */
  function wrapX(base, camX, factor, span) {
    let x = (base - camX * factor) % span;
    if (x < -span * 0.25) x += span;
    return x;
  }

  function drawHills(ctx, vw, baseY, camX, factor, amp, freq, color, stroke) {
    ctx.beginPath(); ctx.moveTo(0, VH);
    for (let x = 0; x <= vw + 24; x += 24) {
      const wx = x + camX * factor;
      ctx.lineTo(x, baseY - Math.sin(wx * freq) * amp - Math.cos(wx * freq * 2.1) * amp * 0.38);
    }
    ctx.lineTo(vw, VH); ctx.closePath();
    if (color) { ctx.fillStyle = color; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.8; ctx.stroke(); }
  }

  function bakeTexturedBase(texture, fill) {
    return makePatternCanvas(texture.width, (base, width) => {
      if (typeof fill === 'string') {
        base.fillStyle = fill;
      } else {
        const gradient = base.createLinearGradient(0, 0, 0, VH);
        for (const [offset, color] of fill) gradient.addColorStop(offset, color);
        base.fillStyle = gradient;
      }
      base.fillRect(0, 0, width, VH);
      base.fillStyle = base.createPattern(texture, 'repeat');
      base.fillRect(0, 0, width, VH);
    }, VH);
  }

  // 24 种独立艺术背景渲染器
  function renderStyleBackground(ctx, id, camX, vw, t) {
    const gY = 13 * TILE;
    const span = vw + 340;

    if (id === 0) { // 撒哈拉岩画
      ctx.fillStyle = backgroundPatterns.sahara; ctx.fillRect(0, 0, vw, VH);
      drawHills(ctx, vw, gY - 56, camX, 0.16, 48, 0.0045, '#b0743d');
      ctx.strokeStyle = 'rgba(116, 36, 18, 0.42)'; ctx.fillStyle = 'rgba(116, 36, 18, 0.42)'; ctx.lineWidth = 3;
      for (let i = 0; i < 5; i++) {
        const ax = wrapX(i * (span / 5), camX, 0.36, span) - 80, ay = gY - 76 - (i % 2) * 38;
        ctx.beginPath(); ctx.ellipse(ax, ay, 18, 8, -0.1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(ax - 12, ay + 5); ctx.lineTo(ax - 18, ay + 24); ctx.moveTo(ax + 12, ay + 5); ctx.lineTo(ax + 18, ay + 24); ctx.stroke();
      }
    } else if (id === 1) { // 古埃及壁画
      ctx.fillStyle = '#e7d5a8'; ctx.fillRect(0, 0, vw, VH);
      ctx.fillStyle = '#1b4b72'; ctx.fillRect(0, 0, vw, 18);
      ctx.fillStyle = '#d4a238'; ctx.fillRect(0, 18, vw, 4);
      for (let i = 0; i < 4; i++) {
        const px = wrapX(i * ((vw + 420) / 4), camX, 0.14, vw + 420) - 100, ph = 95 + (i % 2) * 50;
        ctx.fillStyle = '#c9a155'; ctx.beginPath(); ctx.moveTo(px - ph, gY); ctx.lineTo(px, gY - ph); ctx.lineTo(px + ph, gY); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#a87f39'; ctx.beginPath(); ctx.moveTo(px, gY - ph); ctx.lineTo(px + ph, gY); ctx.lineTo(px + ph * 0.25, gY); ctx.closePath(); ctx.fill();
      }
    } else if (id === 2) { // 希腊黑绘陶瓶
      const g = ctx.createLinearGradient(0, 0, vw, 0);

  function applyGlow(ctx, color, radius) {
    if (mobileRendering) return;
    ctx.shadowColor = color;
    ctx.shadowBlur = radius;
  }

  function drawTileStyled(ctx, t, sx, sy, pal, time) {
    if (t === T_AIR || t === T_PIPE) return;
    ctx.save();
    if (pal.glow) applyGlow(ctx, pal.glow, 7);
    if (t === T_GROUND) {
      ctx.fillStyle = pal.gBody; ctx.fillRect(sx, sy, TILE, TILE);
      if (sy === 13 * TILE) { ctx.fillStyle = pal.gTop; ctx.fillRect(sx, sy, TILE, 7); }

      if (pal.ascii) { ctx.fillStyle = '#4ade80'; ctx.font = 'bold 11px ui-monospace, monospace'; ctx.fillText('##', sx + 10, sy + 23); }
    } else if (t === T_BRICK) {
      ctx.fillStyle = pal.brick; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = pal.bLine; ctx.lineWidth = 2; ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
      if (pal.ascii) { ctx.fillStyle = '#4ade80'; ctx.font = 'bold 11px ui-monospace, monospace'; ctx.fillText('[]', sx + 10, sy + 23); }
      else {
        ctx.beginPath(); ctx.moveTo(sx, sy + 18); ctx.lineTo(sx + TILE, sy + 18);
        ctx.moveTo(sx + 18, sy); ctx.lineTo(sx + 18, sy + 18); ctx.stroke();
      }

      ctx.fillStyle = pal.q; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = pal.bLine; ctx.lineWidth = 2.1; ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);

      ctx.font = '900 19px ui-monospace, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(t === T_Q_STAR ? '★' : (t === T_Q_FIRE ? '✦' : '?'), sx + 18, sy + 19);
    } else if (t === T_USED) {
      ctx.fillStyle = pal.used; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = pal.bLine; ctx.lineWidth = 2; ctx.strokeRect(sx + 1, sy + 1, TILE - 2, TILE - 2);

  function renderWorldInStyle(ctx, styleId, camX, vw, left = 0, right = vw) {
    const pal = PALETTES[styleId];
    const t = state.time;
    renderStyleBackground(ctx, styleId, camX, vw, t);

    const c0 = Math.max(0, Math.floor((camX + left) / TILE) - 1);
    const c1 = Math.min(TOTAL_COLS - 1, Math.ceil((camX + right) / TILE) + 1);
    for (let r = 0; r < ROWS; r++) {
      for (let c = c0; c <= c1; c++) {
        const ti = grid[r][c];
        if (ti === T_AIR || ti === T_PIPE) continue;
        const b = blockBounces[`${r},${c}`];
        drawTileStyled(ctx, ti, c * TILE - camX, r * TILE + (b ? b.y : 0), pal, t);
      }
    }

    // 食人花（先于管道绘制）
    for (const pi of piranhas) {
      if (!pi.alive || pi.x - camX < -60 || pi.x - camX > vw + 60) continue;
      const vh = pi.baseY - pi.y;
      if (vh <= 2) continue;
      const x = pi.x - camX;
      ctx.save();
      ctx.beginPath(); ctx.rect(x - 10, pi.y - 10, pi.w + 20, vh + 10); ctx.clip();
      ctx.fillStyle = '#16a34a'; ctx.strokeStyle = pal.out; ctx.lineWidth = 2;
      ctx.fillRect(x + 10, pi.y + 18, 8, pi.h); ctx.strokeRect(x + 10, pi.y + 18, 8, pi.h);
      const bite = 0.25 + 0.32 * Math.abs(Math.sin(t * 8));
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.moveTo(x + 14, pi.y + 12); ctx.arc(x + 14, pi.y + 12, 13, -Math.PI * 0.5 + bite, Math.PI * 1.5 - bite); ctx.closePath(); ctx.fill(); ctx.stroke();
