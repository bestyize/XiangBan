<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {"page": "#EDEDED", "card": "#FFFFFF", "fill": "#F2F2F2", "text": "#222222", "sub": "#666666", "line": "#EDEDED", "off": "#CFCFCF", "bar": "#D9D9D9"}, D = {"page": "#111111", "card": "#1C1C1E", "fill": "#2C2C2E", "text": "#ECECEC", "sub": "#9A9AA0", "line": "rgba(255,255,255,.08)", "off": "#3A3A3C", "bar": "#3A3A3C"};
    const ACC = [{"id": "red", "name": "小伴红", "l": {"btn": "#E3203C", "hi": "#F0506A", "soft": "#FFF3F4", "ink": "#E3203C"}, "d": {"btn": "#EE4B5F", "hi": "#F76B7D", "soft": "#3A2225", "ink": "#FF8C91"}}, {"id": "green", "name": "薄荷绿", "l": {"btn": "#2E8B5E", "hi": "#3FA172", "soft": "#E3F2E9", "ink": "#1E6A45"}, "d": {"btn": "#34A36D", "hi": "#48B981", "soft": "#1D3328", "ink": "#72D6A2"}}, {"id": "blue", "name": "海湾蓝", "l": {"btn": "#2F6FDB", "hi": "#4A84E6", "soft": "#E6EEFC", "ink": "#1D53AE"}, "d": {"btn": "#3B7BE8", "hi": "#5A92F0", "soft": "#1E2A42", "ink": "#8DB6FF"}}, {"id": "purple", "name": "暮紫", "l": {"btn": "#7152D8", "hi": "#8669E3", "soft": "#EDE8FC", "ink": "#5537B8"}, "d": {"btn": "#8466E6", "hi": "#9A80EE", "soft": "#2A2342", "ink": "#BBA8FF"}}, {"id": "amber", "name": "琥珀", "l": {"btn": "#A8640C", "hi": "#BD7A1C", "soft": "#FAEEDB", "ink": "#87500A"}, "d": {"btn": "#C27A1A", "hi": "#D69130", "soft": "#3A2C17", "ink": "#F0B65A"}}, {"id": "graphite", "name": "石墨", "l": {"btn": "#2B2B30", "hi": "#4A4A50", "soft": "#E9E9EC", "ink": "#2B2B30"}, "d": {"btn": "#636368", "hi": "#7C7C82", "soft": "#3A3A3D", "ink": "#E5E5EA"}}];
    const st = this.state || {};
    const mode = st.mode || 'system';
    const dark = mode === 'dark';
    const p = dark ? D : L;
    const a = ACC[0];
    const btn = dark ? a.d.btn : a.l.btn;
    const out = {
      page: p.page, card: p.card, text: p.text, sub: p.sub, btn,
      radio: dark ? '#5A5A5E' : '#C8C8C8',
      btnL: a.l.btn, softL: a.l.soft, inkL: a.l.ink, btnD: a.d.btn, softD: a.d.soft, inkD: a.d.ink
    };
    ['system', 'light', 'dark'].forEach((m) => {
      const on = mode === m;
      out['set_' + m] = () => this.setState({ mode: m });
      out['on_' + m] = on;
      out['ring_' + m] = on ? btn : 'transparent';
      out['w_' + m] = on ? 600 : 400;
      out['rbg_' + m] = on ? btn : 'transparent';
      out['rbd_' + m] = on ? btn : out.radio;
      out['rck_' + m] = on ? '#fff' : 'transparent';
    });
    return out;
  }
}
</script>
