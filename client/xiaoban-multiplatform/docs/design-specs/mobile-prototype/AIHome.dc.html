<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小伴AI 首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}
button,input{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:1040px;box-sizing:border-box;background:#EDEDED;color:#222222;font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<header style="flex:none;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#F7F7F7">
<button type="button" onClick="{{openDrawer}}" aria-label="对话列表" style="width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#222222">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
</button>
<h1 style="margin:0;font-size:16px;font-weight:600">小伴AI</h1>
<span style="width:44px;height:44px"></span>
</header>

<main style="flex:1;min-height:0;overflow:hidden;box-sizing:border-box;padding:0 16px 96px;display:flex;flex-direction:column">

<section style="flex:none;padding-top:12px">
<h2 style="margin:0;font-size:24px;font-weight:600;line-height:1.3">你好，想做点什么？</h2>
<p style="margin:6px 0 0;font-size:14px;line-height:1.5;color:#666666">问问题、办点事，或者做一个桌面装扮</p>
</section>

<a href="Studio.dc.html" aria-label="开始对话" style="flex:none;display:block;margin-top:16px;background:#FFFFFF;border-radius:20px;padding:14px 16px;text-decoration:none;color:#222222;box-shadow:0 2px 12px rgba(0,0,0,.06)">
<div style="font-size:15px;line-height:1.5;color:#666666">问点什么，或描述想要的装扮、游戏…</div>
<div style="margin-top:14px;display:flex;align-items:center;gap:8px">
<span style="background:none;flex:none;width:36px;height:36px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;color:#666666">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</span>
<span style="background:#F2F2F2;flex:none;height:32px;padding:0 12px;border-radius:16px;border:0;display:flex;align-items:center;gap:4px;font-size:14px;color:#222222">[模型 A]
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</span>
<span style="flex:1"></span>
<span style="flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#666666">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
</span>
<span style="flex:none;width:36px;height:36px;border-radius:50%;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11v2M8 8v8M12 5v14M16 8v8M20 11v2"/></svg>
</span>
<span style="flex:none;width:36px;height:36px;border-radius:50%;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
</span>
</div>
</a>

<section style="flex:none;margin-top:22px">
<h3 style="margin:0 0 10px;font-size:16px;font-weight:600">功能</h3>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<a href="{{t.href}}" style="display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:8px;padding:12px;text-decoration:none;color:#222222">
<span style="flex:none;width:40px;height:40px;border-radius:16px;background:{{t.bg}};color:{{t.fg}};display:flex;align-items:center;justify-content:center">
<sc-if value="{{t.isBell}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg></sc-if>
<sc-if value="{{t.isSpark}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg></sc-if>
<sc-if value="{{t.isGame}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r=".8"/><circle cx="18" cy="14" r=".8"/></svg></sc-if>
<sc-if value="{{t.isClock}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></sc-if>
<sc-if value="{{t.isPlan}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4v16"/><path d="M5 5h12l-2.5 4 2.5 4H5"/></svg></sc-if>
<sc-if value="{{t.isPc}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></sc-if>
</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600">{{t.title}}</span><span style="display:block;margin-top:2px;font-size:12px;color:#666666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.desc}}</span></span>
</a>
</sc-for>
</div>
</section>

<section style="flex:none;margin-top:22px">
<div style="display:flex;align-items:center;justify-content:space-between">
<h3 style="margin:0;font-size:16px;font-weight:600">最近对话</h3>
<button type="button" onClick="{{openDrawer}}" style="height:32px;padding:0 4px;border:0;background:none;font-size:14px;font-weight:600;color:#222222">全部 ›</button>
</div>
<ul style="list-style:none;margin:6px 0 0;padding:0;background:#FFFFFF;border-radius:8px;overflow:hidden">
<sc-for list="{{recents}}" as="r" hint-placeholder-count="3">
<li style="border-top:{{r.border}}">
<a href="Studio.dc.html" style="display:flex;align-items:center;gap:8px;padding:14px;text-decoration:none;color:#222222">
<span style="flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.title}}</span>
<span style="flex:none;font-size:12px;color:#666666">{{r.time}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
</a>
</li>
</sc-for>
</ul>
</section>

<section style="flex:none;margin-top:22px">
<div style="display:flex;align-items:center;justify-content:space-between">
<h3 style="margin:0;font-size:16px;font-weight:600">我的作品</h3>
<a href="MyWorks.dc.html" style="height:32px;padding:0 4px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#222222;text-decoration:none">全部 ›</a>
</div>
<div style="margin-top:6px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="3">
<a href="PackDetail.dc.html" style="display:block;text-decoration:none;color:#222222">
<div style="position:relative;height:78px;border-radius:8px;background:{{w.c1}};overflow:hidden">
<div style="position:absolute;left:{{w.x}}px;top:{{w.y}}px;width:36px;height:36px;border-radius:50%;background:{{w.c2}}"></div>
</div>
<div style="margin-top:6px;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{w.title}}</div>
</a>
</sc-for>
</div>
</section>

</main>

<nav aria-label="底部导航" style="position:absolute;left:20px;right:20px;bottom:14px;height:60px;box-sizing:border-box;padding:0 8px;background:#FFFFFF;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between">
<sc-if value="{{notPub}}" hint-placeholder-val="{{true}}">
<a href="AIHome.dc.html" aria-current="page" style="height:44px;padding:0 14px;border-radius:22px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg>
<span>小伴AI</span>
</a>
</sc-if>
<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<a href="AIHome.dc.html" aria-label="小伴AI" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg>
</a>
</sc-if>
<a href="Games.dc.html" aria-label="游戏" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="10" rx="5"/><path d="M8 11v4M6 13h4"/><circle cx="16" cy="12" r=".8"/><circle cx="18" cy="14" r=".8"/></svg>
</a>
<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{closePub}}" aria-label="发布" aria-pressed="true" style="height:44px;padding:0 14px;border:0;border-radius:22px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
<span>发布</span>
</button>
</sc-if>
<sc-if value="{{notPub}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{openPub}}" aria-label="发布" style="width:48px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#666666">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</sc-if>
<a href="Main.dc.html" aria-label="社区" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
</a>
<a href="Me.dc.html" aria-label="我的" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
</a>
</nav>

<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end">
<div role="dialog" aria-modal="true" aria-label="发布" style="background:#FFFFFF;border-radius:20px 20px 0 0;padding:20px 16px 24px">
<h2 style="margin:0;font-size:18px;font-weight:600">发布</h2>
<div style="margin-top:8px;display:flex;flex-direction:column">
<a href="Studio.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">用 AI 创作</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">一句话生成特效、壁纸、组件或小游戏</span></span>
</a>
<a href="PublishPack.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M8 9l4-4 4 4"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">发布已有作品</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">选择资源包（.zip），发布到社区</span></span>
</a>
<a href="NewPost.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11a2 2 0 00-3-3L5 16l-1 4z"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">发帖</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">在讨论或资源里发一个帖子</span></span>
</a>
</div>
<button type="button" onClick="{{closePub}}" style="margin-top:8px;width:100%;height:48px;border:0;border-radius:24px;background:#F2F2F2;color:#222222;font-size:15px">取消</button>
</div>
</div>
</sc-if>

<sc-if value="{{drawer}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;display:flex">
<div role="dialog" aria-modal="true" aria-label="对话列表" style="width:300px;flex:none;background:#FFFFFF;display:flex;flex-direction:column;box-sizing:border-box;padding:16px 0 20px">
<div style="padding:0 16px;font-size:20px;font-weight:600">小伴AI</div>
<a href="Studio.dc.html" style="margin:14px 16px 0;height:44px;border-radius:22px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
新对话
</a>
<input type="text" aria-label="搜索对话" placeholder="搜索对话" style="margin:12px 16px 0;height:36px;border:0;border-radius:18px;background:#F2F2F2;padding:0 14px;font-size:14px;color:#222222;outline:none">
<div style="margin-top:14px;padding:0 16px 4px;font-size:12px;color:#666666">最近</div>
<sc-for list="{{drawerRows}}" as="d" hint-placeholder-count="5">
<a href="Studio.dc.html" style="display:block;margin:0 8px;padding:11px 8px;border-radius:8px;font-size:15px;color:#222222;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:{{d.bg}}">{{d.title}}</a>
</sc-for>
<div style="flex:1"></div>
<div style="border-top:0.5px solid #EDEDED;padding-top:8px">
<a href="MyWorks.dc.html" style="width:100%;box-sizing:border-box;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px;color:#222222;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>
我的作品
</a>
<a href="Library.dc.html" style="width:100%;box-sizing:border-box;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px;color:#222222;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3z"></path><path d="M5 17a3 3 0 013-3h10"></path></svg>
资料库
</a>
<a href="Settings.dc.html" style="width:100%;box-sizing:border-box;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;font-size:15px;color:#222222;text-decoration:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
设置
</a>
</div>
</div>
<button type="button" aria-label="关闭侧栏" onClick="{{closeDrawer}}" style="flex:1;border:0;padding:0;background:rgba(0,0,0,.45)"></button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const T = (o) => Object.assign({ href: 'Studio.dc.html', bg: '#F2F2F2', fg: '#333333', isBell: false, isSpark: false, isGame: false, isClock: false, isPlan: false, isPc: false }, o);
    const tiles = [
      T({ isSpark: true, bg: '#F2F2F2', fg: '#333333', title: '做装扮', desc: '特效、壁纸、组件' }),
      T({ isGame: true, bg: '#F2F2F2', fg: '#333333', title: '做小游戏', desc: '一句话做一个' }),
      T({ isBell: true, title: '设提醒', desc: '到点叫你' }),
      T({ isClock: true, title: '定时任务', desc: '每天自动做一件事' }),
      T({ isPlan: true, title: '做计划', desc: '拆成步骤，一步步推进' }),
      T({ isPc: true, href: 'Devices.dc.html', title: '我的设备', desc: '2 台设备 · 1 台在线' })
    ];
    const rawRecents = [
      { title: '雨夜特效配色', time: '[时间]' },
      { title: '周报开头怎么写', time: '[时间]' },
      { title: '整理下载文件夹的步骤', time: '[时间]' }
    ];
    const recents = rawRecents.map((r, i) => Object.assign({}, r, { border: i === 0 ? '0' : '0.5px solid #EDEDED' }));
    const works = [
      { c1: '#1B2A41', c2: '#3E5C8A', x: 14, y: 14, title: '雨夜窗台' },
      { c1: '#2B2230', c2: '#E7A8C2', x: 54, y: 10, title: '落樱' },
      { c1: '#2E4F3E', c2: '#E8C547', x: 30, y: 28, title: '三分钟小游戏' }
    ];
    const drawerRows = ['雨夜特效配色', '周报开头怎么写', '整理下载文件夹的步骤', '论文摘要润色', '周末去哪玩'].map((t) => ({ title: t, bg: 'transparent' }));
    return {
      tiles, recents, works, drawerRows,
      drawer: !!st.drawer,
      openDrawer: () => this.setState({ drawer: true }),
      closeDrawer: () => this.setState({ drawer: false }),
      pub: !!st.pub,
      notPub: !st.pub,
      openPub: () => this.setState({ pub: true }),
      closePub: () => this.setState({ pub: false })
    };
  }
}
</script>
