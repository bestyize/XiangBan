<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>社区·资源</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:1000px;box-sizing:border-box;background:#EDEDED;color:#222222;font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden">

<header style="flex:none;height:52px;display:flex;align-items:center;padding:0 16px;background:#FFFFFF">
<a href="Main.dc.html" aria-label="小伴" style="flex:none;width:72px;display:flex;align-items:center;gap:8px;text-decoration:none;color:#222222">
<span style="width:28px;height:28px;border-radius:8px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>

</a>
<nav aria-label="社区栏目" style="flex:1;min-width:0;display:flex;justify-content:center;gap:28px;height:52px">
<a href="Main.dc.html" style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding-top:3px;font-size:16px;color:#666666;text-decoration:none;border-bottom:3px solid transparent">首页</a>
<a href="Resources.dc.html" aria-current="page" style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding-top:3px;font-size:16px;font-weight:600;color:#E3203C;text-decoration:none;border-bottom:3px solid #E3203C">资源</a>
<a href="Discuss.dc.html" style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding-top:3px;font-size:16px;color:#666666;text-decoration:none;border-bottom:3px solid transparent">讨论</a>
</nav>
<a href="Search.dc.html" aria-label="搜索" style="flex:none;width:72px;height:44px;display:flex;align-items:center;justify-content:flex-end;color:#222222;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
</a>
</header>

<main style="flex:1;min-height:0;overflow:hidden;box-sizing:border-box;padding-bottom:96px;display:flex;flex-direction:column">

<div role="tablist" aria-label="分类" style="flex:none;display:flex;align-items:center;gap:24px;overflow-x:auto;scrollbar-width:none;padding:0 16px;height:40px;background:#FFFFFF;border-bottom:0.5px solid #EDEDED">
<sc-for list="{{chips}}" as="ch" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{ch.on}}" onClick="{{ch.pick}}" style="flex:none;position:relative;height:40px;padding:0;border:0;background:none;font-size:14px;font-weight:{{ch.weight}};color:{{ch.color}}">{{ch.name}}<span style="position:absolute;left:50%;bottom:3px;width:18px;margin-left:-9px;height:3px;border-radius:2px;background:{{ch.line}}"></span></button>
</sc-for>
</div>



<ul style="flex:none;list-style:none;margin:8px 0 0;padding:0;background:#FFFFFF">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<li style="display:flex;gap:12px;padding:16px;border-top:{{it.border}}">
<div style="position:relative;flex:none;width:92px;height:92px;border-radius:8px;background:linear-gradient(165deg,{{it.c1}} 0%,{{it.c2}} 160%);overflow:hidden">
<div style="position:absolute;left:{{it.gx}}px;top:{{it.gy}}px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,{{it.c2}} 0%,rgba(255,255,255,0) 70%);opacity:.9"></div>
</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
<div style="font-size:15px;font-weight:500;line-height:1.4;color:#222222;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{it.title}}</div>
<div style="margin-top:4px;font-size:14px;line-height:1.5;color:#666666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">{{it.desc}}</div>
<div style="margin-top:auto;padding-top:6px;font-size:12px;color:#999999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.cat}} · {{it.source}} · {{it.meta}}</div>
</div>
</li>
</sc-for>
</ul>

</main>

<nav aria-label="底部导航" style="position:absolute;left:20px;right:20px;bottom:14px;height:60px;box-sizing:border-box;padding:0 8px;background:#FFFFFF;border-radius:30px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between">
<a href="AIHome.dc.html" aria-label="小伴AI" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"></path></svg>
</a>
<a href="Games.dc.html" aria-label="游戏" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="10" rx="5"></rect><path d="M8 11v4M6 13h4"></path><circle cx="16" cy="12" r=".8"></circle><circle cx="18" cy="14" r=".8"></circle></svg>
</a>
<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{closePub}}" aria-label="发布" aria-pressed="true" style="height:44px;padding:0 14px;border:0;border-radius:22px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>发布</span>
</button>
</sc-if>
<sc-if value="{{notPub}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{openPub}}" aria-label="发布" style="width:48px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:#666666">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
<sc-if value="{{notPub}}" hint-placeholder-val="{{true}}">
<a href="Main.dc.html" aria-current="page" style="height:44px;padding:0 14px;border-radius:22px;background:#E3203C;color:#FFFFFF;display:flex;align-items:center;gap:8px;text-decoration:none;font-size:14px;font-weight:600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>
<span>社区</span>
</a>
</sc-if>
<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<a href="Main.dc.html" aria-label="社区" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>
</a>
</sc-if>
<a href="Me.dc.html" aria-label="我的" style="width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:#666666;text-decoration:none">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>
</a>
</nav>

<sc-if value="{{pub}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:flex-end">
<div role="dialog" aria-modal="true" aria-label="发布" style="background:#FFFFFF;border-radius:20px 20px 0 0;padding:20px 16px 24px">
<h2 style="margin:0;font-size:18px;font-weight:600">发布</h2>
<div style="margin-top:8px;display:flex;flex-direction:column">
<a href="Studio.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"></path></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">用 AI 创作</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">一句话生成特效、壁纸、组件或小游戏</span></span>
</a>
<a href="PublishPack.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M8 9l4-4 4 4"></path><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"></path></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">发布已有作品</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">选择资源包（.zip），发布到社区</span></span>
</a>
<a href="NewPost.dc.html" style="display:flex;align-items:center;gap:12px;padding:12px 0;text-decoration:none;color:#222222">
<span style="flex:none;width:44px;height:44px;border-radius:16px;background:#F2F2F2;color:#222222;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11a2 2 0 00-3-3L5 16l-1 4z"></path></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:16px;font-weight:600">发帖</span><span style="display:block;margin-top:2px;font-size:14px;color:#666666">在讨论或资源里发一个帖子</span></span>
</a>
</div>
<button type="button" onClick="{{closePub}}" style="margin-top:8px;width:100%;height:48px;border:0;border-radius:24px;background:#F2F2F2;color:#222222;font-size:15px">取消</button>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const f = st.filter || 'all';
    const defs = [['all', '全部'], ['soft', '精品软件'], ['media', '影音推荐'], ['study', '学习资料']];
    const chips = defs.map((d) => ({
      name: d[1],
      on: f === d[0],
      weight: f === d[0] ? 700 : 400,
      color: f === d[0] ? '#333333' : '#6B6B6B',
      line: f === d[0] ? '#E3203C' : 'transparent',
      pick: () => this.setState({ filter: d[0] })
    }));
    const all = [
      { k: 'soft', cat: '精品软件', source: '开源', title: '一款免费开源的截图标注工具', desc: '支持快捷键截图、箭头与马赛克，导出 PNG。附下载地址和使用心得。', c1: '#E8EEF8', c2: '#9FB6DC', x: 24, y: 24, meta: '晚风 · 23 回复' },
      { k: 'media', cat: '影音推荐', source: '片单', title: '本月片单：[主题]', desc: '十部值得一看的作品，附一句话影评，不含任何下载链接。', c1: '#2B2230', c2: '#E7A8C2', x: 30, y: 20, meta: '小满 · 8 回复' },
      { k: 'study', cat: '学习资料', source: '公开课程', title: '公开课笔记整理：[课程名]', desc: '按章节整理的学习笔记，来源是公开课程资料，已注明出处。', c1: '#F1ECE4', c2: '#D9C7A8', x: 28, y: 28, meta: '木子 · 41 回复' },
      { k: 'soft', cat: '精品软件', source: '免费', title: '做桌面小组件的几个顺手工具', desc: '都是免费可用的，分别适合画图标、调配色和做简单动效。', c1: '#E6F4EA', c2: '#9BD1B4', x: 20, y: 30, meta: '阿杰 · 15 回复' },
      { k: 'media', cat: '影音推荐', source: '乐评', title: '适合写代码时听的纯音乐', desc: '一份歌单加几句乐评，按专注程度分了三档。', c1: '#FDE4E1', c2: '#F4A6A0', x: 26, y: 22, meta: '苏苏 · 6 回复' },
      { k: 'study', cat: '学习资料', source: '自己的作品', title: '我整理的一份 Markdown 速查表', desc: '一页纸讲完常用语法，可以直接打印。', c1: '#CFE0E8', c2: '#9FBFCF', x: 30, y: 26, meta: '南乔 · 12 回复' }
    ];
    const items = all.filter((a) => f === 'all' || a.k === f).map((a, i) => Object.assign({}, a, { border: i === 0 ? '0' : '0.5px solid #EDEDED', gx: (a.x || 0) - 14, gy: (a.y || 0) - 14 }));
    return {
      chips, items,
      pub: !!st.pub,
      notPub: !st.pub,
      openPub: () => this.setState({ pub: true }),
      closePub: () => this.setState({ pub: false })
    };
  }
}
</script>
</body>
</html>
