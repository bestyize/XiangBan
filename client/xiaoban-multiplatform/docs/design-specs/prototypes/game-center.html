<header class="review"><div class="brand"><span id="brandIcon"></span><div>小伴手机 · 游戏中心<small>TWO DIRECTIONS / 两版交互设计稿</small></div></div><div class="controls"><button data-mode="both" aria-pressed="true">并排对比</button><button data-mode="a" aria-pressed="false">A 轻量游戏库</button><button data-mode="b" aria-pressed="false">B 沉浸游乐场</button><button id="dark" aria-pressed="false">深色</button><button id="width" aria-pressed="false">360px</button></div></header>
<div class="workspace"><section class="board" id="board-a"><h2><span class="variant-tag">A</span>轻量游戏库</h2><p>继续游玩优先 · 两列平铺 · 更快找到想玩的</p><div class="phone a" id="phone-a"></div></section><section class="board" id="board-b"><h2><span class="variant-tag">B</span>沉浸游乐场</h2><p>大封面推荐 · 主题分组 · 更有发现的乐趣</p><div class="phone b" id="phone-b"></div></section></div>
<p class="note">设计提案 · 游戏内容、最近游玩与作品状态均为演示数据。可点击卡片、切换“我的游戏”、打开创作和试玩流程；不启动真实游戏，不调用模型或修改本机游戏。官方推荐与最近游玩属于拟新增能力，移动端当前已有本地创作、试玩和导出基础。封面复用仓库内官方游戏素材。</p>
<script>
const games=[{"id": "merge-2048", "name": "2048", "description": "滑动合并相同数字，慢慢合出 2048。手机和电脑都能玩。", "orientation": "portrait"}, {"id": "water-sort", "name": "奶茶大师", "description": "把同色饮料倒在一起。8 关慢慢调，随时撤销，没有倒计时。", "orientation": "portrait"}, {"id": "falling-blocks", "name": "俄罗斯方块", "description": "单人下落方块，移动和旋转，填满一行就能消除。", "orientation": "portrait"}, {"id": "block-puzzle", "name": "消失高手", "description": "拖动方块填满整行或整列，一次消得越多，分数越高。慢慢摆，轻松消。", "orientation": "portrait"}, {"id": "dusk-glider", "name": "暮色滑翔", "description": "横屏 3D 滑翔：按住俯冲，松开起飞，在日落之前飞过一座座岛。", "orientation": "landscape"}, {"id": "ink-blade", "name": "水墨剑客", "description": "横屏水墨动作：竹林、雪江两卷各六幅，逐幅解锁、集三印、求逸品。朱光一闪时出剑弹反，斩破月下无常与寒江钓叟。", "orientation": "landscape"}, {"id": "snake-arena", "name": "小伴贪吃蛇", "description": "无尽成长或三分钟冲分，吃糖果长成大蛇，反杀 AI、赚糖果币。", "orientation": "landscape"}, {"id": "jade-gomoku", "name": "雅韵五子棋", "description": "水墨玉石质感五子棋，支持智能人机对弈与双人对局，沉浸式下子金石音效与连珠特效。", "orientation": "landscape"}, {"id": "pro-cube", "name": "3D全阶魔方", "description": "3~9阶全系真实质感磁力魔方：支持手势划动切层、键盘旋转、多阶层深控制与智能还原。", "orientation": "landscape"}];
games.sort((a,b)=>['dusk-glider','ink-blade','jade-gomoku','pro-cube','water-sort','block-puzzle','merge-2048','snake-arena','falling-blocks'].indexOf(a.id)-['dusk-glider','ink-blade','jade-gomoku','pro-cube','water-sort','block-puzzle','merge-2048','snake-arena','falling-blocks'].indexOf(b.id));
const paths={spark:'M12 3l2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z',plus:'M12 5v14M5 12h14',game:'M6 7h12l3 10a2 2 0 0 1-3 2l-3-3H9l-3 3a2 2 0 0 1-3-2L6 7ZM7 10v4M5 12h4M16 11h.01M18 13h.01',chat:'M21 11a9 9 0 0 1-9 9H4l-2 2v-10A9 9 0 1 1 21 11Z',user:'M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0M4 22v-2a8 8 0 0 1 16 0v2',play:'M8 4l13 8-13 8z',arrow:'M5 12h14M13 6l6 6-6 6',back:'M15 5l-7 7 7 7',close:'M6 6l12 12M6 18L18 6',phone:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2ZM11 18h2',land:'M2 6h20v12H2zM18 11v2',offline:'M12 3v12M8 11l4 4 4-4M4 16v5h16v-5',save:'M4 3h13l4 4v14H3V3h1ZM7 3v7h10V3M7 21v-7h10v7',signal:'M3 19v-3M8 19v-7M13 19V8M18 19V4',wifi:'M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M9 16a5 5 0 0 1 6 0M12 20h.01',dots:'M5 12h.01M12 12h.01M19 12h.01'};
const icon=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.game}"/></svg>`;
const art=g=>`game-center-assets/${g.id}.svg`;
const get=id=>games.find(g=>g.id===id);
const genres={'merge-2048':'益智','water-sort':'解压','falling-blocks':'益智','block-puzzle':'益智','dusk-glider':'冒险','ink-blade':'冒险','snake-arena':'解压','jade-gomoku':'益智','pro-cube':'益智'};
const state={a:{tab:'official',genre:'全部',sheet:null,game:null,play:false,empty:false},b:{tab:'official',genre:'全部',sheet:null,game:null,play:false,empty:false}};
const gameTitle=(g,mine=false)=>mine?({'dusk-glider':'我的滑翔冒险','block-puzzle':'周末方块'}[g.id]||g.name):g.name;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(g,mine=false){return `<div><button class="game-card" data-action="detail" data-id="${g.id}" aria-label="查看${gameTitle(g,mine)}"><span class="cover"><img src="${art(g)}" alt="${g.name}" ${g.id==='jade-gomoku'?'class="landscape"':''}><span class="mini-play">${icon('play')}</span></span><b>${mine?({'dusk-glider':'我的滑翔冒险','block-puzzle':'周末方块'})[g.id]:g.name}</b><span class="game-meta">${mine?'小伴和我一起创作':genres[g.id]+' · 随时来一局'}${icon(g.orientation==='portrait'?'phone':'land')}</span></button>${mine?`<div class="mine-tags"><span class="dot">可游玩</span><button class="text-btn" data-action="manage" data-id="${g.id}">管理</button></div>`:''}</div>`;}
function nav(){return `<div class="nav-wrap"><nav class="bottom-nav" aria-label="底部导航"><button data-action="nav" aria-label="小伴AI">${icon('spark')}</button><button class="selected" aria-current="page" data-action="games">${icon('game')}游戏</button><button class="plus" data-action="create" aria-label="创作游戏">${icon('plus')}</button><button data-action="nav" aria-label="社区">${icon('chat')}</button><button data-action="nav" aria-label="我的">${icon('user')}</button></nav></div><div class="home-indicator"></div>`;}
function render(v){const s=state[v],phone=document.querySelector('#phone-'+v);let content='';
if(s.tab==='mine')content=`<div class="my-summary"><h2>我的小宇宙</h2><button class="text-btn" data-action="empty">${s.empty?'查看有作品':'查看空状态'}</button></div>`+(s.empty?`<div class="empty">${icon('spark')}<h2>想玩的，自己创造</h2><p>一个简单的点子，<br>也可以变成属于你的小游戏。</p><button class="solid" data-action="create">和小伴做一个游戏</button></div>`:`<div class="game-grid">${card(get('dusk-glider'),true)}${card(get('block-puzzle'),true)}</div><button class="creation-card" data-action="create"><span><b>下一个游戏，由你想象</b><small>告诉小伴一个新点子</small></span>${icon('spark')}</button>`);
else if(v==='a')content=`<div class="recent"><img src="${art(get('merge-2048'))}" alt="2048"><div class="text"><b>再来一局 2048</b><small>最近玩过 · 昨天</small></div><button class="round-play" data-action="play" data-id="merge-2048" aria-label="继续玩2048">${icon('play')}</button></div><div class="section-title"><h2>挑一款，放松一下</h2><small>9 款游戏</small></div><div class="chips" aria-label="按玩法筛选">${['全部','益智','解压','冒险'].map(x=>`<button data-action="genre" data-value="${x}" aria-pressed="${s.genre===x}">${x}</button>`).join('')}</div><div class="game-grid">${games.filter(g=>s.genre==='全部'||genres[g.id]===s.genre).map(g=>card(g)).join('')}</div><button class="creation-card" data-action="create"><span><b>有个好玩的点子？</b><small>和小伴一起，把它做出来</small></span>${icon('spark')}</button>`;
else content=`<button class="hero" data-action="detail" data-id="dusk-glider" aria-label="查看暮色滑翔"><img src="${art(get('dusk-glider'))}" alt="暮色滑翔"><span class="hero-top">小伴精选 · 01</span><div class="hero-body"><small>留一点时间，给自己</small><h2>飞进落日里</h2><p>暮色滑翔 · 指尖上的小小冒险</p><span class="hero-go">${icon('play')}</span></div></button><div class="section-title"><h2>快乐，不用太费力</h2><small>轻松来一局</small></div><div class="horizontal">${['water-sort','merge-2048','block-puzzle','snake-arena'].map(id=>card(get(id))).join('')}</div><div class="section-title"><h2>回到你的游戏</h2><small>最近玩过</small></div>${['merge-2048','ink-blade'].map(id=>`<button class="quick-row" data-action="play" data-id="${id}"><img src="${art(get(id))}" alt=""><div class="text"><b>${get(id).name}</b><small>昨天玩过 · ${get(id).orientation==='portrait'?'竖屏':'横屏'}</small></div>${icon('arrow')}</button>`).join('')}<div class="section-title"><h2>换个世界，玩一会儿</h2><small>探索与挑战</small></div><div class="game-grid">${['ink-blade','jade-gomoku','falling-blocks','pro-cube'].map(id=>card(get(id))).join('')}</div><button class="creation-card" data-action="create"><span><b>你的想象，也能成为游戏</b><small>和小伴创作一个新世界</small></span>${icon('spark')}</button>`;
phone.innerHTML=`<div class="status"><span>9:41</span><span class="status-right">${icon('signal')}${icon('wifi')}<span class="battery"><i></i></span></span></div><div class="screen"><main class="scroll"><header class="app-header"><div><div class="eyebrow">${v==='a'?'PLAY, AT YOUR PACE':'A LITTLE JOY, EVERY DAY'}</div><h1>${v==='a'?'游戏中心':'今天，玩点什么？'}</h1></div><button class="icon-btn create" data-action="create" aria-label="让小伴创作游戏">${icon('spark')}</button></header><div class="tabs" role="tablist" aria-label="游戏来源"><button role="tab" aria-selected="${s.tab==='official'}" data-action="tab" data-value="official">发现游戏</button><button role="tab" aria-selected="${s.tab==='mine'}" data-action="tab" data-value="mine">我的游戏</button><span class="label">${s.tab==='official'?'小伴出品':'只属于你'}</span></div>${content}</main>${nav()}</div>`;
phone.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(v,el.dataset));if(s.sheet)showSheet(v);if(s.play)showPlay(v);}
function toast(v,text){const phone=document.querySelector('#phone-'+v);phone.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;phone.append(el);setTimeout(()=>el.remove(),3000);}
function action(v,d){const s=state[v];if(d.action==='tab'){s.tab=d.value;s.sheet=null;render(v)}else if(d.action==='genre'){s.genre=d.value;render(v)}else if(d.action==='empty'){s.empty=!s.empty;render(v)}else if(d.action==='detail'||d.action==='manage'){s.game=get(d.id);s.sheet=d.action;showSheet(v)}else if(d.action==='play'){s.game=get(d.id);s.play=true;showPlay(v)}else if(d.action==='create'){s.sheet='create';showSheet(v)}else if(d.action==='nav'){toast(v,'设计稿：此处切换到对应页面')}else if(d.action==='games'){s.tab='official';render(v)}}
function showSheet(v){const s=state[v],phone=document.querySelector('#phone-'+v);phone.querySelector('.sheet-layer')?.remove();const layer=document.createElement('div');layer.className='sheet-layer';const g=s.game;const create=s.sheet==='create';layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${create?'创作游戏':safe(gameTitle(g,s.tab==='mine'))}"><div class="handle"></div><button class="close" aria-label="关闭">${icon('close')}</button>${create?`<h2>想玩什么，你说了算</h2><div class="subtitle">一个点子，就能开始</div><textarea aria-label="游戏想法" placeholder="比如：一只小猫在云朵间跳跃，收集星星…"></textarea><div class="prompts"><button>治愈系消除</button><button>像素小冒险</button><button>我的专属2048</button></div><button class="solid start-create">和小伴一起创作</button>`:`<img class="detail-cover" src="${art(g)}" alt="${safe(gameTitle(g,s.tab==='mine'))}"><h2>${safe(gameTitle(g,s.tab==='mine'))}</h2><div class="subtitle">${s.sheet==='manage'?'我的作品':'小伴官方 · '+genres[g.id]}</div><div class="detail-stats"><div>${icon(g.orientation==='portrait'?'phone':'land')}${g.orientation==='portrait'?'竖屏游玩':'横屏游玩'}</div><div>${icon('offline')}本地游玩</div><div>${icon('game')}触控操作</div></div><p>${safe(g.description)}</p><button class="solid launch">开始游玩</button>${s.sheet==='manage'?'<button class="text-btn edit">让小伴继续修改</button><button class="text-btn export">导出游戏包</button>':''}`}</section>`;phone.append(layer);const close=()=>{s.sheet=null;layer.remove()};layer.onclick=e=>{if(e.target===layer)close()};layer.querySelector('.close').onclick=close;layer.querySelector('.close').focus();layer.onkeydown=e=>{if(e.key==='Escape'){e.stopPropagation();close()}if(e.key==='Tab'){const list=[...layer.querySelectorAll('button,textarea')];if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}};if(create){layer.querySelectorAll('.prompts button').forEach(b=>b.onclick=()=>layer.querySelector('textarea').value=b.textContent);layer.querySelector('.start-create').onclick=()=>{const text=layer.querySelector('textarea').value.trim();if(!text){layer.querySelector('textarea').focus();return}close();toast(v,'设计预览：携带你的想法进入小伴 AI 创作，不发送真实请求。')}}else{layer.querySelector('.launch').onclick=()=>{close();s.play=true;showPlay(v)};if(s.sheet==='manage'){layer.querySelector('.edit').onclick=()=>{close();toast(v,'设计预览：进入这款游戏的修改对话')};layer.querySelector('.export').onclick=()=>toast(v,'设计预览：导出可在小伴桌面打开的游戏包')}}}
function showPlay(v){const s=state[v],phone=document.querySelector('#phone-'+v);phone.querySelector('.play-screen')?.remove();const el=document.createElement('section');el.className='play-screen';el.innerHTML=`<button class="back">${icon('back')}返回游戏中心</button><img class="play-art" src="${art(s.game)}" alt="${safe(gameTitle(s.game,s.tab==='mine'))}"><h2>${safe(gameTitle(s.game,s.tab==='mine'))}</h2><p>${s.game.orientation==='landscape'?'横过手机，进入游戏世界':'保持竖屏，轻触开始游戏'}<br>这里演示启动过渡，未加载真实游戏。</p><button class="solid">结束试玩，返回游戏中心</button>`;phone.append(el);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.play=false;el.remove()});}
document.querySelector('#brandIcon').innerHTML=icon('spark');render('a');render('b');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.board').forEach(el=>el.classList.toggle('is-hidden',b.dataset.mode!=='both'&&el.id!=='board-'+b.dataset.mode))});document.querySelector('#dark').onclick=e=>{const dark=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',dark);e.currentTarget.textContent=dark?'浅色':'深色';document.querySelectorAll('.phone').forEach(el=>el.classList.toggle('dark',dark))};document.querySelector('#width').onclick=e=>{const compact=document.body.classList.toggle('compact');e.currentTarget.setAttribute('aria-pressed',compact);e.currentTarget.textContent=compact?'390px':'360px'};
</script></body></html>
