<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>万磁搜 · V2 交互设计稿</title>
  <style>
    :root {
      color-scheme: light;
      /* Studio desk */
      --desk: #ECEAE7;
      --desk-card: #FFFFFF;
      --desk-line: rgba(24, 20, 26, 0.08);

      /* Product semantic tokens — 万磁搜 */
      --paper: #F4F3F1;
      --surface: #FFFFFF;
      --fill: #EFEFF2;
      --fill-hover: #E5E5EA;
      --hairline: rgba(24, 20, 26, 0.08);
      --line: #D4D4D8;

      --ink: #1C1B1F;
      --ink-2: #55535B;
      --ink-3: #6E6C75;

      --brand: #E3203C;
      --brand-hi: #F44353;
      --brand-grad: linear-gradient(135deg, #E3203C 0%, #F44353 100%);
      --brand-soft: #FFF0F2;
      --brand-soft-border: #FFD1D9;
      --brand-ink: #D11B36;
      --brand-on: #FFFFFF;

      --size-bg: #EFEFF3;
      --size-ink: #18181D;

      --success: #157A4B;
      --success-dot: #22A867;
      --success-soft: #E8F7EF;

      --warn: #A35E0B;
      --warn-dot: #D98A26;
      --warn-soft: #FEF4E4;

      --danger: #D91E36;

      --scrim: rgba(18, 16, 22, 0.42);
      --shadow-card: 0 2px 10px rgba(24, 20, 26, 0.045), 0 1px 2px rgba(24, 20, 26, 0.04);
      --shadow-pill: 0 4px 16px rgba(24, 20, 26, 0.065), 0 1px 2px rgba(24, 20, 26, 0.04);
      --shadow-brand: 0 3px 10px rgba(24, 20, 26, 0.16);
      --shadow-sheet: 0 -8px 32px rgba(18, 16, 22, 0.14);
      --shadow-toast: 0 8px 24px rgba(18, 16, 22, 0.16);
      --shadow-thumb: 0 1px 3px rgba(24, 20, 26, 0.09);
      --shadow-phone: 0 20px 50px rgba(24, 20, 26, 0.12);

      --r-inner: 10px;
      --r-sm: 12px;
      --r-tile: 14px;
      --r-card: 16px;
      --r-hero: 18px;
      --r-sheet: 20px;
      --r-pill: 999px;

      --font: "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast: 140ms;
      --dur-normal: 200ms;
      --dur-sheet: 260ms;

      --phone-w: 390px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --desk: #090A0D;
      --desk-card: #15171D;
      --desk-line: rgba(255, 255, 255, 0.08);

      --paper: #0D0E12;
      --surface: #171920;
      --fill: #22252F;
      --fill-hover: #2C303D;
      --hairline: rgba(255, 255, 255, 0.08);
      --line: #363A47;

      --ink: #F0F0F5;
      --ink-2: #A6A8B3;
      --ink-3: #898C98;

      --brand: #E3203C;
      --brand-hi: #F4475B;
      --brand-grad: linear-gradient(135deg, #D91E38 0%, #F24457 100%);
      --brand-soft: #33161D;
      --brand-soft-border: #5C2230;
      --brand-ink: #FF7589;
      --brand-on: #FFFFFF;

      --size-bg: #252834;
      --size-ink: #F2F3F7;

      --success: #4AD991;
      --success-dot: #4AD991;
      --success-soft: #133124;

      --warn: #F0B354;
      --warn-dot: #F0B354;
      --warn-soft: #2F2312;

      --danger: #FF6369;

      --scrim: rgba(0, 0, 0, 0.65);
      --shadow-card: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 4px 14px rgba(0, 0, 0, 0.28);
      --shadow-pill: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 6px 18px rgba(0, 0, 0, 0.34);
      --shadow-brand: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 4px 12px rgba(0, 0, 0, 0.36);
      --shadow-sheet: 0 -10px 34px rgba(0, 0, 0, 0.52);
      --shadow-toast: 0 8px 26px rgba(0, 0, 0, 0.52);
      --shadow-thumb: 0 1px 3px rgba(0, 0, 0, 0.36);
      --shadow-phone: 0 22px 54px rgba(0, 0, 0, 0.50);
    }

    *, *::before, *::after { box-sizing: border-box; }
    ::selection { background: rgba(227, 32, 60, 0.18); color: var(--ink); }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--desk);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input { font: inherit; color: inherit; }
    button {
      border: 0;
      background: none;
      cursor: pointer;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { cursor: not-allowed; }
    button:focus-visible,
    input:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }
    h1, h2, h3, p { margin: 0; }
    .icon {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: block;
    }

    /* ==================== Studio Header ==================== */
    .studio-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: color-mix(in srgb, var(--desk-card) 92%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--desk-line);
    }
    .studio-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .studio-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 4px;
    }
    .studio-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--brand-grad);
      box-shadow: var(--shadow-thumb);
      display: grid;
      place-items: center;
      flex: none;
    }
    .studio-title { font-size: 14px; font-weight: 700; line-height: 1.25; }
    .studio-sub { font-size: 12px; color: var(--ink-3); line-height: 1.3; }
    .studio-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: 10px;
      background: var(--fill);
    }
    .studio-tab {
      height: 28px;
      padding: 0 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-2);
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .studio-tab:hover { color: var(--ink); }
    .studio-tab[aria-pressed="true"] {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-thumb);
    }
    .studio-states {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .studio-pill {
      height: 28px;
      padding: 0 10px;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-2);
      background: var(--surface);
      border: 1px solid var(--hairline);
      transition: border-color var(--dur-fast), color var(--dur-fast), background var(--dur-fast);
    }
    .studio-pill:hover { border-color: var(--line); color: var(--ink); }
    .studio-pill[aria-pressed="true"] {
      background: var(--brand-grad);
      border-color: transparent;
      color: var(--brand-on);
      font-weight: 600;
    }
    .studio-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ==================== Stage Layouts ==================== */
    .stage {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 20px 44px;
    }
    .stage[hidden] { display: none; }
    .live-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 32px;
      flex-wrap: wrap;
    }
    .phone-wrap { display: flex; flex-direction: column; align-items: center; }
    .phone-caption {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .phone-caption strong { color: var(--ink); font-weight: 600; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(390px, 1fr));
      gap: 28px 24px;
      justify-items: center;
    }
    .artboard {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 390px;
    }
    .artboard-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .artboard-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .artboard-meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

    /* Cover Stage */
    .cover-stage { max-width: 720px; margin: 0 auto; }
    .cover-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow-card);
    }
    .cover-frame {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--hairline);
      background: #F4F3F1;
    }
    .cover-frame svg { display: block; width: 100%; height: auto; }
    .cover-notes {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .cover-note { padding: 12px 14px; border-radius: var(--r-sm); background: var(--fill); }
    .cover-note b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .cover-note span { font-size: 12px; color: var(--ink-2); line-height: 1.5; }

    /* ==================== Phone Frame & Runtime Chrome ==================== */
    .phone {
      --xb-safe-top: 30px;
      --xb-safe-bottom: 18px;
      --xb-safe-left: 0px;
      --xb-safe-right: 0px;
      --xb-capsule-top: var(--xb-safe-top);
      --xb-capsule-right: 6px;
      --xb-capsule-width: 48px;
      --xb-capsule-height: 48px;

      position: relative;
      width: var(--phone-w);
      height: 844px;
      overflow: hidden;
      border-radius: 36px;
      border: 7px solid #222026;
      background: var(--paper);
      color: var(--ink);
      box-shadow: var(--shadow-phone);
      display: flex;
      flex-direction: column;
      isolation: isolate;
    }
    [data-theme="dark"] .phone { border-color: #2A2C35; }
    .phone.is-overview { border-width: 6px; border-radius: 32px; }
    .phone.is-embedded {
      --xb-safe-top: 0px;
      --xb-safe-bottom: 0px;
      --xb-capsule-top: 0px;
      --xb-capsule-right: 0px;
      --xb-capsule-width: 0px;
      --xb-capsule-height: 0px;
    }

    /* Ambient Crimson Magnetic Field Backdrop */
    .ambient-field {
      position: absolute;
      inset: 0 0 auto;
      height: 230px;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(115% 95% at 86% 0%, rgba(227, 32, 60, 0.13) 0%, rgba(255, 118, 128, 0.05) 45%, transparent 78%);
    }
    [data-theme="dark"] .ambient-field {
      background: radial-gradient(115% 95% at 86% 0%, rgba(227, 32, 60, 0.22) 0%, rgba(227, 32, 60, 0.06) 46%, transparent 78%);
    }
    .phone.is-embedded .ambient-field { height: 150px; }
    .ambient-arcs {
      position: absolute;
      top: -14px;
      right: -18px;
      width: 220px;
      height: 190px;
      color: var(--brand);
      opacity: 0.11;
    }
    [data-theme="dark"] .ambient-arcs { opacity: 0.16; }

    .status-bar {
      position: absolute;
      inset: 0 0 auto;
      height: var(--xb-safe-top);
      padding: 6px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
      pointer-events: none;
      z-index: 4;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .phone.is-embedded .status-bar,
    .phone.is-embedded .host-capsule,
    .phone.is-embedded .home-indicator { display: none; }

    /* Protocol 2 transparent 48x48dp vertical 3-dots host menu */
    .host-capsule {
      position: absolute;
      top: var(--xb-capsule-top);
      right: var(--xb-capsule-right);
      width: var(--xb-capsule-width);
      height: var(--xb-capsule-height);
      z-index: 8;
      display: grid;
      place-items: center;
      color: var(--ink);
      border-radius: var(--r-pill);
    }
    .host-capsule svg {
      width: 16px;
      height: 16px;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.14));
    }

    .home-indicator {
      position: absolute;
      bottom: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 4px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--ink) 28%, transparent);
      pointer-events: none;
      z-index: 8;
    }

    /* ==================== MiniApp Internal Shell ==================== */
    .app-shell {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 max(16px, var(--xb-safe-right)) 0 max(16px, var(--xb-safe-left));
    }

    .masthead {
      flex: none;
      padding-top: calc(var(--xb-safe-top) + 6px);
      min-height: calc(var(--xb-capsule-top) + var(--xb-capsule-height) + 8px);
      padding-right: calc(var(--xb-capsule-width) + var(--xb-capsule-right) - 6px);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .phone.is-embedded .masthead { display: none; }

    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--brand-grad);
      box-shadow: var(--shadow-thumb);
      display: grid;
      place-items: center;
      flex: none;
    }
    .brand-badge svg { width: 18px; height: 18px; display: block; }
    .masthead h1 {
      font-size: 22px;
      line-height: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .masthead-tag {
      height: 22px;
      padding: 0 8px;
      border-radius: var(--r-pill);
      background: var(--brand-soft);
      color: var(--brand-ink);
      font-size: 12px;
      line-height: 22px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* Fixed Search & Toolbar Dock */
    .search-dock {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
    }
    .phone.is-embedded .search-dock { padding-top: 14px; }

    .search-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 4px 5px 4px 14px;
      border-radius: var(--r-pill);
      background: var(--surface);
      box-shadow: var(--shadow-pill);
      transition: box-shadow var(--dur-fast) var(--ease);
    }
    .search-pill:focus-within {
      box-shadow: 0 0 0 2px var(--brand), var(--shadow-pill);
    }
    .search-pill-icon {
      width: 18px;
      height: 18px;
      color: var(--brand-ink);
      flex: none;
    }
    .search-pill input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font-size: 15px;
      line-height: 22px;
      color: var(--ink);
      caret-color: var(--brand);
    }
    .search-pill input::placeholder { color: var(--ink-3); }
    .search-pill input::-webkit-search-cancel-button { -webkit-appearance: none; }

    .clear-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--fill);
      color: var(--ink-2);
      display: grid;
      place-items: center;
      flex: none;
      transition: background var(--dur-fast);
    }
    .clear-btn:hover { background: var(--fill-hover); color: var(--ink); }
    .clear-btn[hidden] { display: none; }
    .clear-btn .icon { width: 14px; height: 14px; }

    .search-submit {
      height: 38px;
      min-width: 68px;
      padding: 0 15px;
      border-radius: var(--r-pill);
      background: var(--brand-grad);
      color: var(--brand-on);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-brand);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: none;
      transition: transform var(--dur-fast), filter var(--dur-fast);
    }
    .search-submit:hover { filter: brightness(1.04); }
    .search-submit:active { transform: scale(0.97); }
    .search-submit:disabled { opacity: 0.78; cursor: wait; }

    .spin { width: 14px; height: 14px; animation: xb-spin 0.8s linear infinite; }
    @keyframes xb-spin { to { transform: rotate(360deg); } }

    /* Single-row Source + Sort Toolbar (360px & 390px) */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 34px;
    }
    .source-btn {
      height: 32px;
      max-width: 130px;
      padding: 0 10px;
      border-radius: var(--r-pill);
      background: var(--surface);
      box-shadow: var(--shadow-thumb);
      color: var(--ink);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      white-space: nowrap;
      transition: background var(--dur-fast);
    }
    .source-btn.is-filtered {
      background: var(--brand-soft);
      color: var(--brand-ink);
      font-weight: 600;
    }
    .source-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
      flex: none;
    }
    .source-label { overflow: hidden; text-overflow: ellipsis; }
    .source-btn .icon { width: 14px; height: 14px; opacity: 0.7; }

    .sort-seg {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: var(--r-pill);
      background: var(--fill);
      flex: none;
    }
    .sort-tab {
      height: 26px;
      padding: 0 8px;
      border-radius: var(--r-pill);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-2);
      white-space: nowrap;
      transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .sort-tab:hover { color: var(--ink); }
    .sort-tab[aria-selected="true"] {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-thumb);
    }

    /* Scroll Area */
    .scroll-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      padding: 2px 0 calc(26px + var(--xb-safe-bottom));
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* ==================== Home View (Hero + Quick Grid + History + Sources) ==================== */
    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border-radius: var(--r-hero);
      background: linear-gradient(135deg, #24171D 0%, #441926 56%, #741B31 100%);
      color: #FFFFFF;
      margin-bottom: 14px;
      box-shadow: 0 10px 26px rgba(24, 16, 20, 0.20);
    }
    [data-theme="dark"] .hero-card {
      background: linear-gradient(135deg, #1E1318 0%, #3E1522 56%, #6B192E 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 28px rgba(0, 0, 0, 0.42);
    }
    .hero-art {
      position: absolute;
      right: -12px;
      top: -12px;
      width: 148px;
      height: 148px;
      pointer-events: none;
    }
    .hero-content { position: relative; z-index: 1; max-width: 78%; }
    .hero-content h2 {
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #FFFFFF;
    }
    .hero-content p {
      margin-top: 5px;
      font-size: 12.5px;
      line-height: 18px;
      color: rgba(255, 244, 242, 0.82);
    }
    .hero-pills {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hero-pill {
      height: 24px;
      padding: 0 9px;
      border-radius: var(--r-pill);
      background: rgba(255, 255, 255, 0.14);
      color: #FFF7F5;
      font-size: 12px;
      line-height: 24px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* 4-column Quick Scene Grid */
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 18px;
    }
    .scene-tile {
      padding: 12px 4px 10px;
      border-radius: var(--r-tile);
      background: var(--surface);
      box-shadow: var(--shadow-card);
      display: flex;

    .skel-t1 { width: 88%; height: 14px; }

    /* ==================== Toast ==================== */
    .toast {

    @media (prefers-reduced-motion: reduce) {

        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

      function renderPhoneBody(st, interactive) {

      function renderSheetHtml(st, interactive) {
        if (!st.sheet) return '';
        if (st.sheet.type === 'sources') {
          return `
            <div class="sheet-overlay" ${interactive ? 'data-sheet-backdrop' : ''}>
              <section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="选择搜索来源" tabindex="-1">

                      <button type="button" class="source-item" role="radio" aria-checked="${st.source === s.name}" ${interactive ? `data-pick-source="${esc(s.name)}"` : 'tabindex="-1"'}>

                          <span class="site-dot" style="background:${s.dot}" aria-hidden="true"></span>
                          <span>${esc(s.name)}</span>
                        </span>
                        <span class="source-item-role">${esc(s.role)}</span>

                    `).join('')}
                  </div>
                </div>
                <div class="sheet-footer">
                  <button type="button" class="sheet-cancel" ${interactive ? 'data-sheet-close' : 'tabindex="-1"'}>取消</button>
                </div>
              </section>
            </div>
          `;
        }

        const { item, status } = st.sheet;
        const uri = magnetUri(item);
        let stateBlock = '';

        if (status === 'resolving') {
          stateBlock = `
            <div class="sheet-resolving">

          stateBlock = `

              ${ICONS.alert}
              <div>
                <b>暂时无法获取该磁力链接</b>

              </div>
            </div>
            <button type="button" class="sheet-retry-btn" ${interactive ? 'data-retry-magnet' : 'tabindex="-1"'}>重新获取</button>
          `;
        } else {
          stateBlock = `
            <div class="magnet-box">
              <div class="magnet-box-head">
                <span class="magnet-tag">BTIH</span>
                <span class="magnet-hash">${esc(item.hash)}</span>
              </div>
              <div class="magnet-code">${esc(uri)}</div>
            </div>
            <button type="button" class="sheet-primary-btn" ${interactive ? 'data-copy-sheet-magnet' : 'tabindex="-1"'}>
              ${ICONS.copy}<span>复制磁力链接</span>
            </button>
            <p class="sheet-caption">仅检索并复制链接，使用前请自行核对来源与授权。</p>
          `;
        }

        return `
          <div class="sheet-overlay" ${interactive ? 'data-sheet-backdrop' : ''}>
            <section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="磁力链接" tabindex="-1">
              <div class="sheet-handle" aria-hidden="true"></div>
              <header class="sheet-head">
                <div class="sheet-head-title">
                  <span class="sheet-mini-badge">${ICONS.magnetBadgeSvg}</span>
                  <h2>磁力链接</h2>
                </div>
                <button type="button" class="sheet-close" ${interactive ? 'data-sheet-close' : 'tabindex="-1"'} aria-label="关闭">${ICONS.close}</button>
              </header>
              <div class="sheet-body">
                <div class="sheet-item-title">${esc(item.title)}</div>
                <div class="sheet-item-facts">
                  <span class="source-tag"><span class="site-dot" style="background:${SOURCE_MAP[item.source]?.dot || '#6E6C75'}" aria-hidden="true"></span>${esc(item.source)}</span>
                  ${renderFactsMarkup(item)}
                </div>
                ${stateBlock}
              </div>
              ${status !== 'ready' ? `
                <div class="sheet-footer">
                  <button type="button" class="sheet-cancel" ${interactive ? 'data-sheet-close' : 'tabindex="-1"'}>关闭</button>
                </div>
              ` : ''}
            </section>
          </div>
        `;
      }

      function renderPhoneHtml(st, { interactive = false, overview = false, embedded = false, width = 390 } = {}) {
        const isLoading = st.view === 'loading';
        const isFiltered = st.source !== 'all';
        const sourceText = isFiltered ? st.source : '全部来源';
        const sortTabs = [
          ['relevance', '相关'],
          ['size', '体积'],
          ['seeds', '做种'],
          ['date', '日期']
        ];

        const toastHtml = st.toast
          ? `

            </div>

          : '';

        return `
          <div class="phone ${overview ? 'is-overview' : ''} ${embedded ? 'is-embedded' : ''}" style="--phone-w:${width}px">
            <div class="ambient-field" aria-hidden="true">

                <circle cx="170" cy="24" r="56" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="170" cy="24" r="90" stroke="currentColor" stroke-width="1.1"/>

                <span class="brand-badge">${ICONS.magnetBadgeSvg}</span>

                <span class="masthead-tag">11 站聚合</span>
              </header>

              <div class="search-dock">
                <form class="search-pill" ${interactive ? 'id="liveSearchForm"' : ''} autocomplete="off">
                  <span class="search-pill-icon">${ICONS.search}</span>
                  <input
                    ${interactive ? 'id="liveQueryInput"' : 'readonly tabindex="-1"'}
                    type="search"
                    maxlength="128"
                    aria-label="搜索关键词"
                    placeholder="搜索电影、剧集、软件…"
                    value="${esc(st.keyword)}"
                  >
                  <button
                    type="button"
                    class="clear-btn"
                    ${interactive ? 'id="liveClearBtn"' : 'tabindex="-1"'}
                    aria-label="清空关键词"
                    ${st.keyword ? '' : 'hidden'}
                  >${ICONS.close}</button>
                  <button type="submit" class="search-submit" ${isLoading ? 'disabled' : ''} ${interactive ? '' : 'tabindex="-1"'}>
                    ${isLoading ? `${ICONS.spinner}<span>搜索中</span>` : '搜索'}
                  </button>
                </form>

                <div class="toolbar">
                  <button
                    type="button"
                    class="source-btn ${isFiltered ? 'is-filtered' : ''}"
                    ${interactive ? 'data-open-sources' : 'tabindex="-1"'}
                    aria-haspopup="dialog"
                    aria-label="选择搜索来源，当前为${esc(sourceText)}"
                  >
                    ${isFiltered ? '<span class="source-dot" aria-hidden="true"></span>' : ''}
                    <span class="source-label">${esc(sourceText)}</span>
                    ${ICONS.chevronDown}
                  </button>

                  <div class="sort-seg" role="tablist" aria-label="排序方式">
                    ${sortTabs.map(([key, label]) => `
                      <button
                        type="button"
                        class="sort-tab"
                        role="tab"
                        aria-selected="${st.sort === key}"
                        ${interactive ? `data-sort="${key}"` : 'tabindex="-1"'}
                      >${label}</button>
                    `).join('')}
                  </div>
                </div>
              </div>

              <main class="scroll-area" aria-live="polite">
                ${renderPhoneBody(st, interactive)}
              </main>
            </div>

            ${renderSheetHtml(st, interactive)}
            ${toastHtml}
            <div class="home-indicator" aria-hidden="true"></div>
          </div>
        `;
      }

      function showToast(text, isError = false) {
        liveState.toast = { text, isError };
        renderLivePhone();
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          liveState.toast = null;
          renderLivePhone();
        }, 2400);
      }

      function copyMagnet(item) {
        const uri = magnetUri(item);
        if (navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(uri).catch(() => {});
        }
        liveState.copiedId = item.id;
        showToast('已复制磁力链接');
        clearTimeout(copyResetTimer);
        copyResetTimer = setTimeout(() => {
          if (liveState.copiedId === item.id) {
            liveState.copiedId = null;
            renderLivePhone();
          }
        }, 1600);
      }

      function runSearch(keywordRaw) {
        const keyword = keywordRaw.trim();
        if (!keyword) {
          showToast('请输入搜索关键词', true);
          document.getElementById('liveQueryInput')?.focus();
          return;
        }
        clearTimeout(searchTimer);
        liveState.keyword = keyword;
        liveState.history = [keyword, ...liveState.history.filter(w => w !== keyword)].slice(0, 8);
        liveState.view = 'loading';
        liveState.sheet = null;
        studio.view = 'loading';
        syncStudioBar();
        renderLivePhone();

        searchTimer = setTimeout(() => {
          if (keyword.includes('不存在') || keyword === 'empty') {
            liveState.view = 'empty';
            studio.view = 'empty';
          } else if (keyword.includes('异常') || keyword === 'error') {
            liveState.view = 'error';
            studio.view = 'error';
          } else {
            liveState.items = PAGE_1_ITEMS.map(x => ({ ...x }));
            liveState.page = 1;
            liveState.view = 'results';
            studio.view = 'results';
          }
          syncStudioBar();
          renderLivePhone();
        }, 550);
      }

      function openMagnetSheet(item, forceFail = false) {
        clearTimeout(resolveTimer);
        if (item.magnet) {
          liveState.sheet = { type: 'magnet', item, status: 'ready' };
          renderLivePhone();
          return;
        }
        liveState.sheet = { type: 'magnet', item, status: 'resolving' };
        renderLivePhone();
        resolveTimer = setTimeout(() => {
          if (!liveState.sheet || liveState.sheet.type !== 'magnet' || liveState.sheet.item.id !== item.id) return;
          if (forceFail && item.failOnce) {
            item.failOnce = false;
            liveState.sheet = { type: 'magnet', item, status: 'error' };
          } else {
            item.magnet = true;
            liveState.sheet = { type: 'magnet', item, status: 'ready' };
          }
          renderLivePhone();
        }, 720);
      }

      function setLiveView(view) {
        clearTimeout(searchTimer);
        clearTimeout(resolveTimer);
        studio.view = view;
        liveState.sheet = null;

        if (view === 'home') {
          liveState.view = 'home';
          liveState.keyword = '';
        } else if (view === 'loading') {
          liveState.view = 'loading';
          if (!liveState.keyword) liveState.keyword = 'Ubuntu 24.04';
        } else if (view === 'results') {
          liveState.view = 'results';
          if (!liveState.keyword || liveState.keyword === '不存在的关键词') liveState.keyword = 'Ubuntu 24.04';
        } else if (view === 'empty') {
          liveState.view = 'empty';
          liveState.keyword = '不存在的关键词';
        } else if (view === 'error') {
          liveState.view = 'error';
          if (!liveState.keyword) liveState.keyword = 'Ubuntu 24.04';
        } else if (view === 'dialog') {
          liveState.view = 'results';
          if (!liveState.keyword || liveState.keyword === '不存在的关键词') liveState.keyword = 'Ubuntu 24.04';
          liveState.sheet = { type: 'magnet', item: PAGE_1_ITEMS[0], status: 'ready' };
        } else if (view === 'sources') {
          liveState.view = 'results';
          if (!liveState.keyword || liveState.keyword === '不存在的关键词') liveState.keyword = 'Ubuntu 24.04';
          liveState.sheet = { type: 'sources' };
        }

        syncStudioBar();
        renderLivePhone();
      }

      function bindLiveEvents(root) {
        const form = root.querySelector('#liveSearchForm');
        const input = root.querySelector('#liveQueryInput');
        const clearBtn = root.querySelector('#liveClearBtn');

        form?.addEventListener('submit', e => {
          e.preventDefault();
          runSearch(input.value);
        });

        input?.addEventListener('input', () => {
          liveState.keyword = input.value;
          if (clearBtn) clearBtn.hidden = !input.value;
        });

        clearBtn?.addEventListener('click', () => {
          liveState.keyword = '';
          input.value = '';
          clearBtn.hidden = true;
          liveState.view = 'home';
          studio.view = 'home';
          syncStudioBar();
          renderLivePhone();
          root.querySelector('#liveQueryInput')?.focus();
        });

        root.querySelector('[data-host-menu]')?.addEventListener('click', () => {
          showToast('宿主菜单：重新加载 / 收藏 / 退出');
        });

        root.querySelectorAll('[data-open-sources]').forEach(btn => {
          btn.addEventListener('click', () => {
            liveState.sheet = { type: 'sources' };
            renderLivePhone();
          });
        });

        root.querySelectorAll('[data-sort]').forEach(btn => {
          btn.addEventListener('click', () => {
            liveState.sort = btn.dataset.sort;
            renderLivePhone();
          });
        });

        root.querySelectorAll('[data-quick-query]').forEach(btn => {
          btn.addEventListener('click', () => runSearch(btn.dataset.quickQuery));
        });

        root.querySelectorAll('[data-home-source]').forEach(btn => {
          btn.addEventListener('click', () => {
            const name = btn.dataset.homeSource;
            liveState.source = liveState.source === name ? 'all' : name;
            showToast(liveState.source === 'all' ? '已恢复全部来源' : `已选定来源：${name}`);
            root.querySelector('#liveQueryInput')?.focus();
          });
        });

        root.querySelector('[data-clear-history]')?.addEventListener('click', () => {
          liveState.history = [];
          showToast('已清空最近搜索');
        });

        root.querySelectorAll('[data-reset-source]').forEach(btn => {
          btn.addEventListener('click', () => {
            liveState.source = 'all';
            renderLivePhone();
          });
        });

        root.querySelector('[data-focus-query]')?.addEventListener('click', () => {
          const inp = root.querySelector('#liveQueryInput');
          inp?.focus();
          inp?.select();
        });

        root.querySelector('[data-retry-search]')?.addEventListener('click', () => {
          runSearch(liveState.keyword || 'Ubuntu 24.04');
        });

        root.querySelector('[data-load-more]')?.addEventListener('click', () => {
          const existingIds = new Set(liveState.items.map(i => i.id));
          for (const item of PAGE_2_ITEMS) {
            if (!existingIds.has(item.id)) liveState.items.push({ ...item });
          }
          liveState.page = 2;
          showToast('已加载第 2 页结果');
        });

        root.querySelectorAll('[data-action-id]').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const id = Number(btn.dataset.actionId);
            const item = liveState.items.find(x => x.id === id);
            if (!item) return;
            if (item.magnet) copyMagnet(item);
            else openMagnetSheet(item, true);
          });
        });

        root.querySelectorAll('[data-card-id]').forEach(card => {
          const open = () => {
            const id = Number(card.dataset.cardId);
            const item = liveState.items.find(x => x.id === id);
            if (item) openMagnetSheet(item, true);
          };
          card.addEventListener('click', e => {
            if (e.target.closest('button') || String(window.getSelection?.() || '')) return;
            open();
          });
          card.addEventListener('keydown', e => {
            if (e.target === card && (e.key === 'Enter' || e.key === ' ')) {
              e.preventDefault();
              open();
            }
          });
        });

        root.querySelector('[data-sheet-backdrop]')?.addEventListener('click', e => {
          if (e.target.hasAttribute('data-sheet-backdrop')) {
            clearTimeout(resolveTimer);
            liveState.sheet = null;
            renderLivePhone();
          }
        });

        root.querySelectorAll('[data-sheet-close]').forEach(btn => {
          btn.addEventListener('click', () => {
            clearTimeout(resolveTimer);
            liveState.sheet = null;
            renderLivePhone();
          });
        });

        root.querySelectorAll('[data-pick-source]').forEach(btn => {
          btn.addEventListener('click', () => {
            liveState.source = btn.dataset.pickSource;
            liveState.sheet = null;
            showToast(liveState.source === 'all' ? '已切换为全部来源' : `已筛选来源：${liveState.source}`);
          });
        });

        root.querySelector('[data-copy-sheet-magnet]')?.addEventListener('click', () => {
          if (liveState.sheet?.type === 'magnet') copyMagnet(liveState.sheet.item);
        });

        root.querySelector('[data-retry-magnet]')?.addEventListener('click', () => {
          if (liveState.sheet?.type === 'magnet') openMagnetSheet(liveState.sheet.item, false);
        });
      }

      function renderLivePhone() {
        const host = document.getElementById('livePhoneHost');
        const activeId = document.activeElement?.id;
        const selStart = activeId === 'liveQueryInput' ? document.activeElement.selectionStart : null;

        host.innerHTML = renderPhoneHtml(liveState, {
          interactive: true,
          overview: false,
          embedded: studio.host === 'web',
          width: studio.width
        });
        bindLiveEvents(host);

        if (activeId === 'liveQueryInput') {
          const inp = host.querySelector('#liveQueryInput');
          if (inp) {
            inp.focus();
            if (selStart !== null) inp.setSelectionRange(selStart, selStart);
          }
        }

        const viewLabel = liveState.sheet?.type === 'magnet'
          ? '磁力详情弹层'
          : liveState.sheet?.type === 'sources'
            ? '来源选择弹层'
            : (VIEW_TITLES[liveState.view] || '首屏');
        document.getElementById('liveCaptionTitle').textContent = viewLabel;
        document.getElementById('liveCaptionMeta').textContent =
          `${studio.width} × 844 · ${studio.host === 'web' ? '网页嵌入（无顶栏）' : '手机宿主'}`;
      }

      function renderOverview() {
        const boards = [
          {
            title: '01 · 首屏（品牌主卡 + 快捷场景 + 来源矩阵）',
            meta: 'Home',
            state: { view: 'home', keyword: '', source: 'all', sort: 'relevance', history: DEFAULT_HISTORY, items: [], page: 1 }
          },
          {
            title: '02 · 加载中（结构匹配骨架屏）',
            meta: 'Loading',
            state: { view: 'loading', keyword: 'Ubuntu 24.04', source: 'all', sort: 'relevance', history: DEFAULT_HISTORY, items: [], page: 1 }
          },
          {
            title: '03 · 搜索结果（两色语义聚焦 + 一键复制）',
            meta: 'Results',
            state: { view: 'results', keyword: 'Ubuntu 24.04', source: 'all', sort: 'relevance', history: DEFAULT_HISTORY, items: PAGE_1_ITEMS.slice(0, 4), page: 1, copiedId: 1 }
          },
          {
            title: '04 · 磁力详情底部弹层（双段式 BTIH 卡）',
            meta: 'Magnet Sheet',
            state: { view: 'results', keyword: 'Ubuntu 24.04', source: 'all', sort: 'relevance', history: DEFAULT_HISTORY, items: PAGE_1_ITEMS.slice(0, 3), page: 1, sheet: { type: 'magnet', item: PAGE_1_ITEMS[0], status: 'ready' } }
          },
          {
            title: '05 · 来源选择底部弹层（带定位副标）',
            meta: 'Source Sheet',
            state: { view: 'results', keyword: 'Ubuntu 24.04', source: '海盗湾', sort: 'seeds', history: DEFAULT_HISTORY, items: PAGE_1_ITEMS, page: 1, sheet: { type: 'sources' } }
          },
          {
            title: '06 · 异常兜底与恢复指引',
            meta: 'Error',
            state: { view: 'error', keyword: 'Ubuntu 24.04', source: 'all', sort: 'relevance', history: DEFAULT_HISTORY, items: [], page: 1 }
          }
        ];

        document.getElementById('overviewGrid').innerHTML = boards.map(b => `
          <figure class="artboard" style="margin:0">
            <figcaption class="artboard-head">
              <span class="artboard-title">${b.title}</span>
              <span class="artboard-meta">${b.meta} · ${studio.width}px</span>
            </figcaption>
            ${renderPhoneHtml(b.state, {
              interactive: false,
              overview: true,
              embedded: studio.host === 'web',
              width: studio.width
            })}
          </figure>
        `).join('');
      }

      function syncStudioBar() {
        document.querySelectorAll('[data-mode]').forEach(btn => {
          btn.setAttribute('aria-pressed', String(btn.dataset.mode === studio.mode));
        });
        document.getElementById('studioStates').style.display = studio.mode === 'live' ? 'flex' : 'none';
        document.querySelectorAll('[data-view]').forEach(btn => {
          btn.setAttribute('aria-pressed', String(btn.dataset.view === studio.view));
        });
        document.querySelectorAll('[data-width]').forEach(btn => {
          btn.setAttribute('aria-pressed', String(Number(btn.dataset.width) === studio.width));
        });
        document.querySelectorAll('[data-host]').forEach(btn => {
          btn.setAttribute('aria-pressed', String(btn.dataset.host === studio.host));
        });
        const themeBtn = document.getElementById('themeToggle');
        const isDark = studio.theme === 'dark';
        document.documentElement.setAttribute('data-theme', studio.theme);
        themeBtn.textContent = isDark ? '浅色' : '深色';
        themeBtn.setAttribute('aria-pressed', String(isDark));

        document.getElementById('liveStage').hidden = studio.mode !== 'live';
        document.getElementById('overviewStage').hidden = studio.mode !== 'overview';
        document.getElementById('coverStage').hidden = studio.mode !== 'cover';
      }

      function setMode(mode) {
        studio.mode = mode;
        syncStudioBar();
        if (mode === 'live') renderLivePhone();
        else if (mode === 'overview') renderOverview();
        else if (mode === 'cover') {
          document.getElementById('coverPreview').innerHTML = buildCoverSvg();
        }
      }

      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
      });
      document.querySelectorAll('[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (studio.mode !== 'live') studio.mode = 'live';
          setLiveView(btn.dataset.view);
          syncStudioBar();
        });
      });
      document.querySelectorAll('[data-width]').forEach(btn => {
        btn.addEventListener('click', () => {
          studio.width = Number(btn.dataset.width);
          syncStudioBar();
          if (studio.mode === 'live') renderLivePhone();
          else if (studio.mode === 'overview') renderOverview();
        });
      });
      document.querySelectorAll('[data-host]').forEach(btn => {
        btn.addEventListener('click', () => {
          studio.host = btn.dataset.host;
          syncStudioBar();
          if (studio.mode === 'live') renderLivePhone();
          else if (studio.mode === 'overview') renderOverview();
        });
      });
      document.getElementById('themeToggle').addEventListener('click', () => {
        studio.theme = studio.theme === 'dark' ? 'light' : 'dark';
        syncStudioBar();
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && liveState.sheet) {
          clearTimeout(resolveTimer);
          liveState.sheet = null;
          renderLivePhone();
        }
      });

      const params = new URLSearchParams(location.search);
      if (params.get('theme') === 'dark') studio.theme = 'dark';
      if (params.get('width') === '360') studio.width = 360;
      if (params.get('host') === 'web') studio.host = 'web';

      const initialView = params.get('view');
      document.getElementById('coverPreview').innerHTML = buildCoverSvg();

      if (initialView === 'overview') {
        setMode('overview');
      } else if (initialView === 'cover') {
        setMode('cover');
      } else if (initialView && Object.hasOwn(VIEW_TITLES, initialView)) {
        studio.mode = 'live';
        setLiveView(initialView);
      } else {
        setMode('live');
      }
    })();
  </script>
</body>
</html>
