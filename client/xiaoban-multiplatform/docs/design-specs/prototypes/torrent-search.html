<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>万磁搜 · 小伴独立工具设计稿</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #222; background: #ececed; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #fd7979; outline-offset: 2px; }
    .review { max-width: 1180px; margin: 0 auto; padding: 24px 24px 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .review h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .review p { margin: 4px 0 0; font-size: 12px; color: #777; }
    .review .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .review button { min-height: 34px; border-radius: 9px; padding: 0 12px; background: #fff; color: #444; font-size: 12px; }
    .review button[aria-pressed="true"] { background: #222; color: white; }
    .layout { max-width: 1180px; margin: 0 auto; padding: 0 24px 32px; display: flex; gap: 24px; align-items: flex-start; justify-content: center; }
    .canvas-title { font-size: 12px; color: #777; margin: 0 0 9px 4px; }
    .phone { --xb-safe-top: 28px; --xb-safe-bottom: 18px; --xb-safe-left: 0px; --xb-safe-right: 0px; --xb-capsule-top: var(--xb-safe-top); --xb-capsule-right: 6px; --xb-capsule-width: 48px; --xb-capsule-height: 48px; position: relative; width: 390px; height: 844px; flex: none; overflow: hidden; border-radius: 34px; border: 7px solid #242427; background: linear-gradient(180deg,#fff1ee 0,#f5f5f7 310px); color: #183042; box-shadow: 0 16px 40px #20212620; }
    .status { height: 35px; padding: 8px 25px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
    .signal { letter-spacing: 1px; }
    .capsule { position: absolute; z-index: 10; top: var(--xb-capsule-top); right: var(--xb-capsule-right); width: var(--xb-capsule-width); height: var(--xb-capsule-height); display: grid; place-items: center; }
    .capsule svg { width: 16px; height: 16px; translate: 0 -6px; filter: drop-shadow(0 1px 1px #aaa8); }
    .viewport { position: absolute; inset: 35px 0 0; display: flex; flex-direction: column; }
    .hero { min-height: 70px; padding: 13px 16px 0; display: flex; align-items: flex-start; }
    .hero h2 { margin: 0; font-size: 25px; line-height: 34px; letter-spacing: -.5px; font-weight: 700; }
    .search-bar { display: flex; align-items: center; gap: 8px; margin: 0 16px; padding: 6px 6px 6px 12px; height: 52px; border-radius: 14px; background: #fff; border: 1px solid #e7e7ea; }
    .search-bar svg { width: 20px; height: 20px; color: #fd7979; flex: none; }
    .search-bar input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; color: #183042; }
    .search-bar input::placeholder { color: #aaa; }
    .search-bar button { height: 38px; min-width: 60px; padding: 0 14px; border-radius: 10px; color: #fff; background: #fd7979; font-size: 14px; font-weight: 650; }
    .source-row { display: flex; justify-content: flex-end; padding: 10px 16px 2px; }
    .source-select { position: relative; display: block; }
    .source-select select { appearance: none; min-width: 116px; height: 36px; padding: 0 30px 0 14px; border: 1px solid #e7e7ea; border-radius: 20px; background: #fff; color: #183042; font-size: 13px; cursor: pointer; }
    .source-select::after { content: ''; position: absolute; right: 13px; top: 13px; width: 6px; height: 6px; border-right: 1.7px solid #6e6872; border-bottom: 1.7px solid #6e6872; transform: rotate(45deg); pointer-events: none; }
    .scroll { min-height: 0; flex: 1; overflow-y: auto; padding: 12px 16px 34px; scrollbar-width: thin; }
    .result { margin-bottom: 12px; padding: 16px; border: 1px solid #1830420f; border-radius: 22px; background: #fff; box-shadow: 0 1px 2px #1830420a,0 8px 24px #1830420d; cursor: pointer; }
    .result:focus-visible { outline: 2px solid #fd7979; outline-offset: 2px; }
    .result .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .result h3 { font-size: 15px; line-height: 22px; margin: 0; font-weight: 650; overflow-wrap: anywhere; }
    .result .rank { flex: none; padding: 3px 9px; border-radius: 20px; background: #fce5ec; color: #e66a8d; font-size: 11px; font-weight: 700; }
    .result .bottom { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 12px; }
    .result .facts { display: flex; flex: 1 1 190px; flex-wrap: wrap; gap: 6px; }
    .fact { white-space: nowrap; padding: 5px 9px; border-radius: 20px; font-size: 12px; line-height: 16px; font-weight: 600; }
    .fact.source { background: #e4f4fd; color: #2d9cdb; }
    .fact.size { background: #fce5ec; color: #e66a8d; }
    .fact.date { background: #f0eaff; color: #8e6ce8; }
    .fact.downloads { background: #fff0e2; color: #f2994a; }
    .fact.seeds { background: #e5f8ee; color: #27ae60; }
    .result .actions { display: flex; justify-content: flex-end; margin-left: auto; }
    .result .actions button { min-height: 34px; padding: 0 12px; border-radius: 18px; font-size: 12px; font-weight: 600; }
    .result .actions .copy-link, .primary { background: #fff1ee; color: #f26060; }
    .more { width: 100%; height: 42px; border-radius: 22px; background: #fff; border: 1px solid #e7e7ea; color: #183042; font-size: 13px; margin: 8px 0; }
    .empty { text-align: center; padding: 112px 20px 0; }
    .empty .symbol { margin: auto auto 18px; width: 56px; height: 56px; border-radius: 50%; background: radial-gradient(circle,#fce5ec 0 40%,#fff1ee 41%); display: grid; place-items: center; color: #f26060; }
    .empty h3 { font-size: 16px; margin: 0 0 8px; }
    .empty p { font-size: 13px; line-height: 20px; color: #6e6872; margin: 0 0 20px; }
    .empty button { padding: 0 20px; height: 40px; border-radius: 20px; background: #fff1ee; color: #f26060; font-size: 13px; }
    .home-indicator { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 108px; height: 4px; border-radius: 4px; background: #333; }
    .sheet-layer { position: absolute; inset: 0; z-index: 8; background: #10223061; display: grid; place-items: center; padding: 20px; }
    .sheet { background: #fff; width: 100%; border-radius: 22px; padding: 18px; box-shadow: 0 12px 48px #18304238; }
    .sheet:focus { outline: none; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .sheet h3 { margin: 0; font-size: 16px; }
    .sheet .close { width: 32px; height: 32px; background: #eaeaef; border-radius: 50%; font-size: 20px; color: #6e6872; }
    .sheet p { color: #6e6872; font-size: 12px; line-height: 19px; margin: 4px 0 14px; }
    .sheet .magnet-link { background: #f5f5f7; border: 1px solid #e7e7ea; padding: 12px; border-radius: 12px; font-size: 12px; line-height: 18px; word-break: break-all; color: #183042; margin-bottom: 16px; max-height: 108px; overflow: auto; user-select: text; }
    .sheet .copy { min-height: 40px; padding: 0 18px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .toast { position: absolute; z-index: 11; bottom: 54px; left: 50%; transform: translateX(-50%); background: #333; color: white; border-radius: 20px; padding: 9px 15px; white-space: nowrap; font-size: 12px; }
    .dark .phone { background: linear-gradient(180deg,#1a1416 0,#0e1116 310px); color: #f2f4f7; }
    .dark .status, .dark .hero h2, .dark .result h3, .dark .empty h3 { color: #ececec; }
    .dark .search-bar, .dark .result, .dark .more, .dark .sheet, .dark .source-select select { background: #161a21; border-color: #ffffff12; color: #f2f4f7; }
    .dark .search-bar input { color: #ececec; }
    .dark .sheet .magnet-link, .dark .sheet .close, .dark .empty .symbol { background: #1c2129; color: #9aa2ae; border-color: #2a2f37; }
    .dark .fact.source { background: #16303f; }
    .dark .fact.size, .dark .result .rank { background: #36222a; }
    .dark .fact.date { background: #262040; }
    .dark .fact.downloads { background: #3a2a18; }
    .dark .fact.seeds { background: #17301f; }
    .dark .primary, .dark .result .actions .copy-link, .dark .empty button { background: #2a1f21; color: #fd7979; }
    .dark .search-bar button { background: #fd7979; color: #fff; }
    .dark .home-indicator { background: #ddd; }
    @media (max-width: 800px) { .layout { display: block; padding: 0 8px 24px; } .phone { margin: auto; max-width: 100%; } .review { padding: 15px 12px; } .review .actions { margin-left: 0; } }
    @media (max-width: 400px) { .phone { border-width: 0; border-radius: 0; width: 100%; height: 100dvh; } .canvas-title { display: none; } .layout { padding: 0; } }
  </style>
</head>
<body>
  <div class="review"><div><h1>万磁搜 · 独立工具应用</h1></div><div class="actions"><button data-view="home" aria-pressed="true">首屏</button><button data-view="results" aria-pressed="false">搜索结果</button><button data-view="empty" aria-pressed="false">无结果</button><button data-view="error" aria-pressed="false">服务失败</button><button id="theme">深色</button></div></div>
  <div class="layout"><div><p class="canvas-title" id="canvas-title">首屏</p><div class="phone" id="phone"><div class="status"><span>9:41</span><span class="signal">▴▴ ᴡɪғɪ ▰</span></div><div class="capsule" aria-label="宿主菜单示意"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg></div><div class="viewport"><header class="hero"><h2>万磁搜</h2></header><form class="search-bar" id="search-form"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 4.3 4.3"/></svg><input id="query" aria-label="搜索关键词" placeholder="搜索关键词" autocomplete="off"><button type="submit">搜索</button></form><div class="source-row"><label class="source-select"><select id="source" aria-label="搜索来源"><option value="all">全部来源</option><option value="0">Solid</option><option value="1">YuHuaGe</option><option value="2">海盗湾</option><option value="3">AcgRip</option><option value="4">Zero</option><option value="5">1337</option><option value="6">BtSow</option><option value="7">TorLock</option><option value="8">Kitty</option><option value="9">磁力猫</option><option value="10">磁力多</option></select></label></div><main class="scroll" id="content"></main></div><div class="home-indicator"></div></div></div></div>
  <script>
    const content = document.querySelector('#content');
    const query = document.querySelector('#query');
    const phone = document.querySelector('#phone');
    const views = {home:'首屏',results:'搜索结果',empty:'无结果',error:'服务失败'};
    const items = [
      {source:'海盗湾',title:'Ubuntu 24.04.1 LTS Desktop amd64',size:'5.8 GB',date:'2026-08-30',downloads:39,seeds:3,hash:'A14A4180F6DC9E48D68434D88DF59E0C32D1E584',magnet:true},
      {source:'BtSow',title:'Ubuntu 24.04 LTS Desktop ISO',size:'5.7 GB',date:'2026-07-11',downloads:77,seeds:50,hash:'E90710273A1E578835CAC80D3E4B3E56A2755663',magnet:true},
      {source:'TorLock',title:'Ubuntu 24.04 Desktop 64-bit',size:'5.8 GB',date:'2026-06-18',downloads:27,seeds:11,hash:'2C6B6858D61DA9543D4231A71DB4B1C9264B0685',magnet:false}
    ];
    let view = 'home';
    function toast(text){phone.querySelector('.toast')?.remove(); const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=text;phone.append(el);setTimeout(()=>el.remove(),2500);}
    function resultCard(item,index){return `<article class="result" data-card="${index}" tabindex="0" aria-label="${item.title}，查看磁力链接"><div class="head"><h3>${item.title}</h3><span class="rank">#${index+1}</span></div><div class="bottom"><div class="facts"><span class="fact source">${item.source}</span><span class="fact size">${item.size}</span><span class="fact date">${item.date}</span><span class="fact downloads">下载 ${item.downloads}</span><span class="fact seeds">做种 ${item.seeds}</span></div><div class="actions"><button class="copy-link" data-item="${index}">${item.magnet?'复制磁力':'获取磁力'}</button></div></div></article>`;}
    function setView(next,preserveQuery=false){view=next; document.querySelector('#canvas-title').textContent=views[next]; document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===next))); if(!preserveQuery) query.value=next==='home'?'':next==='empty'?'不存在的关键词':'Ubuntu 24.04';
      if(next==='home') content.innerHTML='';
      if(next==='results') content.innerHTML=`${items.map(resultCard).join('')}<button class="more" data-more>加载下一页</button>`;
      if(next==='empty') content.innerHTML='<div class="empty"><div class="symbol">⌕</div><h3>没有找到相关结果</h3><p>换一个更短的关键词，或切换搜索来源试试。</p><button data-retry>修改关键词</button></div>';
      if(next==='error') content.innerHTML='<div class="empty"><div class="symbol">!</div><h3>搜索暂时不可用</h3><p>所有来源都未能返回结果。可以稍后重试，或选择单个来源。</p><button data-retry>重试搜索</button></div>';
    }
    function showSheet(item){
      const link=`magnet:?xt=urn:btih:${item.hash}&dn=${encodeURIComponent(item.title)}`;
      const layer=document.createElement('div');
      layer.className='sheet-layer';
      layer.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="复制磁力链接" tabindex="-1"><div class="sheet-head"><h3>磁力链接</h3><button class="close" data-close aria-label="关闭">×</button></div><p>${item.title}</p><div class="magnet-link">${link}</div><button class="copy primary" data-copy>复制磁力链接</button></section>`;
      phone.append(layer);
      const close=()=>layer.remove();
      layer.onclick=e=>{if(e.target===layer)close()};
      layer.querySelector('[data-close]').onclick=close;
      layer.querySelector('[data-copy]').onclick=()=>toast('设计预览：已复制磁力链接');
      layer.querySelector('.sheet').focus();
      layer.onkeydown=e=>{if(e.key==='Escape')close()};
    }
    document.querySelector('#search-form').onsubmit=e=>{e.preventDefault(); if(!query.value.trim()) {query.focus();toast('请输入搜索关键词');return;} setView('results',true);};
    document.querySelector('#source').onchange=e=>toast('设计预览：已选择 '+e.target.selectedOptions[0].textContent);
    content.onclick=e=>{const b=e.target.closest('button');if(b?.dataset.item!==undefined){const item=items[+b.dataset.item];if(item.magnet)toast('设计预览：已复制磁力链接');else showSheet(item);return;}if(b?.hasAttribute('data-more')){toast('设计预览：加载第 2 页');return;}if(b?.hasAttribute('data-retry')){query.focus();toast('请修改关键词后重新搜索');return;}const card=e.target.closest('[data-card]');if(card)showSheet(items[+card.dataset.card]);};
    content.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-card]')){e.preventDefault();showSheet(items[+e.target.dataset.card]);}};
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
    document.querySelector('#theme').onclick=e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.textContent=dark?'浅色':'深色';};
    const initialView = new URLSearchParams(location.search).get('view');
    if(initialView==='dialog'){setView('results');showSheet(items[0]);}
    else setView(Object.hasOwn(views, initialView) ? initialView : 'home');
  </script>
</body>
</html>
