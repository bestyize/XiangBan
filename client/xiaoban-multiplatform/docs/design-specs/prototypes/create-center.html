<header class="review"><div><b>创造，让想法有个形状</b><small>小伴手机 · 交互设计提案 / 01</small></div><div class="tools"><button id="size">390 → 360</button><button id="theme">深色预览</button></div></header>
<main class="boards"><section class="board"><h2>01 / 发现 · 从喜欢的作品开始</h2><div class="phone" id="discover"></div></section><section class="board"><h2>02 / 我的作品 · 继续创造</h2><div class="phone" id="mine"></div></section><section class="board"><h2>03 / 作品操作 · 轻点卡片展开</h2><div class="phone" id="detail"></div></section></main>
<p class="footer-note">交互设计稿 · 可切换分类、查看作品、描述创作想法与模拟发送到电脑。所有内容为演示数据，不会创建作品或操作真实设备。<br>游戏及装扮共用作品入口；设备能力在预览页说明，发布到社区保留独立入口。</p>
<script>
const paths={spark:'M12 3l2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3Z M20 2v4 M18 4h4',arrow:'M5 12h14 M13 6l6 6-6 6',back:'M15 5l-7 7 7 7',plus:'M12 5v14 M5 12h14',close:'M6 6l12 12 M18 6L6 18',phone:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z M10 18h4',monitor:'M3 4h18v13H3Z M8 21h8 M12 17v4',chat:'M4 4h16v12H9l-5 4Z',community:'M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21v-2a6 6 0 0 1 12 0v2 M17 5a4 4 0 0 1 0 8 M17 16a5 5 0 0 1 5 5',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M4 21a8 8 0 0 1 16 0',wifi:'M3 9a15 15 0 0 1 18 0 M6 13a10 10 0 0 1 12 0 M9 17a5 5 0 0 1 6 0 M12 21h.01',play:'M8 4l12 8-12 8Z',edit:'M4 20l4-1L20 7l-3-3L5 16Z',check:'M5 12l4 4L19 6',trash:'M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7',share:'M12 16V3 M7 8l5-5 5 5 M5 13v8h14v-8',download:'M12 3v12 M7 10l5 5 5-5 M4 17v4h16v-4',more:'M5 12h.01 M12 12h.01 M19 12h.01'};

const items=[{id:'sun',name:'向日葵小伴',type:'伙伴',art:'pet',img:'create-center-assets/sunflower.webp',desc:'一株会回应你的向日葵。工作时安静陪伴，休息时，和它打个招呼。',device:'电脑桌面'},{id:'dusk',name:'暮色滑翔',type:'游戏',img:'game-center-assets/dusk-glider.svg',desc:'穿过山谷与落日，收集沿途的星光。一段轻盈的飞行，随时开始。',device:'手机 · 电脑'},{id:'hill',name:'柔软山丘',type:'壁纸',img:'create-center-assets/soft-hills.svg',desc:'让层层山丘随光线缓慢呼吸，为桌面留下一片宁静。',device:'电脑桌面'},{id:'clock',name:'日光时钟',type:'小组件',art:'clock-art',desc:'把时间、日期和一点温暖的日光放在桌面上。',device:'电脑桌面'},{id:'effect',name:'流萤之夜',type:'特效',art:'effect',desc:'细小的萤火在桌面缓缓浮动，让夜晚的工作多一点温柔。',device:'电脑桌面'},{id:'cube',name:'3D 全阶魔方',type:'游戏',img:'game-center-assets/pro-cube.svg',desc:'转动、打乱、还原。探索不同阶数的魔方，享受解开的瞬间。',device:'手机 · 电脑'}];
const deletedIds = new Set();
const states={discover:{tab:'发现',type:'全部'},mine:{tab:'我的作品',type:'全部'}};
function art(x,large=false){return `<div class="art ${x.art||''} ${large?'large-art':''}">${x.img?`<img src="${x.img}" alt="${x.name}">`:x.art==='clock-art'?'<div class="mini-clock"><small>星期日 · 宜慢一点</small><b>09:41</b><em>11 月 1 日 / 晴天</em></div>':Array.from({length:16},(_,i)=>`<i style="left:${8+(i*29)%86}%;top:${9+(i*17)%79}%;width:${i%3+2}px;height:${i%3+2}px"></i>`).join('')}${x.art==='pet'?'<div class="pet-body"><div class="pet-face"><i></i><i></i></div></div>':''}${large?`<span class="preview-tag">${icon('play')}效果预览</span>`:''}</div>`}
function status(){return `<div class="status">9:41<span>${icon('wifi')}<i class="battery"></i></span></div>`}
function nav(){return `<div class="nav-wrap"><nav class="nav" aria-label="底部导航"><button data-toast="小伴 AI：与小伴对话" aria-label="小伴 AI">${icon('chat')}</button><button class="selected" aria-current="page">${icon('spark')}创造</button><button class="publish" data-toast="发布入口：把作品和创作心得分享给社区" aria-label="发布">${icon('plus')}</button><button data-toast="社区：发现大家分享的作品与故事" aria-label="社区">${icon('community')}</button><button data-toast="我的：账号与个人设置" aria-label="我的">${icon('user')}</button></nav></div><div class="home"></div>`}
function card(x){return `<button class="card" data-actions="${x.id}">${art(x)}<h4>${x.name}</h4><div class="meta">${x.type}<span class="device">${icon(x.type==='游戏'?'phone':'monitor')}${x.type==='游戏'?'手机可玩':'电脑桌面'}</span></div></button>`}
function group(title,arr,type){return `<div class="section-head"><h3>${title}</h3><button data-filter="${type}">更多${type} ›</button></div><div class="grid">${arr.map(card).join('')}</div>`}
function work(x,subtitle,stamp){return `<article class="work"><button class="work-main" data-actions="${x.id}" data-owned="true" aria-label="${x.name}，打开作品操作">${art(x)}<div class="work-info"><h4>${x.name}</h4><p>${x.type} · ${subtitle}</p><small ${stamp.includes('已')?'class="green"':''}>${stamp}</small></div><span class="work-more">${icon('more')}</span></button></article>`}
function render(id){const host=document.getElementById(id),s=states[id];host.innerHTML=status()+`<div class="scroll"><div class="top-tabs">${['发现','我的作品'].map(t=>`<button data-tab="${t}" class="${s.tab===t?'active':''}" aria-pressed="${s.tab===t}">${t}</button>`).join('')}${s.tab==='我的作品'?`<button class="plus" data-create="" aria-label="新建作品">${icon('plus')}</button>`:''}</div>${s.tab==='发现'?`<button class="prompt" data-create="">${icon('spark').replace('<svg','<svg class="spark"')}<span><b>你想创造什么？</b><small>一个游戏，一片风景，一位小伙伴…</small></span>${icon('arrow').replace('<svg','<svg class="arrow"')}</button>`:`<div class="local-note">${icon('phone')}作品保存在本机 · 发送到电脑后可在那里使用</div>`}<div class="chips" aria-label="作品类型">${types.map(t=>`<button data-filter="${t}" class="${s.type===t?'active':''}" aria-pressed="${s.type===t}">${t}</button>`).join('')}</div>${s.tab==='发现'?(s.type==='全部'?group('给自己几分钟好玩',[items[1],items[5]],'游戏')+group('让桌面有点不一样',[items[0],items[2]],'伙伴')+group('小小细节，也能创造',[items[3],items[4]],'小组件'):`<div class="section-head"><h3>${s.type==='游戏'?'随时开始的一点乐趣':s.type+'灵感'}</h3><small>小伴精选</small></div><div class="grid">${items.filter(x=>x.type===s.type).map(card).join('')}</div>`):`<div class="section-head"><h3>最近创作</h3><small>按修改时间</small></div><div class="work-list">${[{x:items[1],sub:'手机可玩',stamp:'今天 09:32 修改'},{x:items[0],sub:'电脑桌面',stamp:'已发送到 READ 的电脑'},{x:items[2],sub:'电脑桌面',stamp:'昨天 21:08 修改'},{x:items[3],sub:'电脑桌面',stamp:'昨天 16:30 修改'}].filter(r=>!deletedIds.has(r.x.id) && (s.type==='全部'||r.x.type===s.type)).map(r=>work(r.x,r.sub,r.stamp)).join('')||'<div class="idea-note">还没有这类作品<br>从一个小小的想法开始吧。<br><button data-create="" style="color:var(--accent);margin-top:15px">＋ 创作第一件作品</button></div>'}</div><div class="idea-note">每个作品，都可以再往前一步。<br>换个颜色、加个玩法，让它更像你。</div>`}</div>`+nav()}
let selected=items[0];
function detail(x){selected=x;document.getElementById('detail').innerHTML=status()+`<div class="scroll"><div class="detailbar"><button data-back aria-label="返回发现">${icon('back')}</button><span>作品预览</span><button data-actions="${x.id}" aria-label="作品操作">${icon('more')}</button></div>${art(x,true)}<div class="detail-title"><h2>${x.name}</h2><span>${icon(x.type==='游戏'?'phone':'monitor')}${x.device}</span></div><p class="byline">小伴精选 · ${x.type}</p><p class="description">${x.desc}</p>${x.type==='游戏'?`<div class="device-card">${icon('phone')}<div><b>在手机上直接游玩</b><small>离线游玩 · 进度保存在本机</small></div></div>`:`<div class="device-card">${icon('monitor')}<div><b>READ 的电脑</b><small>发送后，在电脑上确认并添加到桌面</small></div><span class="online">● 在线</span></div><p class="byline" style="line-height:1.8">这是一件电脑桌面作品。你可以在手机上创作与预览，再发送到已连接的电脑。</p>`}</div><div class="detail-actions"><button class="secondary" data-actions="${x.id}">${icon('more').replace('<svg','<svg style="vertical-align:middle;margin-right:7px"')}作品操作</button></div><div class="home"></div>`}
function toast(host,msg){host.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;host.append(el);setTimeout(()=>el.remove(),3200)}
function sheet(host,body){host.querySelector('.sheet-wrap')?.remove();const el=document.createElement('div');el.className='sheet-wrap';el.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="创作与设备操作"><div class="handle"></div>${body}</section>`;host.append(el);el.addEventListener('click',e=>{if(e.target===el)el.remove()});el.querySelector('.sheet').tabIndex=-1;el.querySelector('.sheet').focus()}
function compose(host,value=''){sheet(host,`<div class="sheet-head"><h3>让想法开始发生</h3><button data-close aria-label="关闭">${icon('close')}</button></div><p>告诉小伴你想做什么，一起把它变成作品。</p><textarea aria-label="创作想法" placeholder="例如：做一只会打哈欠的小猫，陪我工作"></textarea><div class="suggestions"><button data-suggest="做一个收集星星的跳跃游戏">星星跳跃游戏</button><button data-suggest="做一张窗边下雨的动画壁纸">雨天窗边壁纸</button><button data-suggest="做一只会打哈欠的小猫伙伴">打哈欠的小猫</button></div><button class="primary" data-start>${icon('spark')}和小伴一起创作</button><p style="text-align:center;font-size:10px;margin-bottom:0">进入对话，先确认想法，再开始制作</p>`);host.querySelector('textarea').value=value}
function send(host,x){sheet(host,`<div class="sheet-head"><h3>发送到电脑</h3><button data-close aria-label="关闭">${icon('close')}</button></div><p>将「${x.name}」发送到你的电脑。</p><div class="device-card" style="margin:20px 0">${icon('monitor')}<div><b>READ 的电脑</b><small>Windows · 同一账号</small></div><span class="online">● 在线</span></div><p>作品会保留在手机上。电脑收到后，由你确认应用。</p><button class="primary" data-confirm-send>发送作品</button>`)}
function actions(host,x,owned=false){sheet(host,`<div class="action-heading">${art(x)}<div><h3>${x.name}</h3><p>${x.type} · ${owned?'我的作品': '小伴精选'}</p></div><button data-close aria-label="关闭作品操作">${icon('close')}</button></div><div class="action-group"><button class="action-row" ${x.type==='游戏'?'data-demo="设计预览：进入游戏独立全屏页面。"':`data-item="${x.id}"`}>${icon(x.type==='游戏'?'play':'spark')}<span>${x.type==='游戏'?'开始游玩':'预览效果'}</span><span class="row-tail">${x.type==='游戏'?'手机可玩':'查看作品'}</span></button><button class="action-row" data-create="${owned?'继续修改':'以'}${x.name}${owned?'':'为灵感，'}">${icon('edit')}<span>${owned?'继续修改':'做一个我的版本'}</span></button><button class="action-row" data-send="${x.id}">${icon('monitor')}<span>发送到电脑</span><span class="row-tail online">● 在线</span></button></div><div class="action-group"><button class="action-row" data-community="${x.id}" data-owned="${owned}">${icon('community')}<span>分享到社区</span></button><button class="action-row" data-channels="${x.id}">${icon('share')}<span>分享到其他渠道</span>${icon('arrow')}</button></div>${owned?`<div class="action-group"><button class="action-row danger" data-delete="${x.id}">${icon('trash')}<span>删除作品</span></button></div>`:''}<button class="sheet-cancel" data-close>取消</button>`)}
function community(host,x,owned){sheet(host,`<div class="sheet-head"><h3>分享到社区</h3><button data-close aria-label="关闭">${icon('close')}</button></div><div class="share-summary">${art(x)}<div><b>${x.name}</b><small>${owned?'我的作品':'分享小伴精选作品'} · ${x.type}</small></div></div><textarea aria-label="分享感想" placeholder="聊聊这个作品，或分享你的创作灵感…"></textarea><p>发布前可编辑说明、选择板块，并确认分享内容。</p><button class="primary" data-demo="设计预览：进入社区发布编辑页，作品卡片已附上。尚未发布。">前往发布页</button>`)}
function channels(host,x){sheet(host,`<div class="sheet-head"><h3>分享到其他渠道</h3><button data-close aria-label="关闭">${icon('close')}</button></div><p>选择分享形式，下一步选择接收应用。</p><div class="action-group"><button class="action-row" data-demo="设计预览：生成作品预览图，再打开手机系统分享面板。">${icon('share')}<span>分享预览图</span><span class="row-tail">微信、QQ 等</span></button><button class="action-row" data-demo="设计预览：导出兼容作品包，再打开手机系统分享面板。">${icon('download')}<span>分享作品包</span><span class="row-tail">可导入使用</span></button></div><p>本地作品无需先发布到社区，也可以分享。</p><button class="sheet-cancel" data-close>取消</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const host=b.closest('.phone'),s=states[host?.id];if(b.id==='theme'){document.body.classList.toggle('dark');b.textContent=document.body.classList.contains('dark')?'浅色预览':'深色预览';return}if(b.id==='size'){const narrow=b.textContent.startsWith('390');document.querySelectorAll('.board').forEach(x=>x.style.width=narrow?'360px':'390px');b.textContent=narrow?'360 → 390':'390 → 360';return}if(!host)return;if(b.hasAttribute('data-tab')){s.tab=b.dataset.tab;s.type='全部';render(host.id)}else if(b.hasAttribute('data-filter')){s.type=b.dataset.filter;render(host.id)}else if(b.dataset.actions){actions(host,items.find(x=>x.id===b.dataset.actions),b.dataset.owned==='true')}else if(b.dataset.delete){const x=items.find(x=>x.id===b.dataset.delete);sheet(host,`<div class="sheet-head"><h3>删除「${x.name}」？</h3><button data-close aria-label="取消删除">${icon('close')}</button></div><p>将删除这台手机上的作品文件、游戏进度和运行记录，无法撤销。已导出、分享或发布的副本不受影响。</p><div class="action-group"><button class="action-row danger" data-confirm-delete="${x.id}">${icon('trash')}<span>确认删除</span></button></div><button class="sheet-cancel" data-close>取消</button>`)}else if(b.dataset.confirmDelete){deletedIds.add(b.dataset.confirmDelete);host.querySelector('.sheet-wrap')?.remove();render('mine');toast(host,'设计演示：已移除该作品，没有删除真实文件。')}else if(b.dataset.community){community(host,items.find(x=>x.id===b.dataset.community),b.dataset.owned==='true')}else if(b.dataset.channels){channels(host,items.find(x=>x.id===b.dataset.channels))}else if(b.dataset.demo){b.closest('.sheet-wrap')?.remove();toast(host,b.dataset.demo)}else if(b.dataset.item){host.querySelector('.sheet-wrap')?.remove();detail(items.find(x=>x.id===b.dataset.item));document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}else if(b.hasAttribute('data-create'))compose(host,b.dataset.create);else if(b.dataset.send)send(host,items.find(x=>x.id===b.dataset.send));else if(b.hasAttribute('data-close'))b.closest('.sheet-wrap').remove();else if(b.dataset.suggest)host.querySelector('textarea').value=b.dataset.suggest;else if(b.hasAttribute('data-start')){const text=host.querySelector('textarea').value.trim();if(!text){host.querySelector('textarea').focus();return}b.closest('.sheet-wrap').remove();toast(host,'设计预览：将携带你的想法进入小伴 AI 对话，先确认制作方案。')}else if(b.hasAttribute('data-confirm-send')){b.closest('.sheet-wrap').remove();toast(host,'模拟发送成功 · 等待电脑端确认，未操作真实设备。')}else if(b.dataset.toast)toast(host,b.dataset.toast);else if(b.hasAttribute('data-back')){document.getElementById('discover').scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});toast(host,'左侧「发现」可选择其他作品')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.sheet-wrap').forEach(x=>x.remove())});
render('discover');render('mine');detail(items[0]);actions(document.getElementById('detail'),items[0],true);
</script></body></html>
