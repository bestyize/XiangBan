<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>小伴 · 动态壁纸</title>
<style>
:root {
  color-scheme: light;
  --page: #faf9f7;
  --card: #ffffff;
  --label: #262424;
  --subtle: #686461;
  --edge: #e7e4e2;
  --fill: #f2f2f2;
  --brand: #ba412f;
  --on-brand: #ffffff;
  --outside: #f0eeec;
  --safe-top: var(--xb-safe-top, env(safe-area-inset-top, 0px));
  --safe-bottom: var(--xb-safe-bottom, env(safe-area-inset-bottom, 0px));
  font-family: "Noto Sans SC", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--outside); color: var(--label); font-size: 15px; line-height: 22px; }
h1, h2, p { margin: 0; }
button { appearance: none; font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
.shell {
  position: relative;
  isolation: isolate;
  width: min(100%, 440px);
  height: 100dvh;
  min-height: 0;
  margin: 0 auto;
  overflow: hidden;
  background: var(--page);
}
.library, .detail { position: absolute; inset: 0; }
.library { overflow-y: auto; overscroll-behavior: contain; background: var(--page); }
.topbar {
  position: sticky;
  z-index: 3;
  top: 0;
  min-height: calc(56px + var(--safe-top));
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: center;
  background: var(--page);
  padding: var(--safe-top) max(8px,var(--xb-safe-right,env(safe-area-inset-right,0px))) 0 max(16px,var(--xb-safe-left,env(safe-area-inset-left,0px)));
}
.topbar h1 { font-size: 22px; line-height: 30px; font-weight: 720; min-width: 0; }
.toolbar-icon {
  display: grid;
  place-items: center;
  min-width: 48px;
  height: 48px;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 8px;
}
.toolbar-icon:hover { background: var(--fill); }
.more-mark { height: 3px; width: 3px; border-radius: 50%; background: currentColor; box-shadow: 0 -5px currentColor, 0 5px currentColor; }
.back-mark { width: 10px; height: 10px; margin-left: 4px; border-left: 1.8px solid; border-bottom: 1.8px solid; transform: rotate(45deg); }
.content { padding: 4px 16px calc(20px + var(--safe-bottom)); }
.gallery {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 16px 12px;
}
.wallpaper-card {
  display: flex;
  align-items: stretch;
  flex-direction: column;
  text-align: left;
  padding: 0;
  border: 1px solid var(--edge);
  border-radius: 16px;
  background: var(--card);
  overflow: hidden;
}
.wallpaper-card:active .poster { filter: brightness(.88); }
.poster-frame { position: relative; display: block; }
.poster { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; object-fit: cover; background: #0c2427; }
.applied-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  display: flex;
  gap: 5px;
  align-items: center;
  max-width: calc(100% - 16px);
  padding: 4px 8px;
  border-radius: 100px;
  background: #242825;
  color: #fff;
  font-size: 11px;
  line-height: 16px;
  font-weight: 640;
}
.applied-badge::before { content: ""; flex: 0 0 7px; height: 4px; border-left: 1.5px solid; border-bottom: 1.5px solid; margin-top: -2px; transform: rotate(-45deg); }
.card-caption { display: grid; grid-template-columns: minmax(0,1fr) 25px; gap: 4px; align-items: center; min-height: 57px; padding: 6px 10px; }
.caption-text { min-width: 0; display: grid; gap: 1px; }
.caption-name { font-size: 16px; line-height: 22px; font-weight: 680; }
.caption-note { color: var(--subtle); font-size: 12px; line-height: 16px; }
.play-mark { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid var(--edge); border-radius: 50%; color: var(--label); }
.play-mark::before { content: ""; width: 0; height: 0; margin-left: 2px; border-block: 4px solid transparent; border-left: 6px solid currentColor; }
.forward-mark { width: 7px; height: 7px; border-right: 1.6px solid var(--subtle); border-top: 1.6px solid var(--subtle); transform: rotate(45deg); justify-self: end; }
.slot-mark { display: grid; place-items: center; width: 32px; height: 32px; background: var(--fill); border-radius: 8px; }
.outline-phone { position: relative; width: 12px; height: 17px; border: 1.6px solid currentColor; border-radius: 3px; }
.outline-phone::after { position: absolute; content: ""; left: 2px; right: 2px; bottom: 2px; height: 1px; background: currentColor; }
.outline-lock { position: relative; width: 13px; height: 10px; border: 1.6px solid currentColor; border-radius: 2px; margin-top: 4px; }
.outline-lock::before { content: ""; position: absolute; width: 6px; height: 6px; top: -7px; left: 1.9px; border: 1.5px solid currentColor; border-bottom: 0; border-radius: 5px 5px 0 0; }
.outline-both { width: 13px; height: 16px; border: 1.5px solid currentColor; border-radius: 3px; box-shadow: 3px -2px 0 -1px var(--card), 4px -3px 0 -1px currentColor; }
.detail { color: #fff; background: #132320 var(--preview-image) center / cover no-repeat; }
.visual { position: absolute; inset: 0; }
.wall-canvas { position: absolute; display: block; width: 100%; height: 100%; inset: 0; touch-action: manipulation; }
.scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,#0b1416b9 0%,#0a161a1d 26%,#06131800 65%,#0a1116d1 100%);
  pointer-events: none;
}
.preview-bar {
  position: absolute;
  z-index: 2;
  top: var(--safe-top);
  left: max(8px,var(--xb-safe-left,env(safe-area-inset-left,0px)));
  right: max(8px,var(--xb-safe-right,env(safe-area-inset-right,0px)));
  min-height: 52px;
  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;
  text-align: center;
  text-shadow: 0 1px 8px #111a17b3;
}
.preview-bar h1 { font-size: 16px; line-height: 22px; font-weight: 660; }
.preview-bar .toolbar-icon:hover { background: #131c1e; }
.preview-modes {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  width: min(100%,234px);
  padding: 4px;
  gap: 2px;
  background: #212726;
  border-radius: 100px;
}
.preview-modes button {
  min-height: 36px;
  border: 0;
  border-radius: 100px;
  padding: 0 12px;
  background: transparent;
  color: #f4f4f1;
  font-size: 13px;
  line-height: 18px;
}
.preview-modes button[aria-pressed="true"] { background: #fff; color: #252725; font-weight: 660; }
.overlays { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 2px 10px #070e1259; }
.lock-screen {
  display: grid;
  justify-items: center;
  align-content: start;
  position: absolute;
  inset: 0;
  padding-top: max(100px, 17dvh);
  gap: 6px;
}
.lock-screen > .outline-lock { margin-bottom: 4px; }
.demo-date { font-size: 14px; line-height: 20px; font-weight: 570; }
.lock-time { font-size: clamp(70px, 22vw, 100px); font-weight: 330; line-height: 1.02; letter-spacing: -.065em; }
.home-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: max(104px, 17dvh) 23px calc(140px + var(--safe-bottom));
}
.home-time { font-size: 43px; line-height: 1.05; letter-spacing: -.055em; }
.home-screen .demo-date { display: block; margin-top: 3px; }
.mock-apps { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; color: white; }
.mock-app { text-align: center; display: grid; justify-items: center; gap: 4px; font-size: 12px; line-height: 16px; }
.mock-badge { height: 40px; width: 40px; border-radius: 11px; font-size: 16px; font-weight: 650; text-shadow: none; display: grid; place-items: center; }
.mock-badge.photos { background: #547f72; }
.mock-badge.notes { background: #8c623b; }
.mock-badge.clock { background: #685866; }
.mock-badge.camera { background: #3e5053; }
.mock-symbol { position: relative; width: 16px; height: 16px; border: 1.5px solid #fffaf5; border-radius: 4px; }
.photos .mock-symbol::before { content: ""; position: absolute; bottom: 2px; left: 2px; width: 10px; height: 7px; background: #fffaf5; clip-path: polygon(0 100%,21% 48%,45% 71%,72% 12%,100% 100%); }
.photos .mock-symbol::after { content: ""; position: absolute; top: 2px; left: 3px; width: 3px; height: 3px; border-radius: 50%; background: #fffaf5; }
.notes .mock-symbol { width: 13px; border-radius: 3px; }
.notes .mock-symbol::after { content: ""; position: absolute; width: 6px; height: 1px; top: 3px; left: 2px; background: #fffaf5; box-shadow: 0 3px #fffaf5, 0 6px #fffaf5; }
.clock .mock-symbol { border-radius: 50%; }
.clock .mock-symbol::after { content: ""; position: absolute; width: 4px; height: 5px; top: 2px; left: 6px; border-left: 1.4px solid #fffaf5; border-bottom: 1.4px solid #fffaf5; }
.camera .mock-symbol { height: 12px; }
.camera .mock-symbol::after { content: ""; position: absolute; width: 6px; height: 6px; left: 3.5px; top: 1.5px; border: 1.3px solid #fffaf5; border-radius: 50%; }
.preview-footer {
  position: absolute;
  z-index: 2;
  bottom: 0;
  left: 0;
  right: 0;
  display: grid;
  justify-items: center;
  gap: 10px;
  padding: 12px 16px calc(16px + var(--safe-bottom));
}
.primary {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 6px 12px;
  border: 0;
  border-radius: 100px;
  background: var(--brand);
  color: var(--on-brand);
  font-size: 15px;
  line-height: 22px;
  font-weight: 690;
}
.primary:hover { filter: brightness(.94); }
.layer { position: absolute; inset: 0; z-index: 5; background: #14141488; display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 100%; overflow-y: auto; background: var(--card); color: var(--label); border-radius: 24px 24px 0 0; padding: 8px 16px calc(12px + var(--safe-bottom)); }
.sheet-handle { width: 32px; height: 3px; margin: 0 auto 8px; border-radius: 3px; background: #b9b5b1; }
.sheet-title { min-height: 46px; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
.sheet-title h2 { font-size: 18px; line-height: 24px; font-weight: 680; }
.sheet-title .toolbar-icon { min-width: 40px; height: 40px; font-size: 22px; }
.destination {
  display: grid;
  grid-template-columns: 32px 1fr 10px;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 51px;
  padding: 4px 8px;
  text-align: left;
  border: 0;
  border-radius: 8px;
  background: transparent;
}
.destination:hover { background: var(--fill); }
.destination .slot-mark { background: var(--fill); }
.note { color: var(--subtle); font-size: 12px; line-height: 16px; margin: 8px 8px 3px; }
.menu-panel {
  position: absolute;
  z-index: 4;
  top: calc(50px + var(--safe-top));
  right: max(12px,var(--xb-safe-right,env(safe-area-inset-right,0px)));
  min-width: 143px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--edge);
  padding: 4px;
  box-shadow: 0 5px 15px #0d0d0c24;
}
.menu-panel button { min-height: 40px; width: 100%; padding: 0 12px; background: transparent; border: 0; border-radius: 8px; text-align: left; font-size: 13px; }
.menu-panel button:hover { background: var(--fill); }
.toast {
  position: absolute;
  z-index: 6;
  bottom: calc(18px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 10px 14px;
  border-radius: 100px;
  color: white;
  background: #302b29;
  text-align: center;
  font-size: 13px;
  line-height: 18px;
}
@media (min-width: 441px) {
  .shell { box-shadow: 0 0 1px #1b181521, 0 6px 40px #1b181511; }
}
@media (max-width: 364px) {
  .content { padding-left: 12px; padding-right: 12px; }
  .gallery { column-gap: 8px; }
  .card-caption { padding-left: 8px; padding-right: 8px; }
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #1b1a19;
    --card: #252423;
    --label: #f3efeb;
    --subtle: #bcb6b1;
    --edge: #383532;
    --fill: #33312e;
    --brand: #b84434;
    --outside: #131211;
  }
}
</style>
</head>
<body>
<main class="shell" id="shell">
  <section class="library" id="library" aria-labelledby="libraryTitle">
    <header class="topbar">
      <h1 id="libraryTitle">动态壁纸</h1>
      <button class="toolbar-icon" type="button" id="more" aria-label="更多" aria-controls="menu" aria-expanded="false"><i class="more-mark" aria-hidden="true"></i></button>
    </header>
    <div class="content">
      <section class="gallery" aria-label="内置壁纸">
        <button class="wallpaper-card" type="button" data-wallpaper="aquarium" aria-label="预览水下花园">
          <span class="poster-frame">
            <img class="poster" width="360" height="600" alt="">
            <span class="applied-badge" hidden></span>
          </span>
          <span class="card-caption">
            <span class="caption-text"><span class="caption-name">水下花园</span><span class="caption-note">互动涟漪</span></span>
            <i class="play-mark" aria-hidden="true"></i>
          </span>
        </button>
        <button class="wallpaper-card" type="button" data-wallpaper="galaxy" aria-label="预览银河">
          <span class="poster-frame">
            <img class="poster" width="360" height="600" alt="">
            <span class="applied-badge" hidden></span>
          </span>
          <span class="card-caption">
            <span class="caption-text"><span class="caption-name">银河</span><span class="caption-note">实时星系</span></span>
            <i class="play-mark" aria-hidden="true"></i>
          </span>
        </button>
      </section>
    </div>
  </section>

  <div class="menu-panel" id="menu" hidden><button id="reset" type="button">重新开始</button></div>

  <section class="detail" id="preview" aria-labelledby="previewTitle" hidden>
    <div class="visual" id="previewVisual"></div>
    <header class="preview-bar">
      <button class="toolbar-icon" id="previewBack" type="button" aria-label="返回壁纸库"><i class="back-mark" aria-hidden="true"></i></button>
      <h1 id="previewTitle">水下花园</h1>
      <button class="toolbar-icon" type="button" id="previewMore" aria-label="更多" aria-controls="menu" aria-expanded="false"><i class="more-mark" aria-hidden="true"></i></button>
    </header>
    <footer class="preview-footer">
      <div class="preview-modes" role="group" aria-label="预览模式">
        <button type="button" data-mode="wallpaper" aria-pressed="true">壁纸</button>
        <button type="button" data-mode="home" aria-pressed="false">桌面</button>
        <button type="button" data-mode="lock" aria-pressed="false">锁屏</button>
      </div>
      <button class="primary" id="openPlacement" type="button" aria-haspopup="dialog">设为壁纸</button>
    </footer>
  </section>

  <div class="layer" id="placement" role="dialog" aria-modal="true" aria-labelledby="placementTitle" hidden>
    <div class="sheet">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-title">
        <h2 id="placementTitle">应用到</h2>
        <button class="toolbar-icon" id="cancelPlacement" type="button" aria-label="取消">×</button>
      </header>
      <button class="destination" type="button" data-destination="home"><i class="slot-mark" aria-hidden="true"><i class="outline-phone"></i></i><span>手机桌面</span><i class="forward-mark" aria-hidden="true"></i></button>
      <button class="destination" type="button" data-destination="lock"><i class="slot-mark" aria-hidden="true"><i class="outline-lock"></i></i><span>锁屏</span><i class="forward-mark" aria-hidden="true"></i></button>
      <button class="destination" type="button" data-destination="both"><i class="slot-mark" aria-hidden="true"><i class="outline-both"></i></i><span>桌面和锁屏</span><i class="forward-mark" aria-hidden="true"></i></button>
      <p class="note">可用位置以手机系统为准</p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>

<template id="homeOverlay">
  <div class="home-screen" aria-hidden="true">
    <div><span class="home-time">09:41</span><span class="demo-date">11 月 18 日 周三</span></div>
    <div class="mock-apps">
      <span class="mock-app"><i class="mock-badge photos"><i class="mock-symbol"></i></i>相册</span>
      <span class="mock-app"><i class="mock-badge notes"><i class="mock-symbol"></i></i>便签</span>
      <span class="mock-app"><i class="mock-badge clock"><i class="mock-symbol"></i></i>时钟</span>
      <span class="mock-app"><i class="mock-badge camera"><i class="mock-symbol"></i></i>相机</span>
    </div>
  </div>
</template>

<template id="lockOverlay">
  <div class="lock-screen" aria-hidden="true">
    <i class="outline-lock"></i>
    <span class="demo-date">11 月 18 日 周三</span>
    <span class="lock-time">09:41</span>
  </div>
</template>

<script>
(() => {
  function random(seed) {
    return () => {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  function waterBackground() {
    const layer = document.createElement('canvas');
    layer.width = 320;
    layer.height = 560;
    const ctx = layer.getContext('2d');
    const water = ctx.createLinearGradient(0, 0, 55, 560);
    water.addColorStop(0, '#266d6a');
    water.addColorStop(.53, '#10393b');
    water.addColorStop(1, '#061b25');
    ctx.fillStyle = water;
    ctx.fillRect(0, 0, 320, 560);
    const light = ctx.createRadialGradient(133, 5, 12, 132, 4, 360);
    light.addColorStop(0, '#baf2c299');
    light.addColorStop(1, '#4b9f7b00');
    ctx.fillStyle = light;
    ctx.fillRect(0, 0, 320, 560);

    const rng = random(35);
    for (let i = 0; i < 12; i++) {
      const x = rng() * 320;
      ctx.fillStyle = 'rgba(195,255,202,' + (.025 + rng() * .045) + ')';
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + rng() * 45, 0);
      ctx.lineTo(x + 56, 350);
      ctx.fill();
    }
    for (let i = 0; i < 95; i++) {
      const x = rng() * 320;
      const y = 556 - rng() * 112 + Math.sin(x * .028) * 22;
      ctx.fillStyle = ['#173735', '#234443', '#284d46', '#31514a'][i % 4];
      ctx.beginPath();
      ctx.ellipse(x, y, 5 + rng() * 35, 3 + rng() * 19, rng() - .5, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 54; i++) {
      const x = i < 27 ? rng() * 75 : 238 + rng() * 85;
      const y = 518 + rng() * 44;
      const dx = (rng() - .5) * 74;
      const h = 35 + rng() * 142;
      ctx.fillStyle = ['#153a33', '#235046', '#386456', '#47775d'][i % 4];
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + dx * .7 - 8, y - h * .57, x + dx, y - h);
      ctx.quadraticCurveTo(x + dx * .75 + 11, y - h * .47, x + 3.5, y);
      ctx.fill();
    }
    return layer;
  }

  function aquarium(canvas, fps) {
    const ctx = canvas.getContext('2d', { alpha: false });
    const background = waterBackground();
    const rng = random(17);
    const fish = Array.from({ length: fps === 15 ? 8 : 13 }, (_, i) => ({
      x: rng(), y: .22 + rng() * .54, speed: .023 + rng() * .03, phase: rng() * 7,
      scale: .45 + rng() * .68, direction: i % 3 === 0 ? -1 : 1,
      color: ['#ffbd86', '#ff875f', '#f5e5ba', '#afd5c6'][i % 4],
    }));
    const bubbles = Array.from({ length: 18 }, () => ({ x: rng(), y: rng(), r: 1 + rng() * 2 }));
    const ripples = [];
    let time = 0;

    return {
      draw(t) {
        const w = canvas.width, h = canvas.height;
        const unit = Math.min(w, h) / 330;
        time = t;
        ctx.drawImage(background, 0, 0, w, h);
        for (const bubble of bubbles) {
          const y = 1 - (bubble.y + t * .041) % 1;
          ctx.strokeStyle = 'rgba(201,249,233,' + (.12 + y * .22) + ')';
          ctx.lineWidth = unit;
          ctx.beginPath();
          ctx.arc((bubble.x + Math.sin(t + bubble.y * 12) * .016) * w, y * h, bubble.r * unit, 0, Math.PI * 2);
          ctx.stroke();
        }
        for (const fishBody of fish) {
          const path = (fishBody.x + t * fishBody.speed) % 1 * 1.24 - .12;
          const x = fishBody.direction === 1 ? path : 1 - path;
          const y = fishBody.y + Math.sin(t * .9 + fishBody.phase) * .038;
          const size = fishBody.scale * unit;
          ctx.save();
          ctx.translate(x * w, y * h);
          ctx.rotate(Math.cos(t * .9 + fishBody.phase) * .10 * fishBody.direction);
          ctx.scale(fishBody.direction * size, size);
          ctx.fillStyle = fishBody.color;
          ctx.globalAlpha = .79;
          const tail = Math.sin(t * 12 + fishBody.phase) * 3.5;
          ctx.beginPath();
          ctx.moveTo(-10, 0);
          ctx.quadraticCurveTo(-18, -8 + tail, -24, -5 + tail);
          ctx.quadraticCurveTo(-19, tail, -24, 5 + tail);
          ctx.quadraticCurveTo(-16, 7 + tail, -10, 0);
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.beginPath();
          ctx.moveTo(-15, 0);
          ctx.bezierCurveTo(-7, -7, 8, -9, 16, -1);
          ctx.bezierCurveTo(14, 6, -6, 7, -15, 0);
          ctx.fill();
          ctx.fillStyle = '#fff4cfb0';
          ctx.beginPath();
          ctx.ellipse(0, 2, 6, 1.7, .38, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#163132';
          ctx.beginPath();
          ctx.arc(11, -1.6, 1.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        while (ripples.length && time - ripples[0].start > 1.6) ripples.shift();
        ctx.lineWidth = 1.5 * unit;
        for (const ripple of ripples) {
          const age = (time - ripple.start) / 1.6;
          ctx.strokeStyle = 'rgba(220,255,233,' + ((1 - age) * .68) + ')';
          for (let i = 0; i < 2; i++) {
            const radius = (12 + age * 112 + i * 12) * unit;
            ctx.beginPath();
            ctx.ellipse(ripple.x * w, ripple.y * h, radius, radius * .54, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      },
      tap(x, y) {
        if (ripples.length === 6) ripples.shift();
        ripples.push({ x, y, start: time });
      },
    };
  }

  function starData(count) {
    const rng = random(245);
    const stars = new Float32Array(count * 4);
    for (let i = 0; i < count; i++) {
      const core = i < count * .25;
      const radius = core ? .29 * Math.pow(rng(), 1.75) : .09 + .89 * Math.pow(rng(), 1.3);
      const spread = (rng() + rng() - 1) * .74;
      const angle = core ? rng() * Math.PI * 2 : i % 4 * Math.PI / 2 + Math.log(radius + .14) * 2.25 + spread;
      stars[i * 4] = Math.cos(angle) * radius;
      stars[i * 4 + 1] = Math.sin(angle) * radius;
      stars[i * 4 + 2] = (rng() + rng() - 1) * (core ? .22 : .075);
      stars[i * 4 + 3] = rng();
    }
    return stars;
  }

  function galaxyFallback(canvas) {
    const ctx = canvas.getContext('2d', { alpha: false });
    const stars = starData(630);
    let offset = 0;

    return {
      draw(t) {
        const w = canvas.width, h = canvas.height;
        const angle = t * .09 + offset;
        const c = Math.cos(angle), s = Math.sin(angle);
        ctx.fillStyle = '#0b1020';
        ctx.fillRect(0, 0, w, h);
        const scale = Math.min(w, h) * .52;
        for (let i = 0; i < stars.length; i += 4) {
          const x = stars[i], y = stars[i + 1], z = stars[i + 2];
          ctx.fillStyle = Math.hypot(x, y) < .3 ? '#ffce9f' : '#a1bce7';
          ctx.globalAlpha = .25 + stars[i + 3] * .62;
          ctx.fillRect(w * .5 + scale * (x * c - y * s), h * .49 + scale * ((x * s + y * c) * .61 + z), 1.6, 1.6);
        }
        ctx.globalAlpha = 1;
      },
      tap(x) { offset += (x - .5) * .5; },
    };
  }

  function galaxy(canvas, fps) {
    const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false });
    if (!gl) return galaxyFallback(canvas);
    const count = fps === 15 ? 3400 : 7600;
    const stars = starData(count);
    let offset = 0, target = 0;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message || '壁纸着色器编译失败');
      }
      return shader;
    }

    function setup() {
      const vs = compile(gl.VERTEX_SHADER, [
        'attribute vec4 star;',
        'uniform vec2 size;',
        'uniform float angle;',
        'varying vec4 color;',
        'void main() {',
        '  float c = cos(angle), s = sin(angle);',
        '  vec2 p = mat2(c, s, -s, c) * star.xy;',
        '  float f = 1.0 / (1.0 + p.y * 0.28);',
        '  vec2 axis = vec2(p.x, p.y * .62 + star.z * .95);',
        '  gl_Position = vec4(axis * min(size.x, size.y) / size * f * .97, 0.0, 1.0);',
        '  gl_PointSize = min(4.5, max(1.2, size.x / 460.0) * (1.0 + star.w * 1.5) * f);',
        '  float rim = smoothstep(.12, .89, length(star.xy));',
        '  vec3 light = mix(vec3(1.0, .55, .27), vec3(.39, .65, .99), rim);',
        '  color = vec4(mix(light, vec3(1.0, .94, .85), pow(star.w, 4.0)), .17 + star.w * .50);',
        '}',
      ].join('\n'));
      const fs = compile(gl.FRAGMENT_SHADER, [
        'precision mediump float;',
        'varying vec4 color;',
        'void main() {',
        '  float fade = 1.0 - smoothstep(.0, .5, length(gl_PointCoord - .5));',
        '  gl_FragColor = vec4(color.rgb, color.a * fade);',
        '}',
      ].join('\n'));
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const message = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error(message || '壁纸着色器链接失败');
      }
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, stars, gl.STATIC_DRAW);
      const star = gl.getAttribLocation(program, 'star');
      gl.enableVertexAttribArray(star);
      gl.vertexAttribPointer(star, 4, gl.FLOAT, false, 0, 0);
      gl.clearColor(.031, .045, .08, 1);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      return { program, buffer, size: gl.getUniformLocation(program, 'size'), angle: gl.getUniformLocation(program, 'angle') };
    }

    let state = setup();
    const onLost = event => { event.preventDefault(); state = null; };
    const onRestored = () => { state = setup(); };
    canvas.addEventListener('webglcontextlost', onLost);
    canvas.addEventListener('webglcontextrestored', onRestored);

    return {
      draw(t) {
        if (!state) return;
        const w = canvas.width, h = canvas.height;
        offset += (target - offset) * .10;
        gl.viewport(0, 0, w, h);
        gl.uniform2f(state.size, w, h);
        gl.uniform1f(state.angle, t * .11 + offset);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.POINTS, 0, count);
      },
      tap(x) { target += (x - .5) * 1.1; },
      destroy() {
        canvas.removeEventListener('webglcontextlost', onLost);
        canvas.removeEventListener('webglcontextrestored', onRestored);
        if (state) {
          gl.deleteProgram(state.program);
          gl.deleteBuffer(state.buffer);
          gl.getExtension('WEBGL_lose_context')?.loseContext();
        }
      },
    };
  }

  window.createWallpaperScene = (canvas, kind, fps) => {
    const view = kind === 'galaxy' ? galaxy(canvas, fps) : aquarium(canvas, fps);
    let active = false, resize = true, frame = 0, elapsed = 0, previous = 0, next = 0;
    const interval = 1000 / fps;
    const observer = new ResizeObserver(() => { resize = true; });
    observer.observe(canvas);

    function draw(now) {
      if (!active) return;
      if (now + .5 >= next) {
        if (resize) {
          const ratio = Math.min(devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, Math.round(canvas.clientWidth * ratio));
          canvas.height = Math.max(1, Math.round(canvas.clientHeight * ratio));
          resize = false;
        }
        if (previous) elapsed += Math.min(.1, (now - previous) / 1000);
        previous = now;
        next = next && now - next < interval ? next + interval : now + interval;
        view.draw(elapsed);
      }
      frame = requestAnimationFrame(draw);
    }

    function setActive(visible) {
      if (active === visible) return;
      active = visible;
      if (visible) {
        previous = next = 0;
        frame = requestAnimationFrame(draw);
      } else {
        cancelAnimationFrame(frame);
      }
    }

    return {
      setActive,
      tap(x, y) { view.tap(x, y); },
      destroy() {
        setActive(false);
        observer.disconnect();
        view.destroy?.();
      },
    };
  };
})();

  });
  const positionNames = {home: "手机桌面", lock: "锁屏", both: "桌面和锁屏"};
  const get = id => document.getElementById(id);
  const cards = [...document.querySelectorAll("[data-wallpaper]")];
  const modeButtons = [...document.querySelectorAll("[data-mode]")];
  const destinations = [...document.querySelectorAll("[data-destination]")];
  const menuButtons = [get("more"), get("previewMore")];
  const openPlacement = get("openPlacement");
  const previewVisual = get("previewVisual");
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const assignments = {home: null, lock: null};
  const rootState = {page: "library", index: 0, scene: null, mode: "wallpaper"};
  let state = rootState;
  let animation;
  let sceneCanvas;
  let overlay;
  let mountedId;
  let toastTimer;
  let applying = false;

  function inform(message) {
    clearTimeout(toastTimer);
    get("toast").textContent = message;
    get("toast").hidden = false;
    toastTimer = setTimeout(() => { get("toast").hidden = true; }, 2400);
  }

  function hideMenu() {
    get("menu").hidden = true;
    menuButtons.forEach(button => button.setAttribute("aria-expanded", "false"));
  }

  function clearVisual() {
    animation?.destroy();
    previewVisual.replaceChildren();
    animation = undefined;
    mountedId = undefined;
    sceneCanvas = undefined;
    overlay = undefined;
  }

  function motion() {
    animation?.setActive(!document.hidden && !reducedMotion.matches && state.page === "preview");
    if (sceneCanvas) sceneCanvas.hidden = reducedMotion.matches;
  }

  function mountVisual() {
    if (mountedId !== state.scene) {
      clearVisual();
      const wall = wallpapers[state.scene];
      get("preview").style.setProperty("--preview-image", 'url("' + wall.image + '")');
      mountedId = state.scene;

      const canvas = document.createElement("canvas");
      canvas.className = "wall-canvas";
      const cover = document.createElement("div");
      cover.className = "scrim";
      cover.setAttribute("aria-hidden", "true");
      overlay = document.createElement("div");
      overlay.className = "overlays";
      previewVisual.append(canvas, cover, overlay);
      sceneCanvas = canvas;
      try {
        animation = window.createWallpaperScene(canvas, state.scene, 30);
        canvas.addEventListener("pointerup", event => {
          if (state.mode === "lock" || state.page !== "preview") return;
          const rect = canvas.getBoundingClientRect();
          animation.tap((event.clientX - rect.left) / rect.width, (event.clientY - rect.top) / rect.height);
        });
      } catch (_) {
        canvas.remove();
        sceneCanvas = undefined;
      }
    }
    overlay.replaceChildren();
    const overlayTemplate = get(state.mode + "Overlay");
    if (overlayTemplate) overlay.append(overlayTemplate.content.cloneNode(true));
    motion();
  }

  function render(shouldFocus = false) {
    const page = state.page;
    get("shell").dataset.page = page;
    const library = page === "library";
    const placement = page === "placement";
    get("library").hidden = !library;
    get("preview").hidden = library;
    get("preview").inert = placement;
    get("placement").hidden = !placement;
    hideMenu();
    if (library) {
      clearVisual();
      return;
    }
    get("previewTitle").textContent = wallpapers[state.scene].name;
    modeButtons.forEach(button => button.setAttribute("aria-pressed", button.dataset.mode === state.mode));
    mountVisual();
    if (shouldFocus) {
      (placement ? destinations[0] : get("previewBack")).focus({preventScroll: true});
    }
  }

  function push(page, scene = state.scene, mode = state.mode) {
    const next = {page, index: state.index + 1, scene, mode};
    history.pushState(next, "");
    state = next;
    render(true);
  }

  function back() {
    if (state.index > 0) history.back();
  }

  function updateCards() {
    cards.forEach(card => {
      const id = card.dataset.wallpaper;
      const onHome = assignments.home === id;
      const onLock = assignments.lock === id;
      let label = "";
      if (onHome && onLock) label = "桌面和锁屏使用中";
      else if (onHome) label = "桌面使用中";
      else if (onLock) label = "锁屏使用中";

      const badge = card.querySelector(".applied-badge");
      badge.textContent = label;
      badge.hidden = !label;
      card.setAttribute("aria-label", ["预览" + wallpapers[id].name, label].filter(Boolean).join("，"));
    });
  }

  cards.forEach(card => {
    const id = card.dataset.wallpaper;
    card.querySelector(".poster").src = wallpapers[id].image;
    card.addEventListener("click", () => {
      let mode = "wallpaper";
      if (assignments.home === id) mode = "home";
      else if (assignments.lock === id) mode = "lock";
      push("preview", id, mode);
    });
  });
  modeButtons.forEach(option => option.addEventListener("click", () => {
    state = {...state, mode: option.dataset.mode};
    history.replaceState(state, "");
    render();
  }));
  get("previewBack").addEventListener("click", back);
  get("cancelPlacement").addEventListener("click", back);
  openPlacement.addEventListener("click", () => push("placement"));
  get("placement").addEventListener("click", event => {
    if (event.target.id === "placement") back();
  });
  destinations.forEach(row => row.addEventListener("click", () => {
    if (state.page !== "placement" || applying) return;
    applying = true;
    const position = row.dataset.destination;
    const selected = state.scene;
    if (position === "home" || position === "both") assignments.home = selected;
    if (position === "lock" || position === "both") assignments.lock = selected;
    updateCards();
    inform("已设为" + positionNames[position] + "壁纸");
    history.go(-state.index);
  }));
  menuButtons.forEach(button => button.addEventListener("click", () => {
    get("menu").hidden = !get("menu").hidden;
    button.setAttribute("aria-expanded", !get("menu").hidden);
    if (!get("menu").hidden) get("reset").focus({preventScroll: true});
  }));
  get("reset").addEventListener("click", () => {
    assignments.home = assignments.lock = null;
    updateCards();
    get("toast").hidden = true;
    hideMenu();
    if (state.index) history.go(-state.index);
    else get("more").focus({preventScroll: true});
  });
  document.addEventListener("pointerdown", event => {
    if (!event.target.closest("#menu, #more, #previewMore")) hideMenu();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (!get("menu").hidden) {
        hideMenu();
        get(state.page === "preview" ? "previewMore" : "more").focus({preventScroll: true});
      } else if (state.index > 0) back();
      return;
    }
    if (state.page !== "placement" || event.key !== "Tab") return;
    const first = get("cancelPlacement");
    const last = destinations[destinations.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
  window.addEventListener("popstate", event => {
    applying = false;
    const previous = state;
    state = event.state?.page ? event.state : rootState;
    const canceledPlacement = previous.page === "placement" && state.page === "preview";
    render(!canceledPlacement);
    if (canceledPlacement) openPlacement.focus({preventScroll: true});
    if (state.page === "library" && previous.scene) {
      cards.find(card => card.dataset.wallpaper === previous.scene)?.focus({preventScroll: true});
    }
  });
  document.addEventListener("visibilitychange", motion);
  reducedMotion.addEventListener("change", motion);
  history.replaceState(rootState, "");
  render();
})();
</script>
