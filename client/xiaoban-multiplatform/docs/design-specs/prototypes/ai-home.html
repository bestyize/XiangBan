<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>小伴 AI 首页 · 设计预览</title>
<style>
* { box-sizing: border-box }
:root { color-scheme: light dark; --page:#faf7f1; --surface:#fff; --ink:#201e20; --sub:#706b6d; --line:#e8e5e5; --brand:#c83947 }
@media(prefers-color-scheme:dark) {
  :root { --page:#211f20; --surface:#252326; --ink:#f4eff2; --sub:#b8b0b7; --line:#393539 }
}
body { margin:0; background:var(--line); color:var(--ink); font:15px/1.45 system-ui,"PingFang SC",sans-serif }
.phone { max-width:410px; margin:auto; height:100dvh; display:flex; flex-direction:column; background:var(--page) }
svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none }
.status,header,.entry,.tool,li,nav { display:flex; align-items:center }
.status { justify-content:space-between; padding:7px 20px 0; height:30px; font-size:12px; font-weight:650 }
.battery { display:inline-block; width:19px; height:10px; border:1px solid currentColor; border-radius:3px; padding:1px; margin-left:4px }
.battery::after { content:''; display:block; width:35%; height:100%; background:currentColor }
header { height:48px; flex:none; padding:0 17px; gap:12px }
header strong { font-size:18px; flex:1 }
main { flex:1; min-height:0; overflow:auto; padding:0 20px 14px; scrollbar-width:none }
.greeting { display:flex; align-items:center; justify-content:space-between; min-height:126px; padding:8px 0 }
.copy { flex:1; min-width:0 }
.greeting img { width:38%; height:102px; object-fit:contain }
time,small { font-size:12px; line-height:16px; display:block }
time { color:#a33c47 }
h1 { font: bold 32px/40px "Songti SC",serif; margin:3px 0 }
p { font-size:13px; line-height:18px; color:var(--sub); margin:0 }
small { color:var(--sub) }
h2 { font-size:16px; line-height:22px; margin:12px 0 8px; display:flex; align-items:center; gap:12px }
h2::after { content:""; flex:1; height:1px; background:var(--line) }
.tools { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px }
.tool { flex-direction:column; text-align:center; padding:4px 0; font-size:13px; line-height:18px }
.tool b { margin-top:6px }
.tool img { display:block; width:50px; height:50px }
ul { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; list-style:none; margin:0; padding:0 }
li { display:block; min-height:96px; padding:12px; border-radius:12px; background:color-mix(in srgb,var(--t) 7.5%,transparent) }
li span { display:flex; gap:5px; align-items:center; color:var(--sub); font-size:12px; line-height:16px }
li strong { display:block; margin-top:7px; font-size:15px; line-height:22px; font-weight:500 }
li svg { width:15px; height:15px; color:var(--t) }
.ochre { --t:#b06a34 }.indigo { --t:#3d6b8c }.pine { --t:#4c7d5f }.plum { --t:#7a5a8c }
@media(prefers-color-scheme:dark) {
  time { color:#ff9ba4 }
  .ochre { --t:#e0a274 }.indigo { --t:#8db4d2 }.pine { --t:#8cc3a0 }.plum { --t:#bfa2d0 }
  li { background:color-mix(in srgb,var(--t) 12%,transparent) }
}
.entry { flex:none; justify-content:space-between; gap:12px; min-height:62px; padding:9px 16px; margin:8px 16px;
  border-radius:18px; background:var(--ink); color:var(--surface) }
.entry b { font-size:16px; line-height:22px }.entry small { color:var(--surface); opacity:.78 }
.go { display:grid; place-items:center; width:34px; height:34px; border-radius:50%; color:var(--ink); background:var(--surface) }
.go svg { width:18px }
nav { flex:none; height:56px; justify-content:space-around; background:var(--surface); border-top:1px solid var(--line) }
nav div { width:20%; text-align:center; color:var(--sub); font-size:10px }
nav div:first-child { color:var(--ink); font-weight:650 }
nav svg { display:block; margin:0 auto 2px; width:21px; height:21px }
nav .plus { display:grid; place-items:center; margin:auto; width:44px; height:32px; border-radius:10px; color:#fff; background:var(--brand) }
nav .plus svg { margin:0 }
.gesture { background:var(--surface); display:grid; place-items:center; height:13px; flex:none }
.gesture::after { content:''; width:110px; height:4px; border-radius:4px; background:var(--sub) }
</style></head><body><div class="phone">

<li class="plum"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4M22 4h-4M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z"/></svg>听个故事</span><strong>给我讲一个三分钟能读完的小故事</strong></li>
</ul></main>
<div class="entry"><div><b>和小伴聊聊</b><small>小伴 AI · 登录或添加模型服务</small></div><span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span></div>
<nav><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14a1 1 0 011 1v9a1 1 0 01-1 1h-7l-4 3v-3H5a1 1 0 01-1-1V7a1 1 0 011-1z"/></svg>小伴AI</div><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594zM20 2v4M22 4h-4M2 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0z"/></svg>应用</div><div><span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></div><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-3a2 2 0 0 1 -2 -2v-3a2 2 0 0 1 2 -2zM15 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-3a2 2 0 0 1 -2 -2v-3a2 2 0 0 1 2 -2zM6 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-3a2 2 0 0 1 -2 -2v-3a2 2 0 0 1 2 -2zM15 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-3a2 2 0 0 1 -2 -2v-3a2 2 0 0 1 2 -2z"/></svg>社区</div><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 8.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0zM5 20c.8-3.6 3.5-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>我的</div></nav><div class="gesture"></div></div></body></html>
