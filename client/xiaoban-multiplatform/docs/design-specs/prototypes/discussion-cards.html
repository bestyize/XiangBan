<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>讨论卡片 · 超级小伴社区</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; background: light-dark(#fff, #141416); }
    main { max-width: 1080px; margin-inline: auto; padding: 24px clamp(8px, 3vw, 28px); }
  </style>
</head>
<body>
<main>
<!-- Discussion card preview -->
<div id="discussion-cards-preview" lang="zh-CN" role="region" aria-label="讨论卡片" data-layout="right" data-device="desktop">
  <div class="dc-controls">
    <strong class="dc-preview-title">讨论卡片（支持带图方案对比）</strong>
    <div class="dc-switch" role="group" aria-label="带图布局">
      <button type="button" data-layout="right" aria-pressed="true">方案 A · 左文右图</button>
      <button type="button" data-layout="strip" aria-pressed="false">方案 B · 下方多图条</button>
      <button type="button" data-layout="plain" aria-pressed="false">现行 · 纯文字</button>
    </div>
    <div class="dc-switch" role="group" aria-label="预览设备">
      <button type="button" data-device="desktop" aria-pressed="true">桌面端</button>
      <button type="button" data-device="mobile" aria-pressed="false">移动端</button>
    </div>
    <button class="dc-theme" type="button" data-theme-toggle aria-pressed="false">深色</button>
  </div>

  <div class="dc-stage viz-dotted-background">
    <section class="dc-screen" aria-label="讨论列表预览">
      <header class="dc-header">
        <div class="dc-sections">
          <span>发现</span><span>创意</span><span class="dc-section-current">讨论</span><span>资源</span>
        </div>
        <div class="dc-categories">
          <span class="dc-category-current">全部</span><span>学习和教程</span><span>羊毛</span><span>职场</span><span>副业与独立开发</span>
        </div>
      </header>

      <div class="dc-feed" id="dc-feed"></div>
    </section>
  </div>

  <p class="dc-note">
    说明：后端接口 <code>topic.images</code> 已返回正文内图片列表。<strong>方案 A（左文右图）</strong>只对带图帖子在右侧展示首图缩略图（无多图角标），无图帖子保留全宽纯文字，底栏单行不换行、窄屏自动隐藏标签；<strong>方案 B（下方多图条）</strong>在摘要下方横排展示 1–3 张附图（文字封面 + 官网截图同框可见）；点击卡片内图片可预览大图。
  </p>

  <div class="dc-lightbox" hidden aria-modal="true" role="dialog" aria-label="图片预览">
    <button type="button" class="dc-lb-close" aria-label="关闭预览">×</button>
    <img alt="">
    <p></p>
  </div>
</div>

<style>
  #discussion-cards-preview {
    --dc-page: light-dark(#fafafa, #141416);
    --dc-surface: light-dark(#fff, #1f1f22);
    --dc-ink: light-dark(#1e1f24, #f0eff2);
    --dc-copy: light-dark(#54565e, #c0c2ca);
    --dc-muted: light-dark(#767880, #989aa4);
    --dc-line: light-dark(#ebebee, #303036);
    --dc-chip: light-dark(#f2f3f5, #2b2b30);
    --dc-accent: light-dark(#e3203c, #ff6b7f);
    --dc-accent-soft: light-dark(#fff1f3, #3a2026);
    --dc-deal-bg: light-dark(#fff3e8, #3a291a);
    --dc-deal-ink: light-dark(#c2540a, #ffae66);
    --dc-learn-bg: light-dark(#e6f7ee, #1a3326);
    --dc-learn-ink: light-dark(#05964b, #7ce6a9);
    --dc-indie-bg: light-dark(#eaf1fe, #1d2a42);
    --dc-indie-ink: light-dark(#2f6fdb, #8db6ff);
    --dc-stage: light-dark(#f5f5f7, #111113);
    --dc-dot: light-dark(#dcdce0, #2e2e34);
    --dc-radius: 8px;
    color: var(--dc-ink);
    font: 400 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  #discussion-cards-preview[data-theme="light"] { color-scheme: light; }
  #discussion-cards-preview[data-theme="dark"] { color-scheme: dark; }
  #discussion-cards-preview *, #discussion-cards-preview *::before, #discussion-cards-preview *::after { box-sizing: border-box; }
  #discussion-cards-preview h2, #discussion-cards-preview p { margin: 0; }
  #discussion-cards-preview .dc-sr { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  #discussion-cards-preview .dc-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin-block-end: 14px;
  }
  #discussion-cards-preview .dc-preview-title { font-size: 14px; font-weight: 650; margin-inline-end: 4px; }
  #discussion-cards-preview .dc-switch {
    display: flex;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--dc-line);
    border-radius: 10px;
    background: var(--dc-chip);
  }
  #discussion-cards-preview .dc-controls button {
    min-block-size: 28px;
    padding: 3px 10px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: var(--dc-muted);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
  }
  #discussion-cards-preview .dc-controls button[aria-pressed="true"] {
    border-color: var(--dc-line);
    background: var(--dc-surface);
    color: var(--dc-ink);
    font-weight: 600;
  }
  #discussion-cards-preview .dc-controls button:focus-visible { outline: 2px solid var(--dc-accent); outline-offset: 2px; }
  #discussion-cards-preview .dc-controls .dc-theme { border-color: var(--dc-line); min-block-size: 35px; background: var(--dc-surface); color: var(--dc-ink); }

  #discussion-cards-preview .dc-stage {
    display: grid;
    justify-items: center;
    padding: clamp(10px, 2vw, 22px);
    border-radius: 16px;
    background: radial-gradient(var(--dc-dot) .75px, transparent .75px) 0 0 / 12px 12px var(--dc-stage);
  }
  #discussion-cards-preview .dc-screen {
    inline-size: 100%;
    max-inline-size: 920px;
    overflow: clip;
    border: 1px solid var(--dc-line);
    border-radius: 16px;
    background: var(--dc-page);
    container: discussion-screen / inline-size;
  }
  #discussion-cards-preview[data-device="mobile"] .dc-screen { max-inline-size: 390px; }
  #discussion-cards-preview .dc-header { background: var(--dc-surface); border-bottom: 1px solid var(--dc-line); }
  #discussion-cards-preview .dc-sections,
  #discussion-cards-preview .dc-categories {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding-inline: 16px;
    color: var(--dc-muted);
  }
  #discussion-cards-preview .dc-sections { min-block-size: 46px; }
  #discussion-cards-preview .dc-sections > span {
    display: grid;
    position: relative;
    align-self: stretch;
    align-items: center;
  }
  #discussion-cards-preview .dc-section-current { color: var(--dc-accent); font-weight: 650; }
  #discussion-cards-preview .dc-section-current::after {
    position: absolute;
    inset-inline: 4px;
    inset-block-end: 0;
    block-size: 2px;
    border-radius: 2px;
    background: currentColor;
    content: "";
  }
  #discussion-cards-preview .dc-categories { min-block-size: 42px; gap: 20px; font-size: 13px; overflow-x: auto; scrollbar-width: none; }
  #discussion-cards-preview .dc-categories::-webkit-scrollbar { display: none; }
  #discussion-cards-preview .dc-categories span { white-space: nowrap; }
  #discussion-cards-preview .dc-category-current {
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--dc-accent-soft);
    color: var(--dc-accent);
    font-weight: 600;
  }

  #discussion-cards-preview .dc-feed { display: grid; gap: 8px; padding: 16px; }
  #discussion-cards-preview .dc-topic {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-inline-size: 0;
    padding: 15px 18px;
    border: 1px solid var(--dc-line);
    border-radius: var(--dc-radius);
    background: var(--dc-surface);
  }
  #discussion-cards-preview .dc-body-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    min-inline-size: 0;
  }
  #discussion-cards-preview .dc-main {
    flex: 1;
    min-inline-size: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  #discussion-cards-preview .dc-topic h2 {
    font-size: 16px;
    font-weight: 650;
    line-height: 1.45;
    overflow-wrap: anywhere;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }
  #discussion-cards-preview .dc-excerpt {
    color: var(--dc-copy);
    font-size: 13px;
    line-height: 1.58;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
  }

  /* Option A: Right cover thumbnail */
  #discussion-cards-preview .dc-thumb-right {
    position: relative;
    flex: none;
    inline-size: 96px;
    block-size: 112px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--dc-line);
    background: var(--dc-chip);
    padding: 0;
    cursor: pointer;
    align-self: center;
  }
  #discussion-cards-preview .dc-thumb-right img {
    display: block;
    inline-size: 100%;
    block-size: 100%;
    object-fit: cover;
  }

  /* Option B: Bottom media strip */
  #discussion-cards-preview .dc-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-top: 2px;
  }
  #discussion-cards-preview .dc-strip::-webkit-scrollbar { display: none; }
  #discussion-cards-preview .dc-strip-btn {
    flex: none;
    padding: 0;
    border: 1px solid var(--dc-line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--dc-chip);
    cursor: pointer;
    block-size: 114px;
  }
  #discussion-cards-preview .dc-strip-btn img {
    display: block;
    block-size: 100%;
    inline-size: auto;
    max-inline-size: 220px;
    object-fit: cover;
  }

  /* Plain comparison mode hides images */
  #discussion-cards-preview[data-layout="plain"] .dc-thumb-right,
  #discussion-cards-preview[data-layout="plain"] .dc-strip { display: none; }
  #discussion-cards-preview[data-layout="right"] .dc-strip { display: none; }
  #discussion-cards-preview[data-layout="strip"] .dc-thumb-right { display: none; }

  #discussion-cards-preview .dc-topic-category,
  #discussion-cards-preview .dc-tag,
  #discussion-cards-preview .dc-time {
    min-inline-size: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #discussion-cards-preview .dc-topic-category {
    flex: none;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    line-height: 16px;
    background: var(--dc-chip);
    color: var(--dc-copy);
  }
  #discussion-cards-preview .dc-topic-category.deal { background: var(--dc-deal-bg); color: var(--dc-deal-ink); }
  #discussion-cards-preview .dc-topic-category.learn { background: var(--dc-learn-bg); color: var(--dc-learn-ink); }
  #discussion-cards-preview .dc-topic-category.indie { background: var(--dc-indie-bg); color: var(--dc-indie-ink); }
  #discussion-cards-preview .dc-tag { flex: none; max-inline-size: 120px; color: var(--dc-muted); font-size: 12px; }

  #discussion-cards-preview .dc-footer,
  #discussion-cards-preview .dc-byline,
  #discussion-cards-preview .dc-identity,
  #discussion-cards-preview .dc-metrics,
  #discussion-cards-preview .dc-metrics > span { display: flex; align-items: center; }
  #discussion-cards-preview .dc-footer { justify-content: space-between; flex-wrap: nowrap; gap: 8px; color: var(--dc-muted); font-size: 12px; min-inline-size: 0; }
  #discussion-cards-preview .dc-byline { flex: 1; min-inline-size: 0; flex-wrap: nowrap; overflow: hidden; gap: 8px; }
  #discussion-cards-preview .dc-identity { flex: 0 1 auto; gap: 5px; min-inline-size: 0; overflow: hidden; white-space: nowrap; }
  #discussion-cards-preview .dc-avatar {
    display: grid;
    flex: none;
    inline-size: 20px;
    block-size: 20px;
    place-items: center;
    border-radius: 50%;
    background: var(--dc-accent-soft);
    color: var(--dc-accent);
    font-size: 10.5px;
    font-weight: 700;
  }
  #discussion-cards-preview .dc-author-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-inline-size: 96px; }
  #discussion-cards-preview .dc-metrics { flex: none; gap: 12px; font-variant-numeric: tabular-nums; }
  #discussion-cards-preview .dc-metrics > span { gap: 4px; }
  #discussion-cards-preview .dc-metrics :is(i, svg) { display: block; inline-size: 14px; block-size: 14px; }

  .dc-note {
    margin-top: 12px;
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--dc-muted);
  }
  .dc-note code {
    padding: 1px 5px;
    border-radius: 5px;
    background: var(--dc-chip);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }

  .dc-lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10, 12, 16, 0.78);
    display: grid;
    place-items: center;
    align-content: center;
    gap: 10px;
    padding: 24px;
    backdrop-filter: blur(4px);
  }
  .dc-lightbox[hidden] { display: none; }
  .dc-lightbox img {
    max-width: min(92vw, 720px);
    max-height: 76vh;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .dc-lightbox p { color: #e5e7eb; font-size: 13px; }
  .dc-lb-close {
    position: fixed;
    top: 16px;
    right: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }

  @container discussion-screen (max-width: 560px) {
    #discussion-cards-preview .dc-tag { display: none; }
  }

  @container discussion-screen (max-width: 480px) {
    #discussion-cards-preview .dc-sections { justify-content: flex-start; min-block-size: 44px; gap: 20px; }
    #discussion-cards-preview .dc-sections > span:not(.dc-section-current),
    #discussion-cards-preview .dc-section-current::after { display: none; }
    #discussion-cards-preview .dc-section-current { color: var(--dc-ink); font-size: 18px; }
    #discussion-cards-preview .dc-categories { justify-content: flex-start; min-block-size: 38px; gap: 14px; padding-inline: 12px; }
    #discussion-cards-preview .dc-feed { gap: 8px; padding: 10px 12px 14px; }
    #discussion-cards-preview .dc-topic { padding: 12px 13px; gap: 9px; }
    #discussion-cards-preview .dc-body-row { gap: 12px; }
    #discussion-cards-preview .dc-topic h2 { font-size: 14.5px; }
    #discussion-cards-preview .dc-excerpt { font-size: 12.5px; -webkit-line-clamp: 2; }
    #discussion-cards-preview .dc-thumb-right { inline-size: 74px; block-size: 92px; border-radius: 6px; }
    #discussion-cards-preview .dc-strip-btn { block-size: 96px; }
    #discussion-cards-preview .dc-metrics { gap: 8px; }
  }
  @media (pointer: coarse) {
    #discussion-cards-preview .dc-controls button { min-block-size: 44px; }
  }
</style>

            <span class="dc-tag"># ${esc(p.tag)}</span>
            <span class="dc-identity">
              <span class="dc-avatar" aria-hidden="true">${esc(p.avatar)}</span>
              <span class="dc-author-name">${esc(p.author)}</span>
              <span class="dc-time">· ${esc(p.time)}</span>
            </span>
          </div>
          <div class="dc-metrics">
            <span class="dc-replies"><i data-lucide="message-circle" aria-hidden="true"></i><span>${p.replies}</span></span>
            <span><i data-lucide="heart" aria-hidden="true"></i><span>${p.likes}</span></span>
          </div>
        </footer>
      </article>`;
    }).join("");

    const preview = document.getElementById("discussion-cards-preview");
    const layoutBtns = preview.querySelectorAll("button[data-layout]");
    const deviceBtns = preview.querySelectorAll("button[data-device]");
    const themeBtn = preview.querySelector("[data-theme-toggle]");
    const systemTheme = matchMedia("(prefers-color-scheme: dark)");

    function selectLayout(layout) {
      preview.dataset.layout = layout;
      for (const b of layoutBtns) b.setAttribute("aria-pressed", String(b.dataset.layout === layout));
    }
    function selectDevice(device) {
      preview.dataset.device = device;
      for (const b of deviceBtns) b.setAttribute("aria-pressed", String(b.dataset.device === device));
    }

    const qs = new URLSearchParams(location.search);
    selectLayout(["right", "strip", "plain"].includes(qs.get("layout")) ? qs.get("layout") : "right");
    selectDevice(qs.get("view") === "mobile" ? "mobile" : "desktop");

    for (const b of layoutBtns) b.addEventListener("click", () => selectLayout(b.dataset.layout));
    for (const b of deviceBtns) b.addEventListener("click", () => selectDevice(b.dataset.device));

    function updateThemeButton() {
      const dark = preview.dataset.theme ? preview.dataset.theme === "dark" : systemTheme.matches;
      themeBtn.setAttribute("aria-pressed", String(dark));
      themeBtn.textContent = dark ? "浅色" : "深色";
    }
    updateThemeButton();
    systemTheme.addEventListener("change", updateThemeButton);
    themeBtn.addEventListener("click", () => {
      preview.dataset.theme = themeBtn.getAttribute("aria-pressed") === "true" ? "light" : "dark";
      updateThemeButton();
    });

    const lb = preview.querySelector(".dc-lightbox");
    const lbImg = lb.querySelector("img");
    const lbCap = lb.querySelector("p");
    feed.addEventListener("click", e => {
      const btn = e.target.closest("[data-open-img]");
      if (!btn) return;
      const [pi, ii] = btn.dataset.openImg.split(":").map(Number);
      const im = POSTS[pi]?.images[ii];
      if (!im) return;
      lbImg.src = im.src;
      lbImg.alt = im.alt;
      lbCap.textContent = im.alt;
      lb.hidden = false;
    });
    lb.addEventListener("click", e => {
      if (e.target === lb || e.target.closest(".dc-lb-close")) lb.hidden = true;
    });
  })();
</script>
<!-- End discussion card preview -->
</main>
<script>
  (() => {
    const paths = {
      "message-circle": "M7.9 20A9 9 0 1 0 4 16.1L2 22Z",
      heart: "M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5",
    };
    const ns = "http://www.w3.org/2000/svg";
    for (const icon of document.querySelectorAll("#discussion-cards-preview [data-lucide]")) {
      const svg = document.createElementNS(ns, "svg");
      const path = document.createElementNS(ns, "path");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.75");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");
      path.setAttribute("d", paths[icon.dataset.lucide]);
      svg.append(path);
      icon.replaceWith(svg);
    }
  })();
</script>
