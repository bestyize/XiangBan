<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="重走创业板指的 100 个交易日。一日一题，答完看你的考试成绩。">
  <title>收盘别问</title>
  <style>
    :root {
      color-scheme: dark;
      --outer: #101417;
      --screen: #171f25;
      --chart: #11191e;
      --surface: #212a31;
      --line: #354149;
      --ink: #f2efe5;
      --muted: #abb6bb;
      --accent: #94de8f;
      --accent-hover: #b0ecaa;
      --accent-ink: #142317;
      --up: #ff8984;
      --down: #77c2a9;
      --body: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      --display: "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--outer); font-family: var(--body); }
    button, input, textarea { font: inherit; }
    button { color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    ::selection { background: var(--accent); color: var(--outer); }
    h1, h2, p, ol, li, figure, blockquote { margin: 0; }
    .studio { display: grid; grid-template-columns: 390px; align-items: start; justify-content: center; padding: 26px 20px; }
    .studio.design-preview { grid-template-columns: 180px 390px; gap: 28px; }
    .preview-nav { display: grid; gap: 4px; padding-top: 8px; }
    .preview-nav[hidden] { display: none; }
    .preview-nav p { margin-bottom: 12px; color: var(--muted); font-size: 12px; }
    .preview-nav button { min-height: 42px; padding: 0 13px; text-align: left; font-size: 14px; border-radius: 6px; }
    .preview-nav button:is(:hover, [aria-current="true"]) { background: var(--surface); }
    .preview-nav button[aria-current="true"] { color: var(--accent); }
    .phone {
      width: 390px;
      height: 800px;
      background: var(--screen);
      border-radius: 14px;
      box-shadow: 0 18px 60px #0006;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .app-host body { background: var(--screen); }
    .app-host .studio { display: block; padding: 0; }
    .app-host .phone { width: 100%; max-width: 560px; height: 100vh; height: 100dvh; margin: auto; border-radius: 0; box-shadow: none; padding-top: max(env(safe-area-inset-top), var(--xb-safe-top, 0px)); }
    .app-host .topbar { margin-left: max(24px, calc(var(--xb-safe-left, 0px) + 8px)); margin-right: max(24px, calc(var(--xb-safe-right, 0px) + 8px)); }
    .app-host .page { padding-left: max(24px, calc(var(--xb-safe-left, 0px) + 8px)); padding-right: max(24px, calc(var(--xb-safe-right, 0px) + 8px)); padding-bottom: max(24px, calc(var(--xb-safe-bottom, 0px) + 8px), env(safe-area-inset-bottom)); }
    .app-host dialog, .app-host #share-dialog { max-height: calc(100dvh - var(--xb-safe-top, 0px) - var(--xb-safe-bottom, 0px) - 32px); }
    .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; margin: 0 24px; min-height: 64px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 650; letter-spacing: .08em; }
    .brand-mark { display: flex; align-items: center; gap: 3px; width: 20px; height: 20px; }
    .brand-mark i { position: relative; display: block; width: 4px; margin-top: var(--offset); height: var(--bar); background: var(--accent); }
    .brand-mark i::before { content: ""; position: absolute; inset: -3px auto; left: 1.5px; width: 1px; background: var(--accent); }
    .topbar button { min-width: 56px; min-height: 44px; margin-right: -5px; padding: 0 5px; color: var(--muted); font-size: 13px; text-align: right; }
    .topbar button:hover { color: var(--ink); }
    .page { min-height: 0; overflow-y: auto; scrollbar-color: var(--line) transparent; flex: 1; display: flex; flex-direction: column; padding: 25px 24px max(24px, env(safe-area-inset-bottom)); }
    .exam-progress { margin-bottom: 28px; }
    .progress-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .progress-line span:last-child { font-family: var(--mono); font-size: 11px; }
    progress { display: block; width: 100%; height: 2px; margin-top: 10px; appearance: none; border: 0; background: var(--line); }
    progress::-webkit-progress-bar { background: var(--line); }
    progress::-webkit-progress-value { background: var(--accent); }
    progress::-moz-progress-bar { background: var(--accent); }
    .page h1 { font-family: var(--display); font-size: 39px; line-height: 1.19; font-weight: 800; letter-spacing: -.035em; }
    .question-copy { margin: 12px 0 20px; min-height: 50px; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .chart { margin: 0; border-radius: 10px; background: var(--chart); overflow: hidden; }
    .chart figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 13px 14px 0; color: var(--muted); font-size: 11px; }
    .chart-name { font-size: 12px; font-weight: 650; color: var(--ink); }
    .chart-code { margin-left: 5px; font: 10px var(--mono); color: var(--muted); }
    .chart-figure { font-family: var(--mono); }
    .chart-scroll { overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
    .chart-scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .chart-track { position: relative; height: 178px; }
    canvas { position: sticky; left: 0; display: block; height: 100%; }
    .reveal .chart-track { height: 150px; }
    .choices { display: grid; gap: 9px; margin-top: auto; padding-top: 22px; }
    .choice { min-height: 57px; display: grid; grid-template-columns: 27px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; text-align: left; background: var(--surface); }
    .choice:hover { border-color: var(--accent); }
    .choice-letter { color: var(--accent); font: 700 13px var(--mono); }
    .choice-copy { font-size: 14px; line-height: 1.4; }
    .choice-direction { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .actions { display: grid; gap: 8px; margin-top: auto; padding-top: 17px; }
    .primary, .secondary { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 9px 16px; border-radius: 7px; font-size: 14px; font-weight: 650; }
    .primary { background: var(--accent); color: var(--accent-ink); }
    .primary:hover { background: var(--accent-hover); }
    .secondary { border: 1px solid var(--line); }
    .secondary:hover { background: var(--surface); }
    .result-mark { margin: 0 0 17px; }
    .result-date { color: var(--muted); font: 12px var(--mono); letter-spacing: .08em; }
    .result-mark h1 { margin: 4px 0 3px; font: 660 clamp(57px, 18vw, 73px)/1 "Avenir Next", Arial, sans-serif; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .positive { color: var(--up); }
    .negative { color: var(--down); }
    .result-detail { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .result-status { color: var(--muted); font-size: 12px; }
    .result-points { color: var(--muted); font-size: 12px; }
    .result-points.correct { color: var(--accent); }
    .reveal .exam-progress { margin-bottom: 21px; }
    .reveal-copy { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font: 750 24px/1.55 var(--display); letter-spacing: -.02em; }
    .reveal-copy p { max-width: 100%; }
    .exam-intro h1 { font-size: 46px; }
    .intro { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .exam-rules, .score-breakdown { display: grid; gap: 0; margin: 29px 0 0; border-top: 1px solid var(--line); }
    .exam-rules div, .score-breakdown div { display: flex; justify-content: space-between; gap: 10px; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .exam-rules dt, .score-breakdown dt { color: var(--muted); }
    .exam-rules dd, .score-breakdown dd { margin: 0; font-variant-numeric: tabular-nums; }
    .score h1 { margin: 15px 0 0; }
    .score-total { display: flex; align-items: baseline; margin-top: 21px; gap: 11px; font-variant-numeric: tabular-nums; }
    .score-total strong { color: var(--accent); font: 680 clamp(60px, 19vw, 90px)/1 "Avenir Next", Arial, sans-serif; letter-spacing: -.04em; }
    .score-total span { color: var(--muted); font: 17px var(--mono); white-space: nowrap; }
    .score-period { margin-top: 10px; color: var(--muted); font: 12px var(--mono); }
    .score-line { margin-top: 28px; font: 750 23px/1.5 var(--display); }
    dialog { position: absolute; width: min(calc(100% - 40px), 342px); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
    dialog::backdrop { background: #080c10c2; }
    dialog h2 { font-size: 18px; }
    dialog p { margin-top: 12px; font-size: 14px; color: var(--muted); }
    dialog :is(input, textarea) { display: block; width: 100%; margin: 14px 0; border: 1px solid var(--line); padding: 9px; border-radius: 5px; color: var(--ink); background: var(--chart); font-size: 13px; }
    dialog :is(input, textarea)[hidden] { display: none; }
    dialog textarea { resize: vertical; }
    dialog .actions { padding-top: 0; }
    #share-dialog { max-height: calc(100dvh - 32px); overflow-y: auto; }
    .share-poster { display: block; width: min(100%, 206px); height: auto; margin: 13px auto 15px; border-radius: 7px; }
    .share-poster[hidden] { display: none; }
    .share-url-label { display: block; margin-top: 14px; color: var(--muted); font-size: 12px; }
    #share-url { margin: 6px 0 0; font-size: 16px; }
    #share-hint { margin: 7px 0 13px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .share-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .share-actions button:disabled { opacity: .5; cursor: default; }
    .share-close { width: 100%; min-height: 44px; margin-top: 5px; color: var(--muted); font-size: 13px; }
    #exam-disclaimer p { line-height: 1.65; }
    #exam-disclaimer .actions { margin-top: 20px; }
    @media (max-width: 649px) {
      .studio, .studio.design-preview { display: block; padding: 0; }
      .preview-nav { display: none; }
      .phone { width: min(100%, 390px); height: 100vh; height: 100dvh; margin: auto; border-radius: 0; box-shadow: none; }
      .result-mark h1 { font-size: clamp(57px, 18vw, 73px); }
    }
    @media (min-width: 650px) {
      .result-mark h1 { font-size: 73px; }
    }
    @media (max-width: 649px) and (max-height: 720px) {
      .topbar { min-height: 54px; }
      .page { padding-block-start: 18px; }
      .exam-progress { margin-bottom: 17px; }
      .question-copy { min-height: auto; margin-bottom: 14px; }
      .chart-track { height: 150px; }
      .reveal .chart-track { height: 128px; }
      .choices { padding-top: 15px; }
      .reveal-copy { margin-top: 16px; padding-top: 12px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <nav class="preview-nav" aria-label="设计稿画面" hidden>
      <p>手机设计预览 · 390 × 800</p>
      <button type="button" data-view="intro">考试入口</button>
      <button type="button" data-view="question">选择题</button>
      <button type="button" data-view="reveal">结果揭晓</button>
      <button type="button" data-view="score">成绩示例</button>
    </nav>
    <main class="phone" id="phone" aria-label="收盘别问"></main>
  </div>
  <dialog id="exam-disclaimer" aria-labelledby="exam-disclaimer-title" aria-describedby="exam-disclaimer-copy">
    <h2 id="exam-disclaimer-title">免责声明</h2>
    <p id="exam-disclaimer-copy">数据根据公开渠道获取，均为历史数据。本游戏不做任何预测，入市需谨慎。</p>
    <div class="actions">
      <button type="button" class="primary" value="start">我已知晓，开始考试</button>
      <button type="button" class="secondary" value="cancel" autofocus>返回</button>
    </div>
  </dialog>

  <dialog id="share-dialog" aria-labelledby="share-title">
    <h2 id="share-title">分享结果</h2>
    <p id="share-description"></p>
    <img id="share-poster" class="share-poster" width="780" height="1040" alt="带测评二维码的分享海报" hidden>
    <label class="share-url-label" for="share-url">测评链接</label>
    <input id="share-url" type="url" inputmode="url" placeholder="https://" autocomplete="off" aria-describedby="share-hint">
    <p id="share-hint"></p>
    <textarea id="share-fallback" aria-label="可复制的分享内容" rows="4" readonly hidden></textarea>
    <div class="share-actions">
      <button type="button" class="secondary" id="copy-link">复制链接</button>
      <button type="button" class="primary" id="save-poster" disabled>保存海报</button>
    </div>
    <button type="button" class="share-close">返回</button>
    <p role="status" id="copy-status" hidden></p>
  </dialog>

// 来自 qrcode-generator 1.4.4（MIT，Kazuhiko Arase），仅把 UMD 出口改成 ES 模块出口。
// 'QR Code' 是 DENSO WAVE INCORPORATED 的注册商标。
var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;

  <script>
    const host = window.xb;
    if (host) document.documentElement.classList.add('app-host');
    const archive = JSON.parse(document.getElementById('market-data').textContent);
    const days = archive.days;
    const historyRows = archive.history;
    const copyByDate = JSON.parse(document.getElementById('exam-copy').textContent);
    const sampleDay = days.findIndex(day => day.date === '2026-09-18');
    const finalDay = days.length - 1;
    const phone = document.getElementById('phone');
    const previewNav = document.querySelector('.preview-nav');
    const examDisclaimer = document.getElementById('exam-disclaimer');
    const shareDialog = document.getElementById('share-dialog');
    const shareTitle = document.getElementById('share-title');
    const shareDescription = document.getElementById('share-description');
    const shareURL = document.getElementById('share-url');
    const shareHint = document.getElementById('share-hint');
    const sharePoster = document.getElementById('share-poster');
    const savePoster = document.getElementById('save-poster');
    const shareFallback = document.getElementById('share-fallback');
    const copyButton = document.getElementById('copy-link');
    const copyStatus = document.getElementById('copy-status');
    const number = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const grade = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
    const dateLabel = date => date.replaceAll('-', '.');
    const pct = value => `${value < 0 ? '−' : value > 0 ? '+' : ''}${Math.abs(value).toFixed(2)}%`;
    const primary = (label, action) => `<button class="primary" type="button" data-action="${action}">${label}</button>`;
    const correctChoice = day => day.change_pct > 0 ? 'up' : 'down';
    const knownViews = ['intro', 'question', 'reveal', 'score'];
    const storageKey = 'shoupan-biewen-exam-100';
    const params = new URLSearchParams(location.search);
    const previewView = params.get('screen');
    const isDesignPreview = !host && knownViews.includes(previewView);
    previewNav.hidden = !isDesignPreview;
    previewNav.parentElement.classList.toggle('design-preview', isDesignPreview);
    let state = { view: 'intro', mode: 'preview', index: 0, choice: '', answers: [] };
    let savedExam = null;
    let shareContent;
    let hostSave = Promise.resolve();
    let afterPanelBack = null;

    function header(showExam = true) {
      return `<header class="topbar">
        <span class="brand"><span class="brand-mark" aria-hidden="true">
          <i style="--offset:6px;--bar:7px"></i><i style="--offset:0px;--bar:12px"></i><i style="--offset:-8px;--bar:6px"></i>
        </span>收盘别问</span>
        ${showExam ? '<button type="button" data-action="home">考卷</button>' : ''}
      </header>`;
    }

    function progress(index, complete) {
      const position = index + 1;
      return `<div class="exam-progress"><div class="progress-line">
        <span>${state.mode === 'day' ? '同题挑战' : '考试进度'}</span><span>${String(position).padStart(2, '0')} / ${days.length}</span>
      </div><progress max="${days.length}" value="${complete ? position : index}" aria-label="考试进度"></progress></div>`;
    }

    function chart(label, reveal = false) {
      return `<figure class="chart"><figcaption>
        <span><span class="chart-name">创业板指</span><span class="chart-code">399006</span></span>
        <span class="chart-figure">${label}</span>
      </figcaption><div class="chart-scroll" tabindex="0" aria-label="横滑查看历史 K 线">
        <div class="chart-track"><canvas aria-label="创业板指${reveal ? '已揭晓' : '题面'}日 K 线" role="img"></canvas></div>
      </div>
      </figure>`;
    }

    function summarize(index, answers) {
      const answered = answers.length;
      const hits = answers.reduce((total, answer, position) => total + Number(answer === correctChoice(days[position])), 0);
      return { answered, hits, score: grade.format(hits / answered * 100), change: (days[index].close / archive.baseline.close - 1) * 100 };
    }

    function render() {
      const { view, index, choice, answers, mode } = state;
      const day = days[index];
      const content = copyByDate[day.date];
      const isFinal = index === finalDay;
      const correct = choice === correctChoice(day);
      const line = content.lines[choice === 'down' ? 1 : 0] ?? content.lines[0];
      let rows = [];
      let chartState = '';
      for (const button of previewNav.querySelectorAll('[data-view]')) {
        button.setAttribute('aria-current', String(button.dataset.view === view));
      }

      switch (view) {
        case 'intro':
          phone.innerHTML = `${header(false)}<section class="page exam-intro">
            <h1>收盘别问</h1><p class="intro">创业板指历史考卷</p>
            <dl class="exam-rules">
              <div><dt>行情区间</dt><dd>${dateLabel(days[0].date)} – ${dateLabel(days[finalDay].date)}</dd></div>
              <div><dt>题量</dt><dd>${days.length} 个交易日 · ${days.length} 题</dd></div>
              <div><dt>计分</dt><dd>按已答题的正确率换算</dd></div>
            </dl>
            <div class="actions">${primary(savedExam ? savedExam.view === 'score' ? '查看成绩' : '继续考试' : '开始考试', 'start')}</div>
          </section>`;
          break;

        case 'question':
          rows = [...historyRows, ...days.slice(0, index)];
          chartState = 'question';
          phone.innerHTML = `${header()}<section class="page question">
            ${progress(index, false)}
            <h1>今天怎么收？</h1><p class="question-copy">${content.question.replaceAll('\n', '<br>')}</p>
            ${chart(`昨收 ${number.format(day.previous_close)}`)}
            <div class="choices">${content.choices.map((text, i) => `<button type="button" class="choice" data-choice="${i ? 'down' : 'up'}">
              <span class="choice-letter">${i ? 'B' : 'A'}</span><span class="choice-copy">${text}</span>
              <span class="choice-direction">押收${i ? '跌' : '涨'}</span>
            </button>`).join('')}</div>
          </section>`;
          break;

        case 'reveal': {
          rows = [...historyRows, ...days.slice(0, index + 1)];
          chartState = 'reveal';
          const nextLabel = mode === 'day' ? '进入百题考试' : isFinal ? '查看考试成绩' : '下一题';
          const secondaryAction = mode === 'day' || isFinal
            ? '<button class="secondary" type="button" data-action="share-result">分享结果</button>'
            : '<button class="secondary" type="button" data-action="stop">收手吧</button>';
          phone.innerHTML = `${header()}<section class="page reveal">
            ${progress(index, true)}
            <div class="result-mark" aria-live="polite">
              <p class="result-date">${dateLabel(day.date)} · 15:00</p>
              <h1 class="${day.change_pct >= 0 ? 'positive' : 'negative'}">${pct(day.change_pct)}</h1>
              <div class="result-detail"><p class="result-status">创业板指${day.change_pct > 0 ? '收涨' : '收跌'}</p>
                <p class="result-points${correct ? ' correct' : ''}">${correct ? '答对' : '答错'}</p></div>
            </div>
            ${chart(`收盘 ${number.format(day.close)}`, true)}
            <blockquote class="reveal-copy"><p>${line.replaceAll('\n', '<br>')}</p></blockquote>
            <div class="actions">
              ${primary(nextLabel, 'next')}
              ${secondaryAction}
            </div>
          </section>`;
          break;
        }

        case 'score': {
          const { answered, hits, score, change } = summarize(index, answers);
          phone.innerHTML = `${header(false)}<section class="page score">
            <h1>考试成绩</h1>
            <p class="score-total" aria-label="${score} 分，满分 100 分"><strong>${score}</strong><span>/ 100 分</span></p>
            <dl class="score-breakdown">
              <div><dt>已答</dt><dd>${answered} / ${days.length} 题</dd></div>
              <div><dt>答对</dt><dd>${hits} 题</dd></div>
              <div><dt>答错</dt><dd>${answered - hits} 题</dd></div>
              <div><dt>模拟盈亏</dt><dd class="score-return ${change >= 0 ? 'positive' : 'negative'}">${pct(change)}</dd></div>
            </dl>
            <p class="score-period">${dateLabel(archive.baseline.date)} 收盘至 ${dateLabel(day.date)} 收盘</p>
            <p class="score-line">今日方知我是我</p>
            <div class="actions">
              ${primary('分享成绩', 'share-result')}
              <button class="secondary" type="button" data-action="restart">再考一次</button>
            </div>
          </section>`;
          break;
        }
      }

      if (chartState) setupChart(rows, chartState, day);
      avoidHostCapsule();
    }

    function avoidHostCapsule() {
      const button = host && phone.querySelector('.topbar button');
      if (!button) return;
      button.style.removeProperty('margin-right');
      const capsule = host.info?.capsule;
      if (!capsule?.width || !capsule.height) return;
      const left = innerWidth - capsule.right - capsule.width;
      const bounds = button.getBoundingClientRect();
      if (bounds.right > left - 8 && bounds.left < left + capsule.width + 8
        && bounds.bottom > capsule.top - 8 && bounds.top < capsule.top + capsule.height + 8) {
        button.style.marginRight = `${bounds.right - left + 3}px`;
      }
    }

    function setupChart(rows, mode, day) {
      const scroll = phone.querySelector('.chart-scroll');
      const track = scroll.querySelector('.chart-track');
      const canvas = track.querySelector('canvas');
      const width = scroll.clientWidth;
      const height = track.clientHeight;
      const accent = getComputedStyle(canvas).getPropertyValue('--accent').trim();
      const step = 34;
      const awaiting = mode === 'question';
      const count = rows.length + Number(awaiting);
      const trackWidth = Math.max(width, count * step + 8);
      track.style.width = `${trackWidth}px`;
      canvas.style.width = `${width}px`;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const top = 14;
      const bottom = height - 26;
      scroll.scrollLeft = trackWidth - width;

      function draw() {
        const xAt = index => trackWidth - 4 - (count - index - .5) * step - scroll.scrollLeft;
        const dayX = xAt(count - 1);
        const dayVisible = dayX > 0 && dayX < width;
        const visible = rows.map((row, index) => ({ row, x: xAt(index) })).filter(({ x }) => x > -step && x < width + step);
        const values = visible.flatMap(({ row }) => [row.low, row.high]);
        if (dayVisible || !values.length) values.push(day.previous_close);
        const low = Math.min(...values);
        const high = Math.max(...values);
        const pad = Math.max(4, (high - low) * .15);
        const y = value => top + (high + pad - value) / (high - low + 2 * pad) * (bottom - top);
        ctx.clearRect(0, 0, width, height);
        ctx.font = '9px ui-monospace, monospace';
        ctx.textBaseline = 'middle';

        for (const fraction of [0, .33, .66, 1]) {
          const gridY = top + fraction * (bottom - top);
          ctx.strokeStyle = '#29353d';
          ctx.beginPath();
          ctx.moveTo(0, gridY);
          ctx.lineTo(width, gridY);
          ctx.stroke();
        }

        if (dayVisible) {
          const referenceY = y(day.previous_close);
          ctx.strokeStyle = '#abb6bb90';
          ctx.setLineDash([3, 4]);
          ctx.beginPath();
          ctx.moveTo(0, referenceY);
          ctx.lineTo(width, referenceY);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        visible.forEach(({ row, x }) => {
          const color = row.close >= row.open ? '#ff8984' : '#77c2a9';
          if (!awaiting && row.date === day.date) {
            ctx.fillStyle = `${color}20`;
            ctx.fillRect(x - step / 2 + 1, top, step - 2, bottom - top);
          }
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(x, y(row.high));
          ctx.lineTo(x, y(row.low));
          ctx.stroke();
          const open = y(row.open);
          const close = y(row.close);
          ctx.fillRect(x - 6, Math.min(open, close), 12, Math.max(1.25, Math.abs(open - close)));
          ctx.fillStyle = '#abb6bb';
          ctx.textAlign = 'center';
          if (x >= 14 && x <= width - 14) ctx.fillText(row.date.slice(5).replace('-', '/'), x, height - 11);
        });

        if (awaiting && dayVisible) {
          const markerY = Math.max(top + 2, Math.min(bottom - 34, y(day.previous_close) - 16));
          ctx.strokeStyle = accent;
          ctx.setLineDash([2, 3]);
          ctx.strokeRect(dayX - 10, markerY, 20, 32);
          ctx.setLineDash([]);
          ctx.fillStyle = accent;
          ctx.textAlign = 'center';
          ctx.fillText(day.date.slice(5).replace('-', '/'), dayX, height - 11);
          ctx.font = '700 14px ui-monospace, monospace';
          ctx.fillText('?', dayX, markerY + 16);
        }
      }

      scroll.addEventListener('scroll', draw, { passive: true });
      draw();
    }

    function update(nextState) {
      state = { ...state, ...nextState };
      if (state.mode === 'exam') {
        savedExam = state;
        try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch { /* keep this attempt in memory */ }
        if (host?.storage?.set) {
          const record = state;
          hostSave = hostSave.then(() => host.storage.set(storageKey, record)).catch(() => {});
        }
      }
      render();
    }

    function showExample(view) {
      const index = view === 'score' ? finalDay : sampleDay;
      const answered = view === 'intro' ? 0 : index + Number(view !== 'question');
      const targetHits = Math.round(answered * .68);
      const answers = days.slice(0, answered).map((day, position) => {
        const correct = correctChoice(day);
        return position < targetHits ? correct : correct === 'up' ? 'down' : 'up';
      });
      if (view === 'reveal') answers[index] = 'up';
      update({ view, index, choice: 'up', answers, mode: 'preview' });
    }

    function startExam(restart = false) {
      const url = new URL(location.href);
      const isPreviewLink = url.searchParams.has('date') || url.searchParams.has('screen');
      if (isPreviewLink) {
        url.searchParams.delete('date');
        url.searchParams.delete('screen');
        history.replaceState(null, '', url);
      }
      if (savedExam && !restart) {
        state = savedExam;
        render();
      } else {
        update({ view: 'question', index: 0, choice: '', answers: [], mode: 'exam' });
      }
    }

    function requestExam(restart = false) {
      if (savedExam && !restart) {
        rememberAttempt();
        startExam();
      } else {
        examDisclaimer.returnValue = '';
        openPanel(examDisclaimer);
      }
    }

    function rememberAttempt() {
      if (host && history.state?.shoupanPage !== 'attempt') history.pushState({ shoupanPage: 'attempt' }, '');
    }

    function openPanel(panel) {
      if (host) history.pushState({ ...history.state, shoupanPanel: panel.id }, '');
      panel.showModal();
    }

    function finishPanel(panel, action) {
      if (host && history.state?.shoupanPanel === panel.id) {
        afterPanelBack = action ?? (() => {});
        history.back();
      } else action?.();
    }

    function next() {
      const { index, mode } = state;
      if (mode === 'day') requestExam();
      else if (index === finalDay) update({ view: 'score' });
      else update({ view: 'question', index: index + 1, choice: '' });
    }

    function assessmentLink() {
      try {
        const url = new URL(shareURL.value.trim());
        return url.protocol === 'http:' || url.protocol === 'https:' ? url : null;
      } catch { return null; }
    }

    function renderPoster(url) {
      const canvas = document.createElement('canvas');
      canvas.width = 780;
      canvas.height = 1040;
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.textBaseline = 'middle';
      const styles = getComputedStyle(phone);
      const color = name => styles.getPropertyValue(name).trim();
      const font = color('--body');
      const drawText = (value, x, y, size, weight, paint, limit) => {
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color(paint);
        ctx.fillText(value, x, y, limit ?? 342);
      };

      ctx.fillStyle = color('--screen');
      ctx.fillRect(0, 0, 390, 520);
      [12, 19, 10].forEach((height, i) => {
        ctx.fillStyle = color('--accent');
        ctx.fillRect(24 + i * 7, 38 - height / 2 - i * 3, 4, height);
      });
      drawText('收盘别问', 51, 34, 17, 700, '--ink');
      drawText(shareContent.label, 24, 88, 14, 600, '--muted');
      drawText(shareContent.headline, 24, 139, 57, 750, shareContent.headlineColor);
      drawText(shareContent.details, 24, 183, 14, 600, '--ink');
      drawText(shareContent.period, 24, 210, 12, 450, '--muted');
      if (shareContent.returns) {
        drawText(`模拟盈亏  ${shareContent.returns}`, 24, 241, 16, 650, shareContent.returnColor);
      }

      const notes = [];
      ctx.font = `700 19px ${font}`;
      for (const paragraph of shareContent.note.split('\n')) {
        let line = '';
        for (const character of paragraph) {
          if (ctx.measureText(line + character).width > 342 && line) {
            notes.push(line);
            line = '';
          }
          line += character;
        }
        if (line) notes.push(line);
      }
      notes.slice(0, 3).forEach((line, i) => drawText(line, 24, 267 + i * 24, 19, 700, '--ink'));
      ctx.fillStyle = color('--line');
      ctx.fillRect(24, 59, 342, 1);
      ctx.fillRect(24, 333, 342, 1);
      drawText(shareContent.score ? '扫码参加测评' : '扫码猜这一天', 24, 415, 18, 700, '--ink');
      drawText('创业板指 · 历史行情', 24, 442, 12, 450, '--muted');

      const qr = qrcode(0, 'M');
      qr.addData(url.href);
      qr.make();
      const modules = qr.getModuleCount();
      const box = 146;
      const step = Math.floor(box / (modules + 8));
      if (!step) throw new Error('QR code is too dense');
      const inset = Math.floor((box - modules * step) / 2);
      const left = 220;
      const top = 351;
      ctx.fillStyle = '#fff';
      ctx.fillRect(left, top, box, box);
      ctx.fillStyle = '#111';
      for (let row = 0; row < modules; row++) {
        for (let col = 0; col < modules; col++) {
          if (qr.isDark(row, col)) ctx.fillRect(left + inset + col * step, top + inset + row * step, step, step);
        }
      }
      return canvas.toDataURL('image/png');
    }

    function updateSharePoster() {
      const url = assessmentLink();
      sharePoster.hidden = true;
      shareDescription.hidden = false;
      savePoster.disabled = true;
      shareFallback.hidden = true;
      copyStatus.hidden = true;
      copyButton.textContent = url ? '复制链接' : '复制结果';
      if (!url) {
        shareHint.textContent = '填入测评网页地址后，生成带二维码的海报。';
        return;
      }
      try {
        sharePoster.src = renderPoster(url);
        sharePoster.hidden = false;
        shareDescription.hidden = true;
        savePoster.disabled = false;
        shareHint.textContent = ['127.0.0.1', 'localhost', '[::1]'].includes(url.hostname)
          ? '当前是本机预览地址。可替换为发布后的链接。'
          : '也可长按海报图片保存。';
      } catch {
        shareHint.textContent = '海报生成失败，请检查测评链接后重试。';
      }
    }

    function showShare() {
      const { index, view, answers } = state;
      const day = days[index];
      const score = view === 'score';
      const actual = pct(day.change_pct);
      shareContent = { score, label: '创业板指当日收盘', headline: actual,
        headlineColor: day.change_pct >= 0 ? '--up' : '--down', details: dateLabel(day.date),
        period: '创业板指 399006', note: phone.querySelector('.reveal-copy p')?.innerText ?? '' };
      if (score) {
        const result = summarize(index, answers);
        shareContent = { score, label: '考试成绩', headline: `${result.score} / 100`, headlineColor: '--accent',
          details: `已答 ${result.answered} 题 · 答对 ${result.hits} 题`,
          period: `${dateLabel(archive.baseline.date)} 至 ${dateLabel(day.date)}`,
          returns: pct(result.change), returnColor: result.change >= 0 ? '--up' : '--down', note: '今日方知我是我' };
      }
      shareTitle.textContent = score ? '分享成绩' : '分享结果';
      shareDescription.textContent = score
        ? `${shareContent.headline} 分 · ${shareContent.details} · 模拟盈亏 ${shareContent.returns}`
        : `${dateLabel(day.date)} · 创业板指 ${actual}`;
      if (host) {
        const packageId = location.hostname.match(/^([1-9]\d*)\.app\.xiangban\.xyz$/)?.[1];
        const launchedPack = document.referrer.match(/^https:\/\/chat\.xiangban\.xyz\/create\/run\/([1-9]\d*)\//)?.[1];
        const id = packageId ?? launchedPack;
        if (id) shareURL.value = `https://chat.xiangban.xyz/packs/${id}`;
        else if (!shareURL.value) shareURL.value = `https://chat.xiangban.xyz/search?q=${encodeURIComponent(document.title)}`;
      } else if (location.protocol === 'https:' || location.protocol === 'http:') {
        const url = new URL(location.href);
        url.search = '';
        url.hash = '';
        if (!score) url.searchParams.set('date', day.date);
        shareURL.value = url.href;
      }
      updateSharePoster();
      openPanel(shareDialog);
    }

    phone.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button) return;
      if (button.dataset.choice && state.view === 'question') {
        rememberAttempt();
        const choice = button.dataset.choice;
        const answers = state.mode === 'day' ? state.answers : [...state.answers, choice];
        update({ view: 'reveal', choice, answers });
      }
      switch (button.dataset.action) {
        case 'home':
          if (host && history.state?.shoupanPage === 'attempt') history.back();
          else showExample('intro');
          break;
        case 'start': requestExam(); break;
        case 'restart': requestExam(true); break;
        case 'next': next(); break;
        case 'stop': update({ view: 'score' }); break;
        case 'share-result': showShare(); break;
      }
    });

    examDisclaimer.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (button) examDisclaimer.close(button.value);
    });
    examDisclaimer.addEventListener('close', () => {
      finishPanel(examDisclaimer, examDisclaimer.returnValue === 'start' ? () => {
        rememberAttempt();
        startExam(true);
      } : null);
    });
    shareDialog.querySelector('.share-close').addEventListener('click', () => shareDialog.close());
    shareDialog.addEventListener('close', () => finishPanel(shareDialog));

    previewNav.addEventListener('click', event => {
      const view = event.target.closest('[data-view]')?.dataset.view;
      if (view) showExample(view);
    });

    shareURL.addEventListener('input', updateSharePoster);

    copyButton.addEventListener('click', async () => {
      const url = assessmentLink();
      const text = url?.href ?? [shareDescription.textContent, shareContent.note].join('\n');
      try {
        if (host?.can?.('clipboard') && host.clipboard?.writeText) await host.clipboard.writeText(text);
        else await navigator.clipboard.writeText(text);
        copyStatus.textContent = url ? '已复制链接' : '已复制结果';
      } catch {
        shareFallback.value = text;
        shareFallback.hidden = false;
        shareFallback.focus();
        shareFallback.select();
        copyStatus.textContent = '长按选中的内容复制';
      }
      copyStatus.hidden = false;
    });

    savePoster.addEventListener('click', async () => {
      const name = '收盘别问.png';
      const mime = 'image/png';
      if ((host?.can?.('files') && host.files?.save) || navigator.canShare) {
        const data = Uint8Array.from(atob(sharePoster.src.split(',')[1]), character => character.charCodeAt(0)).buffer;
        const files = [new File([data], name, { type: mime })];
        try {
          if (host?.can?.('files') && host.files?.save) {
            await host.files.save({ name, mime, data });
            return;
          }
          if (navigator.canShare?.({ files })) {
            await navigator.share({ files, title: document.title });
            return;
          }
        } catch (error) {
          if (error?.name === 'AbortError') return;
        }
      }
      const download = document.createElement('a');
      download.href = sharePoster.src;
      download.download = name;
      download.click();
    });

    window.addEventListener('resize', render);
    function isSavedExam(saved) {
      return saved?.mode === 'exam' && days[saved.index] && ['question', 'reveal', 'score'].includes(saved.view)
        && Array.isArray(saved.answers) && saved.answers.length === saved.index + Number(saved.view !== 'question')
        && saved.answers.every(answer => answer === 'up' || answer === 'down');
    }
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (isSavedExam(saved)) savedExam = saved;
    } catch { /* start a new exam */ }

    if (host) {
      history.replaceState({ shoupanPage: 'home' }, '');
      host.on?.('safearea', render);
      window.addEventListener('popstate', event => {
        const open = [examDisclaimer, shareDialog].find(panel => panel.open);
        if (open) {
          open.close('cancel');
        } else if (afterPanelBack) {
          const action = afterPanelBack;
          afterPanelBack = null;
          action();
        } else if (event.state?.shoupanPage === 'attempt' && savedExam) {
          state = savedExam;
          render();
        } else {
          showExample('intro');
        }
      });
    }
    const activeDate = host?.info?.query?.date ?? params.get('date');
    const requestedDay = days.findIndex(day => day.date === activeDate);
    if (requestedDay >= 0) {
      update({ view: 'question', index: requestedDay, choice: '', mode: 'day' });
    } else if (isDesignPreview) {
      showExample(previewView);
    } else if (savedExam && !host) {
      startExam();
    } else {
      render();
    }
    if (host?.ready) {
      const initialSave = savedExam;
      requestAnimationFrame(() => {
        Promise.resolve(host.ready()).then(() => host.storage?.get?.(storageKey)).then(record => {
          if (!isSavedExam(record) || savedExam !== initialSave) return;
          savedExam = record;
          if (state.view === 'intro') render();
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
