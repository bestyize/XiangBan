<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1814"/>
      <stop offset="50%" stop-color="#14100d"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </linearGradient>
    <radialGradient id="boardGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3a2e24"/>
      <stop offset="60%" stop-color="#241c16"/>
      <stop offset="100%" stop-color="#15100c"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#c59f5b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8a692a" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="blackStone" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#555d66"/>
      <stop offset="25%" stop-color="#2b2f34"/>
      <stop offset="70%" stop-color="#141618"/>
      <stop offset="100%" stop-color="#08090a"/>
    </radialGradient>
    <radialGradient id="blackHighlight" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#a0b0c0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="whiteStone" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f3ede2"/>
      <stop offset="80%" stop-color="#dbd2c2"/>
      <stop offset="100%" stop-color="#b8ad98"/>
    </radialGradient>
    <radialGradient id="whiteInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#fff8ed" stop-opacity="0"/>
      <stop offset="95%" stop-color="#e0d4be" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#948065" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="stoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="320" height="180" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="296" height="156" rx="8" fill="url(#boardGrad)" stroke="#53402f" stroke-width="1.5"/>
  <g stroke="url(#goldLine)" stroke-width="1" opacity="0.85">
    <line x1="30" y1="35" x2="290" y2="35"/>
    <line x1="30" y1="58" x2="290" y2="58"/>
    <line x1="30" y1="81" x2="290" y2="81"/>
    <line x1="30" y1="104" x2="290" y2="104"/>
    <line x1="30" y1="127" x2="290" y2="127"/>
    <line x1="30" y1="150" x2="290" y2="150"/>
    <line x1="45" y1="25" x2="45" y2="160"/>
    <line x1="85" y1="25" x2="85" y2="160"/>
    <line x1="125" y1="25" x2="125" y2="160"/>
    <line x1="165" y1="25" x2="165" y2="160"/>
    <line x1="205" y1="25" x2="205" y2="160"/>
    <line x1="245" y1="25" x2="245" y2="160"/>
    <line x1="285" y1="25" x2="285" y2="160"/>
  </g>
  <circle cx="85" cy="58" r="2.5" fill="#f5e0a3" opacity="0.9"/>
  <circle cx="245" cy="58" r="2.5" fill="#f5e0a3" opacity="0.9"/>
  <circle cx="165" cy="104" r="3" fill="#f5e0a3" filter="url(#softGlow)"/>
  <circle cx="85" cy="150" r="2.5" fill="#f5e0a3" opacity="0.9"/>
  <circle cx="245" cy="150" r="2.5" fill="#f5e0a3" opacity="0.9"/>
  <circle cx="165" cy="104" r="28" fill="none" stroke="#f5e0a3" stroke-width="1.2" opacity="0.35"/>
  <circle cx="165" cy="104" r="42" fill="none" stroke="#f5e0a3" stroke-width="0.8" opacity="0.18"/>
  <g transform="translate(108, 98)" filter="url(#stoneShadow)">
    <circle cx="0" cy="0" r="24" fill="url(#blackStone)"/>
    <circle cx="0" cy="0" r="24" fill="url(#blackHighlight)"/>
    <ellipse cx="-7" cy="-7" rx="6" ry="3.5" transform="rotate(-30, -7, -7)" fill="#ffffff" opacity="0.5"/>
  </g>
  <g transform="translate(165, 104)" filter="url(#stoneShadow)">
    <circle cx="0" cy="0" r="24" fill="url(#whiteStone)"/>
    <circle cx="0" cy="0" r="24" fill="url(#whiteInnerGlow)"/>
    <ellipse cx="-7" cy="-7" rx="7" ry="4" transform="rotate(-30, -7, -7)" fill="#ffffff" opacity="0.75"/>
  </g>
  <g transform="translate(205, 58)" filter="url(#stoneShadow)" opacity="0.9">
    <circle cx="0" cy="0" r="15" fill="url(#blackStone)"/>
    <circle cx="0" cy="0" r="15" fill="url(#blackHighlight)"/>
  </g>
  <g transform="translate(245, 104)" filter="url(#stoneShadow)" opacity="0.9">
    <circle cx="0" cy="0" r="15" fill="url(#whiteStone)"/>
  </g>
  <g transform="translate(262, 24)">
    <rect x="0" y="0" width="26" height="26" rx="4" fill="#a82824" stroke="#d45b53" stroke-width="0.8" opacity="0.9"/>
    <text x="13" y="12" fill="#f8e8d8" font-family="'Songti SC', 'SimSun', serif" font-size="8" font-weight="bold" text-anchor="middle">雅</text>
    <text x="13" y="21" fill="#f8e8d8" font-family="'Songti SC', 'SimSun', serif" font-size="8" font-weight="bold" text-anchor="middle">韵</text>
  </g>
  <text x="32" y="44" fill="#f7ecd0" font-family="'Songti SC', 'SimSun', 'Noto Serif SC', serif" font-size="20" font-weight="bold" letter-spacing="2">雅韵五子棋</text>
  <text x="33" y="60" fill="#cbb391" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="9" letter-spacing="1">水墨玉石 · 金石和鸣 · 人机博弈</text>
</svg>