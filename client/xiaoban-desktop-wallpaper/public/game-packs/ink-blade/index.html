<!doctype html>
<html lang="zh-CN">
<head><script src="../desktop-host.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#e9e1cd" />
  <title>水墨剑客</title>
  <link rel="stylesheet" href="../result-share.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <main id="game" class="game" aria-label="水墨剑客，横版水墨动作游戏">
    <canvas id="scene" aria-label="水墨剑客画卷。手机左手拖动移动，右手按斩、跳、闪；电脑用 A D 移动，J 斩，K 跳，L 闪，I 一笔。"></canvas>

    <header class="hud" id="hud" hidden>
      <div class="vitals">
        <div class="hp" id="hp" role="img" aria-label="墨血"></div>
        <div class="ink-meter" id="inkMeter" role="progressbar" aria-label="墨意" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="ink-fill" id="inkFill"></span><small>墨意</small></div>
      </div>
      <div class="score-block"><strong id="score">0</strong><span id="areaLabel">山门</span><small class="goal" id="goal"></small></div>
      <div class="hud-actions">
        <button class="icon-button" id="flipButton" type="button" aria-label="切换横持方向" title="换一边横持" hidden><svg viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 12-3l2 2m0-5v5h-5M19 15a7 7 0 0 1-12 3l-2-2m0 5v-5h5" /></svg></button>
        <button class="icon-button" id="soundButton" type="button" aria-label="开启声音" aria-pressed="false" title="声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z" /><path id="soundWaves" d="m16 9 5 6m0-6-5 6" /></svg></button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="进入全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5" /></svg></button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg></button>
      </div>
    </header>

    <div class="combo" id="combo" aria-live="off" hidden><strong id="comboCount">0</strong><span>连</span></div>
    <div class="boss-bar" id="bossBar" hidden>
      <div class="boss-name"><b id="bossTitle">无常</b><span id="bossSub">斗笠客</span></div>
      <div class="boss-hp"><span id="bossHp"></span></div>
      <div class="boss-posture"><span id="bossPosture"></span></div>
    </div>
    <div class="area-title" id="areaTitle" aria-live="polite" hidden><small id="areaSub"></small><strong id="areaName"></strong><i class="seal" aria-hidden="true">卷</i></div>
    <div class="prompt" id="prompt" role="status" aria-live="polite" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="controls" id="controls" hidden>
      <div class="move-pad" id="movePad" aria-hidden="true"><div class="move-track" id="moveTrack"><span class="arrow left">◀</span><span class="move-knob" id="moveKnob"></span><span class="arrow right">▶</span></div></div>
      <div class="action-cluster">
        <button class="action ink-button" id="inkButton" type="button" aria-label="一笔：墨意满时释放大招" disabled><b>一笔</b><span class="ink-ring" id="inkRing"></span></button>
        <button class="action dash-button" id="dashButton" type="button" aria-label="闪身冲刺"><b>闪</b></button>
        <button class="action jump-button" id="jumpButton" type="button" aria-label="跳跃"><b>跳</b></button>
        <button class="action slash-button" id="slashButton" type="button" aria-label="出剑，敌刃闪朱光时出剑可弹反"><b>斩</b></button>
      </div>
    </div>

    <section id="welcome" class="overlay welcome" aria-labelledby="welcomeTitle">
      <button class="welcome-exit icon-button" id="welcomeExit" type="button" aria-label="返回游戏广场"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" /></svg></button>
      <button class="welcome-flip icon-button" id="welcomeFlip" type="button" aria-label="切换横持方向" title="换一边横持" hidden><svg viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 12-3l2 2m0-5v5h-5M19 15a7 7 0 0 1-12 3l-2-2m0 5v-5h5" /></svg></button>
      <div class="welcome-card">
        <div class="title-row">
          <h1 id="welcomeTitle">水墨剑客</h1>
          <i class="seal big" aria-hidden="true">墨<br>侠</i>
        </div>
        <p class="welcome-description">一卷山水，一人一剑。<br>朱光一闪时出剑，斩断来势。</p>
        <p class="duel-banner" id="duelBanner" hidden><i class="seal" aria-hidden="true">帖</i><span id="duelText"></span></p>
        <p class="welcome-progress" id="welcomeProgress">竹林卷 · 已得 0 / 21 印</p>
        <div class="welcome-actions">
          <button id="startButton" class="primary-button" type="button"><span id="startLabel">入卷</span> <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></button>
          <button id="welcomeSound" class="text-toggle" type="button" aria-pressed="false">声音 · 关</button>
        </div>
        <p class="welcome-foot"><span class="touch-copy">左手拖动移动 · 右手 斩 跳 闪</span><span class="desktop-copy">A D 移动 · J 斩 · K 跳 · L 闪 · I 一笔</span></p>
      </div>
    </section>

    <section id="selectOverlay" class="overlay select" role="dialog" aria-modal="true" aria-labelledby="selectTitle" hidden>
      <header class="select-head">
        <button class="icon-button" id="selectBack" type="button" aria-label="返回卷首"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" /></svg></button>
        <div class="volume-tabs" role="tablist" aria-label="选择卷轴">
          <button type="button" class="volume-tab active" id="volTab1" data-vol="1" role="tab" aria-selected="true">竹林卷</button>
          <button type="button" class="volume-tab" id="volTab2" data-vol="2" role="tab" aria-selected="false">雪江卷</button>
        </div>
        <div class="select-title"><span id="selectProgress">0 / 21 印</span></div>
        <div class="difficulty" role="group" aria-label="选择难度">
          <button type="button" class="mode" data-difficulty="easy" aria-pressed="false"><b>入门</b><span>七滴墨血</span></button>
          <button type="button" class="mode active" data-difficulty="normal" aria-pressed="true"><b>江湖</b><span>五滴墨血</span></button>
        </div>
      </header>
      <div class="level-strip" id="levelStrip" role="list" aria-label="六幅画与长卷"></div>
      <p class="select-foot">每幅三枚印：<b>过</b> 通关 · <b>全</b> 少受伤 · <b>技</b> 完成本幅绝技</p>
    </section>

    <section id="pauseOverlay" class="overlay scrim" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
      <div class="dialog-card"><i class="seal" aria-hidden="true">歇</i><h2 id="pauseTitle">收剑片刻</h2><p id="pauseDescription">画卷停在此处，随时可以接着走。</p><button id="resumeButton" class="primary-button" type="button">继续 <span>→</span></button><button id="pauseExit" class="text-button" type="button">返回游戏广场</button></div>
    </section>

    <section id="resultOverlay" class="overlay scrim" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="dialog-card result-card">
        <i class="seal result-seal" id="resultSeal" aria-hidden="true">品</i>
        <span class="result-badge" id="resultBadge">竹林卷 · 第一幅</span>
        <h2 id="resultTitle">山门</h2>
        <p id="resultDescription"></p>
        <div class="result-main">
          <div class="result-score"><strong id="resultScore">0</strong><span id="resultGrade">本局积分</span></div>
          <ol class="result-seals" id="resultSeals" aria-label="本幅三枚印"></ol>
        </div>
        <div class="result-stats"><div><b id="resultKills">0</b><span>击败</span></div><div><b id="resultCombo">0</b><span>最高连击</span></div><div><b id="resultParries">0</b><span>弹反</span></div><div><b id="resultTime">0:00</b><span>用时</span></div></div>
        <p id="resultBonus" class="result-bonus"></p>
        <p id="bestLabel" class="best-label"></p>
        <button id="shareResultButton" class="result-share-button" type="button" hidden>分享战绩 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7m-8 0h8v8" /></svg></button>
        <div class="result-actions"><button id="nextButton" class="primary-button secondary-button" type="button" hidden>下一幅</button><button id="restartButton" class="primary-button secondary-button" type="button">再来一次</button><button id="mapButton" class="primary-button secondary-button" type="button">返回画卷</button></div>
        <button id="resultExit" class="text-button" type="button">返回游戏广场</button>
      </div>
    </section>
  </main>
  <script src="viewport.js"></script>
  <script src="levels.js"></script>
  <script src="rules.js"></script>
  <script src="progress.js"></script>
  <script src="art.js"></script>
  <script src="figures.js"></script>
  <script src="scene.js"></script>
  <script src="fx.js"></script>
  <script src="audio.js"></script>
  <script src="../result-share.js"></script>
  <script src="game.js"></script>
</body>
</html>
