<style>
:root{color-scheme:dark;--text:#fffaf0;--muted:#e3e2d9aa;--glass:#071c2c60}
*{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#071421;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
#sky{position:fixed;inset:0;background:radial-gradient(ellipse at 55% 52%,#a5d6d4 0%,#729da7 37%,#386477 70%,#162e48 100%);transition:background 1.5s}
#sky:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 48% 12%,#fff5c063,transparent 55%),linear-gradient(0deg,#17374888,transparent 50%);pointer-events:none}
body.dusk #sky{background:radial-gradient(ellipse at 60% 43%,#eeb99a 0%,#bf90a0 43%,#644f80 78%,#30375e 100%)}
body.night #sky{background:radial-gradient(ellipse at 60% 40%,#3d6683 0%,#263c65 36%,#162540 70%,#0b152e 100%)}
#haze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 36% 52% at 51% 57%,#fce4ba22,transparent 80%);mix-blend-mode:screen}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}#scene:active{cursor:grabbing}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}
#stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}body.night #stars{opacity:1}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;box-shadow:0 0 9px 2px #dcf6ff50;animation:twinkle 2.5s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.55)}}
.hud{position:fixed;z-index:10;transition:opacity .45s,transform .45s;pointer-events:none}.hide-ui .hud{opacity:0;transform:translateY(8px);pointer-events:none}
.header{top:35px;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;color:#fff}
.brand{display:flex;align-items:center;gap:11px;font-size:13px;letter-spacing:.16em;font-weight:750;text-shadow:0 2px 16px #153b5288}
.brand-logo{width:31px;height:31px;border-radius:10px;background:#ff5861;display:grid;place-items:center;box-shadow:0 6px 22px #b9375177}
.brand-logo svg{width:24px;height:24px}.edition{color:#fffdf5b7;font-size:10px;letter-spacing:.22em;border:1px solid #ffffff4a;padding:8px 12px;border-radius:50px;backdrop-filter:blur(9px);background:#ffffff13}
.intro{left:6.1%;top:31%;width:33%;max-width:460px;text-shadow:0 2px 34px #1b3c5350}
.eyebrow{display:flex;gap:9px;align-items:center;color:#fffce1db;font-size:11px;letter-spacing:.27em;font-weight:600}.eyebrow:before{content:'';display:block;width:26px;height:1px;background:#f3e5b5}
.intro h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;margin:22px 0 18px;font-size:clamp(41px,4.55vw,72px);line-height:1.26;font-weight:600;letter-spacing:.035em}.intro h1 span{color:#fff3ca}
.lead{font-size:clamp(12px,1.15vw,16px);line-height:2.05;color:#fbfcf6d9;font-weight:350;letter-spacing:.05em;max-width:370px}
.rule{width:55px;height:1px;background:#fff8d58a;margin:28px 0 18px}.subnote{font-size:11px;letter-spacing:.17em;color:#e5e8dfb8}
.controls{right:4.8%;top:50%;transform:translateY(-40%);pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.hide-ui .controls{transform:translateY(calc(-40% + 8px))}.static-preview .controls{display:none}
.control-title{font-size:10px;letter-spacing:.23em;color:#fffadbb8;margin-bottom:6px;padding-right:7px}

.bottom{left:5%;right:5%;bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;color:#e7e9e1b8;font-size:11px;letter-spacing:.12em}
.tips{display:flex;gap:19px;align-items:center;flex-wrap:wrap}.tips span{display:flex;align-items:center;gap:7px}.key{border:1px solid #ffffff70;border-radius:5px;padding:5px 6px;min-width:25px;text-align:center;font-size:10px;color:white}
.bottom-right{font-size:10px;letter-spacing:.24em;color:#fff8e49b}.loader{position:fixed;inset:0;background:#112a3b;color:#fffbe7;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;font-size:12px;letter-spacing:.2em;z-index:30;transition:opacity .8s}.loader span{font-family:Georgia,serif;font-size:36px}.loader.done{opacity:0;pointer-events:none}.loader.error{background:#17212c}.loader small{font-size:12px;letter-spacing:.06em;color:#ffb7b7;max-width:600px;text-align:center;line-height:1.7}
@media(max-width:850px){.header{top:23px;left:22px;right:22px}.edition{font-size:9px;padding:7px}.intro{left:24px;top:20%;width:50%}.intro h1{font-size:clamp(32px,6vw,54px)}.lead{font-size:12px}.controls{right:17px;top:auto;bottom:110px;transform:none!important;gap:7px}.control-title{display:none}.ctrl{width:98px;padding:11px 12px;font-size:11px}.bottom{left:24px;right:24px;bottom:16px}.bottom-right{display:none}}
@media(max-width:560px){.intro{top:93px;width:85%}.intro h1{font-size:35px;margin:13px 0 8px}.intro .lead{max-width:270px;line-height:1.65}.rule,.subnote{display:none}.controls{right:15px;bottom:72px}.ctrl{width:79px;font-size:10px;padding:9px}.bottom{font-size:9px}.tips{gap:8px}.tips span:nth-child(2){display:none}}

<section class="hud intro"><div class="eyebrow">A LITTLE WORLD, JUST FOR YOU</div><h1>我在桌面<br>养了一颗<span>星球</span></h1><p class="lead">一间会亮灯的小木屋，漫山细小的花。<br>云朵绕着它缓缓飘过，时间也在这里慢下来。</p><div class="rule"></div><div class="subnote">一个会呼吸的微缩世界 · 始终陪着你</div></section>

const cf=`precision mediump float;varying vec3 vColor,vN,vP;varying float vDepth;uniform float uDark;void main(){float facing=abs(dot(normalize(vN),normalize(vec3(0.,5.,21.)-vP)));float puff=pow(facing,2.2);gl_FragColor=vec4(vColor,clamp(.2+(vDepth-10.)*.004,0.,.48)*puff*(1.-uDark*.28));}`;
const pv=`attribute vec3 aPos,aColor;attribute float aSize,aPhase;uniform mat4 uViewProj;uniform mediump float uTime,uSnow,uDark;uniform highp float uRotation;varying vec3 vColor;varying float vType,vPhase;void main(){float type=floor(aPhase/100.);float phase=mod(aPhase,100.);vec3 pos=aPos;pos.x+=.1*sin(uTime*.8+phase);pos.y+=.1*cos(uTime*.9+phase*2.);if(type>2.5){pos.y=mod(aPos.y-uTime*.65-phase*3.+30.,25.)-12.;}mat3 r=mat3(cos(uRotation),0.,-sin(uRotation),0.,1.,0.,sin(uRotation),0.,cos(uRotation));vec4 clip=uViewProj*vec4(r*pos,1.);gl_Position=clip;gl_PointSize=min(24.,aSize*(25./max(clip.w,2.))*(type>2.5?1.4:1.));vColor=aColor;vType=type;vPhase=phase;}`;
const pf=`precision mediump float;varying vec3 vColor;varying float vType,vPhase;uniform float uDark,uSnow,uTime;void main(){vec2 p=gl_PointCoord-.5;if(vType>3.5){float flutter=.32+.68*abs(sin(uTime*9.+vPhase));vec2 a=vec2((p.x+.205)/(.22*flutter),(p.y+.02)/.23);vec2 b=vec2((p.x-.205)/(.22*flutter),(p.y+.02)/.23);float wing=max(1.-smoothstep(.65,1.05,length(a)),1.-smoothstep(.65,1.05,length(b)));float body=1.-smoothstep(.04,.09,abs(p.x));float abdomen=body*(1.-smoothstep(.06,.25,abs(p.y)));gl_FragColor=vec4(mix(vColor,vec3(.23,.20,.16),abdomen),max(wing*.88,abdomen*.93));return;}float d=length(p);float alpha=smoothstep(.5,0.,d);if(vType>2.5&&vType<3.5&&uSnow<.5)discard;float k=(vType>2.5?.5:.55+.45*uDark);gl_FragColor=vec4(vColor,alpha*k);}`;
let programs={},meshes={};try{programs.world=program(vs,fs);programs.clouds=program(cv,cf);programs.points=program(pv,pf)}catch(e){loader.classList.add('error');err.textContent='图形着色器初始化失败：'+e.message;return;}
function buffer(data){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);return b}
meshes.world={b:buffer(world.d),count:world.d.length/9,stride:36};meshes.clouds={b:buffer(clouds.d),count:clouds.d.length/9,stride:36};
let pointData=[];for(const p of sparkles)pointData.push(...p.p,...p.c,p.s,p.seed+p.type*100);for(let i=0;i<540;i++){let x=rnd(-15,15),z=rnd(-10,10),y=rnd(-11,13);pointData.push(x,y,z,.9,.96,1,rnd(3,8),300+rnd(0,90));}meshes.points={b:buffer(pointData),count:pointData.length/8,stride:32};
function attr(prog,name,size,stride,offset){let l=gl.getAttribLocation(prog,name);if(l<0)return;gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,size,gl.FLOAT,false,stride,offset)}
function uniforms(prog,cam,now,rotation,dark,snow,tint){const u=(n)=>gl.getUniformLocation(prog,n);gl.uniformMatrix4fv(u('uViewProj'),false,cam);if(u('uTime'))gl.uniform1f(u('uTime'),now);if(u('uRotation'))gl.uniform1f(u('uRotation'),rotation);if(u('uDark'))gl.uniform1f(u('uDark'),dark);if(u('uSnow'))gl.uniform1f(u('uSnow'),snow);if(u('uLight'))gl.uniform3fv(u('uLight'),[-.55,.82,.92]);if(u('uTint'))gl.uniform3fv(u('uTint'),tint)}
function matMul(a,b){let out=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){out[c*4+r]=0;for(let k=0;k<4;k++)out[c*4+r]+=a[k*4+r]*b[c*4+k]}return out}
function projection(fovy,aspect,near,far){let f=1/Math.tan(fovy/2),o=new Float32Array(16);o[0]=f/aspect;o[5]=f;o[10]=(far+near)/(near-far);o[11]=-1;o[14]=(2*far*near)/(near-far);return o}
function lookAt(eye,target,up){let z=norm(sub(eye,target)),x=norm(cross(up,z)),y=cross(z,x),o=new Float32Array(16);o.set([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);return o}
let yaw=0.22,pitch=.185,distance=21,rot=0,auto=true,mode='morning',isSnow=false,tint=[1,1,1],dark=0,desiredDark=0,desiredTint=[1,1,1],wantedYaw=.22,wantedPitch=.185,wantedDist=21,raf=0,prev=performance.now(),lastDraw=0,uiTimer;
const bg=[];for(let i=0;i<94;i++){let el=document.createElement('i');el.className='star';el.style.left=rnd(2,98)+'%';el.style.top=rnd(1,88)+'%';el.style.animationDelay=rnd(0,3)+'s';el.style.opacity=rnd(.3,.95);document.getElementById('stars').appendChild(el)}
function resize(){const dpr=Math.min(devicePixelRatio||1,1.75),width=Math.max(1,Math.floor(canvas.clientWidth*dpr)),height=Math.max(1,Math.floor(canvas.clientHeight*dpr));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}gl.viewport(0,0,width,height)}
function drawMesh(mesh,pg,cam,now,snow,blending){gl.useProgram(pg);gl.bindBuffer(gl.ARRAY_BUFFER,mesh.b);if(mesh.stride===36){attr(pg,'aPos',3,36,0);attr(pg,'aNormal',3,36,12);attr(pg,'aColor',3,36,24);}else{attr(pg,'aPos',3,32,0);attr(pg,'aColor',3,32,12);attr(pg,'aSize',1,32,24);attr(pg,'aPhase',1,32,28)}uniforms(pg,cam,now,rot,dark,snow,tint);if(blending){gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false)}else{gl.disable(gl.BLEND);gl.depthMask(true)}gl.drawArrays(mesh.stride===36?gl.TRIANGLES:gl.POINTS,0,mesh.count)}
function render(now){if(document.hidden){raf=0;return}if(now-lastDraw<(moving?16:33)){raf=requestAnimationFrame(render);return}lastDraw=now;const dt=Math.min(.05,(now-prev)/1000);prev=now;const speed=1-Math.exp(-dt*4);if(auto)wantedYaw+=dt*.050;yaw+=(wantedYaw-yaw)*speed;pitch+=(wantedPitch-pitch)*speed;distance+=(wantedDist-distance)*speed;rot=yaw;dark+=(desiredDark-dark)*speed*.54;for(let i=0;i<3;i++)tint[i]+=(desiredTint[i]-tint[i])*speed*.64;
resize();gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.CULL_FACE);gl.cullFace(gl.BACK);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const aspect=canvas.width/canvas.height;let x=0,y=0,offset=0;if(aspect>1.25){offset=aspect>1.8?2.1:1.1;}else if(aspect<.65){offset=0.3;}const eye=[0,1.12+distance*Math.sin(pitch),distance*Math.cos(pitch)];const target=[-offset,1.12,0];const vp=matMul(projection(Math.PI/(aspect<.7?3.2:3.45),aspect,.1,150),lookAt(eye,target,[0,1,0]));gl.disable(gl.CULL_FACE);drawMesh(meshes.world,programs.world,vp,now*.001,isSnow?1:0,false);gl.enable(gl.CULL_FACE);gl.disable(gl.CULL_FACE);drawMesh(meshes.clouds,programs.clouds,vp,now*.001,0,true);drawMesh(meshes.points,programs.points,vp,now*.001,isSnow?1:0,true);gl.depthMask(true);gl.disable(gl.BLEND);raf=requestAnimationFrame(render)}
function start(){if(!raf){prev=performance.now();raf=requestAnimationFrame(render)}}
let moving=false,px=0,py=0;canvas.addEventListener('pointerdown',e=>{document.body.classList.remove('hide-ui');moving=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!moving)return;let dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;wantedYaw+=dx*.006;wantedPitch=Math.max(-.85,Math.min(1.15,wantedPitch+dy*.003));});canvas.addEventListener('pointerup',()=>moving=false);canvas.addEventListener('pointercancel',()=>moving=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();wantedDist=Math.max(13,Math.min(34,wantedDist+Math.sign(e.deltaY)*1.4))},{passive:false});
for(const button of document.querySelectorAll('[data-mode]'))button.onclick=()=>{mode=button.dataset.mode;document.body.classList.toggle('night',mode==='night');document.body.classList.toggle('dusk',mode==='dusk');desiredDark=mode==='night'?1:mode==='dusk'?.37:0;desiredTint=mode==='night'?[.48,.65,.95]:mode==='dusk'?[1.18,.84,.78]:[1,1,1];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button))};
document.getElementById('snow').onclick=e=>{isSnow=!isSnow;e.currentTarget.classList.toggle('active',isSnow)};document.getElementById('auto').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('active',auto)};
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')document.body.classList.toggle('hide-ui');if(e.key==='Escape')document.body.classList.add('hide-ui')});
document.getElementById('auto').classList.add('active');if(location.search.includes('wallpaper=1'))document.body.classList.add('hide-ui');else setTimeout(()=>document.body.classList.add('hide-ui'),12000)
document.addEventListener('visibilitychange',()=>{if(!document.hidden)start()});window.addEventListener('resize',start);
loader.classList.add('done');setTimeout(()=>loader.remove(),1200);start();
})();
