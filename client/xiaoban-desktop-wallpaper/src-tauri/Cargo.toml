[package]
name = "xiaoban-desktop-wallpaper"
version = "0.1.0"
description = "小伴：Windows / macOS 悬浮桌宠与动态壁纸"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi", "Win32_UI_HiDpi"
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "NSWindow", "NSView", "NSScreen", "NSEvent", "NSColor", "objc2-core-foundation"
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std", "CFArray", "CFDictionary", "CFString", "CFNumber"
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std", "CGWindow", "CGWindowLevel"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
