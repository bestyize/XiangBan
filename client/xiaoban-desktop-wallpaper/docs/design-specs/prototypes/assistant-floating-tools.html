function leave(){clearTimeout(openTimer);if(!pinned)closeTimer=setTimeout(()=>setOpen(false),420)}
tools.addEventListener('pointerenter',enter);tools.addEventListener('pointerleave',leave);$('fan').addEventListener('pointerenter',()=>{clearTimeout(closeTimer);clearTimeout(openTimer)});$('fan').addEventListener('pointerleave',leave);main.addEventListener('pointerenter',enter);main.addEventListener('pointerleave',leave);main.addEventListener('focus',()=>{if(!draft.value.trim()&&!images.length&&!busy)enter()});
document.querySelectorAll('.tool').forEach(b=>{b.addEventListener('pointerenter',()=>{clearTimeout(closeTimer);clearTimeout(openTimer)});b.addEventListener('pointerleave',leave);b.addEventListener('focus',()=>{clearTimeout(closeTimer)});b.addEventListener('click',()=>toolAction(b.dataset.action));});
main.addEventListener('click',()=>{if(busy){clearTimeout(replyTimer);busy=false;$('answerText').textContent='已停止。你可以补充想法，再继续。';updateMain();return}if(draft.value.trim()||images.length){send();return}pinned=!pinned;setOpen(pinned)});
document.addEventListener('pointerdown',e=>{if(!tools.contains(e.target)){pinned=false;setOpen(false)}});
draft.addEventListener('input',updateMain);draft.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}});
function send(){if(busy||(!draft.value.trim()&&!images.length))return;const text=draft.value.trim()||'帮我看看这张图片';const hasImages=images.length>0;$('question').textContent=text;$('answerText').textContent='正在想一想…';$('answer').classList.remove('hidden');draft.value='';images=[];renderImages();listening=false;assistant.classList.remove('listening');draft.placeholder='问点什么，或直接说话';busy=true;pinned=false;setOpen(false);updateMain();assistant.classList.add('used');replyTimer=setTimeout(()=>{busy=false;$('answerText').textContent=hasImages?'收到图片了。\n正式接入后，小伴会把图片和你的问题一起交给模型。':'我在。\n这版把截图、图片和完整聊天藏在了右侧，需要时轻轻靠近就能找到。';updateMain()},1100)}
function renderImages(){const host=$('attachments');host.replaceChildren();images.forEach((src,i)=>{const wrap=document.createElement('div');wrap.className='attachment';const image=document.createElement('img');image.src=src;image.alt='待发送的图片 '+(i+1);const remove=document.createElement('button');remove.className='remove-image';remove.setAttribute('aria-label','移除图片 '+(i+1));remove.innerHTML='<svg><use href="#x"/></svg>';remove.onclick=()=>{images.splice(i,1);renderImages()};wrap.append(image,remove);host.append(wrap)});updateMain()}
async function addFiles(files){for(const f of files){if(images.length>=8){toast('最多添加 8 张图片');break}if(!['image/png','image/jpeg','image/gif','image/webp'].includes(f.type)){toast('请选择 PNG、JPEG、GIF 或 WebP 图片');continue}if(f.size>3*1024*1024){toast('单张图片请小于 3MB');continue}try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});images.push(data)}catch{toast('图片读取失败，请重试')}}renderImages();draft.focus()}
function toolAction(action){pinned=false;setOpen(false);if(action==='settings'){$('dialogTitle').textContent='超级小伴设置';$('chatView').hidden=true;$('settingsView').hidden=false;$('dialogFoot').textContent='语音助手专属设置 · 此处为形态演示';document.querySelector('.chat-dialog').setAttribute('aria-label','超级小伴设置');$('dialog').classList.add('visible');$('closeDialog').focus()}if(action==='image'){$('filePicker').click()}if(action==='screenshot'){if(images.length>=8){toast('最多添加 8 张图片');return}beginCapture()}if(action==='collapse'){assistant.inert=true;assistant.classList.add('hidden');$('folded').classList.add('visible');$('folded').focus()}if(action==='expand'){$('dialogTitle').textContent='聊天详情';$('chatView').hidden=false;$('settingsView').hidden=true;$('dialogFoot').textContent='当前对话已带入聊天详情页 · 此处为形态演示';document.querySelector('.chat-dialog').setAttribute('aria-label','聊天详情页演示');$('fullQuestion').textContent=$('question').textContent;$('fullAnswer').textContent=$('answerText').textContent;$('dialog').classList.add('visible');$('closeDialog').focus()}}
$('filePicker').onchange=e=>{void addFiles(Array.from(e.target.files));e.target.value=''};
$('composer').addEventListener('dragover',e=>{e.preventDefault();$('composer').classList.add('dragover')});$('composer').addEventListener('dragleave',()=>{$('composer').classList.remove('dragover')});$('composer').addEventListener('drop',e=>{e.preventDefault();$('composer').classList.remove('dragover');void addFiles(Array.from(e.dataTransfer.files))});draft.addEventListener('paste',e=>{const files=Array.from(e.clipboardData?.files||[]).filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();void addFiles(files)}});window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>e.preventDefault());
function reopenAssistant(){assistant.inert=false;$('reopen').hidden=true;$('folded').classList.remove('visible');assistant.classList.remove('hidden');draft.focus()}$('reopen').onclick=reopenAssistant;$('folded').onclick=reopenAssistant;$('dismiss').onclick=()=>{$('answer').classList.add('hidden')};$('orbButton').onclick=()=>{listening=!listening;assistant.classList.toggle('listening',listening);draft.placeholder=listening?'我在听，请说…':'问点什么，或直接说话';if(listening)toast('聆听状态演示，未开启麦克风')};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('answerText').textContent);toast('已复制回复')}catch{toast('当前预览环境不允许访问剪贴板')}};
$('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);drawWallpaper()};
function resetCapture(){capture=null;dragging=false;startPoint=null;$('selection').style.display='none';$('captureActions').style.display='none'}
function beginCapture(){listening=false;assistant.classList.remove('listening');resetCapture();document.body.classList.add('capturing')}
function endCapture(){document.body.classList.remove('capturing');resetCapture();draft.focus()}
$('captureLayer').onpointerdown=e=>{if(e.target.closest('.capture-actions'))return;resetCapture();dragging=true;startPoint={x:e.clientX,y:e.clientY};$('captureLayer').setPointerCapture(e.pointerId)};
$('captureLayer').onpointermove=e=>{if(!dragging)return;const x=Math.min(startPoint.x,e.clientX),y=Math.min(startPoint.y,e.clientY),w=Math.abs(startPoint.x-e.clientX),h=Math.abs(startPoint.y-e.clientY);capture={x,y,w,h};const sel=$('selection');Object.assign(sel.style,{display:'block',left:x+'px',top:y+'px',width:w+'px',height:h+'px'});sel.style.setProperty('--sw',w+'px');sel.style.setProperty('--sh',h+'px');$('selectionSize').textContent=Math.round(w)+' × '+Math.round(h)};
$('captureLayer').onpointerup=e=>{if(!dragging)return;dragging=false;if($('captureLayer').hasPointerCapture(e.pointerId))$('captureLayer').releasePointerCapture(e.pointerId);if(!capture||capture.w<12||capture.h<12){resetCapture();return}const bar=$('captureActions');Object.assign(bar.style,{display:'flex',left:Math.max(8,Math.min(innerWidth-244,capture.x+capture.w-232))+'px',top:Math.max(8,Math.min(innerHeight-52,capture.y+capture.h+13))+'px'})};
$('recapture').onclick=resetCapture;$('cancelCapture').onclick=endCapture;$('confirmCapture').onclick=()=>{if(!capture)return;const dpr=devicePixelRatio||1,c=document.createElement('canvas');c.width=Math.max(1,Math.round(capture.w*dpr));c.height=Math.max(1,Math.round(capture.h*dpr));c.getContext('2d').drawImage(canvas,capture.x*dpr,capture.y*dpr,capture.w*dpr,capture.h*dpr,0,0,c.width,c.height);images.push(c.toDataURL('image/png'));endCapture();renderImages();toast('截图已加入，补一句话再发送')};
$('closeDialog').onclick=()=>{$('dialog').classList.remove('visible');draft.focus()};$('dialog').onclick=e=>{if(e.target===$('dialog'))$('closeDialog').click()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('capturing'))endCapture();else if($('dialog').classList.contains('visible'))$('closeDialog').click();else{pinned=false;main.focus();setOpen(false)}}if(e.key==='ArrowUp'&&document.activeElement===main){e.preventDefault();setOpen(true);document.querySelector('.tool').focus()}});
$('reset').onclick=()=>{assistant.inert=false;$('reopen').hidden=true;clearTimeout(replyTimer);busy=false;images=[];draft.value='';listening=false;assistant.classList.remove('hidden','used','listening');$('folded').classList.remove('visible');$('answer').classList.remove('hidden');$('question').textContent='帮我看看，这个界面还能怎么简化？';$('answerText').textContent='把不常用的操作收起来，让输入和回答成为主角。\n需要工具时，靠近右侧按钮就好。';draft.placeholder='问点什么，或直接说话';pinned=false;setOpen(false);renderImages();endCapture();$('dialog').classList.remove('visible')};
$('answerText').textContent=$('answerText').textContent.replace(/\\n/g,'\n');window.addEventListener('resize',drawWallpaper);drawWallpaper();updateMain();
})();
</script></body></html>
