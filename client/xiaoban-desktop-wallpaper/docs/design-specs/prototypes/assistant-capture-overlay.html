function syncRect(){Object.assign(selection.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'});$('sizeText').textContent=`${Math.round(rect.w*dpr)} × ${Math.round(rect.h*dpr)} px`;selection.hidden=rect.w<2||rect.h<2;$('shadeFull').hidden=!selection.hidden;marks.width=Math.max(1,Math.round(rect.w*dpr));marks.height=Math.max(1,Math.round(rect.h*dpr));ink.setTransform(dpr,0,0,dpr,0,0);renderMarks();positionDock()}
function point(event){return {x:clamp((event.clientX-rect.x)/rect.w,0,1),y:clamp((event.clientY-rect.y)/rect.h,0,1)}}
function renderMark(mark){const p=mark.points.map(p=>({x:p.x*rect.w,y:p.y*rect.h})),a=p[0],b=p[p.length-1];ink.save();ink.strokeStyle=mark.color;ink.fillStyle=mark.color;ink.lineWidth=mark.stroke;ink.lineJoin='round';ink.lineCap='round';if(mark.type==='rectangle'){ink.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}if(mark.type==='arrow'){const angle=Math.atan2(b.y-a.y,b.x-a.x),len=9+mark.stroke;ink.beginPath();ink.moveTo(a.x,a.y);ink.lineTo(b.x,b.y);ink.stroke();ink.beginPath();ink.moveTo(b.x,b.y);ink.lineTo(b.x-len*Math.cos(angle-.4),b.y-len*Math.sin(angle-.4));ink.lineTo(b.x-len*Math.cos(angle+.4),b.y-len*Math.sin(angle+.4));ink.closePath();ink.fill()}if(mark.type==='pen'){ink.beginPath();ink.moveTo(a.x,a.y);p.slice(1).forEach(q=>ink.lineTo(q.x,q.y));ink.stroke()}if(mark.type==='text'){ink.font='500 16px -apple-system,"PingFang SC",sans-serif';ink.textBaseline='top';mark.text.split('\n').forEach((line,i)=>ink.fillText(line,a.x,a.y+i*22))}if(mark.type==='mosaic'){const cell=10;for(const pt of p){const cx=Math.floor(pt.x/cell)*cell,cy=Math.floor(pt.y/cell)*cell;for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const x=cx+i*cell,y=cy+j*cell;if(x<0||y<0||x>=rect.w||y>=rect.h)continue;const sx=clamp(Math.round((rect.x+x+cell/2)*dpr),0,desktop.width-1),sy=clamp(Math.round((rect.y+y+cell/2)*dpr),0,desktop.height-1),rgba=bg.getImageData(sx,sy,1,1).data;ink.fillStyle=`rgb(${rgba[0]},${rgba[1]},${rgba[2]})`;ink.fillRect(x,y,Math.min(cell,rect.w-x),Math.min(cell,rect.h-y))}}}ink.restore()}
function renderMarks(){ink.clearRect(0,0,rect.w,rect.h);history.forEach(renderMark);if(draftMark)renderMark(draftMark);$('undo').disabled=!history.length}
function finishText(cancel=false){if(!textEntry)return;const input=textEntry;textEntry=null;const value=input.value.trim();if(value&&!cancel){history.push({type:'text',points:[{x:Number(input.dataset.x),y:Number(input.dataset.y)}],color:input.dataset.color,stroke,text:value})}input.remove();renderMarks()}
function addText(p){finishText();const input=document.createElement('textarea');input.className='text-entry';input.placeholder='输入文字…';input.dataset.x=p.x;input.dataset.y=p.y;input.dataset.color=color;Object.assign(input.style,{left:Math.min(p.x*rect.w,Math.max(0,rect.w-110))+'px',top:Math.min(p.y*rect.h,Math.max(0,rect.h-34))+'px',width:Math.min(180,rect.w)+'px',color});input.addEventListener('pointerdown',e=>e.stopPropagation());input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();finishText()}if(e.key==='Escape'){e.stopPropagation();finishText(true)}});input.addEventListener('blur',()=>finishText());selection.append(input);textEntry=input;input.focus()}
function restart(empty=false){finishText(true);$('assistant').classList.remove('visible');capture.hidden=false;history=[];draftMark=null;setTool('select');rect=empty?{x:0,y:0,w:0,h:0}:{x:Math.round(innerWidth*.27),y:Math.round(innerHeight*.27),w:Math.round(innerWidth*.49),h:Math.round(innerHeight*.35)};dock.hidden=empty;syncRect();$('guideText').textContent=empty?'拖动鼠标框选截图区域':'拖动选区可移动，拖动边角调整大小'}
capture.addEventListener('pointerdown',e=>{if(e.button!==0||dock.contains(e.target)||textEntry?.contains(e.target))return;finishText();const handle=e.target.closest('[data-edge]'),inside=selection.contains(e.target);if(inside&&tool==='text'&&!handle){addText(point(e));return}if(inside&&tool!=='select'&&!handle){const p=point(e);draftMark={type:tool,points:[p,p],color,stroke};gesture={mode:'draw'};}else if(handle){gesture={mode:'resize',edge:handle.dataset.edge,start:{x:e.clientX,y:e.clientY},original:{...rect}}}else if(inside){gesture={mode:'move',start:{x:e.clientX,y:e.clientY},original:{...rect}}}else{history=[];draftMark=null;gesture={mode:'new',start:{x:e.clientX,y:e.clientY}};rect={x:e.clientX,y:e.clientY,w:0,h:0};}dock.hidden=true;capture.setPointerCapture(e.pointerId);e.preventDefault()});
capture.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture,x=clamp(e.clientX,0,innerWidth),y=clamp(e.clientY,0,innerHeight);if(g.mode==='draw'){const p=point(e);if(tool==='pen'||tool==='mosaic')draftMark.points.push(p);else draftMark.points[1]=p;renderMarks();return}if(g.mode==='new'){rect={x:Math.min(g.start.x,x),y:Math.min(g.start.y,y),w:Math.abs(x-g.start.x),h:Math.abs(y-g.start.y)}}if(g.mode==='move'){rect={...g.original,x:clamp(g.original.x+x-g.start.x,0,innerWidth-g.original.w),y:clamp(g.original.y+y-g.start.y,0,innerHeight-g.original.h)}}if(g.mode==='resize'){let {x:left,y:top,w,h}=g.original,right=left+w,bottom=top+h;const dx=x-g.start.x,dy=y-g.start.y;if(g.edge.includes('w'))left=clamp(left+dx,0,right-20);if(g.edge.includes('e'))right=clamp(right+dx,left+20,innerWidth);if(g.edge.includes('n'))top=clamp(top+dy,0,bottom-20);if(g.edge.includes('s'))bottom=clamp(bottom+dy,top+20,innerHeight);rect={x:left,y:top,w:right-left,h:bottom-top}}syncRect()});
function endGesture(e){if(!gesture)return;if(draftMark){history.push(draftMark);draftMark=null;renderMarks()}gesture=null;if(capture.hasPointerCapture(e.pointerId))capture.releasePointerCapture(e.pointerId);dock.hidden=rect.w<12||rect.h<12;syncRect()}
capture.addEventListener('pointerup',endGesture);capture.addEventListener('pointercancel',endGesture);selection.addEventListener('dblclick',e=>{if(tool==='select'){e.preventDefault();complete()}});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))})});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{stroke=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))})});
$('undo').onclick=()=>{finishText();history.pop();renderMarks()};$('reselect').onclick=()=>restart(true);
function exitCapture(done){capture.hidden=true;gesture=null;$('assistant').classList.add('visible');$('imageRow').hidden=!done;$('resultTitle').textContent=done?'截图已加入对话':'已取消截图';$('resultNote').textContent=done?'补充一句想问的内容，再一起发给小伴。':'原来的问题还在，可以继续输入。';$('draft').focus()}
function complete(){finishText();if(rect.w<12||rect.h<12)return;const out=document.createElement('canvas');out.width=Math.max(1,Math.round(rect.w*dpr));out.height=Math.max(1,Math.round(rect.h*dpr));const g=out.getContext('2d');g.drawImage(desktop,rect.x*dpr,rect.y*dpr,rect.w*dpr,rect.h*dpr,0,0,out.width,out.height);g.drawImage(marks,0,0,out.width,out.height);imageURL=out.toDataURL('image/png');$('imagePreview').src=imageURL;$('largeImage').src=imageURL;$('imageMeta').textContent=`${out.width} × ${out.height} px · 已保留标注`;exitCapture(true)}
$('confirm').onclick=complete;$('cancel').onclick=()=>{finishText(true);exitCapture(false)};$('again').onclick=()=>restart(true);$('removeImage').onclick=()=>{$('imageRow').hidden=true;imageURL=''};$('imagePreview').onclick=()=>{$('lightbox').classList.add('visible')};$('lightbox').onclick=()=>{$('lightbox').classList.remove('visible')};$('send').onclick=()=>toast('这是交互设计稿，截图与问题尚未发送给模型');
document.addEventListener('keydown',e=>{if(textEntry||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(e.key==='Escape'){if($('lightbox').classList.contains('visible')){$('lightbox').classList.remove('visible');return}if(!capture.hidden){finishText(true);exitCapture(false)}}if(!capture.hidden&&e.key==='Enter'){e.preventDefault();complete()}if(!capture.hidden&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click()}});
window.addEventListener('resize',()=>{drawDesktop();rect.w=Math.min(rect.w,innerWidth);rect.h=Math.min(rect.h,innerHeight);rect.x=clamp(rect.x,0,innerWidth-rect.w);rect.y=clamp(rect.y,0,innerHeight-rect.h);syncRect()});drawDesktop();restart();
})();
</script></body></html>
