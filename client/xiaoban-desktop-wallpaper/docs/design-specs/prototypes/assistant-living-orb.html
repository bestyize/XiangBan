<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小伴 · 一点生命感</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f4ef;color:#41463e;font:14px/1.6 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;transition:background .4s,color .4s}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #83aa99;outline-offset:5px}main{max-width:1080px;margin:auto;padding:40px 36px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:10px;letter-spacing:.22em;color:#92988b}h1{font-size:27px;font-weight:500;letter-spacing:.06em;margin:10px 0 5px}.intro{font-size:12px;color:#93978d;margin:0}.theme{border:1px solid #dcded5;background:transparent;color:inherit;border-radius:20px;padding:7px 14px;font-size:11px}.hero{text-align:center;padding:57px 0 35px}.orb-wrap{width:164px;height:164px;display:grid;place-items:center;margin:auto;position:relative}.orb{--a:#e4ffe9;--b:#93dfb7;--c:#4bb99e;--d:#43868e;display:block;width:124px;height:124px;border-radius:50%;position:relative;isolation:isolate;overflow:hidden;background:var(--paint,radial-gradient(circle at 28% 19%,var(--a),var(--b) 32%,var(--c) 64%,var(--d)));box-shadow:inset 0 0 0 1px #ffffff40,inset 3px 5px 12px #ffffff35,inset -5px -7px 16px #17404c22;animation:breathe 5s ease-in-out infinite;transition:background .5s}.orb:before{content:'';position:absolute;width:150%;height:110%;left:-40%;top:-30%;border-radius:43%;background:radial-gradient(ellipse at 60% 70%,var(--a),transparent 65%);opacity:.65;filter:blur(10px);animation:flow 13s linear infinite}.orb:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 35% 17%,#ffffff9c,transparent 28%),radial-gradient(ellipse at 70% 85%,#ffffff24,transparent 40%);box-shadow:inset 0 -1px 2px #ffffff35}.mist{position:absolute;inset:12%;border-radius:45%;border:1px solid #ffffff35;filter:blur(5px);transform:rotate(-25deg);animation:flow 16s linear infinite reverse}.ground{height:8px;width:65px;position:absolute;bottom:0;border-radius:50%;background:#68786b18;filter:blur(5px)}.hero h2{font-size:18px;font-weight:500;margin:25px 0 4px;letter-spacing:.08em}.description{font-size:12px;color:#92988d;margin:0}.status{font-size:10px;color:#899b8c;letter-spacing:.12em;min-height:24px;margin-top:18px}.controls{display:flex;justify-content:center;gap:6px}.controls button{border:0;border-radius:20px;background:transparent;color:#93988f;padding:7px 17px;font-size:11px}.controls button[aria-pressed=true]{background:#e6eae0;color:#4d6252}.palette-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0 30px}.palette{border:1px solid transparent;background:#eeeee7;border-radius:20px;padding:25px 13px 17px;color:inherit;text-align:center;transition:transform .2s,background .2s}.palette:hover{transform:translateY(-3px)}.palette[aria-pressed=true]{border-color:#a9bca7;background:#fdfdf8}.mini{width:46px;height:46px;margin:auto;animation:none}.palette strong{display:block;font-size:12px;font-weight:500;margin-top:15px}.palette small{display:block;font-size:10px;color:#93988d;margin-top:4px}.swatches{display:flex;justify-content:center;gap:4px;margin-top:13px}.swatches i{width:5px;height:5px;background:var(--swatch);border-radius:50%}.preview{border-top:1px solid #dddfd4;padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.sample{background:#ebece4;border-radius:18px;min-height:130px;display:grid;place-items:center;padding:24px}.sample.night{background:#292e2e}.bar{display:flex;align-items:center;gap:12px;width:min(100%,330px);height:58px;padding:0 16px;border-radius:30px;background:#fffefa;color:#a6aa9f;box-shadow:0 3px 14px #29362309;font-size:12px}.night .bar{background:#3a4140;color:#a3b0a9;box-shadow:inset 0 1px #ffffff0b}.bar .orb{width:28px;height:28px;flex:none}.bar span{flex:1}.plus{font-size:22px;font-weight:300;color:#9aa798}.foot{text-align:center;font-size:10px;color:#9a9f93;margin:24px 0 0}body[data-state=listening] .orb{animation:listen 1.35s ease-in-out infinite}body[data-state=listening] .mist{opacity:.9;filter:blur(2px);border-width:2px;animation-duration:2.8s}body[data-state=listening] .orb:before{animation-duration:4s}body[data-state=thinking] .orb{animation:ponder 2.5s linear infinite}body[data-state=thinking] .orb:before{opacity:.9;animation-duration:1.4s;filter:blur(4px)}body[data-state=thinking] .mist{filter:blur(1px);border-width:2px;animation-duration:1.2s}body[data-state=speaking] .orb{animation:speak 3s ease-in-out infinite}body[data-state=speaking] .orb:before{animation-duration:2.3s;opacity:.85}body[data-state=speaking] .mist{filter:blur(2px);animation-duration:2s}body.dark{background:#252a29;color:#e2e7df}.dark .intro,.dark .description,.dark .eyebrow,.dark .foot{color:#8f9f96}.dark .palette{background:#303735}.dark .palette[aria-pressed=true]{background:#3b4540;border-color:#819f8b}.dark .palette small{color:#9ba99e}.dark .theme{border-color:#4b5850}.dark .controls button[aria-pressed=true]{background:#3c4b41;color:#d5e8d7}.dark .preview{border-color:#404b43}.dark .ground{background:#0003}@keyframes breathe{50%{transform:scale(.965) translateY(-2px)}}@keyframes flow{to{transform:rotate(360deg)}}@keyframes listen{0%,100%{transform:scale(.88)}50%{transform:scale(1.08)}}@keyframes ponder{0%{transform:rotate(0deg) scale(.97)}50%{transform:rotate(180deg) scale(1.03)}100%{transform:rotate(360deg) scale(.97)}}@keyframes speak{0%,100%{transform:scale(1,.958)}18%{transform:scale(.909,1.098)}36%{transform:scale(1.084,.916)}55%{transform:scale(.958,1.049)}72%{transform:scale(1.049,.951)}88%{transform:scale(.944,1.077)}}@media(max-width:650px){main{padding:26px 20px}.palette-grid{grid-template-columns:1fr 1fr}.preview{grid-template-columns:1fr}.hero{padding-top:35px}h1{font-size:22px}.intro{max-width:235px}header{align-items:flex-start}.theme{white-space:nowrap}} .palette .orb,.palette .orb:before,.palette .mist{animation:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style><body data-state="idle"><main><header><div><div class="eyebrow">XIAOBAN / LIVING COLOUR</div><h1>一点生命感</h1><p class="intro">颜色鲜活一点，陪伴安静一点。</p></div><button class="theme" aria-pressed="false">切换深色背景</button></header><section class="hero"><div class="orb-wrap"><div class="orb"><i class="mist"></i></div><i class="ground"></i></div><h2 id="name">青柚 · 海盐</h2><p class="description" id="description">嫩绿过渡到浅青，清新、舒展，有一点自然的呼吸感。</p><p class="status" aria-live="polite">安静陪着你</p><div class="controls" aria-label="生命球状态"><button data-state="idle" aria-pressed="true">待机</button><button data-state="listening" aria-pressed="false">聆听</button><button data-state="thinking" aria-pressed="false">思考</button><button data-state="speaking" aria-pressed="false">说话</button></div></section><div class="palette-grid" aria-label="生命球配色"></div><section class="preview" aria-label="实际尺寸预览"><div class="sample"><div class="bar"><i class="orb"><i class="mist"></i></i><span>问点什么，或直接说话</span><b class="plus">＋</b></div></div><div class="sample night"><div class="bar"><i class="orb"><i class="mist"></i></i><span>问点什么，或直接说话</span><b class="plus">＋</b></div></div></section><p class="foot">上方放大看材质 · 下方 28px 看实际效果 · 点击色卡切换</p></main><script>
const palettes=[
{name:'晚霞',sub:'杏金 / 珊瑚 / 霞紫',desc:'暖杏的亮面，珊瑚色的中心，边缘留一抹柔紫，像落日之后的天空。',colors:['#FFE8AD','#FFBA96','#E98DA4','#9D83B2']},
{name:'樱粉',sub:'花瓣 / 玫瑰 / 莓果',desc:'透亮的樱花粉，揉进一点玫瑰色；温柔，但不会白得失去颜色。',colors:['#FFE5EF','#F5A9C6','#DF7AA9','#AD709A']},
{name:'彩虹',sub:'多彩 / 轻盈 / 流动',desc:'明亮的金黄、玫粉、天蓝与翡翠绿，在球体里柔和交融，鲜活而通透。',colors:['#FFE47A','#F26BAA','#55BEEB','#43D6A2'],paint:'radial-gradient(ellipse at 25% 20%,#FFE47A,transparent 56%),radial-gradient(ellipse at 78% 28%,#F26BAA,transparent 60%),radial-gradient(ellipse at 80% 85%,#55BEEB,transparent 58%),radial-gradient(ellipse at 18% 78%,#43D6A2,transparent 62%),#AF8DE2'},
{name:'青柚 · 海盐',sub:'清新 / 自然',desc:'嫩绿过渡到浅青，清新、舒展，有一点自然的呼吸感。',colors:['#E4FFE9','#93DFB7','#4BB99E','#43868E']},
{name:'蜂蜜 · 青芽',sub:'明朗 / 轻快',desc:'明亮的蜜黄色与新芽绿相遇，轻快，有精神，又不过分抢眼。',colors:['#FFF7C3','#E4DE86','#AEC573','#6EAA86']},
{name:'晴空 · 浅海',sub:'清透 / 松弛',desc:'淡淡的天蓝与海水青，没有霓虹感，像一颗透光的水滴。',colors:['#E1FAFF','#A3DCE8','#66BCCC','#598FAF']}];
const vars=p=>p.colors.map((v,i)=>`--${'abcd'[i]}:${v}`).join(';')+';--paint:'+(p.paint||'initial');const grid=document.querySelector('.palette-grid');palettes.forEach((p,i)=>{const b=document.createElement('button');b.className='palette';b.setAttribute('aria-pressed',i===0?'true':'false');b.innerHTML=`<i class="orb mini" style="${vars(p)}"><i class="mist"></i></i><strong>${p.name}</strong><small>${p.sub}</small><div class="swatches">${p.colors.map(c=>`<i style="--swatch:${c}"></i>`).join('')}</div>`;b.onclick=()=>{document.querySelectorAll('.hero .orb,.bar .orb').forEach(o=>o.style.cssText=vars(p));document.querySelector('#name').textContent=p.name;document.querySelector('#description').textContent=p.desc;grid.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};grid.append(b)});grid.children[2].click();const labels={idle:'安静陪着你',listening:'我在听，你慢慢说',thinking:'让我想一想',speaking:'把想法说给你听'};document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>{document.body.dataset.state=b.dataset.state;document.querySelector('.status').textContent=labels[b.dataset.state];document.querySelectorAll('.controls button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('.theme').onclick=function(){const dark=document.body.classList.toggle('dark');this.textContent=dark?'切换浅色背景':'切换深色背景';this.setAttribute('aria-pressed',String(dark))};
</script></body></html>
