<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f0b27a" />
  <title>暮色滑翔</title>
  <link rel="stylesheet" href="../result-share.css" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <main id="game" class="game" aria-label="暮色滑翔，横版 3D 滑翔游戏">
    <canvas id="scene" aria-label="暮色滑翔画面。按住屏幕让纸鸟变重，顺着下坡俯冲；松开让它顺着上坡飞起。电脑可按住空格或鼠标。"></canvas>

    <header class="hud" id="hud" hidden>
      <div class="score-block"><strong id="score">0</strong><span><b id="distance">0</b> 米</span></div>
      <div class="daylight" id="daylight" role="progressbar" aria-label="余晖" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60">
        <span class="daylight-track"><span class="daylight-fill" id="daylightFill"></span><i class="daylight-sun" id="daylightSun"></i></span>
        <small id="daylightLabel">余晖</small>
      </div>
      <div class="hud-actions">
        <button class="icon-button" id="flipButton" type="button" aria-label="切换横持方向" title="换一边横持" hidden><svg viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 12-3l2 2m0-5v5h-5M19 15a7 7 0 0 1-12 3l-2-2m0 5v-5h5" /></svg></button>
        <button class="icon-button" id="soundButton" type="button" aria-label="开启声音" aria-pressed="false" title="声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z" /><path id="soundWaves" d="m16 9 5 6m0-6-5 6" /></svg></button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="进入全屏" title="全屏"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5" /></svg></button>
        <button class="icon-button" id="pauseButton" type="button" aria-label="暂停" title="暂停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></svg></button>
      </div>
    </header>

    <div class="chain" id="chain" aria-live="off" hidden><strong id="chainCount">0</strong><span id="chainLabel">连续完美</span></div>
    <div class="callout" id="callout" aria-live="polite" hidden><strong id="calloutTitle"></strong><span id="calloutPoints"></span></div>
    <div class="island-title" id="islandTitle" aria-live="polite" hidden><small id="islandSub"></small><strong id="islandName"></strong><span id="islandBonus"></span></div>
    <div class="prompt" id="prompt" role="status" aria-live="polite" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="hold-ring" id="holdRing" aria-hidden="true"></div>

    <section id="welcome" class="overlay welcome" aria-labelledby="welcomeTitle">
      <button class="welcome-exit icon-button" id="welcomeExit" type="button" aria-label="返回游戏广场"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6" /></svg></button>
      <button class="welcome-flip icon-button" id="welcomeFlip" type="button" aria-label="切换横持方向" title="换一边横持" hidden><svg viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 12-3l2 2m0-5v5h-5M19 15a7 7 0 0 1-12 3l-2-2m0 5v-5h5" /></svg></button>
      <div class="welcome-card">
        <p class="welcome-kicker">一只纸鸟 · 一片群岛 · 一场日落</p>
        <h1 id="welcomeTitle">暮色滑翔</h1>
        <p class="welcome-description">按住，顺着下坡俯冲；松开，借上坡飞向天空。<br>在太阳落进海里之前，飞到更远的岛。</p>
        <div class="welcome-actions">
          <button id="startButton" class="primary-button" type="button">起飞 <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></svg></button>
          <button id="welcomeSound" class="text-toggle" type="button" aria-pressed="false">声音 · 关</button>
        </div>
        <p class="welcome-foot"><span class="touch-copy">任意位置按住 = 俯冲 · 松开 = 滑翔</span><span class="desktop-copy">按住空格 / ↓ / 鼠标 = 俯冲 · 松开 = 滑翔 · P 暂停</span></p>
      </div>
    </section>

    <section id="pauseOverlay" class="overlay scrim" role="dialog" aria-modal="true" aria-labelledby="pauseTitle" hidden>
      <div class="dialog-card"><h2 id="pauseTitle">落在云上歇一歇</h2><p id="pauseDescription">太阳也替你停住了，随时可以接着飞。</p><button id="resumeButton" class="primary-button" type="button">继续 <span aria-hidden="true">→</span></button><button id="pauseExit" class="text-button" type="button">返回游戏广场</button></div>
    </section>

    <section id="resultOverlay" class="overlay scrim" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
      <div class="dialog-card result-card">
        <span class="result-badge" id="resultBadge">夜色降临</span>
        <h2 id="resultTitle">纸鸟归巢</h2>
        <p id="resultDescription"></p>
        <div class="result-score"><strong id="resultScore">0</strong><span>本局积分</span></div>
        <div class="result-stats">
          <div><b id="resultPerfects">0</b><span>完美落地</span></div>
          <div><b id="resultChain">0</b><span>最长连击</span></div>
          <div><b id="resultIslands">1</b><span>抵达岛屿</span></div>
          <div><b id="resultDistance">0</b><span>飞行米数</span></div>
        </div>
        <p id="resultBonus" class="result-bonus"></p>
        <p id="bestLabel" class="best-label"></p>
        <button id="shareResultButton" class="result-share-button" type="button" hidden>分享战绩 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7m-8 0h8v8" /></svg></button>
        <div class="result-actions"><button id="restartButton" class="primary-button" type="button">再飞一次</button></div>
        <button id="resultExit" class="text-button" type="button">返回游戏广场</button>
      </div>
    </section>

    <div class="fallback" id="fallback" hidden><p>这台设备暂时打不开 3D 画面（WebGL 不可用）。</p><button id="fallbackExit" class="primary-button" type="button">返回游戏广场</button></div>
  </main>
  <script src="viewport.js"></script>
  <script src="rules.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="world.js"></script>
  <script src="props.js"></script>
  <script src="bird.js"></script>
  <script src="audio.js"></script>
  <script src="../result-share.js"></script>
  <script src="game.js"></script>
</body>
</html>
