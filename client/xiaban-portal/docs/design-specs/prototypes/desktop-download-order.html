<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小伴桌面独立下载页 · 设计预览</title>
  <style>
    html, body { height: 100%; margin: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="desktop-preview" title="小伴桌面独立下载页预览"></iframe>
  <script>
    const preview = document.getElementById('desktop-preview');

    function showDesktopCase() {
      if (location.hash === '#desktop-case') {
        preview.contentDocument?.querySelector('.live-stage-card')?.scrollIntoView({ block: 'center', behavior: 'instant' });
      }
    }

    preview.addEventListener('load', showDesktopCase);
    window.addEventListener('hashchange', showDesktopCase);
    preview.src = '/desktop';
  </script>
</body>
</html>
