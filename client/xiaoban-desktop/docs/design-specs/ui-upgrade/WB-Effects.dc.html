<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小伴桌面 · 装扮 / 特效</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
.si{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;color:#26262B;font-size:14px;border:0;background:transparent;font-family:inherit;width:100%;box-sizing:border-box;cursor:pointer;text-align:left}
.si:hover{background:rgba(0,0,0,.045)}
.si svg{flex-shrink:0;color:#4A4A50}
.sub{font-size:12px;color:#6E6E73}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#55555A;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(0,0,0,.05)}
.tt{border:0;background:transparent;font-family:inherit;font-size:20px;font-weight:600;color:#A1A1A6;cursor:pointer;padding:0}
.bb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:0;font-family:inherit;font-size:13px;cursor:pointer;color:#1D1D1F;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 1.5px rgba(0,0,0,.05)}
.pb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:9px;border:0;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18)}
.ec{display:flex;flex-direction:column;gap:8px;border:0;background:transparent;padding:0;font-family:inherit;text-align:left;cursor:pointer;color:inherit}
.ec .pv{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.06)}
.ec b{font-size:13.5px;font-weight:500;padding:0 2px}
.kv{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid rgba(0,0,0,.06)}
.kv .h{display:flex;justify-content:space-between;font-size:13px}
.kv .h span:last-child{color:#6E6E73;font-variant-numeric:tabular-nums}
.tg{width:38px;height:22px;border-radius:999px;position:relative;display:inline-block;flex-shrink:0}
.tg::after{content:"";position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on::after{left:18px}.tg.off{background:#E3E3E7}.tg.off::after{left:2px}
input[type=range]{width:100%;margin:0;height:18px}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;display:flex;font-family:-apple-system,'SF Pro Text','PingFang SC','Noto Sans SC','Microsoft YaHei UI',sans-serif;color:#1D1D1F;background:{{t.tint}};-webkit-font-smoothing:antialiased">

  <aside style="width:264px;flex-shrink:0;display:flex;flex-direction:column;padding:0 12px 12px;box-sizing:border-box">
    <div style="height:52px;display:flex;align-items:center;gap:8px;padding-left:6px">
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <button type="button" class="ib" aria-label="收起侧栏" style="margin-left:auto"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
      <button type="button" class="ib" aria-label="搜索"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 6px 16px">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,{{t.btnHi}},{{t.btn}});color:#fff;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.12)">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.25"><strong style="font-size: 15px; font-weight: 600">小伴桌面</strong></div>
    </div>
    <nav aria-label="功能分区" style="display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:hidden">
      <a class="si" href="WB-New.dc.html" aria-expanded="false" style="font-weight:600">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
        小伴 AI
        <span style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:{{t.dot}}"></span>
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round" style="transform:rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <div style="height:1px;background:rgba(0,0,0,.06);margin:8px 10px"></div>
      <a class="si" href="WB-Studio.dc.html" aria-current="page" style="background:{{t.soft}};color:{{t.ink}};font-weight:500"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2.5a2 2 0 0 0-1.5 3.3A2 2 0 0 1 12 22z"></path><circle cx="7.5" cy="10.5" r="1" fill="currentColor"></circle><circle cx="12" cy="7" r="1" fill="currentColor"></circle><circle cx="16.5" cy="10.5" r="1" fill="currentColor"></circle></svg>装扮</a>
      <a class="si" href="#"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r=".7" fill="currentColor"></circle><circle cx="18" cy="13.5" r=".7" fill="currentColor"></circle></svg>游玩</a>
      <a class="si" href="WB-Remind.dc.html"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>提醒<span class="sub" style="margin-left:auto">15:30</span></a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid rgba(0,0,0,.06)">
      <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);display:grid;place-items:center"><img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="width:26px;height:26px;object-fit:contain"></div>
      <span style="font-size:13px;font-weight:500">小伴用户</span>
      <button type="button" class="ib" aria-label="通知" style="margin-left:auto"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
    </div>
  </aside>

  <main style="flex:1;min-width:0;margin:8px 8px 8px 0;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden;padding:22px 0 0 28px;box-sizing:border-box">
    <header style="display:flex;align-items:center;gap:22px;padding-right:28px">
      <div role="tablist" aria-label="装扮类型" style="display:flex;gap:22px">
        <a role="tab" aria-selected="false" class="tt" href="WB-Studio.dc.html">壁纸</a>
        <button type="button" role="tab" aria-selected="true" class="tt" style="color:#1D1D1F">特效</button>
        <a role="tab" aria-selected="false" class="tt" href="WB-Widgets.dc.html">组件</a>
        <a role="tab" aria-selected="false" class="tt" href="WB-Pets.dc.html">伙伴</a>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <button type="button" class="bb"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>导入</button>
        <button type="button" class="pb" style="background:linear-gradient({{t.btnHi}},{{t.btn}})"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path></svg>让小伴创作</button>
      </div>
    </header>

    <div style="flex:1;min-height:0;display:flex;margin-top:18px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;padding-right:24px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:inline-flex;padding:2px;border-radius:8px;background:#F2F2F4">
            <button type="button" style="height:26px;padding:0 12px;border:0;border-radius:6px;background:#fff;font-family:inherit;font-size:12.5px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer">官方 12</button>
            <button type="button" style="height:26px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-family:inherit;font-size:12.5px;color:#55555A;cursor:pointer">我的 0</button>
          </div>
          <span class="sub" style="margin-left:auto">特效叠在任何壁纸之上，点一下立即生效</span>
        </div>
        <div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 14px">
          <button type="button" class="ec" aria-pressed="false">
            <div class="pv" style="background:#F4F4F6;display:grid;place-items:center;color:#A1A1A6"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path></svg></div>
            <b>无特效</b>
          </button>
          <sc-for list="{{effects}}" as="e" hint-placeholder-count="8">
            <button type="button" class="ec" aria-pressed="{{e.pressed}}" onClick="{{e.pick}}">
              <div class="pv" style="background:{{e.bg}};outline:{{e.ring}};outline-offset:2px">
                <sc-if value="{{e.on}}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:8px;left:8px;height:20px;padding:0 7px;border-radius:6px;background:{{t.btn}};color:#fff;font-size:11px;font-weight:500;display:inline-flex;align-items:center">使用中</span></sc-if>
              </div>
              <b>{{e.name}}</b>
            </button>
          </sc-for>
        </div>
      </div>

      <aside aria-label="特效设置" style="width:300px;flex-shrink:0;border-left:1px solid rgba(0,0,0,.07);padding:0 22px 20px;box-sizing:border-box;display:flex;flex-direction:column">
        <div style="position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:{{cur.bg}};box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.1)">
          <img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="position:absolute;right:12px;bottom:6px;width:58px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))">
        </div>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:16px;font-weight:600">{{cur.name}}</span>
          <span class="sub" style="line-height:1.55">{{cur.desc}}</span>
        </div>
        <div style="margin-top:14px">
          <div class="kv"><div class="h"><span>数量</span><span>适中</span></div><input type="range" min="0" max="100" value="55" aria-label="数量" style="accent-color:{{t.btn}}"></div>
          <div class="kv"><div class="h"><span>速度</span><span>慢</span></div><input type="range" min="0" max="100" value="30" aria-label="速度" style="accent-color:{{t.btn}}"></div>
          <div class="kv" style="flex-direction:row;align-items:center"><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:13px">伙伴跟着做表情</span><span class="sub" style="font-size:11.5px">只换表情，不弹窗、不出声</span></div><span class="tg on" role="switch" aria-checked="true" aria-label="伙伴跟着做表情" style="background:{{t.btn}}"></span></div>
          <div class="kv" style="flex-direction:row;align-items:center"><span style="flex:1;font-size:13px">全屏应用时暂停</span><span class="tg on" role="switch" aria-checked="true" aria-label="全屏应用时暂停" style="background:{{t.btn}}"></span></div>
        </div>
        <div style="margin-top:auto;display:flex;gap:8px">
          <button type="button" class="bb" style="flex:1;justify-content:center">恢复默认</button>
          <button type="button" class="bb" style="flex:1;justify-content:center">基于它创作</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"red"},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
};
const dots = (c, s, w, h, x, y) => 'radial-gradient(circle, ' + c + ' 0 ' + s + 'px, transparent ' + (s + 1) + 'px) ' + x + 'px ' + y + 'px / ' + w + 'px ' + h + 'px';
const EFFECTS = [
  { id: 'lanterns', name: '灯火阑珊', desc: '暖黄的孔明灯一盏盏升上夜空，火光轻轻摇曳', bg: [dots('#FFC46B', 3, 52, 44, 0, 0), dots('rgba(255,170,90,.8)', 2, 37, 31, 14, 9), 'linear-gradient(#1A1E3D, #4A2F50 65%, #C77A4C)'].join(',') },
  { id: 'maple', name: '层林尽染', desc: '枫叶随风打着旋，近处的叶子更大', bg: [dots('#D9512A', 4, 48, 40, 6, 4), dots('#F2A23A', 3, 33, 29, 18, 12), 'linear-gradient(#F7DDB0, #E8A56A)'].join(',') },
  { id: 'galaxy', name: '星汉灿烂', desc: '一道星河斜斜横过夜空，星云淡淡发光', bg: [dots('rgba(255,255,255,.9)', 1, 17, 15, 0, 0), 'linear-gradient(125deg, transparent 32%, rgba(205,190,255,.4) 50%, transparent 68%)', 'linear-gradient(#0E1030, #2B1E4E)'].join(',') },
  { id: 'butterfly', name: '庄周梦蝶', desc: '薄雾如梦，青碧与月白的蝴蝶翩翩飞过', bg: [dots('rgba(170,235,235,.95)', 3, 46, 40, 4, 8), dots('rgba(255,255,255,.7)', 2, 31, 27, 16, 2), 'linear-gradient(#1E3B44, #7FB3AE 78%, #E5E1C6)'].join(',') },
  { id: 'fireworks', name: '火树银花', desc: '牡丹、菊花、金柳与银花轮番升空绽放', bg: ['radial-gradient(circle at 50% 38%, transparent 20px, rgba(255,210,130,.85) 21px 22px, transparent 23px)', 'radial-gradient(circle at 50% 38%, transparent 34px, rgba(255,150,170,.6) 35px 36px, transparent 37px)', dots('rgba(255,230,180,.8)', 1, 21, 19, 0, 0), 'linear-gradient(#11142E, #2A2140)'].join(',') },
  { id: 'snow', name: '银装素裹', desc: '安静的雪，近处有虚化的大雪花', bg: [dots('#fff', 3, 44, 38, 0, 0), dots('rgba(255,255,255,.75)', 1.5, 23, 21, 9, 5), 'linear-gradient(#8DA1C2, #CBD5E6)'].join(',') },
  { id: 'rain', name: '和风细雨', desc: '细雨斜斜落下，随风轻摆', bg: ['repeating-linear-gradient(104deg, rgba(255,255,255,.35) 0 1px, transparent 1px 10px)', 'linear-gradient(#5C6A7E, #9BA7B6)'].join(',') },
  { id: 'fireflies', name: '萤火之光', desc: '夜里提着小灯笼慢慢飞的萤火虫', bg: ['radial-gradient(circle, #E9FF8C 0 2px, rgba(220,255,120,.35) 3px, transparent 8px) 0 0 / 40px 34px', 'linear-gradient(#0D1F1A, #22422F)'].join(',') },
  { id: 'petals', name: '落樱缤纷', desc: '樱花瓣与整朵樱花翻转着慢慢落下', bg: [dots('#F4A3BD', 3.5, 46, 38, 0, 6), dots('#FAC9D8', 2.5, 29, 27, 12, 0), 'linear-gradient(#FCEBF0, #E5F1E2)'].join(',') },
  { id: 'meteors', name: '流星赶月', desc: '每隔几秒划过一颗流星', bg: ['linear-gradient(152deg, transparent 46%, rgba(255,255,255,.85) 49.6%, transparent 50%)', dots('rgba(255,255,255,.8)', 1, 23, 19, 0, 0), 'linear-gradient(#0F1838, #263662)'].join(',') },
  { id: 'stars', name: '星罗棋布', desc: '满天繁星，一闪一闪地眨眼', bg: [dots('#fff', 1.5, 27, 23, 0, 0), dots('rgba(255,255,255,.6)', 1, 15, 13, 7, 5), 'linear-gradient(#0B1026, #1F2652)'].join(',') },
  { id: 'aurora', name: '流光溢彩', desc: '绿紫色的光幕在星空下缓缓飘动、明灭', bg: ['linear-gradient(168deg, transparent 18%, rgba(80,240,170,.55) 36%, rgba(150,110,255,.45) 52%, transparent 68%)', dots('rgba(255,255,255,.7)', 1, 21, 17, 0, 0), 'linear-gradient(#07121F, #133246)'].join(',') }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: 'lanterns' }; }
  renderVals() {
    const t = PALETTES[this.props.theme ?? 'red'] ?? PALETTES.red;
    const cur = EFFECTS.find((e) => e.id === this.state.cur) ?? EFFECTS[0];
    const effects = EFFECTS.map((e) => ({
      ...e,
      on: e.id === cur.id,
      pressed: e.id === cur.id ? 'true' : 'false',
      ring: e.id === cur.id ? '2px solid ' + t.btn : '2px solid transparent',
      pick: () => this.setState({ cur: e.id })
    }));
    return { t, effects, cur };
  }
}
</script>
</body>
</html>
