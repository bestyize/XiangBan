<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>超级小伴 · 胶囊</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.orb{display:grid;place-items:center;border-radius:50%;background:var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 5px rgba(0,0,0,.12)}
.orb .mark{display:block}
.wave{display:flex;align-items:center;gap:2px;height:16px}
.wave i{display:block;width:2.5px;height:7px;border-radius:2px;background:#fff;animation:bar 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s;height:12px}.wave i:nth-child(3){animation-delay:.3s;height:15px}.wave i:nth-child(4){animation-delay:.45s;height:9px}
@keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.wave i{animation:none}}
.scene{position:absolute;width:640px;height:400px;overflow:hidden;box-sizing:border-box}
.tag{position:absolute;left:28px;top:24px;font-size:12px;font-weight:600;color:#3A3A3F}
.tag span{font-weight:400;color:#5E5E63;margin-left:8px}
.dark .tag{color:#D8D8DD}.dark .tag span{color:#A1A1A8}
.capsule{width:480px;box-sizing:border-box;border-radius:26px;background:rgba(255,255,255,.9);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.95);padding:8px;display:flex;flex-direction:column;gap:6px}
.dark .capsule{background:rgba(42,43,48,.9);box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.row{display:flex;align-items:flex-end;gap:2px}
.orbbtn{width:36px;height:36px;border:0;padding:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.field{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;line-height:20px;padding:8px 6px;color:#1D1D1F;resize:none}
.field::placeholder{color:#8A8A8F}
.dark .field{color:#F2F2F4}.dark .field::placeholder{color:#8E8E93}
.ib{width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:#5A5A60;display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-bottom:2px}
.ib:hover,.ib.on{background:rgba(0,0,0,.06);color:#1D1D1F}
.dark .ib{color:#B4B4BA}.dark .ib:hover,.dark .ib.on{background:rgba(255,255,255,.08);color:#F2F2F4}
.send{width:32px;height:32px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin:0 2px 2px 4px;color:#fff}
.send:disabled{background:#E5E5EA;color:#AEAEB2;box-shadow:none;cursor:default}
.dark .send:disabled{background:rgba(255,255,255,.08);color:#6E6E73}
.chips{display:flex;gap:8px;margin-bottom:10px;padding-left:4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:15px;background:rgba(255,255,255,.86);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.08);font:inherit;font-size:12.5px;color:#2C2C30;cursor:pointer}
.chip svg{color:#5A5A60}
.dark .chip{background:rgba(42,43,48,.9);box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.35);color:#E5E5EA}
.dark .chip svg{color:#AEAEB2}
.menu{position:absolute;width:212px;padding:5px;border-radius:12px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 36px rgba(0,0,0,.18);font-size:13px;color:#1D1D1F;box-sizing:border-box}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 9px;border:0;border-radius:7px;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;box-sizing:border-box}
.mi:hover{background:rgba(0,0,0,.05)}
.mi svg{color:#55555A;flex-shrink:0}
.mi kbd{margin-left:auto;font:11.5px -apple-system,'SF Pro Text',sans-serif;color:#8E8E93}
.tray{display:flex;gap:6px;padding:2px 4px 0}
.thumb{position:relative;width:56px;height:42px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.14)}
.fchip{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px 0 10px;border-radius:9px;background:#F2F2F4;font-size:12px;color:#3A3A3F;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.fchip small{display:block;font-size:11px;color:#6E6E73}
.x{position:absolute;top:3px;right:3px;width:16px;height:16px;border:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;padding:0;cursor:pointer}
.status{margin-top:8px;padding-left:14px;font-size:12px;color:#5E5E63;display:flex;align-items:center;gap:6px}
.dark .status{color:#A1A1A8}
</style>
</helmet>
<div style="--acc:{{t.btn}};position:relative;width:1280px;height:800px;overflow:hidden;font-family:-apple-system,'SF Pro Text','PingFang SC','Noto Sans SC','Microsoft YaHei UI',sans-serif;color:#1D1D1F;background:#DCE3EA;-webkit-font-smoothing:antialiased">

  <!-- A 刚唤起 -->
  <section class="scene" style="left:0;top:0;background:linear-gradient(180deg,#DCE3EA,#E7E3DD)">
    <div class="tag">刚唤起<span>左边的球 = 录音（文字留在输入框），发送键左边 = 实时对话</span></div>
    <div style="position:absolute;left:80px;bottom:56px">
      <div class="chips">
        <button class="chip" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>总结剪贴板</button>
        <button class="chip" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>继续「周报整理」</button>
      </div>
      <div class="capsule">
        <div class="row">
          <button class="orbbtn" type="button" aria-label="点击开始录音"><span class="orb" style="width:30px;height:30px"><svg class="mark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="#fff" d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path class="tw" d="M20 2v4M22 4h-4"></path><circle class="tw2" cx="4" cy="20" r="2"></circle></svg></span></button>
          <input class="field" type="text" aria-label="向小伴提问" placeholder="问小伴，点球录音，或按住空格说话…">
          <button class="ib" type="button" aria-label="添加附件" title="添加附件"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
          <button class="ib" type="button" aria-label="截图提问" title="截图提问 ⌥⇧A"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1"></path></svg></button>
          <span style="position:relative;display:flex;flex-shrink:0"><a class="ib" href="WB-Assistant-Voice.dc.html" aria-label="实时对话" title="实时对话" style="color:{{t.ink}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg></a><span role="tooltip" style="position:absolute;right:-60px;bottom:44px;width:208px;padding:8px 10px;border-radius:9px;background:#1D1D1F;color:#fff;font-size:12px;line-height:1.55;box-shadow:0 8px 20px rgba(0,0,0,.2)">实时对话：像打电话一样和小伴说，随时可以打断</span></span>
          <button class="send" type="button" aria-label="发送" disabled=""><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
        </div>
      </div>
    </div>
  </section>

  <!-- B 输入中 + 附件菜单 -->
  <section class="scene" style="left:640px;top:0;background:linear-gradient(180deg,#DCE3EA,#E7E3DD);box-shadow:inset 1px 0 0 rgba(0,0,0,.06)">
    <div class="tag">输入中 · 打开＋菜单<span>多行自动长高，最多 4 行</span></div>
    <div style="position:absolute;left:80px;bottom:40px">
      <div class="menu" role="menu" aria-label="添加附件" style="right:52px;bottom:calc(100% + 8px)">
        <button class="mi" type="button" role="menuitem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l8.6-8.6a4 4 0 0 1 5.7 5.7l-8.6 8.6a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg>选择文件…</button>
        <button class="mi" type="button" role="menuitem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path></svg>粘贴图片<kbd>⌘V</kbd></button>
        <button class="mi" type="button" role="menuitem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path></svg>从资料库选择</button>
      </div>
      <div class="capsule">
        <div class="tray">
          <div class="thumb" style="background:linear-gradient(135deg,#F4F6F9 0%,#E2E8EF 100%)">
            <div style="position:absolute;left:7px;top:8px;width:28px;height:4px;border-radius:2px;background:#C7CED6"></div>
            <div style="position:absolute;left:7px;top:16px;width:40px;height:4px;border-radius:2px;background:#D5DBE2"></div>
            <div style="position:absolute;left:7px;top:24px;width:20px;height:10px;border-radius:2px;background:{{t.soft}}"></div>
            <button class="x" type="button" aria-label="移除截图"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div class="fchip" style="position:relative;padding-right:28px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg><div>会议纪要.docx<small>86 KB</small></div><button class="x" type="button" aria-label="移除会议纪要.docx" style="top:13px;right:6px"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
        </div>
        <div class="row">
          <button class="orbbtn" type="button" aria-label="点击开始录音"><span class="orb" style="width:30px;height:30px"><svg class="mark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="#fff" d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path class="tw" d="M20 2v4M22 4h-4"></path><circle class="tw2" cx="4" cy="20" r="2"></circle></svg></span></button>
          <textarea class="field" rows="2" aria-label="向小伴提问">结合截图里的数据和这份纪要，帮我写一段 200 字以内的周会总结，语气正式一点</textarea>
          <button class="ib on" type="button" aria-label="添加附件" aria-expanded="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
          <button class="ib" type="button" aria-label="截图提问"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1"></path></svg></button>
          <button class="send" type="button" aria-label="发送" style="background:linear-gradient({{t.btnHi}},{{t.btn}});box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
        </div>
      </div>
    </div>
  </section>

  <!-- C 聆听 -->
  <section class="scene" style="left:0;top:400px;background:linear-gradient(180deg,#E3E0DA,#DDE2E7);box-shadow:inset 0 1px 0 rgba(0,0,0,.06)">
    <div class="tag">录音中<span>点品牌标志开始，再点一下结束 · 文字留在输入框，由你发送</span></div>
    <div style="position:absolute;left:80px;bottom:52px">
      <div class="capsule" style="box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 0 0 4px {{t.soft}},0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.95)">
        <div class="row" style="align-items:center">
          <button class="orbbtn" type="button" aria-label="结束录音" style="box-shadow:0 0 0 4px {{t.soft}}"><span class="orb" style="width:32px;height:32px"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></span></button>
          <div class="field" style="color:#1D1D1F">帮我把下午三点的评审改到明天<span style="color:#8A8A8F">上午…</span></div>
          <svg width="44" height="20" viewBox="0 0 44 20" aria-hidden="true" style="flex-shrink:0;margin-right:6px"><g fill="{{t.btn}}"><rect x="0" y="8" width="3" height="4" rx="1.5"></rect><rect x="6" y="5" width="3" height="10" rx="1.5"></rect><rect x="12" y="2" width="3" height="16" rx="1.5"></rect><rect x="18" y="6" width="3" height="8" rx="1.5"></rect><rect x="24" y="3" width="3" height="14" rx="1.5"></rect><rect x="30" y="7" width="3" height="6" rx="1.5"></rect><rect x="36" y="8" width="3" height="4" rx="1.5"></rect></g></svg>
          <button class="send" type="button" aria-label="发送" style="margin-bottom:0;background:linear-gradient({{t.btnHi}},{{t.btn}});box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
        </div>
      </div>
      <div class="status"><span style="width:6px;height:6px;border-radius:50%;background:{{t.dot}}"></span>正在录音 · 再点一下球结束，确认文字后按发送（按住空格说话则松手即发）</div>
    </div>
  </section>

  <!-- D 深色 -->
  <section class="scene dark" style="left:640px;top:400px;background:linear-gradient(180deg,#1E2026,#26232A)">
    <div class="tag">深色 · 生成中<span>发送键变为停止，其他按钮照常可用</span></div>
    <div style="position:absolute;left:80px;bottom:56px">
      <div class="chips">
        <button class="chip" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>总结剪贴板</button>
      </div>
      <div class="capsule">
        <div class="row">
          <button class="orbbtn" type="button" aria-label="点击开始录音"><span class="orb" style="width:30px;height:30px"><svg class="mark" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="#fff" d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path class="tw" d="M20 2v4M22 4h-4"></path><circle class="tw2" cx="4" cy="20" r="2"></circle></svg></span></button>
          <input class="field" type="text" aria-label="向小伴提问" placeholder="小伴正在回答，可以继续输入…">
          <button class="ib" type="button" aria-label="添加附件"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
          <button class="ib" type="button" aria-label="截图提问"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 3a2 2 0 0 0-2 2M19 3a2 2 0 0 1 2 2M21 19a2 2 0 0 1-2 2M5 21a2 2 0 0 1-2-2M9 3h1M9 21h1M14 3h1M14 21h1M3 9v1M21 9v1M3 14v1M21 14v1"></path></svg></button>
          <button class="send" type="button" aria-label="停止回答" style="background:rgba(255,255,255,.14);color:#F2F2F4"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"></rect></svg></button>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"red"},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
