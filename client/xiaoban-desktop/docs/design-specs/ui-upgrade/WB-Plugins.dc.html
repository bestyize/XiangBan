            </div>
            <div style="display:flex;align-items:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.055)">
              <sc-for list="{{e.tags}}" as="g" hint-placeholder-count="2"><span class="tag">{{g}}</span></sc-for>
              <span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#6E6E73;margin-left:4px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path></svg>{{e.skills}} 个技能</span>
