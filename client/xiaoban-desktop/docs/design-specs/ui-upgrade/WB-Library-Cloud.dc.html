<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"red"},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
};
const chipsOf = (t, list, current, pick) => list.map((c) => ({ label: c, pressed: c === current ? 'true' : 'false', bg: c === current ? t.soft : 'transparent', color: c === current ? t.ink : '#55555A', weight: c === current ? '600' : '400', pick: () => pick(c) }));
const PLAT = {
  feishu: ['飞书', '飞', '#E8F0FD', '#2F6FDB'], tencent: ['腾讯文档', '腾', '#E6F4FB', '#1A7FB8'],
  baidu: ['百度网盘', '百', '#EAF0FE', '#3D5AD6'], other: ['语雀', '语', '#E6F5EC', '#23885A']
};
const LINKS = [
  { p: 'feishu', title: '2026 Q4 OKR 对齐', kind: '文档', note: '工作 · 今天添加', readable: true },
  { p: 'feishu', title: '资料库需求评审', kind: '多维表格', note: '工作 · 昨天添加', readable: true },
  { p: 'tencent', title: '团建报名表', kind: '在线表格', note: '生活 · 10月21日添加', readable: false },
  { p: 'baidu', title: '设计素材 2026', kind: '分享文件夹 · 12 个文件', note: '提取码已保存 · 10月19日添加', readable: false },
  { p: 'tencent', title: '周会纪要合集', kind: '文档', note: '工作 · 10月16日添加', readable: false },
  { p: 'other', title: '前端规范', kind: '知识库', note: '开发 · 10月10日添加', readable: false }
];
const CHIPS = ['全部', '飞书', '腾讯文档', '百度网盘', '其他'];
const BY = { '飞书': 'feishu', '腾讯文档': 'tencent', '百度网盘': 'baidu', '其他': 'other' };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { chip: '全部', connected: true }; }
  renderVals() {
    const t = PALETTES[this.props.theme ?? 'red'] ?? PALETTES.red;
    const connected = this.state.connected;
    return {
      t,
      chips: chipsOf(t, CHIPS, this.state.chip, (c) => this.setState({ chip: c })),
      platforms: ['feishu', 'tencent', 'baidu'].map((k) => {
        const p = PLAT[k], live = k === 'feishu';
        return { name: p[0], letter: p[1], bg: p[2], ink: p[3], connected: live && connected, canConnect: live && !connected, soon: !live, connect: () => this.setState({ connected: true }) };
      }),
      links: LINKS.filter((l) => this.state.chip === '全部' || l.p === BY[this.state.chip]).map((l) => {
        const p = PLAT[l.p], readable = l.readable && connected;
        return { ...l, platform: p[0], letter: p[1], bg: p[2], ink: p[3],
          status: readable ? '小伴可读取' : '仅保存链接', stBg: readable ? '#E6F5EC' : '#F2F2F4', stInk: readable ? '#1E6A45' : '#6E6E73' };
      })
    };
  }
}
</script>
