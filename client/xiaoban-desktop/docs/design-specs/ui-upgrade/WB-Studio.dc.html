<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小伴桌面 · 装扮</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
.si{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;color:#26262B;font-size:14px;border:0;background:transparent;font-family:inherit;width:100%;box-sizing:border-box;cursor:pointer;text-align:left}
.si:hover{background:rgba(0,0,0,.045)}
.si svg{flex-shrink:0;color:#4A4A50}
.sub{font-size:12px;color:#6E6E73}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#55555A;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(0,0,0,.05)}
.tt{border:0;background:transparent;font-family:inherit;font-size:20px;font-weight:600;color:#A1A1A6;cursor:pointer;padding:0}
.bb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;border:0;font-family:inherit;font-size:13px;cursor:pointer;color:#1D1D1F;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 1px 1.5px rgba(0,0,0,.05)}
.pb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:9px;border:0;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18)}
.wc{display:flex;flex-direction:column;gap:9px}
.wc .im{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.05)}
.wc .im img{width:100%;height:100%;object-fit:cover;display:block}
.wc .nm{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.wc .nm b{font-size:14px;font-weight:500}
.lb{position:absolute;top:8px;left:8px;height:20px;padding:0 7px;border-radius:6px;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);color:#fff;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.lay{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.lay img{width:44px;height:30px;border-radius:7px;object-fit:cover}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;display:flex;font-family:-apple-system,'SF Pro Text','PingFang SC','Noto Sans SC','Microsoft YaHei UI',sans-serif;color:#1D1D1F;background:{{t.tint}};-webkit-font-smoothing:antialiased">

      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>

    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 6px 16px">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,{{t.btnHi}},{{t.btn}});color:#fff;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.12)">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>

      <a class="si" href="WB-New.dc.html" aria-expanded="false" style="font-weight:600">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
        小伴 AI
        <span style="margin-left:auto;width:7px;height:7px;border-radius:50%;background:{{t.dot}}" title="有 1 个任务等你确认"></span>
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round" style="transform:rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <div style="height:1px;background:rgba(0,0,0,.06);margin:8px 10px"></div>
      <a class="si" href="WB-Studio.dc.html" aria-current="page" style="background:{{t.soft}};color:{{t.ink}};font-weight:500"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2.5a2 2 0 0 0-1.5 3.3A2 2 0 0 1 12 22z"></path><circle cx="7.5" cy="10.5" r="1" fill="currentColor"></circle><circle cx="12" cy="7" r="1" fill="currentColor"></circle><circle cx="16.5" cy="10.5" r="1" fill="currentColor"></circle></svg>装扮</a>

      <a class="si" href="WB-Remind.dc.html"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>提醒<span class="sub" style="margin-left:auto">15:30</span></a>
    </nav>
    <div style="display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid rgba(0,0,0,.06)">
      <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);display:grid;place-items:center"><img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="width:26px;height:26px;object-fit:contain"></div>
      <span style="font-size:13px;font-weight:500">小伴用户</span>
      <button type="button" class="ib" aria-label="通知" style="margin-left:auto"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
    </div>
  </aside>

  <main style="flex:1;min-width:0;margin:8px 8px 8px 0;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden;padding:22px 28px 0;box-sizing:border-box">
    <header style="display:flex;align-items:center;gap:22px">
      <div role="tablist" aria-label="装扮类型" style="display:flex;gap:22px">
        <button type="button" role="tab" aria-selected="true" class="tt" style="color:#1D1D1F">壁纸</button>
        <a role="tab" aria-selected="false" class="tt" href="WB-Effects.dc.html">特效</a>
        <a role="tab" aria-selected="false" class="tt" href="WB-Widgets.dc.html">组件</a>
        <a role="tab" aria-selected="false" class="tt" href="WB-Pets.dc.html">伙伴</a>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <button type="button" class="bb"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"></path></svg>导入</button>
        <button type="button" class="pb" style="background:linear-gradient({{t.btnHi}},{{t.btn}})"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path></svg>让小伴创作</button>
      </div>
    </header>

    

    <div style="margin-top:20px;display:flex;align-items:center;gap:8px">
      <div style="display:inline-flex;padding:2px;border-radius:8px;background:#F2F2F4">
        <button type="button" style="height:26px;padding:0 12px;border:0;border-radius:6px;background:#fff;font-family:inherit;font-size:12.5px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer">官方</button>
        <button type="button" style="height:26px;padding:0 12px;border:0;border-radius:6px;background:transparent;font-family:inherit;font-size:12.5px;color:#55555A;cursor:pointer">我的</button>
      </div>
      <span style="width:1px;height:16px;background:rgba(0,0,0,.1);margin:0 6px"></span>
      <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:{{t.soft}};color:{{t.ink}};font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer">全部</button>
      <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:#55555A;font-family:inherit;font-size:12.5px;cursor:pointer">动画</button>
      <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:#55555A;font-family:inherit;font-size:12.5px;cursor:pointer">视频</button>
      <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:transparent;color:#55555A;font-family:inherit;font-size:12.5px;cursor:pointer">图片</button>
      <span class="sub" style="margin-left:auto">12 张</span>
    </div>

    <div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px;overflow:hidden">
      <div class="wc"><div class="im" style="box-shadow:0 0 0 2px #fff,0 0 0 4px {{t.btn}}"><img src="/_blob/174de0e6812692e8e9882d9eb7a54787" alt=""><span class="lb" style="background:{{t.btn}}">使用中</span></div><div class="nm"><b>桌面小星球</b><span class="sub">动画</span></div></div>
      <div class="wc"><div class="im"><img src="/_blob/62de8224dce5de26a04dd42139151e4e" alt="">
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,0) 55%);display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;padding:10px">
          <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);font-family:inherit;font-size:12.5px;cursor:pointer">预览</button>
          <button type="button" style="height:28px;padding:0 11px;border-radius:8px;border:0;background:linear-gradient({{t.btnHi}},{{t.btn}});color:#fff;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer">设为壁纸</button>
        </div></div><div class="nm"><b>极光之夜</b><span class="sub">动画</span></div></div>
      <div class="wc"><div class="im"><img src="/_blob/520864d00296f841ddd5c52f92ce5634" alt=""></div><div class="nm"><b>暮海</b><span class="sub">动画</span></div></div>
      <div class="wc"><div class="im"><img src="/_blob/598f7b0dac53530ade7c52a1bb53cb5e" alt=""></div><div class="nm"><b>水墨远山</b><span class="sub">动画</span></div></div>
      <div class="wc"><div class="im"><img src="/_blob/0eb6006e845bfe79325857612afaa7bd" alt=""></div><div class="nm"><b>枫叶微光</b><span class="sub">动画</span></div></div>
      <div class="wc"><div class="im"><img src="/_blob/ca297929fe27ca2572f0059d82664c76" alt=""></div><div class="nm"><b>云海</b><span class="sub">动画</span></div></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"blue"},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
};
class Component extends DCLogic {
  renderVals() {
    return { t: PALETTES[this.props.theme ?? 'blue'] ?? PALETTES.blue };
  }
}
</script>
