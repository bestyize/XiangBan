<style>
body{margin:0}

.si{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;color:#26262B;font-size:14px;border:0;background:transparent;font-family:inherit;width:100%;box-sizing:border-box;cursor:pointer;text-align:left}

.tg{width:38px;height:22px;border-radius:999px;position:relative;display:inline-block;flex-shrink:0}
.tg::after{content:"";position:absolute;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on::after{left:18px}.tg.off{background:#E3E3E7}.tg.off::after{left:2px}

        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>

      <div role="tablist" aria-label="提醒类型" style="display:flex;gap:22px">
        <button type="button" role="tab" aria-selected="true" class="tt" style="color:#1D1D1F">关怀提醒<span style="font-size:13px;font-weight:500;color:#8E8E93">4</span></button>

      </div>
      <div style="margin-left:auto;display:inline-flex;border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18);background:linear-gradient({{t.btnHi}},{{t.btn}})">

      </div>
    </header>

    <div style="margin-top:20px;display:flex;gap:20px;flex:1;min-height:0">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:22px">

          <div class="rw">
            <div class="ri" style="background:#E8F2FB;color:#1F6AA8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">喝杯水</span><span class="sub">每 90 分钟 · 工作日 09:00–18:00</span></div>
            <span style="font-size:12px;font-weight:500;color:{{t.ink}};background:{{t.soft}};padding:3px 8px;border-radius:6px">下次 15:30</span>

            <div class="ri" style="background:#EDF5E8;color:#3C7A2C"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="m8 21 3-6 3 3v3M7 12l3-3 4 1 3 3"></path></svg></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">起来走走</span><span class="sub">每 60 分钟 · 久坐后提醒</span></div>
            <span class="sub">16:00</span>
            <span class="tg on" role="switch" aria-checked="true" aria-label="起来走走" style="background:{{t.btn}}"></span>
          </div>
          <div class="rw">
            <div class="ri" style="background:#FFF2E2;color:#A65A0A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500">早安天气</span><span class="sub">每天 08:00 · 杭州</span></div>
            <span class="sub">明天 08:00</span>
            <span class="tg on" role="switch" aria-checked="true" aria-label="早安天气" style="background:{{t.btn}}"></span>
          </div>
          <div class="rw">
            <div class="ri" style="background:#F1EEFB;color:#5E43B8"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:500;color:#6E6E73">下班啦</span><span class="sub">工作日 18:30</span></div>
            <span class="sub">已暂停</span>
            <span class="tg off" role="switch" aria-checked="false" aria-label="下班啦"></span>
          </div>
        </section>

        <section aria-label="试试这些">
          <div style="font-size:13px;font-weight:600;margin-bottom:10px">试试这些</div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
            <div class="tpl"><b><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#55555A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>每周五写周报</b><span>周五 17:00 让小伴汇总本周对话和文件</span></div>

        <div class="rw" style="padding:10px 16px"><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:13px">免打扰</span><span class="sub" style="font-size:11.5px">22:00 – 08:00，期间提醒顺延</span></div><span class="tg on" role="switch" aria-checked="true" aria-label="免打扰" style="background:{{t.btn}}"></span></div>
        <div style="padding:12px 16px;border-top:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px">
          <img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="width:52px">
          <div style="position:relative;padding:8px 12px;border-radius:12px;background:#F4F4F6;font-size:12.5px;line-height:1.5">该喝水啦，起来伸个懒腰吧～</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"purple"},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
};
class Component extends DCLogic {
  renderVals() {
    return { t: PALETTES[this.props.theme ?? 'purple'] ?? PALETTES.purple };
  }
}
</script>
