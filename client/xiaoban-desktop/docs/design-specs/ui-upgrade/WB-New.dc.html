<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小伴桌面 · 新建任务</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none;color:inherit}
.si{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:8px;color:#26262B;font-size:14px;border:0;background:transparent;font-family:inherit;width:100%;box-sizing:border-box;cursor:pointer;text-align:left}
.si:hover{background:rgba(0,0,0,.045)}
.si svg{flex-shrink:0;color:#4A4A50}
.sub{font-size:12px;color:#6E6E73}
.cap{font-size:12px;color:#6E6E73;font-weight:500}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:#55555A;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(0,0,0,.05)}
.chip{height:32px;padding:0 14px;border-radius:999px;border:0;background:#fff;font-family:inherit;font-size:13px;color:#2C2C31;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04)}
.chip:hover{box-shadow:0 0 0 1px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06)}
.sug{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:0;background:transparent;font-family:inherit;font-size:13.5px;color:#2C2C31;cursor:pointer}
.sug:hover{background:#F4F4F6}
.sug svg{color:#8E8E93}
.pop{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 9px;border-radius:8px;border:0;background:transparent;font-family:inherit;font-size:12.5px;color:#4A4A50;cursor:pointer}
.pop:hover{background:#F2F2F4}
.sw{width:18px;height:18px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ses{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 36px;border-radius:8px;font-size:13px;color:#3A3A40}
.ses:hover{background:rgba(0,0,0,.045)}
.ses span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div style="position:relative;width:1280px;height:800px;overflow:hidden;display:flex;font-family:-apple-system,'SF Pro Text','PingFang SC','Noto Sans SC','Microsoft YaHei UI',sans-serif;color:#1D1D1F;background:{{t.tint}};-webkit-font-smoothing:antialiased">

  <aside style="width:264px;flex-shrink:0;display:flex;flex-direction:column;padding:0 12px 12px;box-sizing:border-box">
    <div style="height:52px;display:flex;align-items:center;gap:8px;padding-left:6px">
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#FF5F57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <span aria-hidden="true" style="width:12px;height:12px;border-radius:50%;background:#28C840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)"></span>
      <button type="button" class="ib" aria-label="收起侧栏" style="margin-left:auto"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg></button>
      <button type="button" class="ib" aria-label="搜索"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 6px 16px">
      <div style="width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,{{t.btnHi}},{{t.btn}});color:#fff;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.12)">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1.25"><strong style="font-size: 15px; font-weight: 600">小伴桌面</strong></div>
    </div>

    <nav aria-label="功能分区" style="display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;overflow:hidden">
      <button type="button" class="si" aria-expanded="{{aiOpenAttr}}" onClick="{{toggleAi}}" style="font-weight:600">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"></path><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
        小伴 AI
        <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round" style="margin-left:auto;transform:{{aiChevron}};transition:transform 160ms"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <sc-if value="{{aiOpen}}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:1px;padding-left:10px">
          <a class="si" href="WB-New.dc.html" aria-current="page" style="background:{{t.soft}};color:{{t.ink}};font-weight:500"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"></path><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg>新建任务<span class="sub" style="margin-left:auto;font-size:11px">⌘N</span></a>
          <a class="si" href="WB-Plugins.dc.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19.4 13a2 2 0 1 0 0-4H18V6a2 2 0 0 0-2-2h-3V2.6a2 2 0 1 0-4 0V4H6a2 2 0 0 0-2 2v3h1.4a2 2 0 1 1 0 4H4v3a2 2 0 0 0 2 2h3v-1.4a2 2 0 1 1 4 0V18h3a2 2 0 0 0 2-2v-3z"></path></svg>AI 插件</a>
          <a class="si" href="#"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2z"></path><path d="M22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"></path></svg>资料库</a>
          <div style="display:flex;align-items:center;height:30px;padding:0 4px 0 10px;margin-top:6px"><span class="cap">空间</span><button type="button" class="ib" aria-label="新建工作区" style="margin-left:auto;width:24px;height:24px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button></div>
          <a class="si" href="WB-Chat.dc.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path></svg>最近任务<span class="sub" style="margin-left:auto">2</span></a>
          <a class="ses" href="WB-Chat.dc.html"><span>整理下周工作计划</span><i style="width:7px;height:7px;border-radius:50%;background:{{t.dot}}"></i></a>
          <a class="ses" href="#"><span>把截图里的表格转成 Excel</span></a>
          <a class="si" href="#"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>官网改版<span class="sub" style="margin-left:auto">4</span></a>
          <a class="si" href="#"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>周报自动化<span class="sub" style="margin-left:auto">1</span></a>
        </div>
      </sc-if>
      <div style="height:1px;background:rgba(0,0,0,.06);margin:8px 10px"></div>
      <a class="si" href="WB-Studio.dc.html"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2.5a2 2 0 0 0-1.5 3.3A2 2 0 0 1 12 22z"></path><circle cx="7.5" cy="10.5" r="1" fill="currentColor"></circle><circle cx="12" cy="7" r="1" fill="currentColor"></circle><circle cx="16.5" cy="10.5" r="1" fill="currentColor"></circle></svg>装扮</a>
      <a class="si" href="#"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r=".7" fill="currentColor"></circle><circle cx="18" cy="13.5" r=".7" fill="currentColor"></circle></svg>游玩</a>
      <a class="si" href="WB-Remind.dc.html"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>提醒<span class="sub" style="margin-left:auto">15:30</span></a>
    </nav>

    <div style="display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid rgba(0,0,0,.06)">
      <div style="width:30px;height:30px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);display:grid;place-items:center"><img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="width:26px;height:26px;object-fit:contain"></div>
      <span style="font-size:13px;font-weight:500">小伴用户</span>
      <button type="button" class="ib" aria-label="通知" style="margin-left:auto"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
    </div>
  </aside>

  <main style="flex:1;min-width:0;margin:8px 8px 8px 0;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);position:relative;display:flex;flex-direction:column;align-items:center;overflow:hidden">
    <div style="position:absolute;top:14px;right:16px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05)" role="radiogroup" aria-label="主题色">
      <span class="sub" style="font-size:11.5px;margin-right:2px">主题色</span>
      <sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
        <button type="button" class="sw" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" title="{{s.name}}" onClick="{{s.pick}}" style="background:{{s.color}};outline:{{s.ring}};outline-offset:2px"></button>
      </sc-for>
    </div>

    <div style="width:100%;max-width:780px;padding:0 40px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;margin-top:128px">
      <h1 style="margin:0;font-size:30px;font-weight:600;letter-spacing:-.01em">下午好，今天让小伴帮你做点什么？</h1>
      <div role="tablist" aria-label="场景" style="margin-top:18px;display:inline-flex;padding:3px;border-radius:12px;background:#F2F2F4;gap:2px">
        <button type="button" role="tab" aria-selected="true" style="height:30px;padding:0 14px;border:0;border-radius:9px;background:#fff;font-family:inherit;font-size:13px;font-weight:500;color:#1D1D1F;box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.08);cursor:pointer">办公</button>
        <button type="button" role="tab" aria-selected="false" style="height:30px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:13px;color:#55555A;cursor:pointer">学习</button>
        <button type="button" role="tab" aria-selected="false" style="height:30px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:13px;color:#55555A;cursor:pointer">生活</button>
        <button type="button" role="tab" aria-selected="false" style="height:30px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-family:inherit;font-size:13px;color:#55555A;cursor:pointer">创作</button>
      </div>

      <div style="align-self:stretch;margin-top:44px;display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" class="chip">写文档</button>
        <button type="button" class="chip">做表格</button>
        <button type="button" class="chip">整理文件</button>
        <button type="button" class="chip">截图识别</button>
        <button type="button" class="chip">深度研究</button>
        <button type="button" class="chip">定时任务</button>
      </div>

      <div style="align-self:stretch;position:relative;margin-top:14px">
        <img src="/_blob/d590c6393f601ebec7f3e202245ef0cf" alt="" style="position:absolute;right:36px;top:-74px;width:92px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))">
        <div style="position:relative;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.03),0 12px 32px rgba(0,0,0,.07);padding:16px 14px 10px 18px">
          <textarea aria-label="描述任务" rows="3" placeholder="描述你想完成的事。@ 添加文件或网页，/ 调用插件" style="width:100%;box-sizing:border-box;border:0;outline:none;resize:none;font:inherit;font-size:15px;line-height:1.6;color:#1D1D1F;background:transparent"></textarea>
          <div style="display:flex;align-items:center;gap:2px;margin-top:4px">
            <button type="button" class="ib" aria-label="添加附件"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
            <button type="button" class="pop" aria-haspopup="listbox"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>工作区<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
            <div style="position:relative;display:flex">
              <button type="button" class="pop" aria-haspopup="menu" aria-expanded="{{perm.openAttr}}" onClick="{{perm.toggle}}" style="color:{{perm.color}};background:{{perm.bg}}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><sc-if value="{{perm.full}}" hint-placeholder-val="{{ false }}"><path d="M12 8v4M12 15.5h.01"></path></sc-if></svg>{{perm.label}}<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg></button>
              <sc-if value="{{perm.open}}" hint-placeholder-val="{{ false }}">
                <div role="menu" aria-label="权限" style="position:absolute;left:0;bottom:36px;z-index:6;width:300px;padding:5px;border-radius:12px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 36px rgba(0,0,0,.18);text-align:left">
                  <sc-for list="{{perm.items}}" as="o" hint-placeholder-count="2">
                    <button type="button" role="menuitemradio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="width:100%;display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:{{o.bg}};font-family:inherit;cursor:pointer;text-align:left">
                      <span style="width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;background:{{o.tileBg}};color:{{o.tileInk}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="{{o.mark}}"></path></svg></span>
                      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:13.5px;font-weight:500;color:{{o.ink}}">{{o.label}}</span><span style="font-size:11.5px;color:#6E6E73;line-height:1.5">{{o.desc}}</span></span>
                      <span style="width:14px;padding-top:3px;color:{{o.ink}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if></span>
                    </button>
                  </sc-for>
                  <div style="height:1px;background:rgba(0,0,0,.07);margin:4px 6px"></div>
                  <a href="WB-Settings.dc.html" style="display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;font-size:12.5px;color:#55555A">权限与沙箱设置…</a>
                </div>
              </sc-if>
            </div>
            <span style="margin-left:auto"></span>
            <div style="position:relative;display:flex">
              <button type="button" aria-label="上下文已用 {{ctx.percent}}%，点击查看" aria-expanded="{{ctx.openAttr}}" onClick="{{ctx.toggle}}" title="{{ctx.title}}" style="width:30px;height:30px;padding:0;border:0;border-radius:50%;background:{{ctx.hoverBg}};display:grid;place-items:center;cursor:pointer">
                <svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="none" stroke="#E3E3E8" stroke-width="3"></circle><circle cx="11" cy="11" r="8" fill="none" stroke="{{ctx.color}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{ctx.dash}}" transform="rotate(-90 11 11)" style="transition:stroke-dasharray .3s"></circle></svg>
              </button>
            </div>
            <div style="position:relative;display:flex">
              <button type="button" aria-haspopup="menu" aria-expanded="{{mdl.openAttr}}" onClick="{{mdl.toggle}}" title="{{mdl.title}}" style="display:flex;align-items:center;gap:6px;max-width:200px;height:28px;box-sizing:border-box;padding:0 8px;border:0;border-radius:8px;background:{{mdl.btnBg}};font-family:inherit;font-size:12px;font-weight:500;color:#1D1D1F;cursor:pointer">
                <i aria-hidden="true" style="flex:0 0 auto;display:block;width:16px;height:16px;border-radius:4px;font-style:normal;font-size:9px;font-weight:600;line-height:16px;text-align:center;background:{{mdl.badgeBg}};color:{{mdl.badgeFg}}">{{mdl.badge}}</i><span style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">{{mdl.label}}</span><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:#8E8E93"><path d="m6 9 6 6 6-6"></path></svg>
              </button>
              <sc-if value="{{mdl.open}}" hint-placeholder-val="{{ false }}">
                <div role="menu" aria-label="选择模型" style="position:absolute;right:0;bottom:36px;z-index:8;width:230px;box-sizing:border-box;padding:5px;border-radius:12px;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 36px rgba(0,0,0,.18);text-align:left">
                  <div style="padding:6px 10px 4px;font-size:12px;font-weight:500;color:#8E8E93">选择模型</div>
                  <div>

                  </div>
                  <a href="WB-Settings-AI.dc.html" style="display:flex;align-items:center;gap:8px;height:32px;box-sizing:border-box;margin-top:4px;padding:0 10px;border-top:1px solid rgba(0,0,0,.06);border-radius:0 0 8px 8px;font-size:12.5px;color:#6E6E73"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>管理模型</a>

                    <sc-for list="{{mdl.strengths}}" as="o" hint-placeholder-count="5">

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["red","green","blue","purple","amber","graphite"],"default":"red"},"modelOpen":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
const PALETTES = {
  red:      { name: '小伴红', btn: '#D93A44', btnHi: '#E8565F', soft: '#FCEBEC', ink: '#B42A33', tint: '#F5F1F1', dot: '#E5484D' },
  green:    { name: '薄荷绿', btn: '#2E8B5E', btnHi: '#3FA172', soft: '#E3F2E9', ink: '#1E6A45', tint: '#EEF4F0', dot: '#34A36D' },
  blue:     { name: '海湾蓝', btn: '#2F6FDB', btnHi: '#4A84E6', soft: '#E6EEFC', ink: '#1D53AE', tint: '#EFF3F9', dot: '#3B7BE8' },
  purple:   { name: '暮紫',   btn: '#7152D8', btnHi: '#8669E3', soft: '#EDE8FC', ink: '#5537B8', tint: '#F3F1F9', dot: '#7C5CE6' },
  amber:    { name: '琥珀',   btn: '#A8640C', btnHi: '#BD7A1C', soft: '#FAEEDB', ink: '#87500A', tint: '#F6F3ED', dot: '#E09A2B' },
  graphite: { name: '石墨',   btn: '#2B2B30', btnHi: '#4A4A50', soft: '#E9E9EC', ink: '#2B2B30', tint: '#F2F2F3', dot: '#55555B' }
};
const fmtTokens = (n) => n < 1000 ? String(Math.round(n)) : (n >= 1000000 ? (Math.round(n / 100000) / 10) + 'M' : (n < 100000 ? (Math.round(n / 100) / 10) : Math.round(n / 1000)) + 'K').replace('.0', '');
function contextVals(self, t, used, interactive) {
  const limit = self.state.ctxLimit ?? 128000;
  const pct = Math.min(100, Math.round((used / limit) * 100));
  const level = used / limit >= 0.9 ? 'full' : used / limit >= 0.7 ? 'warn' : 'ok';
  const color = level === 'full' ? '#D03050' : level === 'warn' ? '#F0A020' : t.btn;
  const C = 2 * Math.PI * 8;
  const open = interactive && (self.state.ctxOpen !== undefined ? self.state.ctxOpen : !!self.props.ctxOpen);
  const canCompact = used > 8000;
  return {
    percent: pct, color, dash: (C * pct / 100).toFixed(2) + ' ' + C.toFixed(2),
    open, openAttr: open ? 'true' : 'false', hoverBg: open ? '#F2F2F4' : 'transparent',
    title: used ? '' : '开始对话后显示上下文用量',
    toggle: () => { if (interactive) self.setState({ ctxOpen: !open }); },
    usedText: fmtTokens(used), limitText: fmtTokens(limit), limit, width: pct + '%',
    onLimit: (e) => self.setState({ ctxLimit: Number(e.target.value) }),
    noCompact: !canCompact, reason: canCompact ? '' : '对话还很短，暂时不需要压缩', btnColor: canCompact ? '#1D1D1F' : '#A1A1A6'
  };
}
const PERMS = [
  { id: 'default', label: '默认权限', desc: '读写文件、运行命令前先问你，可以记住授权', mark: 'm9 12 2 2 4-4' },
  { id: 'full', label: '完全信任', desc: '不再询问，直接执行。只在工作区沙箱内操作，适合你信得过的任务', mark: 'M12 8v4M12 15.5h.01' }
];
function permVals(self, t, defaultOpen) {
  const cur = self.state.perm ?? 'default';
  const open = self.state.permOpen !== undefined ? self.state.permOpen : defaultOpen;
  const full = cur === 'full';
  return {
    full, open, openAttr: open ? 'true' : 'false',
    label: (PERMS.find((p) => p.id === cur) || PERMS[0]).label,
    color: full ? '#C4313B' : '#4A4A50',
    bg: open ? '#F2F2F4' : 'transparent',
    toggle: () => self.setState({ permOpen: !open }),
    items: PERMS.map((p) => {
      const on = p.id === cur, warn = p.id === 'full';
      return { ...p, on, checked: on ? 'true' : 'false', bg: on ? (warn ? '#FDF0F0' : t.soft) : 'transparent',
        tileBg: warn ? '#FDECEC' : t.soft, tileInk: warn ? '#C4313B' : t.ink, ink: warn ? '#B42A33' : '#1D1D1F',
        pick: () => self.setState({ perm: p.id, permOpen: false }) };
    })
  };
}
const MDL_TIERS = ['claude-opus-5-5', 'claude-sonnet-5-5', 'deepseek-v4.1-flash', 'gemini-4-argon'];
const MDL_STRENGTHS = [['low', '低 · 更快'], ['medium', '中'], ['high', '高 · 更深入'], ['xhigh', '超高'], ['max', '最高']];
function modelVals(self, t, defaultOpen) {
  const st = self.state;
  const open = st.mdlOpen !== undefined ? st.mdlOpen : defaultOpen;
  const cur = st.mdlCur ?? 'free';
  const strength = st.mdlStrength ?? 'medium';
  const hover = st.mdlHover !== undefined ? st.mdlHover : (defaultOpen ? 0 : -1);
  const isFree = cur === 'free';
  const hov = 'rgba(0,0,0,.043)';
  const sel = { bg: t.soft, color: t.ink };
  const plain = { bg: 'transparent', color: 'inherit' };
  return {
    open, openAttr: open ? 'true' : 'false',
    toggle: () => self.setState({ mdlOpen: !open, mdlHover: -1 }),
    btnBg: open ? '#F2F2F4' : 'transparent',
    title: isFree ? '免费模型 · kilo-auto/free' : '小伴 AI · ' + cur,
    badge: isFree ? '免' : '伴',
    badgeBg: isFree ? t.soft : 'linear-gradient(160deg,' + t.btnHi + ',' + t.btn + ')',
    badgeFg: isFree ? t.ink : '#fff',
    label: isFree ? 'kilo-auto/free' : '小伴 AI · ' + cur,
    tiers: MDL_TIERS.map((name, i) => {
      const on = cur === name;
      const look = on ? sel : (hover === i ? { bg: hov, color: 'inherit' } : plain);
      return { name, cur: on, bg: look.bg, color: look.color, enter: () => self.setState({ mdlHover: i, mdlOpen: true }) };
    }),
    freeChecked: isFree ? 'true' : 'false', freeCur: isFree, free: isFree ? sel : plain,
    leave: () => self.setState({ mdlHover: -1 }),
    pickFree: () => self.setState({ mdlCur: 'free', mdlOpen: false, mdlHover: -1 }),
    reasonOpen: open && hover >= 0,
    reasonBottom: (101 - 32 * Math.max(hover, 0)) + 'px',
    strengths: MDL_STRENGTHS.map(([key, label]) => {
      const on = strength === key && (hover >= 0 ? cur === MDL_TIERS[hover] || cur === 'free' || true : true);
      const chosen = strength === key;
      return { label, on: chosen, checked: chosen ? 'true' : 'false', bg: chosen ? t.soft : 'transparent', color: chosen ? t.ink : 'inherit',
        pick: () => self.setState({ mdlCur: MDL_TIERS[Math.max(hover, 0)], mdlStrength: key, mdlOpen: false, mdlHover: -1 }) };
    })
  };
}
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { theme: null, aiOpen: true }; }
  renderVals() {
    const key = this.state.theme ?? this.props.theme ?? 'red';
    const t = PALETTES[key] ?? PALETTES.red;
    const swatches = Object.keys(PALETTES).map((k) => ({
      name: PALETTES[k].name,
      color: PALETTES[k].btn,
      checked: k === key ? 'true' : 'false',
      ring: k === key ? '2px solid ' + PALETTES[k].btn : '2px solid transparent',
      pick: () => this.setState({ theme: k })
    }));
    const aiOpen = this.state.aiOpen;
    return {
      ctx: contextVals(this, t, 0, false),
      perm: permVals(this, t, true),
      mdl: modelVals(this, t, this.props.modelOpen ?? false),
      t, swatches, aiOpen,
      aiOpenAttr: aiOpen ? 'true' : 'false',
      aiChevron: aiOpen ? 'rotate(0deg)' : 'rotate(-90deg)',
      toggleAi: () => this.setState({ aiOpen: !this.state.aiOpen })
    };
  }
}
</script>
