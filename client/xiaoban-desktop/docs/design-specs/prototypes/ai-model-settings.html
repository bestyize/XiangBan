<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小伴 AI · 模型配置设计稿</title>
  <style>
    :root{--ui-desktop-base:#e3e4e7;--ui-desktop-mist:#f4f5f7;--ui-desktop-water:#c9ccd1;--ui-desktop-warm:#dcdcd9;--ui-glass-window:color-mix(in srgb,var(--ui-surface) 88%,transparent)}
    :root[data-theme=dark]{--ui-desktop-base:#1c1d20;--ui-desktop-mist:#383a3e;--ui-desktop-water:#24272b;--ui-desktop-warm:#302f2e;--ui-glass-window:color-mix(in srgb,var(--ui-surface) 82%,transparent)}
    body::before{content:'';position:fixed;inset:-40px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,var(--ui-desktop-mist),transparent 72%),radial-gradient(ellipse at 90% 100%,var(--ui-desktop-water),transparent 75%);filter:blur(32px)}
    body{margin:0;min-height:100dvh;background:var(--ui-desktop-base);color:var(--ui-text-primary);font-family:var(--ui-font-family);font-size:13px}
    .preview-tools{display:flex;align-items:center;flex-wrap:wrap;gap:12px;max-width:760px;margin:26px auto 22px;padding:0 16px}
    .preview-tools strong{font-weight:500;margin-right:auto}
    .preview-tools label{display:flex;gap:6px;align-items:center;color:var(--ui-text-secondary)}
    .preview-tools select{font:inherit;background:var(--ui-surface);color:var(--ui-text-primary);border:0;border-radius:6px;padding:5px}
    .preview-options{position:relative}
    .preview-options summary{list-style:none;color:var(--ui-text-secondary);cursor:pointer;padding:5px 7px;font-size:12px}
    .preview-options summary::-webkit-details-marker{display:none}
    .preview-options[open] summary{color:var(--ui-ink)}
    .preview-options-panel{position:absolute;z-index:5;right:0;top:34px;display:grid;gap:12px;min-width:200px;padding:16px;background:var(--ui-surface-raised);border-radius:12px;box-shadow:var(--ui-shadow-menu)}
    .preview-options-panel label{justify-content:space-between;font-size:12px}
    .preview-options-panel select{background:var(--ui-control)}
    .preview-window{max-width:100%;margin:0 auto 24px;background:var(--ui-glass-window);border:.5px solid color-mix(in srgb,var(--ui-surface) 45%,transparent);border-radius:16px;overflow:hidden;backdrop-filter:blur(28px) saturate(1);-webkit-backdrop-filter:blur(28px) saturate(1);box-shadow:0 26px 65px -18px var(--ui-shadow-pop),0 2px 8px var(--ui-line),inset 0 1px 0 color-mix(in srgb,var(--ui-surface) 70%,transparent)}
    .preview-titlebar{height:44px;position:relative;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:.5px solid var(--ui-line);color:var(--ui-text-secondary);font-size:12px;background:color-mix(in srgb,var(--ui-surface-sunken) 48%,transparent);user-select:none}
    .preview-titlebar i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 .5px var(--ui-border-strong);background:var(--ui-danger)}
    .preview-titlebar i:nth-child(2){background:var(--ui-warning)}
    .preview-titlebar i:nth-child(3){background:var(--ui-success)}
    .preview-titlebar span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:500}
    .preview-body{height:clamp(530px,calc(100dvh - 160px),700px)}
    .preview-window .preview-body .gw-detached{height:100%}.preview-window>.configuration-chrome{background:var(--ui-configuration-canvas)}
    .preview-settings{height:100%;overflow:auto;padding:24px;box-sizing:border-box}
    .preview-settings h1{margin:0 0 24px;font-size:17px;font-weight:600}
    .preview-settings .xb-group-title{margin-top:22px}
    .preview-toast{max-width:720px;min-height:24px;margin:0 auto;padding:0 16px;color:var(--ui-text-secondary)}
    @media(max-width:480px){.preview-tools{margin-top:12px}.preview-window{border-radius:0;border-left:0;border-right:0}}
  </style>
</head>
<body class="desktop-control" style="overflow:auto">
  <div id="app"></div>
  <script type="module">
    // Preview commands are entirely local. No account, balance, redemption or model service is contacted.
    window.__TAURI__ = {
      core: { invoke: async (command, args = {}) => mockInvoke(command, args) },
      event: { listen: async () => () => {}, emit: async () => {} },
    };
    const { createApp, h, reactive, ref, computed, watch, watchEffect } = await import('vue');
    const { NConfigProvider, darkTheme, NSwitch } = await import('naive-ui');
    const { default: AiGatewayCard } = await import('/src/ui/components/AiGatewayCard.vue');
    const { default: AiConfigCard } = await import('/src/ui/components/AiConfigCard.vue');
    const { default: SettingsDialog } = await import('/src/ui/components/SettingsDialog.vue');
    const { default: WindowChrome } = await import('/src/ui/configuration/WindowChrome.vue');
    const { defaults } = await import('/src/bridge.ts');
    const { default: MacPreview } = await import('./AiModelSettingsMacPreview.vue');
    const { applyUiTokens } = await import('/src/ui/design-tokens.ts');
    const { accent, isDark, followHost, followAccent } = await import('/src/ui/appearance.ts');
    const { configurationThemeFor } = await import('/src/ui/theme.ts');
    await import('/src/ui/control.css');
    const dark = ref(false), view = ref('models'), count = ref(24), width = ref(360), toast = ref(''), probeOutcome = ref('success');
    watch(view, value => { width.value = value === 'models' ? 360 : value === 'macos' ? 680 : 900; });
    const providerId = ref('deepseek');
    const frame = { maximized: false, fullscreen: false, focused: true };
    const config = ref({ activeProvider: 'xiaoban-ai', gatewayTier: 'premium', gatewayEnabled: true });
    const store = reactive({ settings: { ...defaults }, settingsOpen: true, settingsTab: 'ai', website: { update: null, messages: [], announcements: [], errors: [], dismissed: {} }, startup: { available: true, error: '' }, info: { platform: 'macos', version: '3.0.0', dataDirectory: '~/Library/Application Support/小伴' }, closeSettings: () => { toast.value = '设计预览：关闭窗口'; }, desktop: true, account: { user: { uid: 'preview', username: 'read' } }, notify: value => { toast.value = String(value); }, openLogin: () => {} });
    const localChange = async patch => { Object.assign(store.settings, patch); };
    Object.assign(store, {
      updateAppearance: localChange, setAutostart: value => localChange({ autostart: value }),
      setChatComposerPet: value => localChange({ chatComposerPetEnabled: value }),
      setAutomaticUpdates: value => localChange({ automaticUpdates: value }),
      checkWebsite: async () => { toast.value = '设计预览：当前为最新版本'; }, refreshSettings: async () => {}, navigate: () => {},
      asr: { enabled: false, ready: true, saving: false, phase: 'idle', microphoneSupported: true, init: async () => {}, setEnabled: async value => { store.asr.enabled = value; } },
      speech: { ready: true, saving: false, status: 'idle', voices: [], settings: { provider: 'edge', voice: '晓晓', autoRead: false, rate: 0, pitch: 0, volume: 80 }, init: async () => {}, save: async patch => { Object.assign(store.speech.settings, patch); }, loadVoices: async () => {}, speak: async () => { toast.value = '设计预览：试听仅在桌面应用中播放'; }, stop: () => {} },
    });
    const names = ['claude-opus-5-5', 'claude-sonnet-5-5', 'deepseek-v4.1-flash', 'gemini-4-argon'];
    const models = computed(() => Array.from({ length: count.value }, (_, index) => ({
      tier: index === 0 ? 'premium' : `model-${index}`,
      displayName: names[index] ?? `自定义模型 ${String(index + 1).padStart(2, '0')}`,
      description: index < 4 ? '这里展示模型说明，实际内容由服务端配置' : '用于预览长模型列表',
      isDefault: index === 2, requiresPaid: index > 0 && index % 7 === 0, available: index === 0 || index % 7 !== 0,
    })));
    async function mockInvoke(command, args) {
      if (command === 'get_network_config' || command === 'save_network_config') return { mode: args.mode ?? 'system', proxyUrl: args.proxyUrl ?? '' };
      if (command === 'phone_link_status' || command === 'phone_link_set_enabled') return { enabled: !!args.enabled, connected: false, deviceId: null, deviceName: '我的电脑', loggedIn: true, peers: [], lastError: null };
      if (command === 'chat_agent_settings') return { sandboxAvailable: true, commandSandbox: false, sandboxNetwork: true, hooks: '', hooksPath: '~/xiaoban/hooks.json', grants: [] };
      if (command === 'speech_agent_env') {
        const tool = name => ({ name, installed: false, path: null, version: null, loggedIn: null, notes: [] });
        return { os: 'macos', node: tool('Node.js'), git: tool('Git'), claude: tool('Claude Code'), codex: tool('Codex'), desktopApps: [], readyForSpeechCoding: false };
      }
      if (command === 'speech_agent_install_guides' || command === 'speech_agent_task_list') return [];
      if (command === 'speech_agent_hooks_status') return { scope: 'user', settingsPath: '~/.claude/settings.json', fileExists: false, isInstalled: false, events: [], otherHooks: false };
      if (command === 'voice_service_status') return { enabled: false, running: false, speechBroadcast: false, port: 0, token: '', baseUrl: '', mcpUrl: '', mcpConfigSnippet: {} };
      if (command === 'configuration_window_action') {
        if (args.action === 'fullscreen') frame.fullscreen = !frame.fullscreen;
        if (args.action === 'maximize' || args.action === 'double-click') frame.maximized = !frame.maximized;
        if (args.action !== 'state') toast.value = '设计预览：窗口操作在桌面应用中生效';
        return { ...frame };
      }
      if (command === 'configuration_window_resize') return;
      if (command === 'open_download_url') { toast.value = '设计预览：此处打开配置的外部页面'; return; }
      if (['get_ai_config','refresh_ai_providers','save_ai_provider','switch_ai_provider'].includes(command)) return {
        ...config.value, protocol: 'chat', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-v4-pro', hasKey: true, keyHint: '••••1234', workspace: '', defaultWorkspace: '/workspace',
        providers: [{ id: 'deepseek', name: 'DeepSeek', protocol: 'chat', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-v4-pro', hasKey: true, keyHint: '••••1234', isCustom: false, models: models.value.map(m => ({ id: m.displayName })) }],
      };
      if (command === 'fetch_ai_models') return models.value.map(m => ({ id: m.displayName }));
      if (command === 'ai_gateway_probe') return probeOutcome.value === 'success' ? { elapsedMs: 820, reply: '设计预览：你好！' } : Promise.reject(new Error('设计预览：请求超时'));
      if (command === 'ai_gateway_tiers') return models.value;
      if (command === 'ai_gateway_balance') return {
        creditPurchaseUrl: 'https://example.com/credits', product: { name: '小伴桌面' }, quotaPerUnit: 500000, total: 3650000, paid: 3650000,
        buckets: [
          { id: 1, kind: 'topup', remaining: 3285000, total: 12500000, expiresAt: '2026-11-20T00:00:00Z' },
          { id: 2, kind: 'topup', remaining: 365000, total: 5000000, expiresAt: '2027-10-18T00:00:00Z' },
        ], trial: { available: false },
      };
      if (command === 'use_ai_gateway') return { ...config.value, activeProvider: 'xiaoban-ai', gatewayTier: args.tier };
      if (command === 'ai_gateway_redeem') throw new Error('设计预览：不兑换真实额度');
      if (command === 'configuration_window_open') { providerId.value = args.provider; view.value = args.provider === 'xiaoban-ai' ? 'models' : 'provider'; return; }
      if (command === 'configuration_window_close') { view.value = 'settings'; return; }
      throw new Error(`Preview command not implemented: ${command}`);
    }
    function applyTheme(value) { followHost(value ? 'dark' : 'light'); }
    followHost('light'); followAccent('blue');
    watchEffect(() => { dark.value = isDark.value; applyUiTokens(dark.value, accent.value); document.documentElement.dataset.theme = dark.value ? 'dark' : 'light'; });
    createApp({ setup: () => () => h(NConfigProvider, { theme: dark.value ? darkTheme : null, themeOverrides: configurationThemeFor(dark.value, accent.value) }, { default: () => [
      h('div', { class: 'preview-tools' }, [
        h('strong', '设置与模型 · 设计预览'),
        h('label', ['方案', h('select', { value: view.value, onChange: e => { view.value = e.target.value; applyTheme(dark.value); toast.value = ''; } }, [h('option', { value: 'macos' }, '初版参考'), h('option', { value: 'models' }, '小伴 AI · 新版'), h('option', { value: 'provider' }, '第三方模型 · 新版'), h('option', { value: 'settings' }, '设置 · 新版')])]),
        h('label', ['深色', h(NSwitch, { value: dark.value, 'onUpdate:value': applyTheme, 'aria-label': '深色预览', size: 'small' })]),
        h('details', { class: 'preview-options' }, [h('summary', '预览选项'), h('div', { class: 'preview-options-panel' }, [
          h('label', ['数量', h('select', { value: count.value, onChange: e => { count.value = Number(e.target.value); } }, [4, 24, 80].map(n => h('option', { value: n }, `${n} 个模型`)))]),
          h('label', ['宽度', h('select', { value: width.value, onChange: e => { width.value = Number(e.target.value); } }, [360, 560, 680, 900].map(n => h('option', { value: n }, `${n}px`)))]),
          h('label', ['检测演示', h('select', { value: probeOutcome.value, onChange: e => { probeOutcome.value = e.target.value; } }, [h('option', { value: 'success' }, '成功'), h('option', { value: 'failure' }, '失败')])]),
        ])]),
      ]),
      h('div', { class: 'preview-window', style: { width: `${width.value}px` } }, [
        ...(['macos','models'].includes(view.value) ? [h(WindowChrome, { title: view.value === 'macos' ? '小伴 AI' : undefined, platform: 'macos' })] : []),
        h('div', { class: 'preview-body', style: view.value === 'macos' && count.value <= 4 ? { height: '540px' } : undefined }, [view.value === 'macos'
          ? h(MacPreview, { models: models.value, active: config.value.gatewayTier, creditPurchaseUrl: 'https://example.com/credits', probeOutcome: probeOutcome.value, onUse: tier => { config.value = { ...config.value, gatewayTier: tier }; }, onNotice: value => { toast.value = value; } })
          : view.value === 'models'
          ? h(AiGatewayCard, { key: `models-${count.value}`, store, config: config.value, detached: true, onConfig: value => { config.value = value; } })
          : view.value === 'provider'
          ? h(AiConfigCard, { key: `provider-${providerId.value}-${count.value}`, store, detached: true, initialProvider: providerId.value })
          : h(SettingsDialog, { store, detached: true })]),
      ]),
      h('p', { class: 'preview-toast', role: 'status' }, toast.value),
    ] }) }).mount('#app');
  </script>
</body>
</html>
