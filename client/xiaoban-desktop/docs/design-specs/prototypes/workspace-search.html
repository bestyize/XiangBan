        ['工作空间检索设计','为侧栏增加搜索入口，支持检索会话标题、聊天内容和工作区。点击结果后展开所属项目并定位会话。'],
        ['文档工具回归测试','DOCX、PPTX、XLSX 与 PDF 文本层读取测试通过。扫描 PDF 不包含 OCR，需要明确显示能力边界。'],
        ['打包与版本检查','核对 Windows 安装包及版本信息。本次不触发远端构建，只整理需要人工执行的检查项。'],
        ['扫描 PDF 的读取方案','扫描文档没有可提取的文本层，应说明 OCR 或图像识别能力的依赖，不能把未读取内容当作已经读到。']
      ]},
      {id:'web',name:'相伴网页',entries:[
        ['本周工作记录整理','根据这周的工作文档整理周报，区分已完成、进行中与待决定的事项，保留原始记录中的不确定性。'],
        ['管理后台交互调整','缩短用户列表的行高，统一筛选控件的间距，修复窄屏下按钮挤压和表格溢出的问题。'],
        ['接口调用文档补充','补齐注册与登录接口的请求示例、返回字段和错误处理文档，核对网页调用方是否一致。'],
        ['小游戏页面布局','优化游戏空间首页和卡片列表，保持每款游戏的独立入口以及暂停、继续和重新开始操作。'],
        ['网页样式检查','检查浅色与深色配色，修复标题换行、按钮状态和小屏窗口中出现的内容截断。']
      ]},
      {id:'wallpaper',name:'壁纸网站',entries:[
        ['壁纸搜索与分类','检查分类、分页及关键词搜索，统一网站与桌面客户端展示的标题和素材信息。'],
        ['客户端对接文档','更新壁纸订阅接口的字段说明与文档，列出资源校验、下载失败和版本兼容的处理方式。'],
        ['动态壁纸上传流程','优化上传后的预览与封面选择，区分保存到壁纸库与立即应用到桌面的动作。'],
        ['公告与版本发布','整理本次公告文案及更新说明，检查用户关闭已读公告后是否仍会重复弹出。']
      ]},
      {id:'account',name:'账号中心',entries:[
        ['注册与登录流程','核对验证码、登录状态和刷新令牌，补充异常反馈，确保旧客户端仍可使用现有协议。'],
        ['账号接口联调记录','整理跨产品登录过程中的接口文档与字段边界，保存本次联调中已确认的结果。'],
        ['验证码提示优化','区分验证码错误、过期和发送频率限制。提示尽量短，帮助用户知道下一步该做什么。'],
        ['用户管理页面','调整后台用户详情与筛选功能。保持权限验证，不对生产数据执行批量修改。']
      ]},
      {id:'gateway',name:'AI 网关',entries:[
        ['模型服务配置','核对不同协议的请求地址、模型名称与额度反馈，客户端只显示日常和深入两种使用模式。'],
        ['额度系统说明文档','整理体验额度、月卡与加油包的说明文档，核对用户可见文案，不展示内部模型映射。'],
        ['请求错误排查','区分网络故障、限流与额度不足，减少无效重试，并显示实际服务端返回的错误原因。'],
        ['用量统计核验','检查输入、缓存命中和输出的用量字段，比较长任务每轮重复上下文带来的统计差异。']
      ]},
      {id:'docs',name:'产品文档',entries:[
        ['桌面产品需求整理','整理桌面客户端的职责、当前能力和规划范围。文档中的规划项需要与已实现功能明确区分。'],
        ['搜索交互评审','搜索结果采用紧凑行展示，默认跨项目查询，可按标题和内容缩小范围，列表高度固定并支持滚动。'],
        ['新用户上手说明','从新建工作区、开始会话到查看交付文件，说明最常见的操作，不把实现细节放进用户流程。'],
        ['发布前验收清单','保留真实的验收记录，区分命令执行成功、文件内容正确与视觉效果已经检查。'],
        ['设计稿归档','将已确认的交互稿与对应说明放在设计目录，HTML 设计稿可直接打开，不依赖在线素材。']
      ]},
      {id:'study',name:'我的学习',entries:[
        ['费曼学习法练习','用简单的语言解释 Rust 所有权，再用一个小例子检查概念有没有理解到位。'],
        ['研究论文阅读笔记','按问题、方法、实验和局限整理 PDF 文档，引用具体段落，避免把推断写成原文结论。'],
        ['本月阅读计划','把阅读任务拆成每天可完成的小步骤，记录读过的章节、疑问和下一步要验证的想法。'],
        ['每周复盘','整理本周学到的知识与尚未弄明白的地方，用具体例子检查记忆是否准确。']
      ]}
    ];
    const records=projects.flatMap((p,pi)=>p.entries.map(([title,content],i)=>({id:p.id+'-'+i,project:p.id,projectName:p.name,title,content,age:(pi*6+i+1)*17})));
    let selected='desktop-0',filter='all',active=0,visible=[],isComposing=false,toastTimer;
    const expanded=new Set(['desktop']),overlay=$('#overlay'),query=$('#query'),results=$('#results');
    const displayLimit=6,expandedSessionLists=new Set();
    let allProjectsExpanded=false;
    function terms(){return [...new Set(query.value.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean))]}
    function highlight(text){const t=terms();if(!t.length)return escape(text);const positions=[];const lower=text.toLocaleLowerCase();for(const word of t){let start=0,at;while((at=lower.indexOf(word,start))!==-1){positions.push([at,at+word.length]);start=at+Math.max(word.length,1)}}positions.sort((a,b)=>a[0]-b[0]);const merged=[];for(const [a,b] of positions){const last=merged.at(-1);if(last&&a<=last[1])last[1]=Math.max(last[1],b);else merged.push([a,b])}let cursor=0,out='';for(const [a,b] of merged){out+=escape(text.slice(cursor,a))+'<mark>'+escape(text.slice(a,b))+'</mark>';cursor=b}return out+escape(text.slice(cursor))}
    function excerpt(text){const t=terms(),lower=text.toLocaleLowerCase();const starts=t.map(w=>lower.indexOf(w)).filter(n=>n>=0);const start=starts.length?Math.max(0,Math.min(...starts)-16):0;return (start?'…':'')+text.slice(start,start+110)+(text.length>start+110?'…':'')}
    function ageLabel(age){return age<60?age+' 分钟前':age<1440?Math.floor(age/60)+' 小时前':Math.floor(age/1440)+' 天前'}
    function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2300)}
    function renderTree(){
      const tree=$('#workspace-tree');tree.replaceChildren();
      const projectList=document.createElement('div');projectList.id='workspace-projects';tree.append(projectList);
      for(const project of allProjectsExpanded?projects:projects.slice(0,displayLimit)){
        const group=document.createElement('details');group.className='tree-project';group.dataset.project=project.id;group.open=expanded.has(project.id);
        const summary=document.createElement('summary');summary.innerHTML=icon('chevron').replace('<svg ','<svg class="tree-chevron" ')+icon('folder').replace('<svg ','<svg class="folder" ')+'<span>'+escape(project.name)+'</span><small>'+project.entries.length+'</small>';group.append(summary);
        const list=document.createElement('div');list.className='tree-sessions';list.id='sessions-'+project.id;
        const sessions=records.filter(r=>r.project===project.id),showAll=expandedSessionLists.has(project.id);
        for(const record of showAll?sessions:sessions.slice(0,displayLimit)){
          const button=document.createElement('button');button.className='tree-chat'+(selected===record.id?' selected':'');button.textContent=record.title;button.title=record.title;button.dataset.session=record.id;button.onclick=()=>openSession(record,false);list.append(button);
        }
        if(sessions.length>displayLimit){
          const more=document.createElement('button');more.className='tree-more';more.dataset.sessionsMore=project.id;more.setAttribute('aria-expanded',String(showAll));more.setAttribute('aria-controls',list.id);
          more.innerHTML=icon('down')+'<span>'+(showAll?'收起会话':'展开全部会话')+'</span><small>'+(showAll?'显示 '+displayLimit+' 个':'还有 '+(sessions.length-displayLimit)+' 个')+'</small>';
          more.onclick=()=>{if(showAll)expandedSessionLists.delete(project.id);else expandedSessionLists.add(project.id);renderTree();$('[data-sessions-more="'+project.id+'"]').focus({preventScroll:true})};list.append(more);
        }
        group.append(list);group.addEventListener('toggle',()=>{if(group.open)expanded.add(project.id);else expanded.delete(project.id)});projectList.append(group);
      }
      if(projects.length>displayLimit){
        const more=document.createElement('button');more.id='projects-more';more.className='tree-more tree-more-projects';more.setAttribute('aria-expanded',String(allProjectsExpanded));more.setAttribute('aria-controls',projectList.id);
        more.innerHTML=icon('down')+'<span>'+(allProjectsExpanded?'收起项目':'展开全部项目')+'</span><small>'+(allProjectsExpanded?'显示 '+displayLimit+' 个':'还有 '+(projects.length-displayLimit)+' 个')+'</small>';
        more.onclick=()=>{allProjectsExpanded=!allProjectsExpanded;renderTree();$('#projects-more').focus({preventScroll:true})};tree.append(more);
      }
    }
    function renderConversation(record,matched=false){$('#chat-project').textContent=record.projectName;$('#chat-title').textContent=record.title;$('#chat-body').innerHTML='<div class="chat-message-user">'+escape(record.title)+'</div><div class="assistant-label"><div class="brand-mark">'+icon('spark')+'</div>小伴</div><div class="assistant-text">'+(matched?highlight(record.content):escape(record.content))+'</div>'+(matched?'<div class="match-note">'+icon('search')+'已打开搜索结果对应的会话</div>':'')}
    function closeSearch(){overlay.hidden=true;query.setAttribute('aria-expanded','false');$('#workspace-search').focus()}
    function openSearch(){overlay.hidden=false;$('#workspace-search').classList.remove('spotlight');query.setAttribute('aria-expanded','true');renderResults();requestAnimationFrame(()=>query.focus())}
    function openSession(record,fromSearch=true){selected=record.id;expanded.add(record.project);if(projects.findIndex(p=>p.id===record.project)>=displayLimit)allProjectsExpanded=true;if(records.filter(r=>r.project===record.project).findIndex(r=>r.id===record.id)>=displayLimit)expandedSessionLists.add(record.project);renderTree();renderConversation(record,fromSearch);closeSearch();requestAnimationFrame(()=>{const row=$('.tree-chat[data-session="'+record.id+'"]');row.scrollIntoView({block:'nearest'});row.focus({preventScroll:true})});if(fromSearch)toast('已展开「'+record.projectName+'」并定位会话')}
    function syncActive(scroll=false){const options=$$('.result');options.forEach((row,i)=>row.setAttribute('aria-selected',String(i===active)));if(options[active]){query.setAttribute('aria-activedescendant',options[active].id);if(scroll)options[active].scrollIntoView({block:'nearest'})}else query.removeAttribute('aria-activedescendant')}
    function renderResults(){
      const t=terms(),scope=$('#scope').value;$('#clear').hidden=!query.value;active=0;
      visible=records.filter(r=>scope==='all'||r.project===scope).map(r=>{const fields=filter==='title'?[r.title]:filter==='content'?[r.content]:[r.title,r.content,r.projectName];const searchable=fields.join(' ').toLocaleLowerCase();const matches=t.every(word=>searchable.includes(word));const titleHit=t.some(w=>r.title.toLocaleLowerCase().includes(w)),contentHit=t.some(w=>r.content.toLocaleLowerCase().includes(w));const score=t.reduce((n,w)=>n+(r.title.toLocaleLowerCase().includes(w)?12:0)+(r.content.toLocaleLowerCase().includes(w)?4:0)+(r.projectName.toLocaleLowerCase().includes(w)?6:0),0);return {...r,matches,score,hit:filter==='title'?'标题':filter==='content'?'内容':titleHit?'标题':contentHit?'内容':'工作区'}}).filter(r=>r.matches).sort((a,b)=>b.score-a.score||a.age-b.age);
      if(!t.length)visible=visible.slice(0,8);
      $('#result-count').innerHTML=t.length?'找到 <b>'+visible.length+'</b> 个会话':'最近更新的会话';$('#sort-label').textContent=t.length?'按相关度排序':'输入关键词查找全部 '+records.length+' 个会话';results.replaceChildren();results.scrollTop=0;
      if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML=icon('search')+'<h2>没有找到相关会话</h2><p>试试更短的关键词，或切换到所有工作区。</p><button type="button" id="reset-search">清空搜索条件</button>';results.append(empty);$('#reset-search').onclick=()=>{query.value='';$('#scope').value='all';setFilter('all');query.focus()};syncActive();return}
      visible.forEach((record,index)=>{const row=document.createElement('button');row.type='button';row.className='result';row.id='result-'+record.id;row.setAttribute('role','option');row.setAttribute('aria-selected',String(index===active));row.tabIndex=-1;row.dataset.session=record.id;row.innerHTML='<span class="result-icon">'+icon('chat')+'</span><span class="result-main"><span class="result-title-row"><span class="result-title">'+highlight(record.title)+'</span>'+(t.length?'<span class="hit-type">'+record.hit+'</span>':'')+'<span class="result-time">'+ageLabel(record.age)+'</span></span><span class="result-context"><span class="result-project">'+highlight(record.projectName)+'</span><i class="result-separator"></i><span class="result-excerpt">'+highlight(excerpt(record.content))+'</span></span></span>'+icon('enter').replace('<svg ','<svg class="result-enter" ');row.onclick=()=>openSession(record);row.onpointermove=()=>{if(active!==index){active=index;syncActive()}};row.onmousedown=e=>e.preventDefault();results.append(row)});syncActive();
    }
    function setFilter(value){filter=value;$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===value)));renderResults()}
    for(const project of projects){const option=document.createElement('option');option.value=project.id;option.textContent=project.name;$('#scope').append(option)}
    $$('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));$('#scope').onchange=renderResults;query.oninput=()=>{if(!isComposing)renderResults()};query.oncompositionstart=()=>isComposing=true;query.oncompositionend=()=>{isComposing=false;renderResults()};$('#clear').onclick=()=>{query.value='';renderResults();query.focus()};$('#close').onclick=closeSearch;$('#workspace-search').onclick=openSearch;overlay.onclick=e=>{if(e.target===overlay)closeSearch()};$('#show-entry').onclick=()=>{closeSearch();$('#workspace-search').classList.add('spotlight');toast('搜索入口位于“新建工作区”左侧')};$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme span').textContent=dark?'浅色预览':'深色预览'};$('#new-workspace').onclick=()=>toast('设计演示：这里会打开新建工作区流程');$('#new-task').onclick=()=>toast('设计演示：这里会新建会话');
    query.onkeydown=e=>{if(e.isComposing||isComposing)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(visible.length){active=(active+(e.key==='ArrowDown'?1:-1)+visible.length)%visible.length;syncActive(true)}}else if(e.key==='Enter'&&visible[active]){e.preventDefault();openSession(visible[active])}};
    document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if(overlay.hidden)return;if(e.key==='Escape'){e.preventDefault();closeSearch()}else if(e.key==='Tab'){const nodes=$$('.search-dialog button,.search-dialog input,.search-dialog select').filter(n=>n.tabIndex>=0&&n.getClientRects().length);const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
    const params=new URLSearchParams(location.search);if(params.get('theme')==='dark')$('#theme').click();renderTree();renderConversation(records[0]);renderResults();if(params.get('entry')==='1'){$('#show-entry').click()}else{openSearch()}
  </script>
</body>
</html>
