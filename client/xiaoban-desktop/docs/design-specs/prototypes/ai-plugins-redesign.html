<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小伴桌面 · AI 插件页设计稿（方案 A · 精装目录卡与独立窗口）</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--ui-configuration-canvas);
    color: var(--ui-text-primary);
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 20px 32px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ui-btn); outline-offset: 2px; }
  svg { flex-shrink: 0; display: block; }

  /* ── 顶部预览控制条（不属于客户端界面） ───────────────────────────── */
  .review-shell {
    max-width: 1280px;
    margin: 18px auto 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .review-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-card);
  }
  .review-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-right: auto;
    min-width: 0;
  }
  .review-badge {
    height: 20px;
    padding: 0 7px;
    border-radius: 999px;
    background: var(--ui-control);
    color: var(--ui-text-secondary);
    font-size: 11px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }
  .review-title strong { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .review-group {
    display: inline-flex;
    align-items: center;
    padding: 2px;
    border-radius: 9px;
    background: var(--ui-control);
    gap: 2px;
  }
  .review-group button {
    height: 28px;
    padding: 0 11px;
    border-radius: 7px;
    font-size: 12px;
    color: var(--ui-text-secondary);
    white-space: nowrap;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .review-group button:hover { color: var(--ui-text-primary); }
  .review-group button[aria-pressed="true"] {
    background: var(--ui-surface);
    color: var(--ui-text-primary);
    font-weight: 600;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
  }
  html[data-theme="dark"] .review-group button[aria-pressed="true"] { background: #48484C; }
  .review-select, .review-btn {
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: var(--ui-control);
    color: var(--ui-text-primary);
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s;
  }
  .review-select:hover, .review-btn:hover { background: var(--ui-control-hover); }
  .review-btn[aria-pressed="true"] { background: var(--ui-text-primary); color: var(--ui-surface); font-weight: 500; }

  .modal-launcher {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 8px 14px;
    border-radius: 12px;
    background: var(--ui-surface);
    box-shadow: inset 0 0 0 1px var(--ui-line);
    font-size: 12px;
    color: var(--ui-text-secondary);
  }
  .modal-launcher > span { font-weight: 500; color: var(--ui-text-primary); white-space: nowrap; }
  .modal-launcher-btns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .launch-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 10px;
    border-radius: 7px;
    background: var(--ui-control);
    color: var(--ui-text-primary);
    font-size: 11.5px;
    font-weight: 500;
    transition: background .15s, color .15s;
  }
  .launch-chip:hover { background: var(--ui-text-primary); color: var(--ui-surface); }
  .modal-launcher-hint { margin-left: auto; font-size: 11.5px; color: var(--ui-text-tertiary); }

  /* ── 小伴桌面窗口外框 ──────────────────────────────────────────────── */
  .desktop-stage { display: flex; justify-content: center; }
  .window {
    width: 100%;
    max-width: 1280px;
    height: 780px;
    max-height: calc(100dvh - 144px);
    min-height: 560px;
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr);
    border-radius: 16px;
    overflow: hidden;
    background: var(--ui-tint);
    box-shadow: var(--ui-shadow-panel), 0 18px 50px rgba(0, 0, 0, .09);
    transition: max-width .24s cubic-bezier(.22, 1, .36, 1);
  }
  .window.w-std { max-width: 1040px; }
  .window.w-narrow { max-width: 760px; grid-template-columns: 60px minmax(0, 1fr); }

  /* 侧栏 */
  .sidebar {
    display: flex;
    flex-direction: column;
    padding: 0 10px 12px;
    min-height: 0;
    overflow: hidden;
    user-select: none;
  }
  .lights { height: 46px; display: flex; align-items: center; gap: 7px; padding-left: 8px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .lights i:nth-child(1) { background: var(--ui-window-close); }
  .lights i:nth-child(2) { background: var(--ui-window-minimize); }
  .lights i:nth-child(3) { background: var(--ui-window-expand); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: #fff;
    background: linear-gradient(160deg, var(--ui-btn-hi), var(--ui-btn));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 2px 6px rgba(0,0,0,.14);
    flex: none;
  }
  .brand strong { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow: hidden; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--ui-text-secondary);
    white-space: nowrap;
  }
  .nav-item.is-active { background: var(--ui-surface-hover); color: var(--ui-text-primary); font-weight: 600; }
  .nav-item.is-active svg { color: var(--ui-ink); }
  .nav-item .sub-hint { margin-left: auto; font-size: 11px; color: var(--ui-text-tertiary); }
  .nav-indent { padding-left: 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-sep { height: 1px; background: var(--ui-line); margin: 8px 10px; }
  .account {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 8px 0;
    border-top: 1px solid var(--ui-line);
    font-size: 13px;
    font-weight: 500;
    color: var(--ui-text-primary);
  }
  .account-av {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--ui-control);
    color: var(--ui-text-secondary);
    display: grid;
    place-items: center;
    flex: none;
  }
  .window.w-narrow .sidebar { padding: 0 8px 12px; align-items: center; }
  .window.w-narrow .lights { padding-left: 0; justify-content: center; gap: 5px; }
  .window.w-narrow .lights i { width: 9px; height: 9px; }
  .window.w-narrow .brand strong,
  .window.w-narrow .nav-item span,
  .window.w-narrow .nav-item .sub-hint,
  .window.w-narrow .account span { display: none; }
  .window.w-narrow .nav-indent { padding-left: 0; }
  .window.w-narrow .nav-item { justify-content: center; padding: 0; width: 38px; height: 34px; }
  .window.w-narrow .account { justify-content: center; padding: 10px 0 0; }

  /* ── 主面板（AI 插件页 · 方案 A 定稿） ─────────────────────────────── */
  .main-panel {
    margin: 8px 8px 8px 0;
    background: var(--ui-surface);
    border-radius: 12px;
    box-shadow: var(--ui-shadow-panel);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
  }
  .store-header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 26px 0;
  }
  .store-tabs { display: flex; align-items: center; gap: 22px; flex: none; }
  .store-tabs button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--ui-text-disabled);
    white-space: nowrap;
    transition: color .15s;
  }
  .store-tabs button:hover { color: var(--ui-text-secondary); }
  .store-tabs button[aria-selected="true"] { color: var(--ui-text-primary); }
  .store-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .search-box {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 210px;
    height: 32px;
    padding: 0 10px;
    border-radius: 9px;
    background: var(--ui-control);
    color: var(--ui-text-secondary);
    transition: box-shadow .15s, background .15s;
  }
  .search-box:focus-within { background: var(--ui-surface); box-shadow: inset 0 0 0 1.5px var(--ui-btn); }
  .search-box input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 12.5px; color: var(--ui-text-primary); }
  .search-clear { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--ui-text-tertiary); font-size: 14px; }
  .search-clear:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }

  .xb-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border-radius: 9px;
    background: var(--ui-surface);
    color: var(--ui-text-primary);
    box-shadow: var(--ui-shadow-btn-secondary);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    transition: background .15s, box-shadow .15s, color .15s;
  }
  .xb-btn:hover { background: var(--ui-surface-sunken); }
  .xb-btn.is-selected { background: var(--ui-text-primary); color: var(--ui-surface); box-shadow: none; }
  .xb-btn .count {
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--ui-control);
    color: var(--ui-text-secondary);
    font-size: 11px;
    font-weight: 600;
    display: inline-grid;
    place-items: center;
  }
  .xb-btn.is-selected .count { background: color-mix(in srgb, var(--ui-surface) 18%, transparent); color: var(--ui-surface); }
  .update-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-dot); flex: none; }
  .xb-icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: inline-grid;
    place-items: center;
    color: var(--ui-text-secondary);
    transition: background .15s, color .15s;
  }
  .xb-icon-btn:hover { background: var(--ui-control); color: var(--ui-text-primary); }
  .xb-icon-btn.is-bordered { background: var(--ui-surface); box-shadow: var(--ui-shadow-btn-secondary); }

  /* 工具栏 */
  .store-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 16px 26px 12px;
    border-bottom: 1px solid var(--ui-line);
  }
  .cat-bar { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .cat-btn {
    height: 29px;
    padding: 0 11px;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--ui-text-secondary);
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .cat-btn:hover { background: var(--ui-control); color: var(--ui-text-primary); }
  .cat-btn.active { background: var(--ui-text-primary); color: var(--ui-surface); font-weight: 500; }
  .toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .xb-seg { display: inline-flex; align-items: center; padding: 2px; border-radius: 8px; background: var(--ui-control); }
  .xb-seg button {
    height: 25px;
    padding: 0 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ui-text-secondary);
    white-space: nowrap;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .xb-seg button:hover { color: var(--ui-text-primary); }
  .xb-seg button[aria-pressed="true"] {
    background: var(--ui-surface);
    color: var(--ui-text-primary);
    font-weight: 500;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  html[data-theme="dark"] .xb-seg button[aria-pressed="true"] { background: #48484C; }

  /* 滚动内容区 */
  .store-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 26px 28px;
    scrollbar-width: thin;
    scrollbar-color: var(--ui-scrollbar) transparent;
  }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .section-head + .card-grid + .section-head { margin-top: 26px; }
  .section-head-left { display: flex; align-items: baseline; gap: 9px; }
  .section-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; color: var(--ui-text-primary); }
  .section-head .sub { font-size: 12px; color: var(--ui-text-tertiary); }
  .section-refresh {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 26px;
    padding: 0 9px;
    border-radius: 7px;
    font-size: 12px;
    color: var(--ui-text-secondary);
  }
  .section-refresh:hover { background: var(--ui-control); color: var(--ui-text-primary); }

  .update-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 13px;
    margin-bottom: 14px;
    border-radius: 10px;
    background: var(--ui-surface-sunken);
    box-shadow: inset 0 0 0 1px var(--ui-line);
    color: var(--ui-text-secondary);
    font-size: 12px;
  }
  .update-banner .banner-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-dot); flex: none; }
  .update-banner b { color: var(--ui-text-primary); font-weight: 600; }
  .update-banner button {
    margin-left: auto;
    font-weight: 500;
    color: var(--ui-text-primary);
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 7px;
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-btn-secondary);
  }
  .update-banner button:hover { background: var(--ui-control); }

  /* ── 方案 A · 精装目录卡网格与样式 ────────────────────────────────── */
  .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @container (min-width: 960px) { .card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @container (max-width: 560px) { .card-grid { grid-template-columns: minmax(0, 1fr); } }
  @container (max-width: 760px) {
    .store-tabs { gap: 16px; }
    .store-tabs button { font-size: 17px; }
    .search-box { width: 160px; }
    .local-pkg-label { display: none; }
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 16px 16px 14px;
    border-radius: 16px;
    background: var(--ui-surface);
    box-shadow: inset 0 0 0 1px var(--ui-line), 0 1px 2px rgba(0,0,0,.03);
    cursor: pointer;
    transition: background .16s, box-shadow .16s, transform .16s;
  }
  .card:hover, .card:focus-within {
    transform: translateY(-1px);
    box-shadow: inset 0 0 0 1px var(--ui-border-strong), 0 8px 22px rgba(0,0,0,.07);
  }
  html[data-theme="dark"] .card { background: #27272A; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  html[data-theme="dark"] .card:hover, html[data-theme="dark"] .card:focus-within {
    background: #2D2D31;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 10px 24px rgba(0,0,0,.35);
  }
  .card-title-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: 0; }
  .card-act { position: relative; z-index: 1; margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .card-ic {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex: none;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: color-mix(in srgb, var(--hue) 8%, var(--ui-surface-sunken));
    color: color-mix(in srgb, var(--hue) 82%, var(--ui-text-primary));
  }
  html[data-theme="dark"] .card-ic {
    background: color-mix(in srgb, var(--hue) 15%, #2D2D32);
    color: var(--hue-hi);
  }
  .card-ic.has-brand { background: var(--ui-surface-sunken); box-shadow: inset 0 0 0 1px var(--ui-line); }
  html[data-theme="dark"] .card-ic.has-brand { background: #333338; }
  .card-ic.has-brand .brand-svg { width: 26px; height: 26px; }

  .card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .card-head-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-title-row { flex: 1; display: flex; align-items: center; gap: 5px; min-width: 0; }
  .card-title-row h3 { margin: 0; min-width: 0; font-size: 14.5px; font-weight: 600; line-height: 1.35; color: var(--ui-text-primary); }
  .card-title-btn { display: block; max-width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit; font: inherit; }
  .verified-ic { flex: none; color: var(--ui-text-tertiary); }
  .card-desc {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--ui-text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 38.5px;
  }
  .card-foot {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 13px;
    padding-top: 11px;
    border-top: 1px solid var(--ui-line);
    min-height: 28px;
  }

  .status-dot { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ui-text-secondary); white-space: nowrap; flex: none; }
  .status-dot i { width: 6.5px; height: 6.5px; border-radius: 50%; background: var(--ui-text-disabled); flex: none; }
  .status-dot.connected { color: var(--ui-success-text); }
  .status-dot.connected i { background: var(--ui-success); }
  .status-dot.needs_auth { color: var(--ui-warning-text); }
  .status-dot.needs_auth i { background: var(--ui-warning); }
  .status-dot.connecting { color: var(--ui-text-primary); }
  .status-dot.connecting i { background: var(--ui-btn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  .meta-tag {
    display: inline-flex;
    align-items: center;
    height: 21px;
    padding: 0 7px;
    border-radius: 5px;
    background: var(--ui-control);
    color: var(--ui-text-secondary);
    font-size: 11px;
    white-space: nowrap;
    max-width: 112px;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: none;
  }
  .meta-tag.is-group { background: transparent; box-shadow: inset 0 0 0 1px var(--ui-border-strong); color: var(--ui-text-primary); font-weight: 500; }
  .meta-text { font-size: 11.5px; color: var(--ui-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .act-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 27px;
    padding: 0 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    flex: none;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .act-btn.is-neutral-outline { background: var(--ui-surface); color: var(--ui-text-primary); box-shadow: inset 0 0 0 1px var(--ui-border-strong); }
  .act-btn.is-neutral-outline:hover { background: var(--ui-text-primary); color: var(--ui-surface); box-shadow: none; }
  .act-btn.is-fill { background: var(--ui-btn); color: var(--ui-text-on-btn); }
  .act-btn.is-fill:hover { background: var(--ui-btn-hi); }
  .act-btn.is-done { background: transparent; color: var(--ui-text-tertiary); box-shadow: inset 0 0 0 1px var(--ui-line); }
  .act-btn.is-done:hover { background: var(--ui-control); color: var(--ui-text-primary); box-shadow: none; }

  /* 空态 */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 46px 20px; text-align: center; color: var(--ui-text-secondary); }
  .empty-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--ui-control); color: var(--ui-text-secondary); display: grid; place-items: center; }
  .empty-state h3 { margin: 4px 0 0; font-size: 15px; color: var(--ui-text-primary); }
  .empty-state p { margin: 0; font-size: 12.5px; }

const state = { width:'wide', accent:'red', dark:false, tab:'experts', category:'全部', query:'', installedOnly:false, source:'market', sort:'hot' };

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
function getHueVars(item) {
  const [hi, main] = HUES[item.hue || CAT_HUE[item.category] || 'blue'] || HUES.blue;
  return `--hue:${main};--hue-hi:${hi}`;
}

function renderCard(item, tab) {
  const isConn = tab === 'connectors';
  const iconName = item.variant === 'team' ? 'users' : item.variant === 'bundle' ? 'layers' : (CAT_ICON[item.category] || 'puzzle');
  const iconHtml = isConn
    ? `<div class="card-ic has-brand">${BRAND_LOGOS[item.brand] || svgIcon('plug', 22)}</div>`
    : `<div class="card-ic">${svgIcon(iconName, 22, 1.9)}</div>`;
  const metaRight = item.variant === 'team' ? `${item.memberCount} 位专家` : item.variant === 'bundle' ? `${item.memberCount} 个技能` : item.updateTo && item.installed ? `v${item.version} → v${item.updateTo}` : `v${item.version}`;
  const headRight = isConn && (item.installed || item.status === 'connecting')
    ? `<span class="status-dot ${item.status}"><i></i>${item.status === 'connected' ? '已连接' : item.status === 'needs_auth' ? '需授权' : '连接中'}</span>`
    : '';
  const footMeta = isConn
    ? `<span class="meta-tag">${item.category}</span><span class="meta-text">${item.installed && item.toolCount ? `${item.toolCount} 个工具` : item.auth}</span>`
    : `<span class="meta-tag ${item.variant !== 'single' ? 'is-group' : ''}">${item.variant !== 'single' ? item.source : item.category}</span><span class="meta-text">${metaRight}</span>`;
  const btnHtml = isConn
    ? (item.installed ? `<button type="button" class="act-btn is-done" data-action="manage" data-slug="${item.slug}">管理</button>` : `<button type="button" class="act-btn is-neutral-outline" data-action="connect" data-slug="${item.slug}">${item.status === 'connecting' ? '连接中…' : '连接'}</button>`)
    : (item.installed && item.updateTo ? `<button type="button" class="act-btn is-fill" data-action="update" data-slug="${item.slug}">更新</button>` : item.installed ? `<button type="button" class="act-btn is-done" data-action="manage" data-slug="${item.slug}">${svgIcon('check', 12, 2.8)}已安装</button>` : `<button type="button" class="act-btn is-neutral-outline" data-action="install" data-slug="${item.slug}">${svgIcon('plus', 12, 2.5)}安装</button>`);

  return `
    <article class="card" style="${getHueVars(item)}">
      <div class="card-top">

        <div class="card-body">

              ${item.official ? verifiedBadge() : ''}
            </div>
            ${headRight}
          </div>
          <p class="card-desc">${item.desc}</p>
        </div>
      </div>
      <div class="card-foot">${footMeta}<div class="card-act">${btnHtml}</div></div>
    </article>`;
}

    if (state.installedOnly) {

function bindDynamicEvents() {
  document.querySelectorAll('#store-tabs button').forEach(b => { b.onclick = () => { state.tab = b.dataset.tab; state.category = '全部'; state.installedOnly = false; render(); }; });
  const si = document.getElementById('search-input');
  if (si) si.oninput = e => { const p = e.target.selectionStart; state.query = e.target.value; render(); const n = document.getElementById('search-input'); if (n) { n.focus(); n.setSelectionRange(p, p); } };
  const sc = document.getElementById('search-clear'); if (sc) sc.onclick = () => { state.query = ''; render(); };
  const it = document.getElementById('installed-toggle'); if (it) it.onclick = () => { state.installedOnly = !state.installedOnly; state.category = '全部'; render(); };
  document.querySelectorAll('.cat-btn').forEach(b => { b.onclick = () => { state.category = b.dataset.cat; render(); }; });
  document.querySelectorAll('[data-source]').forEach(b => { b.onclick = () => { state.source = b.dataset.source; render(); }; });
  document.querySelectorAll('[data-sort]').forEach(b => { b.onclick = () => { state.sort = b.dataset.sort; render(); }; });
  const ju = document.getElementById('jump-updates'); if (ju) ju.onclick = () => { state.installedOnly = true; state.category = '全部'; render(); };
  document.querySelectorAll('[data-toast]').forEach(el => { el.onclick = () => showToast(el.dataset.toast); });
  document.querySelectorAll('[data-open]').forEach(b => { b.onclick = () => { const item = DATA[state.tab].find(x => x.slug === b.dataset.open); if (item) openItemModal(item, state.tab); }; });
  document.querySelectorAll('[data-action]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const item = DATA[state.tab].find(x => x.slug === b.dataset.slug);
      if (!item) return;
      if (b.dataset.action === 'update') openModal({ type:'update', tab:state.tab, item });
      else openItemModal(item, state.tab);
    };
  });
}

function openItemModal(item, tab) {
  if (tab === 'connectors') openModal({ type:'connector', tab, item, connStage: item.status === 'connected' ? 'connected' : item.status === 'connecting' ? 'authorizing' : 'ready' });
  else if (item.variant && item.variant !== 'single') openModal({ type:'group', tab, item });
  else openModal({ type:'skill', tab, item });
}

    const label = item.variant === 'team' ? '专家团' : '技能套件';
    body.innerHTML = `
      <div class="dlg-hero" style="${hueStyle}"><div class="dlg-hero-ic">${svgIcon(iconName, 24, 1.85)}</div><div class="dlg-hero-main"><div class="dlg-hero-title"><h2>${item.name}</h2>${item.official ? verifiedBadge() : ''}</div><p class="dlg-hero-desc">${item.desc}</p><div class="dlg-meta-row"><span class="dlg-chip">${label}</span><span class="dlg-chip">共 ${members.length} ${unit}</span><span class="dlg-chip is-ok">${members.length - pendingCount} 项已安装将跳过</span><span class="dlg-chip">本次新增 ${pendingCount} 项</span></div></div></div>
      <div class="dlg-section"><div class="dlg-section-head"><h3>包含成员（点击可展开审查）</h3><span>共 11 个新增文件 · 42.6 KB</span></div><div class="member-list">${members.map(m => `<details class="member-item"><summary><div class="member-ic">${svgIcon(m.state==='installed'?'check':iconName, 14)}</div><div class="member-info"><b>${m.name}</b><small>v${m.ver} · ${m.files} 个文件</small></div><span class="member-pill ${m.state==='installed'?'done':'pending'}">${m.state==='installed'?'已安装 · 跳过':'待安装'}</span></summary><div class="member-expand"><p>${m.desc}</p><div style="font-family:'SF Mono',Menlo,monospace;font-size:11px;color:var(--ui-text-tertiary)">SKILL.md · references/checklist.md · 清单校验通过</div></div></details>`).join('')}</div></div>`;
    footer.style.display = 'flex';
    footer.innerHTML = `<span class="det-footer-hint">${svgIcon('shield', 13)}整组原子安装，任一校验失败自动回滚</span><div class="det-footer-actions"><button type="button" class="dlg-btn is-ghost" id="det-cancel">取消</button><button type="button" class="dlg-btn is-primary" data-m-confirm-install>安装新增 ${pendingCount} ${unit}${svgIcon('download', 14)}</button></div>`;
  } else if (modal.type === 'update') {
    const nextVer = item.updateTo || '1.5.0';
    const diffs = [{ kind:'changed', label:'修改', path:'SKILL.md', size:'2.4 KB' }, { kind:'added', label:'新增', path:'scripts/verify_layout.py', size:'4.1 KB', script:true }, { kind:'removed', label:'删除', path:'references/legacy-v1.md', size:'' }];
    body.innerHTML = `
      <div class="dlg-hero" style="${hueStyle}"><div class="dlg-hero-ic">${svgIcon(iconName, 24, 1.85)}</div><div class="dlg-hero-main"><div class="dlg-hero-title"><h2>更新「${item.name}」</h2></div><p class="dlg-hero-desc">先完整校验新版本文件再替换，当前版本将自动备份到本地。</p><div class="dlg-meta-row"><span class="dlg-chip">v${item.version}</span><span style="color:var(--ui-text-tertiary);font-size:12px">→</span><span class="dlg-chip is-ver-next">v${nextVer}</span><span class="dlg-chip">小伴市场</span></div></div></div>
      <div class="dlg-section"><div class="dlg-section-head"><h3>文件变更明细</h3><span>1 修改 · 1 新增 · 1 删除</span></div><div class="audit-card"><div class="audit-bar"><span class="audit-ok">${svgIcon('shield', 14)}新版本清单校验通过</span><button type="button" class="audit-digest" data-copy="d48e310a77c1299b0">${svgIcon('copy', 11)}d48e31…99b0</button></div><ul class="file-list">${diffs.map(d => `<li class="file-row"><div class="file-row-top"><span class="file-badge ${d.kind}">${d.label}</span><span class="file-path ${d.kind==='removed'?'is-removed':''}">${d.path}</span>${d.script ? '<span class="file-badge script">新增脚本</span>' : ''}<span class="file-meta">${d.size}</span></div>${d.script ? '<details class="file-script-details"><summary>预览新增脚本源码</summary><pre class="dlg-code">def verify(tree):\n    return [n for n in tree if n.overflow]</pre></details>' : ''}</li>`).join('')}</ul></div></div>`;
    footer.style.display = 'flex';
    footer.innerHTML = `<span class="det-footer-hint">${svgIcon('refresh', 13)}旧版本自动备份，失败自动恢复</span><div class="det-footer-actions"><button type="button" class="dlg-btn is-ghost" id="det-cancel">暂不更新</button><button type="button" class="dlg-btn is-primary" data-m-confirm-update>更新到 v${nextVer}</button></div>`;
  } else if (modal.type === 'connector') {
    const brandSvg = BRAND_LOGOS[item.brand] || svgIcon('plug', 28);
    const examples = [`帮我在${item.name}中查找本周会议纪要并总结待办`, `整理${item.name}里最近更新的项目文档大纲`];
    footer.style.display = 'none';
    if (modal.connStage === 'token') {
      body.innerHTML = `
        <div class="token-head"><button type="button" class="xb-icon-btn" data-m-stage="ready" aria-label="返回">${svgIcon('back', 16)}</button><div class="token-head-ic">${brandSvg}</div><div class="token-head-info"><b>配置 ${item.name}</b><span>${item.auth} · 凭据仅保存在本机</span></div><button type="button" class="token-doc-btn" data-toast="演示：打开服务商密钥获取说明">获取密钥指南${svgIcon('ext', 12)}</button></div>
        <div class="token-fields">
          <div class="token-field"><label>访问令牌（Access Token）<small>必填</small></label><div class="token-input-wrap"><input type="${modal.revealSecret ? 'text' : 'password'}" value="xb_tok_live_9482a71f" /><button type="button" class="token-eye" id="toggle-secret" aria-label="显示或隐藏">${svgIcon(modal.revealSecret ? 'eyeoff' : 'eye', 15)}</button></div></div>
          <div class="token-field"><label>工作区域名 <small>选填</small></label><div class="token-input-wrap"><input type="text" placeholder="例如 https://workspace.example.com" /></div></div>
        </div>`;
      footer.style.display = 'flex';
      footer.innerHTML = `<span class="det-footer-hint">${svgIcon('lock', 13)}仅本机保存，不进入模型上下文</span><div class="det-footer-actions"><button type="button" class="dlg-btn is-ghost" data-m-stage="ready">返回</button><button type="button" class="dlg-btn is-primary" data-m-conn-save>保存并连接</button></div>`;
    } else {
      const bCls = modal.connStage === 'connected' ? 'is-ok' : modal.connStage === 'authorizing' ? 'is-busy' : '';
      const bIc = modal.connStage === 'connected' ? svgIcon('check', 13, 2.8) : modal.connStage === 'authorizing' ? svgIcon('loader', 13, 2.2) : '<span style="font-size:11px;letter-spacing:1px">••</span>';
      const head = `<div class="conn-journey"><div class="conn-marks"><div class="conn-tile is-app">${svgIcon('sparkles', 24, 2)}</div><div class="conn-bridge ${bCls}"><span class="conn-bridge-node">${bIc}</span></div><div class="conn-tile">${brandSvg}</div></div><h2>${modal.connStage === 'connected' ? `${item.name} 已连接` : modal.connStage === 'authorizing' ? `正在授权 ${item.name}` : `连接 ${item.name}`}</h2>${modal.connStage === 'ready' ? `<p>${item.desc}</p>` : ''}${modal.connStage === 'connected' ? `<span class="conn-status-pill">${svgIcon('check', 12, 2.8)}已就绪 · 发现 ${item.toolCount || 8} 个工具</span>` : ''}</div>`;
      const rest = modal.connStage === 'ready'
        ? `<div class="conn-cta"><button type="button" class="dlg-btn is-primary" data-m-conn-start>${item.installed ? '立即连接' : '安装并连接'}</button></div><div class="conn-sub-cta"><button type="button" class="dlg-btn is-ghost" data-m-stage="token">改用密钥手动配置</button></div><div class="example-block"><h4>${svgIcon('bulb', 14)}试试这样用</h4>${examples.map(ex => `<button type="button" class="example-item" data-toast="演示：带入示例指令"><span>“${ex}”</span>${svgIcon('msg', 14)}</button>`).join('')}</div><div class="conn-foot-row"><details class="conn-details"><summary>安装审查与服务信息（v${item.version} · 已校验）</summary><div class="conn-kv"><b>认证方式</b><span>${item.auth}</span><b>传输协议</b><span>Streamable HTTP（远程服务）</span><b>版本校验</b><span style="color:var(--ui-success-text)">清单摘要 81b2c4…09fa 一致</span><b>随包技能</b><span>2 个（文档检索、内容摘要）</span></div></details></div>`
        : modal.connStage === 'authorizing'
          ? `<p style="text-align:center;color:var(--ui-text-secondary);font-size:13px;margin:10px 0 0">已在浏览器打开授权页面，请核对下方验证码并确认权限：</p><div class="code-card"><strong>XB4K-9M2P</strong><button type="button" class="dlg-btn is-secondary" style="height:30px;font-size:12px" id="copy-user-code">${modal.copiedCode ? '已复制 ✓' : '复制验证码'}</button></div><div class="conn-cta"><button type="button" class="dlg-btn is-primary" data-m-conn-save>我已完成授权</button></div><div class="conn-sub-cta"><button type="button" class="dlg-btn is-ghost" data-toast="演示：重新打开浏览器授权页">重新打开授权页</button><button type="button" class="dlg-btn is-ghost" data-m-stage="ready">取消授权</button></div>`
          : `<div class="conn-cta"><button type="button" class="dlg-btn is-primary" data-toast="演示：带入示例并跳转新建任务">去试试${svgIcon('arrow', 14)}</button></div><div class="conn-sub-cta"><button type="button" class="dlg-btn is-ghost" data-m-stage="authorizing">重新授权</button><button type="button" class="dlg-btn is-ghost" data-m-stage="token">修改密钥</button></div><div class="example-block"><h4>${svgIcon('bulb', 14)}试试这样用</h4>${examples.map(ex => `<button type="button" class="example-item" data-toast="演示：新建任务并填充示例"><span>“${ex}”</span>${svgIcon('msg', 14)}</button>`).join('')}</div>${modal.removing ? `<div class="remove-confirm-box" role="alert"><h4>移除「${item.name}」？</h4><p>将卸载连接器插件与随包技能，断开服务并清除本机保存的凭据。</p><div class="remove-confirm-actions"><button type="button" class="dlg-btn is-secondary" data-m-remove-cancel>取消</button><button type="button" class="dlg-btn is-danger" data-m-remove-confirm>确认移除</button></div></div>` : `<div class="conn-foot-row"><details class="conn-details"><summary>连接管理（v${item.version} · ${item.toolCount || 8} 个工具）</summary><div class="conn-kv"><b>来源</b><span>小伴市场</span><b>认证</b><span>${item.auth}</span><b>可用工具</b><span>search_docs、read_content 等 ${item.toolCount || 8} 项</span></div><div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="dlg-btn is-secondary" style="height:28px;font-size:12px" data-toast="演示：已停用连接器">暂时停用</button><button type="button" class="dlg-btn is-secondary" style="height:28px;font-size:12px" data-m-stage="ready">断开并清除凭据</button></div></details><button type="button" class="dlg-btn is-danger-ghost" data-m-remove-toggle>${svgIcon('trash', 13)}移除</button></div>`}`;
      body.innerHTML = head + rest;
    }
  }
  bindModalEvents();
}

function bindModalEvents() {
  const cl = document.getElementById('det-close'); if (cl) cl.onclick = closeModal;
  const ca = document.getElementById('det-cancel'); if (ca) ca.onclick = closeModal;
  document.querySelectorAll('[data-m-stage]').forEach(b => { b.onclick = () => { modal.connStage = b.dataset.mStage; modal.removing = false; renderModal(); }; });
  document.querySelectorAll('[data-m-inst]').forEach(b => { b.onclick = () => { modal.item.installed = b.dataset.mInst === '1'; modal.removing = false; render(); renderModal(); }; });
  document.querySelectorAll('[data-copy]').forEach(b => { b.onclick = () => showToast(`已复制完整清单摘要：${b.dataset.copy}`); });
  document.querySelectorAll('[data-toast]').forEach(el => { el.onclick = () => showToast(el.dataset.toast); });
  const cc = document.getElementById('copy-user-code'); if (cc) cc.onclick = () => { modal.copiedCode = true; showToast('验证码 XB4K-9M2P 已复制'); renderModal(); };
  const ts = document.getElementById('toggle-secret'); if (ts) ts.onclick = () => { modal.revealSecret = !modal.revealSecret; renderModal(); };
  const ci = document.querySelector('[data-m-confirm-install]'); if (ci) ci.onclick = () => { modal.item.installed = true; showToast(`已安装「${modal.item.name}」`); closeModal(); render(); };
  const cu = document.querySelector('[data-m-confirm-update]'); if (cu) cu.onclick = () => { modal.item.version = modal.item.updateTo || '1.5.0'; delete modal.item.updateTo; showToast(`已更新至 v${modal.item.version}`); closeModal(); render(); };
  const us = document.querySelector('[data-m-use]'); if (us) us.onclick = () => { showToast(`演示：已绑定「${modal.item.name}」并跳转新建任务`); closeModal(); };
  const cs = document.querySelector('[data-m-conn-start]'); if (cs) cs.onclick = () => { modal.connStage = modal.item.auth === '令牌认证' ? 'token' : 'authorizing'; renderModal(); };
  const cv = document.querySelector('[data-m-conn-save]'); if (cv) cv.onclick = () => { modal.item.installed = true; modal.item.status = 'connected'; modal.item.toolCount = modal.item.toolCount || 8; modal.connStage = 'connected'; showToast(`「${modal.item.name}」连接成功`); render(); renderModal(); };
  const rt = document.querySelector('[data-m-remove-toggle]'); if (rt) rt.onclick = () => { modal.removing = true; renderModal(); };
  const rc = document.querySelector('[data-m-remove-cancel]'); if (rc) rc.onclick = () => { modal.removing = false; renderModal(); };
  const rf = document.querySelector('[data-m-remove-confirm]'); if (rf) rf.onclick = () => { modal.item.installed = false; if (modal.type === 'connector') modal.item.status = 'uninstalled'; showToast(`已移除「${modal.item.name}」`); closeModal(); render(); };
}

document.querySelectorAll('#width-switcher button').forEach(b => { b.onclick = () => { state.width = b.dataset.width; render(); }; });
document.getElementById('accent-select').onchange = e => { state.accent = e.target.value; render(); };
document.getElementById('dark-toggle').onclick = () => { state.dark = !state.dark; render(); };
document.getElementById('win-overlay').onclick = e => { if (e.target.id === 'win-overlay') closeModal(); };
window.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.open) closeModal(); });
document.querySelectorAll('[data-open-modal]').forEach(b => {
  b.onclick = () => {
    const id = b.dataset.openModal;
    if (id === 'skill-install') openModal({ type:'skill', tab:'skills', item: DATA.skills.find(x => !x.installed && x.variant==='single') || DATA.skills[3] });
    else if (id === 'group-install') openModal({ type:'group', tab:'experts', item: DATA.experts[1] });
    else if (id === 'update-review') openModal({ type:'update', tab:'experts', item: DATA.experts[0] });
    else if (id === 'connector-flow') openModal({ type:'connector', tab:'connectors', item: DATA.connectors[3], connStage:'ready' });
    else if (id === 'skill-installed') openModal({ type:'skill', tab:'experts', item: DATA.experts[2] });
  };
});

const params = new URLSearchParams(location.search);
if (['experts','skills','connectors'].includes(params.get('tab'))) state.tab = params.get('tab');
if (params.get('dark') === '1') state.dark = true;
render();
if (params.get('modal') === 'skill') openModal({ type:'skill', tab:'skills', item: DATA.skills[3] });
if (params.get('modal') === 'group') openModal({ type:'group', tab:'experts', item: DATA.experts[1] });
if (params.get('modal') === 'update') openModal({ type:'update', tab:'experts', item: DATA.experts[0] });
if (params.get('modal') === 'connector') openModal({ type:'connector', tab:'connectors', item: DATA.connectors[3], connStage:'ready' });
</script>
</body>
</html>
