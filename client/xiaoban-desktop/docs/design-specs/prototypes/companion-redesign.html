<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="red">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小伴桌面 · 伙伴页卡片与独立配置窗口设计稿</title>
<style>
  /* ── 小伴桌面设计令牌（6 套主题色 × 浅/深模式，对齐 src/ui/design-tokens.ts） ── */
  :root,
  html[data-theme="light"] {
    --ui-surface: #FFFFFF;
    --ui-surface-alt: #F2F2F4;
    --ui-surface-sunken: #F5F5F7;
    --ui-surface-hover: rgba(0, 0, 0, .045);
    --ui-surface-raised: rgba(255, 255, 255, .97);
    --ui-control: #F2F2F4;
    --ui-control-hover: #EAEAED;
    --ui-border: rgba(0, 0, 0, .075);
    --ui-border-strong: rgba(0, 0, 0, .14);
    --ui-line: rgba(0, 0, 0, .06);
    --ui-text-primary: #1D1D1F;
    --ui-text-secondary: #6E6E73;
    --ui-text-tertiary: #8E8E93;
    --ui-text-disabled: #A1A1A6;
    --ui-window-close: #FF5F57;
    --ui-window-minimize: #FEBC2E;
    --ui-window-expand: #28C840;
    --ui-configuration-canvas: #F6F7F8;
    --ui-configuration-surface: #FFFFFF;
    --ui-configuration-sidebar: #F5F5F7;
    --ui-configuration-group: #FFFFFF;
    --ui-configuration-control: #F0F1F3;
    --ui-success: #34A36D;
    --ui-success-text: #23784F;
    --ui-warning: #E09A2B;
    --ui-warning-text: #9A5410;
    --ui-danger: #D93A44;
    --ui-scrollbar: rgba(0, 0, 0, .18);
    --ui-shadow-panel: 0 0 0 1px rgba(0, 0, 0, .05), 0 4px 16px rgba(0, 0, 0, .04);
    --ui-shadow-card: 0 0 0 1px rgba(0, 0, 0, .06), 0 1px 3px rgba(0, 0, 0, .03);
    --ui-shadow-card-hover: 0 0 0 1px rgba(0, 0, 0, .09), 0 10px 26px rgba(0, 0, 0, .07);
    --ui-shadow-menu: 0 0 0 1px rgba(0, 0, 0, .08), 0 14px 36px rgba(0, 0, 0, .18);
    --ui-shadow-window: 0 0 0 1px rgba(0, 0, 0, .08), 0 26px 70px rgba(0, 0, 0, .18), 0 6px 18px rgba(0, 0, 0, .07);
    --ui-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, .28), 0 1px 2px rgba(0, 0, 0, .18);
    --ui-shadow-btn-secondary: 0 0 0 1px rgba(0, 0, 0, .11), 0 1px 1.5px rgba(0, 0, 0, .04);
  }
  html[data-theme="dark"] {
    --ui-surface: #232325;
    --ui-surface-alt: #2C2C2E;
    --ui-surface-sunken: #1C1C1F;
    --ui-surface-hover: rgba(255, 255, 255, .06);
    --ui-surface-raised: rgba(44, 44, 46, .97);
    --ui-control: #2C2C2E;
    --ui-control-hover: #363639;
    --ui-border: rgba(255, 255, 255, .09);
    --ui-border-strong: rgba(255, 255, 255, .16);
    --ui-line: rgba(255, 255, 255, .07);
    --ui-text-primary: #F5F5F7;
    --ui-text-secondary: #A1A1A6;
    --ui-text-tertiary: #7C7C82;
    --ui-text-disabled: #5E5E63;
    --ui-configuration-canvas: #1D1E22;
    --ui-configuration-surface: #27282E;
    --ui-configuration-sidebar: #191A1E;
    --ui-configuration-group: #2B2D33;
    --ui-configuration-control: #363840;
    --ui-success: #3FB87A;
    --ui-success-text: #6FD6A0;
    --ui-warning: #F0A93A;
    --ui-warning-text: #F0B65A;
    --ui-danger: #E5484D;
    --ui-scrollbar: rgba(255, 255, 255, .22);
    --ui-shadow-panel: 0 0 0 1px rgba(255, 255, 255, .06), 0 4px 16px rgba(0, 0, 0, .30);
    --ui-shadow-card: 0 0 0 1px rgba(255, 255, 255, .07);
    --ui-shadow-card-hover: 0 0 0 1px rgba(255, 255, 255, .14), 0 12px 28px rgba(0, 0, 0, .40);
    --ui-shadow-menu: 0 0 0 1px rgba(255, 255, 255, .10), 0 14px 36px rgba(0, 0, 0, .55);
    --ui-shadow-window: 0 0 0 1px rgba(255, 255, 255, .10), 0 28px 72px rgba(0, 0, 0, .58);
    --ui-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(0, 0, 0, .4);
    --ui-shadow-btn-secondary: 0 0 0 1px rgba(255, 255, 255, .14);
  }

  /* 6 套主题色 */
  html[data-theme="light"][data-accent="red"]      { --ui-btn:#D93A44; --ui-btn-hi:#E8565F; --ui-soft:#FCEBEC; --ui-ink:#B42A33; --ui-tint:#F5F1F1; --ui-dot:#E5484D; --ui-configuration-canvas:#F8F6F6; }
  html[data-theme="light"][data-accent="green"]    { --ui-btn:#2E8B5E; --ui-btn-hi:#3FA172; --ui-soft:#E3F2E9; --ui-ink:#1E6A45; --ui-tint:#EEF4F0; --ui-dot:#34A36D; --ui-configuration-canvas:#F5F8F6; }
  html[data-theme="light"][data-accent="blue"]     { --ui-btn:#2F6FDB; --ui-btn-hi:#4A84E6; --ui-soft:#E6EEFC; --ui-ink:#1D53AE; --ui-tint:#EFF3F9; --ui-dot:#3B7BE8; --ui-configuration-canvas:#F5F7FA; }
  html[data-theme="light"][data-accent="purple"]   { --ui-btn:#7152D8; --ui-btn-hi:#8669E3; --ui-soft:#EDE8FC; --ui-ink:#5537B8; --ui-tint:#F3F1F9; --ui-dot:#7C5CE6; --ui-configuration-canvas:#F7F6FA; }
  html[data-theme="light"][data-accent="amber"]    { --ui-btn:#A8640C; --ui-btn-hi:#BD7A1C; --ui-soft:#FAEEDB; --ui-ink:#87500A; --ui-tint:#F6F3ED; --ui-dot:#E09A2B; --ui-configuration-canvas:#F9F7F4; }
  html[data-theme="light"][data-accent="graphite"] { --ui-btn:#2B2B30; --ui-btn-hi:#4A4A50; --ui-soft:#E9E9EC; --ui-ink:#2B2B30; --ui-tint:#F2F2F3; --ui-dot:#55555B; --ui-configuration-canvas:#F6F6F7; }

  html[data-theme="dark"][data-accent="red"]      { --ui-btn:#E54D56; --ui-btn-hi:#F0646C; --ui-soft:rgba(229,77,86,.18);   --ui-ink:#FF868D; --ui-tint:#1C191A; --ui-dot:#F0646C; }
  html[data-theme="dark"][data-accent="green"]    { --ui-btn:#38A16E; --ui-btn-hi:#49B680; --ui-soft:rgba(56,161,110,.18);  --ui-ink:#6FE0A8; --ui-tint:#181D1A; --ui-dot:#49B680; }
  html[data-theme="dark"][data-accent="blue"]     { --ui-btn:#4481E8; --ui-btn-hi:#5E96F2; --ui-soft:rgba(68,129,232,.19);  --ui-ink:#87B5FF; --ui-tint:#181B20; --ui-dot:#5E96F2; }
  html[data-theme="dark"][data-accent="purple"]   { --ui-btn:#8669E3; --ui-btn-hi:#9A80EC; --ui-soft:rgba(134,105,227,.20); --ui-ink:#B7A3F8; --ui-tint:#1B1921; --ui-dot:#9A80EC; }
  html[data-theme="dark"][data-accent="amber"]    { --ui-btn:#C98220; --ui-btn-hi:#DC9636; --ui-soft:rgba(201,130,32,.20);  --ui-ink:#F2BA68; --ui-tint:#1E1B17; --ui-dot:#E8A543; }
  html[data-theme="dark"][data-accent="graphite"] { --ui-btn:#6B6B73; --ui-btn-hi:#80808A; --ui-soft:rgba(255,255,255,.11); --ui-ink:#D4D4DA; --ui-tint:#1A1A1C; --ui-dot:#9A9AA3; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: var(--ui-configuration-canvas);
    color: var(--ui-text-primary);
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 0 20px 56px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ui-btn); outline-offset: 2px; }
  button:disabled { opacity: .48; cursor: not-allowed; }
  svg { flex-shrink: 0; display: block; }
  [hidden] { display: none !important; }

  /* ── 顶部设计评审条（非客户端 UI） ────────────────────────────────── */
  .review-shell {
    max-width: 1240px; margin: 14px auto 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .review-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 14px; border-radius: 14px;
    background: var(--ui-surface); box-shadow: var(--ui-shadow-card);
  }
  .review-title { display: flex; align-items: center; gap: 8px; margin-right: auto; }
  .review-badge {
    height: 20px; padding: 0 8px; border-radius: 999px;
    background: var(--ui-soft); color: var(--ui-ink);
    font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap;
  }
  .review-title strong { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .review-group {
    display: inline-flex; align-items: center; padding: 2px; border-radius: 9px;
    background: var(--ui-control); gap: 2px;
  }
  .review-group button {
    height: 27px; padding: 0 10px; border-radius: 7px; font-size: 12px;
    color: var(--ui-text-secondary); white-space: nowrap;
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .review-group button:hover { color: var(--ui-text-primary); }
  .review-group button[aria-pressed="true"] {
    background: var(--ui-surface); color: var(--ui-text-primary); font-weight: 600;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12);
  }
  html[data-theme="dark"] .review-group button[aria-pressed="true"] { background: #48484C; }

  .accent-dots {
    display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; height: 29px;
    border-radius: 8px; background: var(--ui-control);
  }
  .accent-dot { width: 14px; height: 14px; border-radius: 50%; position: relative; transition: transform .15s; }
  .accent-dot:hover { transform: scale(1.14); }
  .accent-dot[aria-pressed="true"]::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 1.5px solid var(--ui-text-primary);
  }

  .sub-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 14px; border-radius: 12px;
    background: var(--ui-surface); box-shadow: inset 0 0 0 1px var(--ui-line);
    font-size: 12px; color: var(--ui-text-secondary);
  }
  .sub-bar .lbl { font-weight: 500; color: var(--ui-text-primary); white-space: nowrap; }
  .sub-bar .sep { width: 1px; height: 15px; background: var(--ui-border); }
  .sub-bar .hint { margin-left: auto; font-size: 11.5px; color: var(--ui-text-tertiary); }
  .sub-toggle {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
    border-radius: 7px; background: var(--ui-control); color: var(--ui-text-secondary); font-size: 11.5px;
    transition: background .15s, color .15s;
  }
  .sub-toggle:hover { color: var(--ui-text-primary); background: var(--ui-control-hover); }
  .sub-toggle[aria-pressed="true"] { background: var(--ui-soft); color: var(--ui-ink); font-weight: 500; }

  /* ── 通用控制台控件（对齐 control.css & ui-conventions.md） ────────── */
  .xb-btn-primary, .xb-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 500;
    line-height: 1; white-space: nowrap; transition: background .15s, filter .15s, color .15s;
  }
  .xb-btn-primary {
    color: #fff; background: linear-gradient(var(--ui-btn-hi), var(--ui-btn)); box-shadow: var(--ui-shadow-btn);
  }
  .xb-btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
  .xb-btn-primary.flat { background: var(--ui-btn); box-shadow: none; }
  .xb-btn {
    color: var(--ui-text-primary); background: var(--ui-surface); box-shadow: var(--ui-shadow-btn-secondary);
  }
  .xb-btn:hover:not(:disabled) { background: var(--ui-surface-sunken); }
  .xb-btn.is-sm, .xb-btn-primary.is-sm { height: 28px; padding: 0 11px; border-radius: 7px; font-size: 12px; }
  .xb-btn-ghost {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px;
    border-radius: 8px; background: transparent; color: var(--ui-text-secondary); font-size: 12.5px;
    transition: background .15s, color .15s;
  }
  .xb-btn-ghost:hover:not(:disabled) { background: var(--ui-control); color: var(--ui-text-primary); }
  .xb-btn-ghost.is-danger { color: var(--ui-danger); }
  .xb-btn-ghost.is-danger:hover:not(:disabled) { background: rgba(217, 58, 68, .10); }
  .xb-icon-btn {
    width: 28px; height: 28px; border-radius: 7px; display: inline-grid; place-items: center;
    color: var(--ui-text-secondary); transition: background .15s, color .15s;
  }
  .xb-icon-btn:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }
  .xb-icon-btn.is-sm { width: 24px; height: 24px; border-radius: 6px; }
  .xb-link { color: var(--ui-ink); font-size: inherit; font-weight: 500; }
  .xb-link:hover { text-decoration: underline; }

  .xb-seg {
    display: inline-flex; align-items: center; padding: 2px; border-radius: 8px; background: var(--ui-control);
  }
  .xb-seg > button {
    height: 26px; padding: 0 12px; border-radius: 6px; font-size: 12.5px;
    color: var(--ui-text-secondary); white-space: nowrap; transition: background .15s, color .15s;
  }
  .xb-seg > button:hover { color: var(--ui-text-primary); }
  .xb-seg > button[aria-pressed="true"], .xb-seg > button[aria-checked="true"] {
    background: var(--ui-surface); color: var(--ui-text-primary); font-weight: 500;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
  }
  html[data-theme="dark"] .xb-seg > button[aria-pressed="true"],
  html[data-theme="dark"] .xb-seg > button[aria-checked="true"] { background: #48484C; }
  .xb-seg.is-xs > button { height: 24px; padding: 0 8px; font-size: 11.5px; }

  .xb-switch {
    position: relative; width: 34px; height: 20px; border-radius: 999px;
    background: var(--ui-border-strong); flex: none; transition: background .18s;
  }
  .xb-switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
    transition: transform .18s;
  }
  .xb-switch[aria-checked="true"] { background: var(--ui-btn); }
  .xb-switch[aria-checked="true"]::after { transform: translateX(14px); }
  .xb-switch.is-sm { width: 28px; height: 16px; }
  .xb-switch.is-sm::after { width: 12px; height: 12px; }
  .xb-switch.is-sm[aria-checked="true"]::after { transform: translateX(12px); }

  /* 统一悬浮菜单 xb-menu（一项一行、说明进 title + aria-description） */
  .xb-menu {
    min-width: 184px; padding: 5px; border-radius: 12px;
    background: var(--ui-surface-raised); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: var(--ui-shadow-menu); color: var(--ui-text-primary); text-align: left; z-index: 60;
  }
  .xb-menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 10px;
    border-radius: 8px; font-size: 13px; color: var(--ui-text-primary); text-align: left;
    white-space: nowrap; transition: background .12s;
  }
  .xb-menu-item:hover, .xb-menu-item:focus-visible { background: var(--ui-surface-hover); outline: none; }
  .xb-menu-item > svg:first-child { color: var(--ui-text-secondary); }
  .xb-menu-item.is-active { background: var(--ui-soft); color: var(--ui-ink); font-weight: 500; }
  .xb-menu-item.is-danger, .xb-menu-item.is-danger > svg:first-child { color: var(--ui-danger); }
  .xb-menu-hint { margin-left: auto; font-size: 11.5px; color: var(--ui-text-tertiary); padding-left: 10px; }
  .xb-menu-sep { height: 1px; margin: 5px 6px; background: var(--ui-line); }
  .xb-menu-label { padding: 5px 10px 3px; font-size: 11px; font-weight: 600; color: var(--ui-text-tertiary); }

  /* ── 视图 1：伙伴页主画廊（聚焦卡片设计） ──────────────────────────── */
  .stage-center { display: flex; justify-content: center; }
  .console-shell {
    width: 100%; max-width: 1200px; min-height: 780px; max-height: 880px;
    display: grid; grid-template-columns: 216px minmax(0, 1fr);
    border-radius: 16px; overflow: hidden; background: var(--ui-tint);
    box-shadow: var(--ui-shadow-window); transition: max-width .24s ease, grid-template-columns .24s ease;
  }
  .console-shell[data-size="std"] { max-width: 960px; grid-template-columns: 196px minmax(0, 1fr); }
  .console-shell[data-size="narrow"] { max-width: 560px; grid-template-columns: 56px minmax(0, 1fr); }

  .sidebar {
    padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; user-select: none; overflow: hidden;
  }
  .traffic-row { display: flex; align-items: center; gap: 7px; padding: 2px 6px 12px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; flex: none; cursor: pointer; }
  .tl.c { background: var(--ui-window-close); }
  .tl.m { background: var(--ui-window-minimize); }
  .tl.e { background: var(--ui-window-expand); }
  .nav-item {
    height: 34px; padding: 0 10px; border-radius: 9px; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--ui-text-secondary); white-space: nowrap; overflow: hidden;
  }
  .nav-item.active { background: var(--ui-surface); color: var(--ui-text-primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .05); }
  .console-shell[data-size="narrow"] .nav-item { justify-content: center; padding: 0; }
  .console-shell[data-size="narrow"] .nav-item span { display: none; }
  .console-shell[data-size="narrow"] .traffic-row { justify-content: center; gap: 5px; padding: 2px 0 12px; }
  .console-shell[data-size="narrow"] .tl { width: 10px; height: 10px; }

  .console-main {
    margin: 8px 8px 8px 0; background: var(--ui-surface); border-radius: 12px;
    box-shadow: var(--ui-shadow-panel); display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    container-type: inline-size;
  }

  .studio-head { flex: none; display: flex; align-items: center; gap: 16px; padding: 20px 26px 0; }
  .xb-tabs-lg { display: flex; align-items: center; gap: 20px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .xb-tabs-lg button { font-size: 19px; font-weight: 600; color: var(--ui-text-disabled); white-space: nowrap; }
  .xb-tabs-lg button[aria-selected="true"] { color: var(--ui-text-primary); }
  .studio-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }

  .pt-toolbar {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 15px 26px 10px;
  }
  .pt-toolbar .cnt { font-weight: 500; color: var(--ui-text-secondary); margin-left: 3px; font-variant-numeric: tabular-nums; }
  .pt-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  .proactivity-pill {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border-radius: 999px; background: var(--ui-control); color: var(--ui-text-secondary);
    font-size: 12px; font-weight: 500; transition: background .15s, color .15s;
  }
  .proactivity-pill:hover { background: var(--ui-control-hover); color: var(--ui-text-primary); }
  .proactivity-pill.is-on { color: var(--ui-text-primary); }
  .proactivity-pill .p-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ui-text-disabled); }
  .proactivity-pill.is-on .p-dot { background: var(--ui-success); }
  .master-switch-wrap { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ui-text-secondary); }

  .pt-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 4px 26px 34px;
    scrollbar-width: thin; scrollbar-color: var(--ui-scrollbar) transparent;
  }
  .pt-banner {
    margin-top: 8px; padding: 9px 14px; border-radius: 10px;
    display: flex; align-items: center; gap: 10px; font-size: 12.5px;
    background: var(--ui-surface-sunken); color: var(--ui-text-secondary);
  }
  .pt-banner.is-warn { background: rgba(224, 154, 43, .12); color: var(--ui-warning-text); }
  .pt-banner .banner-act { margin-left: auto; }

  .pet-theme-detail { margin-top: 24px; }
  .pet-theme-detail:first-child { margin-top: 10px; }
  .th-head { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .th-head .theme-swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .th-head h2 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .th-head .sub { font-size: 12px; color: var(--ui-text-secondary); }
  .th-head .tag-custom {
    height: 18px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 500;
    background: var(--ui-control); color: var(--ui-text-secondary); display: inline-flex; align-items: center;
  }
  .theme-actions { margin-left: auto; position: relative; display: flex; align-items: center; gap: 6px; }

  /* ── 核心升级：新一代伙伴卡片体系（4 → 3 → 2 列自适应） ────────────── */
  .pet-cards {
    margin-top: 13px;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px;
  }
  @container (max-width: 780px) { .pet-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @container (max-width: 540px) {
    .pet-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .studio-head { padding: 16px 16px 0; }
    .pt-toolbar { padding: 12px 16px 8px; }
    .pt-scroll { padding: 4px 16px 24px; }
  }

  /* 卡片外壳：纯净中性画框 + 极简中性微光舞台 + 底部克制单行中性动作 */
  .pet-card-v2 {
    position: relative; min-width: 0;
    border-radius: 16px; padding: 8px 8px 10px;
    background: var(--ui-surface);
    box-shadow: var(--ui-shadow-card);
    display: flex; flex-direction: column; gap: 9px;
    transition: transform .22s cubic-bezier(.22, 1, .36, 1), box-shadow .22s ease, background .2s ease;
  }
  .pet-card-v2:hover {
    transform: translateY(-2px);
    box-shadow: var(--ui-shadow-card-hover);
  }
  .pet-card-v2.is-menu-open { z-index: 40; }
  .pet-card-v2.is-off .card-stage { opacity: .46; filter: grayscale(.55); }

  /* 舞台区：温润暖瓷柔光摄影棚，与陶瓷花盆和植物自然色彩高度和谐 */
  .card-stage {
    position: relative; aspect-ratio: 1.08; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 76% 62% at 50% 34%, #FFFFFF 0%, #FAF8F5 58%, #F1EDE7 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .92), inset 0 0 0 1px rgba(120, 106, 92, .065);
    cursor: pointer;
    transition: background .2s ease, box-shadow .2s ease;
  }
  html[data-theme="dark"] .card-stage {
    background: radial-gradient(ellipse 74% 58% at 50% 36%, #302E2C 0%, #242322 64%, #1C1B1A 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), inset 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .card-stage .pet-art-host {
    width: 86%; height: 86%; display: flex; align-items: center; justify-content: center;
    transition: transform .26s cubic-bezier(.34, 1.56, .64, 1);
  }
  .pet-card-v2:hover .card-stage .pet-art-host { transform: translateY(-4px) scale(1.03); }
  .card-stage.is-poked .pet-art-host { animation: petPoke .42s cubic-bezier(.34, 1.56, .64, 1); }

  /* 舞台角标：精简克制毛玻璃微标 */
  .stage-pill {
    position: absolute; top: 8px; height: 21px; padding: 0 7px; border-radius: 999px;
    background: color-mix(in srgb, var(--ui-surface) 90%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .06), inset 0 0 0 1px var(--ui-line);
    font-size: 10.5px; font-weight: 500; color: var(--ui-text-secondary);
    display: inline-flex; align-items: center; gap: 4px; z-index: 3; white-space: nowrap;
  }
  .stage-pill.left { left: 8px; }
  .stage-pill.right { right: 8px; }
  .stage-pill.is-clickable { cursor: pointer; transition: background .15s, color .15s; }
  .stage-pill.is-clickable:hover { background: var(--ui-surface); color: var(--ui-text-primary); }
  .stage-pill .live-dot { width: 5.5px; height: 5.5px; border-radius: 50%; background: var(--ui-success); }
  .stage-pill.is-muted .live-dot { background: var(--ui-text-disabled); }

  /* 图鉴卡底栏：全中性克制控件，不铺主题色色块 */
  .card-foot {
    display: flex; align-items: center; gap: 6px; padding: 0 3px; min-height: 28px; position: relative;
  }
  .card-name {
    flex: 1; min-width: 0; font-size: 13px; font-weight: 550; color: var(--ui-text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-cta-add {
    height: 28px; padding: 0 10px; border-radius: 8px; flex: none;
    background: var(--ui-control); color: var(--ui-text-primary);
    font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
    transition: background .15s, color .15s;
  }
  .pet-card-v2:hover .card-cta-add, .card-cta-add:hover, .card-cta-add[aria-expanded="true"] {
    background: var(--ui-control-hover);
  }
  .card-cta-manage {
    height: 28px; padding: 0 9px; border-radius: 8px; flex: none;
    background: var(--ui-control); color: var(--ui-text-primary);
    font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px;
    transition: background .15s;
  }
  .card-cta-manage:hover { background: var(--ui-control-hover); }
  .card-cta-plus {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    background: transparent; color: var(--ui-text-secondary);
    display: inline-grid; place-items: center; transition: background .15s, color .15s;
  }
  .card-cta-plus:hover, .card-cta-plus[aria-expanded="true"] { background: var(--ui-control); color: var(--ui-text-primary); }

  /* 实例管理卡（在桌面上）：两层清晰结构，零截断 */
  .inst-head {
    display: flex; align-items: center; gap: 6px; padding: 0 3px;
  }
  .inst-head .card-name { font-size: 13px; }
  .inst-sub {
    padding: 0 3px; margin-top: -5px; font-size: 11px; color: var(--ui-text-tertiary);
    display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden;
  }
  .inst-controls {
    display: flex; align-items: center; gap: 5px; padding: 0 2px; position: relative;
  }
  .inst-controls .xb-seg { flex: 1; }
  .inst-controls .xb-seg > button { flex: 1; padding: 0 4px; }

  .desk-summary {
    margin-top: 10px; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 10px; background: var(--ui-surface-sunken);
    font-size: 12px; color: var(--ui-text-secondary);
  }
  .desk-summary strong { color: var(--ui-text-primary); font-weight: 600; }
  .desk-summary .spacer { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .pop-anchor { position: relative; }
  .pop-menu { position: absolute; right: 0; top: calc(100% + 6px); }
  .pop-menu.is-left { left: 0; right: auto; }
  .pop-menu.is-up { top: auto; bottom: calc(100% + 6px); }

  .xb-empty {
    margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 44px 24px; border-radius: 16px; background: var(--ui-surface-sunken); text-align: center;
  }
  .xb-empty-icon {
    width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
    background: var(--ui-soft); color: var(--ui-ink);
  }
  .xb-empty h3 { margin: 2px 0 0; font-size: 15.5px; font-weight: 600; }
  .xb-empty p { margin: 0; max-width: 360px; font-size: 12.5px; color: var(--ui-text-secondary); }

  /* ── 视图 2：卡片全状态解剖展板（Design Spec） ──────────────────────── */
  .spec-wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .spec-section {
    background: var(--ui-surface); border-radius: 16px; padding: 20px 24px 26px;
    box-shadow: var(--ui-shadow-card);
  }
  .spec-section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--ui-line);
  }
  .spec-section-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .spec-section-head span { font-size: 12px; color: var(--ui-text-secondary); }
  .spec-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-items: start;
  }
  @media (max-width: 960px) { .spec-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .spec-slot { display: flex; flex-direction: column; gap: 10px; }
  .spec-label {
    font-size: 11.5px; font-weight: 600; color: var(--ui-text-secondary);
    display: flex; align-items: center; gap: 6px;
  }
  .spec-label .num {
    width: 18px; height: 18px; border-radius: 5px; background: var(--ui-control); color: var(--ui-text-secondary);
    font-size: 10.5px; display: inline-grid; place-items: center;
  }
  .spec-note { font-size: 11.5px; color: var(--ui-text-tertiary); line-height: 1.55; margin: 0; }
  /* 强制展示悬停态的样卡 */
  .pet-card-v2.force-hover { transform: translateY(-2px); box-shadow: var(--ui-shadow-card-hover); }
  .pet-card-v2.force-hover .card-stage .pet-art-host { transform: translateY(-4px) scale(1.03); }
  .pet-card-v2.force-hover .card-cta-add { background: var(--ui-control-hover); }
  .static-menu-preview { position: static; width: 100%; margin-top: 6px; }

  /* ── 视图 3 & 4：原生独立配置窗口（伙伴管理 / 主动陪伴） ────────────── */
  .win-workspace {
    max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .native-win {
    border-radius: 12px; overflow: hidden;
    background: var(--ui-configuration-canvas);
    box-shadow: var(--ui-shadow-window);
    color: var(--ui-text-primary);
  }
  .pet-settings-win {
    width: 704px; max-width: 100%; height: 504px;
    display: grid; grid-template-columns: 260px minmax(0, 1fr);
    background: #F4F4F6;
  }
  html[data-theme="dark"] .pet-settings-win { background: #1B1B1F; }
  @media (max-width: 700px) { .pet-settings-win { grid-template-columns: 1fr; height: auto; } }

  /* 左半边：纯净无框白展台，不套灰盒子，让小伴与花朵自由呼吸 */
  .ps-left {
    background:
      radial-gradient(ellipse 90% 48% at 50% 48%, rgba(255, 255, 255, 1) 0%, rgba(255, 255, 255, 0) 70%),
      linear-gradient(180deg, #FFFFFF 0%, #FFFFFF 64%, #F9F8F6 100%);
    padding: 14px 18px 14px; display: flex; flex-direction: column; align-items: center; min-height: 0;
    border-right: 1px solid var(--ui-line);
  }
  html[data-theme="dark"] .ps-left {
    background:
      radial-gradient(ellipse 86% 48% at 50% 46%, rgba(255, 255, 255, .045) 0%, transparent 72%),
      linear-gradient(180deg, #26262A 0%, #232327 68%, #1F1F23 100%);
    border-right: 1px solid rgba(255, 255, 255, .07);
  }
  .win-chrome { align-self: stretch; display: flex; align-items: center; gap: 7px; padding: 0 0 2px; user-select: none; }
  .ps-hero {
    flex: 1; width: 100%; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }

  .ps-stage-box {
    width: 224px; height: 224px; flex: none; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    cursor: pointer;
  }
  .ps-stage-box::after {
    content: ""; position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: 132px; height: 20px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(60, 48, 36, .10) 0%, transparent 72%);
  }
  html[data-theme="dark"] .ps-stage-box::after {
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .42) 0%, transparent 74%);
  }
  .ps-stage-box.is-hidden-pet { opacity: .44; filter: grayscale(.55); }
  .ps-preview-tag {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    height: 22px; padding: 0 9px; border-radius: 999px;
    background: var(--ui-soft); color: var(--ui-ink);
    font-size: 11px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
    opacity: 0; transition: opacity .15s ease; pointer-events: none; white-space: nowrap;
  }
  .ps-preview-tag.is-visible { opacity: 1; }

  /* 左栏内联改名（替代右栏占一整行的“名字输入框”） */
  .ps-name-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 2px; }
  .ps-name-btn {
    max-width: 100%; height: 30px; padding: 0 10px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 15px; font-weight: 600; color: var(--ui-text-primary);
    transition: background .14s;
  }
  .ps-name-btn:hover { background: var(--ui-surface-hover); }
  .ps-name-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ps-name-btn svg { color: var(--ui-text-tertiary); opacity: 0; transition: opacity .14s; }
  .ps-name-btn:hover svg { opacity: 1; }
  .ps-name-input {
    width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; text-align: center;
    background: var(--ui-configuration-surface); color: var(--ui-text-primary);
    font-size: 14.5px; font-weight: 600; outline: none; box-shadow: 0 0 0 2px var(--ui-btn);
  }
  .ps-name-input.is-err { box-shadow: 0 0 0 1.5px var(--ui-danger); }
  .ps-meta-line { font-size: 11.5px; color: var(--ui-text-secondary); text-align: center; }
  .ps-stage-hint { font-size: 11px; color: var(--ui-text-tertiary); text-align: center; }
  .ps-left-acts { width: 100%; display: flex; flex-direction: column; gap: 2px; padding-top: 6px; flex: none; }
  .ps-left-acts .xb-btn-ghost { width: 100%; justify-content: flex-start; height: 30px; font-size: 12px; }

  /* 右栏：三段直达工作台（常规 / 心情 / 形象），零拥挤下拉浮层 */
  .ps-right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .ps-right-head {
    flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 14px 20px 10px;
  }
  .ps-nav-seg { padding: 3px; border-radius: 9px; background: var(--ui-configuration-control); display: inline-flex; gap: 2px; }
  .ps-nav-seg button {
    height: 26px; padding: 0 13px; border-radius: 7px; font-size: 12.5px; color: var(--ui-text-secondary);
    transition: background .14s, color .14s, box-shadow .14s;
  }
  .ps-nav-seg button:hover { color: var(--ui-text-primary); }
  .ps-nav-seg button[aria-selected="true"] {
    background: var(--ui-configuration-surface); color: var(--ui-text-primary); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .09);
  }
  html[data-theme="dark"] .ps-nav-seg button[aria-selected="true"] { background: #48484C; }

  .ps-head-status {
    height: 22px; padding: 0 8px; border-radius: 999px;
    background: var(--ui-configuration-control); color: var(--ui-text-secondary); font-size: 11px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .ps-head-status i { width: 5.5px; height: 5.5px; border-radius: 50%; background: var(--ui-success); }
  .ps-head-status.off i { background: var(--ui-text-disabled); }

  .ps-scroll {
    flex: 1; min-height: 0; overflow-y: auto; padding: 2px 20px 16px;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--ui-scrollbar) transparent;
  }
  .cfg-card {
    background: var(--ui-configuration-group); border-radius: 12px; padding: 2px 14px;
    box-shadow: 0 1px 2px rgba(32, 26, 20, .035), 0 0 0 1px rgba(32, 26, 20, .055);
  }
  html[data-theme="dark"] .cfg-card {
    background: #28272B;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .065);
  }
  .cfg-row {
    display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 0;
    border-top: 1px solid var(--ui-line);
  }
  .cfg-row:first-child { border-top: 0; }
  .cfg-row.col { flex-direction: column; align-items: stretch; gap: 8px; padding: 11px 0; }
  .cfg-lbl { font-size: 13px; font-weight: 500; color: var(--ui-text-primary); min-width: 64px; flex: none; }
  .cfg-grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .cfg-err { font-size: 11px; color: var(--ui-danger); }

  /* 常规页里的直达摘要入口行（点一下进「心情」/「形象」） */
  .jump-row {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 0;
    border-top: 1px solid var(--ui-line); text-align: left; cursor: pointer;
  }
  .jump-row:first-child { border-top: 0; }
  .jump-row .jump-val {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--ui-text-secondary);
  }
  .jump-row:hover .jump-val { color: var(--ui-text-primary); }
  .jump-thumb {
    width: 24px; height: 24px; border-radius: 6px; background: var(--ui-configuration-control);
    display: grid; place-items: center; overflow: hidden;
  }

  /* 层级二选一轻卡片 */
  .layer-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .layer-card {
    height: 36px; padding: 0 11px; border-radius: 9px;
    background: #F4F2EE; color: var(--ui-text-secondary);
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500;
    transition: background .14s, color .14s, box-shadow .14s;
  }
  html[data-theme="dark"] .layer-card { background: #313036; }
  .layer-card:hover { color: var(--ui-text-primary); background: #EEEAE4; }
  html[data-theme="dark"] .layer-card:hover { background: #38373E; }
  .layer-card[aria-checked="true"] {
    background: var(--ui-configuration-surface); color: var(--ui-text-primary); font-weight: 600;
    box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--ui-btn) 42%, var(--ui-border-strong)), 0 2px 6px rgba(32, 26, 20, .06);
  }
  .layer-card .chk { margin-left: auto; opacity: 0; color: var(--ui-btn); }
  .layer-card[aria-checked="true"] .chk { opacity: 1; }

  /* 尺寸滑块 + 档位 */
  .size-head { display: flex; align-items: center; gap: 8px; }
  .size-val { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 500; color: var(--ui-text-secondary); margin-left: auto; }
  .size-presets { display: flex; gap: 4px; }
  .size-presets button {
    height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px;
    background: var(--ui-configuration-control); color: var(--ui-text-secondary);
  }
  .size-presets button.active { background: var(--ui-surface); color: var(--ui-text-primary); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .10); }
  html[data-theme="dark"] .size-presets button.active { background: #48484C; }
  .cfg-range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 5px; margin: 4px 0 2px; border-radius: 999px;
    background: linear-gradient(to right, var(--ui-btn) 0%, var(--ui-btn) var(--range-pct, 38%), var(--ui-configuration-control) var(--range-pct, 38%), var(--ui-configuration-control) 100%);
    outline: none; cursor: pointer;
  }
  .cfg-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .22), 0 0 0 1px rgba(0, 0, 0, .08);
  }

  /* 心情直选面板（彻底替代小下拉浮层 · 悬停实时预览 · 4 列免滚动） */
  .mood-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mood-filter-pills { display: inline-flex; gap: 4px; }
  .mood-filter-pills button {
    height: 24px; padding: 0 9px; border-radius: 7px; font-size: 11.5px;
    color: var(--ui-text-secondary); background: transparent;
  }
  .mood-filter-pills button:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }
  .mood-filter-pills button[aria-pressed="true"] {
    background: var(--ui-configuration-group); color: var(--ui-text-primary); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .07);
  }
  .mood-section-label { font-size: 11px; font-weight: 600; color: var(--ui-text-tertiary); padding: 6px 2px 4px; }
  .mood-section-label:first-child { padding-top: 2px; }
  .mood-board-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .mood-tile {
    height: 32px; padding: 0 9px; border-radius: 8px;
    background: var(--ui-configuration-group); color: var(--ui-text-primary);
    font-size: 12.5px; display: flex; align-items: center; justify-content: space-between; gap: 4px;
    box-shadow: 0 1px 1.5px rgba(32, 26, 20, .03), inset 0 0 0 1px rgba(32, 26, 20, .065);
    transition: background .12s, box-shadow .12s, color .12s;
  }
  html[data-theme="dark"] .mood-tile {
    background: #28272B;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
  }
  .mood-tile:hover, .mood-tile:focus-visible {
    background: #F6F3EE;
    box-shadow: inset 0 0 0 1px rgba(32, 26, 20, .14);
    outline: none;
  }
  html[data-theme="dark"] .mood-tile:hover, html[data-theme="dark"] .mood-tile:focus-visible {
    background: #333238;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16);
  }
  .mood-tile.on {
    background: var(--ui-soft); color: var(--ui-ink); font-weight: 600;
    box-shadow: inset 0 0 0 1.25px color-mix(in srgb, var(--ui-btn) 38%, transparent);
  }
  .mood-hover-note {
    font-size: 11px; color: var(--ui-text-tertiary); display: flex; align-items: center; justify-content: space-between; padding: 2px 2px 0;
  }

  .ps-foot {

/* ── 1:1 复刻原版陶瓷花盆 + 原版 WebP 植物贴图 + 原版冰蓝发光表情屏 ── */
function originalFaceMarkup(expr) {
  const line = '#eaf9ff', pink = '#ff6f9a', blush = '#ff6f91';
  const smileEyes = `<path d="M88 156A22 16 0 0 1 132 156M188 156A22 16 0 0 1 232 156" fill="none" stroke="${line}" stroke-width="8" stroke-linecap="round"/>`;
  const solidEyes = `<ellipse cx="110" cy="151" rx="18" ry="20" fill="${line}"/><ellipse cx="210" cy="151" rx="18" ry="20" fill="${line}"/>`;
  const catMouth = `<path d="M148 176Q154 183 160 176Q166 183 172 176" fill="none" stroke="${line}" stroke-width="4" stroke-linecap="round"/>`;
  const openMouth = `<path d="M148 173Q160 192 172 173Z" fill="${pink}" stroke="${line}" stroke-width="3.2" stroke-linejoin="round"/>`;
  const frownMouth = `<path d="M150 182Q160 174 170 182" fill="none" stroke="${line}" stroke-width="4" stroke-linecap="round"/>`;
  const cheeks = `<ellipse cx="80" cy="178" rx="10" ry="5.5" fill="${blush}" opacity="0.72"/><ellipse cx="240" cy="178" rx="10" ry="5.5" fill="${blush}" opacity="0.72"/>`;

  switch (expr) {
    case 'happy': case 'greeting': case 'speaking':
      return cheeks + smileEyes + (expr === 'happy' ? catMouth : openMouth);
    case 'excited': case 'laughing':
      return cheeks + `<path d="M95 140L123 151L95 162M225 140L197 151L225 162" fill="none" stroke="${line}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>` + openMouth;
    case 'love':
      return cheeks +
        `<path d="M110 166C92 153 86 138 98 132C105 129 110 137 110 140C110 137 115 129 122 132C134 138 128 153 110 166Z" fill="${pink}"/>` +
        `<path d="M210 166C192 153 186 138 198 132C205 129 210 137 210 140C210 137 215 129 222 132C234 138 228 153 210 166Z" fill="${pink}"/>` + catMouth;
    case 'sleepy': case 'sleeping':
      return `<path d="M90 151A20 13 0 0 0 130 151M190 151A20 13 0 0 0 230 151" fill="none" stroke="${line}" stroke-width="7.5" stroke-linecap="round"/>` + catMouth +
        `<text x="226" y="122" fill="${line}" font-size="16" font-weight="700" opacity="0.85">zZ</text>`;
    case 'curious': case 'confused':
      return solidEyes + `<circle cx="118" cy="147" r="7" fill="#050608"/><circle cx="218" cy="147" r="7" fill="#050608"/>` +
        `<circle cx="162" cy="176" r="5" fill="none" stroke="${line}" stroke-width="3.6"/>` +
        `<text x="230" y="124" fill="#ffd64d" font-size="18" font-weight="700">?</text>`;
    case 'thinking':
      return `<ellipse cx="110" cy="155" rx="18" ry="14" fill="${line}"/><ellipse cx="210" cy="155" rx="18" ry="14" fill="${line}"/>` +
        `<circle cx="116" cy="158" r="6" fill="#050608"/><circle cx="216" cy="158" r="6" fill="#050608"/>` +
        `<line x1="152" y1="176" x2="172" y2="176" stroke="${line}" stroke-width="4" stroke-linecap="round"/>`;
    case 'surprised':
      return `<circle cx="110" cy="151" r="20" fill="none" stroke="${line}" stroke-width="7"/><circle cx="210" cy="151" r="20" fill="none" stroke="${line}" stroke-width="7"/>` +
        `<circle cx="160" cy="177" r="6.5" fill="${line}"/>`;
    case 'shy': case 'embarrassed':
      return cheeks + smileEyes + catMouth;
    case 'sad': case 'worried': case 'crying':
      return `<path d="M92 158L128 146M228 158L192 146" stroke="${line}" stroke-width="8" stroke-linecap="round"/>` + frownMouth +
        (expr === 'crying' ? `<path d="M104 166V214M216 166V214" stroke="#5ec8ff" stroke-width="8" stroke-linecap="round" opacity="0.88"/>` : '');
    case 'angry': case 'annoyed':
      return `<path d="M92 144L128 158M228 144L192 158" stroke="${line}" stroke-width="8" stroke-linecap="round"/>` + frownMouth;
    case 'proud':
      return cheeks + `<ellipse cx="110" cy="151" rx="17" ry="19" fill="${line}"/><path d="M224 141L198 151L224 161" fill="none" stroke="${line}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>` + catMouth;
    case 'offline':
      return `<line x1="92" y1="151" x2="128" y2="151" stroke="#5fb6ff" stroke-width="7" stroke-linecap="round"/><line x1="192" y1="151" x2="228" y2="151" stroke="#5fb6ff" stroke-width="7" stroke-linecap="round"/>` + catMouth;
    case 'charging':
      return smileEyes + catMouth + `<text x="228" y="124" fill="#7be07b" font-size="18" font-weight="700">⚡</text>`;
    default: // idle / listening / waiting
      return solidEyes + catMouth;
  }
}

let uidSeq = 0;
function renderOriginalPet(pet, expr = 'happy') {

    plantFront = `<ellipse cx="160" cy="57" rx="9" ry="2.6" fill="#3b2418" opacity="0.6"/>

      <linearGradient id="${id}bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f0e8"/><stop offset="0.5" stop-color="#e4d9cb"/><stop offset="1" stop-color="#c9bba9"/></linearGradient>
      <radialGradient id="${id}screen" cx="0.5" cy="0.18" r="0.95"><stop offset="0" stop-color="#1d222c"/><stop offset="0.55" stop-color="#090a0e"/><stop offset="1" stop-color="#020203"/></radialGradient>
      <linearGradient id="${id}gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.09"/><stop offset="0.38" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="${id}earShell" x1="0.3" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#b9e66c"/><stop offset="1" stop-color="#6cb62f"/></linearGradient>
      <radialGradient id="${id}earLight" gradientUnits="userSpaceOnUse" cx="112" cy="-30" r="70"><stop offset="0" stop-color="#f6ffd8"/><stop offset="0.3" stop-color="#d4f58a"/><stop offset="0.62" stop-color="#8fd94a"/><stop offset="1" stop-color="#4fae2e"/></radialGradient>

      <clipPath id="${id}headClip"><path d="M70 56A90 10 0 0 1 250 56C276 62 296 104 296 156C296 214 268 252 222 252H98C52 252 24 214 24 156C24 104 44 62 70 56Z"/></clipPath>
      <clipPath id="${id}screenClip"><rect x="58" y="95" width="204" height="127" rx="45"/></clipPath>

      <path d="M70 56A90 10 0 0 1 250 56C276 62 296 104 296 156C296 214 268 252 222 252H98C52 252 24 214 24 156C24 104 44 62 70 56Z" fill="url(#${id}shade)"/>

        <ellipse cx="192" cy="58" rx="5" ry="1.6" fill="#6b4730"/><ellipse cx="214" cy="55" rx="4" ry="1.4" fill="#6b4730"/>

}

/* ── 工具函数 ── */
function findTheme(id) { return THEMES.find(t => t.id === id); }
function findPet(themeId, petId) { return findTheme(themeId)?.pets.find(p => p.id === petId); }
function onDeskOf(themeId, petId) { return state.instances.filter(i => i.themeId === themeId && i.petId === petId); }
function freqLabel(f) { return f === 'quiet' ? '安静' : f === 'lively' ? '活泼' : '自然'; }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── 评审子栏 ── */

  const bar = document.getElementById('subBar');
  if (state.view === 'page') {
    bar.innerHTML = `

      <div class="review-group">
        <button type="button" onclick="setPageSize('wide')" aria-pressed="${state.pageSize==='wide'}">宽屏 · 4 列</button>
        <button type="button" onclick="setPageSize('std')" aria-pressed="${state.pageSize==='std'}">标准 · 3 列</button>
        <button type="button" onclick="setPageSize('narrow')" aria-pressed="${state.pageSize==='narrow'}">窄窗 · 2 列</button>

      <span class="sep"></span>
      <span class="lbl">卡片状态校验</span>

    bar.innerHTML = `

      <span>并排检视图鉴卡（未添加 / 悬停态 / 已添单只 / 多实例菜单 / 轻量层级浮层）与实例管理卡（置顶 / 贴桌面 / 已隐藏）</span>
      <span class="hint">切换顶部 6 套主题色与深浅色，可检验每张卡在不同配色下的和谐度</span>`;
  } else if (state.view === 'settings') {
    bar.innerHTML = `
      <span class="lbl">审阅样本</span>
      <div class="review-group">
        ${state.instances.map(i => `<button type="button" onclick="selectEditing('${i.id}')" aria-pressed="${i.id===state.editingId}">${i.name}</button>`).join('')}

        <button type="button" onclick="setManageTab('general')" aria-pressed="${state.manageTab==='general'}">常规</button>
        <button type="button" onclick="setManageTab('mood')" aria-pressed="${state.manageTab==='mood'}">心情（25 态悬停预览）</button>

      <span class="hint">专注管理单只伙伴 · 点左侧名字内联重命名 · 悬停心情时左侧舞台实时试看</span>`;
  } else {
    bar.innerHTML = `
      <span class="lbl">主动陪伴 · 独立窗口</span>
      <span>精简冗长说明进悬停提示 · 悬停问候与频率联动禁用 · 中文环境感知芯片</span>
      <span class="hint">点击「完成」可返回伙伴页画廊</span>`;

}

function setPageSize(s) {
  state.pageSize = s;
  document.getElementById('consoleShell').dataset.size = s;
  renderSubBar();
}
function toggleMaster() {
  state.masterEnabled = !state.masterEnabled;
  toast(state.masterEnabled ? '已恢复显示全部桌面伙伴' : '已暂时隐藏全部桌面伙伴');
  renderAll();
}

/* ── 视图 1：渲染伙伴页 ── */
function renderPage() {
  document.getElementById('deskCountBadge').textContent = state.instances.length;
  document.querySelectorAll('#pageFilterSeg button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.filter === state.filter));
  });
  const pill = document.getElementById('proactivityPill');
  pill.classList.toggle('is-on', state.proactivity.enabled);
  document.getElementById('proactivityPillText').textContent = state.proactivity.enabled
    ? `主动陪伴 · ${freqLabel(state.proactivity.frequency)}`
    : '主动陪伴 · 已关';
  document.getElementById('masterSwitch').setAttribute('aria-checked', String(state.masterEnabled));

  const root = document.getElementById('pageScroll');
  let html = '';

  if (!state.masterEnabled) {
    html += `<div class="pt-banner">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M1 1l22 22"/></svg>

      <button type="button" class="xb-link banner-act" onclick="toggleMaster()">一键显示</button>
    </div>`;
  }
  if (state.showErrors) {
    html += `<div class="pt-banner is-warn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

      <button type="button" class="xb-link banner-act" onclick="state.showErrors=false;renderAll()">知道了</button>
    </div>`;
  }

  if (state.filter === 'desk') {
    if (!state.instances.length) {
      html += `<div class="xb-empty">
        <span class="xb-empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.9 4.8L19 9.7l-5.1 1.9L12 16.5l-1.9-4.9L5 9.7l5.1-1.9z"/></svg></span>

        <button type="button" class="xb-btn-primary is-sm" onclick="state.filter='all';renderPage()">去挑选伙伴</button>
      </div>`;
    } else {
      const visibleCount = state.instances.filter(i => i.enabled).length;
      html += `<div class="desk-summary">
        <span>共 <strong>${state.instances.length}</strong> 只在桌面上 · <strong>${visibleCount}</strong> 只显示中</span>
        <div class="spacer">
          <button type="button" class="xb-btn-ghost" onclick="toggleAllInstances(${visibleCount === 0})">${visibleCount === 0 ? '全部显示' : '全部隐藏'}</button>
        </div>
      </div>`;
      const groups = THEMES.map(t => ({ theme: t, items: state.instances.filter(i => i.themeId === t.id) })).filter(g => g.items.length);
      for (const g of groups) {
        html += `<section class="pet-theme-detail">
          <header class="th-head">
            <h2>${g.theme.name}</h2>
            <span class="sub">${g.items.length} 只</span>
          </header>
          <div class="pet-cards">
            ${g.items.map(inst => renderInstanceCard(g.theme, findPet(g.theme.id, inst.petId), inst)).join('')}
          </div>
        </section>`;
      }
    }
  } else if (state.filter === 'mine') {
    html += `<div class="xb-empty">
      <span class="xb-empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.9 4.8L19 9.7l-5.1 1.9L12 16.5l-1.9-4.9L5 9.7l5.1-1.9z"/></svg></span>
      <h3>你想象中的小伙伴，在这里诞生。</h3>
      <p>让 AI 创作你喜欢的自定义宠物主题，也可以导入别人分享的 ZIP 宠物资源包。</p>
      <button type="button" class="xb-btn-primary is-sm" onclick="toast('已打开创作对话')">开始创作</button>
    </div>`;
  } else {
    for (const theme of THEMES) {
      const themeMenuOpen = state.openMenu?.type === 'theme' && state.openMenu.key === theme.id;
      html += `<section class="pet-theme-detail">
        <header class="th-head" title="${theme.description}" aria-description="${theme.description}">
          <h2>${theme.name}</h2>
          <span class="sub">${theme.pets.length} 款</span>
          <div class="theme-actions">
            <button type="button" class="xb-icon-btn is-sm" aria-label="${theme.name}更多操作" onclick="toggleMenu(event,'theme','${theme.id}')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
            ${themeMenuOpen ? `<div class="xb-menu pop-menu" onclick="event.stopPropagation()">
              <button type="button" class="xb-menu-item" title="以当前主题为参考让 AI 创作新主题" onclick="closeMenu();toast('已带入「${theme.name}」参考进入创作')">基于此主题创作</button>
              <button type="button" class="xb-menu-item" title="导出此主题 JSON 结构作自定义参考" onclick="closeMenu();toast('已导出「${theme.name}」参考 JSON')">导出参考 JSON</button>
            </div>` : ''}
          </div>
        </header>
        <div class="pet-cards">
          ${theme.pets.map(pet => renderGalleryCard(theme, pet)).join('')}
        </div>
      </section>`;
    }
  }
  root.innerHTML = html;
}

/* ── 视图 3：重新设计的伙伴管理独立窗口（常规 / 心情 双段直达，专注单只伙伴） ── */
function openSettingsFor(id) {
  state.editingId = id;
  const inst = state.instances.find(i => i.id === id);
  state.editingSnapshot = inst ? { ...inst } : null;
  state.manageTab = 'general';
  state.hoverMood = null;
  state.renaming = false;
  state.confirmRemoveId = null;
  switchView('settings');
}

function setManageTab(tab) {
  state.manageTab = tab === 'mood' ? 'mood' : 'general';
  state.hoverMood = null;
  renderSettingsWindow();
}

function updateLeftStagePreview() {
  const inst = state.instances.find(i => i.id === state.editingId);
  if (!inst) return;
  const activeExpr = state.hoverMood || inst.expression;
  const theme = findTheme(inst.themeId);
  const pet = findPet(inst.themeId, inst.petId);
  const previewPx = Math.round(148 + ((inst.size - 80) / 340) * 70);
  const stageBox = document.getElementById('settingsStage');
  stageBox.classList.toggle('is-hidden-pet', !inst.enabled);
  const stageHost = document.getElementById('settingsStageSvg');
  stageHost.style.width = `${previewPx}px`;
  stageHost.style.height = `${previewPx}px`;
  stageHost.innerHTML = renderOriginalPet(pet, activeExpr);
  const tag = document.getElementById('psPreviewTag');
  if (tag) {
    tag.textContent = state.hoverMood ? `试看 · ${EXPRESSIONS[activeExpr]}` : '';
    tag.classList.toggle('is-visible', !!state.hoverMood);
  }
  document.getElementById('psMetaLine').textContent = `${theme?.name ?? ''} · ${pet?.name ?? ''} · ${inst.monitor}`;
}

  if (!state.instances.some(i => i.id === state.editingId)) state.editingId = state.instances[0]?.id || null;
  const inst = state.instances.find(i => i.id === state.editingId);
  renderSubBar();

  document.querySelectorAll('#psTabSeg button').forEach(b => {
    b.setAttribute('aria-selected', String(b.dataset.pstab === state.manageTab));

            <span class="size-val">${inst.size} px</span>

          <input type="range" class="cfg-range" min="80" max="420" step="10" value="${inst.size}" style="--range-pct:${sizePct}" aria-label="大小" oninput="updateEditing({size:Number(this.value)},true)" />
        </div>

      <div class="cfg-card">

          <div class="layer-cards" role="radiogroup" aria-label="显示层级">

            </button>

              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              贴在桌面

          <span class="cfg-lbl" style="flex:1">回应桌面状态</span>
          <button type="button" role="switch" class="xb-switch" aria-checked="${inst.links}" onclick="updateEditing({links:!${inst.links}})"></button>
        </div>
      </div>

      <div class="cfg-card">
        <button type="button" class="jump-row" onclick="setManageTab('mood')">
          <span class="cfg-lbl">心情</span>
          <span class="jump-val">${EXPRESSIONS[inst.expression]} · ${moodGroupName} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
        </button>
      </div>`;
  } else {
    const visibleGroups = state.moodGroupFilter === 'all'
      ? MOOD_GROUPS
      : MOOD_GROUPS.filter(g => g.name === state.moodGroupFilter);
    body.innerHTML = `
      <div class="mood-toolbar">
        <div class="mood-filter-pills" role="group" aria-label="心情分组">
          ${['all', '日常', '情绪', '状态'].map(g => `<button type="button" aria-pressed="${state.moodGroupFilter===g}" onclick="state.moodGroupFilter='${g}';renderSettingsWindow()">${g === 'all' ? '全部 25' : g}</button>`).join('')}

      </div>
      <div>
        ${visibleGroups.map(g => `
          ${state.moodGroupFilter === 'all' ? `<div class="mood-section-label">${g.name}</div>` : ''}
          <div class="mood-board-grid" role="listbox" aria-label="${g.name}">
            ${g.items.map(key => `
              <button type="button" role="option" class="mood-tile ${inst.expression===key?'on':''}" aria-selected="${inst.expression===key}"
                onpointerenter="previewMood('${key}')" onfocus="previewMood('${key}')"
                onpointerleave="previewMood(null)" onblur="previewMood(null)"
                onclick="updateEditing({expression:'${key}'})">
                <span>${EXPRESSIONS[key]}</span>
                ${inst.expression===key ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
              </button>`).join('')}

  footer.innerHTML = `
    <div class="spacer">
      ${state.confirmRemoveId === inst.id
        ? `<button type="button" class="xb-btn-ghost is-danger" onclick="removeInstance('${inst.id}')">确认从桌面移除</button>

        : `<button type="button" class="xb-btn-ghost is-danger" title="移除这只伙伴，主题作品仍保留" onclick="state.confirmRemoveId='${inst.id}';renderSettingsWindow()">从桌面移除</button>`}
    </div>
    <button type="button" class="xb-btn-ghost" onclick="revertEditing()">还原</button>
    <button type="button" class="xb-btn-primary flat is-sm" ${nameInvalid ? 'disabled' : ''} onclick="toast('设置已保存并同步');switchView('page')">完成</button>`;
}

function finishRename() {
  const inst = state.instances.find(i => i.id === state.editingId);
  if (inst && !inst.name.trim() && state.editingSnapshot) inst.name = state.editingSnapshot.name;
  state.renaming = false;
  renderSettingsWindow();
}
function previewMood(expr) { state.hoverMood = expr; updateLeftStagePreview(); }
function pickRandomMood() {
  const keys = Object.keys(EXPRESSIONS);
  const inst = state.instances.find(i => i.id === state.editingId);
  const pool = keys.filter(k => k !== inst?.expression);
  const chosen = pool[Math.floor(Math.random() * pool.length)];
  updateEditing({ expression: chosen });
  toast(`已切换心情：${EXPRESSIONS[chosen]}`);
}

    </div>
    <div class="cfg-card">
      <div class="cfg-row" title="独立授权：让问候参考本地时间、日历、已有天气缓存与当前任务状态">
        <span class="cfg-lbl" style="flex:1">环境上下文</span>
        <button type="button" role="switch" class="xb-switch" aria-checked="${p.contextEnabled}" onclick="pToggle('contextEnabled')"></button>
      </div>
      <div class="cfg-row" title="用于区分工作日、休息日、法定节假日与调休">
        <span class="cfg-lbl" style="flex:1">节假日地区</span>
        <select class="pw-select" ${!p.contextEnabled ? 'disabled' : ''} onchange="state.proactivity.calendarRegion=this.value==='CN'?'CN':null;renderProactivityWindow()">
          <option value="none" ${!p.calendarRegion?'selected':''}>未指定 · 不推断节假日</option>
          <option value="CN" ${p.calendarRegion==='CN'?'selected':''}>中国大陆（含节假日与调休）</option>
        </select>
      </div>
    </div>
    ${p.contextEnabled ? `<div class="context-card">
      <div class="context-head">
        <span>最近感知状态</span>
        <button type="button" class="xb-link" onclick="refreshEnv()">刷新</button>
      </div>
      <div class="context-chips">
        <span class="ctx-chip">${p.env.date}</span>
        <span class="ctx-chip">${p.calendarRegion ? p.env.dayKind : '未指定地区'}</span>
        <span class="ctx-chip">${p.env.weather}</span>
        <span class="ctx-chip">${p.env.activity}</span>
        <span class="ctx-chip">${p.env.task}</span>
      </div>
    </div>` : ''}
    <div style="display:flex;justify-content:flex-end;padding-top:2px">
      <button type="button" class="xb-btn-primary flat is-sm" onclick="toast('主动陪伴设置已保存');switchView('page')">完成</button>
    </div>`;
}

/* ── 交互事件 ── */
function pokeCard(el) {
  el.classList.remove('is-poked');
  void el.offsetWidth;
  el.classList.add('is-poked');
}
function toggleMenu(event, type, key) {
  event.stopPropagation();
  if (state.openMenu && state.openMenu.type === type && state.openMenu.key === key) { closeMenu(); return; }
  const rect = event.currentTarget.getBoundingClientRect();
  state.openMenu = { type, key, up: window.innerHeight - rect.bottom < 190 };
  if (state.view === 'page') renderPage();
}
function closeMenu() { state.openMenu = null; if (state.view === 'page') renderPage(); }
function handleCardManage(event, themeId, petId) {
  const items = onDeskOf(themeId, petId);
  if (items.length === 1) { openSettingsFor(items[0].id); return; }
  toggleMenu(event, 'manage', `${themeId}/${petId}`);
}
function addPet(themeId, petId, layer) {
  const pet = findPet(themeId, petId);
  const existing = onDeskOf(themeId, petId).length;
  const inst = {
    id: 'pet-' + (++nextId), themeId, petId,
    name: existing ? `${pet.name} ${existing + 1}` : pet.name,
    size: 210, expression: 'happy', layer, enabled: true, links: true, monitor: '主屏'
  };
  state.instances.push(inst);
  if (!state.masterEnabled) state.masterEnabled = true;
  state.openMenu = null;
  toast(`已将「${inst.name}」添加到桌面（${layer === 'topmost' ? '始终置顶' : '贴在桌面'}）`);
  renderAll();
}
function toggleInstance(id) {
  const inst = state.instances.find(i => i.id === id);
  if (!inst) return;
  inst.enabled = !inst.enabled;
  renderAll();
}
function toggleAllInstances(show) {
  state.instances.forEach(i => { i.enabled = show; });
  toast(show ? '已显示全部桌面伙伴' : '已隐藏全部桌面伙伴');
  renderAll();
}
function setInstLayer(id, layer) {
  const inst = state.instances.find(i => i.id === id);
  if (!inst || inst.layer === layer) return;
  inst.layer = layer;
  toast(`「${inst.name}」已切换为${layer === 'topmost' ? '始终置顶' : '贴在桌面'}`);
  renderAll();
}
function removeInstance(id) {
  const idx = state.instances.findIndex(i => i.id === id);
  if (idx < 0) return;
  const [removed] = state.instances.splice(idx, 1);
  if (state.editingId === id) state.editingId = state.instances[0]?.id || null;
  state.openMenu = null;
  state.confirmRemoveId = null;
  toast(`已从桌面移除「${removed.name}」`);
  renderAll();
}
function selectEditing(id) {
  state.editingId = id;
  const inst = state.instances.find(i => i.id === id);
  state.editingSnapshot = inst ? { ...inst } : null;
  state.settingsDropdown = null;
  state.confirmRemoveId = null;
  renderSettingsWindow();
}
function toggleSettingsDrop(event, kind) {
  event.stopPropagation();
  state.settingsDropdown = state.settingsDropdown === kind ? null : kind;
  renderSettingsWindow();
}
function updateEditing(patch, lightUpdate = false) {
  const inst = state.instances.find(i => i.id === state.editingId);
  if (!inst) return;
  Object.assign(inst, patch);
  if (lightUpdate) {
    updateLeftStagePreview();
    const valEl = document.querySelector('.size-val');
    if (valEl) valEl.textContent = `${inst.size} px`;
    const rangeEl = document.querySelector('.cfg-range');
    if (rangeEl) rangeEl.style.setProperty('--range-pct', `${((inst.size - 80) / 340) * 100}%`);
  } else {
    renderSettingsWindow();
  }
}
function revertEditing() {
  const inst = state.instances.find(i => i.id === state.editingId);
  if (inst && state.editingSnapshot) {
    Object.assign(inst, state.editingSnapshot);
    toast('已还原本次改动');
    renderSettingsWindow();
  }
}
function pToggle(field) {
  state.proactivity[field] = !state.proactivity[field];
  renderProactivityWindow();
  toast('感知与陪伴设置已保存');
}
function refreshEnv() {
  const weathers = ['多云 · 19°C', '晴 · 22°C', '小雨 · 15°C'];
  const idx = (weathers.indexOf(state.proactivity.env.weather) + 1) % weathers.length;
  state.proactivity.env.weather = weathers[idx];
  renderProactivityWindow();
  toast('已读取最近一次本地感知状态');
}
document.getElementById('settingsStage').addEventListener('click', () => {
  const box = document.getElementById('settingsStageSvg');
  box.style.transform = 'scale(1.06, .92)';
  setTimeout(() => { box.style.transform = ''; }, 180);
});

function switchView(view) {
  state.view = view;
  ['page', 'spec', 'settings', 'proactivity'].forEach(v => {
    document.getElementById(`view-${v}`).hidden = v !== view;
  });
  document.querySelectorAll('[data-view]').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.view === view));
  });
  renderAll();
}
function renderAll() {
  renderSubBar();
  if (state.view === 'page') renderPage();
  else if (state.view === 'spec') renderSpecBoard();
  else if (state.view === 'settings') renderSettingsWindow();
  else renderProactivityWindow();
}

document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => switchView(btn.dataset.view)));
document.querySelectorAll('[data-theme-btn]').forEach(btn => btn.addEventListener('click', () => {
  document.documentElement.dataset.theme = btn.dataset.themeBtn;
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
}));
document.querySelectorAll('[data-accent-btn]').forEach(btn => btn.addEventListener('click', () => {
  document.documentElement.dataset.accent = btn.dataset.accentBtn;
  document.querySelectorAll('[data-accent-btn]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
}));
document.querySelectorAll('#pageFilterSeg button').forEach(btn => btn.addEventListener('click', () => {
  state.filter = btn.dataset.filter;
  state.openMenu = null;
  renderPage();
}));
document.querySelectorAll('#psTabSeg button').forEach(btn => btn.addEventListener('click', () => {
  setManageTab(btn.dataset.pstab);
}));
document.getElementById('masterSwitch').addEventListener('click', toggleMaster);

document.addEventListener('click', (e) => {
  const el = e.target;
  if (state.openMenu && !el?.closest?.('.xb-menu, .pop-anchor, .theme-actions, .card-foot, .inst-controls')) closeMenu();
  if (state.settingsDropdown && !el?.closest?.('.pop-anchor, .mood-panel, .plant-panel')) { state.settingsDropdown = null; renderSettingsWindow(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.openMenu) closeMenu();
    if (state.settingsDropdown) { state.settingsDropdown = null; renderSettingsWindow(); }
  }
});

(function initFromQuery() {
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'dark') {
    document.documentElement.dataset.theme = 'dark';
    document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeBtn === 'dark')));
  }
  if (q.get('accent')) {
    document.documentElement.dataset.accent = q.get('accent');
    document.querySelectorAll('[data-accent-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.accentBtn === q.get('accent'))));
  }
  const tab = q.get('tab');
  if (tab && ['all', 'desk', 'mine'].includes(tab)) state.filter = tab;
  const view = q.get('view');
  if (view && ['page', 'spec', 'settings', 'proactivity'].includes(view)) switchView(view);
  else switchView('page');
})();
</script>
</body>
</html>
