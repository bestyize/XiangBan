  ];
  const byId = id => [...assets,...folderFiles].find(a => a.id === id);
  const art = (kind='day',extra='') => `<div class="xb-art ${kind} ${extra}" role="img" aria-label="${kind==='night'?'月光下的山野':kind==='pine'?'松林与远山':'夕阳下的山野'}演示图片"></div>`;
  const designArt = (brand=false) => `<div class="xb-design-art"><div class="xb-design-copy"><small>WILD CAMP · ${brand?'BRAND BOOK':'EST. 2026'}</small><b>${brand?'在自然里，<br>找到自己。':'把周末，<br>交给山野。'}</b><em>${brand?'视觉识别规范':'探索秋日营地 ↗'}</em></div>${art(brand?'pine':'day')}</div>`;
  let saved = window.openai?.widgetState?.privateContent || {};
  let stateRevision = Number(saved.__revision)||0;
  const states = {};
  const restore = {};
  const persist = () => {
    const prefs = Object.fromEntries(Object.entries(states).map(([k,s]) => [k,{tab:s.tab,pinned:s.pinned,open:s.open}]));
    prefs.__revision=++stateRevision;
    const chosen = Object.values(states).find(s => s.preview);
    if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{selectedAsset:chosen?.preview || null},privateContent:prefs}).catch(()=>{});
  };
  const refreshIcons = () => { if (globalThis.lucide) lucide.createIcons({root,attrs:{width:16,height:16}}); };
  root.querySelectorAll('[data-variant]').forEach((variant,index) => {
    const key = index?'rail':'popover';
    const old = saved[key] || {};
    const s = states[key] = {tab:old.tab||'all',pinned:old.pinned??Boolean(index),open:old.open??true,query:'',folder:'',preview:'',menu:'',empty:false,missing:false};
    variant.innerHTML = `<div class="xb-app" aria-label="小伴桌面对话">
      <aside class="xb-side"><div class="xb-traffic" aria-hidden="true"><span></span><span></span><span></span></div><div class="xb-brand">${icon('sparkles')}小伴</div>
        <nav aria-label="主导航"><button class="cursor-interaction" data-demo="新建任务">${icon('plus')}新建任务</button><button class="cursor-interaction" data-demo="资料库">${icon('library')}资料库</button><button class="cursor-interaction" data-demo="装扮">${icon('palette')}装扮</button></nav>
        <div><div class="xb-side-label">工作区</div><nav aria-label="工作区对话"><button class="cursor-interaction xb-session" data-demo="品牌工作区">${icon('folder-closed')}品牌工作区</button><button class="cursor-interaction xb-session is-active" data-demo="当前对话">山野露营 · 品牌视觉</button><button class="cursor-interaction xb-session" data-demo="秋日活动文案">秋日活动文案</button></nav></div>
        <div class="xb-account"><span class="xb-avatar">${icon('sparkles')}</span><span>我的小伴</span></div>
      </aside>
      <div class="xb-work"><header class="xb-head"><div class="xb-crumb"><span class="xb-muted">品牌工作区</span>${icon('chevron-right')}<strong>山野露营 · 品牌视觉</strong></div>
        <div class="xb-head-actions"><button class="cursor-interaction xb-assets-toggle" data-action="toggle" aria-label="打开对话资产" aria-expanded="true">${icon('files')}<span>资产</span><span class="xb-count">8</span></button><button class="cursor-interaction xb-icon" aria-label="搜索对话" data-demo="搜索对话">${icon('search')}</button><button class="cursor-interaction xb-icon" aria-label="执行面板" data-demo="执行面板">${icon('panel-right')}</button><button class="cursor-interaction xb-icon" aria-label="更多对话操作" data-demo="更多对话操作">${icon('ellipsis')}</button></div>
      </header><div class="xb-main">
        <main class="xb-chat"><div class="xb-date">今天 · 14:32</div><div class="xb-user">帮我做一套山野露营的品牌视觉，包含活动页、配图和可以交付的文件。</div>
          <div class="xb-answer"><span class="xb-avatar">${icon('sparkles')}</span><div class="xb-answer-body"><div><div class="xb-answer-name">小伴</div><p>做好了，整体采用自然绿与暖沙色，让画面保留一点山野的松弛感。</p></div>
            <div class="xb-message" data-message="design"><button class="cursor-interaction xb-inline-design" data-open="design-landing" aria-label="预览山野露营活动页">${designArt()}<span class="xb-inline-caption"><span>${icon('panels-top-left')}山野露营 · 活动页</span>${icon('arrow-up-right')}</span></button></div>
            <div class="xb-message" data-message="images"><p>3 张配图已生成，主视觉、夜景和松林可以搭配使用。</p></div>
            <div class="xb-message" data-message="files"><p style="margin-bottom:9px">品牌手册和页面源码也整理好了：</p><div class="xb-mini-files"><button class="cursor-interaction" data-open="file-brand">${icon('file-text')}品牌手册.pdf</button><button class="cursor-interaction" data-open="folder-site">${icon('folder')}活动页源码</button></div></div>
            <div class="xb-reply-tools"><button class="cursor-interaction xb-icon" data-demo="复制回答" aria-label="复制回答">${icon('copy')}</button><button class="cursor-interaction xb-icon" data-demo="重新生成" aria-label="重新生成">${icon('rotate-ccw')}</button></div>
          </div></div>
          <div class="xb-composer"><div class="xb-compose-box"><textarea aria-label="发送消息给小伴" placeholder="继续调整，或聊点别的…"></textarea><div class="xb-compose-tools"><button class="cursor-interaction xb-icon" data-demo="添加附件" aria-label="添加附件">${icon('plus')}</button><span class="xb-model">小伴 AI</span><button class="cursor-interaction xb-icon xb-send" data-demo="发送消息" aria-label="发送消息">${icon('arrow-up')}</button></div></div></div>
        </main>
        <aside class="xb-assets" aria-label="对话资产"><div class="xb-panel-head"><strong>对话资产</strong><span class="xb-count">8</span><span class="xb-spacer"></span><button class="cursor-interaction xb-icon" data-action="pin" data-tooltip="固定为侧栏" aria-label="固定为侧栏">${icon('panel-right-open')}</button><button class="cursor-interaction xb-icon" data-action="import" data-tooltip="导入文件、文件夹或设计源文件" aria-label="导入资产">${icon('plus')}</button><button class="cursor-interaction xb-icon" data-action="close" aria-label="收起对话资产">${icon('x')}</button></div>
          <label class="xb-panel-search">${icon('search')}<input type="search" placeholder="搜索资产" aria-label="搜索当前对话资产"></label>
          <div class="xb-tabs" role="tablist" aria-label="资产类型">${[['all','全部',8],['design','设计稿',2],['image','图片',3],['file','文件',3]].map(([id,label,count])=>`<button class="cursor-interaction" type="button" role="tab" id="${key}-tab-${id}" aria-controls="${key}-assets-list" aria-selected="${id===s.tab}" data-tab="${id}">${label}<span class="xb-tab-count">${count}</span></button>`).join('')}</div>
          <div class="xb-assets-content" id="${key}-assets-list" role="tabpanel" aria-labelledby="${key}-tab-${s.tab}"></div><div class="xb-panel-foot"><span>当前对话</span><span>最近更新优先</span></div>
        </aside>
      </div><section class="xb-window" hidden aria-label="资产独立预览窗口"></section><div class="xb-menu" hidden aria-label="资产操作"></div></div><div class="xb-toast" role="status" aria-live="polite" hidden></div>
    </div>`;
    const app = variant.querySelector('.xb-app');
    const panel = app.querySelector('.xb-assets');
    const content = app.querySelector('.xb-assets-content');
    const win = app.querySelector('.xb-window');
    const menu = app.querySelector('.xb-menu');
    const toastBox = app.querySelector('.xb-toast');
    let toastTimer;
    function toast(text) { toastBox.textContent=text; toastBox.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastBox.hidden=true,2600); }
    function row(a) {
      const missing = s.missing && a.id==='file-brand';
      return `<div class="xb-asset-row"><button class="cursor-interaction xb-asset-open" data-open="${a.id}" data-tooltip="${escape(a.path)}" aria-description="${escape(a.path)}"><span class="xb-file-icon ${a.type}">${icon(a.icon)}</span><span class="xb-name">${escape(a.name)}</span><span class="${missing?'xb-missing':'xb-row-meta'}">${missing?'已失效':a.meta}</span></button><button class="cursor-interaction xb-row-more" data-more="${a.id}" aria-label="${escape(a.name)}的更多操作">${icon('ellipsis')}</button></div>`;
    }
    function render() {
      app.classList.toggle('xb-rail-open',s.pinned&&s.open);
      panel.hidden=!s.open;
      const total=s.empty?0:8;
      app.querySelectorAll('.xb-head .xb-count,.xb-panel-head .xb-count').forEach(x=>x.textContent=total);
      app.querySelector('[data-action=toggle]').setAttribute('aria-expanded',String(s.open));
      const pin=app.querySelector('[data-action=pin]');
      pin.setAttribute('aria-label',s.pinned?'切换为浮层':'固定为侧栏');
      pin.setAttribute('data-tooltip',s.pinned?'切换为浮层':'固定为侧栏');
      pin.innerHTML=icon(s.pinned?'panel-right-close':'panel-right-open');
      app.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===s.tab));b.querySelector('.xb-tab-count').textContent=s.empty?0:({all:8,design:2,image:3,file:3}[b.dataset.tab]);});
      content.setAttribute('aria-labelledby',`${key}-tab-${s.tab}`);
      const query=s.query.trim().toLowerCase();
      const list=(s.empty?[]:assets).filter(a=>(s.tab==='all'||a.type===s.tab)&&(!query||a.name.toLowerCase().includes(query)));
      if(s.folder&&!s.empty) {
        const nested=s.folder==='child-assets';
        content.innerHTML=`<div class="xb-folder-head"><button class="cursor-interaction" data-action="back" aria-label="返回上一层">${icon('arrow-left')}</button><span>${nested?'源码 / assets':'露营活动页源码'}</span></div>`+(nested?`<div class="xb-images is-large">${assets.filter(a=>a.type==='image').map(a=>`<div class="xb-image-item"><button class="cursor-interaction" data-open="${a.id}">${art(a.art)}<span class="xb-name">${a.name}</span></button></div>`).join('')}</div>`:folderFiles.map(row).join(''));
      } else if(!list.length) {
        content.innerHTML=`<div class="xb-empty">${icon(s.empty?'files':'search')}<span>${s.empty?'这段对话还没有资产':'没有找到相关资产'}</span>${query?'<button class="cursor-interaction" data-action="clear-search">清除搜索</button>':''}</div>`;
      } else {
        content.innerHTML=['design','image','file'].map(type=>{
          const items=list.filter(a=>a.type===type);if(!items.length)return '';
          return `<section class="xb-section"><div class="xb-section-head"><span>${{design:'设计稿',image:'生成图片',file:'交付文件'}[type]}</span><span>${items.length}</span></div>${type==='image'?`<div class="xb-images ${s.tab==='image'?'is-large':''}">${items.map(a=>`<div class="xb-image-item"><button class="cursor-interaction" data-open="${a.id}" data-tooltip="${a.name} · ${a.meta}">${art(a.art)}<span class="xb-name">${a.name}</span></button></div>`).join('')}</div>`:items.map(row).join('')}</section>`;
        }).join('');
      }
      refreshIcons();
    }
    function preview(a) {
      if(a.folder) {s.folder=a.id;s.open=true;s.tab='file';s.query='';app.querySelector('input').value='';render();persist();return;}
      s.preview=a.id;s.menu='';menu.hidden=true;
      const missing=s.missing&&a.id==='file-brand';
      const body=missing?`<div class="xb-empty">${icon('file-warning')}<span>原文件已移动或删除</span><button class="cursor-interaction" data-action="locate">定位交付消息</button></div>`:a.type==='design'?designArt(a.id==='design-brand'):a.type==='image'?art(a.art,'xb-preview-art'):`<article class="xb-document"><h2>${a.id==='file-brand'?'山野露营':escape(a.name)}</h2><p class="xb-muted">${a.id==='file-brand'?'品牌视觉指南 · 2026 秋季':'交付说明'}</p><p>${a.id==='child-index'?'&lt;main class="wild-camp"&gt;':a.id==='child-style'?'.wild-camp { color: #243e34; }':'让每一次出发，都更接近自然。'}</p><div class="xb-doc-line"></div><div class="xb-doc-line" style="width:90%"></div><div class="xb-doc-line" style="width:65%"></div><p style="margin-top:25px">${a.id==='file-brand'?'01 / 品牌色彩与视觉语言':'活动页面、品牌手册与配图已整理完成。'}</p></article>`;
      win.innerHTML=`<div class="xb-window-bar"><div class="xb-traffic"><button class="cursor-interaction" data-action="preview-close" aria-label="关闭预览窗口"></button><span></span><span></span></div><strong>${escape(a.name)}</strong><button class="cursor-interaction xb-icon xb-window-close" data-action="preview-close" aria-label="关闭预览">${icon('x')}</button></div><div class="xb-window-body">${body}</div><div class="xb-window-foot"><span class="xb-muted">${missing?'文件不可用':a.type==='design'?`${a.meta} · 设计画布`:a.meta}</span>${a.type==='image'?`<button class="cursor-interaction xb-icon" data-action="previous-image" aria-label="上一张图片">${icon('chevron-left')}</button><button class="cursor-interaction xb-icon" data-action="next-image" aria-label="下一张图片">${icon('chevron-right')}</button>`:''}<button class="cursor-interaction" data-action="locate">${icon('message-square')}定位消息</button>${missing?'':`<button class="cursor-interaction xb-primary" data-action="${a.type==='design'?'edit-design':'save'}">${icon(a.type==='design'?'arrow-up-right':'download')}${a.type==='design'?'打开画布':'另存为'}</button>`}</div>`;
      win.hidden=false;refreshIcons();persist();
      win.querySelector('[data-action=preview-close]').focus({preventScroll:true});
    }
    function locate(a) {
      win.hidden=true;s.preview='';menu.hidden=true;s.menu='';
      if(!s.pinned) {s.open=false;render();}
      app.querySelectorAll('.is-located').forEach(x=>x.classList.remove('is-located'));
      const message=app.querySelector(`[data-message="${a.message}"]`);message.classList.add('is-located');
      toast('已定位到对应消息');setTimeout(()=>message.classList.remove('is-located'),3500);persist();
    }
    app.addEventListener('click',event=>{
      const b=event.target.closest('button');if(!b)return;
      if(b.dataset.demo) {toast(`${b.dataset.demo} · 原型演示`);return;}
      if(b.dataset.open) {preview(byId(b.dataset.open));return;}
      if(b.dataset.tab) {s.tab=b.dataset.tab;s.folder='';s.menu='';menu.hidden=true;render();persist();return;}
      if(b.dataset.more) {
        const a=byId(b.dataset.more);s.menu=a.id;
        menu.innerHTML=`<button class="cursor-interaction" data-action="menu-open">${icon(a.folder?'folder-open':'external-link')}${a.folder?'打开文件夹':'打开'}</button><button class="cursor-interaction" data-action="locate">${icon('message-square')}定位消息</button><button class="cursor-interaction" data-action="copy-path">${icon('copy')}复制路径</button><button class="cursor-interaction" data-action="reveal">${icon('folder-open')}在文件夹中显示</button>`;
        const rect=b.getBoundingClientRect(), parent=app.querySelector('.xb-work').getBoundingClientRect();
        menu.style.top=`${Math.min(rect.bottom-parent.top+3,460)}px`;menu.hidden=false;refreshIcons();return;
      }
      const action=b.dataset.action;
      if(action==='import') {s.menu='';menu.style.top='48px';menu.innerHTML=`<button class="cursor-interaction" data-demo="导入文件">${icon('file-text')}导入文件</button><button class="cursor-interaction" data-demo="导入文件夹">${icon('folder')}导入文件夹</button><button class="cursor-interaction" data-demo="导入设计源文件">${icon('panels-top-left')}导入设计源文件</button>`;menu.hidden=false;refreshIcons();}
      if(action==='toggle') {s.open=!s.open;menu.hidden=true;render();persist();}
      if(action==='close') {s.open=false;menu.hidden=true;render();persist();app.querySelector('[data-action=toggle]').focus({preventScroll:true});}
      if(action==='pin') {s.pinned=!s.pinned;render();persist();}
      if(action==='back') {s.folder=s.folder==='child-assets'?'folder-site':'';render();}
      if(action==='clear-search') {s.query='';app.querySelector('input').value='';render();}
      if(action==='preview-close') {win.hidden=true;s.preview='';persist();app.querySelector('[data-action=toggle]').focus({preventScroll:true});}
      if(action==='menu-open')preview(byId(s.menu));
      if(action==='locate')locate(byId(s.menu||s.preview));
      if(action==='copy-path') {menu.hidden=true;toast('路径已复制 · 演示');}
      if(action==='reveal') {menu.hidden=true;toast('在系统文件管理器中显示 · 演示');}
      if(action==='save')toast('另存为… · 演示，不会写入本机文件');
      if(action==='edit-design')toast('打开独立设计画布 · 演示');
      if(action==='previous-image'||action==='next-image') {
        const images=assets.filter(a=>a.type==='image'),current=images.findIndex(a=>a.id===s.preview);
        preview(images[(current+(action==='next-image'?1:2))%3]);
      }
    });
    app.querySelector('input').addEventListener('input',event=>{s.query=event.target.value;s.folder='';render();});
    app.addEventListener('keydown',event=>{
      if(event.key==='Escape') {
        if(!menu.hidden) {menu.hidden=true;s.menu='';return;}
        if(!win.hidden) {win.hidden=true;s.preview='';persist();return;}
        s.open=false;render();persist();app.querySelector('[data-action=toggle]').focus({preventScroll:true});
      }
      const tab=event.target.closest('[data-tab]');
      if(tab&&['ArrowRight','ArrowLeft','Home','End'].includes(event.key)) {
        event.preventDefault();const tabs=[...app.querySelectorAll('[data-tab]')],pos=tabs.indexOf(tab);
        const next=event.key==='Home'?0:event.key==='End'?3:(pos+(event.key==='ArrowRight'?1:3))%4;
        tabs[next].click();tabs[next].focus();
      }
    });
    app.addEventListener('pointerdown',event=>{
      if(!event.target.closest('.xb-menu')&&!event.target.closest('[data-more]')) {menu.hidden=true;s.menu='';}
      if(!s.pinned&&s.open&&!event.target.closest('.xb-assets')&&!event.target.closest('[data-action=toggle]')&&!event.target.closest('.xb-window')&&!event.target.closest('.xb-menu')&&!event.target.closest('[data-open]')) {s.open=false;render();persist();}
    });
    render();
    restore[key] = incoming => {
      if (!incoming) return;
      let changed=false;
      if (['all','design','image','file'].includes(incoming.tab)&&s.tab!==incoming.tab) {s.tab=incoming.tab;changed=true;}
      if (typeof incoming.pinned==='boolean'&&s.pinned!==incoming.pinned) {s.pinned=incoming.pinned;changed=true;}
      if (typeof incoming.open==='boolean'&&s.open!==incoming.open) {s.open=incoming.open;changed=true;}
      if(changed)render();
    };
    if(globalThis.Tweak) {
      const options={appearance:'跟随系统',scenario:'完整资产',accent:'小伴红'};
      const tweak=new Tweak({container:app,onChange:()=>{
        app.style.colorScheme=options.appearance==='浅色'?'light':options.appearance==='深色'?'dark':'light dark';
        s.empty=options.scenario==='空对话';s.missing=options.scenario==='文件失效';
        if(options.accent==='松林绿') {app.style.setProperty('--ui-btn','light-dark(#2b7658,#70cfa5)');app.style.setProperty('--ui-soft','light-dark(#e8f2ec,#233e31)');app.style.setProperty('--ui-ink','light-dark(#225d45,#a0e3be)');}
        else {['--ui-btn','--ui-soft','--ui-ink'].forEach(p=>app.style.removeProperty(p));}
        render();if(s.preview)preview(byId(s.preview));
      }});
      tweak.addSelect(options,'appearance',{label:'外观',options:['跟随系统','浅色','深色']});
      tweak.addSelect(options,'scenario',{label:'资产状态',options:['完整资产','空对话','文件失效']});
      tweak.addSelect(options,'accent',{label:'主题色',options:['小伴红','松林绿']});
    }
  });
  window.addEventListener('openai:set_globals', event => {
    const incoming=event.detail?.globals?.widgetState?.privateContent;
    if(incoming&&(Number(incoming.__revision)||0)>=stateRevision) {
      stateRevision=Number(incoming.__revision)||0;
      Object.entries(restore).forEach(([key,apply])=>apply(incoming[key]));
    }
  });
  refreshIcons();
})();
</script>
