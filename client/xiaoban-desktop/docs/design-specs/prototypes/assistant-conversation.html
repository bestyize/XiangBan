for(const [theme,num,name,en,material,caption,foot] of defs){
 const pane=document.createElement('section');pane.className='pane '+theme;pane.dataset.appearance=theme==='dark'?'night':'day';pane.setAttribute('aria-label',name+'主题预览');
 pane.innerHTML=`<header class="pane-heading"><span class="number">${num}</span><div><h2>${name}</h2><p>${en}</p></div></header><span class="material-tag">${material}</span><div class="desktop-caption">${caption}</div><div class="assistant"><section class="response"><button class="close-response" aria-label="关闭回复">${icon('x')}</button><p class="question">帮我把今天的想法，慢慢理一理。</p><p class="response-text">先把重要的事情，轻轻放到一起。\n剩下的，我们慢慢来。</p><button class="copy" aria-label="复制回复">${icon('icon-copy')}<span>复制</span></button></section><div class="composer"><div class="attachments"></div><div class="input-row"><button class="orb-button" aria-label="开始聆听"><span class="orb"></span></button><input class="field" aria-label="${name}主题输入框" placeholder="问点什么，或直接说话"><div class="tools-host"><div class="toolbar" role="toolbar" aria-label="小伴工具">${actions.map(([key,label,symbol])=>`<button class="tool" data-action="${key}" aria-label="${label}">${icon(symbol)}<span>${label}</span></button>`).join('')}</div><button class="primary" aria-label="展开工具">${icon('plus')}</button></div></div></div></div><button class="restore" aria-label="重新展开小伴" hidden><span class="orb"></span></button><p class="pane-foot">${foot}</p><div class="toast" role="status"></div><div class="modal" hidden><section class="modal-card"><header class="modal-head"><span></span><button aria-label="关闭弹窗">${icon('x')}</button></header><div class="modal-body"></div></section></div><input type="file" class="sr" accept="image/png,image/jpeg,image/webp" multiple>`;
 document.getElementById('layout').append(pane);
 const $=s=>pane.querySelector(s),assistant=$('.assistant'),field=$('.field'),response=$('.response'),text=$('.response-text'),question=$('.question'),host=$('.tools-host'),primary=$('.primary'),modal=$('.modal'),file=$('input[type=file]');
 let phase='idle',pinned=false,openTimer,closeTimer,replyTimer,streamTimer,speechTimer,toastTimer,images=[];
 const toast=message=>{clearTimeout(toastTimer);$('.toast').textContent=message;$('.toast').classList.add('show');toastTimer=setTimeout(()=>$('.toast').classList.remove('show'),1900)};
 function open(value){host.classList.toggle('open',value);primary.setAttribute('aria-expanded',String(value));}
 const busy=()=>['thinking','replying','speaking'].includes(phase);
 function cancelTimers(){clearTimeout(replyTimer);clearInterval(streamTimer);clearTimeout(speechTimer)}
 function update(){const active=busy(),ready=active||!!field.value.trim()||images.length;primary.classList.toggle('ready',!!ready);primary.classList.toggle('is-stop',active);primary.innerHTML=icon(active?'stop':ready?'arrow':'plus');primary.setAttribute('aria-label',active?'停止回复':ready?'发送':'展开工具');primary.title=active?'停止回复':ready?'发送':'展开工具';for(const value of ['listening','thinking','replying','speaking'])assistant.classList.toggle(value,phase===value);field.placeholder=({listening:'我在听，你慢慢说…',thinking:'正在思考，可随时停止',replying:'正在回复，可随时停止',speaking:'正在朗读，可随时停止'})[phase]||'问点什么，或直接说话';$('.orb-button').setAttribute('aria-label',phase==='listening'?'暂停聆听':'开始聆听');}
 const fullReply='先把重要的事情，轻轻放到一起。\n我们可以先选出今天最想完成的一件事，再拆成几个轻松的小步骤。\n剩下的，我们慢慢来。';
 function stream(autoSpeak=false){phase='replying';text.textContent='';let count=0;update();streamTimer=setInterval(()=>{count=Math.min(count+1,fullReply.length);text.textContent=fullReply.slice(0,count);if(count>=fullReply.length){clearInterval(streamTimer);phase=autoSpeak?'speaking':'idle';update();if(autoSpeak)speechTimer=setTimeout(()=>{phase='idle';update()},9000)}},105)}
 function state(value){cancelTimers();phase=value;assistant.hidden=false;$('.restore').hidden=true;response.hidden=false;question.textContent='帮我把今天的想法，慢慢理一理。';text.textContent=phase==='thinking'?'正在整理思路…':fullReply;pinned=false;open(false);if(value==='replying')stream();update();}
 function renderImages(){const tray=$('.attachments');tray.replaceChildren();images.forEach((src,i)=>{const wrap=document.createElement('div');wrap.className='attachment';const img=document.createElement('img');img.src=src;img.alt='待发送的图片';const button=document.createElement('button');button.className='remove-image';button.setAttribute('aria-label','移除图片');button.innerHTML=icon('x');button.onclick=()=>{images.splice(i,1);renderImages();update()};wrap.append(img,button);tray.append(wrap)});}
 function send(){if(busy()||(!field.value.trim()&&!images.length))return;cancelTimers();question.textContent=field.value.trim()||'帮我看看这张图片';field.value='';images=[];renderImages();phase='thinking';response.hidden=false;text.textContent='正在整理思路…';pinned=false;open(false);update();replyTimer=setTimeout(()=>stream(true),1800)}
 host.addEventListener('pointerenter',()=>{clearTimeout(closeTimer);openTimer=setTimeout(()=>open(true),200)});host.addEventListener('pointerleave',()=>{clearTimeout(openTimer);if(!pinned)closeTimer=setTimeout(()=>open(false),400)});host.addEventListener('focusin',()=>clearTimeout(closeTimer));
 primary.onclick=()=>{if(busy()){const previous=phase;cancelTimers();phase='idle';if(previous==='thinking')text.textContent='';pinned=false;open(false);update();toast(previous==='speaking'?'已停止朗读':'已停止回复');field.focus();return}if(field.value.trim()||images.length){send();return}pinned=!host.classList.contains('open');open(pinned)};
 field.oninput=update;field.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send()}};
 $('.orb-button').onclick=()=>{cancelTimers();phase=phase==='listening'?'idle':'listening';update()};$('.close-response').onclick=()=>{response.hidden=true};$('.restore').onclick=()=>{assistant.hidden=false;$('.restore').hidden=true;field.focus()};
 $('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(text.textContent);$('.copy span').textContent='已复制';setTimeout(()=>$('.copy span').textContent='复制',1400)}catch{toast('复制未完成，请重试')}};
 function showModal(title,content,html=false){$('.modal-head span').textContent=title;if(html)$('.modal-body').innerHTML=content;else $('.modal-body').textContent=content;modal.hidden=false}
 $('.modal-head button').onclick=()=>modal.hidden=true;modal.addEventListener('pointerdown',e=>{if(e.target===modal)modal.hidden=true});
 pane.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{clearTimeout(openTimer);pinned=false;open(false);const action=button.dataset.action;
 if(action==='collapse'){assistant.hidden=true;$('.restore').hidden=false}
 if(action==='new-chat'){cancelTimers();phase='idle';field.value='';images=[];renderImages();response.hidden=true;question.textContent='';text.textContent='';update();field.focus();toast('已开启新会话')}
 if(action==='settings')showModal('超级小伴设置','<div class="setting">呼出后<select><option>先打字</option><option>直接聆听</option></select></div><div class="setting">朗读回答<select><option>仅语音提问时</option><option>每次回答</option><option>不朗读</option></select></div><div class="setting">呼出快捷键<select><option>Option + Space</option><option>Alt + Space</option></select></div>',true);
 if(action==='expand')showModal('聊天详情',question.textContent+'\n\n'+text.textContent);
 if(action==='image')file.click();if(action==='screenshot')toast('截图工具沿用现有交互，本稿用于比较视觉');});
 file.onchange=async()=>{for(const f of file.files){if(images.length>=8)break;if(f.size>3*1024*1024){toast('单张图片请小于 3MB');continue}const url=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});images.push(url)}file.value='';renderImages();update()};
 pane.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)modal.hidden=true;else{pinned=false;open(false)}}});pane.addEventListener('pointerdown',e=>{if(!host.contains(e.target)){pinned=false;open(false)}});
 panes.push({state,pane});update();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.view==='pair'?'':'view-single view-'+b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));});
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{panes.forEach(p=>p.state(b.dataset.state));document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===b));});
</script></body></html>
