<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情盆栽</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: radial-gradient(ellipse 90% 70% at 50% 62%, #fbeee2 0%, #f7e7d8 55%, #f1dccb 100%);
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #bar {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 92vw;
      }
      #bar button {
        border: 1px solid #e6cdb6; background: #fffaf4; color: #6b4a30; border-radius: 999px;
        padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
      }
      #bar button[aria-pressed="true"] { background: #6b4a30; color: #fffaf4; border-color: #6b4a30; }
      #bar button:focus-visible { outline: 2px solid #3f8a22; outline-offset: 2px; }
      body.clean #bar { display: none; }
    </style>
  </head>
  <body>
    <div id="stage" aria-label="表情盆栽"></div>
    <div id="bar" role="group" aria-label="表情"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
