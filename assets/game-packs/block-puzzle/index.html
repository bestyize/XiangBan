<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ee9aaf">
  <title>方块爆破 · 小伴游戏</title>
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="../fresh-theme.css">
  <link rel="stylesheet" href="../result-share.css">
  <link rel="stylesheet" href="./candy.css">
  <script src="./rules.js" defer></script>
  <script src="../result-share.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body class="fresh-game" data-game="block-puzzle">
  <audio id="musicTrack" src="./candy-clouds.mp3" loop preload="none" hidden></audio>
  <audio id="voiceNice" src="./voice-nice.mp3" preload="auto" hidden></audio>
  <audio id="voiceGood" src="./voice-good.mp3" preload="auto" hidden></audio>
  <audio id="voiceGreat" src="./voice-great.mp3" preload="auto" hidden></audio>
  <audio id="voiceWonderful" src="./voice-wonderful.mp3" preload="auto" hidden></audio>
  <main class="game">
    <header class="topbar">
      <div class="best-score" aria-label="历史最高分"><span aria-hidden="true">👑</span><strong id="best">0</strong></div>
      <div class="header-actions">
        <button id="settingsButton" class="icon-button" type="button" aria-label="游戏设置">⚙</button>
        <button id="exitButton" class="icon-button exit-button" type="button" aria-label="退出游戏"><span class="exit-arrow" aria-hidden="true">‹</span><span class="exit-label">退出</span></button>
      </div>
    </header>
    <section class="stats" aria-label="当前得分">
      <div class="stat"><span>当前分数</span><strong id="score">0</strong></div>
      <div class="stat statistics-only"><span>消除行列</span><strong id="lines">0</strong></div>
      <output id="rewardDiamond" class="reward-diamond" aria-live="polite" hidden></output>
      <p id="comboCount" class="combo-counter" hidden></p>
    </section>
    <p class="intro">拖放方块，填满一整行或一整列即可消除</p>
    <section class="board-stage" aria-label="棋盘">
      <div class="board-shell">
        <div id="board" class="board" role="grid" aria-label="八行八列方块棋盘" aria-describedby="help"></div>
        <div id="previewLayer" class="preview-layer" aria-hidden="true"></div>
        <div id="sparkLayer" class="spark-layer" aria-hidden="true"></div>
        <div id="comboBanner" class="combo-banner" aria-live="polite" hidden></div>
        <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultScore" hidden>
          <div class="result-card">
            <div class="result-crown" aria-hidden="true">👑</div>
            <h2 id="resultTitle">再破一次纪录！</h2>
            <p class="result-caption">本局得分</p>
            <p id="resultScore" class="result-score">0</p>
            <p id="resultLines" class="result-lines"></p>
            <button id="shareResultButton" class="result-share-button" type="button" hidden><span>分享战绩</span></button>
            <button id="restartOverlay" class="primary-button result-restart" type="button" aria-label="再玩一局">▶ <span>再玩一局</span></button>
          </div>
        </div>
      </div>
    </section>
    <p id="trayHint" class="tray-hint">拖放方块，或选中后点棋盘</p>
    <section id="tray" class="tray" aria-label="三个待放置方块" aria-describedby="trayHint">
      <button class="piece-button" type="button" data-slot="0" aria-pressed="false"><span class="piece-art"></span><span class="piece-label"></span></button>
      <button class="piece-button" type="button" data-slot="1" aria-pressed="false"><span class="piece-art"></span><span class="piece-label"></span></button>
      <button class="piece-button" type="button" data-slot="2" aria-pressed="false"><span class="piece-art"></span><span class="piece-label"></span></button>
    </section>
    <p id="status" class="status" role="status" aria-live="polite">任选一个方块，拖进棋盘吧。</p>
    <footer class="footer">
      <p id="help" class="help">键盘：1–3 选块，方向键移动，回车放置</p>
      <button id="restartButton" class="quiet-button" type="button">重新开始</button>
    </footer>
  </main>
  <div id="dragGhost" class="drag-ghost" aria-hidden="true" hidden></div>
  <section id="settingsOverlay" class="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
    <div class="settings-panel">
      <div class="settings-head"><h2 id="settingsTitle">游戏设置</h2><button id="closeSettingsButton" type="button" class="close-settings" aria-label="关闭设置">✕</button></div>
      <p>方块爆破 · 经典模式</p>
      <button id="continueButton" type="button" class="settings-action" hidden>继续上局</button>
      <button id="soundButton" type="button" aria-pressed="true" class="settings-action">音效：开启</button>
      <button id="musicButton" type="button" aria-pressed="true" class="settings-action">背景音乐：开启</button>
      <button id="settingsRestart" type="button" class="settings-action">重新开始</button>
      <p class="settings-tip">填满横向或纵向八格即可消除，连续消除能获得更高分数。</p>
    </div>
  </section>
</body>
</html>
