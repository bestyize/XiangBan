<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff2dc">
  <title>倒杯快乐</title>
  <link rel="icon" href="./icon.webp" type="image/webp">
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="./arcade.css">
  <link rel="stylesheet" href="./runtime.css">
  <script src="./engine.js" defer></script>
  <script src="./levels.js" defer></script>
  <script src="./progress.js" defer></script>
  <script src="./host.js" defer></script>
  <script src="./art.js" defer></script>
  <script src="./game.js" defer></script>
</head>
<body data-game="water-sort">
  <main class="joy-shell">
    <header class="app-header">
      <button class="brand" data-view="home" aria-label="倒杯快乐，回小店"><span class="brand-mark">pj<span>●</span></span><span>倒杯快乐<small>POUR JOY CLUB</small></span></button>
      <div class="header-actions"><button id="saveStatus" hidden title="存档状态" aria-label="查看存档状态">!</button><button class="icon-button" data-view="levels" aria-label="选择关卡">☷</button><button class="icon-button" data-view="journal" aria-label="风味手帐">✳</button></div>
    </header>
    <div id="screen" class="screen"><div class="loading" role="status">正在开店…</div></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <dialog id="infoDialog"><button class="dialog-close" aria-label="关闭">×</button><h2 id="dialogTitle"></h2><div id="dialogContent"></div></dialog>
</body>
</html>
