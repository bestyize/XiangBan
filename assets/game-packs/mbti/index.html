<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf8f5">
<title>MBTI 性格测评 · 小伴</title>
<link rel="stylesheet" href="./game.css"><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./report.css">
<script src="./rules.js" defer></script><script src="./profiles.js" defer></script><script src="./report.js" defer></script><script src="./report-view.js" defer></script><script src="./share.js" defer></script><script src="./game.js" defer></script>
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="mbti-leaf" viewBox="0 0 24 24"><path d="M19 4C8 2 3 8 6 15s14 3 13-11Z"/><path d="M5 21 15 9M9 16l-1-5M12 13h5"/></symbol>
<symbol id="mbti-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="mbti-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></symbol>
<symbol id="mbti-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="mbti-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></symbol>
<symbol id="mbti-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></symbol>
</defs></svg>
<main id="app" class="app">
<header class="topbar"><div class="brand"><svg aria-hidden="true"><use href="#mbti-leaf"/></svg><span id="pageLabel">向内看</span></div><button id="homeButton" class="icon-button" type="button" aria-label="回到首页" title="回到首页" hidden><svg aria-hidden="true"><use href="#mbti-home"/></svg></button></header>
<section id="home" class="view home" aria-labelledby="homeTitle">
<div class="home-intro"><p class="eyebrow home-kicker">A LITTLE CLOSER TO YOURSELF</p><h1 id="homeTitle" tabindex="-1">你比四个字母，<br><span>更值得被了解。</span></h1><p class="intro-copy">从生活里的小小选择，<br>看见你的能量、偏好与独特之处。</p><div class="home-art"><img src="./assets/observer-coral.webp" width="768" height="512" alt="珊瑚橙色提灯者站在展开的书与杏色纸艺树林之间"></div></div>
<div class="home-actions"><div class="session-meta"><span><svg aria-hidden="true"><use href="#mbti-grid"/></svg>48 道情境题</span><span><svg aria-hidden="true"><use href="#mbti-clock"/></svg>约 10 分钟</span></div>
<button id="startButton" class="primary-button full-width" type="button">开始探索<svg aria-hidden="true"><use href="#mbti-arrow"/></svg></button><button id="resumeButton" class="primary-button full-width" type="button" hidden>继续上次</button>
<p class="privacy-copy"><svg aria-hidden="true"><use href="#mbti-lock"/></svg>答案留在你的设备里</p><button id="resetButton" class="text-button full-width" type="button" hidden>重新开始</button>
<button id="lastResultButton" class="last-result full-width" type="button" hidden><span class="history-icon" aria-hidden="true"><svg><use href="#mbti-leaf"/></svg></span><span><strong>上一次，认识了怎样的自己？</strong><small id="lastResultMeta"></small></span><svg class="history-arrow" aria-hidden="true"><use href="#mbti-arrow"/></svg></button><p id="storageNote" class="storage-note" role="status">独立预览：进度仅在本次打开期间保留。</p></div></section>
<section id="quiz" class="view quiz" hidden aria-labelledby="questionTitle">
<div class="progress-label"><strong id="questionNumber">01 / 48</strong><span id="progressText">已答 0 题</span></div><progress id="progressBar" max="48" value="0" aria-label="已答题数"></progress>
<div class="question-area"><p class="question-category"><span aria-hidden="true"><svg><use href="#mbti-leaf"/></svg></span><span id="questionEyebrow">关于你的能量</span></p><h2 id="questionTitle" class="question-title" tabindex="-1"></h2><p class="question-sub">哪一种，更像平时的你？</p>
<div class="options" role="group" aria-labelledby="questionTitle"><button class="option" id="option0" type="button" aria-pressed="false"><span id="optionText0"></span><span class="selected-mark" aria-hidden="true">✓</span></button><button class="option" id="option1" type="button" aria-pressed="false"><span id="optionText1"></span><span class="selected-mark" aria-hidden="true">✓</span></button></div></div>
<footer class="question-footer"><p class="question-hint">没有更好的选项，真实就很好。</p><div class="question-nav"><button id="previousButton" class="text-button" type="button">← 上一题</button><button id="skipButton" class="text-button" type="button">暂时跳过</button><button id="nextButton" class="next-button" type="button" disabled>下一题 →</button></div><p class="keyboard-hint">键盘 1 / 2 选择 · ← / → 翻题</p></footer></section>
<section id="review" class="view review" hidden aria-labelledby="reviewTitle"><p class="eyebrow">给留白一点时间</p><h2 id="reviewTitle" tabindex="-1">还有几题，想再想想？</h2><p id="reviewSummary" class="review-copy"></p><p id="reviewNotice" class="review-copy"></p><div class="review-actions"><button id="fillButton" class="primary-button full-width" type="button">补答剩余题目</button><button id="finishButton" class="secondary-button full-width" type="button">查看已答结果</button><button id="reviewPreviousButton" class="text-button full-width" type="button">返回最后一题</button></div></section>
<section id="result" class="view result" hidden aria-labelledby="resultType"><div id="reportBody"></div><div class="result-actions"><button id="shareButton" class="primary-button full-width" type="button">把这份认识，留成一张卡</button><button id="retryButton" class="text-button full-width" type="button">重新认识自己 →</button></div></section>
<section id="share" class="view share-view" hidden aria-labelledby="shareTitle"><button id="shareBack" class="text-button" type="button">← 返回报告</button><h2 id="shareTitle" tabindex="-1">留住此刻的自己</h2><p class="share-intro">保留此刻的画像，也邀请朋友一起测一测。</p><img id="posterPreview" class="poster-preview" alt="人格结果分享海报"><p id="posterStatus" class="share-status" role="status">正在准备图片…</p><div class="share-actions"><button id="savePoster" type="button" class="primary-button" disabled>保存图片</button><button id="sharePoster" type="button" class="secondary-button" disabled>分享图片</button><button id="shareLink" type="button" class="secondary-button" disabled>分享结果链接</button></div><p class="share-intro share-link-note">链接展示类型、四维倾向和测试日期。原始答案留在本机。</p></section>
<p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
</body>
</html>
