<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111312">
<title>2048 · 黑曜</title>
<link rel="stylesheet" href="../result-share.css">
<link rel="stylesheet" href="./game.css">
<script src="./rules.js" defer></script>
<script src="../result-share.js" defer></script>
<script src="./game.js" defer></script>
</head>
<body data-game="merge-2048">
<div class="atmosphere" aria-hidden="true"><i></i><i></i></div>
<main class="game">
<header class="topbar">
<div class="wordmark"><span class="brand-symbol" aria-hidden="true">◈</span> 黑曜 <span class="wordmark-en">OBSIDIAN / 2048</span></div>
<button class="quiet-button" id="exitButton" type="button">退出游戏 ↗</button>
</header>
<section class="story" aria-label="2048 黑曜">
<p class="eyebrow">A STUDY OF LIGHT & NUMBERS</p>
<h1>2048<span>让数字，<br>聚成光。</span></h1>
<p class="intro">每一次相遇，都是新的可能。<br>滑动、合并，在方寸之间寻找下一束光。</p>
<div class="journey">
<div class="journey-label"><span>通往 2048</span><span id="journeyValue">01 / 11</span></div>
<div class="journey-track" role="progressbar" aria-label="最大方块进度" aria-valuemin="1" aria-valuemax="11" aria-valuenow="1" id="journeyTrack"><span id="journeyFill"></span></div>
<div class="journey-ends"><span>2</span><span>2048</span></div>
</div>
<p class="edition"><span></span> 黑曜石 · 琥珀光 <span class="edition-number">N° 001</span></p>
</section>
<section class="play" aria-label="游戏区域">
<section class="stats" aria-label="本局数据">
<div class="stat stat-score"><span>本局得分</span><strong id="score">0</strong><span id="scoreGain" aria-hidden="true"></span></div>
<div class="stat"><span>本次最高</span><strong id="best">0</strong></div>
<div class="stat"><span>最大方块</span><strong id="largest">2</strong></div>
</section>
<div class="board-stage"><div class="board-shell">
<div class="board-rim" aria-hidden="true"></div>
<div id="board" class="board" role="group" aria-label="2048 棋盘，使用方向键或滑动移动方块" tabindex="0"></div>
<div id="sparks" class="sparks" aria-hidden="true"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultScore" hidden>
<div class="result-card">
<div class="result-emblem" aria-hidden="true">◈</div>
<p class="eyebrow" id="resultEyebrow">这一束光，值得铭记</p>
<h2 id="resultTitle">再启一程</h2>
<p id="resultScore">本局得分 0</p>
<button id="shareResultButton" class="result-share-button" type="button" hidden>分享战绩</button>
<div class="result-actions">
<button class="primary-button" id="continueButton" type="button" hidden>继续追光</button>
<button class="quiet-button" id="restartOverlay" type="button">再来一局</button>
</div></div></div></div></div>
<div class="board-caption"><span><i></i> 相同数字相遇，光芒加倍</span><span>4 × 4</span></div>
<p class="status" id="status" role="status" aria-live="polite">滑动棋盘，开始你的第一步。</p>
<div class="play-actions">
<div class="controls" aria-label="移动方向">
<button type="button" data-direction="left" aria-label="向左移动">←</button>
<button type="button" data-direction="up" aria-label="向上移动">↑</button>
<button type="button" data-direction="down" aria-label="向下移动">↓</button>
<button type="button" data-direction="right" aria-label="向右移动">→</button>
</div>
<button class="quiet-button restart" id="restartButton" type="button"><span aria-hidden="true">↻</span> 重新开始</button>
</div>
</section>
<footer class="footer"><p>滑动棋盘 <span> / </span> 方向键 <span> / </span> WASD</p><button class="sound-button" id="soundButton" type="button" aria-pressed="false">声音 <span id="soundState">关</span></button></footer>
</main>
</body>
</html>
