<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>万磁搜</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="ambient" aria-hidden="true">
      <svg viewBox="0 0 420 220" fill="none" stroke="currentColor" stroke-width=".65">
        <circle cx="319" cy="4" r="50"/><circle cx="319" cy="4" r="79"/>
        <circle cx="319" cy="4" r="110"/><circle cx="319" cy="4" r="144"/>
        <circle cx="319" cy="4" r="181"/>
      </svg>
    </div>

    <div class="workspace" id="workspace">
      <div class="dock">
        <div class="wrap dock-inner">
          <span class="capsule-space" aria-hidden="true"></span>
          <header class="masthead">
            <span class="brand"><span data-icon="magnet"></span></span>
            <h1>万磁搜</h1>
          </header>

          <form id="search-form" class="search" role="search" autocomplete="off">
            <span data-icon="search"></span>
            <input id="query" type="search" aria-label="搜索关键词" placeholder="输入关键词"
              maxlength="128" enterkeyhint="search" spellcheck="false">
            <button id="clear-query" class="icon-button" type="button" aria-label="清空搜索" hidden>
              <span data-icon="close"></span>
            </button>
            <button id="submit" class="primary search-submit" type="submit">搜索</button>
          </form>

          <div class="toolbar">
            <button id="source" class="source-button" type="button" aria-haspopup="dialog"
              aria-controls="sheet" aria-expanded="false">
              <span id="source-dot" class="site-dot" aria-hidden="true" hidden></span>
              <span id="source-label" class="truncate">全部来源</span>
              <span data-icon="chevron"></span>
            </button>
            <div class="sort" role="group" aria-label="结果排序">
              <button type="button" data-sort="relevance" aria-pressed="true">相关</button>
              <button type="button" data-sort="size" aria-pressed="false">体积</button>
              <button type="button" data-sort="seeds" aria-pressed="false">做种</button>
              <button type="button" data-sort="date" aria-pressed="false">日期</button>
            </div>
          </div>
        </div>
      </div>

      <main class="scroll-area" id="scroll-area">
        <div class="wrap content">
          <div id="home" class="stack">
            <section class="hero">
              <svg class="hero-art" viewBox="0 0 192 168" aria-hidden="true" fill="none">
                <g stroke="#F4BDC8" stroke-opacity=".32" stroke-width=".7">
                  <circle cx="116" cy="78" r="46"/><circle cx="116" cy="78" r="60"/>
                  <circle cx="116" cy="78" r="75"/><circle cx="116" cy="78" r="91"/>
                  <path d="M25 78h167M116 0v168" stroke-dasharray="2 5"/>
                </g>
                <circle cx="176" cy="78" r="3" fill="#F5A0AD"/>
                <circle cx="79" cy="28" r="2" fill="#F5A0AD"/>
                <g transform="rotate(-26 116 78)" stroke-width="15">
                  <path d="M94 53v40a22 22 0 0 0 44 0V53" stroke="#1C121A" transform="translate(3 5)"/>
                  <path d="M94 53v40a22 22 0 0 0 44 0V53" stroke="#EE778A"/>
                  <path d="M94 50v14m44-14v14" stroke="#FBE7DF"/>
                </g>
              </svg>
              <h2>跨站磁力搜索</h2>
              <p>检索公开资源索引<br>快速复制磁力链接</p>
            </section>

            <div class="scenes" role="group" aria-label="快捷搜索">
              <button type="button" data-query="电影 4K"><span data-icon="film"></span>电影 4K</button>
              <button type="button" data-query="动漫 剧集"><span data-icon="screen"></span>动漫剧集</button>
              <button type="button" data-query="Ubuntu 24.04"><span data-icon="box"></span>开源软件</button>
              <button type="button" data-query="FLAC 无损"><span data-icon="music"></span>无损音乐</button>
            </div>

            <section class="recent" aria-labelledby="recent-title">
              <div class="section-head">
                <h2 id="recent-title" tabindex="-1">最近搜索</h2>
                <button id="clear-history" class="text-button" type="button" hidden>清空</button>
              </div>
              <div id="recent" class="recent-list"></div>
            </section>

            <section class="source-card" aria-labelledby="sources-title">
              <div class="section-head">
                <h2 id="sources-title">搜索来源</h2>
                <span class="muted">点选切换</span>
              </div>
              <div id="home-sources" class="source-grid"></div>
            </section>
          </div>

          <section id="results" aria-label="搜索结果" hidden>
            <p id="result-meta" class="result-meta"></p>
            <div id="result-list" class="stack"></div>
            <button id="load-more" class="soft load-more" type="button" hidden>加载下一页</button>
          </section>
          <p id="status" class="sr-only" role="status"></p>
        </div>
      </main>
    </div>

    <div class="overlay" id="overlay" hidden>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"
        aria-labelledby="sheet-title" tabindex="-1">
        <div class="sheet-grip" id="sheet-grip" aria-hidden="true"></div>
        <header class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button id="close-sheet" class="icon-button" type="button" aria-label="关闭弹层">
            <span data-icon="close"></span>
          </button>
        </header>
        <div class="sheet-body" id="sheet-body"></div>
        <button id="cancel-sheet" class="sheet-cancel" type="button">取消</button>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </div>
</body>
</html>
