<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="万磁搜 16:9 封面">
  <defs>
    <radialGradient id="cGlow" cx="86%" cy="8%" r="65%">
      <stop offset="0%" stop-color="#E3203C" stop-opacity="0.16"/>
      <stop offset="48%" stop-color="#FF6B78" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F4F3F1" stop-opacity="0"/>
