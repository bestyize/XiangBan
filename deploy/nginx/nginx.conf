user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 2m;

    # The host Nginx reverse proxy is the only external entry point.
    # Trust forwarded client addresses only from Docker bridge subnets.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location ^~ /api/ {
            limit_req zone=api_per_ip burst=30 nodelay;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $server_upstream server:8080;
            proxy_pass http://$server_upstream;
            proxy_http_version 1.1;
            # Preserve the public port so same-origin checks work through LAN port forwards.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
