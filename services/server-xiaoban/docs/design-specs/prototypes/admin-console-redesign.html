<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="red">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小伴官网管理后台 · 规范对齐重设计稿 v2.0</title>
<style>
  /* ==========================================================================
     小伴官方设计令牌（方案四 × 浅底白卡无描边规范 × 6 套主题色 × 明暗模式）
     严格对齐 client/xiaoban-desktop/src/ui/design-tokens.ts & surfaces.css & control.css
     ========================================================================== */
  :root,
  html[data-theme="light"] {
    --ui-surface: #FFFFFF;
    --ui-surface-alt: #F2F2F4;
    --ui-surface-sunken: #F5F5F7;
    --ui-surface-hover: rgba(0, 0, 0, .045);
    --ui-surface-raised: rgba(255, 255, 255, .97);
    --ui-control: #F0F1F3;
    --ui-control-hover: #E6E7EB;
    --ui-line: rgba(0, 0, 0, .06);
    --ui-border: rgba(0, 0, 0, .07);
    --ui-border-strong: rgba(0, 0, 0, .13);

    --ui-text-primary: #1D1D1F;
    --ui-text-secondary: #636369;
    --ui-text-tertiary: #8E8E93;
    --ui-text-disabled: #A1A1A6;
    --ui-text-on-btn: #FFFFFF;

    /* 固定语义色（不随主题色变化） */
    --ui-success: #2FA36B;
    --ui-success-text: #1F7A4D;
    --ui-success-soft: #E9F7F0;
    --ui-warning: #D98A1C;
    --ui-warning-text: #9A5410;
    --ui-warning-soft: #FDF3E3;
    --ui-danger: #D93A44;
    --ui-danger-soft: #FDECEE;
    --ui-info: #2F6FDB;
    --ui-info-soft: #EAF1FD;

    /* 阴影只给浮层与面板壳层 */
    --ui-shadow-panel: 0 0 0 1px rgba(0, 0, 0, .05), 0 4px 16px rgba(0, 0, 0, .04);
    --ui-shadow-menu: 0 0 0 1px rgba(0, 0, 0, .07), 0 14px 36px rgba(0, 0, 0, .15);
    --ui-shadow-dialog: 0 0 0 1px rgba(0, 0, 0, .07), 0 24px 64px rgba(0, 0, 0, .18);
    --ui-shadow-toast: 0 8px 24px rgba(0, 0, 0, .16);
    --ui-scrim: rgba(18, 18, 23, .36);

    --ui-font: -apple-system, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI', 'Noto Sans SC', sans-serif;
    --ui-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --ui-ease: cubic-bezier(0.22, 1, 0.36, 1);
    color-scheme: light;
  }

  html[data-theme="dark"] {
    --ui-surface: #232429;
    --ui-surface-alt: #2C2D33;
    --ui-surface-sunken: #2B2D33;
    --ui-surface-hover: rgba(255, 255, 255, .065);
    --ui-surface-raised: rgba(42, 43, 49, .97);
    --ui-control: #34363E;
    --ui-control-hover: #3E404A;
    --ui-line: rgba(255, 255, 255, .07);
    --ui-border: rgba(255, 255, 255, .09);
    --ui-border-strong: rgba(255, 255, 255, .16);

    --ui-text-primary: #F5F5F7;
    --ui-text-secondary: #AEAEB4;
    --ui-text-tertiary: #84848B;
    --ui-text-disabled: #5E5E65;
    --ui-text-on-btn: #FFFFFF;

    --ui-success: #3FB87A;
    --ui-success-text: #72DBA4;
    --ui-success-soft: rgba(63, 184, 122, .16);
    --ui-warning: #F0A93A;
    --ui-warning-text: #F6C36B;
    --ui-warning-soft: rgba(240, 169, 58, .16);
    --ui-danger: #F26468;
    --ui-danger-soft: rgba(242, 100, 104, .16);
    --ui-info: #6EA4FF;
    --ui-info-soft: rgba(110, 164, 255, .16);

    --ui-shadow-panel: 0 0 0 1px rgba(255, 255, 255, .06), 0 4px 18px rgba(0, 0, 0, .32);
    --ui-shadow-menu: 0 0 0 1px rgba(255, 255, 255, .10), 0 16px 40px rgba(0, 0, 0, .55);
    --ui-shadow-dialog: 0 0 0 1px rgba(255, 255, 255, .10), 0 28px 72px rgba(0, 0, 0, .62);
    --ui-shadow-toast: 0 10px 28px rgba(0, 0, 0, .48);
    --ui-scrim: rgba(0, 0, 0, .60);
    color-scheme: dark;
  }

  /* 6 套官方主题色（对齐 appearance.ts & companion-redesign.html） */
  html[data-theme="light"][data-accent="red"]      { --ui-btn:#D93A44; --ui-btn-hi:#E8565F; --ui-soft:#FCEBEC; --ui-ink:#B42A33; --ui-tint:#F5F1F1; --ui-dot:#E5484D; }
  html[data-theme="light"][data-accent="green"]    { --ui-btn:#2E8B5E; --ui-btn-hi:#3FA172; --ui-soft:#E3F2E9; --ui-ink:#1E6A45; --ui-tint:#EEF4F0; --ui-dot:#34A36D; }
  html[data-theme="light"][data-accent="blue"]     { --ui-btn:#2F6FDB; --ui-btn-hi:#4A84E6; --ui-soft:#E6EEFC; --ui-ink:#1D53AE; --ui-tint:#EFF3F9; --ui-dot:#3B7BE8; }
  html[data-theme="light"][data-accent="purple"]   { --ui-btn:#7152D8; --ui-btn-hi:#8669E3; --ui-soft:#EDE8FC; --ui-ink:#5537B8; --ui-tint:#F3F1F9; --ui-dot:#7C5CE6; }
  html[data-theme="light"][data-accent="amber"]    { --ui-btn:#B46B0E; --ui-btn-hi:#C97F1F; --ui-soft:#FAEEDB; --ui-ink:#87500A; --ui-tint:#F6F3ED; --ui-dot:#E09A2B; }
  html[data-theme="light"][data-accent="graphite"] { --ui-btn:#2B2B30; --ui-btn-hi:#43434A; --ui-soft:#E9E9EC; --ui-ink:#2B2B30; --ui-tint:#F2F2F3; --ui-dot:#55555B; }

  html[data-theme="dark"][data-accent="red"]       { --ui-btn:#E54D56; --ui-btn-hi:#F0646C; --ui-soft:rgba(229,77,86,.18);   --ui-ink:#FF868D; --ui-tint:#1A181A; --ui-dot:#F0646C; }
  html[data-theme="dark"][data-accent="green"]     { --ui-btn:#38A16E; --ui-btn-hi:#49B680; --ui-soft:rgba(56,161,110,.18);  --ui-ink:#6FE0A8; --ui-tint:#171B19; --ui-dot:#49B680; }
  html[data-theme="dark"][data-accent="blue"]      { --ui-btn:#4481E8; --ui-btn-hi:#5E96F2; --ui-soft:rgba(68,129,232,.19);  --ui-ink:#87B5FF; --ui-tint:#171A1F; --ui-dot:#5E96F2; }
  html[data-theme="dark"][data-accent="purple"]    { --ui-btn:#8669E3; --ui-btn-hi:#9A80EC; --ui-soft:rgba(134,105,227,.20); --ui-ink:#B7A3F8; --ui-tint:#1A1820; --ui-dot:#9A80EC; }
  html[data-theme="dark"][data-accent="amber"]     { --ui-btn:#C98220; --ui-btn-hi:#DC9636; --ui-soft:rgba(201,130,32,.20);  --ui-ink:#F2BA68; --ui-tint:#1D1A16; --ui-dot:#E8A543; }
  html[data-theme="dark"][data-accent="graphite"]  { --ui-btn:#6B6B73; --ui-btn-hi:#80808A; --ui-soft:rgba(255,255,255,.12); --ui-ink:#DCDCE2; --ui-tint:#18181B; --ui-dot:#9A9AA3; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--ui-font);
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ui-text-primary);
    background: var(--ui-tint);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ui-btn); outline-offset: 2px; }
  button:disabled { opacity: .48; cursor: not-allowed; }
  svg { display: block; flex: none; }
  code, .mono { font-family: var(--ui-mono); }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ==========================================================================
     顶部设计评审条（非产品 UI，支持 6 套主题色 + 明暗 + 视口 + 收起）
     ========================================================================== */
  .review-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 300;
    height: 44px; padding: 0 14px;
    background: rgba(20, 20, 24, .93);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #F3F3F5; border-bottom: 1px solid rgba(255, 255, 255, .08);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12px; transition: transform .22s var(--ui-ease);
  }
  .review-bar.collapsed { transform: translateY(-100%); }
  .review-restore {
    position: fixed; top: 10px; right: 14px; z-index: 310;
    height: 28px; padding: 0 11px; border-radius: 999px;
    background: rgba(20, 20, 24, .9); color: #fff; font-size: 12px; line-height: 1;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  }
  .review-bar.collapsed + .review-restore { display: inline-flex; }
  .rb-g { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rb-title { font-weight: 600; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; line-height: 1; }
  .rb-badge {
    display: inline-flex; align-items: center; justify-content: center;
    height: 20px; padding: 0 8px; border-radius: 999px; line-height: 1;
    background: rgba(255, 255, 255, .12); color: #fff; font-size: 11px; font-weight: 600;
  }
  .rb-seg { display: inline-flex; align-items: center; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .09); gap: 2px; }
  .rb-seg button {
    display: inline-flex; align-items: center; justify-content: center;
    height: 24px; padding: 0 9px; border-radius: 6px; line-height: 1;
    color: rgba(255, 255, 255, .72); white-space: nowrap; transition: .14s;
  }
  .rb-seg button:hover { color: #fff; }
  .rb-seg button.active { background: #fff; color: #18181B; font-weight: 600; }
  .rb-swatches { display: inline-flex; align-items: center; gap: 5px; padding: 0 4px; }
  .rb-sw {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent;
    transition: transform .14s, border-color .14s;
  }
  .rb-sw:hover { transform: scale(1.12); }
  .rb-sw.active { border-color: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .rb-chip {
    display: inline-flex; align-items: center; justify-content: center;
    height: 26px; padding: 0 9px; border-radius: 7px; line-height: 1;
    background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .82); white-space: nowrap;
  }
  .rb-chip:hover { background: rgba(255, 255, 255, .15); color: #fff; }
  .rb-chip.on { background: rgba(240, 169, 58, .24); color: #FBD38D; }

  /* ==========================================================================
     Viewport Stage（PC 满屏 / 平板 960 / 窄屏 390）
     ========================================================================== */
  .stage {
    position: fixed; inset: 44px 0 0 0;
    background: var(--ui-tint);
    transition: top .22s var(--ui-ease);
    display: flex; justify-content: center; align-items: stretch;
  }
  .stage.bar-hidden { top: 0; }
  .stage.device-tablet,
  .stage.device-mobile {
    padding: 20px; align-items: center; overflow: auto;
  }
  .app-frame { width: 100%; height: 100%; background: var(--ui-tint); position: relative; overflow: hidden; }
  .stage.device-tablet .app-frame {
    width: 960px; max-width: 100%; height: min(760px, 100%);
    border-radius: 16px; box-shadow: var(--ui-shadow-dialog);
  }
  .stage.device-mobile .app-frame {
    width: 390px; max-width: 100%; height: min(812px, 100%);
    border-radius: 38px; box-shadow: 0 28px 80px rgba(0, 0, 0, .26), 0 0 0 8px #1C1C1F;
  }

  /* ==========================================================================
     方案四外壳（左 --ui-tint 侧栏 + 右浮起白色圆角面板 .control-main）
     ========================================================================== */
  .control-app {
    height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr);
    background: var(--ui-tint); overflow: hidden; position: relative;
  }
  .stage.device-tablet .control-app { grid-template-columns: 208px minmax(0, 1fr); }
  .stage.device-mobile .control-app { grid-template-columns: minmax(0, 1fr); }

  /* Left Sidebar (无边框，纯 --ui-tint 承载，单色线性图标，无多余底板) */
  .xb-side {
    display: flex; flex-direction: column; padding: 14px 10px 12px;
    overflow-y: auto; scrollbar-width: none; background: var(--ui-tint);
  }
  .xb-side::-webkit-scrollbar { display: none; }
  .stage.device-mobile .xb-side {
    position: absolute; inset: 0 auto 0 0; width: 256px; z-index: 80;
    transform: translateX(-105%); transition: transform .24s var(--ui-ease);
    box-shadow: var(--ui-shadow-dialog);
  }
  .stage.device-mobile .xb-side.open { transform: translateX(0); }
  .mobile-scrim { display: none; position: absolute; inset: 0; z-index: 75; background: var(--ui-scrim); }
  .stage.device-mobile .mobile-scrim.open { display: block; }

  .side-brand {
    display: flex; align-items: center; gap: 10px;
    height: 44px; padding: 0 8px; border-radius: 10px;
    cursor: pointer; transition: background .14s;
  }
  .side-brand:hover { background: var(--ui-surface-hover); }
  .xb-mark {
    width: 28px; height: 28px; border-radius: 8px; flex: none; overflow: hidden;
    background: linear-gradient(150deg, var(--ui-btn-hi), var(--ui-btn));
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
  }
  .xb-mark img { width: 100%; height: 100%; object-fit: cover; }
  .side-brand-name { font-size: 14.5px; font-weight: 650; line-height: 1; letter-spacing: -.01em; }

  .xb-search-trigger {
    margin: 8px 2px 12px; height: 32px; padding: 0 10px; border-radius: 8px;
    background: var(--ui-surface-hover); color: var(--ui-text-secondary);
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; line-height: 1;
    transition: background .14s, color .14s;
  }
  .xb-search-trigger:hover { background: var(--ui-control); color: var(--ui-text-primary); }
  .xb-kbd-mini {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    height: 19px; padding: 0 5px; border-radius: 5px; line-height: 1;
    font-family: var(--ui-mono); font-size: 10.5px; color: var(--ui-text-tertiary);
    background: var(--ui-surface);
  }

  .side-nav { flex: 1; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .side-group-title {
    padding: 0 10px 4px; font-size: 11px; font-weight: 600;
    color: var(--ui-text-tertiary); line-height: 1;
  }
  .side-list { display: flex; flex-direction: column; gap: 2px; }
  .side-item {
    display: flex; align-items: center; gap: 9px;
    height: 34px; padding: 0 10px; border-radius: 8px; width: 100%; text-align: left;
    color: var(--ui-text-secondary); font-size: 13px; font-weight: 450; line-height: 1;
    transition: background .14s, color .14s;
  }
  .side-item:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }
  .side-item.is-active { background: var(--ui-soft); color: var(--ui-ink); font-weight: 600; }
  .side-item svg { width: 15px; height: 15px; opacity: .82; }
  .side-item.is-active svg { opacity: 1; color: var(--ui-ink); }
  .side-count {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    height: 18px; padding: 0 6px; border-radius: 999px; line-height: 1;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    background: var(--ui-surface-hover); color: var(--ui-text-secondary);
  }
  .side-count.is-warn { background: var(--ui-warning-soft); color: var(--ui-warning-text); }
  .side-dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ui-warning); }

  .side-foot {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ui-line);
    display: flex; flex-direction: column; gap: 4px;
  }
  .side-acc {
    display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 8px;
    border-radius: 10px; transition: background .14s;
  }
  .side-acc:hover { background: var(--ui-surface-hover); }
  .side-acc-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 9px; text-align: left; }
  .side-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: var(--ui-soft); color: var(--ui-ink);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 650; line-height: 1;
  }
  .side-acc-name { font-size: 13px; font-weight: 550; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Right Floating White Panel (.control-main) */
  .control-main {
    position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0;
    margin: 8px 8px 8px 0;
    background: var(--ui-surface);
    border-radius: 12px;
    box-shadow: var(--ui-shadow-panel);
    overflow: hidden;
  }
  .stage.device-mobile .control-main { margin: 0; border-radius: 0; box-shadow: none; }

  .control-workspace {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin;
  }
  .xb-page {
    max-width: 1240px; margin: 0 auto;
    padding: 24px 28px 64px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .xb-page.is-narrow { max-width: 880px; }
  .stage.device-mobile .xb-page { padding: 16px 16px 56px; gap: 16px; }

  /* Mobile top strip (only shown on narrow viewports) */
  .mobile-bar {
    display: none; height: 48px; padding: 0 12px; flex: none;
    border-bottom: 1px solid var(--ui-line);
    align-items: center; justify-content: space-between; gap: 8px;
  }
  .stage.device-mobile .mobile-bar { display: flex; }

  /* ==========================================================================
     官方基础组件（无描边、平面主题色主按钮、透明次按钮、浅灰承载面）
     ========================================================================== */
  .xb-page-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; min-height: 36px;
  }
  .xb-page-title { font-size: 20px; font-weight: 650; line-height: 1.25; letter-spacing: -.015em; }
  .xb-page-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Page-top large tabs (壁纸图库 / 采集工作台 / 自定义上架 风格一致) */
  .xb-tabs-lg { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .xb-tabs-lg button {
    display: inline-flex; align-items: center; gap: 6px; line-height: 1.25;
    font-size: 20px; font-weight: 650; color: var(--ui-text-disabled);
    transition: color .14s;
  }
  .xb-tabs-lg button:hover { color: var(--ui-text-secondary); }
  .xb-tabs-lg button.is-active { color: var(--ui-text-primary); }
  .xb-tabs-lg .tab-n { font-size: 13px; font-weight: 550; color: var(--ui-text-tertiary); font-variant-numeric: tabular-nums; }
  .xb-tabs-lg button.is-active .tab-n { color: var(--ui-ink); }

  /* Buttons — 无灰色细描边，严格光学居中 */
  .xb-btn-primary,
  .xb-btn-soft,
  .xb-btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 14px; border-radius: 8px; border: 0; box-shadow: none;
    font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap;
    transition: background .14s, color .14s, opacity .14s;
  }
  .xb-btn-primary { background: var(--ui-btn); color: var(--ui-text-on-btn); }
  .xb-btn-primary:hover:not(:disabled) { background: var(--ui-btn-hi); }
  .xb-btn-primary:disabled { background: var(--ui-control); color: var(--ui-text-disabled); opacity: 1; }

  .xb-btn-soft { background: var(--ui-control); color: var(--ui-text-primary); }
  .xb-btn-soft:hover:not(:disabled) { background: var(--ui-control-hover); }

  .xb-btn-ghost { background: transparent; color: var(--ui-text-secondary); padding: 0 10px; }
  .xb-btn-ghost:hover:not(:disabled) { background: var(--ui-surface-hover); color: var(--ui-text-primary); }

  .is-danger { color: var(--ui-danger) !important; }
  .xb-btn-soft.is-danger { background: var(--ui-danger-soft); }
  .xb-btn-ghost.is-danger:hover:not(:disabled) { background: var(--ui-danger-soft); }

  .is-sm { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 7px; }
  .is-lg { height: 38px; padding: 0 18px; font-size: 13.5px; border-radius: 10px; }

  .xb-icon-btn {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ui-text-secondary); transition: background .14s, color .14s;
  }
  .xb-icon-btn:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }
  .xb-icon-btn.is-sm { width: 26px; height: 26px; border-radius: 7px; }

  /* Borderless Inputs (surfaces.css: --ui-control 实底，无灰细描边) */
  .xb-input, .xb-textarea {
    width: 100%; border: 0; border-radius: 8px;
    background: var(--ui-control); color: var(--ui-text-primary);
    font-size: 13px; transition: background .14s, box-shadow .14s;
  }
  .xb-input { height: 34px; padding: 0 11px; line-height: normal; }
  .xb-input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .xb-input[type="number"]::-webkit-outer-spin-button,
  .xb-input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .xb-textarea { padding: 9px 11px; min-height: 80px; resize: vertical; line-height: 1.55; }
  .xb-input:focus, .xb-textarea:focus {
    outline: none; background: var(--ui-surface);
    box-shadow: 0 0 0 2px var(--ui-btn);
  }
  .xb-input::placeholder, .xb-textarea::placeholder { color: var(--ui-text-tertiary); }
  .xb-input:disabled { opacity: .6; cursor: not-allowed; }

  /* Input with clean prefix/suffix icons */
  .xb-affix { position: relative; display: flex; align-items: center; width: 100%; }
  .xb-affix .af-l {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--ui-text-tertiary); pointer-events: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .xb-affix .af-r {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 6px; color: var(--ui-text-tertiary);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .xb-affix .af-r:hover { background: var(--ui-surface-hover); color: var(--ui-text-primary); }
  .xb-affix.has-l .xb-input { padding-left: 32px; }
  .xb-affix.has-r .xb-input { padding-right: 32px; }

  .xb-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .xb-field-label {
    font-size: 12px; font-weight: 550; color: var(--ui-text-secondary);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; line-height: 1.2;
  }

  /* Segmented Control (.xb-seg — 无外描边，实底 --ui-control) */
  .xb-seg {
    display: inline-flex; align-items: center; padding: 3px; border-radius: 9px;
    background: var(--ui-control); gap: 2px;
  }
  .xb-seg button {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 26px; padding: 0 11px; border-radius: 6.5px; line-height: 1;
    font-size: 12.5px; color: var(--ui-text-secondary); white-space: nowrap;
    transition: background .14s, color .14s;
  }
  .xb-seg button:hover { color: var(--ui-text-primary); }
  .xb-seg button.is-active {
    background: var(--ui-surface); color: var(--ui-text-primary); font-weight: 550;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
  }
  html[data-theme="dark"] .xb-seg button.is-active { background: #484952; }

  /* Switch (主题色开启态) */
  .xb-switch {
    position: relative; flex: none; width: 36px; height: 20px; border-radius: 999px;
    background: var(--ui-control-hover); transition: background .18s;
  }
  .xb-switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
    transition: transform .2s var(--ui-ease);
  }
  .xb-switch[aria-checked="true"] { background: var(--ui-btn); }
  .xb-switch[aria-checked="true"]::after { transform: translateX(16px); }

  /* Custom Checkbox */
  .xb-check {
    width: 17px; height: 17px; border-radius: 5px; flex: none;
    background: var(--ui-control);
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
    transition: background .14s;
  }
  .xb-check:hover { background: var(--ui-control-hover); }
  .xb-check.is-checked { background: var(--ui-btn); }

  /* Pill / Status Chip (无描边，仅柔和语义底 + 圆点) */
  .xb-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: 22px; padding: 0 8px; border-radius: 999px; line-height: 1;
    font-size: 11.5px; font-weight: 550; white-space: nowrap;
    background: var(--ui-control); color: var(--ui-text-secondary);
  }
  .xb-pill i.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .xb-pill.is-ok { background: var(--ui-success-soft); color: var(--ui-success-text); }
  .xb-pill.is-warn { background: var(--ui-warning-soft); color: var(--ui-warning-text); }
  .xb-pill.is-danger { background: var(--ui-danger-soft); color: var(--ui-danger); }
  .xb-pill.is-info { background: var(--ui-info-soft); color: var(--ui-info); }
  .xb-pill.is-accent { background: var(--ui-soft); color: var(--ui-ink); }

  /* ==========================================================================
     标准 .xb-menu 浮层菜单（176–240px、单项 32–34px、一项一行、说明放悬停提示）
     ========================================================================== */
  .xb-select-btn {
    height: 34px; padding: 0 10px 0 11px; border-radius: 8px;
    background: var(--ui-control); color: var(--ui-text-primary);
    display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 13px; line-height: 1; white-space: nowrap;
    transition: background .14s, box-shadow .14s;
  }
  .xb-select-btn.is-sm { height: 30px; font-size: 12.5px; padding: 0 9px 0 10px; }
  .xb-select-btn.is-full { width: 100%; }
  .xb-select-btn:hover { background: var(--ui-control-hover); }
  .xb-select-btn.is-open { background: var(--ui-surface); box-shadow: 0 0 0 2px var(--ui-btn); }
  .xb-select-val { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
  .xb-select-val .pfx { color: var(--ui-text-tertiary); }
  .xb-select-val .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xb-select-chev { color: var(--ui-text-tertiary); transition: transform .16s var(--ui-ease); }
  .xb-select-btn.is-open .xb-select-chev { transform: rotate(180deg); color: var(--ui-text-primary); }

  .xb-menu {
    position: fixed; z-index: 420;
    min-width: 176px; max-width: 260px; max-height: 280px; overflow-y: auto;
    padding: 5px; border-radius: 12px;
    background: var(--ui-surface-raised);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--ui-shadow-menu);
    display: flex; flex-direction: column; gap: 2px;
    animation: menuIn .13s var(--ui-ease);
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
  .xb-menu-item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    height: 33px; padding: 0 10px; border-radius: 8px;
    color: var(--ui-text-primary); font-size: 13px; line-height: 1; text-align: left;
    transition: background .12s, color .12s;
  }
  .xb-menu-item:hover { background: var(--ui-surface-hover); }
  .xb-menu-item.is-active { background: var(--ui-soft); color: var(--ui-ink); font-weight: 550; }
  .xb-menu-item.is-danger { color: var(--ui-danger); }
  .xb-menu-item.is-danger:hover { background: var(--ui-danger-soft); }
  .xb-menu-item .m-ico { color: var(--ui-text-secondary); }
  .xb-menu-item.is-active .m-ico { color: var(--ui-ink); }
  .xb-menu-item.is-danger .m-ico { color: var(--ui-danger); }
  .xb-menu-item .m-hint { margin-left: auto; font-size: 11.5px; color: var(--ui-text-tertiary); }
  .xb-menu-item .m-chk { margin-left: auto; color: var(--ui-ink); }
  .xb-menu-sep { height: 1px; margin: 4px 6px; background: var(--ui-line); }
  .xb-menu-label { padding: 5px 10px 3px; font-size: 11px; font-weight: 600; color: var(--ui-text-tertiary); line-height: 1; }

  /* ==========================================================================
     分组块与设置行（浅灰分组底 --ui-surface-sunken，零描边，细分隔线）
     ========================================================================== */
  .xb-sec-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 10px;
  }
  .xb-sec-title { font-size: 13.5px; font-weight: 600; color: var(--ui-text-primary); display: inline-flex; align-items: center; gap: 7px; line-height: 1; }
  .xb-group {
    background: var(--ui-surface-sunken); border-radius: 12px; overflow: hidden;
  }
  .xb-group-pad { padding: 16px 18px; }
  .xb-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    min-height: 52px; padding: 10px 16px; border-top: 1px solid var(--ui-line);
  }
  .xb-row:first-child { border-top: 0; }
  .xb-row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .xb-row-title { font-size: 13.5px; font-weight: 550; line-height: 1.3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .xb-row-meta { font-size: 12px; color: var(--ui-text-tertiary); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 3px; line-height: 1.2; }
  .xb-row-actions { display: flex; align-items: center; gap: 6px; flex: none; }

  /* 警示条（规范唯一允许留在界面上的一句话风险警示） */
  .xb-alert {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-radius: 10px;
    background: var(--ui-warning-soft); color: var(--ui-warning-text); font-size: 13px;
  }
  .xb-alert-l { display: flex; align-items: center; gap: 8px; line-height: 1.35; }

  /* ==========================================================================
     总览 KPI & 布局栅格（无描边浅底卡）
     ========================================================================== */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stage.device-tablet .kpi-grid,
  .stage.device-mobile .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-card {
    background: var(--ui-surface-sunken); border-radius: 12px; padding: 15px 16px;
    display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    transition: background .14s;
  }
  .kpi-card:hover { background: var(--ui-control); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--ui-text-secondary); line-height: 1; }
  .kpi-val { font-size: 24px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; display: flex; align-items: baseline; gap: 4px; }
  .kpi-foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ui-text-tertiary); line-height: 1; min-height: 20px; }

  .split-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .split-eq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .stage.device-tablet .split-2,
  .stage.device-mobile .split-2,
  .stage.device-mobile .split-eq { grid-template-columns: minmax(0, 1fr); }

  /* ==========================================================================
     壁纸画廊与列表（无外框纯净画框，壁纸本身是主角，次要动作进 ⋯ 菜单）
     ========================================================================== */
  .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .filter-l, .filter-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .wp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .stage.device-tablet .wp-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage.device-mobile .wp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

  .wp-card {
    border-radius: 12px; background: var(--ui-surface-sunken); overflow: hidden;
    display: flex; flex-direction: column; transition: background .14s, box-shadow .14s;
  }
  .wp-card.is-selected { box-shadow: 0 0 0 2px var(--ui-btn); }
  .wp-thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; cursor: pointer; background: var(--ui-control); }
  .wp-art { width: 100%; height: 100%; display: block; transition: transform .3s var(--ui-ease); }
  .wp-card:hover .wp-art { transform: scale(1.03); }

  .wp-sel-btn {
    position: absolute; top: 8px; left: 8px; z-index: 4;
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(18, 18, 22, .52); backdrop-filter: blur(8px);
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
    opacity: 0; transition: opacity .14s, background .14s;
  }
  .wp-card:hover .wp-sel-btn, .wp-card.is-selected .wp-sel-btn { opacity: 1; }
  .wp-card.is-selected .wp-sel-btn { background: var(--ui-btn); }

  .wp-top-r { position: absolute; top: 8px; right: 8px; z-index: 4; display: flex; align-items: center; gap: 5px; }
  .wp-bot-l { position: absolute; bottom: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 5px; }
  .wp-glass {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 22px; padding: 0 8px; border-radius: 999px; line-height: 1;
    background: rgba(16, 16, 20, .62); backdrop-filter: blur(10px);
    color: #fff; font-size: 11px; font-weight: 550;
  }
  .wp-glass.is-ok { background: rgba(47, 163, 107, .92); }
  .wp-glass.is-action { background: rgba(255, 255, 255, .94); color: #1D1D1F; font-weight: 600; }
  .wp-glass.is-action:hover { background: #fff; }

  .wp-info { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .wp-info-l { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .wp-title { font-size: 13px; font-weight: 550; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wp-sub { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ui-text-tertiary); line-height: 1; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .status-dot.ok { background: var(--ui-success); }
  .status-dot.warn { background: var(--ui-warning); }
  .status-dot.danger { background: var(--ui-danger); }
  .status-dot.off { background: var(--ui-text-disabled); }

  /* Table */
  .tbl-wrap { background: var(--ui-surface-sunken); border-radius: 12px; overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th, .tbl td { padding: 10px 14px; text-align: left; border-top: 1px solid var(--ui-line); vertical-align: middle; }
  .tbl thead th { border-top: 0; font-size: 11.5px; font-weight: 550; color: var(--ui-text-tertiary); white-space: nowrap; }
  .tbl tbody tr:hover { background: var(--ui-surface-hover); }
  .tbl tbody tr.is-selected { background: var(--ui-soft); }
  .mini-thumb { width: 76px; height: 48px; border-radius: 7px; overflow: hidden; cursor: pointer; flex: none; }
  .mini-thumb svg { width: 100%; height: 100%; }

  /* Floating Batch Bar */
  .batch-bar {
    position: fixed; left: calc(50% + 116px); bottom: 24px; transform: translateX(-50%);
    z-index: 90; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 8px 6px 14px; border-radius: 999px;
    background: #1D1D1F; color: #F5F5F7; box-shadow: var(--ui-shadow-dialog);
    font-size: 12.5px; line-height: 1;
  }
  html[data-theme="dark"] .batch-bar { background: #F5F5F7; color: #1D1D1F; }
  .stage.device-tablet .batch-bar,
  .stage.device-mobile .batch-bar { position: sticky; left: auto; transform: none; bottom: 12px; align-self: center; }
  .batch-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 28px; padding: 0 11px; border-radius: 999px; line-height: 1;
    background: rgba(255, 255, 255, .14); color: inherit; font-size: 12px; font-weight: 550;
  }
  .batch-btn:hover { background: rgba(255, 255, 255, .24); }
  .batch-btn.is-danger-fill { background: var(--ui-danger); color: #fff; }
  html[data-theme="dark"] .batch-btn { background: rgba(0, 0, 0, .1); }

  /* Collector Preset Strip */
  .preset-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; border-radius: 10px; background: var(--ui-soft); color: var(--ui-ink);
    font-size: 12.5px;
  }
  .preset-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  /* Provider Source Tabs */
  .src-tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .stage.device-tablet .src-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage.device-mobile .src-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .src-tab {
    padding: 11px 12px; border-radius: 10px; background: var(--ui-surface-sunken);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    text-align: left; transition: background .14s;
  }
  .src-tab:hover { background: var(--ui-control); }
  .src-tab.is-active { background: var(--ui-soft); color: var(--ui-ink); }
  .src-tab-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .src-tab-sub { font-size: 11.5px; color: var(--ui-text-tertiary); margin-top: 3px; line-height: 1; }
  .src-tab.is-active .src-tab-sub { color: var(--ui-ink); opacity: .8; }

  /* Platform Matrix */
  .plat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stage.device-tablet .plat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stage.device-mobile .plat-grid { grid-template-columns: 1fr; }
  .plat-slot {
    padding: 12px 13px; border-radius: 10px; background: var(--ui-surface);
    display: flex; flex-direction: column; gap: 7px;
  }
  .plat-slot.is-missing { background: transparent; border: 1px dashed var(--ui-border-strong); opacity: .7; }
  .plat-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12.5px; font-weight: 600; line-height: 1; }
  .plat-meta { font-size: 11.5px; color: var(--ui-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sha-chip {
    margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    height: 24px; padding: 0 7px; border-radius: 6px; background: var(--ui-surface-sunken);
    font-family: var(--ui-mono); font-size: 10.5px; color: var(--ui-text-tertiary); line-height: 1;
  }

  /* Tag Chips & Stepper */
  .tag-box {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    min-height: 36px; padding: 4px 8px; border-radius: 8px; background: var(--ui-control);
  }
  .tag-box:focus-within { background: var(--ui-surface); box-shadow: 0 0 0 2px var(--ui-btn); }
  .tag-chip {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    height: 24px; padding: 0 6px 0 9px; border-radius: 6px; line-height: 1;
    background: var(--ui-surface); font-size: 12px; font-weight: 500;
  }
  .tag-chip button { width: 15px; height: 15px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--ui-text-tertiary); }
  .tag-chip button:hover { color: var(--ui-danger); background: var(--ui-danger-soft); }
  .tag-box input { flex: 1; min-width: 72px; height: 26px; border: 0; background: transparent; outline: none; font-size: 12.5px; }

  .xb-stepper {
    display: inline-flex; align-items: center; height: 34px; border-radius: 8px;
    background: var(--ui-control); overflow: hidden;
  }
  .xb-stepper button { width: 32px; height: 100%; display: inline-flex; align-items: center; justify-content: center; color: var(--ui-text-secondary); }
  .xb-stepper button:hover { background: var(--ui-control-hover); color: var(--ui-text-primary); }
  .xb-stepper input { width: 64px; height: 100%; border: 0; background: transparent; text-align: center; font-weight: 600; font-size: 13px; outline: none; }

  .meter { height: 5px; border-radius: 999px; background: var(--ui-control); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 999px; background: var(--ui-btn); }

  /* Upload Drop Zone */
  .drop-zone {
    border-radius: 12px; background: var(--ui-surface-sunken); min-height: 240px; padding: 24px;
    border: 1.5px dashed var(--ui-border-strong);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    text-align: center; cursor: pointer; transition: background .14s, border-color .14s;
  }
  .drop-zone:hover { background: var(--ui-soft); border-color: var(--ui-btn); }
  .device-frame { width: 100%; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; position: relative; background: #111; }
  .device-frame.is-phone { width: 164px; aspect-ratio: 9/18; margin: 0 auto; border-radius: 22px; border: 5px solid #1C1C1F; }

  /* Android Dialog Preview */
  .phone-mock { width: 256px; margin: 0 auto; border-radius: 28px; background: #18181B; padding: 9px; }
  .phone-screen {
    border-radius: 20px; background: var(--ui-tint); height: 396px; position: relative;
    overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 14px;
  }
  .phone-dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .42); }
  .android-dlg {
    position: relative; z-index: 2; width: 100%; border-radius: 22px; background: var(--ui-surface);
    padding: 18px 16px 14px; box-shadow: var(--ui-shadow-dialog);
    display: flex; flex-direction: column; gap: 9px;
  }
  .android-dlg h4 { font-size: 14.5px; font-weight: 650; line-height: 1.3; }
  .android-dlg p { font-size: 12.5px; color: var(--ui-text-secondary); line-height: 1.55; white-space: pre-wrap; max-height: 132px; overflow-y: auto; }
  .android-dlg-btns { display: flex; gap: 8px; margin-top: 6px; }
  .android-dlg-btns span {
    flex: 1; height: 34px; border-radius: 9px; font-size: 12.5px; font-weight: 600; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .android-dlg-btns .c { background: var(--ui-control); color: var(--ui-text-secondary); }

  /* ==========================================================================
     弹层：抽屉（20px 圆角）& 弹窗（24px 圆角）& 命令面板 & Toast
     ========================================================================== */
  .xb-backdrop {
    position: fixed; inset: 0; z-index: 350;
    background: var(--ui-scrim); backdrop-filter: blur(4px);
    display: flex; justify-content: flex-end; animation: fadeIn .15s ease;
  }
  .xb-backdrop.is-center { justify-content: center; align-items: center; padding: 20px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .xb-drawer {
    width: min(520px, 100vw); height: 100%;
    background: var(--ui-surface); box-shadow: var(--ui-shadow-dialog);
    border-radius: 20px 0 0 20px; overflow: hidden;
    display: flex; flex-direction: column; animation: slideL .2s var(--ui-ease);
  }
  .xb-drawer.is-wide { width: min(740px, 100vw); }
  @keyframes slideL { from { transform: translateX(24px); opacity: .6; } to { transform: none; opacity: 1; } }

  .xb-dialog {
    width: min(700px, 100%); max-height: calc(100vh - 48px);
    background: var(--ui-surface); box-shadow: var(--ui-shadow-dialog);
    border-radius: 24px; overflow: hidden;
    display: flex; flex-direction: column; animation: pop .18s var(--ui-ease);
  }
  .xb-dialog.is-sm { width: min(420px, 100%); }
  @keyframes pop { from { transform: scale(.97) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .ov-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--ui-line); flex: none;

  .ov-foot {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px;
    padding: 14px 22px; border-top: 1px solid var(--ui-line); flex: none;

  .model-item {
    padding: 10px 12px; border-radius: 10px; background: var(--ui-surface-sunken);
    display: flex; flex-direction: column; gap: 8px;
  }
  .model-row { display: grid; grid-template-columns: 1fr 1fr 140px auto; gap: 8px; align-items: center; }
  .effort-bar { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .effort-chip {

  .cmd-box {

  .cmd-top { display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 14px; border-bottom: 1px solid var(--ui-line); }
  .cmd-top input { flex: 1; border: 0; background: transparent; outline: none; font-size: 13.5px; }
  .cmd-list { max-height: 320px; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; }

/* ============================================================================
   标准 .xb-menu 浮层菜单引擎（用于所有下拉选择器与 ⋯ 更多操作菜单）
   遵守 ui-conventions.md：一项一行、33px 高、说明进 title + aria-description
   ============================================================================ */
const MENU_REG = new Map();
let activeMenuKey = null;

function xbSelect({ id, value, options, prefix = '', sm = false, full = false, width = '', title = '', onChange }) {
  MENU_REG.set(id, { kind: 'select', value, options, onChange });
  const cur = options.find(o => String(o.value) === String(value)) || options[0] || { label: '请选择' };
  const isOpen = activeMenuKey === id;
  const cls = ['xb-select-btn', sm ? 'is-sm' : '', full ? 'is-full' : '', isOpen ? 'is-open' : ''].filter(Boolean).join(' ');
  const st = width ? `style="min-width:${width}"` : '';
  return `
    <button type="button" class="${cls}" ${st} data-menu-trigger="${esc(id)}"
      aria-haspopup="listbox" aria-expanded="${isOpen}"
      title="${esc(title || cur.desc || cur.label)}" aria-description="${esc(title || cur.desc || '')}"
      onclick="event.stopPropagation();openXbMenu('${esc(id)}', this)">
      <span class="xb-select-val">
        ${cur.dot ? `<i class="status-dot ${cur.dot}"></i>` : ''}
        ${prefix ? `<span class="pfx">${esc(prefix)}</span>` : ''}
        <span class="txt">${esc(cur.label)}</span>
      </span>
      <span class="xb-select-chev">${icon('chevDown', 14)}</span>
    </button>
  `;
}

function xbMoreMenu(id, items) {
  MENU_REG.set(id, { kind: 'action', items });
  return `
    <button type="button" class="xb-icon-btn is-sm" data-menu-trigger="${esc(id)}"
      aria-haspopup="menu" aria-label="更多操作" title="更多操作"
      onclick="event.stopPropagation();openXbMenu('${esc(id)}', this)">
      ${icon('more', 15)}
    </button>
  `;
}

function openXbMenu(id, triggerEl) {
  if (activeMenuKey === id) { closeXbMenu(); return; }
  closeXbMenu();
  const cfg = MENU_REG.get(id);
  if (!cfg) return;
  activeMenuKey = id;
  triggerEl.classList.add('is-open');

  const rect = triggerEl.getBoundingClientRect();
  const rows = cfg.kind === 'select' ? cfg.options : cfg.items;
  const menuW = cfg.kind === 'select' ? Math.max(Math.min(rect.width, 260), 176) : 184;
  const estH = Math.min(rows.length * 35 + 14, 280);
  const openUp = rect.bottom + estH + 10 > window.innerHeight && rect.top > estH;
  const alignRight = cfg.kind === 'action' || rect.left + menuW > window.innerWidth - 12;
  const left = alignRight ? Math.max(10, rect.right - menuW) : Math.min(rect.left, window.innerWidth - menuW - 12);
  const top = openUp ? Math.max(10, rect.top - estH - 6) : rect.bottom + 6;

  const html = cfg.kind === 'select'
    ? cfg.options.map(o => {
        const active = String(o.value) === String(cfg.value);
        return `
          <button type="button" class="xb-menu-item ${active ? 'is-active' : ''}" role="option" aria-selected="${active}"
            title="${esc(o.desc || o.label)}" aria-description="${esc(o.desc || '')}"
            onclick="pickMenuSelect('${esc(id)}','${esc(String(o.value))}')">
            ${o.icon ? `<span class="m-ico">${icon(o.icon, 14)}</span>` : o.dot ? `<i class="status-dot ${o.dot}"></i>` : ''}
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.label)}</span>
            ${active ? `<span class="m-chk">${icon('check', 14)}</span>` : o.hint ? `<span class="m-hint">${esc(o.hint)}</span>` : ''}
          </button>
        `;
      }).join('')
    : cfg.items.map((it, idx) => {
        if (it.sep) return '<div class="xb-menu-sep"></div>';
        return `
          <button type="button" class="xb-menu-item ${it.danger ? 'is-danger' : ''}" role="menuitem"
            title="${esc(it.desc || it.label)}" aria-description="${esc(it.desc || '')}"
            onclick="runMenuAction('${esc(id)}', ${idx})">
            ${it.icon ? `<span class="m-ico">${icon(it.icon, 14)}</span>` : ''}
            <span>${esc(it.label)}</span>
          </button>
        `;
      }).join('');

  document.getElementById('menuRoot').innerHTML = `
    <div class="xb-menu" role="${cfg.kind === 'select' ? 'listbox' : 'menu'}"
      style="left:${left}px;top:${top}px;width:${menuW}px" onclick="event.stopPropagation()">
      ${html}
    </div>
  `;
}

function pickMenuSelect(id, val) {
  const cfg = MENU_REG.get(id);
  closeXbMenu();
  if (cfg?.onChange) cfg.onChange(val);
}
function runMenuAction(id, idx) {
  const cfg = MENU_REG.get(id);
  const item = cfg?.items?.[idx];
  closeXbMenu();
  if (item?.run) item.run();
}
function closeXbMenu() {
  activeMenuKey = null;
  document.querySelectorAll('.xb-select-btn.is-open').forEach(el => el.classList.remove('is-open'));
  const root = document.getElementById('menuRoot');
  if (root) root.innerHTML = '';
}
document.addEventListener('click', closeXbMenu);
window.addEventListener('resize', closeXbMenu);
window.addEventListener('scroll', (e) => {
  if (e.target?.closest?.('.xb-menu')) return;
  closeXbMenu();
}, true);

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
function fmtBytes(b) { if (!b) return '—'; return b < 1024 * 1024 ? (b / 1024).toFixed(1) + ' KB' : (b / 1024 / 1024).toFixed(1) + ' MB'; }
function catName(id) { return CATEGORIES.find(c => c.id === id)?.name || '未分类'; }
function statusLabel(st) { return st === 'published' ? '已上架' : st === 'pending' ? '待审核' : '已下架'; }
function statusDot(st) { return st === 'published' ? 'ok' : st === 'pending' ? 'warn' : 'danger'; }

function toast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${icon('check', 14)}<span>${esc(msg)}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.18s'; }, 2300);
  setTimeout(() => el.remove(), 2550);
}

function setAppMode(m) {
  state.appMode = m;

  render();
}
function setAccent(acc) {
  state.accent = acc;
  document.documentElement.setAttribute('data-accent', acc);
  document.querySelectorAll('.rb-sw').forEach(b => b.classList.toggle('active', b.dataset.acc === acc));
}
function setTheme(t) {
  state.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeLightBtn').classList.toggle('active', t === 'light');
  document.getElementById('themeDarkBtn').classList.toggle('active', t === 'dark');
  render();
}
function setDevice(d) {
  state.device = d;
  const s = document.getElementById('stage');
  s.classList.remove('device-desktop', 'device-tablet', 'device-mobile');
  s.classList.add('device-' + d);
  ['desktop', 'tablet', 'mobile'].forEach(k => document.getElementById('dev' + k[0].toUpperCase() + k.slice(1) + 'Btn').classList.toggle('active', d === k));
  state.mobileMenuOpen = false;

}
function toggleDefaultPwd() { state.defaultPwdWarn = !state.defaultPwdWarn; document.getElementById('pwdWarnBtn').classList.toggle('on', state.defaultPwdWarn); render(); }
function toggleReviewBar(c) { document.getElementById('reviewBar').classList.toggle('collapsed', c); document.getElementById('stage').classList.toggle('bar-hidden', c); }
function go(p) { closeXbMenu(); state.page = p; state.appMode = 'console'; state.mobileMenuOpen = false; document.getElementById('modeConsoleBtn').classList.add('active'); document.getElementById('modeLoginBtn').classList.remove('active'); render(); }

function renderPage() {
  switch (state.page) {
    case 'overview': return renderOverview();
    case 'wallpapers': return renderWallpapers();

    case 'upload': return renderUpload();
    case 'apps': return renderApps();
    case 'desktop': return renderDesktop();
    case 'ai-providers': return renderAiProviders();
    case 'keys': return renderKeys();
    case 'proxies': return renderProxies();
    case 'cache': return renderCache();
    case 'account': return renderAccount();
    default: return renderOverview();
  }
}

/* ============================================================================
   2. 壁纸图库（页头大标签 + 无描边筛选 + 纯净画框 + ⋯ 菜单）
   ============================================================================ */
function filteredWp() {
  const f = state.wpFilter;
  return state.wallpapers.filter(w => {
    if (f.status !== 'all' && w.status !== f.status) return false;
    if (f.media !== 'all' && w.media_type !== f.media) return false;
    if (f.category !== 'all' && w.category !== f.category) return false;
    if (f.source !== 'all') {
      if (f.source === 'custom' && w.source_type !== 'custom') return false;
      if (f.source !== 'custom' && w.provider !== f.source) return false;
    }
    if (f.q.trim()) {
      const kw = f.q.trim().toLowerCase();
      if (!(w.title + ' ' + w.tags.join(' ') + ' ' + w.provider).toLowerCase().includes(kw)) return false;
    }
    return true;
  });
}

          <input class="xb-input" type="search" placeholder="搜索标题或标签…" value="${esc(state.wpFilter.q)}" oninput="state.wpFilter.q=this.value;render()" />
          ${state.wpFilter.q ? `<button type="button" class="af-r" aria-label="清空" onclick="state.wpFilter.q='';render()">${icon('close', 13)}</button>` : ''}

/* ============================================================================
   3. 采集工作台
   ============================================================================ */
function renderCollector() {
  const c = state.collector;
  const list = c.items.filter(it => {
    if (it.media_type !== c.media) return false;
    if (c.provider !== 'all' && it.provider !== c.provider) return false;
    if (c.orientation !== 'all' && it.orientation !== c.orientation) return false;
    if (c.q.trim() && !it.title.toLowerCase().includes(c.q.trim().toLowerCase())) return false;
    return true;
  });

  const srcOpts = [
    { value: 'all', label: '全部图源', dot: 'ok' },
    { value: 'unsplash', label: 'Unsplash', dot: 'ok' },
    { value: 'pexels', label: 'Pexels', dot: 'ok' },
    { value: 'pixabay', label: 'Pixabay', dot: 'warn', hint: '1 冷却' },
    { value: 'okslop', label: 'okslop', dot: 'off' },
    { value: 'bing', label: 'Bing 必应', dot: 'ok' },
  ];
  const oriOpts = [
    { value: 'all', label: '全部画幅' },
    { value: 'landscape', label: '横屏', icon: 'monitor' },
    { value: 'portrait', label: '竖屏', icon: 'phone' },
    { value: 'squarish', label: '方形', icon: 'grid' },
  ];
  const catOpts = CATEGORIES.map(x => ({ value: x.id, label: x.name, desc: x.desc }));
  const stOpts = [
    { value: 'published', label: '立即上架', dot: 'ok' },
    { value: 'pending', label: '待审核', dot: 'warn' },
  ];

  return `
    <header class="xb-page-head">
      <div class="xb-tabs-lg">
        <button type="button" class="${c.media === 'image' ? 'is-active' : ''}" onclick="state.collector.media='image';render()">图片壁纸</button>
        <button type="button" class="${c.media === 'video' ? 'is-active' : ''}" onclick="state.collector.media='video';render()">动态视频</button>
      </div>
      <div class="xb-page-actions">
        ${xbSelect({ id: 'col-src', value: c.provider, options: srcOpts, onChange: v => { state.collector.provider = v; render(); } })}
        ${xbSelect({ id: 'col-ori', value: c.orientation, options: oriOpts, onChange: v => { state.collector.orientation = v; render(); } })}
      </div>
    </header>

    <div class="filter-bar">
      <div class="xb-affix has-l ${c.q ? 'has-r' : ''}" style="flex:1;min-width:220px">
        <span class="af-l">${icon('search', 14)}</span>
        <input class="xb-input" type="search" placeholder="搜索外部供应商素材（如 极光、Cyberpunk、4K…）" value="${esc(c.q)}" oninput="state.collector.q=this.value;render()" />
        ${c.q ? `<button type="button" class="af-r" onclick="state.collector.q='';render()">${icon('close', 13)}</button>` : ''}
      </div>
      <button type="button" class="xb-btn-primary" onclick="toast('已刷新检索结果')">检索</button>
    </div>

    <div class="preset-strip" title="开启一键快采后，点击卡片直接按此处分类与状态入库，跳过确认弹窗">
      <div class="preset-l">
        <strong style="display:inline-flex;align-items:center;gap:5px">${icon('bolt', 13)}<span>采集预设</span></strong>
        ${xbSelect({ id: 'col-pc', value: c.presetCategory, options: catOpts, prefix: '分类：', sm: true, onChange: v => { state.collector.presetCategory = v; render(); } })}
        ${xbSelect({ id: 'col-ps', value: c.presetStatus, options: stOpts, prefix: '状态：', sm: true, onChange: v => { state.collector.presetStatus = v; render(); } })}
      </div>
      <div style="display:inline-flex;align-items:center;gap:8px;cursor:pointer" onclick="state.collector.quickMode=!state.collector.quickMode;render()">
        <span>一键快采</span>
        <button type="button" class="xb-switch" role="switch" aria-checked="${c.quickMode}"></button>
      </div>
    </div>

    <div class="wp-grid">
      ${list.map(it => {
        const done = c.collectedIds.has(it.id);
        const sel = c.selected.has(it.id);
        return `
          <article class="wp-card ${sel ? 'is-selected' : ''}">
            <div class="wp-thumb" onclick="openLightbox('${it.id}','collector')">
              ${artSvg(it.art)}
              ${!done ? `<button type="button" class="wp-sel-btn" onclick="event.stopPropagation();toggleCol('${it.id}')">${sel ? icon('check', 13) : ''}</button>` : ''}
              <div class="wp-top-r">
                ${done ? `<span class="wp-glass is-ok">${icon('check', 11)}<span>已入库</span></span>` : `
                  <button type="button" class="wp-glass is-action" onclick="event.stopPropagation();handleCollect('${it.id}')">
                    ${icon(c.quickMode ? 'bolt' : 'download', 11)}<span>${c.quickMode ? '快采' : '采集'}</span>
                  </button>
                `}
              </div>
              <div class="wp-bot-l">
                ${it.media_type === 'video' ? `<span class="wp-glass">${icon('play', 10)}<span>${it.duration}</span></span>` : ''}
                <span class="wp-glass num">${esc(it.resolution)}</span>
              </div>
            </div>
            <div class="wp-info">
              <div class="wp-info-l">
                <div class="wp-title">${esc(it.title)}</div>
                <div class="wp-sub"><span>${esc(it.provider)}</span><span>·</span><span>${it.orientation === 'landscape' ? '横屏' : it.orientation === 'portrait' ? '竖屏' : '方形'}</span></div>
              </div>
            </div>
          </article>
        `;
      }).join('')}
    </div>

    ${c.selected.size > 0 ? `
      <div class="batch-bar">
        <span>已选 <strong class="num">${c.selected.size}</strong> 项</span>
        <button type="button" class="batch-btn" onclick="batchColImport()">批量入库至「${esc(catName(c.presetCategory))}」</button>
        <button type="button" class="batch-btn" onclick="state.collector.selected.clear();render()">取消</button>
      </div>
    ` : ''}
  `;
}

            <span style="color:var(--ui-ink)">${icon(u.mediaType === 'video' ? 'play' : 'upload', 26)}</span>
            <strong style="font-size:14px">点击或拖拽上传${u.mediaType === 'video' ? '动态视频' : '高清图片'}</strong>
            <button type="button" class="xb-btn-soft is-sm" onclick="event.stopPropagation();simUpload()">载入示例预览</button>

              <button type="button" class="xb-btn-soft is-sm" onclick="state.upload.posterReady=!state.upload.posterReady;toast(state.upload.posterReady?'已上传封面':'已恢复首帧截屏');render()">${u.posterReady ? '已上传 ✓' : '上传封面'}</button>
            </div>
          </div>
        ` : ''}

      <div class="xb-group xb-group-pad" style="display:flex;flex-direction:column;gap:14px">

        <div class="split-eq" style="gap:10px">
          <div class="xb-field">
            <span class="xb-field-label">分类</span>
            ${xbSelect({ id: 'up-cat', value: u.category, options: catOpts, full: true, onChange: v => { state.upload.category = v; render(); } })}

          <div class="xb-field">

          </div>
        </div>
      </div>

}

              ${xbMoreMenu('relm-' + idx, [
                { label: '编辑与传包', icon: 'edit', run: () => openReleaseDrawer(idx) },
                { sep: true },
                { label: '删除版本', icon: 'trash', danger: true, desc: '从官网与更新检测中移除', run: () => { state.releases.splice(idx, 1); toast('版本已删除'); render(); } },

              }

              return `
                <div class="plat-slot" title="${esc(pkg.fileName || pkg.url)}">
                  <div class="plat-top">
                    <span style="display:inline-flex;align-items:center;gap:6px">${icon(t.ico, 14)}<span>${esc(t.short)}</span></span>

                  <div class="plat-meta num">${esc(pkg.fileName)} · ${fmtBytes(pkg.bytes)}</div>
                  ${pkg.sha256 ? `<div class="sha-chip"><span>SHA256 ${pkg.sha256.slice(0, 10)}…</span><button type="button" title="复制 SHA-256" onclick="copyText('${pkg.sha256}','已复制 SHA-256')">${icon('copy', 12)}</button></div>` : ''}

        </section>
      `).join('')}
    </div>
  `;
}

/* ============================================================================
   10. 搜索缓存 & 11. 管理员账户 & 登录页
   ============================================================================ */
function renderCache() {
  const c = state.cache;
  const hitRate = ((c.hits / (c.hits + c.misses)) * 100).toFixed(1);
  const capPct = Math.min(100, Math.round(c.entries / c.maxEntries * 100));

  return `
    <header class="xb-page-head">
      <h1 class="xb-page-title">搜索缓存</h1>
      <div class="xb-page-actions">
        <button type="button" class="xb-btn-ghost is-danger" onclick="clearCache()">清空缓存</button>
        <button type="button" class="xb-btn-primary" ${c.dirty ? '' : 'disabled'} onclick="state.cache.dirty=false;toast('已保存');render()">保存设置</button>
      </div>
    </header>

    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-top"><span>命中率</span></div><div class="kpi-val num">${hitRate}%</div><div class="meter"><i style="width:${hitRate}%"></i></div></div>
      <div class="kpi-card"><div class="kpi-top"><span>条目容量</span></div><div class="kpi-val num">${c.entries}<span style="font-size:13px;color:var(--ui-text-tertiary)">/${c.maxEntries}</span></div><div class="meter"><i style="width:${capPct}%"></i></div></div>
      <div class="kpi-card"><div class="kpi-top"><span>占用空间</span></div><div class="kpi-val num">${fmtBytes(c.bytes)}</div><div class="kpi-foot"><span>PostgreSQL 持久化</span></div></div>
      <div class="kpi-card"><div class="kpi-top"><span>最早条目</span></div><div class="kpi-val" style="font-size:18px">${esc(c.oldestAge)}</div><div class="kpi-foot"><span>命中 ${c.hits} / 回源 ${c.misses}</span></div></div>
    </div>

    <div class="xb-group">
      <div class="xb-row" title="关闭后每次检索都会实时请求外部供应商">
        <span style="font-weight:550">启用搜索缓存</span>
        <button type="button" class="xb-switch" role="switch" aria-checked="${c.enabled}" onclick="state.cache.enabled=!state.cache.enabled;state.cache.dirty=true;render()"></button>
      </div>
      <div class="xb-row" title="超过有效期不再命中，最长 30 天">
        <span style="font-weight:550">有效期</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div class="xb-stepper">
            <button type="button" onclick="state.cache.ttlValue=Math.max(1,state.cache.ttlValue-1);state.cache.dirty=true;render()">${icon('minus', 14)}</button>
            <input class="num" type="number" value="${c.ttlValue}" oninput="state.cache.ttlValue=Math.max(1,+this.value||1);state.cache.dirty=true" />
            <button type="button" onclick="state.cache.ttlValue++;state.cache.dirty=true;render()">${icon('plus', 14)}</button>
          </div>
          <div class="xb-seg">
            ${[[60, '分钟'], [3600, '小时'], [86400, '天']].map(([s, l]) => `<button type="button" class="${c.ttlUnit === s ? 'is-active' : ''}" onclick="state.cache.ttlUnit=${s};state.cache.dirty=true;render()">${l}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="xb-row" title="超过上限时按 LRU 淘汰最久未命中条目">
        <span style="font-weight:550">最大条数</span>
        <div class="xb-stepper">
          <button type="button" onclick="state.cache.maxEntries=Math.max(100,state.cache.maxEntries-100);state.cache.dirty=true;render()">${icon('minus', 14)}</button>
          <input class="num" style="width:82px" type="number" value="${c.maxEntries}" oninput="state.cache.maxEntries=Math.max(1,+this.value||100);state.cache.dirty=true" />
          <button type="button" onclick="state.cache.maxEntries+=100;state.cache.dirty=true;render()">${icon('plus', 14)}</button>
        </div>
      </div>
    </div>
  `;
}

  window.__cmds = cmds;
  document.getElementById('overlayRoot').innerHTML = `
    <div class="xb-backdrop is-center" onclick="if(event.target===this)closeOverlay()">
      <div class="cmd-box">
        <div class="cmd-top">${icon('search', 15)}<input id="cmdIn" placeholder="快速跳转…" autofocus oninput="filterCmd(this.value)" /><span class="xb-kbd-mini">ESC</span></div>
        <div class="cmd-list" id="cmdLs">${renderCmdRows(cmds, '')}</div>
      </div>
    </div>
  `;
  setTimeout(() => document.getElementById('cmdIn')?.focus(), 20);
}
function renderCmdRows(cmds, q) {
  const kw = q.trim().toLowerCase();
  return cmds.map((c, i) => ({ c, i })).filter(({ c }) => !kw || c.label.toLowerCase().includes(kw)).map(({ c, i }) => `
    <button type="button" class="xb-menu-item" onclick="closeOverlay();window.__cmds[${i}].run()">
      <span class="m-ico">${icon(c.icon, 14)}</span><span>${esc(c.label)}</span><span class="m-hint">${esc(c.hint)}</span>
    </button>
  `).join('') || '<div style="padding:20px;text-align:center;color:var(--ui-text-tertiary);font-size:12.5px">无匹配项</div>';
}
function filterCmd(q) { const el = document.getElementById('cmdLs'); if (el) el.innerHTML = renderCmdRows(window.__cmds, q); }

/* ============================================================================
   Domain Actions
   ============================================================================ */
function quickWpStatus(id, next) { const w = state.wallpapers.find(x => x.id === id); if (!w) return; w.status = next; toast(next === 'published' ? '已上架' : '已下架'); render(); }
function deleteWp(id) { state.wallpapers = state.wallpapers.filter(x => x.id !== id); state.wpSelected.delete(id); toast('已删除'); render(); }
function toggleWp(id) { state.wpSelected.has(id) ? state.wpSelected.delete(id) : state.wpSelected.add(id); render(); }
function toggleAllWp() { const l = filteredWp(); if (state.wpSelected.size === l.length) state.wpSelected.clear(); else l.forEach(w => state.wpSelected.add(w.id)); render(); }
function batchWp(st) { state.wallpapers.forEach(w => { if (state.wpSelected.has(w.id)) w.status = st; }); const n = state.wpSelected.size; state.wpSelected.clear(); toast(`已批量${st === 'published' ? '上架' : '下架'} ${n} 项`); render(); }
function batchDelWp() { const n = state.wpSelected.size; state.wallpapers = state.wallpapers.filter(w => !state.wpSelected.has(w.id)); state.wpSelected.clear(); toast(`已删除 ${n} 项`); render(); }

function toggleCol(id) { state.collector.selected.has(id) ? state.collector.selected.delete(id) : state.collector.selected.add(id); render(); }
function handleCollect(id) { state.collector.quickMode ? importExt(id, state.collector.presetCategory, state.collector.presetStatus) : openColModal(id); }
function importExt(id, cat, st) {
  const it = state.collector.items.find(x => x.id === id); if (!it) return;
  state.collector.collectedIds.add(id); state.collector.selected.delete(id);
  state.wallpapers.unshift({ id: 'wp-' + Math.floor(200 + Math.random() * 700), title: it.title, art: it.art, media_type: it.media_type, duration: it.duration, category: cat, tags: [it.provider], resolution: it.resolution, orientation: it.orientation, source_type: 'collected', provider: it.provider, status: st, localCopy: it.provider === 'pixabay', desc: '' });
  toast(`已采入「${it.title}」`); render();
}
function batchColImport() { const ids = [...state.collector.selected]; ids.forEach(id => importExt(id, state.collector.presetCategory, state.collector.presetStatus)); toast(`已批量入库 ${ids.length} 项`); }

function simUpload() {
  const v = state.upload.mediaType === 'video';
  state.upload.uploadedArt = v ? 'ocean' : 'space';
  state.upload.fileName = v ? 'emerald-waves-4k.mp4' : 'saturn-nebula-5k.webp';
  state.upload.width = v ? 3840 : 5120; state.upload.height = v ? 2160 : 2880;
  if (!state.upload.title) state.upload.title = v ? '翡翠浅海浪涌 4K' : '土星光环深空星云 5K';
  toast('已载入示例并探测规格'); render();
}
function submitUpload() {
  if (!state.upload.uploadedArt || !state.upload.title.trim()) { toast('请先上传素材并填写标题'); return; }
  state.wallpapers.unshift({ id: 'wp-' + Date.now(), title: state.upload.title.trim(), art: state.upload.uploadedArt, media_type: state.upload.mediaType, duration: state.upload.mediaType === 'video' ? '00:20' : undefined, category: state.upload.category, tags: [...state.upload.tags], resolution: `${state.upload.width}×${state.upload.height}`, orientation: state.upload.orientation, source_type: 'custom', provider: '自主上架', status: state.upload.status, localCopy: true, desc: state.upload.desc });
  state.upload.uploadedArt = null; state.upload.title = ''; toast('已发布到壁纸图库'); go('wallpapers');
}

function toggleRel(i) { state.releases[i].published = !state.releases[i].published; toast(state.releases[i].published ? '已上架' : '已下架'); render(); }
function copyText(t, m) { navigator.clipboard?.writeText(t).catch(() => {}); toast(m); }
function toggleXiaobanAi() { state.aiCatalogue.xiaobanAiEnabled = !state.aiCatalogue.xiaobanAiEnabled; state.aiCatalogue.revision++; toast(state.aiCatalogue.xiaobanAiEnabled ? '已开启入口' : '已隐藏入口'); render(); }
function toggleAi(id) { const p = state.aiCatalogue.providers.find(x => x.id === id); if (!p) return; p.enabled = !p.enabled; state.aiCatalogue.revision++; toast(p.enabled ? '已启用' : '已停用'); render(); }
function activeSourceToggleProxy(id) { const s = state.sources.find(x => x.id === id); if (!s) return; s.use_proxy = !s.use_proxy; toast(s.use_proxy ? '已走代理池' : '已改直连'); render(); }
function setHotlink(id, k, v) { const s = state.sources.find(x => x.id === id); if (!s) return; if (v === 'default') { s.hotlink[k].custom = false; s.hotlink[k].policy = s.hotlink[k].default; } else { s.hotlink[k].custom = true; s.hotlink[k].policy = v; } toast('策略已保存'); render(); }
function toggleKey(sid, i) { const s = state.sources.find(x => x.id === sid); s.keys[i].enabled = !s.keys[i].enabled; render(); }
function delKey(sid, i) { const s = state.sources.find(x => x.id === sid); s.keys.splice(i, 1); toast('密钥已删除'); render(); }
function addKey(sid, f) { const s = state.sources.find(x => x.id === sid); const fd = new FormData(f); const lb = String(fd.get('label') || '').trim(), k = String(fd.get('key') || '').trim(); if (!lb || !k) return; s.keys.push({ id: Date.now(), label: lb, preview: k.slice(0, 4) + '…' + k.slice(-4), enabled: true, requests: 0, failures: 0, last_status: null, cooldown_secs: null }); toast('密钥已添加'); render(); }
function probeOne(i) { const p = state.proxies[i]; p.probes = [{ target: 'Unsplash', ok: p.enabled, status: 200, ms: 132 + i * 40, error: '超时' }, { target: 'Pexels', ok: p.enabled, status: 200, ms: 168 + i * 35, error: '握手失败' }, { target: 'Pixabay', ok: p.enabled, status: 200, ms: 196 + i * 25, error: '重置' }, { target: 'okslop', ok: i === 0, status: 200, ms: 254, error: '403' }]; toast('测速完成'); render(); }
function probeAll() { state.proxies.forEach((_, i) => probeOne(i)); }
function addProxy(f) { const fd = new FormData(f); const n = String(fd.get('name') || '').trim(), u = String(fd.get('url') || '').trim(); if (!n || !u) return; state.proxies.push({ id: Date.now(), name: n, url: u.replace(/\/\/[^@]+@/, '//'), has_auth: u.includes('@'), enabled: true, requests: 0, failures: 0, last_error: null, cooldown_secs: null, probes: null }); toast('节点已添加'); render(); }
function clearCache() { state.cache.entries = 0; state.cache.bytes = 0; state.cache.oldestAge = '—'; toast('缓存已清空'); render(); }
function togglePw(id, b) { const e = document.getElementById(id); if (!e) return; const sh = e.type === 'password'; e.type = sh ? 'text' : 'password'; b.innerHTML = icon(sh ? 'eyeOff' : 'eye', 14); }
function saveAcc(f) { const fd = new FormData(f); const u = String(fd.get('user') || '').trim(), np = String(fd.get('npw') || ''), cp = String(fd.get('cpw') || ''); if (np && np !== cp) { toast('两次密码不一致'); return; } state.account.username = u || state.account.username; if (np) state.defaultPwdWarn = false; toast('已保存'); render(); }

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (state.appMode === 'console') openCmd(); }
  else if (e.key === 'Escape') { if (activeMenuKey) closeXbMenu(); else closeOverlay(); }
});

(function init() {
  const q = new URLSearchParams(location.search);
  const p = q.get('page'), t = q.get('theme'), d = q.get('device'), a = q.get('accent'), m = q.get('mode');
  if (p) state.page = p;
  if (a && ['red', 'green', 'blue', 'purple', 'amber', 'graphite'].includes(a)) setAccent(a);
  if (t === 'dark' || t === 'light') { state.theme = t; document.documentElement.setAttribute('data-theme', t); document.getElementById('themeLightBtn').classList.toggle('active', t === 'light'); document.getElementById('themeDarkBtn').classList.toggle('active', t === 'dark'); }
  if (d === 'tablet' || d === 'mobile' || d === 'desktop') setDevice(d);
  if (m === 'login') setAppMode('login');
  render();
})();
</script>
</body>
</html>
