[package]
name = "server-xiaoban-appstore"
version = "0.1.0"
edition = "2021"
description = "小伴优质应用商店 (Xiaoban AppStore) - 精选优质软件与管理后台，Rust Axum + PostgreSQL"
authors = ["bestyize"]
license = "MIT OR Apache-2.0"

[dependencies]
# Web 框架与运行时
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full"] }
tokio = { version = "1.40", features = ["full"] }

# 序列化与工具
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"

# HTTP 客户端 (用于采集各软件最新版本与下载包)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# 数据库 (PostgreSQL)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid", "json"] }

# 鉴权与安全
argon2 = "=0.6.0"
jsonwebtoken = "9.3"

# 静态资源与 MIME
mime_guess = "2.0"

# 日志与跟踪
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
