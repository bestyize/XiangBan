[package]
name = "pandown-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "tokio"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
jsonwebtoken = "9.3"
rusqlite = { version = "0.33", features = ["bundled"] }
mime_guess = "2.0"
percent-encoding = "2.3"
thiserror = "2.0"
anyhow = "1.0"
dirs = "6.0"

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false
