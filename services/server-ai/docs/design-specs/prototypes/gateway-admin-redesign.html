<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="red">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>小伴 AI 网关管理后台 · 官方设计规范版原型</title>
<style>
/* ==========================================================================
   小伴 AI 网关管理后台 · 严格遵循小伴全端统一设计规范
   - 无色偏纯中性画布：浅 #FAFAFA / #FFFFFF / #F2F2F2 / #EDEDED；深 #111111 / #1C1C1E / #2C2C2E
   - 90 / 8 / 2 配色占比 + 6 套官方主题色（默认小伴红 #E3203C / #EE4B5F）
   - 禁止实心黑块、禁止彩色糖果底标签（状态标签统一中性底 + 6px 语义色小圆点）
   - 静态卡片 16px 圆角 + 1px 细描边无阴影；阴影仅给浮层；居中弹窗 24px 圆角
   - 白卡片内输入框/次要控件用浅灰底无描边；一项一行，详细说明收进悬停提示
   ========================================================================== */
:root {
  --canvas: #fafafa;
  --surface: #ffffff;
  --subtle: #f2f2f2;
  --hover: #eaeaea;
  --line: #ededed;
  --line-strong: #dcdcdc;

  --ink-1: #222222;
  --ink-2: #444444;
  --ink-3: #666666;
  --ink-4: #9a9a9a;

  /* 动态主题色（默认小伴红，支持 6 套官方色板） */
  --brand: #e3203c;
  --brand-hi: #f0506a;
  --brand-soft: #fff3f4;
  --brand-ink: #e3203c;
  --brand-on: #ffffff;

  /* 固定语义色（不随主题色变化，仅用于圆点、文字与危险按钮） */
  --ok: #2fa36b;
  --warn: #d97706;
  --info: #2563eb;
  --danger: #e3203c;

  /* 圆角与间距阶梯（4px 网格） */
  --r-inner: 8px;
  --r-md: 12px;
  --r-card: 16px;
  --r-dialog: 24px;
  --r-pill: 999px;

  /* 阴影仅给浮层（静态卡片绝不加阴影） */
  --scrim: rgba(18, 18, 23, 0.38);
  --shadow-menu: 0 6px 24px rgba(0, 0, 0, 0.12);
  --shadow-drawer: -8px 0 32px rgba(18, 18, 23, 0.12);
  --shadow-dialog: 0 20px 56px rgba(22, 18, 28, 0.2);
  --shadow-toast: 0 6px 22px rgba(18, 18, 23, 0.14);

  --ease-in: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: cubic-bezier(0.4, 0, 1, 1);

  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  --studio-h: 48px;
}

:root[data-theme="dark"] {
  --canvas: #111111;
  --surface: #1c1c1e;
  --subtle: #2c2c2e;
  --hover: #363638;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.15);

  --ink-1: #ececec;
  --ink-2: #b4b4ba;
  --ink-3: #8e8e94;
  --ink-4: #636369;

  --ok: #34c27c;
  --warn: #fbbf24;
  --info: #7ab3ff;
  --danger: #ff6369;

  --scrim: rgba(0, 0, 0, 0.62);
  --shadow-menu: 0 8px 28px rgba(0, 0, 0, 0.5);
  --shadow-drawer: -12px 0 40px rgba(0, 0, 0, 0.52);
  --shadow-dialog: 0 22px 60px rgba(0, 0, 0, 0.56);
  --shadow-toast: 0 8px 24px rgba(0, 0, 0, 0.48);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--canvas);
  color: var(--ink-1);
  font-family: var(--font);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: var(--brand-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

/* ==========================================================================
   顶部设计稿评审控制栏（Studio Bar，浅色通透对齐 admin-redesign.html）
   ========================================================================== */
.studio-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  height: var(--studio-h); padding: 0 12px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; overflow-x: auto; scrollbar-width: none;
  transition: transform 200ms var(--ease-in);
}
.studio-bar::-webkit-scrollbar { display: none; }
.studio-bar.collapsed { transform: translateY(-100%); }
.studio-restore {
  position: fixed; top: 10px; right: 14px; z-index: 310;
  height: 30px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line-strong);
  color: var(--ink-1); font-size: 12px; font-weight: 600;
  box-shadow: var(--shadow-menu); display: none; align-items: center; gap: 6px;
}
.studio-bar.collapsed + .studio-restore { display: inline-flex; }

.sb-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.sb-tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-pill); background: var(--subtle); color: var(--ink-2); }
@media (max-width: 1400px) { .sb-tag { display: none; } }
.sb-seg {
  display: inline-flex; align-items: center; padding: 3px; border-radius: 9px;
  background: var(--subtle); gap: 2px; flex: none;
}
.sb-seg button {
  height: 25px; padding: 0 7px; border-radius: 6px; font-size: 11.5px;
  color: var(--ink-2); white-space: nowrap; transition: background 140ms, color 140ms;
}
.sb-seg button:hover { color: var(--ink-1); }
.sb-seg button.active { background: var(--brand); color: var(--brand-on); font-weight: 600; }

.swatches {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
  border-radius: 9px; background: var(--subtle); flex: none;
}
.swatch { width: 13px; height: 13px; border-radius: 50%; position: relative; transition: transform 140ms var(--ease-in); }
.swatch:hover { transform: scale(1.15); }
.swatch.active::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--ink-1); }

.sb-btn {
  height: 28px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
  background: var(--subtle); color: var(--ink-2); white-space: nowrap; flex: none;
  display: inline-flex; align-items: center; gap: 5px; transition: background 140ms, color 140ms;
}
.sb-btn:hover { background: var(--hover); color: var(--ink-1); }
.sb-spacer { flex: 1; min-width: 8px; }

/* ==========================================================================
   Viewport Stage
   ========================================================================== */
.stage-wrap { padding-top: var(--studio-h); min-height: 100vh; background: var(--canvas); transition: padding-top 200ms var(--ease-in); }
.stage-wrap.bar-hidden { padding-top: 0; }
.stage-wrap.mode-tablet,
.stage-wrap.mode-mobile {
  background: var(--subtle);
  padding: calc(var(--studio-h) + 20px) 16px 40px;
  display: flex; justify-content: center; align-items: flex-start;
}
.stage-wrap.bar-hidden.mode-tablet,
.stage-wrap.bar-hidden.mode-mobile { padding-top: 20px; }

.app-frame { width: 100%; min-height: calc(100vh - var(--studio-h)); background: var(--canvas); position: relative; }
.stage-wrap.bar-hidden .app-frame { min-height: 100vh; }
.stage-wrap.mode-tablet .app-frame {
  width: 960px; max-width: 100%; height: calc(100vh - var(--studio-h) - 56px); min-height: 740px;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--line-strong); box-shadow: var(--shadow-dialog);
}
.stage-wrap.mode-mobile .app-frame {
  width: 390px; max-width: 100%; height: 820px; min-height: 0;
  border-radius: 32px; overflow: hidden; border: 6px solid var(--line-strong); box-shadow: var(--shadow-dialog);
}

/* ==========================================================================
   官方规范核心控件（按钮 / 中性状态标签 / 筛选胶囊 / 卡片 / 无框浅灰输入）
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: var(--r-pill);
  background: var(--subtle); color: var(--ink-1);
  font-size: 13px; font-weight: 550; line-height: 1; white-space: nowrap;
  transition: background 140ms var(--ease-in), opacity 140ms, transform 80ms;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.outline { background: var(--surface); border: 1px solid var(--line); }
.btn.outline:hover:not(:disabled) { background: var(--subtle); }
.btn.primary { background: var(--brand); color: var(--brand-on); font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--brand-hi); }
.btn.danger { background: var(--surface); border: 1px solid var(--line); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--subtle); }
.btn.danger-solid { background: var(--danger); color: #ffffff; font-weight: 600; }
.btn.danger-solid:hover:not(:disabled) { filter: brightness(0.95); }
.btn.ghost { background: transparent; color: var(--ink-3); }
.btn.ghost:hover:not(:disabled) { background: var(--subtle); color: var(--ink-1); }
.btn.sm { height: 28px; padding: 0 11px; font-size: 12px; gap: 5px; }
.btn.lg { height: 42px; padding: 0 20px; font-size: 14px; }
.btn.icon { width: 32px; height: 32px; padding: 0; border-radius: 50%; }
.btn.icon.sm { width: 28px; height: 28px; }

/* 状态标签：严格禁止彩色糖果底！统一中性底 + 6px 固定语义圆点 + 中性文字 */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 550; white-space: nowrap;
  background: var(--subtle); color: var(--ink-2);
}
.tag.outlined { background: var(--surface); border: 1px solid var(--line); }
.tag.brand { background: var(--brand); color: var(--brand-on); font-weight: 600; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ink-4); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); }
.dot.info { background: var(--info); }
.dot.brand { background: var(--brand); }

/* 筛选胶囊：未选浅灰底，选中主题色实心 + 白字 */
.pill-tabs { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pill-tab {
  height: 30px; padding: 0 12px; border-radius: var(--r-pill);
  background: var(--subtle); color: var(--ink-2);
  font-size: 12.5px; font-weight: 550; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px;
  transition: background 140ms, color 140ms;
}
.pill-tab:hover { background: var(--hover); color: var(--ink-1); }
.pill-tab.active { background: var(--brand); color: var(--brand-on); font-weight: 600; }
.pill-tab .cnt { font-size: 11px; opacity: 0.72; }

/* 静态卡片：16px 圆角 + 1px #EDEDED 细描边，绝不加阴影 */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
}

/* 白卡片内输入控件：#F2F2F2 浅灰底无描边，聚焦呈现主题色焦点环 */
.input, .textarea {
  width: 100%; height: 36px; padding: 0 12px;
  border: 1px solid transparent; border-radius: var(--r-inner);
  background: var(--subtle); color: var(--ink-1); font-size: 13px;
  transition: background 140ms, border-color 140ms, box-shadow 140ms;
}
.textarea { height: auto; min-height: 72px; padding: 8px 12px; resize: vertical; line-height: 1.5; }
.input:hover, .textarea:hover { background: var(--hover); }
.input:focus, .textarea:focus {
  outline: none; background: var(--surface);
  border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent);
}
.input[readonly] { opacity: 0.65; cursor: default; }
.input::placeholder, .textarea::placeholder { color: var(--ink-4); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12.5px; font-weight: 600; color: var(--ink-1); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hint { font-size: 12px; color: var(--ink-3); line-height: 1.45; }

.affix-box { position: relative; }
.affix-box .input { padding-right: 48px; }
.affix-box .affix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-3); pointer-events: none; }

.search-box { position: relative; }
.search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-4); pointer-events: none; }
.search-box .input { padding-left: 34px; }

/* 风险警示条（仅用于必须先看到的风险/异常，中性白底 + 左侧语义色条，不整块刷彩色） */
.alert-strip {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: var(--r-md); background: var(--surface);
  border: 1px solid var(--line); border-left: 3px solid var(--warn);
  font-size: 13px; color: var(--ink-1);
}
.alert-strip.danger { border-left-color: var(--danger); }
.alert-strip.danger .ic-tint { color: var(--danger); }
.alert-strip .ic-tint { color: var(--warn); }
.alert-strip-act { margin-left: auto; flex: none; }

/* 金额展示（美元 + 小伴点） */
.money-val { display: inline-flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.money-usd { font-weight: 700; letter-spacing: -0.02em; }
.money-usd.muted { color: var(--ink-3); font-weight: 600; }
.money-usd .cur { font-size: 0.72em; font-weight: 600; opacity: 0.6; margin-right: 1px; }
.money-usd .dec { font-size: 0.76em; font-weight: 600; opacity: 0.65; }
.money-pts { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
[data-unit="usd"] .money-pts { display: none; }

/* ==========================================================================
   主壳层：纯白 236px 左导轨 + 52px 吸顶面包屑顶栏 + #FAFAFA 主画布
   ========================================================================== */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: inherit; height: 100%; }

.sidebar {
  position: sticky; top: var(--studio-h); height: calc(100vh - var(--studio-h));
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 14px 12px 12px;
  overflow-y: auto; z-index: 40;
}
.stage-wrap.bar-hidden .sidebar { top: 0; height: 100vh; }
.stage-wrap.mode-tablet .sidebar,
.stage-wrap.mode-mobile .sidebar { position: static; height: 100%; }

.brand-box { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-hi) 100%);
  display: grid; place-items: center;
}
.brand-txt strong { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; }
.brand-txt span { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.cmd-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  height: 34px; padding: 0 10px; margin: 0 2px 14px;
  border-radius: var(--r-inner); background: var(--subtle);
  color: var(--ink-3); font-size: 12.5px; white-space: nowrap;
  transition: background 140ms, color 140ms;
}
.cmd-trigger:hover { background: var(--hover); color: var(--ink-2); }
.cmd-trigger .l { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.cmd-trigger kbd {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 5px;
  border-radius: 5px; background: var(--surface); border: 1px solid var(--line);
  color: var(--ink-3);
}

.nav-group { margin-bottom: 14px; }
.nav-group-label { padding: 0 10px 6px; font-size: 11px; font-weight: 600; color: var(--ink-4); letter-spacing: 0.04em; }
.nav-item {
  width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-inner);
  display: flex; align-items: center; gap: 9px; text-align: left;
  color: var(--ink-2); font-size: 13px; font-weight: 500;
  position: relative; margin-bottom: 2px; transition: background 140ms, color 140ms;
}
.nav-item:hover { background: var(--subtle); color: var(--ink-1); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--brand);
}
.nav-badge {
  margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--r-pill); background: var(--danger); color: #fff;
  font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
}

.sb-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.me-row { display: flex; align-items: center; gap: 9px; padding: 4px 6px; }
.me-av {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  background: var(--brand-soft); color: var(--brand-ink);
  font-size: 12px; font-weight: 700; display: grid; place-items: center;
}
.me-meta { flex: 1; min-width: 0; }
.me-meta strong { display: block; font-size: 12.5px; line-height: 1.2; }
.me-meta span { display: block; font-size: 11px; color: var(--ink-3); }
.sb-foot-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sb-foot-btn {
  height: 30px; border-radius: var(--r-inner); background: var(--subtle);
  color: var(--ink-2); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: background 140ms, color 140ms;
}
.sb-foot-btn:hover { background: var(--hover); color: var(--ink-1); }

/* 右侧主区 + 52px 吸顶顶栏（桌面端随文档滚动，平板/手机端在画框内独立滚动） */
.main-col { min-width: 0; display: flex; flex-direction: column; }
.stage-wrap.mode-tablet .main-col,
.stage-wrap.mode-mobile .main-col { height: 100%; overflow-y: auto; }
.topbar {
  position: sticky; top: var(--studio-h); z-index: 30;
  height: 52px; padding: 0 28px; flex: none;
  background: color-mix(in srgb, var(--canvas) 92%, transparent);
  backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.stage-wrap.bar-hidden .topbar { top: 0; }
.stage-wrap.mode-tablet .topbar,
.stage-wrap.mode-mobile .topbar { top: 0; padding: 0 14px; }

.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.crumb strong { color: var(--ink-1); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.status-chip {
  height: 30px; padding: 0 11px; border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: background 140ms;
}
.status-chip:hover { background: var(--subtle); color: var(--ink-1); }

.main-inner { width: 100%; max-width: 1140px; margin: 0 auto; padding: 12px 28px 64px; }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
}
.page-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.3; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.section-block { margin-top: 24px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 15px; font-weight: 650; display: flex; align-items: center; gap: 8px; }

/* ==========================================================================
   表格（白底 16px 圆角卡片 + 0.5px/1px 细分隔线）
   ========================================================================== */

.codes-box {
  padding: 12px 14px; max-height: 220px; overflow-y: auto; border-radius: var(--r-md);
  background: var(--subtle); border: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px;
  font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.05em;
}
.codes-box li { display: flex; gap: 8px; padding: 2px 0; }
.codes-box .ln { color: var(--ink-4); width: 2ch; text-align: right; }

.cmd-dialog {
  position: fixed; top: 14%; left: 50%; transform: translateX(-50%);
  z-index: 260; width: min(500px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-dialog);
  box-shadow: var(--shadow-dialog); overflow: hidden; animation: popCmd 180ms var(--ease-in);
}
.cmd-input-wrap { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
.cmd-input-wrap input { flex: 1; border: 0; background: none; outline: none; font-size: 14px; color: var(--ink-1); }
.cmd-results { max-height: 320px; overflow-y: auto; padding: 6px; }
.cmd-item {
  width: 100%; height: 36px; padding: 0 12px; border-radius: var(--r-inner);
  display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-1);
}
.cmd-item:hover { background: var(--subtle); }

/* Toast：白底细框轻阴影胶囊（错误态固定危险红底白字） */
.toast-host {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 400; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-radius: var(--r-pill);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-1);
  box-shadow: var(--shadow-toast); font-size: 13px; font-weight: 550;
  animation: toastUp 180ms var(--ease-in);
}
.toast.danger { background: var(--danger); border-color: var(--danger); color: #fff; }

@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideIn { from { transform: translateX(28px); opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translate(-50%, -48%) scale(0.96); } }
@keyframes popCmd { from { opacity: 0; transform: translate(-50%, -8px) scale(0.97); } }
@keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } }
@keyframes toastUp { from { opacity: 0; transform: translateY(10px); } }

/* Responsive & Mobile */
.mobile-nav { display: none; }
@media (max-width: 1040px) {
  .kpi-grid, .setup-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .overview-grid, .gw-cols { grid-template-columns: 1fr; }
}
.stage-wrap.mode-tablet .kpi-grid, .stage-wrap.mode-tablet .setup-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage-wrap.mode-tablet .overview-grid, .stage-wrap.mode-tablet .gw-cols { grid-template-columns: 1fr; }
.stage-wrap.mode-mobile .shell { grid-template-columns: 1fr; }
.stage-wrap.mode-mobile .sidebar { display: none; }
.stage-wrap.mode-mobile .mobile-nav { display: flex; }
.stage-wrap.mode-mobile .main-inner { padding: 12px 14px 48px; }
.stage-wrap.mode-mobile .kpi-grid,
.stage-wrap.mode-mobile .overview-grid,
.stage-wrap.mode-mobile .setup-grid,
.stage-wrap.mode-mobile .media-grid,
.stage-wrap.mode-mobile .lr-grid,
.stage-wrap.mode-mobile .gw-cols { grid-template-columns: 1fr; }
.stage-wrap.mode-mobile .route-head { display: none; }
.stage-wrap.mode-mobile .route-row { grid-template-columns: 1fr; gap: 8px; }
.stage-wrap.mode-mobile .tier-arrow svg { transform: rotate(90deg); }

.mobile-nav { gap: 6px; padding: 8px 14px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); background: var(--surface); }
.mobile-nav::-webkit-scrollbar { display: none; }
</style>
</head>

function fmtUsdParts(points) {
  const d = points / QUOTA_PER_USD;
  const abs = Math.abs(d);
  const min = abs >= 100 ? 0 : 2;
  const max = abs >= 100 ? 0 : abs >= 1 ? 2 : 3;
  const [int, dec] = abs.toLocaleString('en-US', { minimumFractionDigits: min, maximumFractionDigits: max }).split('.');
  return { sign: d < 0 ? '−' : '', int, dec: dec ? '.' + dec : '' };
}
function fmtPts(points) {
  const v = (Math.abs(points) / QUOTA_PER_USD) * 100;
  return v === 0 ? '0 点' : v < 1 ? '<1 点' : `${Math.floor(v).toLocaleString('en-US')} 点`;
}
function moneyPlain(points) { const p = fmtUsdParts(points); return `${p.sign}$${p.int}${p.dec}`; }
function moneyHtml(points, { size = 14, muted = false, signed = false } = {}) {
  const p = fmtUsdParts(points);
  const s = p.sign || (signed && points > 0 ? '+' : '');
  return `<span class="money-val num"><span class="money-usd ${muted ? 'muted' : ''}" style="font-size:${size}px;${signed && points > 0 ? 'color:var(--ok)' : ''}">${s}<span class="cur">$</span>${p.int}<span class="dec">${p.dec}</span></span><span class="money-pts">${p.sign}${fmtPts(points)}</span></span>`;
}

}

            <button class="pill-tab ${state.chartMode === 'compare' ? 'active' : ''}" data-chart-mode="compare">消耗 vs 发放</button>
          </div>
        </div>
        <div class="chart-plot">
          <div class="chart-axis">${[0,1,2,3,4].map(i => `<span class="chart-tick num" style="bottom:${i*25}%">$${i*stepUnit}</span>`).join('')}</div>
          <div class="chart-field">
            <div class="chart-grid">${[0,1,2,3,4].map(i => `<div class="chart-line ${i===0?'base':''}" style="bottom:${i*25}%"></div>`).join('')}</div>
            <div class="chart-cols">
              ${state.series.map((d, i) => {
                const isToday = i === state.series.length - 1;
                const hC = Math.max(2, (d.consumed / QUOTA_PER_USD / topVal) * 100);
                const hG = Math.max(2, (d.granted / QUOTA_PER_USD / topVal) * 100);
                const edge = i <= 1 ? 'edge-l' : i >= state.series.length - 2 ? 'edge-r' : '';
                return `
                  <div class="chart-col ${isToday ? 'today' : ''} ${edge}">
                    <div class="chart-bars">
                      <span class="bar-used" style="height:${hC}%"></span>
                      ${state.chartMode === 'compare' && d.granted > 0 ? `<span class="bar-gave" style="height:${hG}%"></span>` : ''}
                    </div>
                    <div class="chart-tip">
                      <strong class="num">${d.day.slice(5).replace('-', ' 月 ')} 日</strong>
                      <div class="tip-row"><span>消耗</span><strong class="num">${moneyPlain(d.consumed)} · ${fmtPts(d.consumed)}</strong></div>
                      <div class="tip-row"><span>发放</span><strong class="num">${moneyPlain(d.granted)} · ${fmtPts(d.granted)}</strong></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="chart-x">
              ${state.series.map((d, i) => `<span class="num ${i===state.series.length-1?'today':''}">${i===state.series.length-1?'今天':(state.series.length-1-i)%3===0?d.day.slice(5).replace('-','/'):''}</span>`).join('')}
            </div>
          </div>
        </div>
      </section>

      <section class="card flow-card">
        <div class="section-head" style="margin-bottom:0">
          <h2>额度去向</h2>
          <span class="faint num" style="font-size:12px">累计 ${moneyPlain(grantedTotal)}</span>
        </div>
        <div class="flow-track">
          <span class="f-used" style="width:${pUsed}%"></span>
          <span class="f-left" style="width:${pLeft}%"></span>
          <span class="f-lapsed" style="width:${pLapsed}%"></span>
        </div>
        <div class="flow-list">
          <div class="flow-row" title="用户实际调用消耗，对应上游成本">
            <i class="dot" style="background:var(--ink-2)"></i>
            <strong>已消耗</strong><span class="flow-pct num">${pUsed}%</span>
            <span style="margin-left:auto">${moneyHtml(consumedTotal, { size: 13.5 })}</span>

          <div class="flow-row" title="仍在用户有效桶中的可用余额">
            <i class="dot brand"></i>
            <strong>待消耗</strong><span class="flow-pct num">${pLeft}%</span>
            <span style="margin-left:auto">${moneyHtml(totalBalance, { size: 13.5 })}</span>
          </div>
          <div class="flow-row" title="过期清零或退款扣回部分">
            <i class="dot"></i>
            <strong>过期 / 扣回</strong><span class="flow-pct num">${pLapsed}%</span>
            <span style="margin-left:auto">${moneyHtml(lapsedTotal, { size: 13.5 })}</span>

    <section class="section-block">

                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <strong>${p.name}</strong>

                  </div>

                </td>
                <td><span class="tag num">${p.client_ids.length} 个</span></td>
                <td class="right num">${p.bindings.toLocaleString('en-US')}</td>
                <td>${moneyHtml(p.consumed_7d, { size: 13.5 })}<span class="meter"><i style="width:${Math.round((p.consumed_7d / max7) * 100)}%"></i></span></td>
                <td class="right">${moneyHtml(p.balance, { size: 13.5 })}</td>
                <td class="right faint">${ico('chevRight', 15)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div></div>

  `;
}

                  ${c.id === 'image' ? `<div style="display:flex;gap:5px;flex-wrap:wrap">${s.sizes.map((v,i)=>`<span class="tag outlined mono">${v}${i===0?' · 默认':''}</span>`).join('')}</div>` : ''}
                  ${c.id === 'realtime' ? `<span class="faint" style="font-size:12px">最长 ${Math.round(s.max_secs/60)} 分钟</span>` : ''}

function renderUsers() {
  let rows = [...state.bindings];
  if (state.userQuery.trim()) {
    const q = state.userQuery.trim().toLowerCase();
    rows = rows.filter(r => r.uid.toLowerCase().includes(q) || String(r.id).includes(q));
  }
  if (state.userProduct) rows = rows.filter(r => r.product_id === state.userProduct);
  if (state.userFilter === 'funded') rows = rows.filter(r => r.balance > 0);
  if (state.userFilter === 'empty') rows = rows.filter(r => r.balance <= 0);
  if (state.userFilter === 'anomaly') rows = rows.filter(r => r.has_anomaly || r.synced_quota !== r.balance);
  if (state.userSort === 'balance') rows.sort((a, b) => b.balance - a.balance);

  return `
    <div class="page-head">
      <h1>用户额度</h1>
      <span class="tag num">共 ${rows.length} 个账号</span>
    </div>

    <div class="toolbar">

        <input class="input" id="userSearchInput" value="${state.userQuery}" placeholder="搜索 UID 前缀或绑定编号…" />
      </div>
      ${customSelectHtml('userProd', state.userProduct, [{ value: '', label: '全部产品' }, ...state.products.map(p => ({ value: p.product_id, label: p.name }))], { width: '164px' })}
      ${customSelectHtml('userSort', state.userSort, [{ value: 'last_used', label: '按最近使用' }, { value: 'balance', label: '按余额最高' }], { width: '132px' })}

        <tbody>
          ${rows.map(r => `
            <tr class="clickable" data-open-drawer="${r.id}">
              <td>
                <div class="user-cell">
                  <span class="avatar">${r.uid.slice(0,2).toUpperCase()}</span>
                  <div>
                    <div style="display:flex;align-items:center;gap:4px">

              <td>${prodName(r.product_id)}</td>
              <td class="right">${moneyHtml(r.balance, { size: 13.5, muted: r.balance <= 0 })}</td>
              <td>${r.synced_quota !== r.balance ? `<span class="tag"><i class="dot warn"></i>差额 ${moneyPlain(r.synced_quota - r.balance)}</span>` : `<span class="faint" style="font-size:12px">${r.last_synced_at}</span>`}</td>
              <td class="muted">${r.last_used_at}</td>
              <td><span class="tag"><i class="dot ok"></i>已开通</span></td>
            </tr>

function renderAudit() {
  let rows = state.audits.filter(r => state.auditCat === 'all' || r.cat === state.auditCat);
  if (state.auditQuery.trim()) {
    const q = state.auditQuery.trim().toLowerCase();
    rows = rows.filter(r => r.action.includes(q) || r.target.includes(q) || r.raw.includes(q));
  }
  const grouped = [];
  for (const r of rows) {
    let g = grouped[grouped.length - 1];
    if (!g || g.day !== r.day) { g = { day: r.day, items: [] }; grouped.push(g); }
    g.items.push(r);
  }
  return `
    <div class="page-head">
      <h1>操作日志</h1>
      <button class="btn sm outline" data-action="toggle-audit-raw">${state.auditRaw ? '结构化标签' : '原始参数'}</button>
    </div>
    <div class="toolbar">
      <div class="pill-tabs">
        ${[['all','全部'],['product','产品与档位'],['quota','额度'],['code','兑换码']].map(([k,l]) => `<button class="pill-tab ${state.auditCat === k ? 'active' : ''}" data-audit-cat="${k}">${l}</button>`).join('')}
      </div>
      <div class="search-box" style="max-width:240px;margin-left:auto">
        ${ico('search', 14)}
        <input class="input" id="auditSearchInput" value="${state.auditQuery}" placeholder="筛选操作或目标…" />
      </div>
    </div>
    ${grouped.map(g => `
      <div class="audit-day">
        <div class="audit-day-h">${g.day}</div>
        <div class="card">
          ${g.items.map(r => `
            <div class="audit-row">
              <span class="audit-ico">${ico('scroll', 14)}</span>
              <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><strong>${r.action}</strong><span class="tag mono">${r.target}</span></div>
                ${state.auditRaw ? `<div class="mono faint">${r.raw}</div>` : `<div style="display:flex;gap:5px;flex-wrap:wrap">${r.tags.map(t => `<span class="tag outlined">${t}</span>`).join('')}</div>`}
              </div>
              <div class="right num" style="font-size:12px"><strong>${r.time}</strong><div class="faint">${r.admin}</div></div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
  `;
}

        <div class="scrim ${ov}" data-close-modal></div>
        <div class="dialog narrow ${ov}">
          <div class="dialog-head"><h2>${m.title}</h2><button type="button" class="btn icon sm ghost" data-close-modal>${ico('x', 16)}</button></div>
          <div class="dialog-body">
            <p class="muted" style="font-size:13px">${m.desc}</p>
            ${m.withNote ? '<input class="input" id="confirmNoteInput" placeholder="原因（选填）" />' : ''}
          </div>
          <div class="dialog-foot"><button type="button" class="btn ghost" data-close-modal>取消</button><button type="button" class="btn danger-solid" id="confirmOkBtn">${m.okText}</button></div>
        </div>
      `);
    } else if (m.type === 'password') {
      parts.push(`
        <div class="scrim" data-close-modal></div>
        <form class="dialog narrow" id="pwForm">
          <div class="dialog-head"><h2>修改密码</h2><button type="button" class="btn icon sm ghost" data-close-modal>${ico('x', 16)}</button></div>
          <div class="dialog-body">
            <div class="field"><label>当前密码</label><input class="input" type="password" required /></div>
            <div class="field"><label>新密码</label><input class="input" type="password" minlength="8" required /></div>
          </div>
          <div class="dialog-foot"><button type="button" class="btn ghost" data-close-modal>取消</button><button type="submit" class="btn primary">保存</button></div>
        </form>
      `);
    }
  }

  if (state.cmdOpen) {
    const q = state.cmdQuery.trim().toLowerCase();
    parts.push(`
      <div class="scrim over" data-close-cmd></div>
      <div class="cmd-dialog">
        <div class="cmd-input-wrap">${ico('search', 16)}<input id="cmdInput" value="${state.cmdQuery}" placeholder="输入页面名、绑定号（1042）或兑换码…" autofocus /><button class="btn sm ghost" data-close-cmd>ESC</button></div>
        <div class="cmd-results">
          ${Object.entries(PAGE_META).filter(([k, m]) => !q || m.label.includes(q) || k.includes(q)).map(([k, m]) => `<button class="cmd-item" data-cmd-go="${k}">${ico('arrowRight', 14)}<span>${m.label}</span><span class="faint" style="margin-left:auto;font-size:12px">${m.group}</span></button>`).join('')}
        </div>
      </div>
    `);
  }

  document.getElementById('overlayRoot').innerHTML = parts.join('');
}

function render() {
  applyThemeTokens();
  const wrap = document.getElementById('stageWrap');
  wrap.classList.toggle('mode-tablet', state.device === 'tablet');
  wrap.classList.toggle('mode-mobile', state.device === 'mobile');

  document.querySelectorAll('#rbPages button').forEach(b => b.classList.toggle('active', b.dataset.go === state.page));
  document.querySelectorAll('#rbScene button').forEach(b => b.classList.toggle('active', b.dataset.sc === state.scene));
  document.querySelectorAll('#rbTheme button').forEach(b => b.classList.toggle('active', b.dataset.th === state.theme));
  document.querySelectorAll('#rbDevice button').forEach(b => b.classList.toggle('active', b.dataset.dev === state.device));
  document.getElementById('rbAccents').innerHTML = ACCENTS.map(a => `<button class="swatch ${state.accent === a.id ? 'active' : ''}" data-accent="${a.id}" title="${a.name}" style="background:${state.theme==='dark'?a.dark.btn:a.light.btn}"></button>`).join('');

  const root = document.getElementById('appRoot');
  if (state.page === 'login') {
    root.innerHTML = renderLogin();
  } else {
    const map = { overview: renderOverview, products: renderProducts, users: renderUsers, codes: renderCodes, issues: renderIssues, gateway: renderGateway, audit: renderAudit };
    root.innerHTML = `<div class="shell">${renderSidebar()}<div class="main-col">${renderTopbar()}<main class="main-inner">${(map[state.page] || renderOverview)()}</main></div></div>`;
  }
  renderOverlays();
  bindInputs();
}

function refocus(id, pos) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }

function bindInputs() {
  const uS = document.getElementById('userSearchInput');
  if (uS) uS.oninput = (e) => { state.userQuery = e.target.value; render(); refocus('userSearchInput', state.userQuery.length); };
  const aS = document.getElementById('auditSearchInput');
  if (aS) aS.oninput = (e) => { state.auditQuery = e.target.value; render(); refocus('auditSearchInput', state.auditQuery.length); };
  const mpS = document.getElementById('mpickerSearchInput');
  if (mpS && state.activeModal) mpS.oninput = (e) => { state.activeModal.modelQuery = e.target.value; renderOverlays(); bindInputs(); refocus('mpickerSearchInput', e.target.value.length); };
  const cmdI = document.getElementById('cmdInput');
  if (cmdI) cmdI.oninput = (e) => { state.cmdQuery = e.target.value; renderOverlays(); bindInputs(); refocus('cmdInput', state.cmdQuery.length); };
  const cForm = document.getElementById('codeLookupForm');
  if (cForm) cForm.onsubmit = (e) => {
    e.preventDefault();
    const raw = document.getElementById('codeQueryInput').value.trim().toUpperCase();
    state.codeQuery = raw;
    state.codeFound = state.sampleCodes[raw] || null;
    state.codeError = state.codeFound ? '' : '未找到该兑换码（可点上方测试码体验）';
    render();
  };
  const lgForm = document.getElementById('loginForm');
  if (lgForm) lgForm.onsubmit = (e) => { e.preventDefault(); state.page = 'overview'; toast('已登录'); render(); };
  const gwForm = document.getElementById('gwTokenForm');
  if (gwForm) gwForm.onsubmit = (e) => { e.preventDefault(); state.scene = 'ops'; toast('令牌已验证并保存'); render(); };
  const mForm = document.getElementById('mediaForm');
  if (mForm) mForm.onsubmit = (e) => {
    e.preventDefault();
    const m = state.activeModal;
    state.media[state.selectedProductId][m.cap] = { model: m.modelVal, enabled: m.enabled, requires_paid: m.requiresPaid, voices: m.voices, sizes: m.sizes, max_secs: m.minutes * 60 };
    state.activeModal = null; toast('已保存'); render();
  };
  const tForm = document.getElementById('tierForm');
  if (tForm) tForm.onsubmit = (e) => { e.preventDefault(); state.activeModal = null; toast('档位已保存'); render(); };
  const pForm = document.getElementById('productForm');
  if (pForm) pForm.onsubmit = (e) => { e.preventDefault(); state.activeModal = null; toast('产品已保存'); render(); };
  const bForm = document.getElementById('batchForm');
  if (bForm) bForm.onsubmit = (e) => {
    e.preventDefault();
    const alpha = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
    const codes = Array.from({ length: 12 }, () => Array.from({ length: 4 }, () => Array.from({ length: 4 }, () => alpha[Math.floor(Math.random()*alpha.length)]).join('')).join('-'));
    state.activeModal = { type: 'reveal', codes }; render();
  };
  const gForm = document.getElementById('grantForm');
  if (gForm) gForm.onsubmit = (e) => { e.preventDefault(); state.activeModal = null; toast('已补发额度'); render(); };
  const pwForm = document.getElementById('pwForm');
  if (pwForm) pwForm.onsubmit = (e) => { e.preventDefault(); state.activeModal = null; state.page = 'login'; toast('密码已修改'); render(); };
  const okBtn = document.getElementById('confirmOkBtn');
  if (okBtn && state.activeModal?.onConfirm) okBtn.onclick = () => { const fn = state.activeModal.onConfirm; state.activeModal = null; fn(); render(); };
}

document.addEventListener('click', (e) => {
  if (state.openSelectId && !e.target.closest('[data-cselect-root]')) { state.openSelectId = null; render(); }
  const t = e.target.closest('[data-nav],[data-go],[data-sc],[data-th],[data-dev],[data-accent],[data-action],[data-select-product],[data-jump-product],[data-chart-mode],[data-user-filter],[data-batch-filter],[data-audit-cat],[data-ma-filter],[data-open-drawer],[data-close-drawer],[data-close-modal],[data-close-cmd],[data-copy],[data-fill-code],[data-cselect-toggle],[data-cselect-pick],[data-mpicker-toggle],[data-pick-model],[data-toggle-switch],[data-tier-rmode],[data-toggle-effort],[data-chip-default],[data-chip-del],[data-chip-add],[data-chip-preset],[data-rt-mins],[data-batch-kind],[data-grant-kind],[data-cmd-go]');
  if (!t) return;
  if (t.dataset.copy) { navigator.clipboard?.writeText(t.dataset.copy).catch(()=>{}); return toast('已复制 UID'); }
  if (t.dataset.accent) { state.accent = t.dataset.accent; return render(); }
  if (t.dataset.nav) { state.page = t.dataset.nav; return render(); }
  if (t.dataset.go) { state.page = t.dataset.go; return render(); }
  if (t.dataset.sc) { state.scene = t.dataset.sc; return render(); }
  if (t.dataset.th) { state.theme = t.dataset.th; return render(); }
  if (t.dataset.dev) { state.device = t.dataset.dev; return render(); }
  if (t.dataset.selectProduct) { state.selectedProductId = t.dataset.selectProduct; return render(); }
  if (t.dataset.jumpProduct) { state.selectedProductId = t.dataset.jumpProduct; state.page = 'products'; return render(); }
  if (t.dataset.chartMode) { state.chartMode = t.dataset.chartMode; return render(); }
  if (t.dataset.userFilter) { state.userFilter = t.dataset.userFilter; return render(); }
  if (t.dataset.batchFilter) { state.batchFilter = t.dataset.batchFilter; return render(); }
  if (t.dataset.auditCat) { state.auditCat = t.dataset.auditCat; return render(); }
  if (t.dataset.maFilter) { state.modelOnlyWarn = t.dataset.maFilter === 'warn'; return render(); }
  if (t.dataset.openDrawer) { state.drawerBindingId = Number(t.dataset.openDrawer); return render(); }
  if (t.hasAttribute('data-close-drawer')) { state.drawerBindingId = null; return render(); }
  if (t.hasAttribute('data-close-modal')) { state.activeModal = null; return render(); }
  if (t.hasAttribute('data-close-cmd')) { state.cmdOpen = false; return render(); }
  if (t.dataset.cmdGo) { state.cmdOpen = false; state.page = t.dataset.cmdGo; return render(); }
  if (t.dataset.fillCode) { state.codeQuery = t.dataset.fillCode; state.codeFound = state.sampleCodes[t.dataset.fillCode]; state.codeError = ''; return render(); }
  if (t.dataset.cselectToggle) { state.openSelectId = state.openSelectId === t.dataset.cselectToggle ? null : t.dataset.cselectToggle; return render(); }
  if (t.dataset.cselectPick) {
    const id = t.dataset.cselectPick, val = t.dataset.val;
    state.openSelectId = null;
    if (id === 'userProd') state.userProduct = val;
    if (id === 'userSort') state.userSort = val;
    if (id === 'batchProd') state.batchProduct = val;
    if (id === 'modalBatchProd' && state.activeModal) { state.activeModal.productId = val; renderOverlays(); bindInputs(); return; }
    return render();
  }
  if (t.hasAttribute('data-mpicker-toggle') && state.activeModal) { state.activeModal.pickerOpen = !state.activeModal.pickerOpen; renderOverlays(); bindInputs(); return; }
  if (t.dataset.pickModel && state.activeModal) { state.activeModal.modelVal = t.dataset.pickModel; state.activeModal.pickerOpen = false; state.activeModal.modelQuery = ''; renderOverlays(); bindInputs(); return; }
  if (t.dataset.toggleSwitch && state.activeModal) {
    const n = t.dataset.toggleSwitch, m = state.activeModal;
    if (n === 'is_default') { m.isDefault = !m.isDefault; if (m.isDefault) { m.requiresPaid = false; m.enabled = true; } }
    if (n === 'requires_paid') m.requiresPaid = !m.requiresPaid;
    if (n === 'enabled') m.enabled = !m.enabled;
    renderOverlays(); bindInputs(); return;
  }
  if (t.dataset.tierRmode && state.activeModal) { state.activeModal.reasoningMode = t.dataset.tierRmode; renderOverlays(); bindInputs(); return; }
  if (t.dataset.toggleEffort && state.activeModal) {
    const lv = t.dataset.toggleEffort, a = state.activeModal.reasoningLevels;
    state.activeModal.reasoningLevels = a.includes(lv) ? a.filter(x => x !== lv) : [...a, lv];
    renderOverlays(); bindInputs(); return;
  }
  if (t.dataset.chipDefault && state.activeModal) { const k = t.dataset.chipDefault, v = t.dataset.val; state.activeModal[k] = [v, ...state.activeModal[k].filter(x => x !== v)]; renderOverlays(); bindInputs(); return; }
  if (t.dataset.chipDel && state.activeModal) { const k = t.dataset.chipDel, v = t.dataset.val; state.activeModal[k] = state.activeModal[k].filter(x => x !== v); renderOverlays(); bindInputs(); return; }
  if (t.dataset.chipAdd && state.activeModal) { const k = t.dataset.chipAdd, v = document.getElementById(`chipAddInput_${k}`)?.value.trim(); if (v && !state.activeModal[k].includes(v)) state.activeModal[k].push(v); renderOverlays(); bindInputs(); return; }
  if (t.dataset.chipPreset && state.activeModal) { const k = t.dataset.chipPreset, v = t.dataset.val, a = state.activeModal[k]; state.activeModal[k] = a.includes(v) ? a.filter(x => x !== v) : [...a, v]; renderOverlays(); bindInputs(); return; }
  if (t.dataset.rtMins && state.activeModal) { state.activeModal.minutes = Number(t.dataset.rtMins); renderOverlays(); bindInputs(); return; }
  if (t.dataset.batchKind && state.activeModal) { state.activeModal.kind = t.dataset.batchKind; renderOverlays(); bindInputs(); return; }
  if (t.dataset.grantKind && state.activeModal) { state.activeModal.kind = t.dataset.grantKind; renderOverlays(); bindInputs(); return; }

  const act = t.dataset.action;
  if (act === 'toggle-unit') { state.unitMode = state.unitMode === 'both' ? 'usd' : 'both'; return render(); }
  if (act === 'toggle-theme') { state.theme = state.theme === 'light' ? 'dark' : 'light'; return render(); }
  if (act === 'open-cmd') { state.cmdOpen = true; state.cmdQuery = ''; renderOverlays(); bindInputs(); return; }
  if (act === 'open-password') { state.activeModal = { type: 'password' }; return render(); }
  if (act === 'open-batch') { state.activeModal = { type: 'batch', productId: state.products[0].product_id, kind: 'topup' }; return render(); }
  if (act === 'open-grant') { state.activeModal = { type: 'grant', bindingId: Number(t.dataset.bid), kind: 'topup' }; return render(); }
  if (act === 'clear-code') { state.codeQuery = ''; state.codeFound = null; state.codeError = ''; return render(); }
  if (act === 'toggle-audit-raw') { state.auditRaw = !state.auditRaw; return render(); }
  if (act === 'open-product-modal') { state.activeModal = { type: 'product', productObj: t.dataset.pid === 'new' ? null : state.products.find(x => x.product_id === t.dataset.pid) }; return render(); }
  if (act === 'open-tier-modal') {
    const tierObj = t.dataset.tier === 'new' ? null : (state.tiers[state.selectedProductId] || []).find(x => x.tier === t.dataset.tier);
    state.activeModal = { type: 'tier', tierObj, modelVal: tierObj?.model || state.models[0].model_name, pickerOpen: false, isDefault: tierObj?.is_default ?? false, requiresPaid: tierObj?.requires_paid ?? false, enabled: tierObj ? tierObj.enabled : true, reasoningMode: tierObj?.reasoning_efforts == null ? 'auto' : tierObj.reasoning_efforts.length ? 'manual' : 'off', reasoningLevels: tierObj?.reasoning_efforts?.length ? [...tierObj.reasoning_efforts] : ['low', 'high', 'max'] };
    return render();
  }
  if (act === 'open-media-modal') {
    const labels = { speech: '语音合成', image: '图片生成', transcribe: '语音识别', realtime: '实时语音' };
    const defs = { speech: 'tts-1-hd', image: 'gpt-image-2.6', transcribe: 'whisper-large-v3', realtime: 'gpt-realtime-2026' };
    const cap = t.dataset.cap, s = (state.media[state.selectedProductId] || {})[cap] || null;
    state.activeModal = { type: 'media', cap, capLabel: labels[cap], setting: s, modelVal: s?.model || defs[cap], pickerOpen: false, voices: s?.voices?.length ? [...s.voices] : ['nova', 'alloy'], sizes: s?.sizes?.length ? [...s.sizes] : ['1024x1024', 'auto'], minutes: Math.round((s?.max_secs || 1800) / 60), requiresPaid: s?.requires_paid ?? false, enabled: s ? s.enabled : true };
    return render();
  }
  if (act === 'confirm-delete-tier') { state.activeModal = { type: 'confirm', title: `删除档位「${t.dataset.tier}」？`, desc: '删除后客户端请求该档位将返回未知档位错误。', okText: '确认删除', onConfirm: () => { state.tiers[state.selectedProductId] = state.tiers[state.selectedProductId].filter(x => x.tier !== t.dataset.tier); toast('已删除'); } }; return render(); }
  if (act === 'confirm-delete-media') { state.activeModal = { type: 'confirm', title: '关闭这项媒体能力？', desc: '关闭后客户端调用将返回 503 暂未开放。', okText: '确认关闭', onConfirm: () => { delete state.media[state.selectedProductId][t.dataset.cap]; toast('已关闭'); } }; return render(); }
  if (act === 'confirm-void-batch') { const bid = Number(t.dataset.bid); state.activeModal = { type: 'confirm', title: `作废批次 #${bid} 剩余码？`, desc: '已兑换的不受影响，未兑换的作废后不可恢复。', okText: '确认作废', onConfirm: () => { const b = state.batches.find(x => x.id === bid); if (b) { b.void += b.unused; b.unused = 0; } toast('已作废'); } }; return render(); }
  if (act === 'confirm-void-code') { state.activeModal = { type: 'confirm', title: '作废此兑换码？', desc: '作废后无人能再兑换，不可恢复。', okText: '确认作废', onConfirm: () => { state.codeFound.status = 'void'; state.codeFound.voided_at = '刚刚'; toast('已作废'); } }; return render(); }
  if (act === 'confirm-clawback') { state.activeModal = { type: 'confirm', title: '扣回剩余额度？', desc: '已消耗部分不退回，此操作不可撤销。', okText: '确认扣回', withNote: true, onConfirm: () => { state.codeFound.bucket_closed_reason = 'admin_void'; toast('已扣回'); } }; return render(); }
  if (act === 'open-void-bucket') { const bkid = Number(t.dataset.bkid); state.activeModal = { type: 'confirm', title: '扣回该额度桶？', desc: '用户将立即无法继续使用该桶剩余额度。', okText: '确认扣回', withNote: true, onConfirm: () => { const u = state.bindings.find(x => x.id === state.drawerBindingId); const bk = u?.buckets.find(x => x.id === bkid); if (bk) { u.balance -= bk.remaining; bk.closed_at = '刚刚'; } toast('已扣回'); } }; return render(); }
  if (act === 'resolve-anomaly') { const a = state.anomalies.find(x => x.id === Number(t.dataset.aid)); if (a) a.resolved_at = '刚刚'; toast('已标记处理'); return render(); }
  if (act === 'test-gateway') { state.gwTesting = true; render(); setTimeout(() => { state.gwTesting = false; state.gwLatency = 18 + Math.floor(Math.random() * 18); toast(`探测通过 · ${state.gwLatency}ms`); render(); }, 350); return; }
  if (act === 'copy-reveal') { toast('已复制全部兑换码'); return; }
  if (act === 'download-reveal') { toast('已下载 .txt 卡密'); return; }
});

document.getElementById('rbMediaModal').onclick = () => {
  state.page = 'products';
  const s = state.media.wallpaper.speech;
  state.activeModal = { type: 'media', cap: 'speech', capLabel: '语音合成', setting: s, modelVal: s.model, pickerOpen: true, voices: [...s.voices], sizes: [], minutes: 30, requiresPaid: false, enabled: true };
  render();
};
document.getElementById('rbTierModal').onclick = () => {
  state.page = 'products';
  const tierObj = state.tiers.wallpaper[1];
  state.activeModal = { type: 'tier', tierObj, modelVal: tierObj.model, pickerOpen: false, isDefault: false, requiresPaid: true, enabled: true, reasoningMode: 'manual', reasoningLevels: [...tierObj.reasoning_efforts] };
  render();
};
document.getElementById('rbHide').onclick = () => { document.getElementById('studioBar').classList.add('collapsed'); document.getElementById('stageWrap').classList.add('bar-hidden'); };
document.getElementById('studioRestore').onclick = () => { document.getElementById('studioBar').classList.remove('collapsed'); document.getElementById('stageWrap').classList.remove('bar-hidden'); };
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.cmdOpen = !state.cmdOpen; state.cmdQuery = ''; renderOverlays(); bindInputs(); }
  else if (e.key === 'Escape') { state.cmdOpen = false; state.activeModal = null; state.drawerBindingId = null; renderOverlays(); }
});

(function init() {
  const sp = new URLSearchParams(location.search);
  if (sp.get('page') && PAGE_META[sp.get('page')]) state.page = sp.get('page');
  if (sp.get('page') === 'login') state.page = 'login';
  if (sp.get('theme') === 'dark' || sp.get('theme') === 'light') state.theme = sp.get('theme');
  if (ACCENTS.some(a => a.id === sp.get('accent'))) state.accent = sp.get('accent');
  if (['desktop', 'tablet', 'mobile'].includes(sp.get('device'))) state.device = sp.get('device');
  if (['ops', 'onboarding', 'alert'].includes(sp.get('scene'))) state.scene = sp.get('scene');
  render();
})();
</script>
