        <div class="dialog wide">
          <div class="dialog-head">
            <div><h2>已生成 ${m.codes.length} 个兑换码（批次 #${m.batch.id}）</h2><p>${KIND_LABELS[m.batch.kind]} · 单码 ${moneyPlain(m.batch.quota)}（${fmtPoints(m.batch.quota)}）· 兑换后 ${m.batch.valid_days} 天有效</p></div>
          </div>
          <div class="dialog-body">
            <div class="banner warn">${ico('alert', 16)}<span><strong>明文仅显示这一次</strong>，关闭后无法再次找回。请先下载 .txt 或复制后再关闭窗口。</span></div>
            <ol class="codes-box">
              ${m.codes.map((c, i) => `<li><span class="ln">${i + 1}</span><span>${c}</span></li>`).join('')}
            </ol>
          </div>
          <div class="dialog-foot">
            <button type="button" class="btn" data-action="copy-reveal">${ico('copy', 14)}复制全部</button>
            <button type="button" class="btn primary" data-action="download-reveal">${ico('download', 14)}下载 .txt 卡密</button>
            <button type="button" class="btn" data-close-modal>我已保存，关闭</button>
          </div>
        </div>
      `);
    } else if (m.type === 'grant') {
      const gk = m.kind || 'topup';
      parts.push(`
        <div class="scrim over" data-close-modal></div>
        <form class="dialog over" id="grantForm">
          <div class="dialog-head">
            <div><h2>补发额度 · 绑定 #${m.bindingId}</h2><p>补发后立即计入用户可用余额并同步至 New API，同时写入操作审计。</p></div>
            <button type="button" class="btn icon sm ghost" data-close-modal>${ico('x', 16)}</button>
          </div>
          <div class="dialog-body">
            <div class="kind-grid">
              <button type="button" class="kind-opt ${gk === 'topup' ? 'on' : ''}" data-grant-kind="topup"><strong>加油包</strong><span>长期有效，默认 365 天</span></button>
              <button type="button" class="kind-opt ${gk === 'monthly' ? 'on' : ''}" data-grant-kind="monthly"><strong>月卡</strong><span>限时有效，默认 30 天</span></button>
            </div>
            <div class="pair-grid">
              <div class="field"><label>金额（$1 = 100 点）</label><div class="affix-box"><input class="input num" name="usd" type="number" step="0.01" min="0.01" value="5" required /><span class="affix">美元</span></div></div>
              <div class="field"><label>有效期</label><div class="affix-box"><input class="input num" name="days" type="number" min="1" max="3650" value="${gk === 'monthly' ? 30 : 365}" required /><span class="affix">天</span></div></div>
            </div>
            <div class="field"><label>备注（选填）</label><input class="input" name="note" placeholder="如：客服补偿 / 淘宝订单号" /></div>
          </div>
          <div class="dialog-foot">
            <button type="button" class="btn" data-close-modal>取消</button>
            <button type="submit" class="btn primary">确认补发</button>
          </div>
        </form>
      `);
    } else if (m.type === 'confirm') {
      parts.push(`
        <div class="scrim ${overCls}" data-close-modal></div>
        <div class="dialog ${overCls}" style="width:min(430px,calc(100vw - 28px))">
          <div class="dialog-head">
            <div><h2>${m.title}</h2><p>${m.desc}</p></div>
            <button type="button" class="btn icon sm ghost" data-close-modal>${ico('x', 16)}</button>
          </div>
          ${m.withNote ? `<div class="dialog-body"><div class="field"><label>操作原因（选填，写入流水与审计）</label><input class="input" id="confirmNoteInput" placeholder="${m.notePlaceholder || '如：淘宝订单退款'}" /></div></div>` : ''}
          <div class="dialog-foot">
            <button type="button" class="btn" data-close-modal>取消</button>
            <button type="button" class="btn danger-solid" id="confirmOkBtn">${m.okText || '确认执行'}</button>
          </div>
        </div>
      `);
    } else if (m.type === 'password') {
      parts.push(`
        <div class="scrim" data-close-modal></div>
        <form class="dialog" id="pwForm" style="width:min(420px,calc(100vw - 28px))">
          <div class="dialog-head">
            <div><h2>修改管理员密码</h2><p>修改后所有设备上的管理员登录令牌都会立即失效。</p></div>
            <button type="button" class="btn icon sm ghost" data-close-modal>${ico('x', 16)}</button>
          </div>
          <div class="dialog-body">
            <div class="field"><label>当前密码</label><input class="input" type="password" required /></div>
            <div class="field"><label>新密码（至少 8 位）</label><input class="input" type="password" minlength="8" required /></div>
            <div class="field"><label>确认新密码</label><input class="input" type="password" minlength="8" required /></div>
          </div>
          <div class="dialog-foot">
            <button type="button" class="btn" data-close-modal>取消</button>
            <button type="submit" class="btn primary">保存新密码</button>
          </div>
        </form>
      `);
    }
  }

  // 3. Command Palette (⌘K)
  if (state.cmdOpen) {
    const q = state.cmdQuery.trim().toLowerCase();
    const pages = [
      ['overview', '概览', '核心 KPI、14 天流水与额度去向'],
      ['products', '产品与档位', '档位路由映射与媒体能力配置'],
      ['users', '用户额度', '查询账号余额、补发与扣回'],
      ['codes', '兑换码', '查码退款与淘宝卡密批次管理'],
      ['issues', '对账异常', '核对 New API 钱包与本地账本差额'],
      ['gateway', '网关连接', '管理令牌与上游模型定价自检'],
      ['audit', '操作日志', '管理员操作留痕审计'],
    ].filter(([k, l, d]) => !q || l.includes(q) || d.includes(q) || k.includes(q));

    const matchedUsers = state.bindings.filter(b => !q || b.uid.includes(q) || String(b.id).includes(q)).slice(0, 3);
    const looksLikeCode = /^[a-z0-9-]{8,}$/i.test(q);

    parts.push(`
      <div class="scrim over" data-close-cmd></div>
      <div class="cmd-dialog" role="dialog" aria-label="全局快速检索">
        <div class="cmd-input-wrap">
          ${ico('search', 16)}
          <input id="cmdInput" value="${state.cmdQuery}" placeholder="输入页面名、绑定号（1042）、UID 或粘贴兑换码…" autofocus />
          <button class="btn sm ghost" data-close-cmd>ESC</button>
        </div>
        <div class="cmd-results">
          ${looksLikeCode ? `
            <div class="cmd-group-h">快捷查码</div>
            <button class="cmd-item" data-cmd-code="${state.cmdQuery.trim()}">
              ${ico('ticket', 15)}<span>查询兑换码 <strong class="mono">${state.cmdQuery.trim().toUpperCase()}</strong></span><span class="sub">跳转到兑换码页</span>
            </button>
          ` : ''}
          ${matchedUsers.length ? `
            <div class="cmd-group-h">直达用户账本</div>
            ${matchedUsers.map(u => `
              <button class="cmd-item" data-cmd-user="${u.id}">
                ${avatarHtml(u.uid, 24)}
                <span>绑定 <strong>#${u.id}</strong> · <span class="mono faint">${u.uid.slice(0, 8)}</span></span>
                <span class="sub num">${moneyPlain(u.balance)}</span>
              </button>
            `).join('')}
          ` : ''}
          <div class="cmd-group-h">页面跳转</div>
          ${pages.map(([k, l, d]) => `
            <button class="cmd-item" data-cmd-go="${k}">
              ${ico('arrowRight', 14)}<span>${l}</span><span class="sub">${d}</span>
            </button>
          `).join('')}
        </div>
      </div>
    `);
  }

  document.getElementById('overlayRoot').innerHTML = parts.join('');
}

/* ==========================================================================
   Main Render Loop & Event Delegation
   ========================================================================== */
function render() {
  document.documentElement.dataset.theme = state.theme;
  document.body.dataset.unit = state.unitMode;

  const wrap = document.getElementById('stageWrap');
  wrap.classList.toggle('mode-tablet', state.device === 'tablet');
  wrap.classList.toggle('mode-mobile', state.device === 'mobile');

  // Sync review bar states
  document.querySelectorAll('#rbPages button').forEach(b => b.classList.toggle('active', b.dataset.go === state.page));
  document.querySelectorAll('#rbSceneSeg button').forEach(b => b.classList.toggle('active', b.dataset.sc === state.scene));
  document.querySelectorAll('#rbDevice button').forEach(b => b.classList.toggle('active', b.dataset.dev === state.device));
  document.querySelectorAll('#rbTheme button').forEach(b => b.classList.toggle('active', b.dataset.th === state.theme));

  const root = document.getElementById('appRoot');
  if (state.page === 'login') {
    root.innerHTML = renderLogin();
  } else {
    const viewMap = {
      overview: renderOverview,
      products: renderProducts,
      users: renderUsers,
      codes: renderCodes,
      issues: renderIssues,
      gateway: renderGateway,
      audit: renderAudit,
    };
    root.innerHTML = `
      <div class="shell">
        ${renderSidebar()}
        <div class="main-col">
          ${renderMobileBar()}
          <main class="main-inner">${(viewMap[state.page] || renderOverview)()}</main>
        </div>
      </div>
    `;
  }

  renderOverlays();
  bindDynamicInputs();
}

function bindDynamicInputs() {
  const uSearch = document.getElementById('userSearchInput');
  if (uSearch) {
    uSearch.oninput = (e) => { state.userQuery = e.target.value; render(); refocus('userSearchInput', state.userQuery.length); };
  }

  const aSearch = document.getElementById('auditSearchInput');
  if (aSearch) {
    aSearch.oninput = (e) => { state.auditQuery = e.target.value; render(); refocus('auditSearchInput', state.auditQuery.length); };
  }

  const codeForm = document.getElementById('codeLookupForm');
  if (codeForm) {
    codeForm.onsubmit = (e) => {
      e.preventDefault();
      const raw = document.getElementById('codeQueryInput').value.trim().toUpperCase();
      state.codeQuery = raw;
      const found = state.sampleCodes[raw];
      if (found) { state.codeFound = found; state.codeError = ''; }
      else { state.codeFound = null; state.codeError = '未找到该兑换码或校验位不正确（可点击上方预设测试码体验）'; }
      render();
    };
  }

  const gwForm = document.getElementById('gwTokenForm');
  if (gwForm) {
    const inp = document.getElementById('gwTokenInput');
    const chk = document.getElementById('gwTokenCheck');
    inp.oninput = () => {
      const v = inp.value.trim();
      if (!v) chk.textContent = '保存前会先在线验证';
      else if (!v.startsWith('nap_')) chk.innerHTML = '<span style="color:var(--warn)">建议使用 nap_ 开头的专用访问令牌</span>';
      else chk.innerHTML = '<span style="color:var(--ok)">格式有效，可验证保存</span>';
    };
    document.getElementById('toggleGwEye').onclick = () => { inp.type = inp.type === 'password' ? 'text' : 'password'; };
    gwForm.onsubmit = (e) => {
      e.preventDefault();
      if (!inp.value.trim()) return toast('请先粘贴管理令牌', 'warn');
      state.gwStatus = 'ok';
      if (state.scene !== 'ops') state.scene = 'ops';
      toast('令牌已向 New API 验证通过并加密保存，立即生效');
      render();
    };
  }

  const loginForm = document.getElementById('loginForm');
  if (loginForm) {
    document.getElementById('lgEye').onclick = () => {
      const p = document.getElementById('lgPass');
      p.type = p.type === 'password' ? 'text' : 'password';
    };
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      state.page = 'overview';
      toast('欢迎回来，yize');
      render();
    };
  }

  // Modal forms
  const mpSearch = document.getElementById('mpickerSearchInput');
  if (mpSearch && state.activeModal) {
    mpSearch.oninput = (e) => {
      state.activeModal.modelQuery = e.target.value;
      renderOverlays();
      bindDynamicInputs();
      refocus('mpickerSearchInput', e.target.value.length);
    };
  }
  const rtMin = document.getElementById('rtMinutesInput');
  if (rtMin && state.activeModal?.type === 'media') {
    rtMin.oninput = (e) => { state.activeModal.minutes = Number(e.target.value) || 30; };
  }
  ['voices', 'sizes'].forEach(kind => {
    const el = document.getElementById(`chipAddInput_${kind}`);
    if (el && state.activeModal?.type === 'media') {
      el.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = el.value.trim();
          if (v && !state.activeModal[kind].includes(v)) {
            state.activeModal[kind] = [...state.activeModal[kind], v];
            renderOverlays(); bindDynamicInputs();
          }
        }
      };
    }
  });
  const tierForm = document.getElementById('tierForm');
  if (tierForm) {
    tierForm.oninput = (e) => {
      if (!state.activeModal || state.activeModal.type !== 'tier') return;
      const n = e.target.name;
      if (n === 'display_name') state.activeModal.displayName = e.target.value;
      if (n === 'tier') state.activeModal.slug = e.target.value;
      if (n === 'description') state.activeModal.description = e.target.value;
      if (n === 'max_ctx') state.activeModal.maxCtx = e.target.value;
    };
    tierForm.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(tierForm);
      const slug = String(fd.get('tier')).trim();
      const list = state.tiers[state.selectedProductId] || [];
      const payload = {
        tier: slug,
        display_name: String(fd.get('display_name')).trim(),
        description: String(fd.get('description')).trim(),
        model: state.activeModal.modelVal,
        is_default: !!state.activeModal.isDefault,
        requires_paid: !!state.activeModal.requiresPaid,
        enabled: !!state.activeModal.enabled,
        sort_order: 20,
        reasoning_efforts: state.activeModal.reasoningMode === 'auto' ? null : state.activeModal.reasoningMode === 'off' ? [] : [...state.activeModal.reasoningLevels],
        capabilities: fd.get('max_ctx') ? { max_context_tokens: Number(fd.get('max_ctx')), max_output_tokens: 16384 } : null,
      };
      if (payload.is_default) { list.forEach(x => x.is_default = false); payload.requires_paid = false; payload.enabled = true; }
      const idx = list.findIndex(x => x.tier === slug);
      if (idx >= 0) list[idx] = payload; else list.push(payload);
      state.activeModal = null;
      toast(`档位「${payload.display_name}」已保存，新请求立即生效`);
      render();
    };
  }

  const prodForm = document.getElementById('productForm');
  if (prodForm) {
    prodForm.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(prodForm);
      const pid = String(fd.get('product_id')).trim();
      const existing = state.products.find(p => p.product_id === pid);
      const cids = String(fd.get('client_ids')).split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
      if (existing) {
        existing.name = String(fd.get('name')).trim();
        existing.credit_purchase_url = String(fd.get('credit_purchase_url')).trim();
        existing.client_ids = cids;
        existing.trial_quota = pts(Number(fd.get('trial_usd')) || 0);
        existing.trial_days = Number(fd.get('trial_days')) || 7;
      } else {
        state.products.push({
          product_id: pid, name: String(fd.get('name')).trim(), client_ids: cids,
          credit_purchase_url: String(fd.get('credit_purchase_url')).trim(),
          trial_quota: pts(Number(fd.get('trial_usd')) || 0), trial_days: Number(fd.get('trial_days')) || 7,
          enabled: true, bindings: 0, balance: 0, consumed_7d: 0,
        });
        state.tiers[pid] = [];
        state.media[pid] = {};
      }
      state.selectedProductId = pid;
      state.activeModal = null;
      toast('产品配置已保存');
      render();
    };
  }

  const mediaForm = document.getElementById('mediaForm');
  if (mediaForm) {
    mediaForm.onsubmit = (e) => {
      e.preventDefault();
      const m = state.activeModal;
      const cap = m.cap;
      if (!state.media[state.selectedProductId]) state.media[state.selectedProductId] = {};
      state.media[state.selectedProductId][cap] = {
        capability: cap,
        model: m.modelVal,
        enabled: !!m.enabled,
        requires_paid: !!m.requiresPaid,
        voices: cap === 'speech' ? [...m.voices] : [],
        sizes: cap === 'image' ? [...m.sizes] : [],
        max_secs: cap === 'realtime' ? (Number(m.minutes) || 30) * 60 : 1800,
      };
      state.activeModal = null;
      toast('媒体能力已保存并生效');
      render();
    };
  }

  const batchForm = document.getElementById('batchForm');
  if (batchForm) {
    batchForm.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(batchForm);
      const count = Math.min(24, Math.max(1, Number(fd.get('count')) || 10));
      const newId = Math.max(...state.batches.map(b => b.id)) + 1;
      const batch = {
        id: newId,
        product_id: state.activeModal.productId || state.products[0].product_id,
        kind: state.activeModal.kind || 'topup',
        quota: pts(Number(fd.get('usd')) || 5),
        valid_days: Number(fd.get('days')) || 365,
        note: String(fd.get('note') || '').trim() || '演示批次',
        created_by: 'yize', created_at: '刚刚',
        total: Number(fd.get('count')) || 10, unused: Number(fd.get('count')) || 10, redeemed: 0, void: 0,
      };
      state.batches.unshift(batch);
      const alpha = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
      const gen = () => Array.from({ length: 4 }, () => Array.from({ length: 4 }, () => alpha[Math.floor(Math.random() * alpha.length)]).join('')).join('-');
      const codes = Array.from({ length: count }, gen);
      state.activeModal = { type: 'reveal', batch, codes };
      state.page = 'codes';
      render();
    };
  }

  const grantForm = document.getElementById('grantForm');
  if (grantForm) {
    grantForm.onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(grantForm);
      const addPts = pts(Number(fd.get('usd')) || 5);
      const kind = state.activeModal.kind || 'topup';
      const days = Number(fd.get('days')) || 365;
      const note = String(fd.get('note') || '').trim();
      const b = state.bindings.find(x => x.id === state.activeModal.bindingId);
      if (b) {
        b.balance += addPts;
        b.synced_quota += addPts;
        b.buckets.unshift({ id: Date.now() % 10000, kind, total: addPts, remaining: addPts, expires_at: '2027-11-26', left: `还剩 ${days} 天`, soon: false, source: 'admin:yize', closed_at: null });
        b.ledger.unshift({ id: Date.now(), kind: 'grant', title: `${KIND_LABELS[kind]}入账`, delta: addPts, balance_after: b.balance, time: '刚刚', day: '今天', note: note ? `管理员补发：${note}` : '管理员补发' });
      }
      state.activeModal = null;
      toast(`已补发 ${moneyPlain(addPts)}（${fmtPoints(addPts)}），并同步至网关`);
      render();
    };
  }

  const pwForm = document.getElementById('pwForm');
  if (pwForm) {
    pwForm.onsubmit = (e) => {
      e.preventDefault();
      state.activeModal = null;
      toast('密码已更新，请重新登录');
      state.page = 'login';
      render();
    };
  }

  const confirmBtn = document.getElementById('confirmOkBtn');
  if (confirmBtn && state.activeModal?.onConfirm) {
    confirmBtn.onclick = () => {
      const noteVal = document.getElementById('confirmNoteInput')?.value?.trim() || '';
      const fn = state.activeModal.onConfirm;
      state.activeModal = null;
      fn(noteVal);
      render();
    };
  }

  const cmdInput = document.getElementById('cmdInput');
  if (cmdInput) {
    cmdInput.oninput = (e) => {
      state.cmdQuery = e.target.value;
      renderOverlays();
      bindDynamicInputs();
      refocus('cmdInput', state.cmdQuery.length);
    };
  }
}

function refocus(id, pos) {
  const el = document.getElementById(id);
  if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
}

/* ==========================================================================
   Global Click & Keyboard Delegation
   ========================================================================== */
document.addEventListener('click', (e) => {
  // 点击外部自动收起 custom select
  if (state.openSelectId && !e.target.closest('[data-cselect-root]')) {
    state.openSelectId = null;
    render();
  }

  const t = e.target.closest('[data-nav],[data-go],[data-dev],[data-th],[data-sc],[data-action],[data-select-product],[data-jump-product],[data-chart-mode],[data-user-filter],[data-batch-filter],[data-audit-cat],[data-ma-filter],[data-open-drawer],[data-close-drawer],[data-close-modal],[data-close-cmd],[data-copy],[data-fill-code],[data-pick-model],[data-toggle-effort],[data-batch-kind],[data-grant-kind],[data-ledger-filter],[data-cmd-go],[data-cmd-user],[data-cmd-code],[data-cselect-toggle],[data-cselect-pick],[data-mpicker-toggle],[data-mpicker-clear],[data-toggle-switch],[data-tier-rmode],[data-chip-default],[data-chip-del],[data-chip-add],[data-chip-preset],[data-rt-mins]');
  if (!t) return;

  if (t.dataset.copy) return copyText(t.dataset.copy, 'UID 已复制');
  if (t.dataset.cselectToggle) {
    const id = t.dataset.cselectToggle;
    state.openSelectId = state.openSelectId === id ? null : id;
    return render();
  }
  if (t.dataset.cselectPick) {
    const id = t.dataset.cselectPick;
    const val = t.dataset.val;
    state.openSelectId = null;
    if (id === 'userProd') state.userProduct = val;
    if (id === 'userSort') state.userSort = val;
    if (id === 'batchProd') state.batchProduct = val;
    if (id === 'modalBatchProd' && state.activeModal?.type === 'batch') {
      state.activeModal.productId = val;
      renderOverlays(); bindDynamicInputs(); return;
    }
    return render();
  }
  if (t.hasAttribute('data-mpicker-toggle') && state.activeModal) {
    state.activeModal.pickerOpen = !state.activeModal.pickerOpen;
    renderOverlays(); bindDynamicInputs();
    if (state.activeModal.pickerOpen) refocus('mpickerSearchInput', (state.activeModal.modelQuery || '').length);
    return;
  }
  if (t.hasAttribute('data-mpicker-clear') && state.activeModal) {
    state.activeModal.modelQuery = '';
    renderOverlays(); bindDynamicInputs(); refocus('mpickerSearchInput', 0);
    return;
  }
  if (t.dataset.pickModel && state.activeModal) {
    state.activeModal.modelVal = t.dataset.pickModel;
    state.activeModal.pickerOpen = false;
    state.activeModal.modelQuery = '';
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.toggleSwitch && state.activeModal) {
    const name = t.dataset.toggleSwitch;
    const m = state.activeModal;
    if (name === 'is_default') {
      m.isDefault = !m.isDefault;
      if (m.isDefault) { m.requiresPaid = false; m.enabled = true; }
    } else if (name === 'requires_paid') {
      m.requiresPaid = !m.requiresPaid;
    } else if (name === 'enabled') {
      m.enabled = !m.enabled;
    }
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.tierRmode && state.activeModal?.type === 'tier') {
    state.activeModal.reasoningMode = t.dataset.tierRmode;
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.chipDefault && state.activeModal?.type === 'media') {
    const kind = t.dataset.chipDefault;
    const val = t.dataset.val;
    state.activeModal[kind] = [val, ...state.activeModal[kind].filter(x => x !== val)];
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.chipDel && state.activeModal?.type === 'media') {
    const kind = t.dataset.chipDel;
    const val = t.dataset.val;
    state.activeModal[kind] = state.activeModal[kind].filter(x => x !== val);
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.chipAdd && state.activeModal?.type === 'media') {
    const kind = t.dataset.chipAdd;
    const inp = document.getElementById(`chipAddInput_${kind}`);
    const val = inp?.value.trim();
    if (val && !state.activeModal[kind].includes(val)) {
      state.activeModal[kind] = [...state.activeModal[kind], val];
    }
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.chipPreset && state.activeModal?.type === 'media') {
    const kind = t.dataset.chipPreset;
    const val = t.dataset.val;
    const list = state.activeModal[kind];
    state.activeModal[kind] = list.includes(val) ? list.filter(x => x !== val) : [...list, val];
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.rtMins && state.activeModal?.type === 'media') {
    state.activeModal.minutes = Number(t.dataset.rtMins);
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.grantKind && state.activeModal?.type === 'grant') {
    state.activeModal.kind = t.dataset.grantKind;
    renderOverlays(); bindDynamicInputs(); return;
  }

  if (t.dataset.nav) { state.page = t.dataset.nav; if (t.hasAttribute('data-close-drawer')) state.drawerBindingId = null; return render(); }
  if (t.dataset.go) { state.page = t.dataset.go; return render(); }
  if (t.dataset.sc) { state.scene = t.dataset.sc; return render(); }
  if (t.dataset.dev) { state.device = t.dataset.dev; return render(); }
  if (t.dataset.th) { state.theme = t.dataset.th; return render(); }
  if (t.dataset.selectProduct) { state.selectedProductId = t.dataset.selectProduct; return render(); }
  if (t.dataset.jumpProduct) { state.selectedProductId = t.dataset.jumpProduct; state.page = 'products'; return render(); }
  if (t.dataset.chartMode) { state.chartMode = t.dataset.chartMode; return render(); }
  if (t.dataset.userFilter) { state.userFilter = t.dataset.userFilter; return render(); }
  if (t.dataset.batchFilter) { state.batchFilter = t.dataset.batchFilter; return render(); }
  if (t.dataset.auditCat) { state.auditCat = t.dataset.auditCat; return render(); }
  if (t.dataset.maFilter) { state.modelAuditOnlyWarn = t.dataset.maFilter === 'warn'; return render(); }
  if (t.dataset.openDrawer) { state.drawerBindingId = Number(t.dataset.openDrawer); state.drawerLedgerFilter = 'all'; return render(); }
  if (t.hasAttribute('data-close-drawer')) { state.drawerBindingId = null; return render(); }
  if (t.hasAttribute('data-close-modal')) { state.activeModal = null; return render(); }
  if (t.hasAttribute('data-close-cmd')) { state.cmdOpen = false; return render(); }
  if (t.dataset.ledgerFilter) { state.drawerLedgerFilter = t.dataset.ledgerFilter; return render(); }
  if (t.dataset.fillCode) {
    state.codeQuery = t.dataset.fillCode;
    state.codeFound = state.sampleCodes[t.dataset.fillCode];
    state.codeError = '';
    return render();
  }
  if (t.dataset.pickModel && state.activeModal?.type === 'tier') {
    state.activeModal.modelVal = t.dataset.pickModel;
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.toggleEffort && state.activeModal?.type === 'tier') {
    const lv = t.dataset.toggleEffort;
    const arr = state.activeModal.reasoningLevels;
    state.activeModal.reasoningLevels = arr.includes(lv) ? arr.filter(x => x !== lv) : [...arr, lv];
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.batchKind && state.activeModal?.type === 'batch') {
    state.activeModal.kind = t.dataset.batchKind;
    renderOverlays(); bindDynamicInputs(); return;
  }
  if (t.dataset.cmdGo) { state.cmdOpen = false; state.page = t.dataset.cmdGo; return render(); }
  if (t.dataset.cmdUser) { state.cmdOpen = false; state.page = 'users'; state.drawerBindingId = Number(t.dataset.cmdUser); return render(); }
  if (t.dataset.cmdCode) {
    state.cmdOpen = false; state.page = 'codes'; state.codeQuery = t.dataset.cmdCode.toUpperCase();
    state.codeFound = state.sampleCodes[state.codeQuery] || null;
    state.codeError = state.codeFound ? '' : '未找到该兑换码（可尝试点上方测试码）';
    return render();
  }

  const act = t.dataset.action;
  if (act === 'toggle-unit') { state.unitMode = state.unitMode === 'both' ? 'usd' : 'both'; toast(state.unitMode === 'both' ? '已开启「美元 + 小伴点」双显' : '已切换为纯美元显示'); return render(); }
  if (act === 'toggle-theme') { state.theme = state.theme === 'light' ? 'dark' : 'light'; return render(); }
  if (act === 'open-cmd') { state.cmdOpen = true; state.cmdQuery = ''; renderOverlays(); bindDynamicInputs(); return; }
  if (act === 'open-password') { state.activeModal = { type: 'password' }; return render(); }
  if (act === 'open-batch') { state.activeModal = { type: 'batch', productId: state.products[0].product_id, kind: 'topup', usd: 5, count: 20 }; return render(); }
  if (act === 'clear-code') { state.codeQuery = ''; state.codeFound = null; state.codeError = ''; return render(); }
  if (act === 'toggle-audit-raw') { state.auditRaw = !state.auditRaw; return render(); }
  if (act === 'toggle-closed-buckets') { state.drawerShowClosed = !state.drawerShowClosed; return render(); }
  if (act === 'open-grant') { state.activeModal = { type: 'grant', bindingId: Number(t.dataset.bid), kind: 'topup' }; return render(); }
  if (act === 'open-product-modal') {
    const p = t.dataset.pid === 'new' ? null : state.products.find(x => x.product_id === t.dataset.pid);
    state.activeModal = { type: 'product', productObj: p };
    return render();
  }
  if (act === 'open-tier-modal') {
    const list = state.tiers[state.selectedProductId] || [];
    const tierObj = t.dataset.tier === 'new' ? null : list.find(x => x.tier === t.dataset.tier);
    state.activeModal = {
      type: 'tier',
      tierObj,
      modelVal: tierObj?.model || state.models[0].model_name,
      modelQuery: '',
      pickerOpen: false,
      isDefault: tierObj?.is_default ?? false,
      requiresPaid: tierObj?.requires_paid ?? false,
      enabled: tierObj ? tierObj.enabled : true,
      reasoningMode: tierObj?.reasoning_efforts == null ? 'auto' : tierObj.reasoning_efforts.length ? 'manual' : 'off',
      reasoningLevels: tierObj?.reasoning_efforts?.length ? [...tierObj.reasoning_efforts] : ['low', 'high', 'max'],
    };
    return render();
  }
  if (act === 'open-media-modal') {
    const labels = { speech: '语音合成', image: '图片生成', transcribe: '语音识别', realtime: '实时语音' };
    const defaultModel = { speech: 'tts-1-hd', image: 'gpt-image-2.6', transcribe: 'whisper-large-v3', realtime: 'gpt-realtime-2026' };
    const cap = t.dataset.cap;
    const setting = (state.media[state.selectedProductId] || {})[cap] || null;
    state.activeModal = {
      type: 'media', cap, capLabel: labels[cap], setting,
      modelVal: setting?.model || defaultModel[cap],
      modelQuery: '',
      pickerOpen: false,
      voices: setting?.voices?.length ? [...setting.voices] : ['nova', 'alloy'],
      sizes: setting?.sizes?.length ? [...setting.sizes] : ['1024x1024', 'auto'],
      minutes: Math.round((setting?.max_secs || 1800) / 60),
      requiresPaid: setting?.requires_paid ?? false,
      enabled: setting ? setting.enabled : true,
    };
    return render();
  }
  if (act === 'confirm-delete-tier') {
    const slug = t.dataset.tier;
    state.activeModal = {
      type: 'confirm', title: `删除档位「${slug}」？`, okText: '确认删除',
      desc: '删除后，客户端再次请求此档位会收到“未知的模型档位”错误。建议先停用观察后再删。',
      onConfirm: () => {
        state.tiers[state.selectedProductId] = (state.tiers[state.selectedProductId] || []).filter(x => x.tier !== slug);
        toast('档位已删除');
      },
    };
    return render();
  }
  if (act === 'confirm-delete-media') {
    const cap = t.dataset.cap;
    state.activeModal = {
      type: 'confirm', title: '关闭这项媒体能力？', okText: '确认关闭',
      desc: '关闭后，客户端将收到 503 暂未开放，语音朗读会自动降级回系统引擎。',
      onConfirm: () => { delete state.media[state.selectedProductId][cap]; toast('媒体能力已关闭'); },
    };
    return render();
  }
  if (act === 'confirm-void-batch') {
    const bid = Number(t.dataset.bid);
    const b = state.batches.find(x => x.id === bid);
    state.activeModal = {
      type: 'confirm', title: `作废批次 #${bid} 剩余的 ${b.unused} 个码？`, okText: '确认作废',
      desc: '已兑换的码和对应用户余额不受影响；未兑换的码作废后不可恢复。',
      onConfirm: () => { b.void += b.unused; const n = b.unused; b.unused = 0; toast(`已作废 ${n} 个未兑换码`); },
    };
    return render();
  }
  if (act === 'confirm-void-code') {
    state.activeModal = {
      type: 'confirm', title: '作废当前兑换码？', okText: '确认作废',
      desc: '作废后无人能再兑换该码，操作会记入审计日志。',
      onConfirm: () => { state.codeFound.status = 'void'; state.codeFound.voided_at = '刚刚'; toast('兑换码已作废'); },
    };
    return render();
  }
  if (act === 'confirm-clawback') {
    const hit = state.codeFound;
    state.activeModal = {
      type: 'confirm', title: '退款并扣回这份额度？', okText: '确认扣回', withNote: true,
      desc: `将扣回该码对应额度桶里剩余的 ${moneyPlain(hit.bucket_remaining)}（${fmtPoints(hit.bucket_remaining)}），已消耗部分不退回，此操作不可撤销。`,
      onConfirm: () => {
        const u = state.bindings.find(x => x.id === hit.binding_id);
        if (u) {
          const bk = u.buckets.find(x => x.id === hit.bucket_id);
          if (bk && !bk.closed_at) { u.balance -= bk.remaining; u.synced_quota -= bk.remaining; bk.remaining = 0; bk.closed_at = '刚刚'; bk.closed_reason = 'admin_void'; }
        }
        hit.bucket_closed_reason = 'admin_void';
        hit.bucket_remaining = 0;
        toast('额度已扣回并同步至网关');
      },
    };
    return render();
  }
  if (act === 'open-void-bucket') {
    const bkid = Number(t.dataset.bkid);
    const u = state.bindings.find(x => x.id === state.drawerBindingId);
    const bk = u?.buckets.find(x => x.id === bkid);
    if (!bk) return;
    state.activeModal = {
      type: 'confirm', title: '扣回这个额度桶？', okText: '确认扣回', withNote: true,
      desc: `将扣回剩余的 ${moneyPlain(bk.remaining)}（${fmtPoints(bk.remaining)}），用户将立即无法继续使用该桶额度。`,
      onConfirm: (note) => {
        const amt = bk.remaining;
        u.balance -= amt; u.synced_quota -= amt;
        bk.remaining = 0; bk.closed_at = '刚刚'; bk.closed_reason = 'admin_void';
        u.ledger.unshift({ id: Date.now(), kind: 'void', title: '管理员扣回', delta: -amt, balance_after: u.balance, time: '刚刚', day: '今天', note: note || '管理员扣回' });
        toast(`已扣回 ${moneyPlain(amt)}`);
      },
    };
    return render();
  }
  if (act === 'resolve-anomaly') {
    const a = state.anomalies.find(x => x.id === Number(t.dataset.aid));
    if (a) { a.resolved_at = '刚刚'; const u = state.bindings.find(x => x.id === a.binding_id); if (u) { u.has_anomaly = false; u.synced_quota = u.balance; } }
    toast('已标记为已处理');
    return render();
  }
  if (act === 'test-gateway') {
    state.gwTesting = true; render();
    setTimeout(() => {
      state.gwTesting = false;
      state.gwLatency = 19 + Math.floor(Math.random() * 22);
      toast(`New API 探测通过，响应耗时 ${state.gwLatency}ms`);
      render();
    }, 450);
    return;
  }
  if (act === 'copy-reveal' && state.activeModal?.codes) {
    copyText(state.activeModal.codes.join('\n'), `已复制 ${state.activeModal.codes.length} 个兑换码`);
    return;
  }
  if (act === 'download-reveal' && state.activeModal?.codes) {
    const blob = new Blob([state.activeModal.codes.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `兑换码-批次${state.activeModal.batch.id}.txt`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已下载 .txt 卡密文件');
    return;
  }
});

// Review bar extra bindings
document.getElementById('rbCmd').onclick = () => { state.cmdOpen = true; state.cmdQuery = ''; renderOverlays(); bindDynamicInputs(); };
document.getElementById('rbDrawer').onclick = () => { state.drawerBindingId = 1042; render(); };
document.getElementById('rbTierModal').onclick = () => {
  state.page = 'products';
  const tierObj = state.tiers.wallpaper[1];
  state.activeModal = {
    type: 'tier', tierObj, modelVal: tierObj.model, modelQuery: '', pickerOpen: false,
    isDefault: tierObj.is_default, requiresPaid: tierObj.requires_paid, enabled: tierObj.enabled,
    reasoningMode: 'manual', reasoningLevels: [...tierObj.reasoning_efforts],
  };
  render();
};
document.getElementById('rbHide').onclick = () => {
  document.getElementById('reviewBar').classList.add('collapsed');
  document.getElementById('stageWrap').classList.add('bar-hidden');
};
document.getElementById('reviewRestore').onclick = () => {
  document.getElementById('reviewBar').classList.remove('collapsed');
  document.getElementById('stageWrap').classList.remove('bar-hidden');
};

// Keyboard shortcuts: Cmd/Ctrl+K and ESC
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    state.cmdOpen = !state.cmdOpen;
    state.cmdQuery = '';
    renderOverlays();
    bindDynamicInputs();
  } else if (e.key === 'Escape') {
    if (state.cmdOpen) { state.cmdOpen = false; renderOverlays(); }
    else if (state.activeModal) { state.activeModal = null; renderOverlays(); }
    else if (state.drawerBindingId !== null) { state.drawerBindingId = null; renderOverlays(); }
  }
});

// Parse initial URL query params for design-preview presets
(function initFromQuery() {
  const sp = new URLSearchParams(location.search);
  const p = sp.get('page');
  if (p && ['overview','products','users','codes','issues','gateway','audit','login'].includes(p)) state.page = p;
  const th = sp.get('theme');
  if (th === 'dark' || th === 'light') state.theme = th;
  const dev = sp.get('device');
  if (['desktop','tablet','mobile'].includes(dev)) state.device = dev;
  const sc = sp.get('scene');
  if (['ops','onboarding','alert'].includes(sc)) state.scene = sc;
  if (sp.get('modal') === 'tier') {
    state.page = 'products';
    const tierObj = state.tiers.wallpaper[1];
    state.activeModal = {
      type: 'tier', tierObj, modelVal: tierObj.model, modelQuery: '', pickerOpen: false,
      isDefault: tierObj.is_default, requiresPaid: tierObj.requires_paid, enabled: tierObj.enabled,
      reasoningMode: 'manual', reasoningLevels: [...tierObj.reasoning_efforts],
    };
  }
  if (sp.get('drawer') === 'user') state.drawerBindingId = 1042;
  render();
})();
</script>
</body>
</html>
