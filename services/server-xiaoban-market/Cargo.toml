[package]
name = "server-xiaoban-market"
default-run = "server-xiaoban-market"
version = "0.1.0"
edition = "2021"
description = "小伴市场 (Xiaoban Market) - 专家、技能、连接器的自建目录服务：公开目录 API、下载安装与采集工作台，Rust Axum + PostgreSQL"
authors = ["bestyize"]
license = "MIT OR Apache-2.0"

[[bin]]
name = "import-marketplace"
path = "src/bin/import_marketplace.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-full"] }
tokio = { version = "1.40", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"

# 采集上游目录与安装包
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }

argon2 = "=0.6.0"
jsonwebtoken = "9.3"
sha2 = "0.10"

# 安装包校验与清单
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "=0.38.4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
ring = "0.17"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
