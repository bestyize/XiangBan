<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <script>
      (() => {
        let preference = 'system'
        try { preference = localStorage.getItem('forum-theme') || 'system' } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#111111' : '#f5f5f5')
      })()
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>超级小伴</title>
    <meta name="description" content="超级小伴：开发者和 AI 用户的社区。技术交流、资源分享、福利羊毛和随便唠唠。" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
