[package]
name = "server-forum"
version = "0.1.0"
edition = "2021"
description = "超级小伴论坛：AI 羊毛库与讨论区，Rust Axum + PostgreSQL，登录走相伴统一账号中心"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
tokio = { version = "1.40", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
dotenvy = "0.15"
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid"] }

argon2 = "=0.6.0"
jsonwebtoken = "9.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
ring = "0.17"
roxmltree = "0.21.2"

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
