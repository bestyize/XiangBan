# Include inside the chat.xiangban.xyz HTTPS server. Keep these files outside the forum web root.
location ^~ /idea-players/v1/oil-paint/ {
    alias /srv/xiangban-replica/apps/forum/idea-players-v1/oil-paint/;
    disable_symlinks on;
    limit_except GET { deny all; }
    # Modules and models are public. Only the Oil Paint directory can be loaded by this opaque frame.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock; frame-ancestors 'self'; default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://chat.xiangban.xyz/idea-players/v1/oil-paint/; style-src 'unsafe-inline' https://chat.xiangban.xyz/idea-players/v1/oil-paint/; img-src data: blob: https://chat.xiangban.xyz/idea-players/v1/oil-paint/; connect-src data: blob: https://chat.xiangban.xyz/idea-players/v1/oil-paint/; worker-src blob:; base-uri 'none'; form-action 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "public, max-age=3600";
}

