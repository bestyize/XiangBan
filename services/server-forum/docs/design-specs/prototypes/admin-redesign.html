<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="red">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>超级小伴社区 · 管理后台 UI 重设计稿</title>
<style>
/* ==========================================================================
   超级小伴社区管理后台 · 现代极简运营工作台设计令牌
   与小伴全端 6 套官方主题色 & 日夜间规范 1:1 对齐
   ========================================================================== */
:root {
  --bg-studio: #e9ebef;
  --bg-canvas: #f6f7f9;
  --bg-surface: #ffffff;
  --bg-subtle: #f2f3f6;
  --bg-hover: #eceef2;
  --bg-active: #ffffff;

  --ink-1: #14151a;
  --ink-2: #4e5361;
  --ink-3: #878c9a;
  --ink-4: #b2b7c4;

  --line: #e7e9ef;
  --line-strong: #d3d7e2;
  --line-subtle: #f0f1f5;

  /* 主题色（默认小伴红，由 JS 动态切换 6 套官方色板） */
  --brand: #E3203C;
  --brand-fill: #E3203C;
  --brand-hover: #F0506A;
  --brand-soft: #FFF1F3;
  --brand-ink: #ffffff;

  /* 固定语义色（不随主题色变化） */
  --ok: #1f9d63;
  --ok-soft: #eaf8f1;
  --warn: #c97a08;
  --warn-soft: #fef5e7;
  --danger: #dc2642;
  --danger-soft: #feecef;
  --info: #2563eb;
  --info-soft: #edf3ff;

  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-pill: 999px;

  --shadow-card: 0 1px 2px rgba(16, 18, 24, 0.04);
  --shadow-pop: 0 12px 32px rgba(16, 18, 24, 0.12), 0 2px 6px rgba(16, 18, 24, 0.05);
  --shadow-drawer: -12px 0 36px rgba(16, 18, 24, 0.10);
  --scrim: rgba(16, 18, 24, 0.36);

  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

:root[data-theme="dark"] {
  --bg-studio: #090a0d;
  --bg-canvas: #0f1014;
  --bg-surface: #17181e;
  --bg-subtle: #20222a;
  --bg-hover: #282b35;
  --bg-active: #252832;

  --ink-1: #f0f2f7;
  --ink-2: #a0a6b6;
  --ink-3: #6c7282;
  --ink-4: #4b505e;

  --line: #252832;
  --line-strong: #353947;
  --line-subtle: #1d1f27;

  --ok: #34c27c;
  --ok-soft: rgba(52, 194, 124, 0.14);
  --warn: #f5b638;
  --warn-soft: rgba(245, 182, 56, 0.14);
  --danger: #ff5c6c;
  --danger-soft: rgba(255, 92, 108, 0.15);
  --info: #6aa3ff;
  --info-soft: rgba(106, 163, 255, 0.15);

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-pop: 0 16px 40px rgba(0, 0, 0, 0.55);
  --shadow-drawer: -16px 0 42px rgba(0, 0, 0, 0.5);
  --scrim: rgba(0, 0, 0, 0.62);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-1);
  background: var(--bg-studio);
  transition: background .2s ease, color .2s ease;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 12px; }

/* ==========================================================================
   顶部设计稿展示控制栏（Studio Bar，不属于后台本身）
   ========================================================================== */
.studio-bar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: color-mix(in srgb, var(--bg-surface) 90%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: 8px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  flex-wrap: wrap;
}
.sb-left, .sb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sb-title { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; letter-spacing: -.01em; }
.sb-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-pill); background: var(--brand-soft); color: var(--brand); }
.sb-seg {
  display: inline-flex; align-items: center; padding: 3px; border-radius: 9px;
  background: var(--bg-subtle); border: 1px solid var(--line); gap: 2px;
}
.sb-seg button {
  height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--ink-2);
  transition: background .15s, color .15s; white-space: nowrap;
}
.sb-seg button.active {
  background: var(--bg-surface); color: var(--ink-1); font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.swatches {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px;
  border-radius: 9px; background: var(--bg-subtle); border: 1px solid var(--line);
}
.swatch {
  width: 14px; height: 14px; border-radius: 50%; position: relative;
  transition: transform .15s var(--ease);
}
.swatch:hover { transform: scale(1.16); }
.swatch.active::after {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  border: 2px solid var(--ink-1);
}
.sb-btn {
  height: 30px; padding: 0 11px; border-radius: 8px; font-size: 12px; font-weight: 500;
  background: var(--bg-surface); border: 1px solid var(--line-strong); color: var(--ink-1);
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s;
}
.sb-btn:hover { background: var(--bg-hover); }
.sb-btn.accent { background: var(--brand-soft); border-color: transparent; color: var(--brand); font-weight: 600; }

/* 视口画布容器（支持 PC 满宽 / 平板 960px / 移动 390px 预览） */
.stage {
  padding: 14px 16px 28px;
  display: flex;
  justify-content: center;
  min-height: calc(100vh - 49px);
}
.stage.vp-desktop { padding: 0; }
.viewport-frame {
  width: 100%;
  min-height: calc(100vh - 49px);
  background: var(--bg-canvas);
  position: relative;
  overflow-x: clip;
  transition: width .25s var(--ease), border-radius .25s var(--ease);
}
.stage.vp-tablet .viewport-frame {
  width: 960px; max-width: 100%;
  border-radius: 16px; border: 1px solid var(--line-strong);
  box-shadow: var(--shadow-pop); overflow: hidden;
  min-height: 760px;
}
.stage.vp-mobile .viewport-frame {
  width: 390px; max-width: 100%;
  border-radius: 26px; border: 6px solid var(--ink-1);
  box-shadow: var(--shadow-pop); overflow: hidden;
  height: 820px; min-height: 820px; display: flex; flex-direction: column;
}

/* ==========================================================================
   管理后台主壳层：左导轨 + 顶栏 + 主画布
   ========================================================================== */
.app-shell {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: calc(100vh - 49px);
}
.stage.vp-tablet .app-shell,
.stage.vp-mobile .app-shell {
  grid-template-columns: minmax(0, 1fr);
  min-height: 100%;
  height: 100%;
}

/* 左侧边栏 */
.sidebar {
  position: sticky;
  top: var(--studio-h, 49px);
  height: calc(100vh - var(--studio-h, 49px));
  background: var(--bg-surface);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 14px 12px 12px;
  z-index: 40;
}
.stage.vp-tablet .sidebar,
.stage.vp-mobile .sidebar {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  height: 100%;
  width: 264px;
  transform: translateX(-104%);
  transition: transform .22s var(--ease);
  box-shadow: var(--shadow-pop);
}
.stage.vp-tablet .sidebar.open,
.stage.vp-mobile .sidebar.open { transform: translateX(0); }

.side-scrim {
  display: none;
  position: absolute; inset: 0; background: var(--scrim); z-index: 35;
}
.side-scrim.open { display: block; }

.brand-box {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 8px 14px;
}
.brand-logo { width: 30px; height: 30px; border-radius: 9px; flex: none; overflow: hidden; box-shadow: 0 2px 8px rgba(227,32,60,.22); }
.brand-text { min-width: 0; }
.brand-text strong { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; }
.brand-text span { display: block; font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.cmd-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  height: 34px; padding: 0 10px; margin: 0 2px 12px;
  border-radius: var(--r-sm); background: var(--bg-subtle); border: 1px solid var(--line);
  color: var(--ink-3); font-size: 12.5px;
  transition: border-color .15s, background .15s, color .15s;
}
.cmd-trigger:hover { border-color: var(--line-strong); color: var(--ink-2); }
.cmd-trigger .left { display: inline-flex; align-items: center; gap: 7px; }
.kbd {
  font-family: var(--font-mono); font-size: 10.5px; padding: 1px 5px;
  border-radius: 5px; background: var(--bg-surface); border: 1px solid var(--line-strong);
  color: var(--ink-3); line-height: 1.3;
}

.nav-scroll { flex: 1; overflow-y: auto; padding-right: 2px; scrollbar-width: thin; }
.nav-group { margin-bottom: 14px; }
.nav-group-label {
  padding: 0 10px 6px; font-size: 11px; font-weight: 600;
  color: var(--ink-3); letter-spacing: .04em;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 9px;
  height: 34px; padding: 0 10px; border-radius: var(--r-sm);
  color: var(--ink-2); font-size: 13px; font-weight: 500;
  transition: background .14s, color .14s;
  position: relative; margin-bottom: 1px; text-align: left;
}
.nav-item:hover { background: var(--bg-subtle); color: var(--ink-1); }
.nav-item.active {
  background: var(--brand-soft); color: var(--brand); font-weight: 600;
}
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-fill);
}
.nav-item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill);
  font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;
  background: var(--danger); color: #fff; font-variant-numeric: tabular-nums;
}
.nav-badge.soft { background: var(--bg-hover); color: var(--ink-2); }
.nav-item.active .nav-badge.soft { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); }

.side-footer {
  margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.admin-card-mini {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: var(--r-sm);
}
.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
  background: var(--brand-soft); color: var(--brand);
}
.avatar.sm { width: 26px; height: 26px; font-size: 11px; }
.admin-card-mini .meta { min-width: 0; flex: 1; }
.admin-card-mini strong { display: block; font-size: 12.5px; line-height: 1.25; }
.admin-card-mini span { display: block; font-size: 11px; color: var(--ink-3); }
.side-foot-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.side-foot-btn {
  height: 30px; border-radius: var(--r-xs); background: var(--bg-subtle);
  color: var(--ink-2); font-size: 12px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .14s, color .14s;
}
.side-foot-btn:hover { background: var(--bg-hover); color: var(--ink-1); }

/* 右侧主区 */
.main-col { min-width: 0; display: flex; flex-direction: column; }
.stage.vp-mobile .main-col { overflow-y: auto; height: 100%; }
.topbar {
  position: sticky; top: var(--studio-h, 49px); z-index: 30;
  height: 52px; padding: 0 28px;
  background: color-mix(in srgb, var(--bg-canvas) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.stage.vp-tablet .topbar,
.stage.vp-mobile .topbar { top: 0; padding: 0 14px; }

.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.menu-btn {
  display: none; width: 34px; height: 34px; border-radius: var(--r-sm);
  align-items: center; justify-content: center; color: var(--ink-1);
}
.menu-btn:hover { background: var(--bg-hover); }
.stage.vp-tablet .menu-btn,
.stage.vp-mobile .menu-btn { display: inline-flex; }

.breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.breadcrumb strong { color: var(--ink-1); font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex: none; }
.status-chip {
  height: 28px; padding: 0 10px; border-radius: var(--r-pill);
  background: var(--bg-surface); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
}
.stage.vp-mobile .status-chip { display: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); }
.dot.info { background: var(--info); }
.dot.muted { background: var(--ink-4); }

.content-wrap {
  width: 100%; max-width: 1360px; margin: 0 auto;
  padding: 22px 28px 56px;
}
.stage.vp-mobile .content-wrap { padding: 14px 14px 36px; }

.page-header {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
}
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.page-header p { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.page-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ==========================================================================
   基础控件与卡片规范（统一全后台 30 个面板的原子语言）
   ========================================================================== */
.btn {
  height: 34px; padding: 0 13px; border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--bg-surface); color: var(--ink-1);
  font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap; transition: background .14s, border-color .14s, color .14s, opacity .14s;
}
.btn:hover { background: var(--bg-subtle); border-color: var(--ink-4); }
.btn:disabled { opacity: .48; cursor: not-allowed; }
.btn-primary { background: var(--brand-fill); border-color: var(--brand-fill); color: var(--brand-ink); font-weight: 600; }
.btn-primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn-soft { background: var(--brand-soft); border-color: transparent; color: var(--brand); font-weight: 600; }
.btn-soft:hover { background: color-mix(in srgb, var(--brand) 16%, transparent); }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn-danger-fill { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--bg-subtle); color: var(--ink-1); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
.btn-icon { width: 30px; height: 30px; padding: 0; border-radius: 7px; }

.input, .select, .textarea {
  height: 34px; padding: 0 11px; border-radius: var(--r-sm);
  border: 1px solid var(--line-strong); background: var(--bg-surface); color: var(--ink-1);
  font-size: 13px; transition: border-color .14s, box-shadow .14s;
}
.textarea { height: auto; padding: 9px 11px; min-height: 86px; resize: vertical; line-height: 1.6; }
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent);
}
.search-box { position: relative; display: inline-flex; align-items: center; }
.search-box svg { position: absolute; left: 10px; color: var(--ink-3); pointer-events: none; }
.search-box .input { padding-left: 32px; width: 240px; }
.stage.vp-mobile .search-box, .stage.vp-mobile .search-box .input { width: 100%; }

.card {
  background: var(--bg-surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-card);
}
.card-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-subtle);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.card-head h2, .card-head h3 { font-size: 14.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.card-body { padding: 16px 18px; }

/* 子导航 Tab 条 */
.subtabs {
  display: flex; align-items: center; gap: 4px;
  border-bottom: 1px solid var(--line); margin-bottom: 16px;
  overflow-x: auto; scrollbar-width: none;
}
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  height: 38px; padding: 0 14px; font-size: 13px; font-weight: 500;
  color: var(--ink-2); border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: color .14s, border-color .14s; margin-bottom: -1px;
}
.subtab:hover { color: var(--ink-1); }
.subtab.active { color: var(--brand); border-bottom-color: var(--brand-fill); font-weight: 600; }
.subtab .cnt {
  font-size: 11px; padding: 1px 6px; border-radius: var(--r-pill);
  background: var(--bg-subtle); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.subtab.active .cnt { background: var(--brand-soft); color: var(--brand); }
.subtab .cnt.danger { background: var(--danger-soft); color: var(--danger); }

/* 筛选条与胶囊组 */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pills { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 9px; background: var(--bg-subtle); border: 1px solid var(--line); }
.pill-btn {
  height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 5px;
}
.pill-btn.active { background: var(--bg-surface); color: var(--ink-1); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.07); }

/* 状态标签 */
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: var(--r-pill);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
  background: var(--bg-subtle); color: var(--ink-2);
}
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.brand { background: var(--brand-soft); color: var(--brand); }
.tag.outline { background: transparent; border: 1px solid var(--line-strong); color: var(--ink-2); }

/* 表格 */
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  padding: 10px 16px; text-align: left; font-size: 11.5px; font-weight: 600;
  color: var(--ink-3); background: var(--bg-subtle);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.tbl td {
  padding: 12px 16px; border-bottom: 1px solid var(--line-subtle);
  vertical-align: middle; font-size: 13px;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .12s; }
.tbl tbody tr:hover { background: color-mix(in srgb, var(--bg-subtle) 65%, transparent); }
.tbl .cell-title { font-weight: 600; color: var(--ink-1); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tbl .cell-sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tbl .right { text-align: right; }

/* 表单字段 */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field small { font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .wide { grid-column: 1 / -1; }
.stage.vp-mobile .form-grid { grid-template-columns: 1fr; }

/* ==========================================================================
   特定页面布局
   ========================================================================== */
/* 1. 概览与待办 */
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.stage.vp-tablet .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage.vp-mobile .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi-card {
  padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
  cursor: pointer; transition: border-color .15s, transform .15s;
}
.kpi-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.kpi-mid { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.kpi-val { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi-val.danger { color: var(--danger); }
.kpi-delta { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: var(--r-pill); }
.kpi-delta.up { background: var(--ok-soft); color: var(--ok); }
.kpi-delta.alert { background: var(--danger-soft); color: var(--danger); }
.kpi-delta.neutral { background: var(--bg-subtle); color: var(--ink-2); }
.spark { width: 76px; height: 26px; flex: none; }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.stage.vp-tablet .dash-grid, .stage.vp-mobile .dash-grid { grid-template-columns: 1fr; }

.todo-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 18px; border-bottom: 1px solid var(--line-subtle);
  transition: background .12s; cursor: pointer;
}
.todo-item:last-child { border-bottom: 0; }
.todo-item:hover { background: var(--bg-subtle); }
.todo-left { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
.todo-icon {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
}
.todo-icon.danger { background: var(--danger-soft); color: var(--danger); }
.todo-icon.warn { background: var(--warn-soft); color: var(--warn); }
.todo-icon.info { background: var(--info-soft); color: var(--info); }
.todo-title { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.todo-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.health-list { display: flex; flex-direction: column; }
.health-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 18px; border-bottom: 1px solid var(--line-subtle);
}
.health-row:last-child { border-bottom: 0; }
.health-name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.health-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* 2. 审核中心：主从分栏 */
.split-view {
  display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start;
}
.stage.vp-tablet .split-view, .stage.vp-mobile .split-view { grid-template-columns: 1fr; }
.queue-item {
  padding: 13px 16px; border-bottom: 1px solid var(--line-subtle); cursor: pointer;
  transition: background .12s; position: relative;
}
.queue-item:last-child { border-bottom: 0; }
.queue-item:hover { background: var(--bg-subtle); }
.queue-item.active { background: var(--brand-soft); }
.queue-item.active::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand-fill);
}
.quote-box {
  padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg-subtle);
  border-left: 3px solid var(--line-strong); font-size: 13px; color: var(--ink-2);
  margin: 12px 0; line-height: 1.65;
}
.quick-reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip-btn {
  height: 26px; padding: 0 10px; border-radius: var(--r-pill); font-size: 12px;
  background: var(--bg-subtle); border: 1px solid var(--line); color: var(--ink-2);
  transition: all .14s;
}
.chip-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }

/* 3. 发现页编排：左侧频道 + 右侧表格 */
.discover-grid { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; align-items: start; }
.stage.vp-tablet .discover-grid, .stage.vp-mobile .discover-grid { grid-template-columns: 1fr; }
.channel-list { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.stage.vp-tablet .channel-list, .stage.vp-mobile .channel-list { flex-direction: row; overflow-x: auto; }
.channel-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--ink-2);
  white-space: nowrap; transition: background .12s, color .12s;
}
.channel-btn:hover { background: var(--bg-subtle); color: var(--ink-1); }
.channel-btn.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }

/* 4. 精选项目工作台：四步进度条 + 三栏 */
.stepper {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 18px; margin-bottom: 14px;
}
.step-node { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.step-node .num-dot {
  width: 22px; height: 22px; border-radius: 50%; font-size: 11.5px; font-weight: 700;
  display: grid; place-items: center; background: var(--bg-subtle); color: var(--ink-3);
  border: 1px solid var(--line-strong);
}
.step-node.done { color: var(--ok); }
.step-node.done .num-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.step-node.current { color: var(--ink-1); font-weight: 600; }
.step-node.current .num-dot { background: var(--brand-fill); border-color: var(--brand-fill); color: #fff; }
.step-sep { flex: 1; min-width: 18px; height: 1px; background: var(--line-strong); }

.os-workbench { display: grid; grid-template-columns: 236px minmax(0, 1fr) 316px; gap: 16px; align-items: start; }
.stage.vp-tablet .os-workbench { grid-template-columns: 210px minmax(0, 1fr); }
.stage.vp-mobile .os-workbench { grid-template-columns: 1fr; }
.os-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--r-sm); text-align: left;
  transition: background .12s; margin-bottom: 2px;
}
.os-item:hover { background: var(--bg-subtle); }
.os-item.active { background: var(--brand-soft); }
.os-icon-box {
  width: 34px; height: 34px; border-radius: 9px; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff;
}
.os-preview-cover {
  aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
  padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
  position: relative; border: 1px solid var(--line);
}
.os-preview-code {
  font-family: var(--font-mono); font-size: 11px; line-height: 1.55;
  padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,.22); color: #f6f8fa;
  backdrop-filter: blur(6px);
}

/* 5. 采编与健康 */
.source-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stage.vp-tablet .source-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stage.vp-mobile .source-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.source-card {
  padding: 13px 14px; border-radius: var(--r-md); background: var(--bg-surface);
  border: 1px solid var(--line); text-align: left; cursor: pointer;
  transition: border-color .14s, background .14s;
}
.source-card:hover { border-color: var(--line-strong); }
.source-card.active { border-color: var(--brand); background: var(--brand-soft); }
.source-card strong { display: block; font-size: 13px; margin-bottom: 6px; }
.source-card span { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }

/* 6. 树形分类 & 联系方式 */
.tree-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 18px; border-bottom: 1px solid var(--line-subtle);
}
.tree-row:last-child { border-bottom: 0; }
.tree-row.parent { background: color-mix(in srgb, var(--bg-subtle) 55%, transparent); }
.tree-row.child { padding-left: 44px; position: relative; }
.tree-row.child::before {
  content: ""; position: absolute; left: 26px; top: 0; bottom: 50%; width: 10px;
  border-left: 1.5px solid var(--line-strong); border-bottom: 1.5px solid var(--line-strong);
  border-bottom-left-radius: 4px;
}

.contact-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stage.vp-tablet .contact-grid, .stage.vp-mobile .contact-grid { grid-template-columns: 1fr; }
.qr-box {
  width: 96px; height: 96px; border-radius: 10px; background: #fff;
  border: 1px solid var(--line); display: grid; place-items: center; padding: 8px;
}

/* 批量操作悬浮条 */
.batch-bar {
  position: sticky; bottom: 18px; z-index: 35;
  margin-top: 14px; padding: 10px 16px; border-radius: 12px;
  background: var(--ink-1); color: var(--bg-surface);
  box-shadow: var(--shadow-pop);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.batch-bar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.18); color: #fff; }
.batch-bar .btn:hover { background: rgba(255,255,255,.22); }
:root[data-theme="dark"] .batch-bar { background: #262936; color: #f4f6fb; border: 1px solid var(--line-strong); }

/* ==========================================================================
   右侧抽屉 Drawer / 居中弹窗 Modal / ⌘K 命令面板 / Toast
   ========================================================================== */
.overlay {
  position: fixed; inset: 0; z-index: 300;
  background: var(--scrim); display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(3px);
}
.overlay.open { display: flex; }
.overlay.drawer-mode { justify-content: flex-end; padding: 0; align-items: stretch; }

.drawer {
  width: 580px; max-width: 100vw; background: var(--bg-surface);
  border-left: 1px solid var(--line); box-shadow: var(--shadow-drawer);
  display: flex; flex-direction: column; max-height: 100vh;
  animation: slideIn .2s var(--ease);
}
.drawer.wide { width: 680px; }
@keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
.drawer-head {
  padding: 16px 22px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.drawer-head h3 { font-size: 16px; font-weight: 700; }
.drawer-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
.drawer-foot {
  padding: 14px 22px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg-surface);
}

.modal {
  width: 460px; max-width: 100%; background: var(--bg-surface);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-pop); overflow: hidden;
  animation: popIn .18s var(--ease);
}
.modal.wide { width: 760px; max-height: 86vh; display: flex; flex-direction: column; }
@keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-head { padding: 18px 22px 12px; display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { font-size: 16px; font-weight: 700; }
.modal-body { padding: 4px 22px 20px; overflow-y: auto; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }

/* ⌘K 命令面板 */
.cmd-box {
  width: 560px; max-width: 100%; background: var(--bg-surface);
  border: 1px solid var(--line-strong); border-radius: 14px;
  box-shadow: var(--shadow-pop); overflow: hidden; align-self: flex-start; margin-top: 9vh;
}
.cmd-input-row {
  display: flex; align-items: center; gap: 10px; padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.cmd-input-row input { flex: 1; border: 0; outline: 0; background: none; font-size: 14.5px; }
.cmd-results { max-height: 360px; overflow-y: auto; padding: 8px; }
.cmd-row {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; border-radius: 8px; text-align: left; font-size: 13px;
}
.cmd-row:hover { background: var(--bg-subtle); }
.cmd-row .left { display: flex; align-items: center; gap: 10px; }
.cmd-row small { color: var(--ink-3); font-size: 11.5px; }

/* 独立登录页 */
.login-stage {
  min-height: calc(100vh - 49px); display: grid; place-items: center; padding: 32px 16px;
  background: radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--brand) 8%, transparent), transparent 46%),
              radial-gradient(circle at 82% 85%, color-mix(in srgb, var(--info) 6%, transparent), transparent 48%),
              var(--bg-canvas);
}
.login-card {
  width: 400px; max-width: 100%; padding: 34px 32px 28px;
  background: var(--bg-surface); border: 1px solid var(--line);
  border-radius: 20px; box-shadow: var(--shadow-pop);
}

/* Diff 双栏代码 */
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stage.vp-mobile .diff-grid { grid-template-columns: 1fr; }
.code-block {
  margin: 0; padding: 12px; border-radius: 8px; background: var(--bg-subtle);
  border: 1px solid var(--line); font-family: var(--font-mono); font-size: 11.5px;
  line-height: 1.6; overflow: auto; max-height: 300px; white-space: pre-wrap;
}

/* Toast */
.toast-host {
  position: fixed; right: 20px; bottom: 20px; z-index: 400;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 10px 15px; border-radius: 10px; font-size: 13px; font-weight: 500;
  background: var(--ink-1); color: var(--bg-surface); box-shadow: var(--shadow-pop);
  display: inline-flex; align-items: center; gap: 8px;
  animation: popIn .18s var(--ease);
}
.toast.ok .t-dot { background: var(--ok); }
.toast.danger { background: var(--danger); color: #fff; }
.t-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--brand-fill); }

/* 进度条 / 数据条 */
.bar-track { height: 8px; border-radius: 99px; background: var(--bg-subtle); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--brand-fill); }

/* 图表提示 */
.chart-legend { display: flex; align-items: center; gap: 16px; font-size: 12px; color: var(--ink-2); }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend-box { width: 10px; height: 10px; border-radius: 3px; }
</style>

              <defs><linearGradient id="brG" x1="12%" y1="6%" x2="88%" y2="96%"><stop offset="0%" stop-color="#FF6584"/><stop offset="100%" stop-color="#F9744B"/></linearGradient></defs>

              <path d="M53 29 C56 47 63 54 81 57 C63 60 56 67 53 85 C50 67 43 60 25 57 C43 54 50 47 53 29Z" fill="#fff"/>

/* ==========================================================================
   主题、色板、视口控制
   ========================================================================== */
function applyPalette(accentId, theme) {
  const opt = ACCENTS.find(a => a.id === accentId) || ACCENTS[0];
  const p = theme === 'dark' ? opt.dark : opt.light;
  const r = document.documentElement;
  r.dataset.theme = theme;
  r.dataset.accent = opt.id;
  r.style.setProperty('--brand', p.brand);
  r.style.setProperty('--brand-fill', p.fill);
  r.style.setProperty('--brand-hover', p.hover);
  r.style.setProperty('--brand-soft', p.soft);
  r.style.setProperty('--brand-ink', p.ink);
}

function initStudioControls() {
  const bar = document.getElementById('swatchBar');
  bar.innerHTML = ACCENTS.map(a =>
    `<button class="swatch ${a.id === 'red' ? 'active' : ''}" data-accent="${a.id}" title="${a.name}" style="background:${a.light.fill}"></button>`
  ).join('');
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.swatch');
    if (!btn) return;
    bar.querySelectorAll('.swatch').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyPalette(btn.dataset.accent, document.documentElement.dataset.theme);
  });

  document.getElementById('themeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#themeSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyPalette(document.documentElement.dataset.accent, btn.dataset.theme);
  });

  document.getElementById('vpSeg').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    document.querySelectorAll('#vpSeg button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const st = document.getElementById('stage');
    st.className = 'stage vp-' + btn.dataset.vp;
    closeMobileSide();
  });

  document.getElementById('btnCompare').addEventListener('click', openCompareModal);
  document.getElementById('btnLoginToggle').addEventListener('click', () => {
    const visible = document.getElementById('loginView').style.display !== 'none';
    toggleLogin(!visible);
  });

  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sideScrim').classList.add('open');
  });
  document.getElementById('sideScrim').addEventListener('click', closeMobileSide);
  document.getElementById('cmdBtn').addEventListener('click', openCommandPalette);
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCommandPalette();
    } else if (e.key === 'Escape') {
      closeDrawer();
      closeModal();
    }
  });
}

function closeMobileSide() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sideScrim').classList.remove('open');
}

function toggleLogin(show) {
  document.getElementById('loginView').style.display = show ? 'grid' : 'none';
  document.getElementById('appShell').style.display = show ? 'none' : 'grid';
  document.getElementById('btnLoginToggle').textContent = show ? '返回后台界面' : '预览登录页';
}

/* ==========================================================================
   导航与统计渲染
   ========================================================================== */
function pendingReviewTotal() {
  const r = DATA.reviews.reports.filter(x => x.status === 'open').length;
  const c = DATA.reviews.contentReports.filter(x => x.status === 'open').length;
  const m = DATA.reviews.moderation.filter(x => x.status === 'open').length;
  return r + c + m;
}

function renderSidebar() {
  const totalReview = pendingReviewTotal();
  document.getElementById('topTodoCount').textContent = totalReview;
  document.getElementById('sideNav').innerHTML = NAV_GROUPS.map(g => `
    <div class="nav-group">
      <div class="nav-group-label">${g.label}</div>
      ${g.items.map(item => {
        const badge = item.key === 'review' ? totalReview : (item.badge || 0);
        return `
          <button class="nav-item ${state.page === item.key ? 'active' : ''}" onclick="navigate('${item.key}')">
            ${ic(item.icon, 16)}
            <span class="label">${item.label}</span>
            ${badge > 0 ? `<span class="nav-badge ${item.badgeType === 'soft' ? 'soft' : ''}">${badge}</span>` : ''}
          </button>`;
      }).join('')}
    </div>
  `).join('');
}

function findNavMeta(key) {
  for (const g of NAV_GROUPS) {
    const it = g.items.find(x => x.key === key);
    if (it) return { group: g.label, item: it };
  }
  return { group: '工作台', item: NAV_GROUPS[0].items[0] };
}

function navigate(key, sub) {
  state.page = key;
  if (sub) state.subtab[key] = sub;
  closeMobileSide();
  toggleLogin(false);
  renderSidebar();
  const meta = findNavMeta(key);
  document.getElementById('breadcrumb').innerHTML = `<span>超级小伴</span><span>/</span><span>${meta.group}</span><span>/</span><strong>${meta.item.label}</strong>`;
  renderPage();
  const mainCol = document.querySelector('.main-col');
  if (mainCol) mainCol.scrollTop = 0;
}

/* ==========================================================================
   各页面渲染函数
   ========================================================================== */
function renderPage() {
  const el = document.getElementById('pageContent');
  const map = {
    overview: renderOverview,
    metrics: renderMetrics,
    review: renderReview,
    topics: renderTopics,
    users: renderUsers,
    taxonomy: renderTaxonomy,
    discover: renderDiscover,
    'open-source': renderOpenSource,
    collection: renderCollection,
    works: renderWorks,
    'ops-sys': renderOpsSys,
    account: renderAccount,
  };
  el.innerHTML = (map[state.page] || renderOverview)();
}

/* ---------- 2. 审核中心（聚合 举报 + 作品举报 + 待审队列） ---------- */
function renderReview() {
  const tab = state.subtab.review || 'reports';
  const rows = DATA.reviews[tab] || [];
  const openR = DATA.reviews.reports.filter(x => x.status === 'open').length;
  const openC = DATA.reviews.contentReports.filter(x => x.status === 'open').length;
  const openM = DATA.reviews.moderation.filter(x => x.status === 'open').length;

  let activeItem = rows.find(x => x.id === state.reviewSelected) || rows[0];
  if (activeItem) state.reviewSelected = activeItem.id;

  return `
    <div class="page-header">
      <div>
        <h1>审核中心</h1>
        <p>统一收口「帖子与回复举报」「作品与方案举报」与「待审内容队列」，左侧选单、右侧一站式核对处置。</p>
      </div>
      <div class="page-actions">
        <button class="btn" onclick="showToast('队列已刷新')">${ic('refresh', 14)} 刷新队列</button>
      </div>
    </div>

    <div class="subtabs">
      <button class="subtab ${tab === 'reports' ? 'active' : ''}" onclick="setSubtab('review','reports')">帖子与回复举报 <span class="cnt ${openR?'danger':''}">${openR}</span></button>
      <button class="subtab ${tab === 'contentReports' ? 'active' : ''}" onclick="setSubtab('review','contentReports')">作品与方案举报 <span class="cnt ${openC?'danger':''}">${openC}</span></button>
      <button class="subtab ${tab === 'moderation' ? 'active' : ''}" onclick="setSubtab('review','moderation')">待审内容队列 <span class="cnt ${openM?'danger':''}">${openM}</span></button>
    </div>

    <div class="split-view">
      <!-- 左侧待办队列 -->
      <section class="card" style="overflow:hidden">
        <div class="card-head" style="padding:11px 14px">
          <span style="font-size:12.5px;font-weight:600;color:var(--ink-2)">待处理队列（${rows.filter(x=>x.status==='open').length} / ${rows.length}）</span>
          <span class="tag outline">按提交时间</span>
        </div>
        ${rows.length ? rows.map(r => `
          <div class="queue-item ${activeItem && activeItem.id === r.id ? 'active' : ''}" onclick="state.reviewSelected=${r.id};renderPage()">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span class="tag ${r.status !== 'open' ? 'ok' : tab === 'moderation' ? 'warn' : 'danger'}">${r.status !== 'open' ? '已处置' : r.reason}</span>
                ${r.count > 1 ? `<span class="tag outline">${r.count} 次举报</span>` : ''}
              </div>
              <span style="font-size:11.5px;color:var(--ink-3)">${r.time}</span>
            </div>
            <div style="font-weight:600;font-size:13px;line-height:1.45;margin-bottom:4px">${r.title}</div>
            <div style="font-size:12px;color:var(--ink-3)">作者：${r.author} · 来源：${r.reporter}</div>
          </div>
        `).join('') : '<div style="padding:36px;text-align:center;color:var(--ink-3)">当前队列已清空</div>'}
      </section>

      <!-- 右侧沉浸检视与处置面板 -->
      <section class="card">
        ${activeItem ? `
          <div class="card-head">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              <span class="tag ${activeItem.status !== 'open' ? 'ok' : tab === 'moderation' ? 'warn' : 'danger'}">${activeItem.status !== 'open' ? '已处理' : activeItem.reason}</span>
              <span class="mono" style="color:var(--ink-3)">#${activeItem.targetId} · ${activeItem.targetType}</span>
            </div>
            <button class="btn btn-sm" onclick="showToast('已在新窗口打开前台页面')">${ic('external', 13)} 查看前台原页</button>
          </div>
          <div class="card-body">
            <h2 style="font-size:17px;font-weight:700;margin-bottom:8px">${activeItem.title}</h2>
            <div style="display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:14px">
              <span>被检作者：<strong>${activeItem.author}</strong></span>
              <span>提交方：<strong>${activeItem.reporter}</strong></span>
              <span>提交时间：${activeItem.time}</span>
            </div>

            <div style="font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:4px">目标内容摘录</div>
            <div class="quote-box">${activeItem.excerpt}</div>

            <div style="font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:4px">${tab === 'moderation' ? '系统入队说明' : '举报人补充说明'}</div>
            <p style="font-size:13px;color:var(--ink-1);margin-bottom:18px;padding:10px 12px;background:var(--bg-subtle);border-radius:8px">${activeItem.detail}</p>

            ${activeItem.status === 'open' ? `
              <div style="border-top:1px solid var(--line);padding-top:16px">
                <div style="font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:8px">快捷处理说明（点击填入，替代原生 window.prompt）</div>
                <div class="quick-reasons">
                  ${(tab === 'moderation'
                    ? ['清单与运行安全校验通过，准予上架', '内容正常，命中复核词为误报，放行', '缺少必要权限说明或存在版权风险，拒绝']
                    : ['确认违反社区规范，已隐藏内容', '确认侵权属实，已下架作品并处理关联举报', '核实内容未违规，驳回本次举报']
                  ).map(txt => `<button class="chip-btn" type="button" onclick="document.getElementById('reviewNote').value='${txt}'">${txt}</button>`).join('')}
                </div>
                <div class="field" style="margin-bottom:14px">
                  <label>处理说明（写入操作审计日志${tab === 'contentReports' ? '，作品举报必填，不向作者公开' : '，选填'}）</label>
                  <textarea id="reviewNote" class="textarea" rows="2" placeholder="输入处理结论或内部审核备注…"></textarea>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  ${tab === 'moderation' ? `
                    <button class="btn btn-primary" onclick="handleReviewItem('${tab}', ${activeItem.id}, '通过审核')">${ic('check', 14)} 通过审核</button>
                    <button class="btn btn-danger" onclick="handleReviewItem('${tab}', ${activeItem.id}, '拒绝并记录原因')">拒绝</button>
                  ` : tab === 'contentReports' ? `
                    <button class="btn btn-danger-fill" onclick="handleReviewItem('${tab}', ${activeItem.id}, '下架并处理全部举报')">下架并处理全部举报</button>
                    <button class="btn" onclick="handleReviewItem('${tab}', ${activeItem.id}, '驳回举报')">驳回此条举报</button>
                  ` : `
                    <button class="btn btn-primary" onclick="handleReviewItem('${tab}', ${activeItem.id}, '已处理并隐藏内容')">处理并隐藏内容</button>
                    <button class="btn" onclick="handleReviewItem('${tab}', ${activeItem.id}, '仅标记已处理')">处理不隐藏</button>
                    <button class="btn btn-ghost" onclick="handleReviewItem('${tab}', ${activeItem.id}, '已驳回举报')">驳回举报</button>
                  `}
                </div>
              </div>
            ` : `
              <div style="padding:12px 14px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:500">
                ✓ 该条目已由 admin 处置完成并写入审计日志。
              </div>
            `}
          </div>
        ` : '<div class="card-body" style="color:var(--ink-3);text-align:center;padding:48px">请从左侧选择一条待审核项</div>'}
      </section>
    </div>
  `;
}

function handleReviewItem(tab, id, label) {
  const row = DATA.reviews[tab].find(x => x.id === id);
  if (row) row.status = 'resolved';
  showToast(label, 'ok');
  renderSidebar();
  renderPage();
}

/* ---------- 3. 帖子管理（清爽表格 + 侧滑治理抽屉 + 批量悬浮条） ---------- */
function renderTopics() {
  const f = state.topicFilter;
  const list = DATA.topics.filter(t =>
    (f.status === 'all' || t.status === f.status) &&
    (!f.q || t.title.includes(f.q) || String(t.id).includes(f.q))
  );
  const pinMap = { none: '', site: '全站置顶', parent: '一级置顶', category: '板块置顶' };
  const statusMap = { normal: ['ok', '正常'], hidden: ['warn', '已隐藏'], deleted: ['danger', '已删除'] };

  return `
    <div class="page-header">
      <div>
        <h1>帖子管理</h1>
        <p>将原本塞爆行尾的 6 个按钮与下拉框收口为「侧滑治理抽屉 + 批量悬浮操作条」，表格信息一目了然。</p>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <svg class="ic" style="width:14px;height:14px" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" value="${f.q}" placeholder="搜索标题或帖子 #ID" oninput="state.topicFilter.q=this.value;renderPage()">
        </div>
        <div class="pills">
          ${[['all','全部'],['normal','正常'],['hidden','已隐藏'],['deleted','已删除']].map(([k,l]) =>
            `<button class="pill-btn ${f.status===k?'active':''}" onclick="state.topicFilter.status='${k}';renderPage()">${l}</button>`
          ).join('')}
        </div>
        <select class="select" aria-label="板块筛选" onchange="showToast('已按板块筛选')">
          <option>全部板块</option><option>创意 / 作品分享</option><option>讨论 / 学习和教程</option><option>讨论 / 休闲</option><option>资源 / 求助悬赏</option><option>站务</option>
        </select>
      </div>
      <div class="toolbar-right">
        <span style="font-size:12px;color:var(--ink-3)">共 ${list.length} 篇</span>
      </div>
    </div>

    <section class="card" style="overflow:hidden">
      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th style="width:38px"><input type="checkbox" ${state.selectedTopics.size === list.length && list.length ? 'checked' : ''} onchange="toggleAllTopics(this.checked)"></th>
              <th>帖子与标签</th>
              <th>板块</th>
              <th>状态</th>
              <th class="right">回复</th>
              <th class="right" style="width:154px">操作</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(t => {
              const [tone, stTxt] = statusMap[t.status];
              return `
              <tr>
                <td><input type="checkbox" ${state.selectedTopics.has(t.id)?'checked':''} onchange="toggleTopicSel(${t.id}, this.checked)"></td>
                <td>
                  <div class="cell-title">
                    <a href="#" onclick="event.preventDefault();openTopicDrawer(${t.id})">${t.title}</a>
                    ${t.pin !== 'none' ? `<span class="tag info">${pinMap[t.pin]}</span>` : ''}
                    ${t.featured ? `<span class="tag brand">精华</span>` : ''}
                    ${t.locked ? `<span class="tag outline">已锁定</span>` : ''}
                    ${t.reports ? `<span class="tag danger">${t.reports} 条举报</span>` : ''}
                  </div>
                  <div class="cell-sub">
                    <span class="mono">#${t.id}</span>
                    <span>${t.author}</span>
                    <span>${t.time}</span>
                  </div>
                </td>
                <td style="white-space:nowrap;color:var(--ink-2)">${t.category}</td>
                <td><span class="tag ${tone}"><i class="dot ${tone}"></i>${stTxt}</span></td>
                <td class="right num">${t.replies}</td>
                <td class="right">
                  <div style="display:inline-flex;gap:6px">
                    <button class="btn btn-sm" onclick="openTopicDrawer(${t.id})">管理</button>
                    <button class="btn btn-sm ${t.status==='normal'?'btn-ghost':'btn-soft'}" onclick="quickToggleTopic(${t.id})">${t.status==='normal'?'隐藏':'恢复'}</button>
                  </div>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </section>

    ${state.selectedTopics.size ? `
      <div class="batch-bar">
        <span>已勾选 <strong>${state.selectedTopics.size}</strong> 篇帖子</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="batchTopics('已批量隐藏选中帖子')">批量隐藏</button>
          <button class="btn btn-sm" onclick="batchTopics('已批量设为精华')">批量加精</button>
          <button class="btn btn-sm" onclick="state.selectedTopics.clear();renderPage()">取消选择</button>
        </div>
      </div>
    ` : ''}
  `;
}

function toggleTopicSel(id, checked) { checked ? state.selectedTopics.add(id) : state.selectedTopics.delete(id); renderPage(); }
function toggleAllTopics(checked) {
  state.selectedTopics.clear();
  if (checked) DATA.topics.forEach(t => state.selectedTopics.add(t.id));
  renderPage();
}
function batchTopics(msg) { state.selectedTopics.clear(); showToast(msg, 'ok'); renderPage(); }
function quickToggleTopic(id) {
  const t = DATA.topics.find(x => x.id === id);
  if (!t) return;
  t.status = t.status === 'normal' ? 'hidden' : 'normal';
  showToast(t.status === 'hidden' ? `帖子 #${id} 已隐藏` : `帖子 #${id} 已恢复`, 'ok');
  renderPage();
}

function openTopicDrawer(id) {
  const t = DATA.topics.find(x => x.id === id);
  if (!t) return;
  openDrawer(`管理帖子 #${t.id}`, `
    <div style="margin-bottom:18px">
      <div style="font-size:16px;font-weight:700;line-height:1.45;margin-bottom:6px">${t.title}</div>
      <div style="font-size:12.5px;color:var(--ink-3)">作者：${t.author} · 发布于 ${t.time} · ${t.replies} 条回复</div>
    </div>
    <div class="form-grid" style="margin-bottom:18px">
      <div class="field">
        <label>置顶范围</label>
        <select class="select" id="drPin">
          <option value="none" ${t.pin==='none'?'selected':''}>不置顶</option>
          <option value="category" ${t.pin==='category'?'selected':''}>当前板块置顶</option>
          <option value="parent" ${t.pin==='parent'?'selected':''}>一级板块置顶</option>
          <option value="site" ${t.pin==='site'?'selected':''}>全站置顶</option>
        </select>
      </div>
      <div class="field">
        <label>所属分类（移动板块）</label>
        <select class="select" id="drCat">
          ${['创意 / 作品分享','讨论 / 学习和教程','讨论 / 休闲','资源 / 求助悬赏','站务 / 公告'].map(c =>
            `<option ${t.category===c?'selected':''}>${c}</option>`
          ).join('')}
        </select>
      </div>
    </div>
    <div class="card" style="padding:14px 16px;display:grid;gap:12px;margin-bottom:18px">
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <div><strong style="font-size:13px">设为精华帖</strong><div style="font-size:12px;color:var(--ink-3)">同帖首次加精自动向作者发放 +10 积分</div></div>
        <input type="checkbox" id="drFeat" ${t.featured?'checked':''} style="width:16px;height:16px;accent-color:var(--brand)">
      </label>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding-top:10px;border-top:1px solid var(--line-subtle)">
        <div><strong style="font-size:13px">锁定回复</strong><div style="font-size:12px;color:var(--ink-3)">锁定后普通成员不可继续跟帖评论</div></div>
        <input type="checkbox" id="drLock" ${t.locked?'checked':''} style="width:16px;height:16px;accent-color:var(--brand)">
      </label>
    </div>
    <div style="padding:14px 16px;border-radius:10px;border:1px solid color-mix(in srgb,var(--danger) 28%,var(--line));background:var(--danger-soft)">
      <div style="font-size:13px;font-weight:600;color:var(--danger);margin-bottom:6px">高危操作区</div>
      <p style="font-size:12px;color:var(--ink-2);margin-bottom:10px">删除后前台不可见，仍可在管理后台通过「恢复」找回。</p>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="quickToggleTopic(${t.id});closeDrawer()">${t.status==='normal'?'隐藏帖子':'恢复正常'}</button>
        <button class="btn btn-sm btn-danger" onclick="t_del(${t.id})">删除帖子</button>
      </div>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeDrawer()">取消</button>
    <button class="btn btn-primary" onclick="saveTopicDrawer(${t.id})">保存变更</button>
  `);
}
function saveTopicDrawer(id) {
  const t = DATA.topics.find(x => x.id === id);
  if (t) {
    t.pin = document.getElementById('drPin').value;
    t.category = document.getElementById('drCat').value;
    t.featured = document.getElementById('drFeat').checked;
    t.locked = document.getElementById('drLock').checked;
  }
  closeDrawer(); showToast(`帖子 #${id} 设置已更新`, 'ok'); renderPage();
}
function t_del(id) {
  const t = DATA.topics.find(x => x.id === id);
  if (t) t.status = 'deleted';
  closeDrawer(); showToast(`帖子 #${id} 已标记删除`, 'ok'); renderPage();
}

            </thead>
            <tbody>
              ${rows.map(u => {
                const [tone, stTxt] = statusMap[u.status];
                return `

function openMuteModal(uid) {
  const u = DATA.users.find(x => x.uid === uid);
  if (!u) return;
  openModal(`禁言用户 · ${u.nickname}`, `
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:14px">选择禁言时长，期间该用户将无法发帖、评论与发布作品，可随时解除。</p>
    <div class="quick-reasons" style="margin-bottom:14px">
      ${[['24','24 小时'],['72','3 天'],['168','7 天'],['720','30 天'],['','无限期']].map(([h,l]) =>
        `<button type="button" class="chip-btn" onclick="document.getElementById('muteH').value='${h}'">${l}</button>`
      ).join('')}
    </div>
    <div class="field">
      <label>自定义小时数（留空为无限期）</label>
      <input id="muteH" class="input" type="number" min="1" value="24" placeholder="例如 72">
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="confirmMute('${uid}')">确认禁言</button>
  `);
}
function confirmMute(uid) {
  const u = DATA.users.find(x => x.uid === uid);
  const h = document.getElementById('muteH').value.trim();
  if (u) { u.status = 'muted'; u.mutedUntil = h ? `${h} 小时后自动解除` : null; }
  closeModal(); showToast(`已禁言 ${u.nickname}`, 'ok'); renderPage();
}
function openBanModal(uid) {
  const u = DATA.users.find(x => x.uid === uid);
  openModal(`确认封禁「${u.nickname}」？`, `
    <p style="font-size:13px;color:var(--ink-2)">封禁后该用户将被限制使用论坛，其关联的首页精选作品也会自动退出公开展示；可随时点「恢复」解除。</p>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">取消</button>
    <button class="btn btn-danger-fill" onclick="confirmBan('${uid}')">确认封禁</button>
  `);
}
function confirmBan(uid) {
  const u = DATA.users.find(x => x.uid === uid);
  if (u) u.status = 'banned';
  closeModal(); showToast(`已封禁 ${u.nickname}`, 'ok'); renderPage();
}
function restoreUser(uid) {
  const u = DATA.users.find(x => x.uid === uid);
  if (u) { u.status = 'active'; u.mutedUntil = null; }
  showToast(`已恢复 ${u.nickname} 为正常状态`, 'ok'); renderPage();
}

                  <svg viewBox="0 0 36 36" width="76" height="76" fill="#18191e"><rect x="2" y="2" width="10" height="10" rx="1.5"/><rect x="4.5" y="4.5" width="5" height="5" fill="#fff"/><rect x="24" y="2" width="10" height="10" rx="1.5"/><rect x="26.5" y="4.5" width="5" height="5" fill="#fff"/><rect x="2" y="24" width="10" height="10" rx="1.5"/><rect x="4.5" y="26.5" width="5" height="5" fill="#fff"/><rect x="15" y="15" width="6" height="6" rx="1" fill="var(--brand-fill)"/><rect x="24" y="24" width="4" height="4"/><rect x="30" y="28" width="4" height="6"/><rect x="16" y="4" width="4" height="6"/><rect x="15" y="25" width="5" height="5"/></svg>
                </div>
                <div style="display:grid;gap:6px">
                  <button class="btn btn-sm" onclick="showToast('选择 ≤ 5 MiB 的 PNG/JPG/WebP 二维码')">更换二维码</button>
                  <span style="font-size:11.5px;color:var(--ink-3)">${ch.extra}</span>
                </div>
              </div>
              <div class="field"><label>显示名称</label><input class="input" value="${ch.name}"></div>
              ${ch.expire ? `<div class="field"><label>二维码失效日期 (CST)</label><input class="input" type="date" value="${ch.expire}"></div>` : ''}
            </div>
          </section>
        `).join('')}
      </div>
    ` : `
      <section class="card" style="overflow:hidden">
        <table class="tbl">
          <thead><tr><th>时间</th><th>管理员</th><th>操作动作</th><th>目标对象</th><th>详情</th></tr></thead>
          <tbody>
            ${DATA.audit.map(a => `
              <tr>
                <td class="mono" style="white-space:nowrap;color:var(--ink-3)">${a.time}</td>
                <td><strong>${a.admin}</strong></td>
                <td><span class="tag outline">${a.action}</span></td>
                <td>${a.target}</td>
                <td style="color:var(--ink-2)">${a.detail}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </section>
    `}
  `;
}

function setSubtab(page, sub) { state.subtab[page] = sub; renderPage(); }

/* ==========================================================================
   抽屉、弹窗、⌘K 命令面板、信息架构对照、Toast
   ========================================================================== */
function openDrawer(title, bodyHtml, footHtml, wide = false) {
  const host = document.getElementById('drawerOverlay');
  host.innerHTML = `
    <div class="drawer ${wide ? 'wide' : ''}" onclick="event.stopPropagation()">
      <div class="drawer-head">
        <h3>${title}</h3>
        <button class="btn btn-ghost btn-icon" onclick="closeDrawer()" aria-label="关闭">${ic('x', 16)}</button>
      </div>
      <div class="drawer-body">${bodyHtml}</div>
      <div class="drawer-foot">${footHtml || ''}</div>
    </div>`;
  host.classList.add('open');
  host.onclick = closeDrawer;
}
function closeDrawer() { document.getElementById('drawerOverlay').classList.remove('open'); }

function switchDrawerTab(btn, id) {
  btn.parentElement.querySelectorAll('.subtab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.df-pane').forEach(p => p.style.display = p.id === id ? 'block' : 'none');
}

function openModal(title, bodyHtml, footHtml, wide = false) {
  const host = document.getElementById('modalOverlay');
  host.innerHTML = `
    <div class="modal ${wide ? 'wide' : ''}" onclick="event.stopPropagation()">
      <div class="modal-head">
        <h3>${title}</h3>
        <button class="btn btn-ghost btn-icon" onclick="closeModal()" aria-label="关闭">${ic('x', 16)}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml ? `<div class="modal-foot">${footHtml}</div>` : ''}
    </div>`;
  host.classList.add('open');
  host.onclick = closeModal;
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

function filterCmds(q) {
  const kw = q.trim().toLowerCase();
  const list = (window.__cmds || []).filter(c => !kw || c.label.toLowerCase().includes(kw) || c.sub.toLowerCase().includes(kw));
  document.getElementById('cmdResults').innerHTML = list.map((c, idx) => `
    <button class="cmd-row" onclick="closeModal();window.__cmds[${(window.__cmds).indexOf(c)}].fn()">
      <span class="left"><strong>${c.label}</strong></span>
      <small class="mono">${c.sub}</small>
    </button>
  `).join('') || '<div style="padding:20px;text-align:center;color:var(--ink-3)">未找到匹配项</div>';
}

function showToast(text, kind = 'default') {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<i class="t-dot"></i><span>${text}</span>`;
  host.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

/* ==========================================================================
   初始化 + URL 参数支持（供设计稿总导航快捷预设直达）
   ========================================================================== */
initStudioControls();
function syncStudioHeight() {
  const bar = document.querySelector('.studio-bar');
  if (bar) document.documentElement.style.setProperty('--studio-h', `${Math.ceil(bar.getBoundingClientRect().height)}px`);
}
syncStudioHeight();
window.addEventListener('resize', syncStudioHeight);
applyPalette('red', 'light');
const params = new URLSearchParams(location.search);
const initPage = params.get('page');
const initSub = params.get('sub');
if (params.get('view') === 'login') {
  navigate('overview');
  toggleLogin(true);
} else if (initPage) {
  navigate(initPage, initSub || undefined);
} else {
  navigate('overview');
}
</script>
