<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>超级小伴社区网页版 · 我的 / 个人主页 / 我的作品 / 通知（PC + 手机 H5）</title>
<style>
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  margin: 0;
  background: #ebedf0;
  color: #1f2024;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  transition: background .22s ease, color .22s ease;
}
body.studio-dark { background: #0c0d10; color: #eceef2; }
button, input { border: 0; background: none; font: inherit; color: inherit; padding: 0; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid #e3203c; outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ─── Studio Bar ─── */
.studio-bar {
  position: sticky;
  top: 0;
  z-index: 120;
  background: rgba(255, 255, 255, .92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0, 0, 0, .07);
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
body.studio-dark .studio-bar {
  background: rgba(18, 19, 23, .92);
  border-bottom-color: rgba(255, 255, 255, .08);
}
.sb-left, .sb-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.sb-brand { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
.sb-brand-dot { width: 22px; height: 22px; border-radius: 7px; background: #e3203c; color: #fff; display: grid; place-items: center; }
.sb-brand-dot svg { width: 13px; height: 13px; }
.sb-tag { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.06); color: #666; }
body.studio-dark .sb-tag { background: rgba(255,255,255,.09); color: #9ca0aa; }

.seg { display: inline-flex; align-items: center; padding: 3px; border-radius: 10px; background: rgba(0,0,0,.055); gap: 2px; }
body.studio-dark .seg { background: rgba(255,255,255,.08); }
.seg button { height: 28px; padding: 0 11px; border-radius: 7px; font-size: 12px; color: #5c6068; transition: background .15s, color .15s; white-space: nowrap; }
body.studio-dark .seg button { color: #a1a5b0; }
.seg button.active { background: #ffffff; color: #1c1d21; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.09); }
body.studio-dark .seg button.active { background: #2a2c33; color: #f4f5f8; }

.swatches { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 10px; background: rgba(0,0,0,.055); }
body.studio-dark .swatches { background: rgba(255,255,255,.08); }
.swatch { width: 14px; height: 14px; border-radius: 50%; position: relative; transition: transform .14s; }
.swatch:hover { transform: scale(1.15); }
.swatch.active::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid currentColor; }

.pill-btn {
  height: 32px;
  padding: 0 11px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 500;
  background: rgba(255,255,255,.86);
  color: #32343a;
  border: 1px solid rgba(0,0,0,.08);
}
body.studio-dark .pill-btn { background: #1e2026; color: #dce0e8; border-color: rgba(255,255,255,.1); }

/* ─── Stage Layout ─── */
.stage {
  max-width: 1520px;
  margin: 0 auto;
  padding: 20px 20px 44px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: 24px;
}
.pane-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 4px 10px;
  min-height: 26px;
}
.pane-head h2 { font-size: 13.5px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
.pane-head span.hint { font-size: 11.5px; color: #757982; }
body.studio-dark .pane-head span.hint { color: #8f939e; }

.pc-pane { flex: 1 1 860px; max-width: 1040px; min-width: 0; }
.h5-pane { width: 390px; flex: none; }
body[data-device="desktop"] .h5-pane { display: none; }
body[data-device="mobile"] .pc-pane { display: none; }

/* ─── Design Tokens (Shared by PC & H5 Containers) ─── */
.ui-scope {
  --paper: #fafafa;
  --surface: #ffffff;
  --ink: #222222;
  --ink2: #666666;
  --ink3: #9a9a9a;
  --hairline: #ededed;
  --fill: #f2f2f2;
  --line: #e4e4e4;
  --draft-line: #c9cdd4;
  --ring: rgba(0, 0, 0, .06);
  --accent: #e3203c;
  --accent-soft: #fff3f4;
  --accent-ink: #e3203c;
  --success: #2fa36b;
  --success-soft: #eaf6f0;
  --warn: #b26a00;
  --warn-soft: #fdf3e3;
  --danger: #e3203c;
  --danger-soft: #fff3f4;
  --card-shadow: 0 1px 2px rgba(15, 20, 30, .03);
  --sheet-shadow: 0 -8px 32px rgba(0, 0, 0, .14);
  color: var(--ink);
}
.ui-scope.dark {
  --paper: #111111;
  --surface: #1c1c1e;
  --ink: #ececec;
  --ink2: #9a9aa0;
  --ink3: #6e6e73;
  --hairline: #2a2a2d;
  --fill: #2c2c2e;
  --line: #363639;
  --draft-line: #4d4f57;
  --ring: rgba(255, 255, 255, .10);
  --success: #45be83;
  --success-soft: #1a3126;
  --warn: #f0b65a;
  --warn-soft: #362916;
  --danger: #ff6369;
  --danger-soft: #361e22;
  --card-shadow: none;
  --sheet-shadow: 0 -10px 36px rgba(0, 0, 0, .58);
}

/* ─── Browser Frame (PC Web) ─── */
.browser {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  background: var(--paper);
  border: 1px solid rgba(0,0,0,.08);
  box-shadow: 0 22px 54px rgba(15, 20, 30, .10);
  min-height: 780px;
  display: flex;
  flex-direction: column;
}
.browser.dark {
  border-color: rgba(255,255,255,.08);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .5);
}
.browser-chrome {
  height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex: none;
}
.traffic { display: inline-flex; gap: 6px; }
.traffic i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.url-pill {
  flex: 1;
  max-width: 420px;
  height: 24px;
  border-radius: 7px;
  background: var(--paper);
  border: 0.5px solid var(--hairline);
  padding: 0 10px;
  font-size: 11.5px;
  color: var(--ink3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.url-pill svg { width: 11px; height: 11px; }

.pc-shell {
  flex: 1;
  display: grid;
  grid-template-columns: 204px minmax(0, 1fr);
  min-height: 744px;
}
.pc-rail {
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pc-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 10px 14px;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
}
.pc-logo-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: var(--accent);
  color: #ffffff;
  display: grid;
  place-items: center;
}
.pc-logo-mark svg { width: 16px; height: 16px; }
.rail-item {
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
  transition: background .14s, color .14s;
  text-align: left;
}
.rail-item:hover { background: var(--paper); color: var(--ink); }
.rail-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.rail-item svg { width: 18px; height: 18px; stroke-width: 1.8; }
.rail-badge {
  margin-left: auto;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  line-height: 18px;
  font-weight: 600;
  text-align: center;
}
.rail-sep { height: 1px; background: var(--hairline); margin: 8px 10px; }
.rail-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--hairline); display: flex; flex-direction: column; gap: 2px; }

.pc-right {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--paper);
}
.pc-topbar {
  height: 54px;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex: none;
}
.pc-search {
  width: 260px;
  height: 34px;
  border-radius: 99px;
  background: var(--fill);
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--ink3);
  font-size: 13px;
}
.pc-search svg { width: 15px; height: 15px; }
.pc-top-actions { display: flex; align-items: center; gap: 8px; }
.pc-icon-btn {
  position: relative;
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--ink2);
  transition: background .14s, color .14s;
}
.pc-icon-btn:hover { background: var(--fill); color: var(--ink); }
.pc-icon-btn svg { width: 18px; height: 18px; }
.pc-icon-btn .tiny-badge {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 0 2px var(--surface);
}
.pc-publish-btn {
  height: 32px;
  padding: 0 13px;
  border-radius: 99px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.pc-publish-btn svg { width: 14px; height: 14px; stroke-width: 2.2; }
.pc-top-av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--ring);
}
.pc-top-av img { width: 100%; height: 100%; object-fit: cover; display: block; }

.pc-main {
  flex: 1;
  padding: 22px 26px 34px;
  overflow-y: auto;
}
.pc-container { max-width: 760px; margin: 0 auto; }

/* PC Cards & Panels */
.pc-card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  overflow: hidden;
}
.pc-card + .pc-card { margin-top: 14px; }
.pc-page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.pc-page-head h1 { font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.015em; }
.pc-head-ops { display: flex; align-items: center; gap: 8px; }

/* PC Me View */
.pc-hero {
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.pc-quick-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--hairline);
}
.pc-quick-item {
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  position: relative;
  transition: background .13s;
}
.pc-quick-item:hover { background: var(--paper); }
.pc-quick-item + .pc-quick-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 16px;
  width: 1px;
  background: var(--hairline);
}
.pc-quick-ico {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--fill);
  color: var(--ink);
  display: grid;
  place-items: center;
  flex: none;
}
.pc-quick-ico svg { width: 19px; height: 19px; }
.pc-quick-copy strong { display: block; font-size: 14.5px; font-weight: 600; color: var(--ink); }
.pc-quick-copy small { display: block; font-size: 12px; color: var(--ink3); margin-top: 1px; }

.pc-sec-title {
  padding: 16px 4px 8px;
  font-size: 12.5px;
  font-weight: 550;
  color: var(--ink3);
}
.pc-links-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.pc-link-cell {
  padding: 15px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  position: relative;
  transition: background .13s;
}
.pc-link-cell:hover { background: var(--paper); }
.pc-link-cell:nth-child(even)::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: var(--hairline);
}
.pc-link-cell:nth-child(n+3)::after {
  content: "";
  position: absolute;
  top: 0;
  left: 16px;
  right: 16px;
  height: 1px;
  background: var(--hairline);
}
.pc-link-cell svg.lead { width: 19px; height: 19px; color: var(--ink2); }
.pc-link-copy { flex: 1; min-width: 0; }
.pc-link-copy strong { display: block; font-size: 14.5px; font-weight: 550; color: var(--ink); }
.pc-link-copy small { display: block; font-size: 12px; color: var(--ink3); margin-top: 1px; }

/* PC Profile */
.pc-profile-top {
  padding: 22px 24px 18px;
  display: flex;
  align-items: center;
  gap: 18px;
}
.pc-stats-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--hairline);
  padding: 12px 12px;
}
.pc-people-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  padding: 14px 16px 18px;
}
.pc-person-card {
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--hairline);
  background: var(--paper);
  display: flex;
  align-items: center;
  gap: 11px;
}

/* ─── Phone Frame (Mobile H5) ─── */
.phone {
  position: relative;
  height: 780px;
  border-radius: 38px;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 6px solid #ffffff;
  box-shadow: 0 22px 58px rgba(15, 18, 25, .11), 0 0 0 1px rgba(0,0,0,.06);
  isolation: isolate;
}
.phone.dark {
  border-color: #242428;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255,255,255,.07);
}
.status-bar {
  height: 34px;
  flex: none;
  padding: 9px 22px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface);
}
.status-right { display: flex; align-items: center; gap: 6px; }
.status-right svg { width: 14px; height: 14px; }
.bat { display: inline-flex; align-items: center; padding: 1.5px; width: 22px; height: 11px; border: 1.2px solid currentColor; border-radius: 3px; position: relative; }
.bat::before { content: ""; display: block; width: 78%; height: 100%; border-radius: 1.5px; background: var(--ink); }
.bat::after { content: ""; position: absolute; right: -3px; top: 2.5px; width: 2px; height: 4px; border-radius: 1px; background: currentColor; opacity: .5; }

.h5-appbar {
  height: 46px;
  flex: none;
  padding: 0 10px 0 16px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.h5-appbar.sub {
  padding: 0 8px;
  display: grid;
  grid-template-columns: 76px 1fr 76px;
  align-items: center;
}
.h5-appbar.has-sep { border-bottom: 0.5px solid var(--hairline); }
.h5-appbar h3 { font-size: 18px; line-height: 24px; font-weight: 650; }
.h5-appbar.sub h3 { text-align: center; font-size: 17px; }
.h5-bar-left { display: flex; align-items: center; }
.h5-bar-right { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.icon-tap {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--ink);
  transition: background .14s;
}
.icon-tap:hover { background: var(--fill); }
.icon-tap svg { width: 20px; height: 20px; stroke-width: 1.75; }

.h5-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding-bottom: 18px;
}
.h5-body.is-empty {
  display: flex;
  flex-direction: column;
  padding-bottom: 0;
}
.h5-body::-webkit-scrollbar { display: none; }

/* ─── Shared Components (Avatar, Pills, Tabs, Rows, Feeds) ─── */
.avatar {
  border-radius: 50%;
  overflow: hidden;
  flex: none;
  background: var(--fill);
  box-shadow: 0 0 0 1px var(--ring);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.sz-74 { width: 74px; height: 74px; }
.avatar.sz-64 { width: 64px; height: 64px; }
.avatar.sz-40 { width: 40px; height: 40px; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; }
.avatar.guest { display: grid; place-items: center; color: var(--ink3); }
.avatar.guest svg { width: 26px; height: 26px; }

.id-copy {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--ink3);
  padding: 2px 0;
}
.id-copy:hover { color: var(--ink2); }
.id-copy svg { width: 12px; height: 12px; opacity: .75; }

.pill {
  flex: none;
  height: 32px;
  padding: 0 13px;
  border-radius: 99px;
  font-size: 12.5px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  white-space: nowrap;
  transition: opacity .14s, background .14s;
}
.pill:hover:not(:disabled) { opacity: .88; }
.pill:disabled { opacity: .45; cursor: default; }
.pill.primary { background: var(--accent-soft); color: var(--accent-ink); }
.pill.solid { background: var(--accent); color: #ffffff; }
.pill.secondary { background: var(--fill); color: var(--ink2); font-weight: 500; }
.pill.ghost-link { background: transparent; color: var(--ink2); font-weight: 500; padding: 0 8px; }
.pill.ghost-link:hover { background: var(--fill); color: var(--ink); }
.pill.done { background: var(--success-soft); color: var(--success); font-weight: 550; }
.pill svg { width: 14px; height: 14px; stroke-width: 2; }

.status-chip {
  flex: none;
  height: 20px;
  padding: 0 7px;
  border-radius: 99px;
  font-size: 11px;
  line-height: 20px;
  font-weight: 550;
}
.status-chip.draft { background: var(--paper); color: var(--ink2); border: 1px dashed var(--draft-line); line-height: 18px; }
.status-chip.live { background: var(--success-soft); color: var(--success); }
.status-chip.review { background: var(--warn-soft); color: var(--warn); }
.status-chip.removed { background: var(--fill); color: var(--ink3); }
.status-chip.tag { background: var(--fill); color: var(--ink2); }

.tabs-bar {
  background: var(--surface);
  border-bottom: 0.5px solid var(--hairline);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 4px;
}
.tab-btn {
  position: relative;
  height: 44px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink2);
  white-space: nowrap;
}
.tab-btn .cnt { font-size: 12px; color: var(--ink3); font-variant-numeric: tabular-nums; }
.tab-btn.active { color: var(--ink); font-weight: 650; }
.tab-btn.active .cnt { color: var(--ink2); }
.tab-btn.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 20px;
  height: 2.5px;
  border-radius: 99px;
  background: var(--accent);
}

.filter-strip {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 0.5px solid var(--hairline);
}
.phone .filter-strip {
  flex-wrap: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}

function unreadCount() {
  return state.notifEmpty ? 0 : state.notifs.filter(n => n.unread).length;
}

function pageUrl() {
  if (state.page === 'me') return 'chat.xiangban.xyz/me';
  if (state.page === 'profile') return state.profileView === 'other' ? 'chat.xiangban.xyz/u/linshen' : 'chat.xiangban.xyz/u/read';
  if (state.page === 'works') return state.worksKind === 'schemes' ? 'chat.xiangban.xyz/me/works?tab=schemes' : 'chat.xiangban.xyz/me/works';
  return 'chat.xiangban.xyz/notifications';
}

/* ─── Render Substate Segment in Studio Bar ─── */
function renderSubstateControls() {
  const seg = document.getElementById('substate-seg');
  let opts = [];
  if (state.page === 'me') {
    opts = [
      { label: '已登录', active: state.loggedIn, act: 'me:in' },
      { label: '未登录', active: !state.loggedIn, act: 'me:out' },
    ];
  } else if (state.page === 'profile') {
    opts = [
      { label: '本人视角', active: state.profileView === 'self', act: 'profile:self' },
      { label: '他人视角', active: state.profileView === 'other', act: 'profile:other' },
      { label: '本人空态', active: state.profileView === 'empty', act: 'profile:empty' },
    ];
  } else if (state.page === 'works') {
    opts = [
      { label: '有作品', active: !state.worksEmpty, act: 'works:full' },
      { label: '空态', active: state.worksEmpty, act: 'works:empty' },
    ];
  } else {
    opts = [
      { label: '有通知', active: !state.notifEmpty, act: 'notif:full' },
      { label: '空态', active: state.notifEmpty, act: 'notif:empty' },
    ];
  }
  seg.innerHTML = opts.map(o => `<button class="${o.active ? 'active' : ''}" data-substate="${o.act}">${o.label}</button>`).join('');
}

/* ─── Shared Feed Builders ─── */
function topicsHtml(target, list) {
  if (!list.length) {
    return `<div class="empty-box"><span class="empty-ico">${icon('folder')}</span><strong>还没有发布过帖子</strong><p>分享你的创作作品、使用技巧或问题讨论，都会展示在这里</p><button class="pill primary" data-toast="${target}:打开发帖弹窗">去发一篇</button></div>`;
  }
  return list.map(t => `
    <button class="topic-row" data-toast="${target}:打开帖子「${t.title.slice(0, 12)}…」">
      <div class="topic-main">
        <div class="topic-copy">
          <div class="topic-title">${t.title}</div>
          <div class="topic-excerpt">${t.excerpt}</div>
        </div>
        ${t.thumb ? `<div class="topic-thumb"><img src="${t.thumb}" alt="缩略图"></div>` : ''}
      </div>
      <div class="topic-foot">
        <span class="topic-foot-l"><span class="cat-chip">${t.cat}</span><span>${t.time}</span></span>
        <span class="topic-stats"><span>${icon('discuss')}${t.replies}</span><span>${icon('heart')}${t.likes}</span></span>
      </div>
    </button>
  `).join('');
}

function repliesHtml(target, list) {
  if (!list.length) {
    return `<div class="empty-box"><span class="empty-ico">${icon('discuss')}</span><strong>还没有回复记录</strong><p>参与社区帖子讨论后，你的回复会沉淀在这里</p></div>`;
  }
  return list.map(r => `
    <button class="topic-row" data-toast="${target}:定位到帖子回复楼层">
      <div class="topic-title" style="font-size:14px;color:var(--ink2);font-weight:550">回复了「${r.topic}」</div>
      <div class="reply-quote">${r.excerpt}</div>
      <div class="topic-foot"><span>${r.time}</span></div>
    </button>
  `).join('');
}

function renderDialog(scope) {
  if (!state.dialog || state.dialog.scope !== scope) return '';
  const list = state.dialog.kind === 'packs' ? state.works : state.schemes;
  const w = list.find(x => x.id === state.dialog.workId);
  if (!w) return '';
  const isRemove = state.dialog.action === 'remove';
  const isDraft = w.status === 'draft';
  const title = isRemove
    ? `下架「${w.title}」？`
    : (isDraft ? `删除草稿「${w.title}」？` : `删除作品「${w.title}」？`);
  const desc = isRemove
    ? '下架后不再出现在公开入口，仍保留在你的「已下架」列表中；已应用过该作品的用户不受影响。'
    : (isDraft
        ? '删除后将清理本机草稿文件与试玩存档，无法恢复；不影响已导出或已发布的副本。'
        : (w.status === 'removed'
            ? '彻底删除后将从你的作品列表中永久移除，无法恢复。'
            : '删除后将从社区和你的作品列表中永久移除，无法恢复；已经应用过该作品的用户不受影响。'));
  const confirmText = isRemove ? '确认下架' : (isDraft ? '删除草稿' : '永久删除');
  const btnTone = isRemove ? 'neutral' : 'danger';
  return `
    <div class="dialog-mask" data-close-dialog="1">
      <div class="dialog-card" role="alertdialog" aria-modal="true" aria-label="${title}">
        <h4>${title}</h4>
        <p>${desc}</p>
        <div class="dialog-btns">
          <button class="dialog-primary ${btnTone}" data-confirm-dialog="1">${confirmText}</button>
          <button class="dialog-cancel" data-close-dialog="1">取消</button>
        </div>
      </div>
    </div>
  `;
}

function renderH5() {
  let content = '';
  if (state.page === 'me') content = renderH5Me();
  else if (state.page === 'profile') content = renderH5Profile();
  else if (state.page === 'works') content = renderH5Works();
  else content = renderH5Notifs();
  return `${content}<div class="toast-msg" id="toast-h5"></div>${renderH5Sheet()}${renderDialog('h5')}`;
}

function applyAccent() {
  const preset = ACCENTS.find(a => a.id === state.accent) || ACCENTS[0];
  const palette = state.dark ? preset.dark : preset.light;
  document.querySelectorAll('.ui-scope').forEach(el => {
    el.classList.toggle('dark', state.dark);
    el.style.setProperty('--accent', palette.btn);
    el.style.setProperty('--accent-soft', palette.soft);
    el.style.setProperty('--accent-ink', palette.ink);
  });
}

const toastTimers = {};
function showToast(scope, msg) {
  const el = document.getElementById('toast-' + scope);
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimers[scope]);
  toastTimers[scope] = setTimeout(() => el.classList.remove('show'), 1800);
}

function render() {
  document.body.classList.toggle('studio-dark', state.dark);
  document.body.dataset.device = state.device;
  document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === state.page));
  document.querySelectorAll('[data-device]').forEach(b => b.classList.toggle('active', b.dataset.device === state.device));
  document.getElementById('toggle-dark').textContent = state.dark ? '浅色模式' : '深色模式';
  renderSubstateControls();
  document.getElementById('pc-root').innerHTML = renderPc();
  document.getElementById('h5-root').innerHTML = renderH5();
  applyAccent();
}

/* URL query support */
const params = new URLSearchParams(location.search);
if (['me', 'profile', 'works', 'notifications'].includes(params.get('page'))) state.page = params.get('page');
if (['both', 'desktop', 'mobile'].includes(params.get('device'))) state.device = params.get('device');

/* Swatches */
const sw = document.getElementById('swatches');
ACCENTS.forEach(a => {
  const b = document.createElement('button');
  b.className = 'swatch' + (a.id === state.accent ? ' active' : '');
  b.style.background = a.light.btn;
  b.style.color = a.light.btn;
  b.title = a.name;
  b.addEventListener('click', () => {
    state.accent = a.id;
    sw.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    applyAccent();
  });
  sw.appendChild(b);
});

document.addEventListener('click', (e) => {
  const pg = e.target.closest('[data-page]');
  if (pg) { state.page = pg.dataset.page; state.pcMenuOpen = null; state.h5Sheet = null; state.dialog = null; render(); return; }

  const dv = e.target.closest('[data-device]');
  if (dv) { state.device = dv.dataset.device; render(); return; }

  const nav = e.target.closest('[data-nav]');
  if (nav) { state.page = nav.dataset.nav; state.pcMenuOpen = null; state.h5Sheet = null; state.dialog = null; render(); return; }

  const sub = e.target.closest('[data-substate]');
  if (sub) {
    const [k, v] = sub.dataset.substate.split(':');
    if (k === 'me') state.loggedIn = v === 'in';
    if (k === 'profile') state.profileView = v;
    if (k === 'works') state.worksEmpty = v === 'empty';
    if (k === 'notif') state.notifEmpty = v === 'empty';
    state.pcMenuOpen = null;
    state.h5Sheet = null;
    state.dialog = null;
    render();
    return;
  }

  if (e.target.closest('#toggle-dark') || e.target.closest('[data-toggle-dark-inner]')) {
    state.dark = !state.dark;
    render();
    return;
  }

  const ptab = e.target.closest('[data-ptab]');
  if (ptab) { state.profileTab = ptab.dataset.ptab; render(); return; }

  const wkind = e.target.closest('[data-wkind]');
  if (wkind) { state.worksKind = wkind.dataset.wkind; state.worksFilter = 'all'; render(); return; }

  const wfilter = e.target.closest('[data-wfilter]');
  if (wfilter) { state.worksFilter = wfilter.dataset.wfilter; render(); return; }

  const ntab = e.target.closest('[data-ntab]');
  if (ntab) { state.notifTab = ntab.dataset.ntab; render(); return; }

  const checkin = e.target.closest('[data-checkin]');
  if (checkin) { state.checkedIn = true; render(); showToast(checkin.dataset.checkin, '签到成功'); return; }

  const pFollow = e.target.closest('[data-toggle-person]');
  if (pFollow) {
    const [scope, uid] = pFollow.dataset.togglePerson.split(':');
    state.followMap[uid] = !state.followMap[uid];
    render();
    showToast(scope, state.followMap[uid] ? '已关注' : '已取消关注');
    return;
  }

  if (e.target.closest('[data-toggle-other-follow]')) {
    state.otherFollowing = !state.otherFollowing;
    render();
    showToast('pc', state.otherFollowing ? '已关注 林深见鹿' : '已取消关注');
    showToast('h5', state.otherFollowing ? '已关注 林深见鹿' : '已取消关注');
    return;
  }

  if (e.target.closest('[data-toggle-block]')) {
    state.pcMenuOpen = null;
    state.h5Sheet = null;
    state.otherBlocked = !state.otherBlocked;
    if (state.otherBlocked) state.otherFollowing = false;
    render();
    showToast('pc', state.otherBlocked ? '已屏蔽该用户' : '已取消屏蔽');
    showToast('h5', state.otherBlocked ? '已屏蔽该用户' : '已取消屏蔽');
    return;
  }

  const markAll = e.target.closest('[data-mark-all]');
  if (markAll) {
    state.notifs.forEach(n => n.unread = false);
    render();
    showToast(markAll.dataset.markAll, '已全部标记为已读');
    return;
  }

  const readOne = e.target.closest('[data-read-one]');
  if (readOne) {
    const [scope, id] = readOne.dataset.readOne.split(':');
    const item = state.notifs.find(n => n.id === Number(id));
    if (item) item.unread = false;
    render();
    showToast(scope, '已打开内容并标记已读');
    return;
  }

  const pubDraft = e.target.closest('[data-publish-draft]');
  if (pubDraft) {
    const [scope, id] = pubDraft.dataset.publishDraft.split(':');
    const w = state.works.find(x => x.id === Number(id));
    if (w && w.status === 'draft') {
      w.status = 'review';
      w.statusText = '审核中';
      w.version = 'v1';
      delete w.storage;
    }
    state.pcMenuOpen = null;
    state.h5Sheet = null;
    render();
    showToast(scope, `已提交「${w ? w.title : '草稿'}」审核`);
    return;
  }

  const askDlg = e.target.closest('[data-ask-dialog]');
  if (askDlg) {
    const [scope, action, kind, id] = askDlg.dataset.askDialog.split(':');
    state.pcMenuOpen = null;
    state.h5Sheet = null;
    state.dialog = { scope, action, kind, workId: Number(id) };
    render();
    return;
  }

  if (e.target.closest('[data-confirm-dialog]')) {
    const dlg = state.dialog;
    if (dlg) {
      const listKey = dlg.kind === 'packs' ? 'works' : 'schemes';
      const w = state[listKey].find(x => x.id === dlg.workId);
      let msg = '';
      if (dlg.action === 'remove') {
        if (w) { w.status = 'removed'; w.statusText = '已下架'; }
        msg = `已下架「${w ? w.title : '作品'}」`;
      } else {
        const wasDraft = w && w.status === 'draft';
        state[listKey] = state[listKey].filter(x => x.id !== dlg.workId);
        msg = wasDraft ? `已删除草稿「${w.title}」` : `已永久删除「${w ? w.title : '作品'}」`;
      }
      state.dialog = null;
      render();
      showToast(dlg.scope, msg);
    }
    return;
  }

  if (e.target.closest('[data-close-dialog]') && (e.target.classList.contains('dialog-mask') || e.target.classList.contains('dialog-cancel'))) {
    state.dialog = null;
    render();
    return;
  }

  const pm = e.target.closest('[data-pc-menu]');
  if (pm) {
    state.pcMenuOpen = state.pcMenuOpen === pm.dataset.pcMenu ? null : pm.dataset.pcMenu;
    render();
    return;
  }

  const hs = e.target.closest('[data-h5-sheet]');
  if (hs) {
    const [kind, id] = hs.dataset.h5Sheet.split(':');
    state.h5Sheet = { kind, id };
    render();
    return;
  }

  const st = e.target.closest('[data-sheet-toast]');
  if (st) {
    const [scope, msg] = st.dataset.sheetToast.split(':');
    state.h5Sheet = null;
    render();
    showToast(scope, msg);
    return;
  }

  if (e.target.closest('[data-close-sheet]') && (e.target.classList.contains('sheet-mask') || e.target.classList.contains('sheet-cancel'))) {
    state.h5Sheet = null;
    render();
    return;
  }

  const toastBtn = e.target.closest('[data-toast]');
  if (toastBtn) {
    const [scope, msg] = toastBtn.dataset.toast.split(':');
    state.pcMenuOpen = null;
    render();
    showToast(scope, msg);
    return;
  }

  if (state.pcMenuOpen && !e.target.closest('.pop-menu')) {
    state.pcMenuOpen = null;
    render();
  }
});

render();
</script>
</body>
</html>
