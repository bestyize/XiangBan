<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>碎花垂耳兔 · 创意作品详情预览</title>
  <style>
    :root {
      color-scheme: light dark;
      --stage: light-dark(#f3f3f3, #141414);
      --page: light-dark(#fafafa, #1b1b1b);
      --surface: light-dark(#fff, #242424);
      --line: light-dark(#ededed, #393939);
      --ink: light-dark(#222, #f2f2f2);
      --copy: light-dark(#444, #d4d4d4);
      --muted: light-dark(#666, #b1b1b1);
      --control: light-dark(#efeff0, #383838);
      --control-hover: light-dark(#e5e5e7, #444);
      --focus: light-dark(#666, #b1b1b1);
      --comment-fill: light-dark(#f2f2f2, #303030);
      --comment-brand: light-dark(#c71932, #ff9cab);
      font-family: Inter, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      background: var(--stage);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .preview-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-inline-size: 1120px;
      min-block-size: 62px;
      margin-inline: auto;
      padding: 8px 20px;
    }

    .preview-name { color: var(--muted); font-size: 13px; font-weight: 600; }
    .device-switch { display: flex; gap: 4px; padding: 4px; border-radius: 24px; background: var(--page); }
    .device-switch button {
      min-inline-size: 60px;
      min-block-size: 34px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
    }
    .device-switch [aria-pressed='true'] { background: var(--surface); color: var(--ink); font-weight: 650; }

    .preview-screen {
      container: work-preview / inline-size;
      min-block-size: calc(100dvh - 62px);
      max-inline-size: 1120px;
      margin-inline: auto;
      background: var(--page);
    }
    .preview-screen[data-device='mobile'] { max-inline-size: 390px; }

    .detail-page { padding-block-end: 24px; }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-block-size: 52px;
      padding-inline: 16px;
      color: var(--copy);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .back::before {
      content: '';
      inline-size: 8px;
      block-size: 8px;
      border-inline-start: 1.6px solid;
      border-block-end: 1.6px solid;
      transform: rotate(45deg);
      margin-inline-start: 3px;
    }

    .work {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
      align-items: center;
      background: var(--surface);
    }
    .work-image { display: block; inline-size: 100%; block-size: auto; background: var(--page); }
    .work-copy { padding: 32px clamp(24px, 4cqi, 46px); }
    .work-type { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 18px; }
    h1 { margin: 0; font-size: clamp(26px, 3.35cqi, 38px); line-height: 1.23; font-weight: 700; }
    .description { margin: 16px 0 0; color: var(--copy); font-size: 16px; line-height: 1.7; }

    .credits { display: grid; gap: 10px; margin: 24px 0 0; padding-block-start: 18px; border-block-start: 1px solid var(--line); }
    .credits div { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; font-size: 13px; line-height: 18px; }
    .credits dt { color: var(--muted); }
    .credits dd { margin: 0; }
    .credits a { text-decoration-thickness: 1px; text-underline-offset: 3px; }

    .launch { margin-block-start: 26px; }
    .launch-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-block-size: 48px;
      padding: 10px 24px;
      border-radius: 24px;
      background: var(--control);
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
      line-height: 22px;
      text-decoration: none;
    }
    .launch-link:hover { background: var(--control-hover); }
    .input-hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 18px; }
    .touch-hint { display: none; }

    .icon { inline-size: 20px; block-size: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .comment-dock { display: flex; align-items: center; gap: 4px; margin: 16px 0 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .dock-capsule { display: flex; flex: 1; align-items: center; gap: 8px; min-block-size: 44px; padding: 0 12px; border: 0; border-radius: 22px; background: var(--comment-fill); color: var(--muted); text-align: left; cursor: pointer; }
    .dock-capsule .icon { inline-size: 16px; block-size: 16px; }
    .comment-jump { display: flex; align-items: center; justify-content: center; gap: 4px; min-inline-size: 44px; min-block-size: 44px; padding: 0 5px; color: var(--copy); font-size: 12px; text-decoration: none; }
    .comments { margin-block-start: 16px; padding: 12px 24px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); scroll-margin-block-start: 12px; }
    .comments h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 650; }
    .comments h2 span { margin-inline-start: 4px; color: var(--muted); font-size: 14px; font-weight: 400; }
    .comment-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: start; column-gap: 12px; padding-block-start: 12px; }
    .comment-row::after { content: ''; grid-column: 2 / -1; border-block-end: 1px solid var(--line); }
    .avatar { display: grid; inline-size: 32px; block-size: 32px; place-items: center; border-radius: 50%; background: var(--comment-fill); color: var(--copy); font-size: 13px; }
    .comment-copy { min-inline-size: 0; }
    .comment-author { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
    .comment-parent { display: inline-block; margin: 4px 0 0; padding: 3px 8px; border-radius: 8px; background: var(--comment-fill); color: var(--muted); font-size: 12px; }
    .comment-text { margin: 4px 0 0; font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; white-space: pre-wrap; }
    .comment-picture { display: block; inline-size: 88px; block-size: 88px; margin-block: 8px; border-radius: 8px; object-fit: cover; }
    .comment-meta { display: flex; align-items: center; gap: 12px; min-block-size: 36px; color: var(--muted); font-size: 12px; }
    .text-button { min-block-size: 36px; padding: 0 4px; border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
    .text-button:hover { color: var(--ink); }
    .comment-like { display: grid; place-items: center; align-content: center; gap: 1px; inline-size: 40px; min-block-size: 44px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
    .comment-like[aria-pressed='true'] { color: var(--comment-brand); }
    .comment-like[aria-pressed='true'] .icon { fill: currentColor; }

    html:has(.comment-sheet[open]) { overflow: hidden; }
    .comment-sheet { inline-size: min(560px, calc(100vw - 32px)); max-block-size: min(640px, calc(100dvh - 40px)); padding: 4px 16px 6px; overflow: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px -16px #0006; }
    .comment-sheet::backdrop { background: #0006; }
    .composer-head { display: flex; align-items: center; gap: 4px; margin-inline-end: -6px; }
    .composer-head h2 { margin: 0 auto 0 0; overflow: hidden; font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .composer-head .text-button { flex: none; font-size: 12px; }
    .comment-field { display: block; inline-size: 100%; max-block-size: 30dvh; padding: 10px 12px; border: 1px solid transparent; border-radius: 8px; resize: none; background: var(--comment-fill); color: var(--ink); font: inherit; font-size: 16px; line-height: 1.45; }
    .comment-field::placeholder { color: var(--muted); }
    .comment-field:focus-visible { outline-offset: -2px; }
    .composer-tools { display: flex; align-items: center; gap: 2px; min-block-size: 54px; margin-inline-start: -6px; }
    .tool { display: grid; flex: none; place-items: center; inline-size: 44px; block-size: 44px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: var(--copy); cursor: pointer; }
    .tool:hover, .tool[aria-expanded='true'] { background: var(--comment-fill); }
    .publish { min-inline-size: 68px; min-block-size: 44px; margin-inline-start: auto; padding: 0 16px; border: 0; border-radius: 22px; background: color-mix(in srgb, var(--comment-brand) 13%, var(--surface)); color: var(--comment-brand); font-size: 14px; font-weight: 650; cursor: pointer; }
    .publish:disabled { background: var(--comment-fill); color: var(--muted); cursor: default; }
    .emoji-panel { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; border-block-start: 1px solid var(--line); }
    .image-draft { position: relative; inline-size: max-content; margin-block-start: 8px; }
    .image-draft img { display: block; inline-size: 64px; block-size: 64px; border-radius: 8px; object-fit: cover; }
    .image-draft .tool { position: absolute; inset: 0 0 auto auto; color: white; background: #0008; }

    @container work-preview (max-width: 690px) {
      .back { min-block-size: 48px; }
      .work { grid-template-columns: minmax(0, 1fr); }
      .work-copy { padding: 16px; }
      .work-type { margin-block-end: 4px; }
      h1 { font-size: 22px; line-height: 30px; }
      .description { margin-block-start: 8px; font-size: 15px; line-height: 22px; }
      .credits { margin-block-start: 16px; padding-block-start: 12px; }
      .launch { margin-block-start: 16px; }
      .launch-link { inline-size: 100%; }
      .input-hint { text-align: center; }
      .mouse-hint { display: none; }
      .touch-hint { display: inline; }
    }

    @container work-preview (max-width: 767px) {
      .detail-page { padding-block-end: calc(68px + env(safe-area-inset-bottom)); }
      .comment-dock { position: fixed; inset: auto auto 0 50%; z-index: 2; inline-size: 100cqi; min-block-size: 56px; margin: 0; padding: 5px 8px calc(6px + env(safe-area-inset-bottom)) 12px; translate: -50% 0; border: 0; border-block-start: 1px solid var(--line); border-radius: 0; }
      .comments { padding-inline: 16px; border: 0; border-block-start: 1px solid var(--line); border-radius: 0; }
      .comment-sheet { inset: auto auto 0 50%; inline-size: 100cqi; max-inline-size: none; margin: 0; padding-block-end: calc(6px + env(safe-area-inset-bottom)); translate: -50% 0; border: 0; border-radius: 16px 16px 0 0; }
    }

    @media (pointer: coarse) { .device-switch button, .text-button { min-block-size: 44px; } }
  </style>
</head>
<body>
  <svg class="sr-only" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-message" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l1.6-4.3A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="icon-smile" viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z M8 14a4 4 0 0 0 8 0M8 9h.01M16 9h.01"/></symbol>
    <symbol id="icon-image" viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M9 10a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z M21 16l-5-5-9 9"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <aside class="preview-tools" aria-label="设计预览工具">
    <span class="preview-name">创意作品详情预览</span>
    <div class="device-switch" role="group" aria-label="预览宽度">
      <button type="button" data-device-choice="desktop" aria-pressed="true">电脑</button>
      <button type="button" data-device-choice="mobile" aria-pressed="false">手机</button>
    </div>
  </aside>

  <div class="preview-screen" id="work-preview" data-device="desktop">
    <main class="detail-page">
      <a class="back" href="index.html">创意</a>
      <article class="work" aria-labelledby="work-title">
        <img class="work-image" src="images/plush-rabbit.webp" alt="奶白色垂耳兔坐在浅米色背景前，内耳和蝴蝶结上印着碎花" width="960" height="960">
        <div class="work-copy">
          <p class="work-type">3D 模型</p>
          <h1 id="work-title">碎花垂耳兔</h1>
          <p class="description">奶白色的垂耳兔，内耳和头顶的蝴蝶结用了同样的碎花布。打开模型转一圈，可以近看耳朵的弧度和绒毛的纹理。</p>
          <dl class="credits">
            <div><dt>作者</dt><dd>RealWorldBuilder</dd></div>
            <div><dt>来源</dt><dd><a href="https://chat.xiangban.xyz/ideas?tab=gallery">微观展厅</a></dd></div>
          </dl>
          <div class="launch">
            <a class="launch-link" href="https://chat.xiangban.xyz/create/run/ideas/plush-rabbit" aria-describedby="controls">体验 3D 模型 <span aria-hidden="true">→</span></a>
            <p class="input-hint" id="controls">
              <span class="mouse-hint">拖动旋转，滚轮缩放</span><span class="touch-hint">拖动旋转，双指缩放</span>
            </p>
          </div>
        </div>
      </article>
      <div class="comment-dock" role="group" aria-label="评论与互动">
        <button class="dock-capsule" type="button" id="open-comment" aria-haspopup="dialog">
          <svg class="icon" aria-hidden="true"><use href="#icon-message"/></svg>写评论…
        </button>
        <a class="comment-jump" id="comment-jump" href="#comments">
          <svg class="icon" aria-hidden="true"><use href="#icon-message"/></svg><span id="dock-count">2</span>
        </a>
      </div>
      <section class="comments" id="comments" aria-labelledby="comments-title">
        <h2 id="comments-title">评论 <span id="comment-count">2</span></h2>
        <div id="comment-list"></div>
        <p class="sr-only" id="comment-status" role="status"></p>
      </section>
      <dialog class="comment-sheet" id="comment-sheet" aria-labelledby="composer-title">
        <header class="composer-head">
          <h2 id="composer-title">写评论</h2>
          <button class="text-button" type="button" id="cancel-reply" hidden>取消回复</button>
          <button class="tool" type="button" id="expand-editor" aria-label="展开编辑区" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-expand"/></svg></button>
          <button class="tool" type="button" id="close-editor" aria-label="关闭评论编辑"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
        </header>
        <form id="comment-form">
          <textarea class="comment-field" id="comment-field" rows="2" maxlength="2000" aria-label="评论内容" placeholder="说点什么…"></textarea>
          <div class="image-draft" id="image-draft" hidden>
            <img alt="待发布的评论图片">
            <button class="tool" type="button" id="remove-image" aria-label="移除图片"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
          </div>
          <div class="composer-tools">
            <button class="tool" type="button" id="emoji-tool" aria-label="打开表情" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#icon-smile"/></svg></button>
            <button class="tool" type="button" id="image-tool" aria-label="打开相册"><svg class="icon" aria-hidden="true"><use href="#icon-image"/></svg></button>
            <input type="file" id="comment-image" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <button class="publish" id="publish-comment" type="submit" disabled>发布</button>
          </div>
          <div class="emoji-panel" id="emoji-panel" aria-label="常用表情" hidden>
            <button class="tool" type="button" aria-label="微笑">😊</button>
            <button class="tool" type="button" aria-label="点赞">👍</button>
            <button class="tool" type="button" aria-label="爱心">❤️</button>
            <button class="tool" type="button" aria-label="看看">👀</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <template id="comment-template">
    <article class="comment-row">
      <span class="avatar" aria-hidden="true"></span>
      <div class="comment-copy">
        <p class="comment-author"></p>
        <p class="comment-parent" hidden></p>
        <p class="comment-text"></p>
        <img class="comment-picture" alt="评论配图" hidden>
        <div class="comment-meta"><span class="comment-time"></span><button class="text-button" type="button" data-reply>回复</button></div>
      </div>
      <button class="comment-like" type="button" aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#icon-heart"/></svg><span></span>
      </button>
    </article>
  </template>

  <script>
    const previewScreen = document.getElementById('work-preview');
    const deviceChoices = document.querySelectorAll('[data-device-choice]');

    function showDevice(device) {
      previewScreen.dataset.device = device;
      for (const choice of deviceChoices) {
        choice.setAttribute('aria-pressed', String(choice.dataset.deviceChoice === device));
      }
    }

    showDevice(new URLSearchParams(location.search).get('view') === 'mobile' ? 'mobile' : 'desktop');

    for (const choice of deviceChoices) {
      choice.addEventListener('click', () => {
        const device = choice.dataset.deviceChoice;
        showDevice(device);
        const url = new URL(location.href);
        if (device === 'mobile') url.searchParams.set('view', device);
        else url.searchParams.delete('view');
        history.replaceState(null, '', url);
      });
    }

    const commentList = document.getElementById('comment-list');
    const commentTemplate = document.getElementById('comment-template');
    const commentSheet = document.getElementById('comment-sheet');
    const composerTitle = document.getElementById('composer-title');
    const cancelReply = document.getElementById('cancel-reply');
    const form = document.getElementById('comment-form');
    const field = document.getElementById('comment-field');
    const publish = document.getElementById('publish-comment');
    const emojiTool = document.getElementById('emoji-tool');
    const emojiPanel = document.getElementById('emoji-panel');
    const imagePicker = document.getElementById('comment-image');
    const imageDraft = document.getElementById('image-draft');
    const previewImage = imageDraft.querySelector('img');
    let replyTo = '';
    let imageUrl = '';

    function setLike(button, count, liked) {
      button.dataset.count = String(count);
      button.setAttribute('aria-pressed', String(liked));
      button.setAttribute('aria-label', (liked ? '取消赞' : '赞') + '这条评论，' + count + ' 个赞');
      button.querySelector('span').textContent = count || '';
    }

    function commentRow({ name, body, time, likes = 0, parent = '', image = '' }) {
      const row = commentTemplate.content.firstElementChild.cloneNode(true);
      row.querySelector('.avatar').textContent = name[0];
      row.querySelector('.comment-author').textContent = name;
      row.querySelector('.comment-time').textContent = time;
      const text = row.querySelector('.comment-text');
      text.textContent = body;
      text.hidden = !body;
      const reference = row.querySelector('.comment-parent');
      reference.hidden = !parent;
      reference.textContent = parent ? '回复 ' + parent : '';
      const picture = row.querySelector('.comment-picture');
      if (image) {
        picture.src = image;
        picture.hidden = false;
      }
      setLike(row.querySelector('.comment-like'), likes, false);
      return row;
    }

    function updateCount() {
      const count = commentList.children.length;
      document.getElementById('comment-count').textContent = count;
      document.getElementById('dock-count').textContent = count;
      document.getElementById('comment-jump').setAttribute('aria-label', '查看评论，共 ' + count + ' 条');
    }

    commentList.append(
      commentRow({ name: '竹影', body: '放大才看清耳朵里的碎花，和蝴蝶结是同一个花样。', time: '2 小时前', likes: 3 }),
      commentRow({ name: '阿遥', body: '转到侧面看，垂下来的两只耳朵很有分量。', time: '昨天', likes: 1 }),
    );
    updateCount();

    function setReply(name) {
      replyTo = name;
      composerTitle.textContent = name ? '回复 ' + name : '写评论';
      cancelReply.hidden = !name;
    }

    function openComposer(name = '') {
      setReply(name);
      commentSheet.showModal();
      field.focus();
    }

    function updateDraft() {
      publish.disabled = !field.value.trim() && !imageUrl;
      imageDraft.hidden = !imageUrl;
      if (imageUrl) previewImage.src = imageUrl;
      else previewImage.removeAttribute('src');
    }

    document.getElementById('open-comment').addEventListener('click', () => openComposer());
    document.getElementById('close-editor').addEventListener('click', () => commentSheet.close());
    cancelReply.addEventListener('click', () => setReply(''));
    field.addEventListener('input', updateDraft);
    document.getElementById('expand-editor').addEventListener('click', (event) => {
      const button = event.currentTarget;
      const expanded = button.getAttribute('aria-pressed') !== 'true';
      field.rows = expanded ? 7 : 2;
      button.setAttribute('aria-pressed', String(expanded));
      button.setAttribute('aria-label', expanded ? '收起编辑区' : '展开编辑区');
    });

    commentList.addEventListener('click', (event) => {
      const row = event.target.closest('.comment-row');
      if (!row) return;
      if (event.target.closest('[data-reply]')) {
        openComposer(row.querySelector('.comment-author').textContent);
      }
      const like = event.target.closest('.comment-like');
      if (like) {
        const liked = like.getAttribute('aria-pressed') === 'true';
        setLike(like, Number(like.dataset.count) + (liked ? -1 : 1), !liked);
      }
    });

    emojiTool.addEventListener('click', () => {
      emojiPanel.hidden = !emojiPanel.hidden;
      emojiTool.setAttribute('aria-expanded', String(!emojiPanel.hidden));
    });
    emojiPanel.addEventListener('click', (event) => {
      const emoji = event.target.closest('button');
      if (!emoji) return;
      field.setRangeText(emoji.textContent, field.selectionStart, field.selectionEnd, 'end');
      updateDraft();
    });

    document.getElementById('image-tool').addEventListener('click', () => imagePicker.click());
    imagePicker.addEventListener('change', () => {
      if (!imagePicker.files[0]) return;
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      imageUrl = URL.createObjectURL(imagePicker.files[0]);
      updateDraft();
    });
    document.getElementById('remove-image').addEventListener('click', () => {
      URL.revokeObjectURL(imageUrl);
      imageUrl = '';
      imagePicker.value = '';
      updateDraft();
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const body = field.value.trim();
      if (!body && !imageUrl) return;
      commentList.prepend(commentRow({ name: '我', body, time: '刚刚', parent: replyTo, image: imageUrl }));
      document.getElementById('comment-status').textContent = replyTo ? '已添加预览回复' : '已添加预览评论';
      setReply('');
      imageUrl = '';
      form.reset();
      updateDraft();
      updateCount();
      commentSheet.close();
      document.getElementById('comments').scrollIntoView({ block: 'start' });
    });
  </script>
</body>
</html>
