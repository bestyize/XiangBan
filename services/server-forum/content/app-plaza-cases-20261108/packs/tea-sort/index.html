<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>茶签归位</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="eyebrow">一瞬流光 · 茶席小谜</span><h1>茶签归位</h1></div><button id="levelsButton">选关</button></header><section id="levels"><p class="intro">一席清茶，二十道小谜。<br>点一罐，再点另一罐，将同种茶签归在一起。</p><div class="legend">每罐四签 · 右侧为顶 · 红印为已通关</div><div id="levelGrid" class="level-grid"></div></section><section id="play" hidden><div class="line"><div><span class="eyebrow">此席</span><h2 id="levelTitle"></h2></div><span id="steps">0 步</span></div><p class="instruction">先选一罐，再选目标罐；只能放在空罐或同名茶签上，右侧是顶部。</p><div id="jars" class="jars" aria-label="茶罐"></div><p id="notice" class="notice" role="status">选一只茶罐开始</p><div class="actions"><button id="undo">撤销</button><button id="reset">重开本关</button><button id="back">返回选关</button></div><p class="foot">方向键选罐，回车确认 · 每次移动顶部连续同名茶签</p></section><div id="win" class="overlay" hidden><div class="card"><div class="stamp">茶<br>成</div><h2>此席已成</h2><p id="winText"></p><button id="next" class="primary">下一席</button><button id="winBack">返回选关</button></div></div></main><script src="levels.js"></script><script src="game.js"></script></body></html>
