<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>墨渡</title><link rel="stylesheet" href="style.css"><script src="host.js"></script></head><body><main><header><div><span class="eyebrow">一瞬流光 · 水上小景</span><h1>墨渡</h1></div><div class="tools"><button id="sound" aria-label="切换声音">声音 开</button><button id="pause">暂停</button></div></header><div class="stats"><div>此行 <strong id="score">0</strong></div><div>连中 <strong id="combo">0</strong></div><div>风向 <strong id="wind">—</strong></div><div class="seal">墨<br>渡</div></div><div class="scene"><canvas id="board" aria-label="墨渡江面，按住蓄力，松开跳跃"></canvas><div id="overlay" class="overlay"><div class="card"><span id="sub" class="eyebrow">一叶舟 · 一段路</span><h2 id="title">墨渡</h2><p id="message">按住江面蓄力，松手跃向下一处。<br>留意风向，落点越正，连击越高。</p><button id="action" class="primary">开始渡江</button></div></div></div><div class="hint"><span id="hint">按住江面 / 空格蓄力</span><span>最高 <b id="best">0</b></span></div><div class="gauge"><div id="fill"></div><i id="mark"></i></div><p class="foot">红线是目标距离 · 风会轻推小舟</p></main><script src="game.js"></script></body></html>
