<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨道工作室</title><style>:root{--bg:#121627;--ink:#e6d4ab;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{position:absolute;inset:0;overflow:hidden;isolation:isolate}.caption{position:absolute;left:6vw;bottom:7vh;z-index:10;font-size:clamp(11px,1.3vw,18px);letter-spacing:.35em;opacity:.56}.caption small{display:block;margin-top:10px;font-size:.65em;letter-spacing:.18em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.sun{position:absolute;left:50%;top:50%;width:13vmin;height:13vmin;margin:-6.5vmin;background:#e6c77b;border-radius:50%;box-shadow:0 0 10vmin #e6c77b33}.orbit{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border:1px solid #adbbce33;border-radius:50%;animation:orbit var(--t) linear infinite}.orbit:after{content:"";position:absolute;left:50%;top:-.6vmin;width:1.2vmin;height:1.2vmin;border-radius:50%;background:var(--c);box-shadow:0 0 2vmin var(--c)}@keyframes orbit{to{transform:rotate(360deg)}}</style><main aria-label="轨道工作室"><div class="sun"></div><div class="orbit" style="--s:34vmin;--t:32s;--c:#8dd9d2"></div><div class="orbit" style="--s:57vmin;--t:55s;--c:#b5a6db"></div><div class="orbit" style="--s:80vmin;--t:87s;--c:#e6bf81"></div><div class="caption">ORBITAL STUDIO<small>每条轨道，都有自己的周期</small></div></main></html>
