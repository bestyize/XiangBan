<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐绸带</title><style>:root{--bg:#0b2030;--ink:#d2ebed;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{position:absolute;inset:0;overflow:hidden;isolation:isolate}.caption{position:absolute;left:6vw;bottom:7vh;z-index:10;font-size:clamp(11px,1.3vw,18px);letter-spacing:.35em;opacity:.56}.caption small{display:block;margin-top:10px;font-size:.65em;letter-spacing:.18em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.ribbon{position:absolute;width:140vw;height:38vh;left:-20vw;top:30vh;border-radius:50%;filter:blur(28px);background:linear-gradient(90deg,transparent,#1f6872,#4e9da0,#315c8b,transparent);opacity:.55;animation:tide 18s ease-in-out infinite alternate}.ribbon:nth-child(2){top:48vh;opacity:.25;animation-delay:-7s;transform:rotate(-14deg)}.ribbon:nth-child(3){top:12vh;opacity:.18;animation-delay:-12s;background:linear-gradient(90deg,transparent,#8e7ab0,#547789,transparent)}@keyframes tide{from{transform:translateY(-7vh) rotate(-13deg) scaleY(.6)}to{transform:translateY(9vh) rotate(9deg) scaleY(1.3)}}</style><main aria-label="潮汐绸带"><div class="ribbon"></div><div class="ribbon"></div><div class="ribbon"></div><div class="caption">TIDAL SILK<small>潮来潮往，保持自己的节奏</small></div></main></html>
