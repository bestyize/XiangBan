<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专注边界门牌</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"PingFang SC",sans-serif;color:#263f3c}main{height:100%;padding:20px;border:1px solid #c7d7ce;border-radius:22px;background:#f5f2e8;display:flex;flex-direction:column;gap:10px}h1{font-size:20px;margin:0}p{font-size:13px;line-height:1.6;margin:0;color:#64776e}label,summary{cursor:pointer}button,input{font:inherit}.small{font-size:11px;color:#7e877c}.bottom{margin-top:auto}input[type=checkbox],input[type=radio]{accent-color:#487d69}input:focus-visible,summary:focus-visible{outline:2px solid #528976;outline-offset:3px}input[type=radio]{position:absolute;opacity:0}.tabs{display:flex;gap:6px}.tabs label{padding:6px 9px;font-size:12px;background:#e0e6d9;border-radius:12px}.state{display:none;font-size:32px;letter-spacing:.1em;margin:auto 0}#focus:checked~.sf,#open:checked~.so,#away:checked~.sa{display:block}#focus:checked~.tabs label[for=focus],#open:checked~.tabs label[for=open],#away:checked~.tabs label[for=away]{background:#487d69;color:#fff}</style><main><h1>我的此刻</h1><input id="focus" type="radio" name="state" checked><input id="open" type="radio" name="state"><input id="away" type="radio" name="state"><div class="tabs"><label for="focus">专注</label><label for="open">可打扰</label><label for="away">暂时离开</label></div><div class="state sf">安静推进中</div><div class="state so">可以聊两句</div><div class="state sa">稍后回来</div><p class="bottom small">仅此卡展示；不会静音系统或同步在线状态。</p></main></html>
