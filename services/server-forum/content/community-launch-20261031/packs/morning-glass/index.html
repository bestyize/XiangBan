<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晨光玻璃</title><style>:root{--bg:#eee4d3;--ink:#685d50;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{position:absolute;inset:0;overflow:hidden;isolation:isolate}.caption{position:absolute;left:6vw;bottom:7vh;z-index:10;font-size:clamp(11px,1.3vw,18px);letter-spacing:.35em;opacity:.56}.caption small{display:block;margin-top:10px;font-size:.65em;letter-spacing:.18em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.light{position:absolute;inset:-30%;background:conic-gradient(from 40deg at 50% 30%,#f6d9a7,transparent 30%,#d8e2d2 45%,transparent 60%,#f6d9a7);filter:blur(24px);animation:morning 28s ease-in-out infinite alternate}.pane{position:absolute;top:15vh;width:23vw;height:65vh;border:1px solid #fff9;background:linear-gradient(120deg,#fff4,transparent);border-radius:50vw 50vw 4px 4px;box-shadow:2vw 2vw 8vw #887d6510}.pane:nth-of-type(2){left:12vw}.pane:nth-of-type(3){left:38.5vw;top:10vh}.pane:nth-of-type(4){left:65vw;top:20vh}@keyframes morning{to{transform:translate(5vw,3vh) rotate(18deg)}}</style><main aria-label="晨光玻璃"><div class="light"></div><div class="pane"></div><div class="pane"></div><div class="pane"></div><div class="caption">MORNING GLASS<small>让柔和的光慢慢进来</small></div></main></html>
