<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工位收尾折页</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"PingFang SC",sans-serif;color:#263f3c}main{height:100%;padding:20px;border:1px solid #c7d7ce;border-radius:22px;background:#f5f2e8;display:flex;flex-direction:column;gap:10px}h1{font-size:20px;margin:0}p{font-size:13px;line-height:1.6;margin:0;color:#64776e}label,summary{cursor:pointer}button,input{font:inherit}.small{font-size:11px;color:#7e877c}.bottom{margin-top:auto}input[type=checkbox],input[type=radio]{accent-color:#487d69}input:focus-visible,summary:focus-visible{outline:2px solid #528976;outline-offset:3px}details{border-bottom:1px solid #d8dfd0;padding:8px 0}summary{font-size:15px}details p{padding:8px 0 0 15px;font-size:12px}</style><main><h1>离开前，轻轻收尾</h1><details open><summary>保存进度</summary><p>保存当前文件，写一句“下次从这里继续”。</p></details><details><summary>留下下一步</summary><p>只写一个可开始的动作，别把整份待办搬过来。</p></details><details><summary>收好桌面</summary><p>带走随身物品，按场所需要检查设备并锁屏。</p></details><p class="bottom small">本卡不会检测设备，也不会替你执行操作。</p></main></html>
