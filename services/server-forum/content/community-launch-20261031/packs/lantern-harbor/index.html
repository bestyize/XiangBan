<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯影港湾</title><style>:root{--bg:#101f34;--ink:#e8d3a2;}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}main{position:absolute;inset:0;overflow:hidden;isolation:isolate}.caption{position:absolute;left:6vw;bottom:7vh;z-index:10;font-size:clamp(11px,1.3vw,18px);letter-spacing:.35em;opacity:.56}.caption small{display:block;margin-top:10px;font-size:.65em;letter-spacing:.18em}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.water{position:absolute;top:55%;inset-inline:0;height:45%;background:linear-gradient(#1e3b51,#0d1c30)}.moon{position:absolute;top:17%;right:23%;width:9vmin;height:9vmin;border-radius:50%;background:#e2d2a5;box-shadow:0 0 8vmin #e2d2a522}.house{position:absolute;bottom:45%;left:var(--x);width:7vw;height:var(--h);background:#132a40;border:1px solid #73919e22}.house:after{content:"";position:absolute;left:35%;top:25%;width:25%;height:23%;background:#dab87b;box-shadow:0 1.5vw 0 #dab87b77}.reflection{position:absolute;top:60%;left:var(--x);width:7vw;height:23vh;opacity:.3;background:repeating-linear-gradient(transparent 0 7px,#cfa96b 8px 10px,transparent 11px 17px);clip-path:polygon(35% 0,70% 0,100% 100%,0 100%);animation:water 5s ease-in-out infinite alternate}@keyframes water{to{transform:scaleX(.65) translateY(1vh);opacity:.18}}</style><main aria-label="灯影港湾"><div class="moon"></div><div class="water"></div><div class="house" style="--x:20vw;--h:11vh"></div><div class="reflection" style="--x:20vw;animation-delay:-0s"></div><div class="house" style="--x:31vw;--h:17vh"></div><div class="reflection" style="--x:31vw;animation-delay:-1s"></div><div class="house" style="--x:43vw;--h:12vh"></div><div class="reflection" style="--x:43vw;animation-delay:-2s"></div><div class="house" style="--x:54vw;--h:21vh"></div><div class="reflection" style="--x:54vw;animation-delay:-3s"></div><div class="house" style="--x:65vw;--h:14vh"></div><div class="reflection" style="--x:65vw;animation-delay:-4s"></div><div class="caption">LANTERN HARBOR<small>晚一些，也可以慢一些</small></div></main></html>
