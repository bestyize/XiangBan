<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择罗盘</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"PingFang SC",sans-serif;color:#263f3c}main{height:100%;padding:20px;border:1px solid #c7d7ce;border-radius:22px;background:#f5f2e8;display:flex;flex-direction:column;gap:10px}h1{font-size:20px;margin:0}p{font-size:13px;line-height:1.6;margin:0;color:#64776e}label,summary{cursor:pointer}button,input{font:inherit}.small{font-size:11px;color:#7e877c}.bottom{margin-top:auto}input[type=checkbox],input[type=radio]{accent-color:#487d69}input:focus-visible,summary:focus-visible{outline:2px solid #528976;outline-offset:3px}input[type=radio]{position:absolute;opacity:0}.tabs{display:flex;gap:7px}.tabs label{padding:7px 10px;border-radius:14px;background:#e3e7d9;font-size:12px}.tip{display:none;padding:14px 0;font-size:18px;line-height:1.7}#a:checked~.tabs label[for=a],#b:checked~.tabs label[for=b],#c:checked~.tabs label[for=c]{background:#487d69;color:#fff}#a:checked~.ta,#b:checked~.tb,#c:checked~.tc{display:block}</style><main><h1>把选择变小一点</h1><input id="a" type="radio" name="q" checked><input id="b" type="radio" name="q"><input id="c" type="radio" name="q"><div class="tabs"><label for="a">不知选什么</label><label for="b">不敢开始</label><label for="c">需要取舍</label></div><div class="tip ta">哪一个选择，最贴近你眼下真正想解决的问题？</div><div class="tip tb">如果只试两分钟，你能开始哪一步？</div><div class="tip tc">什么可以稍后再做，甚至不做？</div><p class="bottom small">点击标签换一个问题 · 不保存选择</p></main></html>
