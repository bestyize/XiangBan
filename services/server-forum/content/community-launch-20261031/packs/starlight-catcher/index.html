<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>接住星光</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>接住星光</h1><button id="restart" type="button">新一局</button></header><p>点击“开始”后，左右拖动或用方向键移动接盘。接住金色圆点加1分，紫色碎片或漏掉星光减1颗心，收集15颗获胜。</p><div id="status" class="status" role="status" aria-live="polite"></div><div class="toolbar"><button id="start">开始</button><button id="pause">暂停</button></div><canvas id="board" width="360" height="420" aria-label="接星光游戏画布"></canvas><div class="toolbar"><button id="left" aria-label="向左移动">← 按住向左</button><button id="right" aria-label="向右移动">按住向右 →</button></div><small>完全离线 · 不保存个人数据 · 关闭后本局进度不保留</small></main><script src="game.js"></script></body></html>
