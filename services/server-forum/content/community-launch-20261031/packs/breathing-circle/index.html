<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呼吸留白卡</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"PingFang SC",sans-serif;color:#263f3c}main{height:100%;padding:20px;border:1px solid #c7d7ce;border-radius:22px;background:#f5f2e8;display:flex;flex-direction:column;gap:10px}h1{font-size:20px;margin:0}p{font-size:13px;line-height:1.6;margin:0;color:#64776e}label,summary{cursor:pointer}button,input{font:inherit}.small{font-size:11px;color:#7e877c}.bottom{margin-top:auto}input[type=checkbox],input[type=radio]{accent-color:#487d69}input:focus-visible,summary:focus-visible{outline:2px solid #528976;outline-offset:3px}#pause{position:absolute;left:24px;top:65px}.pause{font-size:12px;padding-left:24px}.circle{margin:auto;width:125px;height:125px;display:grid;place-items:center;border-radius:50%;background:#b7d6c3;box-shadow:0 0 0 13px #dfebdf;animation:breathe 8s ease-in-out infinite}.circle span{font-size:14px;letter-spacing:.2em}@keyframes breathe{50%{transform:scale(1.18);background:#d1dfc3}}#pause:checked~.circle{animation-play-state:paused}</style><main><h1>留一点空白</h1><input id="pause" type="checkbox"><label class="pause" for="pause">暂停动画</label><div class="circle"><span>慢慢来</span></div><p class="bottom">跟随自己的舒适节奏，不需要追赶圆环。</p></main></html>
