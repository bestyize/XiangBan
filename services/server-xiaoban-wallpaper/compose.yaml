services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xiaoban_wallpaper
      POSTGRES_USER: xiaoban_wallpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U xiaoban_wallpaper -d xiaoban_wallpaper"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  application:
    build: .
    environment:
      DATABASE_URL: postgresql://xiaoban_wallpaper:${POSTGRES_PASSWORD}@database:5432/xiaoban_wallpaper
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:55006}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
    ports:
      - "127.0.0.1:${PORT:-55006}:55006"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  metadata:
