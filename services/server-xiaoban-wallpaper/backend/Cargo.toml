[package]
name = "xiaoban-wallpaper-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid", "json", "migrate", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "stream"] }
futures-util = "0.3"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
