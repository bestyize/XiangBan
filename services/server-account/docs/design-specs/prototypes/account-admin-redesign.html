function render() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const sw = document.getElementById('stageWrap');
  sw.classList.remove('mode-tablet', 'mode-mobile');
  if (state.vp === 'tablet') sw.classList.add('mode-tablet');
  if (state.vp === 'mobile') sw.classList.add('mode-mobile');

  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('active', b.dataset.view === state.view));
  document.querySelectorAll('#pageSeg button').forEach(b => b.classList.toggle('active', b.dataset.page === state.page));
  document.querySelectorAll('#vpSeg button').forEach(b => b.classList.toggle('active', b.dataset.vp === state.vp));
  document.querySelectorAll('#themeSeg button').forEach(b => b.classList.toggle('active', b.dataset.theme === state.theme));

  const root = document.getElementById('appRoot');
  if (state.view === 'login') {
    root.innerHTML = renderLogin();
    return;
  }

  const pageHtml = {
    dashboard: renderDashboard,
    users: renderUsers,
    clients: renderClients,
    sender: renderSender,
    audit: renderAudit,
  }[state.page]();

  const nav = [
    { key: 'dashboard', label: '概览', g: '工作台' },
    { key: 'users', label: '用户管理', g: '工作台' },
    { key: 'clients', label: '接入应用', g: '工作台' },
    { key: 'sender', label: '发信与注册', g: '系统与安全' },
    { key: 'audit', label: '操作日志', g: '系统与安全' },
  ];

  root.innerHTML = `
    <div class="shell">
      <header class="mobile-bar">
        <div style="display:flex;align-items:center;gap:8px;">${BRAND_SVG}<strong>${nav.find(n => n.key === state.page).label}</strong></div>
        <div style="display:flex;gap:4px;">${nav.map(n => `<button class="btn ghost sm" style="${state.page === n.key ? 'color:var(--coral);font-weight:700' : ''}" onclick="go('${n.key}')">${n.label.slice(0,2)}</button>`).join('')}</div>
      </header>
      <aside class="sidebar">
        <div class="sb-brand">${BRAND_SVG}<div><strong>相伴账号中心</strong><span>统一身份与安全控制台</span></div></div>
        <button class="cmd-trigger"><span>快速跳转或查用户…</span><kbd>⌘K</kbd></button>
        ${['工作台', '系统与安全'].map(g => `
          <div class="nav-group">
            <div class="nav-group-label">${g}</div>
            ${nav.filter(n => n.g === g).map(n => `<button class="nav-item ${state.page === n.key ? 'active' : ''}" onclick="go('${n.key}')"><i class="ico-dot"></i><span>${n.label}</span></button>`).join('')}
          </div>`).join('')}
        <div class="sb-foot">
          <button class="status-pill" onclick="go('sender')"><i class="status-dot"></i><span>SMTP + 阿里云短信</span></button>
          <div class="me-row"><span class="me-av">A</span><div style="flex:1"><strong style="font-size:12.5px">admin</strong><div class="faint" style="font-size:11px">管理员</div></div></div>
        </div>
      </aside>
      <main class="main-col"><div class="main-inner">${pageHtml}</div></main>
      ${renderDrawer()}
      ${renderCreateModal()}
    </div>`;
}

document.querySelectorAll('#viewSeg button').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
document.querySelectorAll('#pageSeg button').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
document.querySelectorAll('#vpSeg button').forEach(b => b.addEventListener('click', () => { state.vp = b.dataset.vp; render(); }));
document.querySelectorAll('#themeSeg button').forEach(b => b.addEventListener('click', () => { state.theme = b.dataset.theme; render(); }));
document.getElementById('btnHideBar').addEventListener('click', () => { document.getElementById('reviewBar').classList.add('collapsed'); document.getElementById('stageWrap').classList.add('bar-hidden'); });
document.getElementById('btnShowBar').addEventListener('click', () => { document.getElementById('reviewBar').classList.remove('collapsed'); document.getElementById('stageWrap').classList.remove('bar-hidden'); });

const qs = new URLSearchParams(location.search);
if (qs.get('view') === 'login') state.view = 'login';
if (['dashboard', 'users', 'clients', 'sender', 'audit'].includes(qs.get('page'))) state.page = qs.get('page');
if (qs.get('theme') === 'dark') state.theme = 'dark';
if (qs.get('drawer') === 'user') { state.page = 'users'; state.drawerUser = USERS[0].uid; }
render();
</script>
</body>
</html>
