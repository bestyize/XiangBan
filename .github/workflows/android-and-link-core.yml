name: Android and Link Core

# Compiles what the cloud sandbox cannot: the Kotlin Multiplatform Android app (Compose UI, Android Keystore storage)
# and runs the JVM tests of community-core and link-core (shared test vectors with libs/link-protocol). The debug APK
# is uploaded as an artifact so it can be installed on a phone for the real-device pairing test.
# Manual only, as every workflow in this repository (see CLAUDE.md): run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-and-link-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build and Kotlin tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client/xiaoban-multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner ships an Android SDK; accepting its licences lets the Android Gradle plugin download the compile SDK it needs.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$sdkmanager" --licenses > /dev/null || true
          echo "Using $sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM tests (community-core, link-core)
        run: ./gradlew :common:community-core:jvmTest :common:link-core:jvmTest --no-configuration-cache
      - name: Build the Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: client/xiaoban-multiplatform/common/*/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoban-android-debug-apk
          path: client/xiaoban-multiplatform/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
