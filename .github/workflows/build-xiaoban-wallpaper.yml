name: BuildXiaoBanWallpaper

# 小伴全家桶的打包入口，只能手动运行（Actions 页选 “BuildXiaoBanWallpaper” → Run workflow，或用 gh / API 的 workflow_dispatch 触发）。
#
# 一、客户端安装包 → GitHub Release xiaoban-wallpaper-v<桌面版本>（不存在就创建，重跑会替换同名文件）
#   windows  Windows x64 一键安装版（NSIS）
#   macos    macOS aarch64 dmg（固定自签名证书，未公证）
#   android  小伴手机 App（Compose）的 Android APK；配了 XIAOBAN_ANDROID_KEYSTORE_* 密钥就是发布签名的包，
#            没配就打可安装的 debug 包（release 包不签名装不上）
#
# 二、服务端镜像 → 单独的 GitHub Release server-<UTC 时间>-<提交前 7 位>（每次运行一个，只保留最近 5 个）
#   servers  要打包的服务编号，逗号分隔，或 all；留空不打包。编号见 infra/images/services.json：
#            account、ai、forum、link、market、resource、wallpaper-collect
#   每个服务产出 <镜像>-<标签>.tar.gz（docker load 用）和 <镜像>-<标签>-bundle.tar.gz（二进制 + 前端，非 Docker 主机用），
#   外加 SHA256SUMS 和 manifest.json（服务、镜像标签、文件、校验和、部署文档位置）。
#   拿到 Release 后怎么更新线上服务：docs/deployment/RELEASE_AND_DEPLOY.md
#
# 这里不跑测试，只打包。Release 里的文件不占 Actions 产物额度。推送代码或标签不会触发构建。
on:
  workflow_dispatch:
    inputs:
      windows:
        description: 打包 Windows x64 安装包并上传到客户端 Release
        type: boolean
        default: true
      macos:
        description: 打包 macOS aarch64 dmg 并上传到客户端 Release
        type: boolean
        default: true
      android:
        description: 打包小伴手机 App 的 Android APK 并上传到客户端 Release
        type: boolean
        default: true
      servers:
        description: 要打包的服务端镜像（编号逗号分隔，或 all；留空不打包）。可选 account、ai、forum、link、market、resource、wallpaper-collect
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  # 打不同东西的运行互不取消；完全相同的重复运行才会取消前一个。
  group: build-xiaoban-${{ github.ref }}-${{ inputs.windows }}-${{ inputs.macos }}-${{ inputs.android }}-${{ inputs.servers }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.plan.outputs.client }}
      servers: ${{ steps.plan.outputs.servers }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SERVERS: ${{ inputs.servers }}
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          ANDROID: ${{ inputs.android }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          services = json.load(open("infra/images/services.json", encoding="utf-8"))["services"]
          known = [s["id"] for s in services]
          raw = [x for x in re.split(r"[,\s]+", os.environ.get("SERVERS", "").strip().lower()) if x]
          picked = known if "all" in raw else raw
          bad = [x for x in picked if x not in known]
          if bad:
              print(f"::error::不认识的服务编号：{', '.join(bad)}。可选：{', '.join(known)}、all")
              sys.exit(1)
          picked = [x for x in known if x in picked]  # 去重并按清单顺序
          client = any(os.environ.get(k) == "true" for k in ("WINDOWS", "MACOS", "ANDROID"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"client={'true' if client else 'false'}\n")
              out.write(f"servers={json.dumps(picked)}\n")
          summary = [f"客户端安装包：Windows={os.environ['WINDOWS']}，macOS={os.environ['MACOS']}，Android={os.environ['ANDROID']}", f"服务端镜像：{', '.join(picked) if picked else '无'}"]
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n\n".join(summary) + "\n")
          print("\n".join(summary))
          if not client and not picked:
              print("::error::什么都没选：至少勾选一个客户端平台，或在 servers 里填服务编号。")
              sys.exit(1)
          PY

  release:
    name: Prepare client release
    needs: plan
    if: ${{ needs.plan.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./client/xiaoban-desktop-wallpaper/src-tauri/tauri.conf.json').version")
          tag="xiaoban-wallpaper-v$version"
          if ! gh release view "$tag" -R "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GH_REPO" --target "$GITHUB_SHA" --title "小伴 $version" \
              --notes "小伴 $version：Windows x64 一键安装版（NSIS，当前用户目录）、macOS aarch64 dmg（固定自签名证书，未公证）、Android APK（小伴手机 App）。"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64 · NSIS installer
    needs: [plan, release]
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Verify NSIS-only one-click release contract
        run: npm run test:windows:installer
      - name: Verify Computer Use platform selection
        run: npm run test:computer-use
      - name: Build one-click user installer
        run: npm run desktop:windows:build
      - name: Verify bundled Windows x64 engine
        run: node ../../libs/agent-tools/computer-use/scripts/prepare-runtime.mjs --check --target x86_64-pc-windows-msvc --output src-tauri/resources/computer-use
      - name: Package one-click installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one NSIS setup.exe, found $($packages.Count)." }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $packages[0].FullName "out/XiaoBan-Setup-$version-Windows-x64.exe"
          Get-ChildItem out | Format-Table Name, Length
      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Re-running an existing release must not leave the old portable EXE side by side.
          $assets = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect existing release assets." }
          if (@($assets | Where-Object { $_.name -eq "XiaoBanWallpaper-$version-Windows-x64.exe" }).Count -gt 0) {
            gh release delete-asset $env:TAG "XiaoBanWallpaper-$version-Windows-x64.exe" --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove previous portable asset." }
          }
          gh release upload $env:TAG (Get-ChildItem out).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows installer." }

  macos-aarch64:
    name: macOS aarch64
    needs: [plan, release]
    if: ${{ inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate custom DMG instructions
        run: npm run test:macos:dmg
      - name: Verify Computer Use platform selection
        run: npm run test:computer-use
      # Use one unchanged certificate across releases so TCC can compare a stable signing requirement.
      # No Apple Developer ID or notarization; Gatekeeper will still require user approval.
      - name: Import persistent self-signed signing identity
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$GITHUB_WORKSPACE/.github/signing"
          p12="$RUNNER_TEMP/xiaban-signing.p12"
          cert_raw="$RUNNER_TEMP/xiaban-signing-raw.pem"
          cert="$RUNNER_TEMP/xiaban-signing.pem"
          keychain="$RUNNER_TEMP/xiaban-signing.keychain-db"
          password="$(cat "$signing_dir/macos-xiaoban.p12.password")"
          keychain_password="$(openssl rand -hex 24)"

          echo "Preparing persistent signing certificate"
          base64 --decode -i "$signing_dir/macos-xiaoban.p12.base64" -o "$p12"
          openssl pkcs12 -in "$p12" -passin "pass:$password" -nokeys -clcerts -out "$cert_raw"
          openssl x509 -in "$cert_raw" -out "$cert"

          echo "Creating and unlocking temporary build keychain"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "Importing signing identity and granting codesign key access"
          security import "$p12" -k "$keychain" -P "$password" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          # This certificate is self-signed: trustAsRoot only applies to non-self-signed certificates.
          # User-domain trust opens an authentication dialog and hangs unattended runners.
          # Use admin-domain code-signing trust only on this ephemeral runner; fail if sudo needs input.
          echo "Trusting certificate for code signing without interactive authentication"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$cert"

          echo "Checking signing identity and non-interactive private-key access"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/XiangBan Self-Signed Code Signing 2026/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::Persistent code signing identity is unavailable; refusing to publish an ad-hoc build."
            exit 1
          fi
          probe="$RUNNER_TEMP/xiaban-signing-probe"
          cp /usr/bin/true "$probe"
          codesign --force --timestamp=none --keychain "$keychain" --sign "$identity" "$probe"
          codesign --verify --strict "$probe"
          rm -f "$probe"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Persistent signing identity is ready"

      - name: Build app and dmg
        # tauri.macos.conf.json -> beforeBundleCommand runs the Swift AppKit renderer.
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify custom DMG guide and disk image
        shell: bash
        run: |
          set -euo pipefail
          background="src-tauri/dmg/background.png"
          test -s "$background"
          sips -g pixelWidth -g pixelHeight "$background"
          sips -g pixelWidth "$background" | grep -q 'pixelWidth: 760'
          sips -g pixelHeight "$background" | grep -q 'pixelHeight: 440'
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

      - name: Verify stable macOS signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          node ../../libs/agent-tools/computer-use/scripts/prepare-runtime.mjs --check --target aarch64-apple-darwin --output "$app/Contents/Resources/agent-tools/computer-use"
          engine="$app/Contents/Resources/agent-tools/computer-use/Open Computer Use.app"
          engine_signature="$(codesign -dv --verbose=4 "$engine" 2>&1)"
          printf '%s\n' "$engine_signature" | grep -F 'Authority=XiangBan Self-Signed Code Signing 2026'
          codesign --verify --deep --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -F 'Authority=XiangBan Self-Signed Code Signing 2026'
          requirement="$(codesign -dr - "$app" 2>&1)"
          printf '%s\n' "$requirement"
          if printf '%s\n' "$requirement" | grep -q 'cdhash'; then
            echo "::error::Code signature still has a version-specific cdhash requirement."
            exit 1
          fi
      - name: Package
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/XiaoBanWallpaper-$version-MacOS-aarch64.dmg"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber

  android:
    name: Android · 小伴手机 App
    needs: [plan, release]
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client/xiaoban-multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner ships an Android SDK; accepting its licences lets the Android Gradle plugin download the compile SDK it needs.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$sdkmanager" --licenses > /dev/null || true
          echo "Using $sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      # 手机里的智能体内核（libs/agent-mobile，Rust）：编成 arm64-v8a 的 libagent_mobile.so（手机只支持 64 位 ARM），放进 App 的 jniLibs 一起打包。
      # 网络请求交给 App，所以库里没有 TLS，不依赖 OpenSSL；用 Runner 自带的 NDK。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/agent-mobile
      - name: Install cargo-ndk
        working-directory: .
        run: cargo install cargo-ndk --locked
      - name: Build the agent library
        working-directory: libs/agent-mobile
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk-bundle}}"
          echo "Using NDK $ANDROID_NDK_HOME"
          cargo ndk -P 24 -t arm64-v8a -o "$GITHUB_WORKSPACE/client/xiaoban-multiplatform/androidApp/src/main/jniLibs" build --release --lib
          find "$GITHUB_WORKSPACE/client/xiaoban-multiplatform/androidApp/src/main/jniLibs" -name '*.so' -exec ls -l {} \;
      # 手机上本地语音识别（SenseVoice）用的 sherpa-onnx 原生库：从官方发布包下载、校验后放进 jniLibs，只取 JNI 库和 onnxruntime。
      # 版本要和 androidApp 里 com/k2fsa/sherpa/onnx 的 Kotlin 接口、电脑端 tools/xiaoban-infer 用的 sherpa-onnx 一致。
      - name: Fetch sherpa-onnx native libraries
        env:
          SHERPA_VERSION: v1.13.8
          SHERPA_SHA256: 2ff63469a71cb6009aa2e3ed5f4a670f8abdcbe4bb9ffd23776afc792a6b4f44
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sherpa-android.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-android.tar.bz2"
          echo "${SHERPA_SHA256}  $RUNNER_TEMP/sherpa-android.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sherpa"
          tar -xjf "$RUNNER_TEMP/sherpa-android.tar.bz2" -C "$RUNNER_TEMP/sherpa"
          jni="$GITHUB_WORKSPACE/client/xiaoban-multiplatform/androidApp/src/main/jniLibs"
          mkdir -p "$jni/arm64-v8a"
          cp "$RUNNER_TEMP/sherpa/jniLibs/arm64-v8a/libonnxruntime.so" "$RUNNER_TEMP/sherpa/jniLibs/arm64-v8a/libsherpa-onnx-jni.so" "$jni/arm64-v8a/"
          find "$jni" -name 'libsherpa*' -o -name 'libonnxruntime*' | xargs ls -l
      # 配了下面几个密钥就用发布密钥签名；没配就打 debug 包（未签名的 release 包装不上手机）。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::XIAOBAN_ANDROID_KEYSTORE_BASE64 is not set, building an installable debug APK instead of a signed release APK."
          fi
      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XIAOBAN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            ./gradlew :androidApp:assembleRelease --no-configuration-cache
          else
            ./gradlew :androidApp:assembleDebug --no-configuration-cache
          fi
      - name: Package
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName = "\K[^"]+' androidApp/build.gradle.kts)
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then
            apk=$(ls androidApp/build/outputs/apk/release/*.apk | head -1)
            cp "$apk" "out/XiaoBan-$version-Android.apk"
          else
            apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
            cp "$apk" "out/XiaoBan-$version-Android-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # 旧的“小伴壁纸”Android 应用已被小伴手机 App 取代：重跑已有 Release 时把旧文件名的包清掉。
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^XiaoBanWallpaper-.*-Android-arm64-v8a(-unsigned)?\.apk$' | while read -r name; do
            gh release delete-asset "$TAG" "$name" --yes
          done || true
          gh release upload "$TAG" out/* --clobber

  # ───────────── 服务端镜像：单独的 Release，供服务器上拉取更新 ─────────────

  servers:
    name: Server image · ${{ matrix.id }}
    needs: plan
    if: ${{ needs.plan.outputs.servers != '[]' }}
    permissions:
      contents: read
    # Ubuntu 24.04 on purpose: the runtime images are ubuntu:24.04 and the binaries link glibc dynamically.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.servers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Locate the Rust crate
        id: crate
        run: echo "dir=$(python3 -c "import json;print(next((s.get('crate','') for s in json.load(open('infra/images/services.json'))['services'] if s['id']=='${{ matrix.id }}'), ''))")" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: ${{ steps.crate.outputs.dir != '' }}
        with:
          workspaces: ${{ steps.crate.outputs.dir }}
      - name: Check the generated Dockerfiles are up to date
        run: python3 infra/images/gen-dockerfiles.py --check
      - name: Build the image
        run: infra/images/build-image.sh "${{ matrix.id }}" out "$(git rev-parse --short=12 HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.id }}
          path: |
            out/*.tar.gz
            out/*.meta.json
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  server-release:
    name: Publish server release
    needs: [plan, servers]
    if: ${{ needs.servers.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          path: parts
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release
          find parts -type f \( -name '*.tar.gz' \) -exec mv {} release/ \;
          cat parts/*/SHA256SUMS | sort -k2 > release/SHA256SUMS
          sha=$(git rev-parse HEAD)
          tag="server-$(date -u +%Y%m%d-%H%M)-${sha:0:7}"
          python3 - "$tag" "$sha" <<'PY'
          import glob, json, sys
          tag, sha = sys.argv[1:]
          catalogue = {s["id"]: s for s in json.load(open("infra/images/services.json", encoding="utf-8"))["services"]}
          items = []
          for path in sorted(glob.glob("parts/*/*.meta.json")):
              meta = json.load(open(path, encoding="utf-8"))
              info = catalogue[meta["id"]]
              meta.update({"title": info["title"], "port": info.get("port"), "health": info.get("health"), "stack": info.get("stack"), "tagVar": info.get("tagVar"), "doc": info.get("doc")})
              items.append(meta)
          manifest = {"release": tag, "commit": sha, "services": items}
          json.dump(manifest, open("release/manifest.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          lines = [f"服务端镜像，提交 {sha[:7]}。更新线上服务的步骤见 docs/deployment/RELEASE_AND_DEPLOY.md；manifest.json 记录了每个服务的镜像标签、文件和校验和。", ""]
          for m in items:
              lines.append(f"- {m['title']}（{m['id']}）：{m['image']}:{m['tag']}")
          open("release/NOTES.md", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          PY
          gh release create "$tag" -R "$GH_REPO" --target "$sha" --title "服务端镜像 $tag" --notes-file release/NOTES.md release/*.tar.gz release/SHA256SUMS release/manifest.json
          echo "release=$tag" >> "$GITHUB_STEP_SUMMARY"
          # 只留最近 5 个服务端 Release。
          gh release list -R "$GH_REPO" --limit 100 --json tagName,createdAt --jq '[.[] | select(.tagName | startswith("server-"))] | sort_by(.createdAt) | reverse | .[5:][] | .tagName' |
          while read -r old; do
            echo "Deleting old server release: $old"
            gh release delete "$old" -R "$GH_REPO" --yes --cleanup-tag
          done

  cleanup-history:
    name: Keep latest 2 runs
    needs: [plan, release, windows-x64, macos-aarch64, android, servers, server-release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/$GH_REPO/actions/workflows/build-xiaoban-wallpaper.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .created_at] | @tsv' |
          sort -k3,3r |
          awk 'NR > 2 && $2 == "completed" { print $1 }' |
          while read -r run_id; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting run: $run_id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$run_id"
            fi
          done

