name: BuildXiaoBanWallpaper

# Packages 小伴壁纸 for Windows x64, macOS aarch64 and Android arm64-v8a and attaches them to the GitHub Release
# xiaoban-wallpaper-v<version> (created if missing, files replaced on a re-run). Release files do not count against
# the Actions artifact storage quota. Run it manually from the Actions tab; pushing a tag does not trigger a build.
#
# The same run can also package the phone-link pieces (tick the boxes when starting it):
#   package_android_app  the Android debug APK of the Compose app (artifact xiaoban-android-debug-apk), installable by
#                        sideloading for the real-device test
#   package_server_link  the server-link deployment image (artifact xiangban-link-image-<commit>, a .tar.gz built on
#                        Ubuntu 24.04), see docs/deployment/LINK_DEPLOYMENT.md
# Without any box ticked the run behaves exactly as before: only the release packages are built. Untick
# build_release to build just the ticked packages, without touching the release. No tests run here.
on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 打包并上传 Windows / macOS / Android 安装包到 Release
        type: boolean
        default: true
      package_android_app:
        description: 打包小伴多端 App 的 Android 调试包（产物 xiaoban-android-debug-apk）
        type: boolean
        default: false
      package_server_link:
        description: 打包互联中转 server-link 的部署镜像（产物 xiangban-link-image-<提交>）
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # A release build and a packages-only run must not cancel each other.
  group: build-xiaoban-wallpaper-${{ github.ref }}-${{ inputs.build_release }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare release
    if: ${{ inputs.build_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./client/xiaoban-desktop-wallpaper/src-tauri/tauri.conf.json').version")
          tag="xiaoban-wallpaper-v$version"
          if ! gh release view "$tag" -R "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GH_REPO" --target "$GITHUB_SHA" --title "小伴壁纸 $version" \
              --notes "小伴壁纸 $version：Windows x64 一键安装版（NSIS，当前用户目录）、macOS aarch64 dmg（固定自签名证书，未公证）、Android arm64-v8a APK。"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64 · NSIS installer
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Verify NSIS-only one-click release contract
        run: npm run test:windows:installer
      - name: Verify Computer Use platform selection
        run: npm run test:computer-use
      - name: Build one-click user installer
        run: npm run desktop:windows:build
      - name: Verify bundled Windows x64 engine
        run: node ../../libs/agent-tools/computer-use/scripts/prepare-runtime.mjs --check --target x86_64-pc-windows-msvc --output src-tauri/resources/computer-use
      - name: Package one-click installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one NSIS setup.exe, found $($packages.Count)." }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $packages[0].FullName "out/XiaoBan-Setup-$version-Windows-x64.exe"
          Get-ChildItem out | Format-Table Name, Length
      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Re-running an existing release must not leave the old portable EXE side by side.
          $assets = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to inspect existing release assets." }
          if (@($assets | Where-Object { $_.name -eq "XiaoBanWallpaper-$version-Windows-x64.exe" }).Count -gt 0) {
            gh release delete-asset $env:TAG "XiaoBanWallpaper-$version-Windows-x64.exe" --yes
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove previous portable asset." }
          }
          gh release upload $env:TAG (Get-ChildItem out).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows installer." }

  macos-aarch64:
    name: macOS aarch64
    needs: release
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Validate custom DMG instructions
        run: npm run test:macos:dmg
      - name: Verify Computer Use platform selection
        run: npm run test:computer-use
      # Use one unchanged certificate across releases so TCC can compare a stable signing requirement.
      # No Apple Developer ID or notarization; Gatekeeper will still require user approval.
      - name: Import persistent self-signed signing identity
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$GITHUB_WORKSPACE/.github/signing"
          p12="$RUNNER_TEMP/xiaban-signing.p12"
          cert_raw="$RUNNER_TEMP/xiaban-signing-raw.pem"
          cert="$RUNNER_TEMP/xiaban-signing.pem"
          keychain="$RUNNER_TEMP/xiaban-signing.keychain-db"
          password="$(cat "$signing_dir/macos-xiaoban.p12.password")"
          keychain_password="$(openssl rand -hex 24)"

          echo "Preparing persistent signing certificate"
          base64 --decode -i "$signing_dir/macos-xiaoban.p12.base64" -o "$p12"
          openssl pkcs12 -in "$p12" -passin "pass:$password" -nokeys -clcerts -out "$cert_raw"
          openssl x509 -in "$cert_raw" -out "$cert"

          echo "Creating and unlocking temporary build keychain"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "Importing signing identity and granting codesign key access"
          security import "$p12" -k "$keychain" -P "$password" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          # This certificate is self-signed: trustAsRoot only applies to non-self-signed certificates.
          # User-domain trust opens an authentication dialog and hangs unattended runners.
          # Use admin-domain code-signing trust only on this ephemeral runner; fail if sudo needs input.
          echo "Trusting certificate for code signing without interactive authentication"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$cert"

          echo "Checking signing identity and non-interactive private-key access"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/XiangBan Self-Signed Code Signing 2026/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::Persistent code signing identity is unavailable; refusing to publish an ad-hoc build."
            exit 1
          fi
          probe="$RUNNER_TEMP/xiaban-signing-probe"
          cp /usr/bin/true "$probe"
          codesign --force --timestamp=none --keychain "$keychain" --sign "$identity" "$probe"
          codesign --verify --strict "$probe"
          rm -f "$probe"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Persistent signing identity is ready"

      - name: Build app and dmg
        # tauri.macos.conf.json -> beforeBundleCommand runs the Swift AppKit renderer.
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify custom DMG guide and disk image
        shell: bash
        run: |
          set -euo pipefail
          background="src-tauri/dmg/background.png"
          test -s "$background"
          sips -g pixelWidth -g pixelHeight "$background"
          sips -g pixelWidth "$background" | grep -q 'pixelWidth: 760'
          sips -g pixelHeight "$background" | grep -q 'pixelHeight: 440'
          dmg="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"

      - name: Verify stable macOS signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          node ../../libs/agent-tools/computer-use/scripts/prepare-runtime.mjs --check --target aarch64-apple-darwin --output "$app/Contents/Resources/agent-tools/computer-use"
          engine="$app/Contents/Resources/agent-tools/computer-use/Open Computer Use.app"
          engine_signature="$(codesign -dv --verbose=4 "$engine" 2>&1)"
          printf '%s\n' "$engine_signature" | grep -F 'Authority=XiangBan Self-Signed Code Signing 2026'
          codesign --verify --deep --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -F 'Authority=XiangBan Self-Signed Code Signing 2026'
          requirement="$(codesign -dr - "$app" 2>&1)"
          printf '%s\n' "$requirement"
          if printf '%s\n' "$requirement" | grep -q 'cdhash'; then
            echo "::error::Code signature still has a version-specific cdhash requirement."
            exit 1
          fi
      - name: Package
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/XiaoBanWallpaper-$version-MacOS-aarch64.dmg"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber

  android-arm64-v8a:
    name: Android arm64-v8a
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-mobile-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner ships an Android SDK; accepting its licences lets the Android Gradle plugin download the compile SDK it needs.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$sdkmanager" --licenses > /dev/null || true
          echo "Using $sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      # Optional: with the four secrets below the APK is signed with the release key; without them it is unsigned.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::XIAOBAN_ANDROID_KEYSTORE_BASE64 is not set, the APK will be unsigned."
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XIAOBAN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache
      - name: Package
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a-unsigned.apk" ;;
              *) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a.apk" ;;
            esac
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber
  # ───────────── Phone-link packages beyond the wallpaper release ─────────────

  android-app:
    name: Android app (Compose) · debug APK
    if: ${{ inputs.package_android_app }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client/xiaoban-multiplatform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner ships an Android SDK; accepting its licences lets the Android Gradle plugin download the compile SDK it needs.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$sdkmanager" --licenses > /dev/null || true
          echo "Using $sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android debug APK
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoban-android-debug-apk
          path: client/xiaoban-multiplatform/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  server-link-package:
    name: server-link deployment image
    if: ${{ inputs.package_server_link }}
    permissions:
      contents: read
    # Ubuntu 24.04 on purpose: the runtime image is ubuntu:24.04 and the binary links glibc dynamically.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/server-link
      - name: Build the release binary
        run: cargo build --release --locked --manifest-path services/server-link/Cargo.toml
      - name: Build and save the image
        run: |
          set -euo pipefail
          tag=$(git rev-parse --short=12 HEAD)
          staging=$(mktemp -d)
          cp services/server-link/target/release/server-link "$staging/server-link"
          docker build -f services/server-link/Dockerfile -t "xiangban-link:$tag" "$staging"
          mkdir -p out
          docker save "xiangban-link:$tag" | gzip > "out/xiangban-link-$tag.tar.gz"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: xiangban-link-image-${{ env.IMAGE_TAG }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  cleanup-history:
    name: Keep latest 2 runs
    needs: [release, windows-x64, macos-aarch64, android-arm64-v8a, android-app, server-link-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/$GH_REPO/actions/workflows/build-xiaoban-wallpaper.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .created_at] | @tsv' |
          sort -k3,3r |
          awk 'NR > 2 && $2 == "completed" { print $1 }' |
          while read -r run_id; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting run: $run_id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$run_id"
            fi
          done

