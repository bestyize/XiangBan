name: BuildXiaoBanWallpaper

# Packages 小伴壁纸 for Windows x64, macOS aarch64 and Android arm64-v8a and attaches them to the GitHub Release
# xiaoban-wallpaper-v<version> (created if missing, files replaced on a re-run). Release files do not count against
# the Actions artifact storage quota. Run it from the Actions tab, or push a tag such as xiaoban-wallpaper-v1.0.0.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-xiaoban-wallpaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./client/xiaoban-desktop-wallpaper/src-tauri/tauri.conf.json').version")
          tag="xiaoban-wallpaper-v$version"
          if ! gh release view "$tag" -R "$GH_REPO" > /dev/null 2>&1; then
            gh release create "$tag" -R "$GH_REPO" --target "$GITHUB_SHA" --title "小伴壁纸 $version" \
              --notes "小伴壁纸 $version：Windows x64 一键安装版（NSIS，当前用户目录）、macOS aarch64 dmg（固定自签名证书，未公证）、Android arm64-v8a APK。"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows-x64:
    name: Windows x64 · NSIS installer
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build one-click user installer
        run: npm run desktop:windows:build
      - name: Package one-click installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one NSIS setup.exe, found $($packages.Count)." }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $packages[0].FullName "out/XiaoBan-Setup-$version-Windows-x64.exe"
          Get-ChildItem out | Format-Table Name, Length
      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # Re-running an existing release must not leave the old portable EXE side by side.
          gh release delete-asset $env:TAG "XiaoBanWallpaper-$version-Windows-x64.exe" -y 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous portable asset to remove." }
          gh release upload $env:TAG (Get-ChildItem out).FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload Windows installer." }

  macos-aarch64:
    name: macOS aarch64
    needs: release
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      # Use one unchanged certificate across releases so TCC can compare a stable signing requirement.
      # No Apple Developer ID or notarization; Gatekeeper will still require user approval.
      - name: Import persistent self-signed signing identity
        shell: bash
        run: |
          set -euo pipefail
          signing_dir="$GITHUB_WORKSPACE/.github/signing"
          p12="$RUNNER_TEMP/xiaban-signing.p12"
          cert_raw="$RUNNER_TEMP/xiaban-signing-raw.pem"
          cert="$RUNNER_TEMP/xiaban-signing.pem"
          keychain="$RUNNER_TEMP/xiaban-signing.keychain-db"
          password="$(cat "$signing_dir/macos-xiaoban.p12.password")"
          keychain_password="$(openssl rand -hex 24)"

          base64 --decode -i "$signing_dir/macos-xiaoban.p12.base64" -o "$p12"
          openssl pkcs12 -in "$p12" -passin "pass:$password" -nokeys -clcerts -out "$cert_raw"
          openssl x509 -in "$cert_raw" -out "$cert"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$password" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          # Trust only on this ephemeral CI machine; end users must not install this as a system root.
          security add-trusted-cert -r trustAsRoot -k "$keychain" "$cert"

          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/XiangBan Self-Signed Code Signing 2026/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::Persistent code signing identity is unavailable; refusing to publish an ad-hoc build."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app and dmg
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify stable macOS signature
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature" | grep -F 'Authority=XiangBan Self-Signed Code Signing 2026'
          requirement="$(codesign -dr - "$app" 2>&1)"
          printf '%s\n' "$requirement"
          if printf '%s\n' "$requirement" | grep -q 'cdhash'; then
            echo "::error::Code signature still has a version-specific cdhash requirement."
            exit 1
          fi
      - name: Package
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/XiaoBanWallpaper-$version-MacOS-aarch64.dmg"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber

  android-arm64-v8a:
    name: Android arm64-v8a
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-mobile-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The runner ships an Android SDK; accepting its licences lets the Android Gradle plugin download the compile SDK it needs.
      - name: Accept Android SDK licences
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$sdkmanager" --licenses > /dev/null || true
          echo "Using $sdkmanager"
      - uses: gradle/actions/setup-gradle@v4
      # Optional: with the four secrets below the APK is signed with the release key; without them it is unsigned.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::XIAOBAN_ANDROID_KEYSTORE_BASE64 is not set, the APK will be unsigned."
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XIAOBAN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache
      - name: Package
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a-unsigned.apk" ;;
              *) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a.apk" ;;
            esac
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" out/* --clobber
  
  cleanup-history:
    name: Keep latest 2 runs
    needs: [release, windows-x64, macos-aarch64, android-arm64-v8a]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Delete older workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          gh api --paginate \
            "repos/$GH_REPO/actions/workflows/build-xiaoban-wallpaper.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .created_at] | @tsv' |
          sort -k3,3r |
          awk 'NR > 2 && $2 == "completed" { print $1 }' |
          while read -r run_id; do
            if [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting run: $run_id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$run_id"
            fi
          done

