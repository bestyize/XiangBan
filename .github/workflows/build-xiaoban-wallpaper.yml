name: BuildXiaoBanWallpaper

# Packages 小伴壁纸 for Windows x64, macOS aarch64 and Android arm64-v8a.
# Run it from the Actions tab, or push a tag such as xiaoban-wallpaper-v1.0.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'xiaoban-wallpaper-v*'

permissions:
  contents: read

concurrency:
  group: build-xiaoban-wallpaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Build portable app
        run: npm run desktop:build
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/xiaoban-desktop-wallpaper.exe "out/XiaoBanWallpaper-$version-Windows-x64.exe"
          Compress-Archive -LiteralPath "out/XiaoBanWallpaper-$version-Windows-x64.exe" -DestinationPath "out/XiaoBanWallpaper-$version-Windows-x64.zip"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBanWallpaper-WindowsX64
          path: client/xiaoban-desktop-wallpaper/out/*
          if-no-files-found: error
          retention-days: 30

  macos-aarch64:
    name: macOS aarch64
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop-wallpaper/src-tauri
      - name: Install dependencies
        run: npm ci
      # Ad-hoc signed (signingIdentity "-" in tauri.macos.conf.json); not notarized.
      - name: Build app and dmg
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Package
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          mkdir -p out
          cp "$bundle"/dmg/*.dmg "out/XiaoBanWallpaper-$version-MacOS-aarch64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$bundle/macos/小伴.app" "out/XiaoBanWallpaper-$version-MacOS-aarch64.app.zip"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBanWallpaper-MacOS-aarch64
          path: client/xiaoban-desktop-wallpaper/out/*
          if-no-files-found: error
          retention-days: 30

  android-arm64-v8a:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client/xiaoban-mobile-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Accepts the SDK licences so the Android Gradle plugin can fetch the compile SDK it needs.
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # Optional: with the four secrets below the APK is signed with the release key; without them it is unsigned.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key."
          else
            echo "::warning::XIAOBAN_ANDROID_KEYSTORE_BASE64 is not set, the APK will be unsigned."
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.XIAOBAN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.XIAOBAN_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache
      - name: Package
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          for apk in app/build/outputs/apk/release/*.apk; do
            case "$apk" in
              *-unsigned.apk) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a-unsigned.apk" ;;
              *) cp "$apk" "out/XiaoBanWallpaper-$version-Android-arm64-v8a.apk" ;;
            esac
          done
          rm -f "$RUNNER_TEMP/release.jks"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoBanWallpaper-Android-arm64-v8a
          path: client/xiaoban-mobile-wallpaper/out/*
          if-no-files-found: error
          retention-days: 30
