name: BuildXiaoBanInfer

# Builds xiaoban-infer, 小伴桌面's local inference engine (speech recognition, turn detection, …), for macOS arm64 and
# Windows x64 and uploads each as an artifact. Publishing stays manual: upload the files to ModelScope as described in
# tools/xiaoban-infer/README.md. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            binary: xiaoban-infer
            published: xiaoban-infer-macos-arm64
          - os: windows-latest
            binary: xiaoban-infer.exe
            published: xiaoban-infer.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/xiaoban-infer
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - name: Name the file as the app downloads it
        run: |
          mkdir -p ../../out
          cp "target/release/${{ matrix.binary }}" "../../out/${{ matrix.published }}"
          cd ../../out && (shasum -a 256 "${{ matrix.published }}" || sha256sum "${{ matrix.published }}") | tee "${{ matrix.published }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.published }}
          path: out/
          retention-days: 14
