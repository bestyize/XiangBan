name: Wallpaper website and desktop API
on:
  pull_request:
    paths: ['services/server-xiangban-wallpaper/**', '.github/workflows/xiangban-wallpaper-site.yml']
  push:
    branches: [main]
    paths: ['services/server-xiangban-wallpaper/**', '.github/workflows/xiangban-wallpaper-site.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wallpaper_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d wallpaper_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-test-password@127.0.0.1:5432/wallpaper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/server-xiangban-wallpaper/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/server-xiangban-wallpaper
      - run: npm ci && npm run build
        working-directory: services/server-xiangban-wallpaper/web
      - run: cargo test --locked && cargo build --release --locked
        working-directory: services/server-xiangban-wallpaper
      - run: python3 tools/check-layout.py
