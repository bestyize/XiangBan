name: Agent Stage II Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Agent Learning
        run: cargo test --manifest-path libs/agent-learning/Cargo.toml
      - name: Test Skill Discovery
        run: cargo test --manifest-path libs/agent-tools/skill-discovery/Cargo.toml
  desktop:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile desktop Rust tests
        run: cargo test --manifest-path client/xiaoban-desktop-wallpaper/src-tauri/Cargo.toml --no-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-cargo-lock
          path: client/xiaoban-desktop-wallpaper/src-tauri/Cargo.lock
