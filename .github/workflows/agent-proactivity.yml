name: Agent Proactivity

on:
  workflow_dispatch:

jobs:
  library-tests:
    name: Rust policy unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/agent-proactivity
      - run: cargo test --manifest-path libs/agent-proactivity/Cargo.toml
