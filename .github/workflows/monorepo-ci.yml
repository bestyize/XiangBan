name: Monorepo checks

on:
  pull_request:
    paths:
      - 'client/xiaban-web/**'
      - 'services/xiaban-api/**'
      - 'infra/**'
      - 'docs/**'
      - 'tools/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/deploy.yml'
      - '*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/monorepo-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check navigation and project boundaries
        run: python3 tools/check-layout.py
      - name: Validate deployment configuration
        env:
          XIABAN_DOMAIN: xiaban.example.test
          DATABASE_PASSWORD: ci-test-password
          JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
        run: |
          docker compose -p xiaban --file infra/compose.yaml config --quiet
          docker compose -p xiaban --file infra/compose.yaml --file infra/deploy/compose.vmware-prebuilt.yaml config --quiet
      - name: Build web deployment image
        run: docker build --tag xiaban-web:ci --file client/xiaban-web/Dockerfile .
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/xiaban-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaban-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xiaban_test
          POSTGRES_USER: xiaban
          POSTGRES_PASSWORD: xiaban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaban -d xiaban_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      XIABAN_REQUIRE_INTEGRATION: 'true'
      XIABAN_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/xiaban_test
      XIABAN_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate contracts, business and distribution
        run: bash ./gradlew :api-contracts:jvmTest :backend:test :backend:installDist --no-daemon
      - name: Verify renamed distribution entrypoint
        run: test -x services/xiaban-api/backend/build/install/backend/bin/backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: |
            services/xiaban-api/api-contracts/build/test-results/**/*.xml
            services/xiaban-api/backend/build/test-results/**/*.xml
          if-no-files-found: warn
