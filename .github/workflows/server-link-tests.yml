name: Server Link Tests

# server-link (phone <-> desktop relay): unit tests plus the integration tests against a real PostgreSQL, including the
# hostile WebSocket cases. Manual only, as every workflow in this repository (see CLAUDE.md): run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      package:
        description: 测试通过后，在 Ubuntu 24.04 上打包部署镜像（xiangban-link-<提交>.tar.gz，见 docs/deployment/LINK_DEPLOYMENT.md）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: server-link cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xiaban
          POSTGRES_PASSWORD: xiaban
          POSTGRES_DB: xiaoban_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://xiaban:xiaban@localhost:5432/xiaoban_link
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/server-link
      - name: Test
        run: cargo test --manifest-path services/server-link/Cargo.toml --no-fail-fast
      - name: Release build (unwind, no panic=abort)
        run: cargo build --release --manifest-path services/server-link/Cargo.toml

  package:
    name: Package the deployment image
    if: ${{ inputs.package }}
    needs: test
    # Ubuntu 24.04 on purpose: the runtime image is ubuntu:24.04 and the binary links glibc dynamically.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/server-link
      - name: Build the release binary
        run: cargo build --release --locked --manifest-path services/server-link/Cargo.toml
      - name: Build and save the image
        run: |
          set -euo pipefail
          tag=$(git rev-parse --short=12 HEAD)
          staging=$(mktemp -d)
          cp services/server-link/target/release/server-link "$staging/server-link"
          docker build -f services/server-link/Dockerfile -t "xiangban-link:$tag" "$staging"
          mkdir -p out
          docker save "xiangban-link:$tag" | gzip > "out/xiangban-link-$tag.tar.gz"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: xiangban-link-image-${{ env.IMAGE_TAG }}
          path: out/*.tar.gz
          if-no-files-found: error
          retention-days: 14
