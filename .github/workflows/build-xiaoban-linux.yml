name: 小伴桌面 Linux
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Linux x86_64 · Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: client/xiaoban-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/xiaoban-desktop/src-tauri
      - name: Install GTK and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev dbus-x11 desktop-file-utils xvfb xauth weston
      - run: npm ci
      - run: npm run desktop:linux:build
      - name: Install and launch the packaged workbench on X11
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          desktop-file-validate /usr/share/applications/xiaoban-desktop.desktop
          profile=$(mktemp -d)
          XIAOBAN_TEST_CONFIG_DIR="$profile" XIAOBAN_SMOKE_REPORT="$profile/result.json" \
            dbus-run-session -- xvfb-run -a timeout 90s xiaoban-desktop --smoke-test
          jq -e '.Ok.platform == "linux" and .Ok.nativeSession and .Ok.nativeLibrary' "$profile/result.json"
      - name: Launch the packaged workbench on Wayland
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d) XIAOBAN_TEST_CONFIG_DIR=$(mktemp -d)
          export XIAOBAN_SMOKE_REPORT="$XIAOBAN_TEST_CONFIG_DIR/result.json"
          dbus-run-session -- bash -euc '
            weston --backend=headless --renderer=pixman --shell=kiosk-shell.so --socket=wayland-xiaoban --idle-time=0 > "$XDG_RUNTIME_DIR/weston.log" 2>&1 &
            compositor=$!
            trap "kill $compositor 2>/dev/null || true" EXIT
            for attempt in {1..50}; do
              test -S "$XDG_RUNTIME_DIR/wayland-xiaoban" && break
              kill -0 "$compositor" || { cat "$XDG_RUNTIME_DIR/weston.log"; exit 1; }
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/wayland-xiaoban"
            GDK_BACKEND=wayland WAYLAND_DISPLAY=wayland-xiaoban timeout 90s xiaoban-desktop --smoke-test
          '
          jq -e '.Ok.platform == "linux" and .Ok.nativeSession and .Ok.nativeLibrary' "$XIAOBAN_SMOKE_REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoban-desktop-linux-amd64
          path: client/xiaoban-desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
