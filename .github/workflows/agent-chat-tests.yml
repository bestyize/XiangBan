name: Agent Kernel and Chat UI

# Manual only, as every workflow in this repository (see CLAUDE.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel protocol and reasoning tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/agent-kernel
      - name: Test kernel with both streaming protocols
        run: cargo test --manifest-path libs/agent-kernel/Cargo.toml --features openai,anthropic

  chat-ui:
    name: Chat view and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client/xiaoban-desktop-wallpaper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/xiaoban-desktop-wallpaper/package-lock.json
      - run: npm ci
      - name: Type-check Vue chat interface
        run: npx vue-tsc --noEmit
      - name: Test reasoning and chat UI behavior
        run: npx vitest run src/ui/chat/view.test.ts src/ui/chat/replies.test.ts src/ui/pages/ChatPage.test.ts
