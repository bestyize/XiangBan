[package]
name = "xiangban-agent-reliability-checks"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
agent-kernel = { path = "../../libs/agent-kernel", features = ["journal", "openai", "anthropic", "web", "mcp", "shell", "process", "fs", "memory"] }
serde = { version = "1", features = ["derive"] }
