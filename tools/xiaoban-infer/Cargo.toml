[package]
name = "xiaoban-infer"
version = "1.0.0"
edition = "2021"
description = "小伴桌面的本地推理引擎：语音识别（SenseVoice）、判停（Silero VAD / Smart Turn），后续能力按模块加入"

[dependencies]
sherpa-onnx = "=1.13.8"
# Turn detection reuses the onnxruntime that sherpa-onnx links in (alternative-backend: ort links none of its own).
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "alternative-backend"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = false
incremental = false
strip = "debuginfo"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
