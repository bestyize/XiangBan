[package]
name = "xiaoban-asr"
version = "1.0.0"
edition = "2021"
description = "Xiaoban standalone offline ASR companion runtime using SenseVoice"

[dependencies]
sherpa-onnx = "=1.13.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
