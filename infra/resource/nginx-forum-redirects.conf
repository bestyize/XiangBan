# Include inside chat.xiangban.xyz after the resource host has been provisioned.
location = /ideas-catalog.json {
    return 302 https://res.xiangban.xyz/forum-web/ideas-catalog.json;
}

location ~ "^/api/(?<resource_contact>contact/qr/(?:wechat-official|qq-group|wechat-group))$" {
    limit_except GET { deny all; }
    return 302 https://res.xiangban.xyz/forum-content/$resource_contact;
}

location ~ "^/api/(?<resource_public>(?:images|discover/(?:frontier-assets|article-assets)|open-source/assets)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
    limit_except GET { deny all; }
    return 302 https://res.xiangban.xyz/forum-content/$resource_public;
}

location ~ "^/api/images/(?<resource_view>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/view$" {
    limit_except GET { deny all; }
    return 302 https://res.xiangban.xyz/forum-content/images/$resource_view$is_args$args;
}

location ~ "^/(?<resource_static>vendor-logos|open-source-media|open-source-readmes|builtin-pets|ideas-covers|creation-previews)/(?<resource_file>.+)$" {
    limit_except GET { deny all; }
    return 302 https://res.xiangban.xyz/forum-web/$resource_static/$resource_file$is_args$args;
}
