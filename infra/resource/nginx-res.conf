# Include inside the res.xiangban.xyz TLS server block.
# ZIP objects created by the community service remain signed. Public files
# already present in the static root take precedence over the private service.
location = /upload {
    client_max_body_size 105m;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:55020;
}

location = /health {
    proxy_pass http://127.0.0.1:55020;
}

location ^~ /packs/ { proxy_pass http://127.0.0.1:55020; }
location ^~ /covers/ { proxy_pass http://127.0.0.1:55020; }
location ^~ /tool-mirrors/ { proxy_pass http://127.0.0.1:55020; }
location ^~ /internal/forum-image/ {
    client_max_body_size 11m;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Content-Sha256, X-Expiration, X-Signature" always;
        add_header Access-Control-Max-Age 600 always;
        return 204;
    }
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:55021;
}

location ^~ /internal/forum-file/ {
    client_max_body_size 33m;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Content-Sha256, X-Expiration, X-Signature, X-File-Ext" always;
        add_header Access-Control-Max-Age 600 always;
        return 204;
    }
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:55021;
}

location ^~ /forum-files/ {
    limit_req zone=forum_images burst=80 nodelay;
    limit_req_status 429;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:55021;
}

location ^~ /forum-content/ {
    limit_req zone=forum_images burst=80 nodelay;
    limit_req_status 429;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:55021;
}

location ^~ /internal/ {
    proxy_read_timeout 210s;
    proxy_pass http://127.0.0.1:55020;
}

location ^~ /img/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri @xiangban_resource;
}

location ^~ /video/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location /files/ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}

location ~ "^/files/[a-f0-9]{32}\.zip$" {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri @xiangban_resource;
}

location @xiangban_resource {
    proxy_read_timeout 180s;
    proxy_pass http://127.0.0.1:55020;
}
