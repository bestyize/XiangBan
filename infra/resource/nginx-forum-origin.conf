# Include inside chat.xiangban.xyz. Only the resource host may fetch the
# original public image endpoints; the app still checks whether each is public.
location ~ "^/_resource-origin/api/(?<resource_api>(?:images|discover/(?:frontier-assets|article-assets)|open-source/assets)/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
    allow 124.220.64.203;
    deny all;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:55010/api/$resource_api;
}

location ~ "^/_resource-origin/api/(?<resource_contact>contact/qr/(?:wechat-official|qq-group|wechat-group))$" {
    allow 124.220.64.203;
    deny all;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:55010/api/$resource_contact;
}

location ~ "^/_resource-origin/api/images/(?<resource_view_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/view$" {
    allow 124.220.64.203;
    deny all;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:55010/api/images/$resource_view_id/view$is_args$args;
}
