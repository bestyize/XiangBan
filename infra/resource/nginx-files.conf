# Include inside the existing chat.xiangban.xyz HTTPS server block.
# Compatibility for existing links; the resource service runs on res.xiangban.xyz.
location ^~ /files/ {
    client_max_body_size 105m;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host res.xiangban.xyz;
    proxy_pass https://res.xiangban.xyz/community/;
}
