# Include inside the res.xiangban.xyz TLS server block.
location ^~ /idea-players/v1/jiangshan-map/ {
    alias /srv/xiangban-resource/idea-players-v1/jiangshan-map/;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "sandbox allow-scripts; frame-ancestors 'self' https://chat.xiangban.xyz; default-src 'none'; script-src 'unsafe-inline' https://res.xiangban.xyz/idea-players/v1/jiangshan-map/; style-src 'unsafe-inline' https://res.xiangban.xyz/idea-players/v1/jiangshan-map/; img-src data: blob: https://res.xiangban.xyz/idea-players/v1/jiangshan-map/; connect-src https://res.xiangban.xyz/idea-players/v1/jiangshan-map/assets/terrain/index.json; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /idea-players/v1/oil-paint/ {
    alias /srv/xiangban-resource/idea-players-v1/oil-paint/;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Security-Policy, Content-Encoding, ETag, Last-Modified, Server" always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock; frame-ancestors 'self' https://chat.xiangban.xyz; default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://res.xiangban.xyz/idea-players/v1/oil-paint/; style-src 'unsafe-inline' https://res.xiangban.xyz/idea-players/v1/oil-paint/; img-src data: blob: https://res.xiangban.xyz/idea-players/v1/oil-paint/; connect-src data: blob: https://res.xiangban.xyz/idea-players/v1/oil-paint/; worker-src blob:; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /idea-players/v1/ {
    alias /srv/xiangban-resource/idea-players-v1/;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Content-Security-Policy, Content-Encoding, ETag, Last-Modified, Server" always;
    add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock; frame-ancestors 'self' https://chat.xiangban.xyz; default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src data: blob:; worker-src blob:; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location ^~ /gallery-exhibits/ {
    alias /srv/xiangban-resource/gallery-exhibits/;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# The documents carry their own game-specific CSP. The iframe remains opaque.
location ^~ /builtin-games/ {
    alias /srv/xiangban-resource/builtin-games/;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://chat.xiangban.xyz" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

location = /forum-web/ideas-catalog.json {
    alias /srv/xiangban-resource/forum-web/ideas-catalog.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /forum-web/assets/ {
    alias /srv/xiangban-resource/forum-web/assets/;
    disable_symlinks on;
    limit_except GET { deny all; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /forum-web/ {
    alias /srv/xiangban-resource/forum-web/;
    disable_symlinks on;
    limit_except GET { deny all; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# CSS variables in the cross-origin stylesheet resolve root-relative URLs on
# the resource host. Keep those URLs on the same static tree as /forum-web/.
location ~ "^/(?<forum_static_dir>vendor-logos|open-source-media|open-source-readmes|builtin-pets|ideas-covers|creation-previews)/(?<forum_static_file>.+)$" {
    alias /srv/xiangban-resource/forum-web/$forum_static_dir/$forum_static_file;
    disable_symlinks on;
    limit_except GET { deny all; }
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
}
